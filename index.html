                                    </div>
                                )}

                            </div>
                        </div>

                        {/* ========================================== */}
                        {/* --- CENTER VIEWPORT (INTERACTIVE CANVAS) --- */}
                        {/* ========================================== */}
                        <div class="flex-1 flex flex-col justify-between items-center p-4 md:p-6 bg-slate-950 relative overflow-hidden">
                            
                            {/* Interactive helper bar */}
                            <div class="w-full flex flex-col sm:flex-row gap-3 justify-between items-center bg-slate-900/60 border border-slate-800/80 px-4 py-3 rounded-2xl z-10 shadow-lg">
                                <div class="flex items-center gap-3">
                                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                                    {appMode === "chord" ? (
                                        <div class="text-xs">
                                            <span class="text-slate-400">Acorde: </span>
                                            <strong class="text-teal-400 font-extrabold">{detectedChord}</strong>
                                        </div>
                                    ) : (
                                        <div class="text-xs">
                                            <span class="text-slate-400">Modo: </span>
                                            <strong class="text-indigo-400 font-extrabold">{appMode === "scale" ? "Escala Pro" : "Arpegio Pro"}</strong>
                                        </div>
                                    )}
                                </div>

                                {/* AUDIO PLAYBACK INTEGRATION CONTROLLERS */}
                                <div class="flex items-center gap-3 bg-slate-950/80 px-3 py-1.5 rounded-xl border border-slate-800/65 scale-90 sm:scale-100">
                                    <button
                                        onClick={triggerStrumOrSequence}
                                        disabled={isPlayingSequence}
                                        class={`flex items-center gap-1.5 text-xs font-black px-3.5 py-1.5 rounded-lg text-white shadow-md shadow-emerald-600/20 transition-all ${
                                            isPlayingSequence 
                                                ? "bg-slate-800 text-slate-500 cursor-not-allowed opacity-50" 
                                                : "bg-emerald-600 hover:bg-emerald-500 hover:scale-105 active:scale-95"
                                        }`}
                                    >
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5}>
                                            <path strokeLinecap="round" strokeLinejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                                        </svg>
                                        {appMode === "chord" ? "Rasguear Acorde" : "Reproducir Secuencia"}
                                    </button>

                                    <div class="flex items-center gap-1.5">
                                        <span class="text-[9px] text-slate-500 font-bold uppercase">Tempo:</span>
                                        <input
                                            type="range"
                                            min="60"
                                            max="320"
                                            value={strumSpeed}
                                            onChange={(e) => setStrumSpeed(parseInt(e.target.value))}
                                            class="w-12 sm:w-16 accent-emerald-500 h-1 bg-slate-800 rounded-lg cursor-pointer"
                                            title="Intervalo de milisegundos entre notas"
                                        />
                                        <span class="text-[10px] text-emerald-400 font-mono w-9 text-right font-bold">{strumSpeed}ms</span>
                                    </div>
                                </div>

                                <div class="flex items-center gap-2 scale-90">
                                    {appMode === "chord" && (
                                        <div class="flex bg-slate-950 p-0.5 rounded-lg border border-slate-800">
                                            <button
                                                onClick={() => setChordDisplayMode("diagram")}
                                                class={`px-2.5 py-1 rounded text-[10px] font-bold transition-all ${chordDisplayMode === "diagram" ? "bg-slate-850 text-white" : "text-slate-400"}`}
                                            >
                                                Diagrama
                                            </button>
                                            <button
                                                onClick={() => setChordDisplayMode("note")}
                                                class={`px-2.5 py-1 rounded text-[10px] font-bold transition-all ${chordDisplayMode === "note" ? "bg-slate-850 text-white" : "text-slate-400"}`}
                                            >
                                                Notas
                                            </button>
                                            <button
                                                onClick={() => setChordDisplayMode("degree")}
                                                class={`px-2.5 py-1 rounded text-[10px] font-bold transition-all ${chordDisplayMode === "degree" ? "bg-slate-850 text-white" : "text-slate-400"}`}
                                            >
                                                Grados
                                            </button>
                                        </div>
                                    )}
                                    {appMode === "chord" && (
                                        <button
                                            onClick={() => { clearAll(); }}
                                            class="text-[10px] text-red-400 hover:text-red-300 font-bold bg-red-950/20 px-2.5 py-1.5 rounded border border-red-900/30 transition"
                                        >
                                            Vaciar
                                        </button>
                                    )}
                                </div>
                            </div>

                            {/* Contenedor con alineación superior para evitar que se desborde el mástil alto por arriba */}
                            <div class="flex-1 w-full flex items-start justify-center overflow-y-auto max-h-[66vh] md:max-h-[72vh] my-3 scroll-smooth relative">
                                <div class="p-2 sm:p-4 bg-slate-900/20 rounded-3xl border border-slate-900 shadow-inner flex flex-col xl:flex-row items-center xl:items-start justify-center gap-6 w-full">
                                    <svg
                                        id="chord-diagram-svg"
                                        width={width}
                                        height={height}
                                        style={{
                                            backgroundColor: bgStyleColor,
                                            borderRadius: `${DEFAULT_STYLE.fretboardRadius}px`,
                                            fontFamily: fontFamilyStyle,
                                            maxWidth: '100%',
                                            height: 'auto'
                                        }}
                                        viewBox={`0 0 ${width} ${height}`}
                                        class="shadow-2xl transition-all duration-300 shrink-0 select-none"
                                        onTouchMove={handleTouchMove}
                                    >
                                        <rect width={width} height={height} fill={bgStyleColor} rx={DEFAULT_STYLE.fretboardRadius} />

                                        {/* Diagram Title */}
                                        <text
                                            x={width / 2}
                                            y={50}
                                            textAnchor="middle"
                                            fill={textStyleColor}
                                            fontSize={dynamicTitleFontSize}
                                            fontWeight="800"
                                        >
                                            {chordName}
                                        </text>

                                        {/* DIBUJO DINÁMICO DE NÚMEROS DE TRASTE AL COSTADO */}
                                        {Array.from({ length: numFrets }).map((_, idx) => {
                                            const absFret = startingFret + idx;
                                            const isCommon = COMMON_FRETS.includes(absFret);
                                            const isFirst = idx === 0;

                                            if (isCommon || (isFirst && startingFret > 1)) {
                                                const y = fretYPositions[idx] + (fretYPositions[idx + 1] - fretYPositions[idx]) / 2 + 4;
                                                const xPos = fretNumPosition === "left" ? paddingLeft - 22 : width - paddingRight + 22;
                                                const labelText = isCommon ? `${absFret}` : `${startingFret} fr`;

                                                return (
                                                    <text
                                                        key={`fret-marker-${absFret}`}
                                                        x={xPos}
                                                        y={y}
                                                        fill={textStyleColor}
                                                        fontSize="13"
                                                        fontWeight="bold"
                                                        textAnchor="middle"
                                                        opacity={isCommon ? "1" : "0.6"}
                                                    >
                                                        {labelText}
                                                    </text>
                                                );
                                            }
                                            return null;
                                        })}

                                        {/* Tuning Notes letters along top */}
                                        {tuning.slice(0, numStrings).map((note, idx) => {
                                            const x = paddingLeft + idx * stringSpacing;
                                            return (
                                                <text
                                                    key={idx}
                                                    x={x}
                                                    y={paddingTop - 45}
                                                    textAnchor="middle"
                                                    fill={textStyleColor}
                                                    fontSize="12"
                                                    fontWeight="bold"
                                                >
                                                    {note}
                                                </text>
                                            );
                                        })}

                                        {/* PULSE HALO ANILLO AUDIO - Destello visual reactivo */}
                                        {notePulse && (
                                            <circle
                                                cx={paddingLeft + notePulse.s * stringSpacing}
                                                cy={notePulse.f === 0 ? (paddingTop - 20) : (fretYPositions[notePulse.f - 1] + (fretYPositions[notePulse.f] - fretYPositions[notePulse.f - 1]) / 2)}
                                                fill="none"
                                                stroke={getIntervalColor("1")} 
                                                strokeWidth="1.5"
                                                class="audio-pulse-ring"
                                            />
                                        )}

                                        {/* GESTURE PREVIEW: Previsualización de arrastre de cejilla interactiva */}
                                        {dragStart && dragCurrent && dragStart.f === dragCurrent.f && dragStart.s !== dragCurrent.s && (
                                            <g>
                                                <rect
                                                    x={(paddingLeft + Math.min(dragStart.s, dragCurrent.s) * stringSpacing) - dotRadiusStyle}
                                                    y={(fretYPositions[dragStart.f - 1] + (fretYPositions[dragStart.f] - fretYPositions[dragStart.f - 1]) / 2) - dotRadiusStyle}
                                                    width={Math.abs(dragCurrent.s - dragStart.s) * stringSpacing + dotRadiusStyle * 2}
                                                    height={dotRadiusStyle * 2}
                                                    rx={dotRadiusStyle}
                                                    fill={baseFingerStyleColor}
                                                    opacity="0.5"
                                                    stroke={textStyleColor}
                                                    strokeWidth="1"
                                                />
                                            </g>
                                        )}

                                        {/* OPEN STRINGS AT FRET 0 DISPLAY */}
                                        {appMode === "scale" ? (
                                            generateScaleOpenNotes().map((openNote, idx) => {
                                                const x = paddingLeft + openNote.s * stringSpacing;
                                                const y = paddingTop - 20;
                                                const dotColor = getIntervalColor(openNote.degreeStr);

                                                return (
                                                    <g key={idx} style={{ cursor: 'pointer' }} onClick={() => playSingleNoteAudio(openNote.s, 0)}>
                                                        <circle
                                                            cx={x}
                                                            cy={y}
                                                            r={dotRadiusStyle - 1}
                                                            fill={dotColor}
                                                        />
                                                        <text
                                                            x={x}
                                                            y={y + 3.5}
                                                            textAnchor="middle"
                                                            fill={DEFAULT_STYLE.dotTextColor}
                                                            fontSize="9"
                                                            fontWeight="black"
                                                        >
                                                            {openNote.label}
                                                        </text>
                                                    </g>
                                                );
                                            })
                                        ) : appMode === "arpeggio" ? (
                                            generateArpeggioOpenNotes().map((openNote, idx) => {
                                                const x = paddingLeft + openNote.s * stringSpacing;
                                                const y = paddingTop - 20;
                                                const dotColor = getIntervalColor(openNote.degreeStr);

                                                return (
                                                    <g key={idx} style={{ cursor: 'pointer' }} onClick={() => playSingleNoteAudio(openNote.s, 0)}>
                                                        <circle
                                                            cx={x}
                                                            cy={y}
                                                            r={dotRadiusStyle - 1}
                                                            fill={dotColor}
                                                        />
                                                        <text
                                                            x={x}
                                                            y={y + 3.5}
                                                            textAnchor="middle"
                                                            fill={DEFAULT_STYLE.dotTextColor}
                                                            fontSize="9"
                                                            fontWeight="black"
                                                        >
                                                            {openNote.label}
                                                        </text>
                                                    </g>
                                                );
                                            })
                                        ) : (
                                            stringStates.slice(0, numStrings).map((state, idx) => {
                                                const x = paddingLeft + idx * stringSpacing;
                                                const y = paddingTop - 20;

                                                if ((chordDisplayMode === "note" || chordDisplayMode === "degree") && state === "open") {
                                                    const baseSemi = parseNoteToSemi(tuning[idx]) % 12;
                                                    let label = "";
                                                    const relativeSemi = (baseSemi - detectedRootSemi + 12) % 12;
                                                    const degreeStr = INTERVAL_DEGREES[relativeSemi];

                                                    if (chordDisplayMode === "note") {
                                                        label = NOTE_NAMES[baseSemi];
                                                    } else {
                                                        label = degreeStr;
                                                    }
                                                    
                                                    const dotColor = getIntervalColor(degreeStr);

                                                    return (
                                                        <g key={idx} style={{ cursor: 'pointer' }} onClick={() => { playSingleNoteAudio(idx, 0); toggleStringState(idx); }}>
                                                            <circle cx={x} cy={y} r={dotRadiusStyle - 1} fill={dotColor} />
                                                            <text
                                                                x={x}
                                                                y={y + 3.5}
                                                                textAnchor="middle"
                                                                fill={DEFAULT_STYLE.dotTextColor}
                                                                fontSize="9"
                                                                fontWeight="black"
                                                            >
                                                                {label}
                                                            </text>
                                                        </g>
                                                    );
                                                }

                                                return (
                                                    <g key={idx} style={{ cursor: 'pointer' }} onClick={() => toggleStringState(idx)}>
                                                        {state === "open" && (
                                                            <circle
                                                                cx={x}
                                                                cy={y}
                                                                r="6"
                                                                fill="none"
                                                                stroke={textStyleColor}
                                                                strokeWidth={lineWidthStyle}
                                                            />
                                                        )}
                                                        {state === "muted" && (
                                                            <g>
                                                                <line x1={x - 5} y1={y - 5} x2={x + 5} y2={y + 5} stroke={textStyleColor} strokeWidth={lineWidthStyle} />
                                                                <line x1={x + 5} y1={y - 5} x2={x - 5} y2={y + 5} stroke={textStyleColor} strokeWidth={lineWidthStyle} />
                                                            </g>
                                                        )}
                                                        <rect x={x - 12} y={y - 12} width="24" height="24" fill="transparent" />
                                                    </g>
                                                );
                                            })
                                        )}

                                        {/* Nut line */}
                                        {startingFret === 1 ? (
                                            <rect
                                                x={paddingLeft - lineWidthStyle / 2}
                                                y={paddingTop - 4}
                                                width={gridWidth + lineWidthStyle}
                                                height="6"
                                                fill={textStyleColor}
                                            />
                                        ) : (
                                            <line
                                                x1={paddingLeft}
                                                y1={paddingTop}
                                                x2={width - paddingRight}
                                                y2={paddingTop}
                                                stroke={gridStyleColor}
                                                strokeWidth={lineWidthStyle}
                                            />
                                        )}

                                        {/* DIBUJO DE INLAYS (Puntos guía de la guitarra) */}
                                        {Array.from({ length: numFrets }).map((_, idx) => {
                                            const absFret = startingFret + idx;
                                            const y = fretYPositions[idx] + (fretYPositions[idx + 1] - fretYPositions[idx]) / 2;
                                            const xCenter = paddingLeft + gridWidth / 2;
                                            
                                            if ([3, 5, 7, 9, 15, 17, 19, 21].includes(absFret)) {
                                                return (
                                                    <circle
                                                        key={`inlay-${absFret}`}
                                                        cx={xCenter}
                                                        cy={y}
                                                        r="4"
                                                        fill={gridStyleColor}
                                                        opacity="0.18"
                                                    />
                                                );
                                            } else if ([12, 24].includes(absFret)) {
                                                return (
                                                    <g key={`inlay-${absFret}`}>
                                                        <circle
                                                            cx={xCenter - 14}
                                                            cy={y}
                                                            r="3"
                                                            fill={gridStyleColor}
                                                            opacity="0.18"
                                                        />
                                                        <circle
                                                            cx={xCenter + 14}
                                                            cy={y}
                                                            r="3"
                                                            fill={gridStyleColor}
                                                            opacity="0.18"
                                                        />
                                                    </g>
                                                );
                                            }
                                            return null;
                                        })}

                                        {/* Horizontal Frets */}
                                        {Array.from({ length: numFrets }).map((_, idx) => {
                                            const y = fretYPositions[idx + 1];
                                            return (
                                                <line
                                                    key={idx}
                                                    x1={paddingLeft}
                                                    y1={y}
                                                    x2={width - paddingRight}
                                                    y2={y}
                                                    stroke={gridStyleColor}
                                                    strokeWidth={lineWidthStyle}
                                                />
                                            );
                                        })}

                                        {/* Vertical Strings */}
                                        {Array.from({ length: numStrings }).map((_, idx) => {
                                            const x = paddingLeft + idx * stringSpacing;
                                            return (
                                                <line
                                                    key={idx}
                                                    x1={x}
                                                    y1={paddingTop}
                                                    x2={x}
                                                    y2={fretYPositions[numFrets]}
                                                    stroke={gridStyleColor}
                                                    strokeWidth={lineWidthStyle}
                                                />
                                            );
                                        })}

                                        {/* SCALE RENDERED DOTS */}
                                        {appMode === "scale" && (
                                            generateScaleRenderDots().map((dot, idx) => {
                                                const x = paddingLeft + dot.s * stringSpacing;
                                                const y = fretYPositions[dot.f - 1] + (fretYPositions[dot.f] - fretYPositions[dot.f - 1]) / 2;
                                                const dotColor = getIntervalColor(dot.degreeStr);

                                                return (
                                                    <g key={idx} style={{ cursor: 'pointer' }} onClick={() => playSingleNoteAudio(dot.s, dot.f)}>
                                                        <circle
                                                            cx={x}
                                                            cy={y}
                                                            r={dotRadiusStyle}
                                                            fill={dotColor}
                                                        />
                                                        <text
                                                            x={x}
                                                            y={y + 4.5}
                                                            textAnchor="middle"
                                                            fill={DEFAULT_STYLE.dotTextColor}
                                                            fontSize="10"
                                                            fontWeight="bold"
                                                        >
                                                            {dot.label}
                                                        </text>
                                                    </g>
                                                );
                                            })
                                        )}

                                        {/* ARPEGGIOS RENDERED DOTS */}
                                        {appMode === "arpeggio" && (
                                            generateArpeggioRenderDots().map((dot, idx) => {
                                                const x = paddingLeft + dot.s * stringSpacing;
                                                const y = fretYPositions[dot.f - 1] + (fretYPositions[dot.f] - fretYPositions[dot.f - 1]) / 2;
                                                const dotColor = getIntervalColor(dot.degreeStr);

                                                return (
                                                    <g key={idx} style={{ cursor: 'pointer' }} onClick={() => playSingleNoteAudio(dot.s, dot.f)}>
                                                        <circle
                                                            cx={x}
                                                            cy={y}
                                                            r={dotRadiusStyle}
                                                            fill={dotColor}
                                                        />
                                                        <text
                                                            x={x}
                                                            y={y + 4.5}
                                                            textAnchor="middle"
                                                            fill={DEFAULT_STYLE.dotTextColor}
                                                            fontSize="10"
                                                            fontWeight="bold"
                                                        >
                                                            {dot.label}
                                                        </text>
                                                    </g>
                                                );
                                            })
                                        )}

                                        {/* CHORD ONLY: Render active dots and barre chords */}
                                        {appMode === "chord" && (
                                            <g>
                                                {/* Barres (Cejillas) */}
                                                {barres.map((barre, idx) => {
                                                    const x1 = paddingLeft + barre.fromString * stringSpacing;
                                                    const x2 = paddingLeft + barre.toString * stringSpacing;
                                                    const y = fretYPositions[barre.fret - 1] + (fretYPositions[barre.fret] - fretYPositions[barre.fret - 1]) / 2;
                                                    return (
                                                        <g key={idx} style={{ cursor: 'pointer' }} onClick={() => removeBarre(idx)}>
                                                            {/* Base pill */}
                                                            <rect
                                                                x={x1 - dotRadiusStyle}
                                                                y={y - dotRadiusStyle}
                                                                width={(barre.toString - barre.fromString) * stringSpacing + dotRadiusStyle * 2}
                                                                height={dotRadiusStyle * 2}
                                                                rx={dotRadiusStyle}
                                                                fill={baseFingerStyleColor}
                                                                opacity={chordDisplayMode === "diagram" ? 1 : 0.4}
                                                            />
                                                            {chordDisplayMode !== "diagram" && (
                                                                Array.from({ length: barre.toString - barre.fromString + 1 }).map((_, step) => {
                                                                    const s = barre.fromString + step;
                                                                    if (dots.some(d => d.s === s)) return null; 

                                                                    const x = paddingLeft + s * stringSpacing;
                                                                    const baseSemi = parseNoteToSemi(tuning[s]);
                                                                    const absFret = startingFret + barre.fret - 1;
                                                                    const pitch = (baseSemi + absFret) % 12;

                                                                    const relativeSemi = (pitch - detectedRootSemi + 12) % 12;
                                                                    const degreeStr = INTERVAL_DEGREES[relativeSemi];

                                                                    let label = "";
                                                                    if (chordDisplayMode === "note") {
                                                                        label = NOTE_NAMES[pitch];
                                                                    } else {
                                                                        label = degreeStr;
                                                                    }

                                                                    const dotColor = getIntervalColor(degreeStr);

                                                                    return (
                                                                        <g key={step}>
                                                                            <circle cx={x} cy={y} r={dotRadiusStyle - 1} fill={dotColor} />
                                                                            <text
                                                                                x={x}
                                                                                y={y + 4}
                                                                                textAnchor="middle"
                                                                                fill={DEFAULT_STYLE.dotTextColor}
                                                                                fontSize="10"
                                                                                fontWeight="bold"
                                                                            >
                                                                                {label}
                                                                            </text>
                                                                        </g>
                                                                    );
                                                                })
                                                            )}
                                                        </g>
                                                    );
                                                })}

                                                {/* Standard dots */}
                                                {dots.map((dot, idx) => {
                                                    const x = paddingLeft + dot.s * stringSpacing;
                                                    const y = fretYPositions[dot.f - 1] + (fretYPositions[dot.f] - fretYPositions[dot.f - 1]) / 2;
                                                    
                                                    let label = "";
                                                    let dotColor = baseFingerStyleColor;

                                                    if (chordDisplayMode === "note" || chordDisplayMode === "degree") {
                                                        const baseSemi = parseNoteToSemi(tuning[dot.s]);
                                                        const absFret = startingFret + dot.f - 1;
                                                        const pitch = (baseSemi + absFret) % 12;
                                                        
                                                        const relativeSemi = (pitch - detectedRootSemi + 12) % 12;
                                                        const degreeStr = INTERVAL_DEGREES[relativeSemi];

                                                        if (chordDisplayMode === "note") {
                                                            label = NOTE_NAMES[pitch];
                                                        } else {
                                                            label = degreeStr;
                                                        }

                                                        dotColor = getIntervalColor(degreeStr);
                                                    }

                                                    return (
                                                        <g key={idx} style={{ cursor: 'pointer' }}>
                                                            <circle cx={x} cy={y} r={dotRadiusStyle} fill={dotColor} />
                                                            {label && (
                                                                <text
                                                                    x={x}
                                                                    y={y + 4.5}
                                                                    textAnchor="middle"
                                                                    fill={DEFAULT_STYLE.dotTextColor}
                                                                    fontSize="12"
                                                                    fontWeight="bold"
                                                                >
                                                                    {label}
                                                                </text>
                                                            )}
                                                        </g>
                                                    );
                                                })}
                                            </g>
                                        )}

                                        {/* Clickable Overlay Grid catcher (Active only in Chord Mode) */}
                                        {appMode === "chord" && (
                                            Array.from({ length: numStrings }).map((_, sIdx) => {
                                                return Array.from({ length: numFrets }).map((_, fIdx) => {
                                                    const fretNum = fIdx + 1;
                                                    const x = paddingLeft + sIdx * stringSpacing - stringSpacing / 2;
                                                    const y = fretYPositions[fIdx];
                                                    const fretHeight = fretYPositions[fIdx + 1] - fretYPositions[fIdx];
                                                    
                                                    const rectWidth = sIdx === 0 || sIdx === numStrings - 1 ? stringSpacing / 2 + 10 : stringSpacing;
                                                    const rectX = sIdx === 0 ? paddingLeft - 10 : x;

                                                    return (
                                                        <rect
                                                            key={`${sIdx}-${fretNum}`}
                                                            x={rectX}
                                                            y={y}
                                                            width={rectWidth}
                                                            height={fretHeight}
                                                            fill="transparent"
                                                            style={{ cursor: 'pointer' }}
                                                            onMouseDown={() => handleMouseDown(sIdx, fretNum)}
                                                            onMouseEnter={() => handleMouseEnter(sIdx, fretNum)}
                                                            onTouchStart={(e) => handleTouchStart(e, sIdx, fretNum)}
                                                        />
                                                    );
                                                });
                                            })
                                        )}
                                    </svg>

                                    {/* Leyenda de colores interactivos (sólo visible en Escalas / Arpegios) */}
                                    {renderIntervalLegend()}
                                </div>

                                {/* Botón flotante de recuperación de Leyenda (aparece si la leyenda está oculta y no es modo acorde) */}
                                {!showLegend && appMode !== "chord" && (
                                    <button
                                        onClick={() => setShowLegend(true)}
                                        class="absolute bottom-4 right-4 bg-slate-900/90 hover:bg-slate-800 text-indigo-450 hover:text-indigo-300 text-xs font-bold py-2.5 px-4 rounded-xl border border-slate-800 shadow-xl flex items-center gap-1.5 transition-all z-20"
                                    >
                                        <span>👁️ Mostrar Leyenda</span>
                                    </button>
                                )}
                            </div>

                            {/* Center bottom indicator */}
                            <div class="text-[10px] text-indigo-400 font-extrabold select-none text-center bg-indigo-950/20 px-3 py-1 rounded-full border border-indigo-900/30">
                                🔊 Haz clic en cualquier nota del mástil para reproducir su sonido real • Simulación de cuerda pulsada de alta fidelidad.
                            </div>
                        </div>

                        {/* ========================================== */}
                        {/* --- RIGHT NAVIGATION DOCK (DESIGN/EXPORT) --- */}
                        {/* ========================================== */}
                        <div 
                            className={`fixed inset-y-0 right-0 z-30 w-80 bg-slate-900 border-l border-slate-800/80 flex flex-col shrink-0 transition-transform duration-300 lg:translate-x-0 lg:static lg:h-auto ${
                                isRightDrawerOpen ? "translate-x-0" : "translate-x-full"
                            }`}
                        >
                            {/* Mobile Drawer Close Header */}
                            <div class="flex justify-between items-center border-b border-slate-800/60 p-3 bg-slate-950/80 shrink-0 lg:hidden">
                                <span class="text-xs font-bold uppercase tracking-wider text-indigo-400">🎨 Apariencia & Exportar</span>
                                <button onClick={() => setIsRightDrawerOpen(false)} class="p-1.5 text-slate-400 hover:text-white font-extrabold text-sm bg-slate-900 rounded-lg">✕</button>
                            </div>

                            {/* Tabs Switcher */}
                            <div class="grid grid-cols-3 border-b border-slate-800/60 p-2 bg-slate-900/60 shrink-0 gap-1 scale-95 origin-top">
                                <button
                                    onClick={() => setActiveRightTab("style")}
                                    class={`py-1.5 px-1 rounded-lg text-[10px] font-bold transition-all ${
                                        activeRightTab === "style" ? "bg-slate-800 text-indigo-400 shadow-inner" : "text-slate-400"
                                    }`}
                                >
                                    🎨 Estilo
                                </button>
                                <button
                                    onClick={() => setActiveRightTab("intervals")}
                                    class={`py-1.5 px-1 rounded-lg text-[10px] font-bold transition-all ${
                                        activeRightTab === "intervals" ? "bg-slate-800 text-indigo-400 shadow-inner" : "text-slate-400"
                                    }`}
                                >
                                    🌈 Intervalos
                                </button>
                                <button
                                    onClick={() => setActiveRightTab("export")}
                                    class={`py-1.5 px-1 rounded-lg text-[10px] font-bold transition-all ${
                                        activeRightTab === "export" ? "bg-slate-800 text-indigo-400 shadow-inner" : "text-slate-400"
                                    }`}
                                >
                                    💾 Exportar
                                </button>
                            </div>

                            {/* Right Tab Contents */}
                            <div class="flex-1 overflow-y-auto p-4 space-y-4">
                                
                                {/* TAB: VISUAL STYLES CONFIG */}
                                {activeRightTab === "style" && (
                                    <div class="space-y-4 text-xs">
                                        <div class="flex justify-between items-center mb-1">
                                            <span class="text-[11px] font-bold text-slate-300 uppercase tracking-wider">Entorno Vectorial</span>
                                            <button 
                                                onClick={resetToDefaultStyle}
                                                class="text-[9px] bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/30 px-2 py-0.5 rounded transition"
                                            >
                                                Reiniciar
                                            </button>
                                        </div>

                                        <div class="border border-slate-800 bg-slate-950/50 rounded-xl p-3 space-y-3">
                                            <div class="grid grid-cols-2 gap-2">
                                                <div>
                                                    <label class="block text-[10px] text-slate-400 mb-1">Fondo Diagrama</label>
                                                    <div class="flex items-center gap-1.5 bg-slate-900 p-1.5 rounded-lg border border-slate-800">
                                                        <input 
                                                            type="color" 
                                                            value={bgStyleColor}
                                                            onChange={(e) => setBgStyleColor(e.target.value)}
                                                            class="w-6 h-6 rounded cursor-pointer bg-transparent border-0"
                                                        />
                                                        <span class="font-mono text-[9px] text-slate-400">{bgStyleColor.toUpperCase()}</span>
                                                    </div>
                                                </div>
                                                <div>
                                                    <label class="block text-[10px] text-slate-400 mb-1">Cuerdas y Trastes</label>
                                                    <div class="flex items-center gap-1.5 bg-slate-900 p-1.5 rounded-lg border border-slate-800">
                                                        <input 
                                                            type="color" 
                                                            value={gridStyleColor}
                                                            onChange={(e) => setGridStyleColor(e.target.value)}
                                                            class="w-6 h-6 rounded cursor-pointer bg-transparent border-0"
                                                        />
                                                        <span class="font-mono text-[9px] text-slate-400">{gridStyleColor.toUpperCase()}</span>
                                                    </div>
                                                </div>
                                            </div>

                                            <div class="grid grid-cols-2 gap-2">
                                                <div>
                                                    <label class="block text-[10px] text-slate-400 mb-1">Texto & Título</label>
                                                    <div class="flex items-center gap-1.5 bg-slate-900 p-1.5 rounded-lg border border-slate-800">
                                                        <input 
                                                            type="color" 
                                                            value={textStyleColor}
                                                            onChange={(e) => setTextStyleColor(e.target.value)}
                                                            class="w-6 h-6 rounded cursor-pointer bg-transparent border-0"
                                                        />
                                                        <span class="font-mono text-[9px] text-slate-400">{textStyleColor.toUpperCase()}</span>
                                                    </div>
                                                </div>
                                                <div>
                                                    <label class="block text-[10px] text-slate-400 mb-1">Tipografía</label>
                                                    <select
                                                        value={fontFamilyStyle}
                                                        onChange={(e) => setFontFamilyStyle(e.target.value)}
                                                        class="w-full bg-slate-900 border border-slate-800 rounded-lg p-1 text-[11px] text-white focus:outline-none animate-none"
                                                    >
                                                        {FONTS_LIST.map(font => (
                                                            <option key={font.id} value={font.id}>{font.name}</option>
                                                        ))}
                                                    </select>
                                                </div>
                                            </div>
                                        </div>

                                        {/* Fretboard Sizing sliders */}
                                        <div class="border border-slate-800 bg-slate-950/50 rounded-xl p-3 space-y-3">
                                            <span class="block text-[11px] font-bold text-slate-300 uppercase tracking-wider">Espesores & Tamaños</span>
                                            
                                            <div class="space-y-1.5">
                                                <div class="flex justify-between items-center text-[10px]">
                                                    <span class="text-slate-400">Radio de Notas:</span>
                                                    <span class="text-indigo-400 font-bold">{dotRadiusStyle}px</span>
                                                </div>
                                                <input 
                                                    type="range" 
                                                    min="8" 
                                                    max="13" 
                                                    value={dotRadiusStyle}
                                                    onChange={(e) => setDotRadiusStyle(parseInt(e.target.value))}
                                                    class="w-full accent-indigo-500 bg-slate-900 h-1 rounded-lg cursor-pointer"
                                                />
                                            </div>

                                            <div class="space-y-1.5">
                                                <div class="flex justify-between items-center text-[10px]">
                                                    <span class="text-slate-400">Grosor de Cuerda:</span>
                                                    <span class="text-indigo-400 font-bold">{lineWidthStyle}px</span>
                                                </div>
                                                <input 
                                                    type="range" 
                                                    min="1" 
                                                    max="4" 
                                                    step="0.5"
                                                    value={lineWidthStyle}
                                                    onChange={(e) => setLineWidthStyle(parseFloat(e.target.value))}
                                                    class="w-full accent-indigo-500 bg-slate-900 h-1 rounded-lg cursor-pointer"
                                                />
                                            </div>
                                        </div>

                                    </div>
                                )}

                                {/* TAB: INTERVAL COLOR MATRICES */}
                                {activeRightTab === "intervals" && (
                                    <div class="space-y-4">
                                        <div class="border border-slate-800 bg-slate-950/50 rounded-xl p-3 space-y-3 text-xs">
                                            <span class="block text-[11px] font-bold text-slate-300 uppercase tracking-wider">Cromaticidad de Intervalos</span>
                                            <p class="text-[10px] text-slate-400">Pinta y destaca grados armónicos sobre el mástil al visualizár en formato de notas o grados.</p>

                                            <div class="grid grid-cols-2 gap-2">
                                                <div>
                                                    <label class="block text-[10px] text-slate-400">Color Base (Dedos)</label>
                                                    <div class="flex items-center gap-1.5 bg-slate-900 p-1 rounded border border-slate-800">
                                                        <input 
                                                            type="color" 
                                                            value={baseFingerStyleColor}
                                                            onChange={(e) => setBaseFingerStyleColor(e.target.value)}
                                                            class="w-5 h-5 rounded cursor-pointer bg-transparent border-0"
                                                        />
                                                        <span class="text-[9px] text-slate-500">Dedos</span>
                                                    </div>
                                                </div>
                                                <div>
                                                    <label class="block text-[10px] text-slate-400">1ª Tónica (1)</label>
                                                    <div class="flex items-center gap-1.5 bg-slate-900 p-1 rounded border border-slate-800">
                                                        <input 
                                                            type="color" 
                                                            value={intervalColors["1"]}
                                                            onChange={(e) => setIntervalColors({...intervalColors, "1": e.target.value})}
                                                            class="w-5 h-5 rounded cursor-pointer bg-transparent border-0"
                                                        />
                                                        <span class="font-mono text-[9px] text-slate-500">{intervalColors["1"].toUpperCase()}</span>
                                                    </div>
                                                </div>
                                            </div>

                                            <div class="grid grid-cols-2 gap-2">
                                                <div>
                                                    <label class="block text-[10px] text-slate-400">2ª Segundas (b2, 2)</label>
                                                    <div class="flex items-center gap-1.5 bg-slate-900 p-1 rounded border border-slate-800">
                                                        <input 
                                                            type="color" 
                                                            value={intervalColors["2"]}
                                                            onChange={(e) => setIntervalColors({...intervalColors, "2": e.target.value})}
                                                            class="w-5 h-5 rounded cursor-pointer bg-transparent border-0"
                                                        />
                                                        <span class="font-mono text-[9px] text-slate-500">{intervalColors["2"].toUpperCase()}</span>
                                                    </div>
                                                </div>
                                                <div>
                                                    <label class="block text-[10px] text-slate-400">3ª Terceras (b3, 3)</label>
                                                    <div class="flex items-center gap-1.5 bg-slate-900 p-1 rounded border border-slate-800">
                                                        <input 
                                                            type="color" 
                                                            value={intervalColors["3"]}
                                                            onChange={(e) => setIntervalColors({...intervalColors, "3": e.target.value})}
                                                            class="w-5 h-5 rounded cursor-pointer bg-transparent border-0"
                                                        />
                                                        <span class="font-mono text-[9px] text-slate-500">{intervalColors["3"].toUpperCase()}</span>
                                                    </div>
                                                </div>
                                            </div>

                                            <div class="grid grid-cols-2 gap-2">
                                                <div>
                                                    <label class="block text-[10px] text-slate-400">4ª Cuartas (4)</label>
                                                    <div class="flex items-center gap-1.5 bg-slate-900 p-1 rounded border border-slate-800">
                                                        <input 
                                                            type="color" 
                                                            value={intervalColors["4"]}
                                                            onChange={(e) => setIntervalColors({...intervalColors, "4": e.target.value})}
                                                            class="w-5 h-5 rounded cursor-pointer bg-transparent border-0"
                                                        />
                                                        <span class="font-mono text-[9px] text-slate-500">{intervalColors["4"].toUpperCase()}</span>
                                                    </div>
                                                </div>
                                                <div>
                                                    <label class="block text-[10px] text-slate-400">5ª Quintas (b5, 5)</label>
                                                    <div class="flex items-center gap-1.5 bg-slate-900 p-1 rounded border border-slate-800">
                                                        <input 
                                                            type="color" 
                                                            value={intervalColors["5"]}
                                                            onChange={(e) => setIntervalColors({...intervalColors, "5": e.target.value})}
                                                            class="w-5 h-5 rounded cursor-pointer bg-transparent border-0"
                                                        />
                                                        <span class="font-mono text-[9px] text-slate-500">{intervalColors["5"].toUpperCase()}</span>
                                                    </div>
                                                </div>
                                            </div>

                                            <div class="grid grid-cols-2 gap-2">
                                                <div>
                                                    <label class="block text-[10px] text-slate-400">6ª Sextas (b6, 6)</label>
                                                    <div class="flex items-center gap-1.5 bg-slate-900 p-1 rounded border border-slate-800">
                                                        <input 
                                                            type="color" 
                                                            value={intervalColors["6"]}
                                                            onChange={(e) => setIntervalColors({...intervalColors, "6": e.target.value})}
                                                            class="w-5 h-5 rounded cursor-pointer bg-transparent border-0"
                                                        />
                                                        <span class="font-mono text-[9px] text-slate-500">{intervalColors["6"].toUpperCase()}</span>
                                                    </div>
                                                </div>
                                                <div>
                                                    <label class="block text-[10px] text-slate-400">7ª Séptimas (b7, 7)</label>
                                                    <div class="flex items-center gap-1.5 bg-slate-900 p-1 rounded border border-slate-800">
                                                        <input 
                                                            type="color" 
                                                            value={intervalColors["7"]}
                                                            onChange={(e) => setIntervalColors({...intervalColors, "7": e.target.value})}
                                                            class="w-5 h-5 rounded cursor-pointer bg-transparent border-0"
                                                        />
                                                        <span class="font-mono text-[9px] text-slate-500">{intervalColors["7"].toUpperCase()}</span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* TAB: EXPORTS & ACTIONS */}
                                {activeRightTab === "export" && (
                                    <div class="space-y-4">
                                        
                                        <div class="border border-slate-800 bg-slate-950/50 rounded-xl p-3.5 space-y-3">
                                            <span class="block text-[11px] font-bold text-slate-300 uppercase tracking-wider">Guardado & Exportación</span>
                                            
                                            <button
                                                onClick={() => { exportPNG(); setIsRightDrawerOpen(false); }}
                                                class="w-full py-2.5 px-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-bold shadow-lg transition flex items-center justify-center gap-2"
                                            >
                                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                                                </svg>
                                                Descargar PNG (High-Res)
                                            </button>

                                            <button
                                                onClick={() => { exportSVG(); setIsRightDrawerOpen(false); }}
                                                class="w-full py-2.5 px-3 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-bold shadow-lg transition flex items-center justify-center gap-2"
                                            >
                                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                                                </svg>
                                                Descargar SVG para Web
                                            </button>

                                            <button
                                                onClick={() => { exportSVGForIllustrator(); setIsRightDrawerOpen(false); }}
                                                class="w-full py-2.5 px-3 bg-amber-600 hover:bg-amber-500 text-white rounded-lg text-xs font-bold shadow-lg transition flex items-center justify-center gap-2"
                                            >
                                                <svg xmlns="http://wwwbugs.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 4v16m8-8H4" />
                                                </svg>
                                                Descargar para Illustrator
                                            </button>
                                        </div>

                                        <div class="border border-slate-800 bg-slate-950/40 rounded-xl p-3 text-[11px] text-slate-400 space-y-2">
                                            <span class="block font-bold text-[10px] text-emerald-400 uppercase tracking-widest">Atributos del SVG</span>
                                            <div class="grid grid-cols-2 gap-1 font-mono text-[10px]">
                                                <div>Lienzo Width:</div>
                                                <div class="text-right text-slate-300">{width}px</div>
                                                <div>Lienzo Height:</div>
                                                <div class="text-right text-slate-300">{height}px</div>
                                                <div>Física Trastes:</div>
                                                <div class="text-right text-slate-300">Logarítmica</div>
                                                <div>Cuerdas:</div>
                                                <div class="text-right text-slate-300">{numStrings}</div>
                                            </div>
                                        </div>

                                    </div>
                                )}

                            </div>
                        </div>

                    </div>

                    {/* --- NOTIFICATION TOAST BAR --- */}
                    {toast.show && (
                        <div class="fixed bottom-5 right-5 z-50 bg-slate-900 border border-indigo-500/30 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center gap-2.5 animate-bounce">
                            <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                            <span class="text-xs font-semibold">{toast.message}</span>
                        </div>
                    )}

                    {/* --- STUDIO FOOTER --- */}
                    <footer class="bg-slate-900 border-t border-slate-800 py-2 px-4 text-center text-slate-500 text-[10px] shrink-0 z-10">
                        <p>© 2026 ChordPic Studio Pro. Diseñado para creadores de contenido de música y educadores.</p>
                    </footer>
                </div>
            );
        }

        // Render the application
        const rootElement = document.getElementById("root");
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
