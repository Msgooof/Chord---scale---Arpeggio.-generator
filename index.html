                    return "Toca las notas en el orden que quieras, o arrastra de una a otra.";
                }
                if (showPath) {
                    return appMode === "free"
                        ? "Clic derecho o pulsación larga sobre una nota o una flecha para más opciones."
                        : "Clic derecho o pulsación larga sobre una flecha para cambiar el recorrido.";
                }
                return "Toca una nota para escuchar cómo suena.";
            };

            /* --- «A MANO», FUERA DEL CAJÓN -----------------------------------
             *
             * Era una pestaña dentro de un panel: un modo que cambia cómo se
             * comporta el LIENZO, encendido desde un sitio que hay que abrir,
             * cerrar y recordar. Ahora vive en la barra de estado, al lado de
             * Sweep y con su misma regla de aparición, y el lienzo enseña que
             * está encendido.
             *
             * La pestaña del panel se queda como espejo: quien la conoce la
             * sigue encontrando donde estaba.
             * ---------------------------------------------------------------- */
            const piezaAMano = (clase) => {
                if (appMode === "chord" || !showPath) return null;
                return (
                    <button
                        onClick={() => setEditandoPath(v => !v)}
                        aria-pressed={editandoPath}
                        class={`k-btn k-btn--touch k-text-xs px-2.5 py-1.5 ${editandoPath ? "k-btn--primary" : "k-btn--outline"} ${clase || ""}`}
                        title={editandoPath
                            ? "Estás escribiendo el recorrido: toca las notas en orden o arrastra de una a otra. Esc para salir"
                            : "Escribir el recorrido a mano: el orden lo pones tú, tocando las notas o arrastrando de una a otra"}
                    >
                        A mano
                    </button>
                );
            };

            const piezaSweep = (clase) => {
                if (appMode === "chord" || !showPath) return null;
                return (
                    <button
                        onClick={() => setArpSweep(v => !v)}
                        aria-pressed={arpSweep}
                        class={`k-btn k-btn--touch k-text-xs px-2.5 py-1.5 ${arpSweep ? "k-btn--primary" : "k-btn--outline"} ${clase || ""}`}
                        title="Sweep: cruzar de cuerda es parte del mismo movimiento de púa, así que las flechas se dibujan enteras"
                    >
                        Sweep
                    </button>
                );
            };

            /* --- TRÍADAS, FUERA DEL SUBMENÚ --------------------------------
             * Mismo caso que Sweep, y misma solución. La tira de tríadas ya
             * vivía pegada al mástil, pero el interruptor que la enciende
             * estaba a tres clics dentro del panel de Escala: había que abrir
             * el panel, encenderla, cerrar el panel para ver el mástil, y
             * repetirlo entero para apagarla.
             *
             * Desactivado cuando la escala no llega a siete notas: sin siete
             * grados no hay terceras que apilar, y un botón que no puede hacer
             * nada tiene que decirlo, no fallar en silencio.
             * --------------------------------------------------------------- */
            const piezaTriadasToggle = (clase) => {
                if (appMode !== "scale") return null;
                return (
                    <button
                        onClick={() => { setScaleTriads(!scaleTriads); setGradoTriada(null); setGradoFijado(null); setMenuTriada(null); }}
                        disabled={!hayTriadasEnLaEscala}
                        aria-pressed={scaleTriads}
                        class={`k-btn k-btn--touch k-text-xs px-2.5 py-1.5 ${scaleTriads ? "k-btn--primary" : "k-btn--outline"} ${clase || ""}`}
                        title={hayTriadasEnLaEscala
                            ? "Los siete acordes que salen de la escala, para ver en qué se pisan"
                            : "Esta escala no llega a siete notas: no hay terceras que apilar"}
                    >
                        Tríadas
                    </button>
                );
            };

            /* Los dos ± del mástil. Mismas propiedades, dos colocaciones: en
             * escritorio flanquean el diagrama, y en móvil van en una fila
             * propia debajo — a los lados no caben sin taparlo. */
            const propsPasoTraste = {
                label: "Posición",
                modo: "direccion",
                value: startingFret,
                min: MIN_FRET,
                max: MAX_FRET,
                onStep: (d) => setStartingFret(prev => clampStartingFret(prev + d)),
                titleUp: "Mover la ventana hacia la cejuela",
                titleDown: "Mover la ventana hacia el puente"
            };

            /* El traste más alto que hay DIBUJADO ahora mismo, en cualquiera de
             * los dos mástiles editables. Es el suelo real de la ventana: por
             * debajo de él habría notas fuera, que es de donde salían los `NaN`.
             *
             * Cuenta los dos mástiles y las cejillas a propósito. Reducir la
             * ventana desde Libre y volver a Acordes con notas del acorde fuera
             * es el mismo fallo, sólo que se descubre más tarde. */
            const trasteMasAltoDibujado = () => {
                let alto = 0;
                dots.forEach(d => { if (d.f > alto) alto = d.f; });
                dotsLibre.forEach(d => { if (d.f > alto) alto = d.f; });
                barres.forEach(b => { if (b.fret > alto) alto = b.fret; });
                return alto;
            };

            const propsPasoNumTrastes = {
                label: "Trastes",
                modo: "cantidad",
                value: numFrets,
                min: MIN_NUM_FRETS,
                max: MAX_NUM_FRETS,
                onStep: (d) => {
                    const pedido = clampNumFrets(numFrets + d);
                    const suelo = trasteMasAltoDibujado();
                    /* Se dice en vez de hacerlo a medias. Antes la ventana
                     * encogía igual y la nota se quedaba fuera: invisible, pero
                     * sonando y viajando al archivo exportado. */
                    if (pedido < suelo) {
                        showToast(`Hay una nota en el traste ${suelo}: la ventana no puede encoger más`);
                        return;
                    }
                    setNumFrets(pedido);
                },
                titleUp: "Ver un traste menos",
                titleDown: "Ver un traste más"
            };

            /* El estilo del diagrama, disponible en todo el árbol. Lo leen la
             * miniatura de la biblioteca, el mástil de la hoja de tonalidad y
             * la ficha de ejercicio, que viven en otro bloque y a los que
             * bajarlo a mano serían seis props cruzando ocho componentes que no
             * pintan nada con ellas. */
            /* --- MANDAR ACORDES Y PASOS (0.2) ----------------------------------
             * Todo pasa por el diálogo «¿Adónde va?». Las listas nuevas se
             * calculan aquí mismo y se fijan de una vez, en vez de con
             * `setX(prev => …)`: «Ir allí» tiene que abrir la canción o el
             * ejercicio YA con lo que se acaba de mandar, y en este mismo clic
             * el estado todavía no se ha actualizado.
             *
             * `ultimasRef` es para lo que pasa DESPUÉS: el botón «Ir allí» del
             * aviso se pulsa segundos más tarde, cuando su cierre ya es viejo. */
            const ultimasRef = useRef({});
            ultimasRef.current = { songs, song, exercises, exercise };

            const irACancion = (idCancion, idSeccion) => {
                const { songs: canciones, song: abierta } = ultimasRef.current;
                const lista = fundirEnLista(canciones, abierta);
                const destino = lista.find(s => s.id === idCancion);
                if (destino && destino.id !== abierta.id) {
                    setSongs(lista);
                    setSong(destino);
                    stopSong();
                }
                if (idSeccion) setActiveSectionId(idSeccion);
                setAppView("song");
            };

            const irAEjercicio = (idEjercicio) => {
                const { exercises: lista0, exercise: abierto } = ultimasRef.current;
                const lista = fundirEnLista(lista0, abierto);
                const destino = lista.find(e => e.id === idEjercicio);
                if (destino && destino.id !== abierto.id) {
                    setExercises(lista);
                    setExercise(destino);
                    stopExercise();
                }
                setAppView("exercise");
                setOpenPanel(null);
            };

            const [mandar, setMandar] = useState(null);

            /* La pantalla de carga: un segundo al pasar del sitio a la app. El
             * temporizador va en una ref y no en la limpieza del efecto: si
             * cambias de sección dentro de ese segundo, la limpieza lo
             * cancelaría y la pantalla se quedaría puesta para siempre. */
            const [cargandoTaller, setCargandoTaller] = useState(false);
            const vistaAnteriorRef = useRef(appView);
            const temporizadorCargaRef = useRef(null);
            useEffect(() => {
                const antes = vistaAnteriorRef.current;
                vistaAnteriorRef.current = appView;
                // 0.3: también al volver del Taller a la portada (el logo).
                const deSitioAApp = VISTAS_SITIO.includes(antes) && !VISTAS_SITIO.includes(appView);
                const deAppAPortada = !VISTAS_SITIO.includes(antes) && appView === "welcome";
                if (deSitioAApp || deAppAPortada) {
                    setCargandoTaller(deAppAPortada ? "portada" : "taller");
                    clearTimeout(temporizadorCargaRef.current);
                    temporizadorCargaRef.current = setTimeout(() => setCargandoTaller(false), 1000);
                }
            }, [appView]);

            // Desde el estudio, modo Acordes: guardar la digitación de ahora.
            const abrirGuardarAcorde = () => {
                const foto = Song.createChordSnapshot({
                    name: (chordName || detectedChord || "Acorde").trim(),
                    instrument, tuning, tuningMidi,
                    numFrets, startingFret,
                    dots, barres, stringStates
                });
                if (chordVoicingToMidi(foto).length === 0) {
                    showToast("Ese mástil no suena: pon alguna nota o marca cuerdas al aire");
                    return;
                }
                const repetido = chordLibrary.find(c => mismaDigitacion(c, foto)) || null;
                setGuardando({ chord: foto, repetido });
            };

            // Desde la biblioteca de Canción: un acorde que ya está guardado.
            const abrirMandarAcordeExistente = (chord) => {
                const seccion = activeSectionId || (song.sections[0] && song.sections[0].id);
                setMandar({ tipo: "acorde", chord, existente: true, nombre: chord.name, destino: `${song.id}|${seccion}`, ir: false });
            };

            const nombrePasoPorDefecto = () => {
                const triada = triadaFijada();
                if (triada) return `${triada.romano} · ${triada.triada}`;
                if (appMode === "free") return `Libre · ${recorridoActual().length} notas`;
                const preset = appMode === "arpeggio"
                    ? ARPEGGIO_PRESETS.find(x => x.id === arpeggioType)
                    : SCALE_PRESETS.find(x => x.id === scaleType);
                const raiz = appMode === "arpeggio" ? arpeggioRoot : scaleRoot;
                return NOTE_NAMES[raiz] + " " + (preset ? preset.name : "");
            };

            // Desde el estudio, modos Escalas, Arpegios y Libre.
            const abrirMandarPaso = () => {
                if (recorridoActual().length === 0) {
                    showToast("No hay notas que practicar en esta ventana");
                    return;
                }
                setMandar({ tipo: "paso", nombre: nombrePasoPorDefecto(), destino: exercise.id, ir: false });
            };

            /* Un compás más con este acorde al final de una sección. Lo usan
             * el diálogo «¿Adónde va?» y el panel de guardar acorde. */
            const anadirAcordeASeccion = (chord, idCancion, idSeccion, ir) => {
                const anadir = (s) => ({
                    ...s,
                    sections: s.sections.map(sec => sec.id === idSeccion
                        ? { ...sec, bars: [...sec.bars, { chordId: chord.id, beats: Song.beatsPerBar(s.timeSignature) }] }
                        : sec)
                });
                const lista = fundirEnLista(songs, song).map(s => s.id === idCancion ? anadir(s) : s);
                const destino = lista.find(s => s.id === idCancion);
                const seccion = destino && destino.sections.find(x => x.id === idSeccion);
                setSongs(lista);
                Song.saveSongs(lista);
                if (idCancion === song.id || ir) {
                    if (idCancion !== song.id) stopSong();
                    setSong(destino);
                }
                const donde = `${destino ? destino.title : "la canción"}${seccion ? " › " + seccion.name : ""}`;
                if (ir) {
                    setActiveSectionId(idSeccion);
                    setAppView("song");
                    showToast(`«${chord.name}» añadido a ${donde}`);
                } else {
                    showToast(`«${chord.name}» añadido a ${donde}`, { texto: "Ir allí", alPulsar: () => irACancion(idCancion, idSeccion) });
                }
            };

            /* --- GUARDAR ACORDE: el panel pegado al botón ---------------------
             * `guardando` lleva la foto del mástil y, si la biblioteca ya tiene
             * esa misma digitación, cuál es: así no se guarda dos veces. */
            const [guardando, setGuardando] = useState(null);
            const botonGuardarRef = useRef(null);
            useEffect(() => { setGuardando(null); }, [appMode, appView]);

            /* 0.3: el volumen, en el clic derecho de «Reproducir» (o pulsación
             * larga en el teléfono). */
            const [menuVolumen, setMenuVolumen] = useState(null);
            const pulsoVolumenRef = useRef({ t: null, x: 0, y: 0 });
            const abrirMenuVolumen = (x, y) => setMenuVolumen({ x, y });

            const mismaDigitacion = (a, b) => a.instrument === b.instrument
                && JSON.stringify(chordVoicingToMidi(a)) === JSON.stringify(chordVoicingToMidi(b));

            const confirmarGuardarAcorde = ({ nombre, idCancion, idSeccion }) => {
                const g = guardando;
                if (!g) return;
                setGuardando(null);
                // Ya estaba y va a una sección: se usa el de la biblioteca.
                const usarElGuardado = g.repetido && idSeccion;
                const chord = usarElGuardado ? g.repetido : { ...g.chord, name: nombre };
                if (!usarElGuardado) setChordLibrary(prev => [...prev, chord]);
                if (idSeccion) {
                    anadirAcordeASeccion(chord, idCancion, idSeccion, false);
                    return;
                }
                showToast(`«${chord.name}» guardado en la biblioteca`, {
                    texto: "Ver en Canción",
                    alPulsar: () => irACancion(ultimasRef.current.song.id, null)
                });
            };

            const confirmarMandar = () => {
                const m = mandar;
                if (!m) return;
                setMandar(null);

                if (m.tipo === "acorde") {
                    const nombre = (m.nombre || "").trim() || m.chord.name;
                    const chord = { ...m.chord, name: nombre };
                    if (!m.existente) setChordLibrary(prev => [...prev, chord]);

                    if (m.destino === "biblio") {
                        showToast(`«${nombre}» guardado en la biblioteca`, {
                            texto: "Ver en Canción",
                            alPulsar: () => irACancion(ultimasRef.current.song.id, null)
                        });
                        return;
                    }

                    const [idCancion, idSeccion] = m.destino.split("|");
                    anadirAcordeASeccion(chord, idCancion, idSeccion, m.ir);
                    return;
                }

                // --- Un paso de ejercicio ---
                const paso = crearPasoDelMastil((m.nombre || "").trim() || nombrePasoPorDefecto());
                if (!paso) return;

                // 0.3: o a una tablatura, una nota por corchea.
                if (String(m.destino).startsWith("tab:")) {
                    const idTab = m.destino.slice(4);
                    if (idTab === "nueva") { pasosATablatura([paso], paso.nombre); return; }
                    const cuerdas = getInstrument(tab.instrument).strings;
                    const eventos = KharoTab.eventosDesdeRecorrido(paso.path, paso.startingFret, { sweep: paso.sweep ? "abajo" : null })
                        .map(e => ({ ...e, notas: e.notas.filter(n => n.s < cuerdas) }));
                    const anadir = (t) => {
                        const compases = t.compases.slice();
                        while (compases.length > 1 && !compases[compases.length - 1].eventos.length) compases.pop();
                        if (compases.length === 1 && !compases[0].eventos.length) compases.pop();
                        return { ...t, compases: [...compases, ...KharoTab.enCompases(eventos, t.compas)] };
                    };
                    const lista = fundirEnLista(tabs, tab).map(t => t.id === idTab ? anadir(t) : t);
                    const destino = lista.find(t => t.id === idTab);
                    setTabs(lista);
                    KharoTab.saveTabs(lista);
                    if (idTab === tab.id || m.ir) setTab(destino);
                    if (m.ir) { setAppView("tab"); setOpenPanel(null); }
                    showToast(`«${paso.nombre}» añadido a «${destino ? destino.title : "la tablatura"}»`,
                        m.ir ? undefined : { texto: "Ir allí", alPulsar: () => { abrirTab(idTab); setAppView("tab"); } });
                    return;
                }
                let idDestino = m.destino;
                let titulo = exercise.title;
                if (m.destino === exercise.id) {
                    setExercise(prev => ({ ...prev, pasos: [...prev.pasos, paso] }));
                } else if (m.destino === "nuevo") {
                    const nuevo = Song.createExercise();
                    nuevo.pasos = [paso];
                    nuevo.title = paso.nombre;
                    idDestino = nuevo.id;
                    titulo = nuevo.title;
                    const lista = [...fundirEnLista(exercises, exercise), nuevo];
                    setExercises(lista);
                    Song.saveExercises(lista);
                    if (m.ir) setExercise(nuevo);
                } else {
                    const lista = fundirEnLista(exercises, exercise).map(e => e.id === m.destino ? { ...e, pasos: [...e.pasos, paso] } : e);
                    const destino = lista.find(e => e.id === m.destino);
                    titulo = destino ? destino.title : "el ejercicio";
                    setExercises(lista);
                    Song.saveExercises(lista);
                    if (m.ir && destino) { stopExercise(); setExercise(destino); }
                }
                if (m.ir) {
                    setAppView("exercise");
                    setOpenPanel(null);
                    showToast(`«${paso.nombre}» añadido a «${titulo}»`);
                } else {
                    showToast(`«${paso.nombre}» añadido a «${titulo}»`, { texto: "Ir allí", alPulsar: () => irAEjercicio(idDestino) });
                }
            };

            // Los destinos que enseña el diálogo, según lo que se manda.
            const gruposDeDestino = () => {
                if (!mandar) return [];
                if (mandar.tipo === "acorde") {
                    const grupos = [];
                    if (!mandar.existente) {
                        grupos.push({ id: "biblio", titulo: null, opciones: [{ id: "biblio", label: "Sólo a la biblioteca", detalle: "Lo tendrás a mano en cualquier canción" }] });
                    }
                    fundirEnLista(songs, song).forEach(s => {
                        grupos.push({
                            id: s.id,
                            titulo: s.id === song.id ? `${s.title} · la abierta` : s.title,
                            opciones: s.sections.map(sec => ({
                                id: `${s.id}|${sec.id}`,
                                label: sec.name || "Sin nombre",
                                detalle: `${sec.bars.length} ${sec.bars.length === 1 ? "compás" : "compases"}`
                            }))
                        });
                    });
                    return grupos;
                }
                const lista = fundirEnLista(exercises, exercise);
                return [{
                    id: "ejercicios",
                    titulo: null,
                    opciones: [
                        ...lista.map(e => ({
                            id: e.id,
                            label: e.title || "Sin título",
                            detalle: `${e.id === exercise.id ? "el abierto · " : ""}${e.pasos.length} ${e.pasos.length === 1 ? "paso" : "pasos"}`
                        })),
                        { id: "nuevo", label: "Un ejercicio nuevo", detalle: "Empieza con este paso" }
                    ]
                }, {
                    // 0.3: el recorrido también puede ir a una tablatura.
                    id: "tablaturas",
                    titulo: "O a una tablatura",
                    opciones: [
                        ...fundirEnLista(tabs, tab).map(t => ({
                            id: `tab:${t.id}`,
                            label: t.title || "Sin título",
                            detalle: `${t.id === tab.id ? "la abierta · " : ""}${t.compases.length} ${t.compases.length === 1 ? "compás" : "compases"}`
                        })),
                        { id: "tab:nueva", label: "Una tablatura nueva", detalle: "Una nota por corchea" }
                    ]
                }];
            };

            /* --- AYUDANTES DEL ESTUDIO (0.2) ------------------------------- */
            const queHay = appMode === "chord"
                ? { rotulo: "Acorde", valor: detectedChord || "Sin notas" }
                : appMode === "scale"
                    ? { rotulo: "Escala", valor: `${NOTE_NAMES[scaleRoot]} ${scaleType === "custom" ? "personalizada" : ((SCALE_PRESETS.find(p => p.id === scaleType) || {}).name || "")}` }
                    : appMode === "arpeggio"
                        ? { rotulo: "Arpegio", valor: `${NOTE_NAMES[arpeggioRoot]} ${((ARPEGGIO_PRESETS.find(p => p.id === arpeggioType) || {}).name || "")}` }
                        : { rotulo: "Libre", valor: `${dotsLibre.length} ${dotsLibre.length === 1 ? "nota" : "notas"} · ${recorridoActual().length} en el recorrido` };

            const controlTempo = (sufijo) => (
                <React.Fragment>
                    <label htmlFor={`k2-tempo-${sufijo}`} class="k2-tempo__rotulo">Tempo</label>
                    <input
                        id={`k2-tempo-${sufijo}`}
                        type="range"
                        min="30"
                        max="240"
                        value={tempoBpm}
                        onChange={(e) => setTempoBpm(parseInt(e.target.value))}
                        aria-valuetext={`${tempoBpm} bpm`}
                        class="k2-rango"
                    />
                    <span class="k2-tempo__valor">{tempoBpm} bpm</span>
                    {appMode === "chord" && (
                        <span class="k2-tempo__extra" title="En Acordes el tempo separa las cuerdas del rasgueo">
                            {Math.round(separacionRasgueo * 1000)} ms/cuerda
                        </span>
                    )}
                </React.Fragment>
            );

            const pulsarDeshacer = (rehacer) => {
                const hecho = rehacer ? historial.rehacer() : historial.deshacer();
                showToast(hecho
                    ? (rehacer ? "Rehecho" : "Deshecho")
                    : (rehacer ? "Nada que rehacer" : "Nada que deshacer"));
            };

            const conDeshacer = (mensaje) => showToast(mensaje, { texto: "Deshacer", alPulsar: () => historialRef.current.deshacer() });

            const vaciarConDeshacer = () => { clearAll(); conDeshacer("Mástil vaciado"); };
            const reiniciarConDeshacer = () => { reiniciarRecorrido(); conDeshacer("Recorrido automático otra vez"); };

            const borrarEstiloConDeshacer = (id) => {
                const antes = stylePresets;
                const p = antes.find(x => x.id === id);
                borrarPreset(id);
                showToast(`Estilo «${p ? p.name : ""}» borrado`, { texto: "Deshacer", alPulsar: () => setStylePresets(antes) });
            };

            const restablecerEstiloConDeshacer = () => {
                const antes = style;
                setStyle(normalizeStyle({}));
                showToast("Estilo de fábrica restablecido", { texto: "Deshacer", alPulsar: () => setStyle(antes) });
            };

            const alternarInspector = (forzar) => {
                const nuevo = typeof forzar === "boolean" ? forzar : !inspectorAbierto;
                setInspectorAbierto(nuevo);
                if (window.innerWidth >= 1280) {
                    try { localStorage.setItem("kharo.v02.inspector", nuevo ? "1" : "0"); } catch (e) {}
                }
            };
            const abrirPestana = (id) => {
                if (inspectorAbierto && pestanaInspector === id && window.innerWidth < 1280) {
                    setInspectorAbierto(false);
                    return;
                }
                setPestanaInspector(id);
                setInspectorAbierto(true);
            };
            const cerrarSiMovil = () => { if (window.innerWidth < 768) setInspectorAbierto(false); };
            const abrirExportar = () => { setNombreArchivoExport(""); setDialogoEstudio("exportar"); };

            /* El botón de vaciar junto a los ± del lienzo. Sólo en Acordes y
             * Libre, que son los modos que se dibujan a mano; apagado si no
             * hay nada que quitar. */
            const mastilVacio = appMode === "chord"
                ? dots.length === 0 && barres.length === 0 && stringStates.every(e => e === "none")
                : dotsLibre.length === 0 && stringStatesLibre.every(e => e === "none");
            const botonVaciar = (clase) => modoEditable && (
                <button
                    type="button"
                    onClick={vaciarConDeshacer}
                    disabled={mastilVacio}
                    class={`k2-vaciar ${clase || ""}`}
                    aria-label="Vaciar el mástil"
                    title="Vaciar el mástil (se puede deshacer)"
                >
                    <Icono nombre="papelera" />
                    <span>Vaciar</span>
                </button>
            );

            /* Tríadas, junto a Posición (sólo Escalas). Al encenderlas queda
             * fijada la I: así la tira se lee como lo que es, un selector, y
             * no siete fichas sueltas que no se sabe para qué sirven. */
            const activarTriadas = (v) => {
                setScaleTriads(v);
                setGradoTriada(v ? 1 : null);
                setGradoFijado(v ? 1 : null);
                setMenuTriada(null);
            };
            const botonTriadas = (clase) => appMode === "scale" && (
                <button
                    type="button"
                    onClick={() => activarTriadas(!scaleTriads)}
                    disabled={!hayTriadasEnLaEscala}
                    aria-pressed={scaleTriads}
                    class={`k2-vaciar k2-triadas ${clase || ""}`}
                    aria-label="Tríadas de la escala"
                    title={hayTriadasEnLaEscala
                        ? "Los siete acordes que salen de la escala: elige uno para verlo dentro de ella"
                        : "Esta escala no llega a siete notas: no hay terceras que apilar"}
                >
                    <Icono nombre="triadas" />
                    <span>Tríadas</span>
                </button>
            );

            const accionesDelEstudio = [
                modoEditable && { label: "Vaciar el mástil", hacer: vaciarConDeshacer },
                { label: "Atajos de teclado", hacer: () => setDialogoEstudio("atajos") }
            ].filter(Boolean);

            /* Los atajos de una tecla. Ninguno mientras se escribe en un campo
             * ni con un diálogo abierto; Ctrl+Z sigue en su propio efecto. */
            useEffect(() => {
                const alPulsar = (e) => {
                    if (appView !== "studio" || dialogoEstudio) return;
                    if (e.ctrlKey || e.metaKey || e.altKey) return;
                    const foco = document.activeElement;
                    if (foco && (foco.tagName === "INPUT" || foco.tagName === "TEXTAREA" || foco.tagName === "SELECT" || foco.isContentEditable)) return;
                    const modos = { "1": "chord", "2": "scale", "3": "arpeggio", "4": "free" };
                    if (modos[e.key]) { e.preventDefault(); selectMode(modos[e.key]); return; }
                    const k = (e.key || "").toLowerCase();
                    if (k === "p") { e.preventDefault(); triggerStrumOrSequence(); return; }
                    if (k === "e") { e.preventDefault(); abrirExportar(); return; }
                    if (e.key === "[") { e.preventDefault(); setStartingFret(prev => clampStartingFret(prev - 1)); return; }
                    if (e.key === "]") { e.preventDefault(); setStartingFret(prev => clampStartingFret(prev + 1)); return; }
                    if (e.key === "?") { e.preventDefault(); setDialogoEstudio("atajos"); return; }
                    if (e.key === "Escape" && inspectorAbierto && window.innerWidth < 1280) setInspectorAbierto(false);
                };
                window.addEventListener("keydown", alPulsar);
                return () => window.removeEventListener("keydown", alPulsar);
            });

            /* Prueba: sitio o app. En el sitio, la cabecera lleva la
             * navegación de Kharo; en la app, las pestañas del Taller. */
            const esSitio = VISTAS_SITIO.includes(appView);
            const irA = (id) => {
                if (id === "taller") { selectMode("chord"); return; }
                // Desde las fichas de instrumentos: Escalas, que enseña el
                // mástil entero lleno, con ese instrumento puesto. El efecto
                // de `[instrument]` pone su afinación de fábrica y, si cambia
                // el número de cuerdas, vacía el mástil avisando y con deshacer.
                if (id.startsWith("inst:")) {
                    selectMode("scale");
                    setInstrument(id.slice(5));
                    return;
                }
                setAppView(id);
                setOpenPanel(null);
            };

            return (
                <StyleContext.Provider value={style}>
                <div class="flex-1 flex flex-col overflow-hidden h-full" style={{backgroundColor:'var(--k-bg)', color:'var(--k-text)'}} onMouseUp={handleMouseUp} onTouchEnd={handleMouseUp}>
                    
                    {/* --- MAIN HEADER --- */}
                    <header class="shrink-0 z-10" style={{backgroundColor:'var(--k-bg)', borderBottom:'1px solid var(--k-divider)'}}>
                        {/* Logo a la izquierda y pestañas en el centro: el
                            tercio derecho queda vacío a propósito, para que las
                            pestañas caigan sobre el eje del lienzo. */}
                        <div class="flex items-center justify-between gap-3 px-3 py-2 md:px-5 md:py-2.5 lg:grid lg:grid-cols-[auto_1fr_auto]">
                            {/* El logo es la vuelta a la portada. No hay un botón
                                «Inicio» aparte porque el logo ya es el sitio donde
                                todo el mundo pincha para volver al principio. */}
                            <button
                                onClick={() => setAppView("welcome")}
                                title="Volver al inicio"
                                aria-label="Volver al inicio"
                                class="shrink-0 justify-self-start rounded-lg transition-opacity hover:opacity-80 active:opacity-60"
                                style={{ background: 'none', border: 'none', padding: 0, cursor: 'pointer' }}
                            >

                            </button>

                            {/* En escritorio las pestañas caben al lado del logo.
                                En la portada no se pintan: ahí las secciones son las
                                fichas, con lo que hace cada una explicado. */}
                            {/* Prueba: en la fila del logo sólo desde 1024 px. Por
                                debajo, con «Sobre el proyecto» y el aviso de prueba
                                al lado, no cabían: el logo se aplastaba y lo de la
                                derecha se salía de la pantalla. */}

                                <div class="hidden lg:block lg:justify-self-center">
                                    <NavSitio vista={appView} onIr={irA} />
                                </div>
                            ) : null}

                            <div class="flex items-center gap-2 lg:col-start-3 lg:justify-self-end">
                                {/* En el teléfono no hay raíl: la Biblioteca va aquí. */}
                                {!esSitio && (
                                    <span class="md:hidden">
                                        <BotonIcono icono="biblioteca" etiqueta="Biblioteca" activo={appView === "biblioteca"} onClick={() => selectMode("biblioteca")} variante="borde" />
                                    </span>
                                )}
                                <InterruptorModo />
                            </div>
                        </div>

                        {/* En móvil no caben ahí: bajan a su propia fila, a ancho
                            completo y repartidas a partes iguales. */}

                            <div class="lg:hidden px-2 pb-1">
                                <NavSitio vista={appView} onIr={irA} fila />
                            </div>
                        ) : (
                            <div class="md:hidden px-2 pb-2">
                                <ModeTabs items={MODE_TABS} active={appView === "studio" ? appMode : appView} onSelect={selectMode} stretch />
                            </div>
                        )}
                    </header>

                    {/* 0.2: el cuerpo. En la app, el raíl de secciones a la
                        izquierda; encima de todo, la pantalla de carga al
                        entrar desde el sitio. */}
                    <div class="k2-cuerpo-app">
                    {!esSitio && <RailTaller activo={appView === "studio" ? appMode : appView} onSelect={selectMode} />}
                    <div class="k2-cuerpo-app__vista">

                    {/* --- LA PORTADA ---
                        Primera pantalla de cada carga. Los efectos que paran la
                        canción y el ejercicio ya miran `appView !== "song"` y
                        `!== "exercise"`, así que aquí se para todo solo. */}
                    {appView === "welcome" && <Landing onEntrar={selectMode} onIr={irA} />}

                    {/* --- EL RESTO DEL SITIO (prueba) --- */}
                    {appView === "about" && <SobreElProyecto onIr={irA} />}
                    {appView === "como" && <ComoSeHizo onIr={irA} />}
                    {(appView === "foro" || appView === "tienda") && <PaginaEnObra id={appView} onIr={irA} />}

                    {/* --- APARTADO CANCIÓN ---
                        Ocupa el sitio del lienzo: es otra tarea, no otra vista
                        del mismo mástil. El estado del estudio se queda intacto
                        debajo, así que al volver está todo como se dejó. */}
                    {appView === "song" && (
                        <SongEditor
                            key={song.id}
                            song={song}
                            setSong={setSong}
                            chordLibrary={chordLibrary}
                            onRemoveChord={removeChordFromLibrary}
                            onRenameChord={renameChordInLibrary}
                            onAuditionChord={auditionChord}
                            activeSectionId={activeSectionId}
                            setActiveSectionId={setActiveSectionId}
                            playhead={playhead}
                            isPlaying={isPlayingSong}
                            onPlay={playSong}
                            onStop={stopSong}
                            isLooping={isLooping}
                            setIsLooping={setIsLooping}
                            onExport={exportSong}
                            onImport={importSongJSON}
                            onNuevaCancion={nuevaCancion}
                            songs={fundirEnLista(songs, song)}
                            onAbrirCancion={abrirCancion}
                            onDuplicarCancion={duplicarCancion}
                            onBorrarCancion={borrarCancion}
                            onBorrarTodasLasCanciones={borrarTodasLasCanciones}
                            onBorrarTodosLosAcordes={borrarTodosLosAcordes}
                            onMandarAcordeA={mandarAcordeA}
                            onPreviewRhythm={previewRhythm}
                            onStopPreview={stopPreviewRhythm}
                            previewSonando={previewSonando}
                            onAviso={showToast}
                            onElegirDestino={abrirMandarAcordeExistente}
                            onBiblioteca={() => selectMode("biblioteca")}
                        />
                    )}

                    {/* --- APARTADO EJERCICIOS --- */}
                    {appView === "exercise" && (
                        <ExerciseEditor
                            key={exercise.id}
                            exercise={exercise}
                            setExercise={setExercise}
                            isPlaying={isPlayingExercise}
                            onPlay={playExercise}
                            onStop={stopExercise}
                            pasoSonando={pasoSonando}
                            onExport={exportSong}
                            onNuevo={nuevoEjercicio}
                            exercises={fundirEnLista(exercises, exercise)}
                            onAbrirEjercicio={abrirEjercicio}
                            onDuplicarEjercicio={duplicarEjercicio}
                            onBorrarEjercicio={borrarEjercicio}
                            onBorrarTodosLosEjercicios={borrarTodosLosEjercicios}
                            onCargarEnMastil={cargarPasoEnMastil}
                            onCopia={exportExerciseJSON}
                            onImportar={importExerciseJSON}
                            onAviso={showToast}
                            onBiblioteca={() => selectMode("biblioteca")}

                        <TabEditor
                            key={tab.id}
                            tab={tab}
                            setTab={setTab}
                            onAviso={showToast}
                            isPlaying={isPlayingTab}
                            onPlay={playTab}
                            onStop={stopTab}
                            sonando={eventoSonando}
                            repetir={repetirTab}
                            onRepetir={() => setRepetirTab(v => !v)}
                            timbre={timbre}
                            onTimbre={setTimbre}
                            onExport={exportSong}
                            onNueva={() => nuevaTab()}
                            tabs={fundirEnLista(tabs, tab)}
                            onAbrir={abrirTab}
                            onDuplicar={duplicarTab}
                            onBorrar={borrarTab}
                            onBorrarTodas={borrarTodasLasTabs}
                            onCopia={() => exportTabJSON()}
                            onImportar={importTabJSON}
                            onBiblioteca={() => selectMode("biblioteca")}
                        />
                    )}

                    {/* --- 0.3: LA BIBLIOTECA --- */}
                    {appView === "biblioteca" && (() => {
                        const items = itemsBiblioteca();
                        const etiquetas = [];
                        items.forEach(i => i.etiquetas.forEach(e => { if (!etiquetas.includes(e)) etiquetas.push(e); }));
                        etiquetas.sort((a, b) => a.localeCompare(b, "es"));
                        return (
                            <Biblioteca
                                items={items}
                                todasLasEtiquetas={etiquetas}
                                onAbrir={(item) => abrirDesdeBiblioteca(item)}
                                onNuevo={nuevoDesdeBiblioteca}
                                onRenombrar={renombrarDesdeBiblioteca}
                                onDuplicar={duplicarDesdeBiblioteca}
                                onBorrar={borrarDesdeBiblioteca}
                                onBorrarVarios={borrarVariosDesdeBiblioteca}
                                onFijar={fijarDesdeBiblioteca}
                                onEtiquetas={etiquetarDesdeBiblioteca}
                                onImprimir={imprimirDesdeBiblioteca}
                                onCopia={copiaDesdeBiblioteca}
                                onAviso={showToast}
                            />
                        );
                    })()}

                    {/* ==============================================================
                        --- EL ESTUDIO (0.2) ---
                        Tres preguntas, en este orden:
                          qué tengo            → el lienzo, lo más grande posible
                          qué puedo hacer ahora → la barra de acción, arriba
                          cómo lo ajusto        → el inspector, a la derecha
                        El inspector es una columna fija desde 1280 px, un cajón
                        por debajo y una hoja que sube desde el dock en el
                        teléfono. La barra flotante de emojis ya no existe: sus
                        cinco botones son las cuatro pestañas y «Exportar».
                        ============================================================== */}
                    {appView === "studio" && (
                    <div class="k2-estudio">

                        {/* --- BARRA DE ACCIÓN --- */}
                        <div class="k2-barra-accion" role="toolbar" aria-label="Acciones del diagrama">
                            <div class="k2-que-hay">
                                <span class="k2-que-hay__rotulo">{queHay.rotulo}</span>
                                <strong class="k2-que-hay__valor">{queHay.valor}</strong>
                            </div>

                            <div class="k2-barra-accion__grupo">
                                <button
                                    type="button"
                                    /* `aria-disabled` y no `disabled`: un botón
                                       desactivado no recibe el clic derecho, y el
                                       volumen se quiere bajar justo mientras suena. */
                                    onClick={() => { if (!isPlayingSequence) triggerStrumOrSequence(); }}
                                    onContextMenu={(e) => { e.preventDefault(); abrirMenuVolumen(e.clientX, e.clientY); }}
                                    {...crearPulsacionLarga(pulsoVolumenRef, abrirMenuVolumen)}
                                    aria-disabled={isPlayingSequence}
                                    class="k-btn k-btn--primary k-btn--touch k2-boton-texto"
                                    aria-label={appMode === "chord" ? "Rasguear el acorde" : "Reproducir el recorrido"}
                                    title="Clic derecho: volumen"
                                >
                                    <Icono nombre="altavoz" />
                                    <span class="k2-solo-escritorio">{appMode === "chord" ? "Rasguear" : "Reproducir"}</span>
                                </button>
                                <div class="k2-tempo k2-solo-escritorio">{controlTempo("barra")}</div>
                                {menuVolumen && (
                                    <MenuVolumen
                                        x={menuVolumen.x}
                                        y={menuVolumen.y}
                                        onProbar={() => { if (!isPlayingSequence) triggerStrumOrSequence(); }}
                                        onCerrar={() => setMenuVolumen(null)}
                                    />
                                )}
                            </div>

                            <div class="k2-barra-accion__grupo k2-barra-accion__fin">
                                <BotonIcono icono="deshacer" etiqueta="Deshacer (Ctrl+Z)" onClick={() => pulsarDeshacer(false)} disabled={!historial.hayQueDeshacer} />
                                <BotonIcono icono="rehacer" etiqueta="Rehacer (Ctrl+Shift+Z)" onClick={() => pulsarDeshacer(true)} disabled={!historial.hayQueRehacer} />
                                {appMode === "chord" ? (
                                    <button ref={botonGuardarRef} type="button" onClick={() => guardando ? setGuardando(null) : abrirGuardarAcorde()} aria-haspopup="dialog" aria-expanded={!!guardando} class={`k-btn k-btn--touch k2-boton-texto ${guardando ? "k-btn--primary" : "k-btn--outline"}`} aria-label="Guardar el acorde">
                                        <Icono nombre="guardar" />
                                        <span class="k2-solo-escritorio">Guardar acorde</span>
                                    </button>
                                ) : (
                                    <button type="button" onClick={abrirMandarPaso} class="k-btn k-btn--outline k-btn--touch k2-boton-texto" aria-label="Mandar a Ejercicios">
                                        <Icono nombre="ejercicios" />
                                        <span class="k2-solo-escritorio">Mandar a Ejercicios</span>
                                    </button>
                                )}
                                <MenuAcciones etiqueta="Más acciones" titulo="Más acciones" opciones={accionesDelEstudio} />
                                <BotonIcono
                                    icono="panel"
                                    etiqueta={inspectorAbierto ? "Ocultar el panel" : "Mostrar el panel"}
                                    onClick={() => alternarInspector()}
                                    activo={inspectorAbierto}
                                    className="k2-no-movil"
                                />
                                <button type="button" onClick={() => abrirExportar()} class="k-btn k-btn--primary k-btn--touch k2-boton-texto" aria-label="Exportar el diagrama">
                                    <Icono nombre="exportar" />
                                    <span class="k2-solo-escritorio">Exportar</span>
                                </button>
                            </div>
                        </div>

                        <div class="k2-estudio__cuerpo">

                            {/* --- EL LIENZO --- */}
                            <div class="k2-lienzo-zona">
                                {renderLegendStrip()}
                                {piezaTriadas()}

                                <div class="flex-1 min-h-0 w-full flex items-stretch justify-center relative">
                                    {/* La piel del modo. Un cursor no es una piel: no se ve
                                        hasta que ya estás encima. Esto se ve de lejos, dice
                                        cómo salir, y no viaja al archivo exportado porque
                                        vive FUERA del SVG. */}
                                    {modoAMano && (
                                        <span class="k-rotulo-modo">Recorrido a mano · Esc para salir</span>
                                    )}
                                    {/* En el teléfono la fila de los ± no tiene sitio para un
                                        tercero: Vaciar va en la esquina del lienzo. */}
                                    {botonVaciar("k2-vaciar--esquina md:hidden")}
                                    {botonTriadas("k2-vaciar--esquina md:hidden")}
                                    <div class="kp-milimetrado flex-1 min-h-0 p-2 sm:p-4 rounded-2xl border flex flex-col xl:flex-row items-center xl:items-stretch justify-center gap-3 xl:gap-6 w-full" style={{borderColor:'var(--k-divider)'}}>
                                        <div class="flex-1 min-h-0 flex items-center justify-center gap-2 md:gap-3 w-full xl:w-auto">
                                            <FretStepper {...propsPasoNumTrastes} className="hidden md:flex" />

                                            <div class={"k-lienzo" + (modoAMano ? " k-lienzo--a-mano" : "")}>
                                        <DiagramaKharo escena={escenaDelEstudio()} interaccion={interaccionDelEstudio()} />
                                    </div>

                                            {/* Vaciar va encima de Posición: es lo que se usa
                                                al empezar otro acorde y estaba escondido en el «⋯». */}
                                            <div class="hidden md:flex flex-col items-center gap-3 shrink-0">
                                                {botonVaciar()}
                                                {botonTriadas()}
                                                <FretStepper {...propsPasoTraste} />
                                            </div>
                                        </div>

                                        {/* Los mismos dos ±, en móvil, en fila y debajo del
                                            mástil: a los lados taparían las cuerdas de fuera. */}
                                        <div class="md:hidden shrink-0 w-full flex flex-wrap items-center justify-around gap-x-2 gap-y-1">
                                            <FretStepper {...propsPasoNumTrastes} />
                                            <FretStepper {...propsPasoTraste} />
                                        </div>

                                        {/* La leyenda de grados, en columna (sólo Escalas y
                                            Arpegios, y sólo si cabe). Se enciende y se apaga
                                            desde Vista; su × apaga ese mismo interruptor. */}
                                        {renderIntervalLegend()}
                                    </div>
                                </div>

                                <p class="k-hint select-none text-center px-3 py-1">
                                    <span aria-hidden="true" style={{ color: 'var(--k-accent)' }}>●</span>
                                    {pistaDelLienzo()}
                                </p>
                            </div>

                            {/* El velo: sólo cuando el inspector es un cajón o una hoja
                                (por debajo de 1280 px). Tocar fuera lo cierra. */}
                            {inspectorAbierto && (
                                <div class="k2-velo" onClick={() => alternarInspector(false)} aria-hidden="true" />
                            )}

                            {/* --- EL INSPECTOR --- */}
                            {inspectorAbierto && (
                                <aside class="k2-inspector" aria-label="Ajustes del diagrama">
                                    <div class="k-sheet-handle md:hidden"></div>
                                    <div class="k2-inspector__cabeza">
                                        <PestanasInspector pestanas={PESTANAS_INSPECTOR} activa={pestanaInspector} onCambio={setPestanaInspector} />
                                        <BotonIcono icono="cerrar" etiqueta="Cerrar el panel" onClick={() => alternarInspector(false)} className="k2-cerrar-inspector" />
                                    </div>

                                    <div class="k2-inspector__cuerpo" role="tabpanel" id={`k2-panel-${pestanaInspector}`} aria-labelledby={`k2-tab-${pestanaInspector}`}>

                                        {/* ============ QUÉ TOCAR ============ */}
                                        {pestanaInspector === "tocar" && (
                                            <React.Fragment>
                                                {/* En el teléfono el tempo no cabe en la barra:
                                                    vive aquí arriba, que es lo primero que se abre. */}
                                                <div class="k2-solo-movil k2-bloque">
                                                    <div class="k2-tempo">{controlTempo("panel")}</div>
                                                </div>

                                                {appMode === "chord" && (
                                                    <React.Fragment>
                                                        <Seccion id="acorde-nombre" titulo="El acorde">
                                                            <Campo etiqueta="Nombre del acorde" ayuda={autoUpdateTitle ? "Se pone solo con lo que detecta en el mástil. Escríbelo tú para fijarlo." : undefined}>
                                                                {(id, ayuda) => (
                                                                    <input
                                                                        id={id}
                                                                        type="text"
                                                                        value={chordName}
                                                                        aria-describedby={ayuda}
                                                                        onChange={(e) => { setChordName(e.target.value); setAutoUpdateTitle(false); }}
                                                                        placeholder="Ej.: Cmaj7"
                                                                    />
                                                                )}
                                                            </Campo>
                                                            <Interruptor etiqueta="Nombrarlo solo" valor={autoUpdateTitle} onCambio={setAutoUpdateTitle} />
                                                        </Seccion>
                                                        <Seccion id="acordes-rapidos" titulo="Acordes rápidos">
                                                            <div class="k2-rejilla-botones">
                                                                {PRESETS.map(p => (
                                                                    <button key={p.name} type="button" onClick={() => { loadPreset(p); cerrarSiMovil(); }} class="k2-boton-rejilla">
                                                                        {p.name}
                                                                    </button>
                                                                ))}
                                                            </div>
                                                        </Seccion>
                                                        <Seccion id="acordes-tuyos" titulo={`Tu biblioteca · ${chordLibrary.length}`}>
                                                            {chordLibrary.length === 0 ? (
                                                                <p class="k2-ayuda">Aquí van a vivir tus acordes. Arma uno en el mástil y toca «Guardar acorde».</p>
                                                            ) : (
                                                                <ul class="k2-lista">
                                                                    {chordLibrary.map(c => (
                                                                        <li key={c.id} class="k2-lista__fila">
                                                                            <button type="button" onClick={() => { loadPreset(c); cerrarSiMovil(); }} class="k2-lista__principal">
                                                                                <span class="k2-lista__nombre">{c.name}</span>
                                                                                <span class="k2-lista__detalle">{getInstrument(c.instrument).name}</span>
                                                                            </button>
                                                                            <BotonBorrar onClick={() => removeChordFromLibrary(c.id)} title={`Quitar «${c.name}» de la biblioteca`} className="k2-icono-borrar" />
                                                                        </li>
                                                                    ))}
                                                                </ul>
                                                            )}
                                                        </Seccion>
                                                    </React.Fragment>
                                                )}

                                                {appMode === "scale" && (
                                                    <React.Fragment>
                                                        <Seccion id="escala" titulo="La escala">
                                                            <div class="k2-dos-columnas">
                                                                <Campo etiqueta="Tónica">
                                                                    {(id) => (
                                                                        <select id={id} value={scaleRoot} onChange={(e) => setScaleRoot(parseInt(e.target.value))}>
                                                                            {NOTE_NAMES.map((n, i) => <option key={i} value={i}>{n}</option>)}
                                                                        </select>
                                                                    )}
                                                                </Campo>
                                                                <Campo etiqueta="Escala">
                                                                    {(id) => (
                                                                        <select id={id} value={scaleType} onChange={(e) => setScaleType(e.target.value)}>
                                                                            {SCALE_PRESETS.map(sp => <option key={sp.id} value={sp.id}>{sp.name}</option>)}
                                                                            <option value="custom">Personalizada</option>
                                                                        </select>
                                                                    )}
                                                                </Campo>
                                                            </div>
                                                            {scaleType === "custom" && (
                                                                <div class="k2-bloque">
                                                                    <span class="k2-etiqueta" id="k2-formula">Fórmula: los intervalos que suenan</span>
                                                                    <div class="k2-rejilla-botones k2-rejilla-botones--4" role="group" aria-labelledby="k2-formula">
                                                                        {INTERVAL_DEGREES.map((deg, idx) => (
                                                                            <button
                                                                                key={deg}
                                                                                type="button"
                                                                                onClick={() => toggleCustomInterval(idx)}
                                                                                aria-pressed={!!customScaleIntervals[idx]}
                                                                                class={`k2-boton-rejilla ${customScaleIntervals[idx] ? "k2-boton-rejilla--on" : ""}`}
                                                                            >
                                                                                {deg}
                                                                            </button>
                                                                        ))}
                                                                    </div>
                                                                </div>
                                                            )}
                                                        </Seccion>
                                                        <Seccion id="triadas" titulo="Tríadas de la tonalidad">
                                                            <Interruptor
                                                                etiqueta="Mostrar las tríadas"
                                                                valor={scaleTriads}
                                                                desactivado={!hayTriadasEnLaEscala}
                                                                onCambio={activarTriadas}
                                                                ayuda={!hayTriadasEnLaEscala
                                                                    ? "Esta escala no llega a siete notas: no hay terceras que apilar."
                                                                    : scaleTriads
                                                                        ? "Elige la tríada en la tira de encima del mástil. «Mandar a Ejercicios» se la lleva con su escala alrededor."
                                                                        : "Los siete acordes que salen de la escala, para ver dónde se pisan."}
                                                            />
                                                        </Seccion>
                                                    </React.Fragment>
                                                )}

                                                {appMode === "arpeggio" && (
                                                    <React.Fragment>
                                                        <Seccion id="arpegio" titulo="El arpegio">
                                                            <div class="k2-dos-columnas">
                                                                <Campo etiqueta="Tónica">
                                                                    {(id) => (
                                                                        <select id={id} value={arpeggioRoot} onChange={(e) => setArpeggioRoot(parseInt(e.target.value))}>
                                                                            {NOTE_NAMES.map((n, i) => <option key={i} value={i}>{n}</option>)}
                                                                        </select>
                                                                    )}
                                                                </Campo>
                                                                <Campo etiqueta="Arpegio">
                                                                    {(id) => (
                                                                        <select id={id} value={arpeggioType} onChange={(e) => setArpeggioType(e.target.value)}>
                                                                            {ARPEGGIO_PRESETS.map(ap => <option key={ap.id} value={ap.id}>{ap.name}</option>)}
                                                                        </select>
                                                                    )}
                                                                </Campo>
                                                            </div>
                                                        </Seccion>
                                                        <Seccion id="agrupacion" titulo="Cómo agruparlo">
                                                            <Segmentado
                                                                etiqueta="Agrupación"
                                                                ancho
                                                                valor={arpGrouping}
                                                                onCambio={setArpGrouping}
                                                                opciones={[
                                                                    { id: "mapa", label: "Mapa", ayuda: "Todas las notas del arpegio por el mástil" },
                                                                    { id: "cuerdas", label: "Por cuerdas", ayuda: "Una nota por cuerda, en un juego de tres cuerdas" },
                                                                    { id: "posiciones", label: "Posiciones", ayuda: "Ventanas que empiezan donde aparece la tónica" }
                                                                ]}
                                                            />
                                                            {arpGrouping === "cuerdas" && (
                                                                <React.Fragment>
                                                                    <div class="k2-bloque">
                                                                        <Segmentado
                                                                            etiqueta="Cuerdas"
                                                                            envolver
                                                                            valor={arpStringSet}
                                                                            onCambio={setArpStringSet}
                                                                            opciones={window.KharoTheory.stringSets(numStrings).map((juego, i) => ({
                                                                                id: i,
                                                                                label: window.KharoTheory.stringSetName(juego, numStrings),
                                                                                ayuda: `La tríada en las cuerdas ${window.KharoTheory.stringSetName(juego, numStrings)}`
                                                                            }))}
                                                                        />
                                                                    </div>
                                                                    <div class="k2-bloque">
                                                                        <Segmentado
                                                                            etiqueta="Inversión"
                                                                            valor={arpInversion}
                                                                            onCambio={setArpInversion}
                                                                            opciones={[0, 1, 2].map(i => ({
                                                                                id: i,
                                                                                label: nombreDeInversion(i),
                                                                                ayuda: ["Con la fundamental en la cuerda más grave", "Con la tercera abajo", "Con la quinta abajo"][i]
                                                                            }))}
                                                                        />
                                                                    </div>
                                                                    <div class="k2-bloque">
                                                                        <Segmentado
                                                                            etiqueta="Tapping: una nota más, en la cuerda aguda"
                                                                            valor={arpTapping}
                                                                            onCambio={cambiarTapping}
                                                                            opciones={[
                                                                                { id: "none", label: "Sin tapping" },
                                                                                { id: "octava", label: "8.ª" },
                                                                                { id: "novena", label: "9.ª" }
                                                                            ]}
                                                                        />
                                                                    </div>
                                                                    <p class="k2-ayuda">Una nota por cuerda. Es lo que hace la forma tocable de una pasada.</p>
                                                                    {arpeggioRecortado && (
                                                                        <p class="k2-ayuda k2-ayuda--aviso">Por cuerdas se dibuja la tríada: la séptima no cabe en tres cuerdas con una nota cada una.</p>
                                                                    )}
                                                                </React.Fragment>
                                                            )}
                                                            {arpGrouping === "posiciones" && (
                                                                <div class="k2-bloque">
                                                                    <span class="k2-etiqueta">Ir a la posición</span>
                                                                    <div class="k2-rejilla-botones">
                                                                        {window.KharoTheory.neckPositions(
                                                                            Array.from({ length: numStrings }, (_, i) => stringBaseMIDI(i)),
                                                                            arpeggioRoot, 5, 17
                                                                        ).map((pos, i) => (
                                                                            <button
                                                                                key={i}
                                                                                type="button"
                                                                                onClick={() => { setStartingFret(clampStartingFret(pos.inicio + 1)); setNumFrets(clampNumFrets(pos.trastes)); }}
                                                                                class="k2-boton-rejilla"
                                                                            >
                                                                                {pos.nombre}
                                                                            </button>
                                                                        ))}
                                                                    </div>
                                                                    <p class="k2-ayuda">Cada ventana empieza donde aparece la tónica.</p>
                                                                </div>
                                                            )}
                                                        </Seccion>
                                                    </React.Fragment>
                                                )}

                                                {appMode === "free" && (
                                                    <React.Fragment>
                                                        <p class="k2-intro">El mástil está en blanco. Toca donde quieras, con tantas notas por cuerda como necesites, y las flechas irán marcando el orden.</p>
                                                        <Seccion id="guia" titulo="Escala de guía">
                                                            <Interruptor
                                                                etiqueta="Dibujar una escala de fondo"
                                                                valor={guiaEscala}
                                                                onCambio={setGuiaEscala}
                                                                ayuda="Sólo es una referencia: se dibuja apagada, no se puede pulsar y no entra ni en el recorrido ni en lo que suena."
                                                            />
                                                            {guiaEscala && (
                                                                <div class="k2-dos-columnas k2-bloque">
                                                                    <Campo etiqueta="Tónica">
                                                                        {(id) => (
                                                                            <select id={id} value={scaleRoot} onChange={(e) => setScaleRoot(parseInt(e.target.value))}>
                                                                                {NOTE_NAMES.map((n, i) => <option key={i} value={i}>{n}</option>)}
                                                                            </select>
                                                                        )}
                                                                    </Campo>
                                                                    <Campo etiqueta="Escala">
                                                                        {(id) => (
                                                                            <select id={id} value={scaleType} onChange={(e) => setScaleType(e.target.value)}>
                                                                                {SCALE_PRESETS.map(sp => <option key={sp.id} value={sp.id}>{sp.name}</option>)}
                                                                            </select>
                                                                        )}
                                                                    </Campo>
                                                                </div>
                                                            )}
                                                        </Seccion>
                                                    </React.Fragment>
                                                )}
                                            </React.Fragment>
                                        )}

                                        {/* ============ VISTA ============ */}
                                        {pestanaInspector === "vista" && (
                                            <React.Fragment>
                                                <Seccion id="vista-notas" titulo="Las notas muestran">
                                                    {appMode === "chord" && (
                                                        <Segmentado
                                                            etiqueta="Dentro de cada nota"
                                                            ancho
                                                            valor={chordDisplayMode}
                                                            onCambio={setChordDisplayMode}
                                                            opciones={[
                                                                { id: "diagram", label: "Dedos", ayuda: "El número del dedo que pisa" },
                                                                { id: "note", label: "Notas", ayuda: "El nombre de la nota" },
                                                                { id: "degree", label: "Grados", ayuda: "El grado respecto a la fundamental del acorde" }
                                                            ]}
                                                        />
                                                    )}
                                                    {(appMode === "scale" || appMode === "arpeggio") && (
                                                        <Segmentado
                                                            etiqueta="Dentro de cada nota"
                                                            ancho
                                                            valor={scaleDisplayMode}
                                                            onCambio={setScaleDisplayMode}
                                                            opciones={[
                                                                { id: "note", label: "Notas", ayuda: "El nombre de la nota" },
                                                                { id: "degree", label: "Grados", ayuda: "El grado respecto a la tónica" }
                                                            ]}
                                                        />
                                                    )}
                                                    {appMode === "free" && (
