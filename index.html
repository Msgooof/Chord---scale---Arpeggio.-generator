                    <div class="hidden xl:block xl:w-60 bg-slate-900/90 border border-slate-800 rounded-2xl p-4 space-y-3 shrink-0 shadow-lg self-auto transition-all">
                        <h4 class="text-xs font-bold uppercase tracking-widest border-b border-slate-800 pb-2 flex items-center justify-between w-full" style={{color:'var(--k-text-muted)'}}>
                            <span class="flex items-center gap-2">
                                <span class="w-2.5 h-2.5 rounded-full bg-indigo-500 animate-pulse"></span>
                                Leyenda de Intervalos
                            </span>
                            <BotonCerrar onClick={() => setShowLegend(false)} title="Ocultar leyenda" className="w-7 h-7" />
                        </h4>
                        <div class="space-y-2 max-h-[380px] overflow-y-auto pr-1">
                            {items.map((item, idx) => (
                                <div key={idx} class="flex items-center justify-between text-xs py-1.5 border-b border-slate-800/40 last:border-b-0 hover:bg-slate-800/40 px-1.5 rounded-lg transition-colors">
                                    <div class="flex items-center gap-2.5">
                                        <span 
                                            class="w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-black text-white shadow-sm shrink-0"
                                            style={{ backgroundColor: item.color }}
                                        >
                                            {item.degreeStr}
                                        </span>
                                        <div class="flex flex-col">
                                            <span class="font-semibold text-slate-200 text-[11px]">{item.degreeName}</span>
                                            <span class="text-[9px] text-slate-400">Grado {item.degreeStr}</span>
                                        </div>
                                    </div>
                                    <span class="font-mono font-bold text-indigo-400 bg-indigo-500/10 px-2 py-0.5 rounded border border-indigo-500/20 text-[10px] shrink-0">
                                        {item.noteName}
                                    </span>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            };

            // --- GEOMETRÍA DEL DIAGRAMA (calculada en render-core.js) ---
            const {
                width, height,
                paddingTop, paddingBottom, paddingLeft, paddingRight,
                gridWidth, gridHeight,
                stringSpacing,
                fretWeights, fretHeights, fretYPositions
            } = computeDiagramGeometry({
                numStrings,
                numFrets,
                startingFret,
                dotRadius: dotRadiusStyle
            });

            const dynamicTitleFontSize = computeTitleFontSize(chordName);

            /* --- DIBUJO DEL RECORRIDO -------------------------------------
             *
             * Une las notas en el orden en que se tocan. Se dibuja aquí, y no
             * en un div encima, porque forma parte del diagrama: lo que se ve
             * es lo que se exporta.
             *
             * Cada segmento se recorta a la altura del punto para que la línea
             * no se meta debajo de la nota y la punta de flecha quede visible.
             * -------------------------------------------------------------- */
            /* --- LA Y DE UNA CASILLA, O NADA --------------------------------
             *
             * `fretYPositions` tiene `numFrets + 1` entradas. Con una nota en un
             * traste que ya no se dibuja, `fretYPositions[f]` es `undefined` y
             * toda la aritmética sale `NaN`.
             *
             * Lo malo no era el error de consola: la nota desaparecía de la
             * vista pero SEGUÍA contando —entraba en el análisis del acorde,
             * sonaba al rasguear, y viajaba en el SVG exportado con `cy="NaN"`—.
             * El fallo silencioso, por el otro extremo.
             *
             * El clamp del stepper impide llegar aquí; esto es el cinturón, para
             * que ningún camino que no hayamos previsto —cargar un preset, abrir
             * un paso, restaurar una foto— escriba un `NaN` en el archivo.
             * ---------------------------------------------------------------- */
            const yDeTraste = (f) => {
                // El traste 0 es la cuerda al aire, que se dibuja sobre la cejuela.
                if (f === 0) return paddingTop - 20;
                const arriba = fretYPositions[f - 1];
                const abajo = fretYPositions[f];
                if (arriba === undefined || abajo === undefined) return null;
                return arriba + (abajo - arriba) / 2;
            };

            const posicionEnLienzo = (p) => ({
                x: paddingLeft + p.s * stringSpacing,
                y: yDeTraste(p.f)
            });

            const renderNotePath = () => {
                if (!showPath || appMode === "chord") return null;

                const recorrido = recorridoActual();
                if (recorrido.length < 2) return null;

                const margen = dotRadiusStyle + 3;
                const segmentos = [];

                /* Con la vuelta puesta, la ida y el regreso pasan por el mismo
                 * sitio: dos líneas exactamente encima, con las puntas en
                 * sentidos contrarios, que el ojo lee como una sola flecha
                 * rota. Se cuenta cuántas veces se recorre cada tramo para
                 * poder separarlas por la perpendicular. La clave no mira el
                 * sentido: ir de A a B y volver de B a A es el mismo tramo. */
                const claveDelTramo = (p, q) => {
                    const a = `${p.s}:${p.f}`;
                    const b = `${q.s}:${q.f}`;
                    return a < b ? `${a}|${b}` : `${b}|${a}`;
                };
                const vecesPorTramo = new Map();
                for (let i = 0; i < recorrido.length - 1; i++) {
                    const k = claveDelTramo(recorrido[i], recorrido[i + 1]);
                    vecesPorTramo.set(k, (vecesPorTramo.get(k) || 0) + 1);
                }
                const vistosPorTramo = new Map();

                for (let i = 0; i < recorrido.length - 1; i++) {
                    const a = posicionEnLienzo(recorrido[i]);
                    const b = posicionEnLienzo(recorrido[i + 1]);
                    // Un extremo fuera de la ventana no dibuja tramo. Sin esto
                    // la cuenta sale NaN y se va tal cual al archivo exportado.
                    if (a.y === null || b.y === null) continue;

                    const dx = b.x - a.x;
                    const dy = b.y - a.y;
                    const largo = Math.hypot(dx, dy);
                    // Dos notas en la misma posición no dibujan segmento.
                    if (largo <= margen * 2) continue;

                    const ux = dx / largo;
                    const uy = dy / largo;

                    // Punta de flecha dibujada a mano, no con <marker>: los
                    // marcadores necesitan un id, y un id repetido entre dos
                    // SVG de la misma página se pisa. Un polígono no.
                    const puntaLargo = 7;
                    const puntaAncho = 4;
                    const px = -uy;
                    const py = ux;

                    /* Los tramos que se repiten se apartan de su eje, medio
                     * desvío cada uno a un lado, para que se vean los dos.
                     *
                     * OJO CON LA PERPENDICULAR: `px,py` sale de la dirección
                     * de ESTE segmento, y la vuelta va al revés, así que su
                     * perpendicular también. Desplazando con ella, la ida y la
                     * vuelta se apartan al MISMO lado y vuelven a solaparse
                     * exactamente. Por eso el desvío se mide contra un sentido
                     * canónico —el de la clave del tramo—, que es igual para
                     * las dos pasadas. */
                    const claveIda = `${recorrido[i].s}:${recorrido[i].f}`;
                    const claveVuelta = `${recorrido[i + 1].s}:${recorrido[i + 1].f}`;
                    const clave = claveDelTramo(recorrido[i], recorrido[i + 1]);
                    const cuantos = vecesPorTramo.get(clave) || 1;
                    const cual = vistosPorTramo.get(clave) || 0;
                    vistosPorTramo.set(clave, cual + 1);
                    const desvio = cuantos > 1
                        ? (cual - (cuantos - 1) / 2) * (lineWidthStyle * 2 + 2)
                        : 0;
                    const sentido = claveIda < claveVuelta ? 1 : -1;
                    const nx = px * sentido;
                    const ny = py * sentido;

                    const x1 = a.x + ux * margen + nx * desvio;
                    const y1 = a.y + uy * margen + ny * desvio;
                    const x2 = b.x - ux * margen + nx * desvio;
                    const y2 = b.y - uy * margen + ny * desvio;

                    /* Moverse por una cuerda y saltar a otra no son lo mismo:
                     * lo primero lo hacen los dedos, lo segundo la mano entera.
                     * El salto va a trazos y más flojo, para que el ojo separe
                     * el patrón del desplazamiento. Sin esa distinción, una
                     * escala entera es una maraña de diagonales. */
                    /* En sweep NO hay salto: cruzar de cuerda es parte del
                     * mismo movimiento de púa, así que la línea va entera. */
                    const esSalto = !arpSweep && recorrido[i].s !== recorrido[i + 1].s;

                    segmentos.push(
                        <g key={`path-${i}`}>
                            <line
                                x1={x1} y1={y1} x2={x2} y2={y2}
                                stroke={style.pathColor}
                                strokeWidth={esSalto ? lineWidthStyle * 0.7 : lineWidthStyle}
                                strokeLinecap="round"
                                strokeDasharray={esSalto ? "4 3" : undefined}
                                opacity={esSalto ? 0.45 : 0.85}
                            />
                            <polygon
                                points={`${x2},${y2} ${x2 - ux * puntaLargo + px * puntaAncho},${y2 - uy * puntaLargo + py * puntaAncho} ${x2 - ux * puntaLargo - px * puntaAncho},${y2 - uy * puntaLargo - py * puntaAncho}`}
                                fill={style.pathColor}
                                opacity={esSalto ? 0.45 : 0.85}
                            />
                            {/* La zona de agarre: invisible, gorda, y la única
                                del recorrido que recibe eventos. Es lo que hace
                                que se pueda apuntar a UNA flecha sin que la
                                capa entera tape las notas de debajo.

                                `stroke="transparent"` es obligatorio: con
                                `stroke="none"` no hay trazo que golpear y
                                `pointerEvents="stroke"` no engancha nada. */}
                            <line
                                data-transient="1"
                                x1={x1} y1={y1} x2={x2} y2={y2}
                                stroke="transparent"
                                strokeWidth="12"
                                strokeLinecap="round"
                                pointerEvents="stroke"
                                style={{ cursor: "context-menu" }}
                                onContextMenu={(e) => {
                                    e.preventDefault();
                                    setMenuFlecha({ i, x: e.clientX, y: e.clientY });
                                }}
                            />
                        </g>
                    );
                }

                const inicio = posicionEnLienzo(recorrido[0]);

                return (
                    /* La capa entera es transparente al puntero. Se pinta
                     * ENCIMA de las notas —para que se lean las flechas—, y sin
                     * esto se comería cualquier gesto sobre ellas: no se podría
                     * ni pulsar una nota tapada por una línea, ni mucho menos
                     * arrastrarla. Las zonas de agarre de cada segmento vuelven
                     * a activarlo para sí mismas. */
                    <g pointerEvents="none">
                        {segmentos}
                        {/* Dónde empieza. Sin esta marca, en un recorrido que
                            sube y baja no se sabe por qué punta empezar. */}
                        {inicio.y !== null && <circle
                            cx={inicio.x}
                            cy={inicio.y}
                            r={dotRadiusStyle + 4}
                            fill="none"
                            stroke={style.pathColor}
                            strokeWidth={lineWidthStyle}
                            strokeDasharray="3 2"
                            opacity="0.9"
                        />}
                    </g>
                );
            };

            /* --- LOS ANILLOS DE LAS TRÍADAS ---------------------------------
             *
             * Se calcula UNA vez por render y no por punto: son siete grados
             * por hasta veinticuatro posiciones, y volver a cruzarlo dentro
             * del bucle de notas lo convertía en un cuadrado.
             * --------------------------------------------------------------- */
            /* Con menos de siete notas no hay terceras que apilar, así que no
             * hay grados. `diatonicChords` ya lo dice devolviendo [], pero el
             * interruptor tiene que saberlo ANTES de encenderse: ofrecerlo y
             * que no pase nada es peor que no ofrecerlo. */
            const hayTriadasEnLaEscala = appMode === "scale" && window.KharoTheory.diatonicChords(
                scaleRoot,
                getActiveScaleIntervals().map((activo, i) => activo ? i : -1).filter(i => i >= 0)
            ).length > 0;

            const triadasVisibles = triadasDiatonicas();

            const posicionesDelGradoSenalado = (() => {
                if (gradoTriada === null) return null;
                const g = triadasVisibles.find(x => x.grado === gradoTriada);
                if (!g) return null;
                return new Set(g.posiciones.map(p => `${p.s}-${p.f}`));
            })();

            /* Con un grado señalado, lo que no es suyo se apaga. Es lo que
             * deja VER la tríada dentro de la escala en vez de buscarla. */
            const opacidadPorTriada = (s, f) => (
                posicionesDelGradoSenalado && !posicionesDelGradoSenalado.has(`${s}-${f}`) ? 0.15 : 1
            );

            /* --- LA ENVOLVENTE DE CADA TRÍADA -------------------------------
             *
             * Una mancha que RODEA la tríada entera, no un aro por nota. La
             * primera versión marcaba cada nota por separado y eso contestaba
             * «esta nota es de vi», que no es la pregunta: la pregunta es dónde
             * está la tríada en el mástil, y para verla como una cosa hay que
             * dibujarla como una cosa.
             *
             * Las notas del grado se agrupan por CERCANÍA —cuerdas contiguas y
             * como mucho dos trastes de separación—, que es lo que la mano
             * alcanza sin moverse. Un grado suele dar dos o tres manchas en la
             * ventana: las posiciones donde ese acorde se toca.
             *
             * No se exige una nota por cuerda. Eso es la condición del sweep y
             * vive en Arpegios (§16); aquí se trata de ver la zona.
             * --------------------------------------------------------------- */



            /* Las envolventes van DEBAJO de las notas, entre la rejilla y los
             * puntos: son el fondo sobre el que se leen, no algo encima. */
            const renderEnvolventesDeTriadas = () => {
                if (triadasVisibles.length === 0) return null;

                // El grueso de la banda. Un trazo redondeado de este ancho sobre
                // el casco, más el relleno, da exactamente la goma elástica
                // alrededor de los puntos, sin tener que desplazar aristas.
                const margen = dotRadiusStyle + 5;

                return (
                    <g>
                        {triadasVisibles.map((g, gi) => {
                            const hayUnoSenalado = gradoTriada !== null;
                            const esElSenalado = gradoTriada === g.grado;
                            const color = DEFAULT_STYLE.triadRingColors[gi % DEFAULT_STYLE.triadRingColors.length];

                            /* En reposo se ven las siete a la vez, pero muy
                             * flojas: catorce manchas a plena tinta serían una
                             * sopa de colores. Ahí valen para decir «aquí hay
                             * tríadas»; la lectura llega al señalar una. */
                            const opacidad = !hayUnoSenalado ? 0.09 : (esElSenalado ? 0.36 : 0.03);

                            return (
                                <g key={`triada-${g.grado}`} opacity={opacidad} pointerEvents="none">
                                    {zonasDeUnGrado(g.posiciones).map((zona, zi) => {
                                        const mancha = trazoDeMancha(zona.map(p => posicionEnLienzo(p)));
                                        if (!mancha) return null;
                                        return (
                                            <path
                                                key={zi}
                                                d={mancha.d}
                                                fill={mancha.cerrado ? color : "none"}
                                                stroke={color}
                                                strokeWidth={margen * 2}
                                                strokeLinejoin="round"
                                                strokeLinecap="round"
                                            />
                                        );
                                    })}
                                </g>
                            );
                        })}
                    </g>
                );
            };

            /* La tira de grados, pegada al mástil. Es el control PRIMARIO y no
             * un adorno: las envolventes son tenues y en un teléfono no existe
             * «pasar el ratón por encima», así que la única forma fiable de
             * aislar una tríada en cualquier pantalla es tocar su ficha.
             *
             * TRES GESTOS, TRES COSAS DISTINTAS:
             *
             *   pasar por encima   la enseña mientras el ratón esté ahí
             *   clic               la FIJA, y se queda puesta al apartarse
             *   clic derecho       abre el menú: verla como arpegio o mandarla
             *                      a practicar
             *
             * Antes el clic saltaba directamente a Arpegios, y eso hacía que
             * mirar una tríada con calma —que es para lo que sirve esto— fuera
             * imposible con el dedo: el primer toque la enseñaba y el segundo
             * te sacaba de la pantalla. Fijar y actuar son cosas distintas y
             * ahora son gestos distintos.
             */
            const piezaTriadas = () => {
                if (appMode !== "scale" || !scaleTriads || triadasVisibles.length === 0) return null;

                return (
                    <div class="w-full shrink-0 k-strip">
                        <div
                            class="flex items-center gap-1.5 px-1 py-1"
                            // Al salir se vuelve a la que esté FIJADA, no a nada:
                            // si no, fijar una y apartar el ratón la apagaría.
                            onMouseLeave={() => setGradoTriada(gradoFijado)}
                        >
                            <span class="k-label shrink-0 mr-1">Tríadas</span>
                            {triadasVisibles.map((g, gi) => {
                                const color = DEFAULT_STYLE.triadRingColors[gi % DEFAULT_STYLE.triadRingColors.length];
                                const senalada = gradoTriada === g.grado;
                                const fijada = gradoFijado === g.grado;
                                return (
                                    <button
                                        key={g.grado}
                                        onMouseEnter={() => setGradoTriada(g.grado)}
                                        onFocus={() => setGradoTriada(g.grado)}
                                        onClick={() => {
                                            const quitar = gradoFijado === g.grado;
                                            setGradoFijado(quitar ? null : g.grado);
                                            setGradoTriada(quitar ? null : g.grado);
                                        }}
                                        onContextMenu={(e) => {
                                            e.preventDefault();
                                            setGradoTriada(g.grado);
                                            setMenuTriada({ grado: g.grado, x: e.clientX, y: e.clientY });
                                        }}
                                        class="k-chip shrink-0"
                                        style={{
                                            cursor: 'pointer',
                                            border: `1.5px solid ${color}`,
                                            outline: fijada ? `2px solid ${color}` : 'none',
                                            outlineOffset: '1px',
                                            backgroundColor: senalada ? color : 'transparent',
                                            color: senalada ? '#ffffff' : 'inherit'
                                        }}
                                        title={`${g.romano} · ${g.triada} — clic para dejarla puesta, clic derecho para abrirla o mandarla a un ejercicio`}
                                    >
                                        <strong>{g.romano}</strong>
                                        <span class="ml-1 opacity-70">{g.triada}</span>
                                    </button>
                                );
                            })}

                            {/* El mismo menú, para quien no tiene clic derecho.
                                En un teléfono, sin esto las dos acciones no
                                existirían. Sale sólo en la ficha fijada, para no
                                repetir siete veces el mismo botón. */}
                            {gradoFijado !== null && (
                                <button
                                    onClick={(e) => setMenuTriada({ grado: gradoFijado, x: e.clientX, y: e.clientY })}
                                    class="k-btn k-btn--outline k-btn--touch shrink-0 text-[11px] px-2.5 py-1.5"
                                    title="Qué hacer con la tríada fijada"
                                >
                                    ⋯
                                </button>
                            )}
                        </div>
                    </div>
                );
            };

            // --- EXPORT FUNCTIONS ---

            /* El diagrama listo para salir, sin lo que sólo existe mientras se
             * está usando la app.
             *
             * Hasta ahora dos de las tres exportaciones serializaban el nodo
             * VIVO, que era la garantía de que lo que ves es lo que te llevas.
             * Sigue siéndolo: lo único que se quita son los nodos marcados
             * `data-transient`, que no son parte del dibujo sino del gesto que
             * lo está editando —la línea fantasma mientras arrastras una
             * flecha—. Sin esto, exportar a media edición se llevaría un
             * garabato que no está en el diagrama. */
            const svgParaExportar = () => {
                const svgEl = document.getElementById("chord-diagram-svg");
                if (!svgEl) return null;
                const clon = svgEl.cloneNode(true);
                clon.querySelectorAll("[data-transient]").forEach(n => n.remove());
                return clon;
            };

            const exportPNG = () => {
                const svgEl = svgParaExportar();
                if (!svgEl) return;
                const svgData = new XMLSerializer().serializeToString(svgEl);
                const scale = 3;
                const canvas = document.createElement("canvas");
                canvas.width = width * scale;
                canvas.height = height * scale;
                const ctx = canvas.getContext("2d");
                const img = new Image();
                const svgBlob = new Blob([svgData], { type: "image/svg+xml;charset=utf-8" });
                const url = URL.createObjectURL(svgBlob);
                img.onload = () => {
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    URL.revokeObjectURL(url);
                    const a = document.createElement("a");
                    a.download = `${chordName || "diagrama"}_kharo.png`;
                    a.href = canvas.toDataURL("image/png");
                    a.click();
                    showToast("PNG descargado correctamente");
                };
                img.src = url;
            };

            const exportSVG = () => {
                const svgEl = svgParaExportar();
                if (!svgEl) return;
                const svgData = new XMLSerializer().serializeToString(svgEl);
                const blob = new Blob([svgData], { type: "image/svg+xml;charset=utf-8" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.download = `${chordName || "diagrama"}_kharo.svg`;
                a.href = url;
                a.click();
                URL.revokeObjectURL(url);
                showToast("SVG descargado correctamente");
            };

            const exportSVGForIllustrator = () => {
                const clone = svgParaExportar();
                if (!clone) return;
                clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
                clone.setAttribute("xmlns:xlink", "http://www.w3.org/1999/xlink");
                clone.setAttribute("version", "1.1");
                const svgData = '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(clone);
                const blob = new Blob([svgData], { type: "image/svg+xml;charset=utf-8" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.download = `${chordName || "diagrama"}_kharo_ai.svg`;
                a.href = url;
                a.click();
                URL.revokeObjectURL(url);
                showToast("SVG para Illustrator descargado");
            };

            /* --- PIEZAS QUE CAMBIAN DE SITIO SEGÚN LA PANTALLA -------------
             *
             * En escritorio la barra de estado enseña todo en fila. En móvil
             * no cabe: apilada se comía un tercio de la pantalla, así que sólo
             * quedan el nombre y el botón de sonar, y lo demás se despliega con
             * el ⋯. Las piezas se declaran una vez y se colocan en los dos
             * sitios: duplicar el JSX es garantizar que se desincronicen.
             * --------------------------------------------------------------- */
            const piezaTempo = (clase) => (
                <div class={`flex items-center gap-1.5 ${clase || ""}`}>
                    <span class="k-label text-[9px]">Tempo:</span>
                    <input
                        type="range"
                        min="30"
                        max="240"
                        value={tempoBpm}
                        onChange={(e) => setTempoBpm(parseInt(e.target.value))}
                        class="w-20 sm:w-16 h-1 rounded-lg cursor-pointer"
                        style={{accentColor:'var(--k-highlight)', backgroundColor:'var(--k-surface-raised)'}}
                        title="Pulsos por minuto (negras). Las escalas y arpegios suenan en corcheas"
                    />
                    <span class="k-mono k-value text-[10px] w-12 text-right">{tempoBpm} bpm</span>
                    {/* Lo que el tempo hace REALMENTE en modo Acorde: separar las
                       cuerdas del rasgueo. Decir sólo «bpm» ahí era prometer un
                       metrónomo donde lo que hay es un gesto de la mano. */}
                    {appMode === "chord" && (
                        <span class="k-mono text-[9px] w-14 text-right" style={{ color: 'var(--k-text-faint)' }}>
                            {Math.round(separacionRasgueo * 1000)} ms/cuerda
                        </span>
                    )}
                </div>
            );

            const piezaModosVista = (clase) => {
                if (!modoEditable) return null;
                /* «Grados» sólo en Acordes: se cuentan respecto a la fundamental
                 * del acorde detectado, y en Libre no hay acorde que detectar.
                 * En Libre el nombre de la nota va siempre puesto, así que la
                 * pieza no aparece. */
                if (appMode === "free") return null;
                const modos = [
                    { id: "diagram", label: "Diagrama" },
                    { id: "note", label: "Notas" },
                    { id: "degree", label: "Grados" }
                ];
                return (
                    <div class={`k-tabs ${clase || ""}`} style={{borderColor:'rgba(var(--k-accent-rgb),0.4)'}}>
                        {modos.map(m => (
                            <button
                                key={m.id}
                                onClick={() => setChordDisplayMode(m.id)}
                                class={`k-tab text-[10px] ${chordDisplayMode === m.id ? "k-tab--active" : ""}`}
                            >
                                {m.label}
                            </button>
                        ))}
                    </div>
                );
            };

            const piezaVaciar = (clase) => {
                if (!modoEditable) return null;
                return (
                    <button
                        onClick={() => { clearAll(); }}
                        class={`k-btn k-btn--outline k-btn--touch text-[10px] px-2.5 py-1.5 ${clase || ""}`}
                    >
                        Vaciar
                    </button>
                );
            };

            // El puente entre el mástil y la canción: guarda la digitación que
            // hay puesta para poder usarla luego en una progresión.
            const piezaGuardarAcorde = (clase) => {
                if (appMode !== "chord") return null;
                return (
                    <button
                        onClick={saveChordToLibrary}
                        class={`k-btn k-btn--primary k-btn--touch text-[10px] px-2.5 py-1.5 ${clase || ""}`}
                        title="Guardar esta digitación para usarla en una canción"
                    >
                        + Guardar acorde
                    </button>
                );
            };

            /* --- LEYENDA Y RECORRIDO, EN UN SOLO SITIO ---------------------
             * Estos dos bloques son idénticos en Escalas y en Arpegios, y
             * estaban COPIADOS palabra por palabra en los dos paneles: 82
             * líneas duplicadas. Cada control nuevo del recorrido había que
             * escribirlo dos veces, y bastaba olvidarse de una para que los
             * dos modos dejaran de ofrecer lo mismo.
             * --------------------------------------------------------------- */
            const piezaLeyendaYRecorrido = () => (
                <React.Fragment>
                    {/* MEJORA: Interruptor de leyenda de intervalos.
                        En Libre no hay grados que listar, así que no se pinta. */}
                    <div class={"pt-2 border-t border-slate-800/60 items-center justify-between " + (appMode === "free" ? "hidden" : "flex")}>
                        <span class="text-[11px] font-semibold text-slate-400">Mostrar Leyenda</span>
                        <button
                            onClick={() => setShowLegend(!showLegend)}
                            class={`relative inline-flex h-5 w-9 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none ${showLegend ? 'bg-indigo-600' : 'bg-slate-800'}`}
                        >
                            <span class={`pointer-events-none inline-block h-4 w-4 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out ${showLegend ? 'translate-x-4' : 'translate-x-0'}`} />
                        </button>
                    </div>
                    {/* --- RECORRIDO DE NOTAS ---
                        En qué orden se tocan. Es lo que convierte
                        el mapa en un ejercicio, así que manda a la
                        vez sobre las flechas y sobre lo que suena. */}
                    <div class="pt-2 border-t border-slate-800/60 space-y-2">
                        <div class="flex items-center justify-between">
                            <span class="text-[11px] font-semibold text-slate-400">Flechas del recorrido</span>
                            <button
                                onClick={() => setShowPath(!showPath)}
                                class={`relative inline-flex h-5 w-9 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none ${showPath ? 'bg-indigo-600' : 'bg-slate-800'}`}
                            >
                                <span class={`pointer-events-none inline-block h-4 w-4 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out ${showPath ? 'translate-x-4' : 'translate-x-0'}`} />
                            </button>
                        </div>

                        {showPath && (
                            <div class="space-y-2">
                                <div class="k-tabs">
                                    <button
                                        onClick={() => { setPathCriterio("digitacion"); setPathManual(null); }}
                                        class={`k-tab text-[10px] ${!pathManual && pathCriterio === "digitacion" ? "k-tab--active" : ""}`}
                                        title="Cuerda por cuerda, de la más grave a la más aguda"
                                    >
                                        Digitación
                                    </button>
                                    <button
                                        onClick={() => { setPathCriterio("altura"); setPathManual(null); }}
                                        class={`k-tab text-[10px] ${!pathManual && pathCriterio === "altura" ? "k-tab--active" : ""}`}
                                        title="De la nota más grave a la más aguda"
                                    >
                                        Altura
                                    </button>
                                    <button
                                        onClick={() => setEditandoPath(!editandoPath)}
                                        class={`k-tab text-[10px] ${editandoPath ? "k-tab--active" : ""}`}
                                        title="Tocar las notas en el orden que quieras"
                                    >
                                        A mano
                                    </button>
                                </div>

                                {editandoPath && appMode !== "free" && (
                                    <p class="text-[10px]" style={{ color: 'var(--k-highlight)' }}>
                                        Toca las notas del mástil en el orden que quieras.
                                        Tocar una que ya está la saca del recorrido.
                                        Arrastra de una nota a otra para que vayan seguidas.
                                    </p>
                                )}

                                {editandoPath && appMode === "free" && (
                                    <p class="text-[10px]" style={{ color: 'var(--k-highlight)' }}>
                                        Toca una nota y se añade al final del recorrido, aunque ya
                                        estuviera: así se escriben notas pedal y vueltas atrás.
                                        Arrastra de una a otra para que vayan seguidas, y usa el
                                        clic derecho para quitar.
                                    </p>
                                )}

                {/* El interruptor «Modo libre» vivía AQUÍ, a tres niveles de
                                    profundidad: toolbar → panel → flechas encendidas. La parte
                                    más libre de la app era la que no se veía. Ahora es una
                                    pestaña, «Libre», al lado de Acordes. */}

                                {/* --- CUÁNTAS NOTAS POR CUERDA ---
                                    Sin tope, en un mástil de 20 trastes el
                                    recorrido baja veinte notas por la misma
                                    cuerda antes de cambiarse, y eso no lo toca
                                    nadie: se practica bajando tres, saltando de
                                    cuerda y siguiendo. Como mucho tres, y en
                                    cualquier mástil. */}
                                <div>
                                    <span class="k-label block mb-1">Notas por cuerda</span>
                                    <div class="k-tabs">
                                        {[
                                            { v: 1, label: "1" },
                                            { v: 2, label: "2" },
                                            { v: 3, label: "3" },
                                            { v: 0, label: "Todas" }
                                        ].map(op => (
                                            <button
                                                key={op.v}
                                                onClick={() => { setPathNotasPorCuerda(op.v); setPathManual(null); }}
                                                class={`k-tab text-[10px] ${!pathManual && pathNotasPorCuerda === op.v ? "k-tab--active" : ""}`}
                                                title={op.v === 0
                                                    ? "Sin tope: todas las notas que haya en la cuerda"
                                                    : `Como mucho ${op.v} nota${op.v > 1 ? "s" : ""} por cuerda, y luego se cambia de cuerda`}
                                            >
                                                {op.label}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div class="flex items-center justify-between">
                                    <span class="text-[11px] font-semibold text-slate-400" title="Sube y vuelve a bajar por el mismo camino, que es como se estudia">
                                        Ida y vuelta
                                    </span>
                                    <button
                                        onClick={() => { setPathRetorno(!pathRetorno); setPathManual(null); }}
                                        class={`relative inline-flex h-5 w-9 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none ${pathRetorno ? 'bg-indigo-600' : 'bg-slate-800'}`}
                                    >
                                        <span class={`pointer-events-none inline-block h-4 w-4 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out ${pathRetorno ? 'translate-x-4' : 'translate-x-0'}`} />
                                    </button>
                                </div>

                                <button
                                    onClick={crearPasoDeEjercicio}
                                    class="k-btn k-btn--outline w-full text-[10px] py-1.5"
                                    title="Guardar esta digitación con su recorrido como un paso de ejercicio"
                                >
                                    → Crear ejercicio
                                </button>

                                <div class="flex items-center justify-between gap-2">
                                    <span class="text-[10px] text-slate-500">
                                        {pathManual
                                            ? `${pathManual.length} notas, a mano`
                                            : `${recorridoActual().length} notas, automático`}
                                    </span>
                                    {pathManual && (
                                        <button
                                            onClick={reiniciarRecorrido}
                                            class="k-btn k-btn--ghost text-[10px] px-2 py-1"
                                        >
                                            Reiniciar
                                        </button>
                                    )}
                                </div>
                            </div>
                        )}
                    </div>
                </React.Fragment>
            );

            /* --- SWEEP, FUERA DEL SUBMENÚ ----------------------------------
             * Vivía dentro de Arpegios → Por cuerdas, a tres clics, cuando es
             * de lo que más se enciende y se apaga. Y lo que dice no es de la
             * agrupación: dice que cruzar de cuerda es parte del mismo
             * movimiento de púa, así que las flechas van enteras en vez de a
             * trazos. Eso vale igual en una escala tocada con economy picking,
             * y por eso aquí también aparece en modo Escala.
             *
             * Sólo con las flechas encendidas: sin recorrido dibujado no
             * gobierna nada que se vea, y un interruptor que no hace nada
             * visible es peor que no tenerlo.
             * --------------------------------------------------------------- */
            const piezaSweep = (clase) => {
                if (appMode === "chord" || !showPath) return null;
                return (
                    <button
                        onClick={() => setArpSweep(v => !v)}
                        aria-pressed={arpSweep}
                        class={`k-btn k-btn--touch text-[10px] px-2.5 py-1.5 ${arpSweep ? "k-btn--primary" : "k-btn--outline"} ${clase || ""}`}
                        title="Sweep: cruzar de cuerda es parte del mismo movimiento de púa, así que las flechas se dibujan enteras"
                    >
                        Sweep
                    </button>
                );
            };

            /* --- TRÍADAS, FUERA DEL SUBMENÚ --------------------------------
             * Mismo caso que Sweep, y misma solución. La tira de tríadas ya
             * vivía pegada al mástil, pero el interruptor que la enciende
             * estaba a tres clics dentro del panel de Escala: había que abrir
             * el panel, encenderla, cerrar el panel para ver el mástil, y
             * repetirlo entero para apagarla.
             *
             * Desactivado cuando la escala no llega a siete notas: sin siete
             * grados no hay terceras que apilar, y un botón que no puede hacer
             * nada tiene que decirlo, no fallar en silencio.
             * --------------------------------------------------------------- */
            const piezaTriadasToggle = (clase) => {
                if (appMode !== "scale") return null;
                return (
                    <button
                        onClick={() => { setScaleTriads(!scaleTriads); setGradoTriada(null); setGradoFijado(null); setMenuTriada(null); }}
                        disabled={!hayTriadasEnLaEscala}
                        aria-pressed={scaleTriads}
                        class={`k-btn k-btn--touch text-[10px] px-2.5 py-1.5 ${scaleTriads ? "k-btn--primary" : "k-btn--outline"} ${clase || ""}`}
                        title={hayTriadasEnLaEscala
                            ? "Los siete acordes que salen de la escala, para ver en qué se pisan"
                            : "Esta escala no llega a siete notas: no hay terceras que apilar"}
                    >
                        Tríadas
                    </button>
                );
            };

            /* Los dos ± del mástil. Mismas propiedades, dos colocaciones: en
             * escritorio flanquean el diagrama, y en móvil van en una fila
             * propia debajo — a los lados no caben sin taparlo. */
            const propsPasoTraste = {
                label: "Posición",
                modo: "direccion",
                value: startingFret,
                min: MIN_FRET,
                max: MAX_FRET,
                onStep: (d) => setStartingFret(prev => clampStartingFret(prev + d)),
                titleUp: "Mover la ventana hacia la cejuela",
                titleDown: "Mover la ventana hacia el puente"
            };

            /* El traste más alto que hay DIBUJADO ahora mismo, en cualquiera de
             * los dos mástiles editables. Es el suelo real de la ventana: por
             * debajo de él habría notas fuera, que es de donde salían los `NaN`.
             *
             * Cuenta los dos mástiles y las cejillas a propósito. Reducir la
             * ventana desde Libre y volver a Acordes con notas del acorde fuera
             * es el mismo fallo, sólo que se descubre más tarde. */
            const trasteMasAltoDibujado = () => {
                let alto = 0;
                dots.forEach(d => { if (d.f > alto) alto = d.f; });
                dotsLibre.forEach(d => { if (d.f > alto) alto = d.f; });
                barres.forEach(b => { if (b.fret > alto) alto = b.fret; });
                return alto;
            };

            const propsPasoNumTrastes = {
                label: "Trastes",
                modo: "cantidad",
                value: numFrets,
                min: MIN_NUM_FRETS,
                max: MAX_NUM_FRETS,
                onStep: (d) => {
                    const pedido = clampNumFrets(numFrets + d);
                    const suelo = trasteMasAltoDibujado();
                    /* Se dice en vez de hacerlo a medias. Antes la ventana
                     * encogía igual y la nota se quedaba fuera: invisible, pero
                     * sonando y viajando al archivo exportado. */
                    if (pedido < suelo) {
                        showToast(`Hay una nota en el traste ${suelo}: la ventana no puede encoger más`);
                        return;
                    }
                    setNumFrets(pedido);
                },
                titleUp: "Ver un traste menos",
                titleDown: "Ver un traste más"
            };

            /* El estilo del diagrama, disponible en todo el árbol. Lo leen la
             * miniatura de la biblioteca, el mástil de la hoja de tonalidad y
             * la ficha de ejercicio, que viven en otro bloque y a los que
             * bajarlo a mano serían seis props cruzando ocho componentes que no
             * pintan nada con ellas. */
            return (
                <StyleContext.Provider value={style}>
                <div class="flex-1 flex flex-col overflow-hidden h-full" style={{backgroundColor:'var(--k-bg)', color:'var(--k-text)'}} onMouseUp={handleMouseUp} onTouchEnd={handleMouseUp}>
                    
                    {/* --- MAIN HEADER --- */}
                    <header class="shrink-0 z-10" style={{backgroundColor:'var(--k-bg)', borderBottom:'1px solid var(--k-accent)'}}>
                        <div class="flex items-center justify-between gap-3 px-3 py-2 md:px-6 md:py-4">
                            {/* El logo es la vuelta a la portada. No hay un botón
                                «Inicio» aparte porque el logo ya es el sitio donde
                                todo el mundo pincha para volver al principio. */}
                            <button
                                onClick={() => setAppView("welcome")}
                                title="Volver al inicio"
                                aria-label="Volver al inicio"
                                class="shrink-0 rounded-lg transition-opacity hover:opacity-80 active:opacity-60"
                                style={{ background: 'none', border: 'none', padding: 0, cursor: 'pointer' }}
                            >
                            <img src="data:image/png;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADb/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh7/wAARCAHvBRYDASIAAhEBAxEB/8QAHQABAQADAAMBAQAAAAAAAAAAAAgFBgcDBAkBAv/EAGQQAAEDAgIEBgsHEAUJCAICAwABAgMEBQYRBwgSIRMVMUFRYRQiN1RxdIGisrPRMlZzdZGhsRcYIzU2QlJicoKEkpSkw9MWRrTB0iQzNENTk6XC4zhjZnaDlcTwJaMnZ0RV8f/EABsBAQADAQEBAQAAAAAAAAAAAAAEBQYDAgEH/8QAOxEAAgECAgYHBwQDAQACAwAAAAECAwQFERITITFRcTIzQVKBkdEVIjRhobHBBhTh8CNCcvEWJENTYv/aAAwDAQACEQMRAD8AjI2DC2Fa69qkyr2PRou+VyZ7XU1Of6BgewLe7kqzIqUcGTpVT77ob5foOvQxxwxMiiY1kbERrWtTJEToLvC8LVwtbV6P3/ggXd3qvchvMLacKWS3NTYo2TyJyyTptr8+5PIhm2MaxqNY1rWpyIiZIfoNTTo06SygsinlOU3nJ5gAHQ8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA8NTS01UxWVNPDM1UyykYjk+c8wPjSayZ9TyNSvuBLZWMdJb86KfmRM1jVetObyfIc4u9srbVWOpa2FY3pyLytcnSi86HdDG4js9Ne7c+lnRGvTfFJlvY7p8HShT32EU6sXKkspfRk63vZQeU9qOIg89fSz0NZLSVLNiWJytcn/3mBkWmnky6TzWaOvYGt7bdhqlZs5STN4aRelXb/mTJPIZs/GNaxjWNTJrUyROo/T9Do01SpqC7EZmcnOTk+0AA6HgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA                         canción y el ejercicio ya miran `appView !== "song"` y
                        `!== "exercise"`, así que aquí se para todo solo. */}

                                                    <select
                                                        value={instrument}
                                                        onChange={(e) => { setInstrument(e.target.value); }}
                                                        class="w-full bg-slate-900 border border-slate-800 rounded-lg p-1.5 text-xs text-white"
                                                    >
                                                        {INSTRUMENT_ORDER.map(id => (
                                                            <option key={id} value={id}>{INSTRUMENTS[id].label}</option>
                                                        ))}
                                                    </select>
                                                </div>
                                                <div>
                                                    <label class="block text-[10px] font-medium text-slate-400 mb-1">Trastes</label>
                                                    <select
                                                        value={numFrets}
                                                        onChange={(e) => { setNumFrets(parseInt(e.target.value)); }}
                                                        class="w-full bg-slate-900 border border-slate-800 rounded-lg p-1.5 text-xs text-white"
                                                    >
                                                        {/* Lista continua: los botones ± suben de uno en uno,
                                                            así que valores como 9 u 11 tienen que existir aquí. */}
                                                        {Array.from({ length: MAX_NUM_FRETS - MIN_NUM_FRETS + 1 }, (_, i) => MIN_NUM_FRETS + i).map(n => (
                                                            <option key={n} value={n}>{n} trastes</option>
                                                        ))}
                                                    </select>
                                                </div>
                                            </div>

                                            <div class="grid grid-cols-2 gap-2">
                                                <div>
                                                    <label class="block text-[10px] font-medium text-slate-400 mb-1">Traste de Inicio</label>
                                                    <input
                                                        type="number"
                                                        min={MIN_FRET}
                                                        max={MAX_FRET}
                                                        value={startingFret}
                                                        onChange={(e) => { setStartingFret(clampStartingFret(parseInt(e.target.value))); }}
                                                        class="w-full bg-slate-900 border border-slate-800 rounded-lg p-1 text-xs text-white"
                                                    />
                                                </div>
                                                <div>
                                                    <label class="block text-[10px] font-medium text-slate-400 mb-1">Posición Números</label>
                                                    <select
                                                        value={fretNumPosition}
                                                        onChange={(e) => setFretNumPosition(e.target.value)}
                                                        class="w-full bg-slate-900 border border-slate-800 rounded-lg p-1.5 text-xs text-white"
                                                    >
                                                        <option value="left">Izquierda</option>
                                                        <option value="right">Derecha</option>
                                                    </select>
                                                </div>
                                            </div>
                                        </div>

                                        {/* Custom Guitar Tuning list */}
                                        <div class="border border-slate-800 bg-slate-950/50 rounded-xl p-3 space-y-3">
                                            <span class="block text-[11px] font-bold text-slate-300 uppercase tracking-wider">Afinador de Cuerdas</span>
                                            
                                            <div>
                                                <label class="block text-[10px] text-slate-400 mb-1">Preset de Afinación</label>
                                                <select
                                                    value={selectedTuningName}
                                                    onChange={(e) => {
                                                        const pName = e.target.value;
                                                        const found = TUNING_PRESETS[instrument]?.find(p => p.name === pName);
                                                        if (found) {
                                                            handleTuningPresetChange(found.notes, found.name, found.midi ?? null);
                                                        } else {
                                                            setSelectedTuningName("Personalizada");
                                                        }
                                                    }}
                                                    class="w-full bg-slate-900 border border-slate-800 rounded-lg p-1.5 text-xs text-white"
                                                >
                                                    {TUNING_PRESETS[instrument] ? (
                                                        TUNING_PRESETS[instrument].map(preset => (
                                                            <option key={preset.name} value={preset.name}>{preset.name}</option>
                                                        ))
                                                    ) : (
                                                        <option value="Personalizada">Personalizada</option>
                                                    )}
                                                    <option value="Personalizada">Afinación Libre</option>
                                                </select>
                                            </div>

                                            <div class="grid grid-cols-6 gap-1 pt-1">
                                                {tuning.slice(0, numStrings).map((note, idx) => (
                                                    <div key={idx} class="text-center">
                                                        <span class="text-[9px] text-slate-500 block mb-0.5">C.{numStrings - idx}</span>
                                                        <input
                                                            type="text"
                                                            maxLength={3}
                                                            value={note}
                                                            onChange={(e) => changeTuningNote(idx, e.target.value)}
                                                            class="w-full text-center bg-slate-900 border border-slate-800 text-white rounded p-1 text-[11px] font-bold focus:outline-none"
                                                        />
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                    </div>
                                )}

                            </div>
                        </div>
                        )}

                        {/* ========================================== */}
                        {/* --- CENTER VIEWPORT (INTERACTIVE CANVAS) --- */}
                        {/* --- Lienzo a pantalla completa (base layer) --- */}
                        {/* ========================================== */}
                        <div class="flex-1 flex flex-col justify-between items-center p-3 pb-24 md:p-6 md:pb-6 md:pl-20 relative overflow-hidden" style={{backgroundColor:'var(--k-bg)'}}>
                            
                            {/* Barra de estado.
                                En escritorio caben las tres zonas en fila. En móvil sólo
                                queda lo imprescindible —qué suena y el botón de sonar— y
                                el resto se despliega con el ⋯: apilarlo todo se llevaba
                                un tercio de la pantalla. */}
                            <div class="w-full k-bar px-3 py-2 md:px-4 md:py-3 z-10 shrink-0">
                                <div class="flex items-center justify-between gap-2 md:gap-3">

                                    <div class="flex items-center gap-2 md:gap-3 min-w-0">
                                        <span class="k-dot animate-pulse shrink-0"></span>
                                        <div class="text-xs truncate">
                                            <span class="text-gray-400 hidden sm:inline">
                                                {appMode === "chord" ? "Acorde: " : appMode === "free" ? "Libre: " : "Modo: "}
                                            </span>
                                            <strong style={{color:'var(--k-highlight)'}} class="font-extrabold">
                                                {appMode === "chord"
                                                    ? detectedChord
                                                    : appMode === "scale" ? "Escala Pro"
                                                    : appMode === "arpeggio" ? "Arpegio Pro"
                                                    : `${dotsLibre.length} ${dotsLibre.length === 1 ? "nota" : "notas"} · ${recorridoActual().length} en el recorrido`}
                                            </strong>
                                        </div>
                                    </div>

                                    <div class="flex items-center gap-2 md:gap-3 md:px-3 md:py-1.5 md:rounded-xl md:border shrink-0" style={{borderColor:'rgba(var(--k-accent-rgb),0.3)'}}>
                                        <button
                                            onClick={triggerStrumOrSequence}
                                            disabled={isPlayingSequence}
                                            class="k-btn k-btn--primary k-btn--touch text-xs px-3 md:px-3.5 py-2"
                                            title={appMode === "chord" ? "Rasguear el acorde" : "Reproducir la secuencia en el orden del recorrido"}
                                        >
                                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5}>
                                                <path strokeLinecap="round" strokeLinejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                                            </svg>
                                            <span class="hidden sm:inline">
                                                {appMode === "chord" ? "Rasguear Acorde" : "Reproducir Secuencia"}
                                            </span>
                                        </button>

                                        {piezaTempo("hidden md:flex")}

                                        <button
                                            onClick={() => setShowMoreBar(v => !v)}
                                            class="k-btn k-btn--icon k-btn--ghost md:hidden"
                                            title="Más controles"
                                            aria-expanded={showMoreBar}
                                        >
                                            ⋯
                                        </button>
                                    </div>

                                    <div class="hidden md:flex items-center gap-2">
                                        {piezaModosVista()}
                                        {piezaTriadasToggle()}
                                        {piezaSweep()}
                                        {piezaGuardarAcorde()}
                                        {piezaVaciar()}
                                    </div>
                                </div>

                                {showMoreBar && (
                                    <div class="md:hidden mt-2 pt-2 flex flex-wrap items-center justify-between gap-2 border-t" style={{borderColor:'var(--k-border)'}}>
                                        {piezaTempo("")}
                                        <div class="flex items-center gap-2 flex-wrap">
                                            {piezaModosVista()}
                                            {piezaTriadasToggle()}
                                            {piezaSweep()}
                                            {piezaGuardarAcorde()}
                                            {piezaVaciar()}
                                        </div>
                                    </div>
                                )}
                            </div>

                            {/* La leyenda, como tira, para las pantallas donde la
                                columna lateral no cabe. */}
                            {renderLegendStrip()}

                            {/* Las tríadas de la tonalidad, pegadas al mástil. */}
                            {piezaTriadas()}

                            {/* Zona del mástil.
                                El diagrama se escala para caber ENTERO en el hueco que
                                quede, en vez de escalarse sólo por ancho dentro de una
                                caja con scroll: eso en el teléfono dejaba el mástil
                                cortado por abajo y obligaba a arrastrar para verlo. */}
                            <div class="flex-1 min-h-0 w-full flex items-stretch justify-center my-2 md:my-3 relative">
                                <div class="flex-1 min-h-0 p-2 sm:p-4 rounded-3xl border shadow-inner flex flex-col xl:flex-row items-center xl:items-stretch justify-center gap-3 xl:gap-6 w-full" style={{backgroundColor:'rgba(var(--k-surface-rgb),0.3)', borderColor:'rgba(var(--k-accent-rgb),0.2)'}}>

                                  {/* El mástil, flanqueado en escritorio por sus dos ±.
                                      En móvil esos ± salen de aquí (van en su propia fila,
                                      más abajo) para que el diagrama se quede con todo el
                                      alto disponible. */}
                                  <div class="flex-1 min-h-0 flex items-center justify-center gap-2 md:gap-3 w-full xl:w-auto">

                                    <FretStepper {...propsPasoNumTrastes} className="hidden md:flex" />

                                    <svg
                                        id="chord-diagram-svg"
                                        ref={svgRef}
                                        width={width}
                                        height={height}
                                        style={{
                                            backgroundColor: bgStyleColor,
                                            borderRadius: `${DEFAULT_STYLE.fretboardRadius}px`,
                                            fontFamily: fontFamilyStyle
                                        }}
                                        viewBox={`0 0 ${width} ${height}`}
                                        class="k-fretboard-fit shadow-2xl transition-all duration-300 shrink-0 select-none"
                                        onTouchMove={handleTouchMove}
                                    >
                                        <rect width={width} height={height} fill={bgStyleColor} rx={DEFAULT_STYLE.fretboardRadius} />

                                        {/* Diagram Title */}
                                        <text
                                            x={width / 2}
                                            y={50}
                                            textAnchor="middle"
                                            fill={textStyleColor}
                                            fontSize={dynamicTitleFontSize}
                                            fontWeight="800"
                                        >
                                            {chordName}
                                        </text>

                                        {/* DIBUJO DINÁMICO DE NÚMEROS DE TRASTE AL COSTADO */}
                                        {Array.from({ length: numFrets }).map((_, idx) => {
                                            const absFret = startingFret + idx;
                                            const isCommon = COMMON_FRETS.includes(absFret);
                                            const isFirst = idx === 0;

                                            if (isCommon || (isFirst && startingFret > 1)) {
                                                const y = fretYPositions[idx] + (fretYPositions[idx + 1] - fretYPositions[idx]) / 2 + 4;
                                                const xPos = fretNumPosition === "left" ? paddingLeft - 22 : width - paddingRight + 22;
                                                const labelText = isCommon ? `${absFret}` : `${startingFret} fr`;

                                                return (
                                                    <text
                                                        key={`fret-marker-${absFret}`}
                                                        x={xPos}
                                                        y={y}
                                                        fill={textStyleColor}
                                                        fontSize="13"
                                                        fontWeight="bold"
                                                        textAnchor="middle"
                                                        opacity={isCommon ? "1" : "0.6"}
                                                    >
                                                        {labelText}
                                                    </text>
                                                );
                                            }
                                            return null;
                                        })}

                                        {/* Tuning Notes letters along top */}
                                        {tuning.slice(0, numStrings).map((note, idx) => {
                                            const x = paddingLeft + idx * stringSpacing;
                                            return (
                                                <text
                                                    key={idx}
                                                    x={x}
                                                    y={paddingTop - 45}
                                                    textAnchor="middle"
                                                    fill={textStyleColor}
                                                    fontSize="12"
                                                    fontWeight="bold"
                                                >
                                                    {note}
                                                </text>
                                            );
                                        })}

                                        {/* PULSE HALO ANILLO AUDIO - Destello visual reactivo */}
                                        {notePulse && yDeTraste(notePulse.f) !== null && (
                                            <circle
                                                cx={paddingLeft + notePulse.s * stringSpacing}
                                                cy={yDeTraste(notePulse.f)}
                                                fill="none"
                                                stroke={getIntervalColor("1")} 
                                                strokeWidth="1.5"
                                                class="audio-pulse-ring"
                                            />
                                        )}

                                        {/* GESTURE PREVIEW: Previsualización de arrastre de cejilla interactiva */}
                                        {/* Sólo en Acordes: en Libre el arrastre entre cuerdas ya no
                                            crea nada, y enseñar la previsualización de una cejilla que
                                            luego no aparece sería prometer lo que no se va a cumplir. */}
                                        {appMode === "chord" && dragStart && dragCurrent && dragStart.f === dragCurrent.f && dragStart.s !== dragCurrent.s && yDeTraste(dragStart.f) !== null && (
                                            <g>
                                                <rect
                                                    x={(paddingLeft + Math.min(dragStart.s, dragCurrent.s) * stringSpacing) - dotRadiusStyle}
                                                    y={yDeTraste(dragStart.f) - dotRadiusStyle}
                                                    width={Math.abs(dragCurrent.s - dragStart.s) * stringSpacing + dotRadiusStyle * 2}
                                                    height={dotRadiusStyle * 2}
                                                    rx={dotRadiusStyle}
                                                    fill={baseFingerStyleColor}
                                                    opacity="0.5"
                                                    stroke={textStyleColor}
                                                    strokeWidth="1"
                                                />
                                            </g>
                                        )}

                                        {/* OPEN STRINGS AT FRET 0 DISPLAY */}
                                        {appMode === "scale" ? (
                                            generateScaleOpenNotes().map((openNote, idx) => {
                                                const x = paddingLeft + openNote.s * stringSpacing;
                                                const y = paddingTop - 20;
                                                const dotColor = getIntervalColor(openNote.degreeStr);

                                                return (
                                                    <g key={idx} opacity={opacidadPorTriada(openNote.s, 0)} {...propsNotaDelMapa(openNote.s, 0)}>
                                                        <circle
                                                            cx={x}
                                                            cy={y}
                                                            r={dotRadiusStyle - 1}
                                                            fill={dotColor}
                                                        />
                                                        <text
                                                            x={x}
                                                            y={y + 3.5}
                                                            textAnchor="middle"
                                                            fill={style.dotTextColor}
                                                            fontSize="9"
                                                            fontWeight="black"
                                                        >
                                                            {openNote.label}
                                                        </text>
                                                    </g>
                                                );
                                            })
                                        ) : appMode === "arpeggio" ? (
                                            generateArpeggioOpenNotes().map((openNote, idx) => {
                                                const x = paddingLeft + openNote.s * stringSpacing;
                                                const y = paddingTop - 20;
                                                const dotColor = getIntervalColor(openNote.degreeStr);

                                                return (
                                                    <g key={idx} {...propsNotaDelMapa(openNote.s, 0)}>
                                                        <circle
                                                            cx={x}
                                                            cy={y}
                                                            r={dotRadiusStyle - 1}
                                                            fill={dotColor}
                                                        />
                                                        <text
                                                            x={x}
                                                            y={y + 3.5}
                                                            textAnchor="middle"
                                                            fill={style.dotTextColor}
                                                            fontSize="9"
                                                            fontWeight="black"
                                                        >
                                                            {openNote.label}
                                                        </text>
                                                    </g>
                                                );
                                            })
                                        ) : (
                                            /* `stringStatesActivos`, no `stringStates`: esta rama se
                                               quedó atrás cuando Libre se separó en su propio mástil.
                                               Se veían las marcas del acorde sobre el mástil de Libre,
                                               y —peor— al pulsarlas `toggleStringState` escribía en el
                                               de Libre, que sí es el bueno: quedaba una cuerda al aire
                                               marcada que no se dibujaba en ningún sitio y que
                                               `notasDelMapa` metía en el recorrido. */
                                            stringStatesActivos.slice(0, numStrings).map((state, idx) => {
                                                const x = paddingLeft + idx * stringSpacing;
                                                const y = paddingTop - 20;
