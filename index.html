        /* --- LOS DOS CONTROLES JUNTO AL MÁSTIL ----------------------------
         * Las dos medidas que más se retocan al dibujar: dónde empieza la
         * ventana del mástil y cuántos trastes muestra.
         *
         * EL PROBLEMA QUE RESUELVE `modo`: los dos controles decían casi lo
         * mismo («Traste» / «Trastes») y los dos usaban +/−, cuando uno indica
         * una DIRECCIÓN y el otro una CANTIDAD.
         *
         * LA REGLA, y vale para los dos: EL BOTÓN DE ARRIBA RESTA. El mástil
         * se dibuja con la cejuela arriba y crece hacia abajo, así que en los
         * dos controles el de arriba encoge el dibujo por arriba y el de abajo
         * lo estira por abajo. Antes el de cantidad tenía el + arriba y al
         * pulsarlo el mástil crecía hacia abajo: el botón y el movimiento
         * apuntaban a lados contrarios.
         *
         *   modo "direccion"  ▲ / ▼   Mueve la ventana. El ▲ va hacia la
         *                             CEJUELA, que está dibujada arriba.
         *   modo "cantidad"   − / +   Cambia cuántos trastes se ven. El − va
         *                             arriba porque los quita por abajo.
         *
         * Los botones son de 44px: el mínimo para usarlos con el dedo. En
         * escritorio va en columna flanqueando el mástil y en móvil en fila
         * debajo, donde `flex-row-reverse` deja el sentido «menos a la
         * izquierda» sin duplicar el JSX.
         *
         * `onStep` recibe el INCREMENTO (+1/-1), no el valor final, para que
         * quien lo use aplique la actualización funcional de React. Si el
         * botón calculase `value + 1` desde su closure, varias pulsaciones
         * rápidas dentro del mismo ciclo partirían todas del mismo valor y se
         * perderían clics.
         * ----------------------------------------------------------------- */
        function FretStepper({ label, value, min, max, onStep, titleUp, titleDown, className, modo }) {
            const claseBoton = "k-btn k-btn--icon k-btn--primary text-lg";
            const esDireccion = modo === "direccion";

            // Arriba SIEMPRE resta, en los dos modos. Lo único que cambia es
            // el glifo: una flecha cuando mueve la ventana, un signo cuando
            // cuenta trastes.
            const pasoArriba = -1;
            const pasoAbajo = +1;

            const limiteArriba = value <= min;
            const limiteAbajo = value >= max;

            return (
                <div class={`k-stepper flex flex-row-reverse md:flex-col items-center gap-1 shrink-0 ${className || ""}`}>
                    <button
                        onClick={() => onStep(pasoArriba)}
                        disabled={limiteArriba}
                        title={titleUp}
                        aria-label={titleUp}
                        class={claseBoton}
                    >
                        {esDireccion ? "▲" : "−"}
                    </button>
                    <div class="flex flex-col items-center leading-none py-0.5 px-1">
                        <span class="k-value text-base">{value}</span>
                        <span class="k-label k-text-xs mt-0.5">{label}</span>
                    </div>
                    <button
                        onClick={() => onStep(pasoAbajo)}
                        disabled={limiteAbajo}
                        title={titleDown}
                        aria-label={titleDown}
                        class={claseBoton}
                    >
                        {esDireccion ? "▼" : "+"}
                    </button>
                </div>
            );
        }

    </script>

    <!-- ===================================================================
         BLOQUE 2 de 3: EL APARTADO CANCIÓN
         ===================================================================
         Progresiones, letra con acordes y hoja imprimible. Va en su propio
         bloque porque, todo junto en uno, el archivo pasaba de las 3.500
         líneas y encontrar algo dejaba de ser posible.

         Los tres bloques se CONCATENAN antes de compilarlos, así que
         comparten un único ámbito: lo de aquí ve lo del bloque anterior sin
         importar ni exportar nada. Se parte en <script> separados y no en
         archivos porque un `fetch` a un .jsx local fallaría por CORS al abrir
         index.html con doble clic, y la app tiene que seguir arrancando así.
         =================================================================== -->
    <script type="text/plain" id="app-source-song">
        /* ==================================================================
         * LOS ACORDES DE CANCIÓN
         * ==================================================================
         * Aquí vivía `MiniFretboard`, un diagrama en miniatura con geometría
         * propia. Se parecía poco al del Taller, y eso es lo que Carlos pidió
         * cambiar (0.2, cuarta vuelta): ahora las tarjetas y el diccionario de
         * la hoja dibujan con `DiagramaKharo`, el mismo componente del
         * estudio, a partir de `escenaDeAcorde`.
         * ================================================================== */

        /* Respecto a qué se cuenta el grado de un acorde. `null` significa «no
         * se puede decir», y entonces el diagrama no escribe grados en vez de
         * inventárselos.
         *
         * La fundamental se saca reconociendo la digitación, que son sesenta
         * comparaciones de fórmula por acorde. Se guarda por `id` porque un
         * acorde de la biblioteca es inmutable salvo el nombre: sin la caché,
         * escribir la letra recalcularía la biblioteca entera en cada tecla. */
        const cacheDeFundamentales = new Map();

        function baseDeGradosDe(chord, song) {
            if (!song || song.chordLabels !== "grados") return null;

            if (song.degreeBasis === "tonalidad") {
                return Number.isInteger(song.keyRoot) ? song.keyRoot : null;
            }

            return fundamentalDe(chord);
        }

        // La fundamental de una digitación, reconociéndola (con caché).
        function fundamentalDe(chord) {
            if (cacheDeFundamentales.has(chord.id)) return cacheDeFundamentales.get(chord.id);
            const info = window.KharoTheory.identifyChordFromVoicing(chord);
            const base = info ? info.rootSemi : null;
            cacheDeFundamentales.set(chord.id, base);
            return base;
        }

        /* --- UN ACORDE DE CANCIÓN, DIBUJADO COMO EN EL TALLER (0.2) ---------
         * Se calcula al vuelo desde la digitación guardada, así que el modo
         * de la hoja (dedos, notas o grados) sigue mandando y no hay nada que
         * migrar. Los colores por grado son los del Taller:
         *
         *   dedos    puntos del color base con el número del dedo
         *   notas    el nombre de la nota, coloreado por su grado en el acorde
         *   grados   el grado respecto a `baseDeGrados`; si no se puede saber,
         *            se dibuja como dedos en vez de inventárselo */
        function escenaDeAcorde(chord, etiquetas, baseDeGrados) {
            const numStrings = getInstrument(chord.instrument).strings;
            const startingFret = chord.startingFret || 1;
            const dots = chord.dots || [];
            const barres = chord.barres || [];
            const trasteMasAlto = Math.max(
                dots.reduce((m, d) => Math.max(m, d.f || 0), 0),
                barres.reduce((m, b) => Math.max(m, b.fret || 0), 0)
            );
            const numFrets = Math.max(chord.numFrets || 4, trasteMasAlto);

            let modo = "diagram";
            let raiz = null;
            if (etiquetas === "notas") { modo = "note"; raiz = fundamentalDe(chord); }
            else if (etiquetas === "grados" && baseDeGrados !== null && baseDeGrados !== undefined) { modo = "degree"; raiz = baseDeGrados; }

            const tuning = chord.tuning;
            const stringStates = (chord.stringStates && chord.stringStates.length >= numStrings)
                ? chord.stringStates.slice(0, numStrings)
                : Array.from({ length: numStrings }, (_, i) => (chord.stringStates && chord.stringStates[i]) || "none");

            let alAire = alAireDeDigitacion({ stringStates, tuning, startingFret, modo, raiz });
            let acorde = acordeDeDigitacion({ dots, barres, tuning, startingFret, modo, raiz, dedos: modo === "diagram" });

            // Notas sin fundamental conocida: el nombre sí, el color de grado no.
            if (modo === "note" && raiz === null) {
                alAire = alAire.map(a => a.nota ? { ...a, nota: { ...a.nota, grado: null } } : a);
                acorde = {
                    cejillas: acorde.cejillas.map(c => ({ ...c, subnotas: c.subnotas.map(x => ({ ...x, grado: null })) })),
                    notas: acorde.notas.map(n => ({ ...n, grado: null }))
                };
            }

            return {
                v: 1,
                titulo: chord.name,
                numStrings, numFrets, startingFret,
                afinacion: tuning.slice(0, numStrings),
                numerosTraste: "left",
                alAire,
                envolventes: null,
                mapa: null,
                recorrido: null,
                acorde
            };
        }

        /* ==================================================================
         * BIBLIOTECA DE ACORDES
         * ==================================================================
         * Los acordes que el usuario ha guardado desde el mástil. Cada tarjeta
         * es una FOTO completa de la digitación, no un nombre: por eso la hoja
         * puede dibujarla y el reproductor sabe qué suena.
         * ================================================================== */
        function ChordLibrary({
            chords, onAdd, onRemove, onRename, onAudition, vacio, etiquetas, song, onSetHarmony,
            onBorrarTodo, songs, onMandarA, destino, onElegirDestino
        }) {
            const [armoniaAbierta, setArmoniaAbierta] = useState(null);

            /* Y al cambiar de tonalidad se cierra: un panel que existe para decir
             * que es un acorde prestado no significa nada cuando ya no hay de
             * donde prestarlo. La guarda de dentro evita el fallo; esto evita
             * ademas el panel vacio. */
            useEffect(() => { setArmoniaAbierta(null); }, [song.keyRoot, song.keyScale]);

            /* --- POR QUÉ NO SE VEÍAN TODOS ---------------------------------
             *
             * La biblioteca era UNA fila de tarjetas de 108 px con `.k-strip`, y
             * `.k-strip` esconde la barra de scroll a propósito. Con seis
             * acordes se veían seis; con veinte seguía habiendo una fila y nada
             * que dijera que continuaba. Y como al guardar uno nuevo se añade al
             * FINAL, el acorde recién hecho aparecía justo en la parte que no se
             * veía.
             *
             * Estaban todos en la página. Lo que faltaba era poder mirarlos: una
             * rejilla que envuelve, un contador y un buscador. La tira se queda
             * —es la que va bien pegada encima de la letra— pero ya no es la
             * única forma de ver la biblioteca. */
            const [vista, setVista] = useState("tira");
            const [filtro, setFiltro] = useState("");
            const [menuAcorde, setMenuAcorde] = useState(null);

            /* Cómo se lee cada acorde en la tonalidad de la canción. `null` si
             * no se puede decir: sin tonalidad elegida, o con una escala de
             * menos de siete grados, no hay lectura, y callarse es lo correcto.
             *
             * Se calcula una vez por render de la biblioteca y no una vez por
             * tarjeta: reconocer una digitación son sesenta comparaciones de
             * fórmula, y escribir la letra vuelve a renderizar esto entero. */
            const escalaDeLaCancion = SCALE_PRESETS.find(e => e.id === song.keyScale) || SCALE_PRESETS[0];
            const lecturas = React.useMemo(() => {
                const mapa = {};
                if (!Number.isInteger(song.keyRoot)) return mapa;
                chords.forEach(c => {
                    const info = window.KharoTheory.identifyChordFromVoicing(c);
                    if (!info || !info.intervals) return;
                    mapa[c.id] = window.KharoTheory.analyzeChordInKey(
                        info.rootSemi, info.intervals, song.keyRoot, escalaDeLaCancion.intervals
                    );
                });
                return mapa;
            }, [chords, song.keyRoot, song.keyScale]);

            const lecturaDe = (chord) => {
                const l = lecturas[chord.id];
                return l && l.diatonico !== null ? l : null;
            };
            if (chords.length === 0) {
                return (
                    <div class="k-panel p-4 text-center k-text-sm" style={{ color: 'var(--k-text-muted)' }}>
                        {vacio}
                    </div>
                );
            }

            const texto = filtro.trim().toLowerCase();
            const visibles = texto ? chords.filter(c => (c.name || "").toLowerCase().includes(texto)) : chords;

            const abrirMenuAcorde = (e, chord) => {
                e.preventDefault();
                setMenuAcorde({ chord, x: e.clientX, y: e.clientY });
            };

            /* Mandar un acorde a OTRA canción. Con una sola canción el botón
             * «Añadir» bastaba; con varias hay que poder decir a cuál va, y
             * decirlo en el momento de mandarlo — que es cuando se sabe. */
            const opcionesDeDestino = () => {
                const lista = [];
                (songs || []).forEach(s => {
                    const esActual = s.id === song.id;
                    (s.sections || []).forEach(sec => {
                        lista.push({
                            key: `${s.id}-${sec.id}`,
                            label: `${esActual ? "· " : ""}${s.title} › ${sec.name}`,
                            ayuda: esActual ? "En la canción abierta" : "En otra canción",
                            hacer: () => onMandarA(menuAcorde.chord, s.id, sec.id)
                        });
                    });
                });
                return lista;
            };

            const tarjeta = (chord) => (
                        <div
                            key={chord.id}
                            class="k-panel p-2 flex flex-col items-center gap-1.5"
                            style={{ width: "168px", flexShrink: 0 }}
                            onContextMenu={(e) => abrirMenuAcorde(e, chord)}
                        >
                            <button
                                onClick={() => onAudition(chord)}
                                title={`Escuchar ${chord.name}. Clic derecho para más`}
                                class="w-full"
                                style={{ cursor: "pointer", background: "none", border: "none", padding: 0 }}
                            >
                                <DiagramaKharo escena={escenaDeAcorde(chord, etiquetas, baseDeGradosDe(chord, song))} />
                            </button>

                            <input
                                type="text"
                                value={chord.name}
                                onChange={(e) => onRename(chord.id, e.target.value)}
                                class="k-field w-full text-center k-text-sm font-bold py-1"
                                aria-label="Nombre del acorde"
                            />

                            {/* --- CÓMO SE LEE ESTE ACORDE EN ESTA TONALIDAD ---
                                Diatónico: se dice qué grado es y no hay nada que
                                decidir. De fuera: la app propone lecturas y la
                                eliges tú. Nombrar la función de un acorde
                                prestado es una lectura, y esa la firma quien
                                escribe la canción, no el programa. */}
                            {(() => {
                                const lectura = lecturaDe(chord);
                                if (!lectura) return null;

                                if (lectura.diatonico) {
                                    return (
                                        <span
                                            class="k-chip w-full text-center"
                                            title={`Grado ${lectura.romano} de la tonalidad`}
                                        >
                                            {lectura.romano}
                                        </span>
                                    );
                                }

                                const puesta = (song.harmony || {})[chord.id];
                                const etiqueta = (puesta && puesta.funcion) || "de fuera";
                                return (
                                    <button
                                        onClick={() => setArmoniaAbierta(armoniaAbierta === chord.id ? null : chord.id)}
                                        class="k-chip w-full text-center"
                                        style={{
                                            cursor: "pointer",
                                            borderColor: "var(--k-highlight)",
                                            color: "var(--k-highlight)"
                                        }}
                                        title={lectura.notasDeFuera.length
                                            ? `No es de la tonalidad (${lectura.notasDeFuera.join(", ")}). Pulsa para decir qué es.`
                                            : "No es de la tonalidad. Pulsa para decir qué es."}
                                    >
                                        {etiqueta}
                                    </button>
                                );
                            })()}

                            {armoniaAbierta === chord.id && (() => {
                                const lectura = lecturaDe(chord);
                                /* La misma guarda que el chip de arriba. `lecturaDe`
                                 * devuelve null en cuanto no hay tonalidad -es su
                                 * comportamiento correcto: sin tonalidad no hay
                                 * lectura que dar- y sin esto el desplegable leia
                                 * `lectura.sugerencias` de null y se llevaba la app
                                 * entera por delante. */
                                if (!lectura) return null;
                                const puesta = (song.harmony || {})[chord.id] || { funcion: "", nota: "" };
                                return (
                                    <div class="w-full space-y-1">
                                        {(lectura.sugerencias || []).map(s => (
                                            <button
                                                key={s.id}
                                                onClick={() => { onSetHarmony(chord.id, { funcion: s.etiqueta, nota: puesta.nota }); setArmoniaAbierta(null); }}
                                                class="k-btn k-btn--outline w-full k-text-xs py-1"
                                                style={{ justifyContent: "flex-start", textAlign: "left" }}
                                                title={s.explica}
                                            >
                                                {s.etiqueta}
                                            </button>
                                        ))}
                                        <input
                                            type="text"
                                            value={puesta.funcion}
                                            onChange={(e) => onSetHarmony(chord.id, { funcion: e.target.value, nota: puesta.nota })}
                                            placeholder="o escríbelo"
                                            class="k-field w-full text-center k-text-xs py-1"
                                        />
                                        <input
                                            type="text"
                                            value={puesta.nota}
                                            onChange={(e) => onSetHarmony(chord.id, { funcion: puesta.funcion, nota: e.target.value })}
                                            placeholder="nota al margen"
                                            class="k-field w-full text-center k-text-xs py-1"
                                        />
                                    </div>
                                );
                            })()}

                            {/* «Añadir» a lo ancho, con área táctil de verdad.
                                La papelera medía 19×14 px y estaba pegada al botón
                                primario: lo destructivo no va al lado de lo que se
                                pulsa cien veces al día. Borrar vive en el menú del
                                clic derecho, que ya lo tenía. */}
                            <div class="flex gap-1 w-full">
                                <button
                                    onClick={() => onAdd(chord)}
                                    onContextMenu={(e) => abrirMenuAcorde(e, chord)}
                                    class="k-btn k-btn--primary k-btn--touch flex-1 k-text-xs py-1.5"
                                    title={`Añadir ${chord.name} a «${destino}»`}
                                >
                                    Añadir
                                </button>
                                <button
                                    type="button"
                                    onClick={(e) => { const r = e.currentTarget.getBoundingClientRect(); setMenuAcorde({ chord, x: r.left, y: r.bottom + 4 }); }}
                                    class="k-btn k-btn--outline k-btn--touch k2-mini-mas"
                                    aria-label={`Más opciones de ${chord.name}`}
                                    title={`Más opciones de ${chord.name}`}
                                    aria-haspopup="menu"
                                >
                                    <Icono nombre="mas" tam={16} />
                                </button>
                            </div>
                        </div>
            );

            return (
                <div class="space-y-2">
                    <div class="flex items-center gap-2 flex-wrap">
                        <span class="k-chip">{chords.length} en tu biblioteca</span>
                        <span class="k-text-xs" style={{ color: 'var(--k-text-faint)' }}>
                            «Añadir» los manda a «{destino}»
                        </span>

                        <Segmentado
                            tam="sm"
                            valor={vista}
                            onCambio={setVista}
                            opciones={[
                                { id: "tira", label: "Fila", ayuda: "Una fila que se desliza" },
                                { id: "rejilla", label: "Cuadrícula", ayuda: "Todos a la vez, en varias filas" }
                            ]}
                        />

                        {/* El buscador aparece cuando la tira deja de caber de un
                            vistazo. Con cinco acordes sobra; con veinticinco es
                            lo único que sirve. */}
                        {chords.length > 8 && (
                            <input
                                type="text"
                                value={filtro}
                                onChange={(e) => setFiltro(e.target.value)}
                                placeholder="Buscar…"
                                aria-label="Buscar en la biblioteca"
                                class="k-field px-2 py-1 k-text-sm"
                                style={{ width: "140px" }}
                            />
                        )}

                        <div class="flex-1"></div>

                        {onBorrarTodo && (
                            <BotonBorrar
                                onClick={onBorrarTodo}
                                title="Vaciar la biblioteca entera"
                                label="Vaciar biblioteca"
                            />
                        )}
                    </div>

                    {visibles.length === 0 ? (
                        <p class="k-text-sm py-2" style={{ color: 'var(--k-text-faint)' }}>
                            Ningún acorde se llama así.
                        </p>
                    ) : vista === "tira" ? (
                        /* La tira sigue siendo una fila que se desliza, pero
                           ahora se NOTA que sigue: el degradado del borde
                           derecho es lo único que faltaba para que el scroll
                           escondido dejara de parecer el final de la lista. */
                        <TiraDeslizable etiqueta="Acordes de la biblioteca">
                            {visibles.map(chord => tarjeta(chord))}
                        </TiraDeslizable>
                    ) : (
                        <div
                            class="flex flex-wrap gap-2"
                            style={{ maxHeight: "42vh", overflowY: "auto" }}
                        >
                            {visibles.map(chord => tarjeta(chord))}
                        </div>
                    )}

                    {menuAcorde && (
                        <MenuContextualAccesible
                            x={menuAcorde.x}
                            y={menuAcorde.y}
                            titulo={menuAcorde.chord.name}
                            onCerrar={() => setMenuAcorde(null)}
                            opciones={[
                                { label: "Escucharlo", hacer: () => onAudition(menuAcorde.chord) },
                                { label: `Añadir a «${destino}»`, hacer: () => onAdd(menuAcorde.chord) },
                                { label: "Mandar a otra canción o sección…", hacer: () => onElegirDestino && onElegirDestino(menuAcorde.chord) },
                                {
                                    label: "Quitar de la biblioteca",
                                    hacer: () => onRemove(menuAcorde.chord.id),
                                    estilo: { color: 'var(--k-danger)' }
                                }
                            ]}
                        />
                    )}
                </div>
            );
        }

        /* ==================================================================
         * LOS COMPASES DE UNA SECCIÓN
         * ==================================================================
         * Cada acorde con su duración EN PULSOS, no en compases: así se puede
         * escribir un acorde que dura medio compás o tres, que es lo que pasa
         * en cuanto una canción sale del manual.
         *
         * La referencia visual del compás la da el separador: cada vez que la
         * suma de pulsos completa un compás, se dibuja una barra.
         * ================================================================== */
        function BarStrip({ bars, chordsById, beatsPerBar, onChangeBeats, onRemove, onMove, onDuplicar, activeIndex }) {
            const [menu, setMenu] = useState(null);

            if (bars.length === 0) {
                return (
                    <p class="k-text-sm py-3" style={{ color: 'var(--k-text-muted)' }}>
                        Sin acordes todavía. Añádelos con «Añadir» desde «Los acordes».
                    </p>
                );
            }

            let acumulado = 0;

            return (
                <div class="k-strip flex items-stretch gap-1.5 pb-1">
                    {bars.map((bar, i) => {
                        const chord = chordsById[bar.chordId];
                        acumulado += bar.beats;
                        // Barra de compás cuando la suma cuadra justo.
                        const cierraCompas = acumulado % beatsPerBar === 0;
                        const activo = activeIndex === i;

                        return (
                            <React.Fragment key={i}>
                                <div
                                    class="k-panel shrink-0 p-2 flex flex-col items-center gap-1"
                                    onContextMenu={(e) => {
                                        e.preventDefault();
                                        setMenu({ i, nombre: chord ? chord.name : "Compás", x: e.clientX, y: e.clientY });
                                    }}
                                    style={{
                                        width: "136px",
                                        borderColor: activo ? 'var(--k-highlight)' : undefined,
                                        boxShadow: activo ? '0 0 0 2px var(--k-highlight)' : undefined
                                    }}
                                >
                                    <span class="k-text-md font-black truncate w-full text-center">
                                        {chord ? chord.name : "?"}
                                    </span>

                                    <div class="flex items-center gap-1" role="group" aria-label={`Pulsos del compás ${i + 1}`}>
                                        <BotonIcono icono="menos" etiqueta={`Un pulso menos (compás ${i + 1})`} onClick={() => onChangeBeats(i, -1)} disabled={bar.beats <= 1} />
                                        <span class="k-value k-text-sm w-8 text-center" aria-live="polite">{bar.beats}</span>
                                        <BotonIcono icono="sumar" etiqueta={`Un pulso más (compás ${i + 1})`} onClick={() => onChangeBeats(i, +1)} />
                                    </div>
                                    <span class="k-label k-text-xs">pulsos</span>

                                    <div class="flex items-center justify-between w-full">
                                        <BotonIcono icono="atras" etiqueta={`Mover el compás ${i + 1} antes`} onClick={() => onMove(i, -1)} disabled={i === 0} />
                                        <BotonIcono
                                            icono="mas"
                                            etiqueta={`Más acciones del compás ${i + 1}`}
                                            onClick={(e) => { const r = e.currentTarget.getBoundingClientRect(); setMenu({ i, nombre: chord ? chord.name : "Compás", x: r.left, y: r.bottom + 4 }); }}
                                            extra={{ "aria-haspopup": "menu" }}
                                        />
                                        <BotonIcono icono="adelante" etiqueta={`Mover el compás ${i + 1} después`} onClick={() => onMove(i, +1)} disabled={i === bars.length - 1} />
                                    </div>
                                </div>

                                {cierraCompas && i < bars.length - 1 && (
                                    <div class="shrink-0 w-px my-2" style={{ backgroundColor: 'var(--k-border-strong)' }}></div>
                                )}
                            </React.Fragment>
                        );
                    })}

                    {/* Los mismos botones de la tarjeta, más duplicar y saltos
                        de cuatro pulsos. Con una progresión larga, alcanzar los
                        −/+ de un compás concreto es un ejercicio de puntería. */}
                    {menu && (
                        <MenuContextualAccesible
                            x={menu.x}
                            y={menu.y}
                            titulo={`${menu.nombre} · compás ${menu.i + 1}`}
                            onCerrar={() => setMenu(null)}
                            opciones={[
                                { label: "Duplicar", hacer: () => onDuplicar && onDuplicar(menu.i), desactivada: !onDuplicar },
                                { label: "Mover antes", hacer: () => onMove(menu.i, -1), desactivada: menu.i === 0 },
                                { label: "Mover después", hacer: () => onMove(menu.i, +1), desactivada: menu.i === bars.length - 1 },
                                { label: "Un compás entero más", hacer: () => onChangeBeats(menu.i, beatsPerBar) },
                                { label: "Un compás entero menos", hacer: () => onChangeBeats(menu.i, -beatsPerBar) },
                                { label: "Quitar el compás", hacer: () => onRemove(menu.i), estilo: { color: 'var(--k-danger)' } }
                            ]}
                        />
                    )}
                </div>
            );
        }

        /* ==================================================================
         * LA LETRA, CON LOS ACORDES ENCIMA
         * ==================================================================
         * Dos líneas por verso: arriba los acordes, abajo la letra, alineadas
         * por COLUMNA — el acorde cae sobre la sílaba que empieza en esa
         * columna. Eso no cambia: es el modelo, y es lo que hace exacta la
         * hoja exportada.
         *
         * Lo que cambia es CÓMO se edita. Contar espacios a mano para alinear
         * un acorde no lo entiende nadie que no venga de escribir ChordPro, así
         * que ahora se arrastran:
         *
         *   ARRASTRAR (por defecto)  Cada acorde es una ficha sobre el verso.
         *                            Se coge y se suelta encima de la sílaba.
         *   TEXTO (secundario)       Las dos líneas en crudo, para pegar desde
         *                            fuera o para arreglar algo a mano.
         *
         * Las dos caras editan la MISMA cadena `chordLine`, así que no pueden
         * desincronizarse: arrastrar es `insertChordAtColumn`, ni más ni menos.
         *
         * La monoespaciada tampoco es un gusto: el acorde se coloca en la
         * columna N multiplicando N por el ancho de carácter, y eso sólo es
         * exacto si todos los caracteres miden lo mismo.
         * ================================================================== */

        /* El ancho de carácter se MIDE, no se calcula. Antes era la constante
         * 8,4 (14 px × 0,6), que sólo vale para la monoespaciada exacta que
         * suponíamos y se rompe con otra fuente o con el tamaño de 16 px que
         * el móvil necesita para que iOS no haga zoom. */
        function useCharWidth() {
            const medidorRef = useRef(null);
            const [ancho, setAncho] = useState(8.4);

            /* Se remide EN CADA RENDER, no una vez al montar.
             *
             * El ancho de carácter cambia por más motivos de los que parece:
             * Tailwind se carga en el navegador y aplica el tamaño de letra
             * DESPUÉS del primer pintado, la tipografía monoespaciada termina
             * de cargar más tarde, en móvil los campos saltan a 16 px para que
             * iOS no haga zoom, y el usuario puede cambiar el zoom del
             * navegador. Con una sola medida al montar, el ancho se queda viejo
             * y cada acorde se desplaza un poco más cuanto más avanza el verso
             * — de los fallos más difíciles de ver y de explicar.
             *
             * Un `getBoundingClientRect` por render es barato, y comparando
             * antes de guardar no hay bucle: converge en el segundo render y
             * ahí se queda.
             *
             * (Un ResizeObserver parece la herramienta obvia, pero observa un
             * nodo concreto: si React recrea el medidor, el observer se queda
             * mirando un nodo que ya no está en la página y no vuelve a avisar.) */
            useLayoutEffect(() => {
                const el = medidorRef.current;
                if (!el) return;
                const w = el.getBoundingClientRect().width / 100;
                if (w > 0 && Math.abs(w - ancho) > 0.01) setAncho(w);
            });

            // Cien caracteres y se divide: medir uno solo arrastra el error de
            // redondeo del navegador a cada columna.
            const medidor = (
                /* Lleva LAS MISMAS clases que la caja de la letra, y no sólo
                 * `k-mono`. Con `k-mono k-text-md` a secas, el medidor se quedaba
                 * en 14 px mientras que en móvil la caja real salta a 16 px
                 * —la regla que evita que iOS haga zoom al enfocar—, así que
                 * medía un carácter un 14% más estrecho y los acordes caían
                 * cada vez más a la izquierda cuanto más avanzaba el verso.
                 * El borde y el relleno se anulan porque aquí sólo interesa el
                 * ancho del texto. */
                <span
                    ref={medidorRef}
                    class="k-field k-mono k-lyric-line k-text-md"
                    aria-hidden="true"
                    style={{
                        // `inline-block` no es cosmético: ResizeObserver NO
                        // observa cajas en línea, así que con un <span> normal
                        // el observer se queda mudo y la medida no se corrige
                        // nunca. Es lo que hacía que el ancho se quedase en el
                        // de antes de que Tailwind aplicara el tamaño de letra.
                        display: "inline-block",
                        /* 0.2: `fixed` y no `absolute`. Un absoluto de cien
                         * caracteres cuenta para el scroll del contenedor y, en
                         * un teléfono, sacaba una barra horizontal en toda la
                         * Canción. Uno fijo mide igual y no ocupa sitio. */
                        position: "fixed", left: 0, top: 0, visibility: "hidden", whiteSpace: "pre",
                        pointerEvents: "none", border: 0, padding: 0
                    }}
                >
                    {"0".repeat(100)}
                </span>
            );

            return [ancho, medidor];
        }

        /* El carril de acordes de un verso: las fichas que se arrastran.
         *
         * Va sincronizado con el desplazamiento horizontal de la letra. Sin
         * eso, en un verso largo la letra se va a la derecha y los acordes se
         * quedan atrás, que es ver el formato roto sin estarlo. */
        function ChordLane({ chordLine, lyric, charWidth, scrollLeft, chordSeleccionado, onChange }) {
            const carrilRef = useRef(null);
            const capaRef = useRef(null);
            const [arrastre, setArrastre] = useState(null); // { indice, col }

            const marcas = Song.parseChordLine(chordLine);

            /* La columna se mide contra la CAPA interior, no contra el carril:
             * la capa ya lleva aplicado el desplazamiento y el margen que la
             * hace coincidir con la primera letra del verso, así que aquí no
             * hay que volver a sumarlos. Un sitio menos donde equivocarse. */
            const columnaDesdeX = (clientX) => {
                const capa = capaRef.current;
                if (!capa) return 0;
                const x = clientX - capa.getBoundingClientRect().left;
                return Math.max(0, Math.round(x / charWidth));
            };

            const empezarArrastre = (e, indice) => {
                e.preventDefault();
                e.stopPropagation();
                e.currentTarget.setPointerCapture(e.pointerId);
                setArrastre({ indice, col: marcas[indice].col });
            };

            const moverArrastre = (e) => {
                if (!arrastre) return;
                setArrastre({ ...arrastre, col: columnaDesdeX(e.clientX) });
            };

            const soltarArrastre = () => {
                if (!arrastre) return;
                const movida = marcas[arrastre.indice];
                const resto = marcas.filter((_, i) => i !== arrastre.indice);
                resto.push({ col: arrastre.col, name: movida.name });
                onChange(Song.buildChordLine(resto));
                setArrastre(null);
            };

            // Tocar el carril vacío coloca ahí el acorde elegido. El carril es
            // el sitio donde viven los acordes, así que es donde se espera
            // poder ponerlos.
            const colocarAqui = (e) => {
                if (!chordSeleccionado) return;
                onChange(Song.insertChordAtColumn(chordLine, columnaDesdeX(e.clientX), chordSeleccionado));
            };

            const quitar = (indice) => {
                onChange(Song.buildChordLine(marcas.filter((_, i) => i !== indice)));
            };

            return (
                <div
                    ref={carrilRef}
                    class="k-chord-lane"
                    onPointerDown={colocarAqui}
                    title={chordSeleccionado
                        ? `Toca para colocar ${chordSeleccionado}`
                        : "Elige un acorde arriba para poder colocarlo"}
                >
                    <div ref={capaRef} class="k-chord-lane__inner" style={{ transform: `translateX(${-scrollLeft}px)` }}>
                        {marcas.map((marca, i) => {
                            const col = arrastre && arrastre.indice === i ? arrastre.col : marca.col;
                            const silaba = lyric.slice(col, col + marca.name.length);

                            return (
                                <button
                                    key={i}
                                    class={`k-chord-chip ${arrastre && arrastre.indice === i ? "k-chord-chip--moving" : ""}`}
                                    style={{ left: `${col * charWidth}px` }}
                                    onPointerDown={(e) => empezarArrastre(e, i)}
                                    onPointerMove={moverArrastre}
                                    onPointerUp={soltarArrastre}
                                    onPointerCancel={soltarArrastre}
                                    onDoubleClick={() => quitar(i)}
                                    title={silaba
                                        ? `${marca.name} sobre «${silaba}» · arrastra para mover, doble clic para quitar`
                                        : `${marca.name} · cae más allá del final de la letra`}
                                >
                                    {marca.name}
                                </button>
                            );
                        })}
                    </div>
                </div>
            );
        }

        function LyricEditor({ lines, onChange, onAdd, onRemove, chordParaInsertar, lineaActiva }) {
            const [modo, setModo] = useState("arrastrar"); // 'arrastrar' | 'texto'
            const [charWidth, medidor] = useCharWidth();
            const [scrolls, setScrolls] = useState({});

            const refsAcordes = useRef({});
            const refsLetra = useRef({});

            // En modo texto las dos cajas se desplazan juntas, por lo mismo que
            // el carril sigue a la letra en modo arrastrar.
            const sincronizarScroll = (indice, origen) => {
                const a = refsAcordes.current[indice];
                const b = refsLetra.current[indice];
                if (!a || !b) return;
                if (origen === "acordes") b.scrollLeft = a.scrollLeft;
                else a.scrollLeft = b.scrollLeft;
            };

            const insertarEnCursor = (indice) => {
                const caja = refsLetra.current[indice];
                if (!caja || !chordParaInsertar) return;
                const col = caja.selectionStart || 0;
                const linea = lines[indice];
                onChange(indice, {
                    ...linea,
                    chordLine: Song.insertChordAtColumn(linea.chordLine, col, chordParaInsertar)
                });
            };

            return (
                <div class="space-y-3" style={{ position: "relative" }}>
                    {medidor}

                    <div class="flex items-end gap-3 flex-wrap">
                        <Segmentado
                            etiqueta="Colocar los acordes"
                            tam="sm"
                            valor={modo}
                            onCambio={setModo}
                            opciones={[{ id: "arrastrar", label: "Arrastrando" }, { id: "texto", label: "Como texto" }]}
                        />
                        <span class="k-text-xs pb-2" style={{ color: 'var(--k-text-faint)' }}>
                            {modo === "arrastrar"
                                ? "Toca el carril para poner el acorde elegido; arrástralo para moverlo"
                                : "Los acordes se alinean contando espacios"}
                        </span>
                    </div>

                    {lines.map((linea, i) => {
                        const alineado = Song.alignLyricBlock(linea);
                        const sueltos = alineado.marks.filter(m => m.beyondLyric);

                        return (
                            <div
                                key={i}
                                class="k-panel p-2.5 space-y-1"
                                style={{ borderColor: lineaActiva === i ? 'var(--k-highlight)' : undefined }}
                            >
                                <div class="flex items-center gap-2">
                                    <span class="k-label k-text-xs shrink-0">Verso {i + 1}</span>
                                    <div class="flex-1"></div>
                                    {modo === "texto" && (
                                        <button
                                            onClick={() => insertarEnCursor(i)}
                                            disabled={!chordParaInsertar}
                                            class="k-btn k-btn--outline k-text-xs px-2 py-1"
                                            title={chordParaInsertar
                                                ? `Colocar ${chordParaInsertar} donde está el cursor`
                                                : "Elige antes un acorde de la sección"}
                                        >
                                            ↑ {chordParaInsertar || "acorde"} aquí
                                        </button>
                                    )}
                                    <BotonBorrar onClick={() => onRemove(i)} title={`Borrar el verso ${i + 1}`} className="k-btn--touch" />
                                </div>

                                {modo === "arrastrar" ? (
                                    <ChordLane
                                        chordLine={linea.chordLine}
                                        lyric={linea.lyric}
                                        charWidth={charWidth}
                                        scrollLeft={scrolls[i] || 0}
                                        chordSeleccionado={chordParaInsertar}
                                        onChange={(chordLine) => onChange(i, { ...linea, chordLine })}
                                    />
                                ) : (
                                    <textarea
                                        ref={(el) => { refsAcordes.current[i] = el; }}
                                        value={linea.chordLine}
                                        onChange={(e) => onChange(i, { ...linea, chordLine: e.target.value })}
                                        onScroll={() => sincronizarScroll(i, "acordes")}
                                        rows={1}
                                        spellcheck="false"
                                        wrap="off"
                                        class="k-field k-mono k-lyric-line w-full px-2 py-1 k-text-md"
                                        style={{ color: 'var(--k-highlight)', whiteSpace: 'pre', overflowX: 'auto', resize: 'none' }}
                                        placeholder="acordes"
                                        aria-label={`Acordes del verso ${i + 1}`}
                                    />
                                )}

                                <textarea
                                    ref={(el) => { refsLetra.current[i] = el; }}
                                    value={linea.lyric}
                                    onChange={(e) => onChange(i, { ...linea, lyric: e.target.value })}
                                    onScroll={(e) => {
                                        if (modo === "texto") sincronizarScroll(i, "letra");
                                        else setScrolls(prev => ({ ...prev, [i]: e.target.scrollLeft }));
                                    }}
                                    rows={1}
                                    spellcheck="false"
                                    wrap="off"
                                    class="k-field k-mono k-lyric-line w-full px-2 py-1 k-text-md"
                                    style={{ whiteSpace: 'pre', overflowX: 'auto', resize: 'none' }}
                                    placeholder="letra"
                                    aria-label={`Letra del verso ${i + 1}`}
                                />

                                {sueltos.length > 0 && (
                                    <p class="k-text-xs" style={{ color: 'var(--k-danger)' }}>
                                        {sueltos.map(m => m.name).join(", ")} {sueltos.length === 1 ? "cae" : "caen"} más allá del final de la letra.
                                    </p>
                                )}
                            </div>
                        );
                    })}

                    <button onClick={onAdd} class="k-btn k-btn--outline w-full k-text-sm py-2">
                        + Añadir verso
                    </button>
                </div>
            );
        }

        /* ==================================================================
         * EL GESTOR DE ARCHIVOS
         * ==================================================================
         * La lista de canciones —o de ejercicios— con lo que se puede hacer
         * con cada una: abrirla, duplicarla, borrarla.
         *
         * No existía. La app guardaba `[song]` y leía `[0]`, así que sólo había
         * UNA canción y «Nueva» reemplazaba la anterior: para conservar dos
         * había que exportar una a JSON y volver a importarla. La
         * infraestructura para varias estaba escrita en song-core.js desde el
         * principio y no la usaba nadie.
         *
         * Es UN componente para las dos cosas porque la lista de canciones y la
         * de ejercicios se manejan igual, y dos copias se habrían
         * desincronizado al primer botón nuevo.
         * ================================================================== */
        function GestorArchivos({
            titulo, elementos, activoId, resumen,
            /* El género de la palabra, porque el componente sirve para canciones
             * y para ejercicios y «+ Nueva ejercicio» está mal escrito. */
            nuevo, abierto,
            onAbrir, onNuevo, onDuplicar, onBorrar, onBorrarTodo, onCerrar
        }) {
            const [filtro, setFiltro] = useState("");
            const [menu, setMenu] = useState(null);

            const texto = filtro.trim().toLowerCase();
            const visibles = texto
                ? elementos.filter(e => (e.title || "").toLowerCase().includes(texto))
                : elementos;

            const abrirMenu = (e, item) => {
                e.preventDefault();
                setMenu({ id: item.id, title: item.title, x: e.clientX, y: e.clientY });
            };

            return (
                <div class="k-panel p-3 space-y-3">
                    <div class="flex items-center gap-2 flex-wrap">
                        <span class="k-label">{titulo}</span>
                        <span class="k-chip">{elementos.length}</span>
                        <div class="flex-1"></div>
                        <button onClick={onNuevo} class="k-btn k-btn--primary k-text-xs px-2.5 py-1.5">{nuevo || "+ Nuevo"}</button>
                        <BotonBorrar
                            onClick={onBorrarTodo}
                            title={`Borrar los ${elementos.length} y empezar de cero`}
                            label="Borrar todo"
                        />
                        <BotonCerrar onClick={onCerrar} title="Cerrar el gestor" />
                    </div>

                    {/* El buscador aparece cuando deja de caber todo de un
                        vistazo. Con tres archivos es ruido; con veinte es lo
                        único que sirve. */}
                    {elementos.length > 6 && (
                        <input
                            type="text"
                            value={filtro}
                            onChange={(e) => setFiltro(e.target.value)}
                            placeholder="Buscar por título…"
                            class="k-field w-full px-2 py-1.5 k-text-md"
                        />
                    )}

                    <div class="space-y-1.5" style={{ maxHeight: "40vh", overflowY: "auto" }}>
                        {visibles.map(item => {
                            const activo = item.id === activoId;
                            return (
                                <div
                                    key={item.id}
                                    onContextMenu={(e) => abrirMenu(e, item)}
                                    class="flex items-center gap-2 px-2 py-1.5 rounded-lg"
                                    style={{
                                        backgroundColor: activo ? 'rgba(var(--k-accent-rgb),0.18)' : 'var(--k-surface-raised)',
                                        border: `1px solid ${activo ? 'var(--k-border-strong)' : 'transparent'}`
                                    }}
                                >
                                    <button
                                        onClick={() => onAbrir(item.id)}
                                        class="flex-1 min-w-0 text-left"
                                        style={{ background: 'none', border: 'none', cursor: 'pointer', padding: 0 }}
                                        title={activo ? "Ya está abierta" : "Abrir"}
                                    >
                                        <div class="k-text-sm font-bold truncate" style={{ color: activo ? 'var(--k-highlight)' : 'var(--k-text)' }}>
                                            {item.title || "Sin título"}
                                        </div>
                                        <div class="k-text-xs" style={{ color: 'var(--k-text-faint)' }}>
                                            {resumen(item)}{activo ? ` · ${abierto || "abierto"}` : ""}
                                        </div>
                                    </button>

                                    <button
                                        onClick={() => onDuplicar(item.id)}
                                        class="k-btn k-btn--ghost k-text-xs px-2 py-1"
                                        title="Duplicar"
                                    >
                                        Duplicar
                                    </button>
                                    <BotonBorrar onClick={() => onBorrar(item.id)} title={`Borrar «${item.title}»`} />
                                </div>
                            );
                        })}

                        {visibles.length === 0 && (
                            <p class="k-text-sm py-2" style={{ color: 'var(--k-text-faint)' }}>
                                Nada con ese nombre.
                            </p>
                        )}
                    </div>

                    {menu && (
                        <MenuContextualAccesible
                            x={menu.x}
                            y={menu.y}
                            titulo={menu.title}
                            onCerrar={() => setMenu(null)}
                            opciones={[
                                { label: "Abrir", hacer: () => onAbrir(menu.id), desactivada: menu.id === activoId },
                                { label: "Duplicar", hacer: () => onDuplicar(menu.id) },
                                { label: "Borrar", hacer: () => onBorrar(menu.id), estilo: { color: 'var(--k-danger)' } }
                            ]}
                        />
                    )}
                </div>
            );
        }

        /* ==================================================================
         * EDITOR DE PATRÓN DE RASGUEO
         * ==================================================================
         * La rejilla con la que se escribe un rasgueo: cuatro casillas por
         * pulso (semicorcheas) y en cada una la flecha que toca.
         *
         * Tocar una casilla la hace ROTAR por todos los estados:
         *
         *     vacío → ↓ → ↑ → ↓ acentuada → ↑ acentuada → × apagado → vacío
         *
         * Un solo gesto en vez de un menú por casilla. Con menú, escribir un
         * compás serían veinte toques y dos decisiones cada vez. Con el ratón,
         * además, el botón derecho va hacia atrás.
         *
         * Debajo va la regla de pulsos (1 · · · 2 · · · …), que es lo que
         * convierte una fila de flechas en algo que se puede leer y contar.
         * ================================================================== */
        function StrumEditor({ pattern, onChange, onPlay, onStop, sonando, bpm, onAviso }) {
            const sub = pattern.subdivision || 2;
            const total = pattern.beats * sub;

            const cambiarCelda = (i, atras) => {
                const cells = pattern.cells.slice();
                cells[i] = Song.nextCellState(cells[i], atras);
                onChange({ ...pattern, cells });
            };

            /* Poner una casilla en un estado CONCRETO, sin recorrer el ciclo.
             * El ciclo está bien para escribir de corrido —un golpe por
             * casilla— y mal para corregir: cambiar un ↓ por un × son cuatro
             * clics contando los estados de por medio. */
            const ponerCelda = (i, valor) => {
                const cells = pattern.cells.slice();
                cells[i] = valor ? { ...valor } : null;
                onChange({ ...pattern, cells });
            };

            const [menuCelda, setMenuCelda] = useState(null);
            const pulsoLargoCelda = useRef({ t: null, x: 0, y: 0 });

            const nombreDeEstado = (celda) => {
                if (!celda) return "Silencio";
                if (celda.muted) return "Apagado";
                const flecha = celda.dir === "up" ? "Arriba" : "Abajo";
                return celda.accent ? `${flecha} acentuada` : flecha;
            };

            const cambiarResolucion = (nuevaSub) => {
                const r = Song.reescalarRejilla(pattern, nuevaSub);
                onChange(r.pattern);
                if (r.perdidas > 0 && onAviso) {
                    onAviso(`${r.perdidas} ${r.perdidas === 1 ? "golpe no cabía" : "golpes no cabían"} en corcheas y se han quitado`);
                }
            };

            const glifo = (celda) => {
                if (!celda) return "";
                if (celda.muted) return "×";
                return celda.dir === "up" ? "↑" : "↓";
            };

            // El nombre de la casilla, para el tooltip: en corcheas no son
            // semicorcheas, y llamarlas mal confunde al contar.
            const nombreDeCasilla = (i) => {
                const pulso = Math.floor(i / sub) + 1;
                const dentro = i % sub;
                if (dentro === 0) return `Pulso ${pulso}`;
                if (sub === 2) return `Contra del ${pulso}`;
                return `Pulso ${pulso}, semicorchea ${dentro + 1}`;
            };

            return (
                <div class="space-y-3">
                    <div class="k2-rasgueo-cabeza">
                        <button type="button" onClick={sonando ? onStop : onPlay} class={`k-btn k-btn--touch k2-boton-texto ${sonando ? "k-btn--danger" : "k-btn--primary"}`}>
                            <Icono nombre={sonando ? "parar" : "reproducir"} />
                            <span>{sonando ? "Parar" : "Escuchar en bucle"}</span>
                        </button>
                        <div class="k2-rasgueo-cabeza__nombre">
                            <Campo etiqueta="Nombre">
                                {(id) => <input id={id} type="text" value={pattern.name} onChange={(e) => onChange({ ...pattern, name: e.target.value })} />}
                            </Campo>
                        </div>
                        <div class="k2-campo">
                            <span class="k2-etiqueta" id="k2-pulsos-rasgueo">Pulsos</span>
                            <div class="flex items-center gap-1" role="group" aria-labelledby="k2-pulsos-rasgueo">
                                <BotonIcono icono="menos" etiqueta="Un pulso menos" variante="borde" disabled={pattern.beats <= 1}
                                    onClick={() => { const beats = Math.max(1, pattern.beats - 1); onChange({ ...pattern, beats, cells: pattern.cells.slice(0, beats * sub) }); }} />
                                <span class="k-value k-text-md w-6 text-center" aria-live="polite">{pattern.beats}</span>
                                <BotonIcono icono="sumar" etiqueta="Un pulso más" variante="borde" disabled={pattern.beats >= 8}
                                    onClick={() => {
                                        const beats = Math.min(8, pattern.beats + 1);
                                        const cells = pattern.cells.slice();
                                        while (cells.length < beats * sub) cells.push(null);
                                        onChange({ ...pattern, beats, cells });
                                    }} />
                            </div>
                        </div>
                        <Segmentado
                            etiqueta="Casillas por pulso"
                            valor={sub}
                            onCambio={(v) => cambiarResolucion(v)}
                            opciones={[
                                { id: 2, label: "Corcheas", ayuda: "Dos casillas por pulso" },
                                { id: 4, label: "Semicorcheas", ayuda: "Cuatro casillas por pulso" }
                            ]}
                        />
                        <button type="button" onClick={() => onChange({ ...pattern, cells: new Array(total).fill(null) })} class="k-btn k-btn--outline k-btn--touch k2-boton-texto">
                            Vaciar la rejilla
                        </button>
                        <span class="k-chip">{bpm} bpm</span>
                    </div>

                    <div class="k-strip">
                        <div class="k-strum-grid" style={{ gridTemplateColumns: `repeat(${total}, 1fr)` }}>
                            {Array.from({ length: total }).map((_, i) => {
                                const celda = pattern.cells[i];
                                const enPulso = i % sub === 0;
                                return (
                                    <button
                                        key={i}
                                        /* Tres gestos, y ninguno pisa al otro:
                                             clic          avanza el ciclo (como siempre)
                                             shift+clic    lo retrocede (era el clic derecho)
                                             clic derecho  abre los seis estados en fila */
                                        onClick={(e) => cambiarCelda(i, e.shiftKey)}
                                        onContextMenu={(e) => {
                                            e.preventDefault();
                                            setMenuCelda({ i, x: e.clientX, y: e.clientY });
                                        }}
                                        {...crearPulsacionLarga(pulsoLargoCelda, (x, y) => setMenuCelda({ i, x, y }))}
                                        aria-label={`${nombreDeCasilla(i)}: ${nombreDeEstado(celda).toLowerCase()}`}
                                        class={"k-strum-cell"
                                            + (enPulso ? " k-strum-cell--beat" : "")
                                            + (celda ? " k-strum-cell--on" : "")
                                            + (celda && celda.accent ? " k-strum-cell--accent" : "")
                                            + (celda && celda.muted ? " k-strum-cell--muted" : "")}
                                        title={nombreDeCasilla(i)}
                                    >
                                        {glifo(celda)}
                                    </button>
                                );
                            })}

                            {/* La regla: el número en cada pulso y un punto en el
                                resto. Sin ella la fila de flechas no se cuenta. */}
                            {Array.from({ length: total }).map((_, i) => (
                                <span key={`r-${i}`} class={"k-strum-ruler" + (i % sub === 0 ? " k-strum-ruler--beat" : "")}>
                                    {i % sub === 0 ? (i / sub) + 1 : "·"}
                                </span>
                            ))}
                        </div>
                    </div>

                    {/* --- LOS SEIS ESTADOS, EN FILA ---
                        En horizontal porque una casilla de rasgueo se reconoce
                        por su flecha, de un vistazo: una lista vertical obliga a
                        leer seis renglones para elegir un símbolo.

                        Los estados salen de `CICLO_CELDA`, la misma lista que
                        recorre el clic izquierdo. Con dos listas, añadir un
                        estado dejaría el menú y el ciclo diciendo cosas
                        distintas. */}
                    {menuCelda && (
                        <MenuContextualAccesible
                            x={menuCelda.x}
                            y={menuCelda.y}
                            orientacion="horizontal"
                            titulo={nombreDeCasilla(menuCelda.i)}
                            onCerrar={() => setMenuCelda(null)}
                            opciones={Song.CICLO_CELDA.map((estado, k) => {
                                const puesto = (() => {
                                    const c = pattern.cells[menuCelda.i];
                                    if (!estado && !c) return true;
                                    return !!(estado && c && estado.dir === c.dir && estado.accent === c.accent && estado.muted === c.muted);
                                })();
                                return {
                                    key: `estado-${k}`,
                                    label: estado ? (estado.muted ? "×" : (estado.dir === "up" ? "↑" : "↓")) + (estado.accent ? "!" : "") : "·",
                                    ayuda: nombreDeEstado(estado),
                                    hacer: () => ponerCelda(menuCelda.i, estado),
                                    estilo: puesto
                                        ? { backgroundColor: 'var(--k-accent)', color: 'var(--k-accent-ink)', minWidth: '34px', fontSize: '15px' }
                                        : { minWidth: '34px', fontSize: '15px' }
                                };
                            })}
                        />
                    )}
                </div>
            );
        }

        /* ==================================================================
         * UNA SECCIÓN
         * ==================================================================
         * Intro, Verso, Coro... Cada una con su ritmo, su tempo y sus vueltas,
         * porque un estribillo rara vez se toca igual que la estrofa.
         *
         * `bpm` y `rhythmId` en null significan "lo que diga la canción". Es
         * distinto de copiar el valor: si luego se cambia el tempo general,
         * las secciones que no lo habían tocado siguen al general.
         * ================================================================== */
        function SectionCard({
            section, song, onActualizar,
            chordsById, playhead, chordParaInsertar, setChordParaInsertar
        }) {
            const pulsosPorCompas = Song.beatsPerBar(song.timeSignature);
            const pulsos = Song.sectionBeats(section);
            const segundos = Song.beatsToSeconds(
                Song.sectionTotalBeats(section),
                section.bpm || song.bpm
            );

            // Los acordes que ya están en la progresión: son los candidatos
            // razonables para colocar sobre la letra.
            const nombresUsados = [];
            (section.bars || []).forEach(bar => {
                const chord = chordsById[bar.chordId];
                if (chord && nombresUsados.indexOf(chord.name) === -1) nombresUsados.push(chord.name);
            });

            const enCurso = playhead && playhead.sectionId === section.id;

            const cambiarCompas = (indice, delta) => {
                const bars = section.bars.map((bar, i) =>
                    i === indice ? { ...bar, beats: Math.max(1, Math.min(32, bar.beats + delta)) } : bar
                );
                onActualizar({ bars });
            };

            const quitarCompas = (indice) => {
                onActualizar({ bars: section.bars.filter((_, i) => i !== indice) });
            };

            /* Duplicar un compás. Repetir un acorde es lo más común de una
             * progresión, y hasta ahora había que volver a la biblioteca,
             * buscarlo, añadirlo al final y arrastrarlo hasta su sitio. */
            const duplicarCompas = (indice) => {
                const bars = section.bars.slice();
                bars.splice(indice + 1, 0, { ...bars[indice] });
                onActualizar({ bars });
            };

            const moverCompas = (indice, delta) => {
                const destino = indice + delta;
                if (destino < 0 || destino >= section.bars.length) return;
                const bars = section.bars.slice();
                const movido = bars.splice(indice, 1)[0];
                bars.splice(destino, 0, movido);
                onActualizar({ bars });
            };

            return (
                <div class="k2-seccion-card space-y-3">
                    <div class="k2-seccion-campos">
                        <div class="k2-seccion-campos__nombre">
                            <Campo etiqueta="Nombre de la sección">
                                {(id) => <input id={id} type="text" value={section.name} onChange={(e) => onActualizar({ name: e.target.value })} />}
                            </Campo>
                        </div>
                        <Campo etiqueta="Vueltas">
                            {(id) => (
                                <input id={id} type="number" min="1" max="32" value={section.repeats}
                                    onChange={(e) => onActualizar({ repeats: Math.max(1, parseInt(e.target.value) || 1) })} />
                            )}
                        </Campo>
                        <Campo etiqueta="Tempo propio" ayuda={section.bpm ? undefined : `Vacío: ${song.bpm} bpm, el de la canción`}>
                            {(id, ayuda) => (
                                <input id={id} type="number" min="30" max="300" aria-describedby={ayuda}
                                    placeholder={String(song.bpm)}
                                    value={section.bpm || ""}
                                    onChange={(e) => { const v = parseInt(e.target.value); onActualizar({ bpm: v > 0 ? v : null }); }} />
                            )}
                        </Campo>
                        <div class="k2-seccion-campos__ritmo">
                            <Campo etiqueta="Ritmo">
                                {(id) => (
                                    <select id={id} value={section.rhythmId || ""} onChange={(e) => onActualizar({ rhythmId: e.target.value || null })}>
                                        <option value="">El de la canción</option>
                                        {Song.RHYTHM_PATTERNS.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}
                                        {(song.customRhythms || []).map(r => <option key={r.id} value={r.id}>{r.name}</option>)}
                                    </select>
                                )}
                            </Campo>
                        </div>
                    </div>

                    <div class="flex items-center gap-2 flex-wrap">
                        <span class="k-chip">
                            {pulsos} pulsos {section.repeats > 1 ? "x " + section.repeats : ""}
                        </span>
                        <span class="k-chip">{Song.formatDuration(segundos)}</span>
                        {enCurso && (
                            <span class="k-chip" style={{ color: 'var(--k-accent-ink)', backgroundColor: 'var(--k-accent)' }}>
                                Sonando
                            </span>
                        )}
                    </div>

                    <div>
                        <span class="k-label block mb-1.5">Progresión</span>
                        <BarStrip
                            bars={section.bars}
                            chordsById={chordsById}
                            beatsPerBar={pulsosPorCompas}
                            onChangeBeats={cambiarCompas}
                            onRemove={quitarCompas}
                            onMove={moverCompas}
                            onDuplicar={duplicarCompas}
                            activeIndex={enCurso ? playhead.barIndex : -1}
                        />
                    </div>

                    <div>
                        <div class="flex items-center gap-2 mb-1.5 flex-wrap">
                            <span class="k-label">Letra</span>
                            {nombresUsados.map(nombre => (
                                <button
                                    key={nombre}
                                    onClick={() => setChordParaInsertar(nombre)}
                                    aria-pressed={chordParaInsertar === nombre}
                                    class="k-chip k2-chip-pulsable"
                                    style={chordParaInsertar === nombre
                                        ? { backgroundColor: 'var(--k-accent)', color: 'var(--k-accent-ink)', cursor: 'pointer' }
                                        : { cursor: 'pointer' }}
                                    title="Elegir este acorde para colocarlo sobre la letra"
                                >
                                    {nombre}
                                </button>
                            ))}
                        </div>

                        <LyricEditor
                            lines={section.lines}
                            chordParaInsertar={chordParaInsertar}
                            lineaActiva={enCurso ? playhead.lineIndex : -1}
                            onChange={(i, linea) => onActualizar({
                                lines: section.lines.map((l, idx) => idx === i ? linea : l)
                            })}
                            onAdd={() => onActualizar({ lines: [...section.lines, { chordLine: "", lyric: "" }] })}
                            onRemove={(i) => onActualizar({ lines: section.lines.filter((_, idx) => idx !== i) })}
                        />
                    </div>

                    <div>
                        <Campo etiqueta="Nota de la sección">
                            {(id) => <input id={id} type="text" value={section.notes} onChange={(e) => onActualizar({ notes: e.target.value })} placeholder="Ej.: entra la batería, medio tiempo" />}
                        </Campo>
                    </div>
                </div>
            );
        }

        /* ==================================================================
         * LA HOJA DE CANCIÓN
         * ==================================================================
         * Páginas A4 con la progresión, la letra con los acordes encima y un
         * diccionario de las digitaciones usadas. Es lo que se imprime y lo
         * que se exporta.
         *
         * DOS DECISIONES QUE PARECEN DETALLES Y NO LO SON:
         *
         * 1. Los colores van escritos aquí, no como tokens del tema. La hoja
         *    es OBRA, no piel: si un tema pudiera repintarla, el PNG que te
         *    descargas cambiaría según cómo tengas puesta la app. Lo que ves
         *    es lo que te llevas, y eso no puede depender del tema.
         *
         * 2. La letra va en monoespaciada. No es un gusto tipográfico: el
         *    acorde se coloca en la columna N multiplicando N por el ancho de
         *    carácter, y eso sólo es exacto si todos los caracteres miden
         *    igual. Con una proporcional, el acorde se despega de su sílaba.
         * ================================================================== */
        const HOJA = {
            ancho: 840,
            alto: 1188,
            margenX: 48,
            margenSuperior: 150,
            margenInferior: 60,

            // Colores de la obra. Los mismos que usa el diagrama por defecto,
            // para que una hoja y un diagrama impresos hagan juego.
            papel: "#ffffff",
            tinta: "#0f172a",
            tintaSuave: "#64748b",
            linea: "#cbd5e1",
            acento: "#2563eb",

            // 8,4 px es el ancho real de un carácter de 14 px en monoespaciada
            // (la proporción es 0,6). De aquí sale la posición de cada acorde.
            monoTamano: 14,
            monoAncho: 8.4,

            altoSeccion: 34,
            altoCompases: 58,
            altoVerso: 46,
            altoNota: 26,
            separacionSeccion: 20
        };

        const MONO_FAMILIA = "ui-monospace, 'Courier New', monospace";
        const SANS_FAMILIA = "Helvetica, Arial, sans-serif";

        /* Un bloque de letra: los acordes en su columna exacta y debajo el
         * verso. `beyondLyric` marca los acordes que caen más allá del final
         * del texto — pasa al acortar un verso, y dibujarlos igual sin avisar
         * deja acordes flotando sin sílaba debajo. */
        function SheetLyricBlock({ line, x, y }) {
            const alineado = Song.alignLyricBlock(line);

            return (
                <g transform={`translate(${x}, ${y})`}>
                    {alineado.marks.map((marca, i) => (
                        <text
