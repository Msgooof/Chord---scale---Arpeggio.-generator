<!DOCTYPE html>
<html lang="es" class="h-full k-ink" style="background-color:var(--k-bg)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Kharo Studio</title>
    <!-- Tailwind CSS (copia local, no requiere internet) -->
    <script src="vendor/tailwind.js"></script>
    <!-- React & Babel (copias locales, no requieren internet) -->
    <script src="vendor/react.production.min.js"></script>
    <script src="vendor/react-dom.production.min.js"></script>
    <script src="vendor/babel.min.js"></script>
    <!-- Núcleo de teoría musical. Script normal: no lleva JSX, así que no
         pasa por Babel. Debe cargar antes que la app, que lo consume como
         window.KharoTheory. -->
    <script src="theory-core.js"></script>
    <!-- Núcleo de geometría del diagrama. Mismo patrón: sin JSX, sin Babel. -->
    <script src="render-core.js"></script>
    <!-- Núcleo de canción: modelo, letra por columnas, tiempos, ritmos y
         paginación de la hoja. Mismo patrón: sin JSX, sin Babel. -->
    <script src="song-core.js"></script>
    <!-- 0.3: el núcleo de las tablaturas (modelo, alturas y maquetación).
         Mismo patrón: sin JSX, sin Babel. Necesita los dos de arriba. -->
    <script src="tab-core.js"></script>
    <!-- jsPDF, para exportar la hoja de canción en PDF. Copia local, como todo
         lo demás: cargándolo desde un CDN, la app dejaría de funcionar sin
         internet, que es la promesa del proyecto. Si este archivo falta, el
         botón de PDF avisa y los de PNG y SVG siguen funcionando. -->
    <script src="vendor/jspdf.umd.min.js"></script>
    <!-- 0.3: Tone.js (MIT), para cargar y tocar las muestras de guitarra y bajo
         de vendor/sonidos/, grabadas por Nicholaus Brosowsky (tonejs-instruments,
         CC BY 3.0). Si falta, la app suena con su sintetizador de siempre. -->
    <script src="vendor/tone.js"></script>
    <!-- Sistema de diseño. theme.css son los TOKENS (qué colores y medidas) y
         ui.css la capa de componentes .k-* (cómo se combinan). Van en archivos
         aparte para que meter otro sistema de diseño más adelante sea
         reemplazarlos, sin tocar ni una línea de este archivo.
         Ojo: NO gobiernan el diagrama exportado — eso lo manda el usuario con
         DEFAULT_STYLE e intervalColors. Ver la cabecera de theme.css. -->

    <!-- El modo se pone ANTES de pintar nada: si esperara a React, la página
         saldría un instante en claro y luego saltaría a oscuro. Primero manda
         lo que eligió el músico; si nunca eligió, la preferencia del sistema.
         Envuelto en try: en ventana privada el almacenamiento puede fallar, y
         entonces sale en claro sin más. -->
    <script>
        try {
            var modo = localStorage.getItem("kharo.prueba.modo");
            if (modo !== "claro" && modo !== "oscuro") {
                modo = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "oscuro" : "claro";
            }
            document.documentElement.setAttribute("data-theme", modo);
        } catch (e) {}
    </script>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="ui.css">
    <!-- 0.3: sólo lo que añade esta prueba (Biblioteca y Tablaturas). -->
    <link rel="stylesheet" href="ui-v03.css">
    <style>
        /* Lo único que queda aquí es la animación del halo de nota pulsada:
           pertenece a la interacción con el DIAGRAMA, no a la piel de la app,
           así que no es territorio del sistema de diseño. */
        @keyframes audioPulse {
            0% {
                r: 10px;
                opacity: 0.9;
                stroke-width: 1px;
            }
            100% {
                r: 28px;
                opacity: 0;
                stroke-width: 3px;
            }
        }
        .audio-pulse-ring {
            animation: audioPulse 0.4s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="h-full flex flex-col antialiased">

    <!-- Root target for React App -->
    <div id="root" class="min-h-[100dvh] flex flex-col"></div>

    <!-- ===================================================================
         BLOQUE 1 de 3: NÚCLEO COMPARTIDO
         ===================================================================
         Constantes, sintetizador y componentes que usan los dos apartados. -->
    <script type="text/plain" id="app-source-core">
        const { useState, useEffect, useLayoutEffect, useRef } = React;

        // --- NÚCLEO DE TEORÍA (theory-core.js) ---
        // Toda la música vive fuera de este archivo. Aquí sólo se le pone cara.
        const {
            NOTE_NAMES,
            INTERVAL_DEGREES,
            COMMON_FRETS,
            INSTRUMENTS,
            INSTRUMENT_ORDER,
            DEFAULT_INSTRUMENT,
            TUNING_PRESETS,
            SCALE_PRESETS,
            ARPEGGIO_PRESETS,
            parseNoteToSemi,
            getInstrument,
            identifyChord,
            fretToMidi,
            toAbsoluteFret,
            midiToNoteName,
            midiToFrequency,
            chordVoicingToMidi
        } = window.KharoTheory;

        // --- NÚCLEO DE GEOMETRÍA (render-core.js) ---
        const {
            computeDiagramGeometry,
            computeTitleFontSize,
            clampStartingFret,
            clampNumFrets,
            MIN_FRET, MAX_FRET,
            MIN_NUM_FRETS, MAX_NUM_FRETS,
            normalizeStyle,
            loadStyleState,
            saveStyleState
        } = window.KharoRender;

        // --- NÚCLEO DE CANCIÓN (song-core.js) ---
        // Se usa con prefijo (`Song.createSection`) en vez de desestructurar:
        // son treinta y tantas funciones y así se ve de un vistazo qué línea
        // pertenece al apartado de canción y cuál al estudio de diagramas.
        const Song = window.KharoSong;

        // Tipografías admitidas
        const FONTS_LIST = [
            { id: "Inter, sans-serif", name: "Inter (Limpia)" },
            { id: "Georgia, serif", name: "Georgia (Elegante)" },
            { id: "Courier New, monospace", name: "Courier (Código)" },
            { id: "Times New Roman, serif", name: "Times (Solemne)" },
            { id: "Trebuchet MS, sans-serif", name: "Trebuchet (Equilibrada)" }
        ];

        /* El aspecto de LA OBRA vive ahora en `render-core.js`, al lado de la
         * geometría que lo consume: `dotRadius` alimenta la altura mínima de
         * traste, así que el saneado de ese valor tiene que estar donde se usa.
         *
         * Estos dos alias existen para las lecturas directas que quedan por el
         * archivo. Después de la etapa 2 sólo quedan las que TIENEN que ser
         * fijas: `.triadRingColors` y `.fretboardRadius`, más
         * `.intervalColors` aquí debajo.
         *
         * `.pathColor` y `.dotTextColor` ya NO se leen de aquí. Eran trece
         * sitios del mástil grande que se quedaron apuntando a la constante en
         * la mudanza, así que los dos selectores del panel de Estilo —«Texto en
         * las notas» y «Flechas del recorrido»— se guardaban, sobrevivían al
         * recargar, gobernaban las miniaturas... y el mástil los ignoraba. Leen
         * `style`, que es el estilo activo. Si añades una lectura nueva de
         * color de la obra, que sea de `style`. */
        const DEFAULT_STYLE = window.KharoRender.DEFAULT_STYLE;
        const DEFAULT_INTERVAL_COLORS = DEFAULT_STYLE.intervalColors;

        /* --- EL ESTILO, DISPONIBLE EN TODO EL ÁRBOL --------------------------
         *
         * Un Context y no props porque los consumidores están repartidos por
         * los tres bloques —la miniatura de la biblioteca, el mástil de la hoja
         * de tonalidad, la ficha de ejercicio— y bajarlo a mano serían seis
         * props cruzando ocho componentes que no pintan nada con ellas.
         *
         * El `|| DEFAULT_STYLE` no es adorno: si algún día se renderiza un
         * árbol fuera del Provider —una exportación offscreen, por ejemplo—,
         * sin él la primera lectura de `.gridColor` revienta. */
        const StyleContext = React.createContext(null);
        const useDiagramStyle = () => React.useContext(StyleContext) || DEFAULT_STYLE;

        // --- SINTETIZADOR DE CUERDA PULSADA CON WEB AUDIO API ---
        class InstrumentSynth {
            constructor() {
                this.ctx = null;
                // El ruido de la percusión. Se genera UNA vez y se reutiliza:
                // rellenar dos segundos de muestras aleatorias en cada golpe
                // costaría más que el propio sonido, y a dieciséis golpes por
                // compás eso se oye como tirones.
                this.ruido = null;
                // 0.3: el volumen general (0..1), el del deslizador del clic
                // derecho en «Reproducir». Es preferencia de quien escucha y
                // se queda en este navegador. Arranca un poco por debajo del
                // máximo: las notas sueltas sonaban bien, pero un rasgueo
                // entero sumado saturaba.
                this.volumen = 0.8;
                try {
                    const v = parseFloat(localStorage.getItem("kharo.prueba.volumen"));
                    if (!isNaN(v)) this.volumen = Math.min(1, Math.max(0, v));
                } catch (e) {}
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                    // 0.3: Tone.js toca en este mismo contexto.
                    if (window.Tone) { try { Tone.setContext(this.ctx); } catch (e) {} }

                    /* 0.3: el bus maestro. Todo lo que suena pasa por aquí:
                     * volumen general → limitador suave → altavoces. Cada nota
                     * por separado no satura, pero seis cuerdas que se solapan
                     * se suman y pasan de 1: eso es la distorsión. El
                     * compresor sólo actúa cuando la suma se acerca al techo,
                     * así que una nota sola suena igual que antes. */
                    this.maestro = this.ctx.createGain();
                    this.maestro.gain.value = this.volumen;
                    const techo = this.ctx.createDynamicsCompressor();
                    techo.threshold.value = -10;
                    techo.knee.value = 8;
                    techo.ratio.value = 12;
                    techo.attack.value = 0.003;
                    techo.release.value = 0.2;
                    this.maestro.connect(techo);
                    techo.connect(this.ctx.destination);
                    this.salida = this.maestro;
                }
                // 0.3: con la pausa del reproductor puesta, no se despierta solo.
                if (this.ctx.state === 'suspended' && !this.pausado) {
                    this.ctx.resume();
                }
                if (!this.ruido) {
                    const muestras = Math.floor(this.ctx.sampleRate * 0.5);
                    const buffer = this.ctx.createBuffer(1, muestras, this.ctx.sampleRate);
                    const datos = buffer.getChannelData(0);
                    for (let i = 0; i < muestras; i++) datos[i] = Math.random() * 2 - 1;
                    this.ruido = buffer;
                }
            }

            /* --- PERCUSIÓN --------------------------------------------------
             *
             * Un golpe de mano sobre las cuerdas apagadas: ruido filtrado, no
             * una nota. No tiene altura y por eso no lleva MIDI — es lo que
             * permite escribir un rasgueo oyendo SÓLO el ritmo, sin que el
             * acorde tape lo que se está contando.
             *
             * Tres timbres, que son los tres gestos que la rejilla distingue:
             *
             *   golpe  ↓  la mano baja entera: más cuerpo y más cola
             *   alto   ↑  sólo roza las agudas: más fino y más corto
             *   seco   ×  apagado: un chasquido, sin cola
             *
             * Va al bus maestro (`salida`), igual que `playNote`: el
             * deslizador de volumen baja también la percusión.
             * -------------------------------------------------------------- */
            setVolumen(v) {
                this.volumen = Math.min(1, Math.max(0, v));
                try { localStorage.setItem("kharo.prueba.volumen", String(this.volumen)); } catch (e) {}
                if (this.maestro) this.maestro.gain.setTargetAtTime(this.volumen, this.ctx.currentTime, 0.02);
            }
            playPercussion(timbre = "golpe", delay = 0, strength = 1) {
                this.init();
                const now = this.ctx.currentTime + Math.max(0, delay);

                const AJUSTES = {
                    golpe: { freq: 380,  q: 0.9, dur: 0.16, vol: 0.42, hp: 120 },
                    alto:  { freq: 1900, q: 1.4, dur: 0.09, vol: 0.30, hp: 700 },
                    seco:  { freq: 900,  q: 2.2, dur: 0.055, vol: 0.34, hp: 300 }
                };
                const a = AJUSTES[timbre] || AJUSTES.golpe;

                const fuente = this.ctx.createBufferSource();
                fuente.buffer = this.ruido;

                const paso = this.ctx.createBiquadFilter();
                paso.type = 'bandpass';
                paso.frequency.setValueAtTime(a.freq, now);
                paso.Q.setValueAtTime(a.q, now);

                // El paso-alto quita el retumbe: sin él, el ruido blanco a
                // volumen de golpe suena a soplo y no a mano.
                const corte = this.ctx.createBiquadFilter();
                corte.type = 'highpass';
                corte.frequency.setValueAtTime(a.hp, now);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(a.vol * Math.max(0.05, strength), now + 0.002);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + a.dur);

                fuente.connect(paso);
                paso.connect(corte);
                corte.connect(gain);
                gain.connect(this.salida);

                fuente.start(now);
                fuente.stop(now + a.dur + 0.02);
            }
            // `strength` (0..1) es la fuerza del golpe: multiplica las tres capas
            // por igual, así que cambia el volumen sin cambiar el timbre. Es lo que
            // permite que un patrón rítmico tenga acentos en vez de sonar plano.
            /* 0.3: `curva` opcional, [[segundos, semitonos], …], para que un
             * bend, un slide o un vibrato de la tablatura suban de tono de
             * verdad. Sin ella, todo suena exactamente como antes. */
            /* --- 0.3: MUESTRAS DE GUITARRA DE VERDAD -----------------------
             * Grabaciones de Nicholaus Brosowsky (tonejs-instruments, CC BY
             * 3.0) en vendor/sonidos/, cargadas y tocadas con Tone.js. Se elige
             * la grabación más cercana y se acelera o frena hasta la nota: así
             * el bend, el slide y el vibrato (la `curva`) siguen funcionando.
             *
             * Mientras un juego no ha cargado —o si falta Tone.js— suena el
             * sintetizador de siempre: nunca se queda mudo. */
            juegoActivo() {
                const t = this.timbre || "auto";
                if (t === "sinte") return null;
                if (t !== "auto") return t;
                const i = this.instrumento || "guitar6";
                if (/^bass/.test(i)) return "bass-electric";
                if (/^uke/.test(i)) return "guitar-nylon";
                if (i === "guitar7" || i === "guitar8") return "guitar-electric";
                return "guitar-acoustic";
            }
            cargarMuestras(juego) {
                if (!juego || !window.Tone || !MUESTRAS_GUITARRA[juego]) return;
                this.juegos = this.juegos || {};
                if (this.juegos[juego]) return;
                const lista = MUESTRAS_GUITARRA[juego];
                const urls = {};
                lista.forEach(n => { urls[n] = n.replace("#", "s") + ".mp3"; });
                const estado = { listo: false, notas: [] };
                this.juegos[juego] = estado;
                const buffers = new Tone.ToneAudioBuffers({
                    urls,
                    baseUrl: `vendor/sonidos/${juego}/`,
                    onload: () => {
                        estado.notas = lista.map(n => ({ midi: notaAMidi(n), buffer: buffers.get(n) }))
                            .sort((a, b) => a.midi - b.midi);
                        estado.listo = true;
                    },
                    onerror: () => { estado.error = true; }
                });
            }
            muestrasListas(juego) {
                const e = this.juegos && this.juegos[juego];
                return !!(e && e.listo);
            }
            // Una promesa que se cumple cuando el juego ha cargado (o falla:
            // entonces se toca con el sintetizador, que nunca se queda mudo).
            esperarMuestras(juego) {
                this.cargarMuestras(juego);
                return new Promise(ok => {
                    const t0 = Date.now();
                    const mirar = () => {
                        const e = this.juegos && this.juegos[juego];
                        if (!e || e.listo || e.error || Date.now() - t0 > 6000) return ok();
                        setTimeout(mirar, 60);
                    };
                    mirar();
                });
            }
            tocarMuestra(midiNote, duration, delay, strength, curva, forzado) {
                const juego = forzado || this.juegoActivo();
                if (!juego || !window.Tone) return false;
                this.cargarMuestras(juego);
                const estado = this.juegos && this.juegos[juego];
                if (!estado || !estado.listo || !estado.notas.length) return false;
                const base = estado.notas.reduce((m, x) => Math.abs(x.midi - midiNote) < Math.abs(m.midi - midiNote) ? x : m);
                const now = this.ctx.currentTime + delay;
                const velocidad = (semis) => Math.pow(2, (midiNote + semis - base.midi) / 12);
                const fuente = new Tone.ToneBufferSource({ url: base.buffer, playbackRate: velocidad(0) });
                if (curva && curva.length) {
                    fuente.playbackRate.setValueAtTime(velocidad(0), now);
                    curva.forEach(([t, semis]) => fuente.playbackRate.linearRampToValueAtTime(velocidad(semis), now + Math.max(0.001, t)));
                }
                const volumen = this.ctx.createGain();
                volumen.gain.setValueAtTime(0.75 * strength, now);
                // La grabación decae sola; al acabar la nota se apaga en una cola corta.
                volumen.gain.setTargetAtTime(0, now + Math.max(0.05, duration), 0.09);
                fuente.connect(volumen);
                volumen.connect(this.salida);
                fuente.start(now);
                fuente.stop(now + Math.max(0.05, duration) + 0.7);
                return true;
            }

            playNote(midiNote, duration = 1.0, delay = 0, strength = 1, curva = null, juego = null, yaEsperada = false) {
                this.init();
                if (this.tocarMuestra(midiNote, duration, delay, strength, curva, juego)) return;
                /* 0.3: una nota suelta (un traste que escribes, una cuerda que
                 * pulsas) mientras las grabaciones todavía llegan: se espera a
                 * que lleguen en vez de sonar al sintetizador. Si fallan, suena
                 * el sintetizador. */
                const j = juego || this.juegoActivo();
                const est = j && this.juegos && this.juegos[j];
                if (!yaEsperada && est && !est.listo && !est.error && delay < 0.05) {
                    this.esperarMuestras(j).then(() => this.playNote(midiNote, duration, 0, strength, curva, juego, true));
                    return;
                }
                const now = this.ctx.currentTime + delay;
                const freq = 440 * Math.pow(2, (midiNote - 69) / 12);
                const doblar = (osc, mult) => {
                    if (!curva || !curva.length) return;
                    curva.forEach(([t, semis]) => {
                        osc.frequency.linearRampToValueAtTime(freq * mult * Math.pow(2, semis / 12), now + Math.max(0.001, t));
                    });
                };

                if (freq <= 0 || freq > 20000) return;

                const oscWood = this.ctx.createOscillator();
                oscWood.type = 'triangle';
                oscWood.frequency.setValueAtTime(freq, now);

                const oscCore = this.ctx.createOscillator();
                oscCore.type = 'sine';
                oscCore.frequency.setValueAtTime(freq, now);

                const oscClick = this.ctx.createOscillator();
                oscClick.type = 'sawtooth';
                oscClick.frequency.setValueAtTime(freq * 2, now);

                const gainWood = this.ctx.createGain();
                const gainCore = this.ctx.createGain();
                const gainClick = this.ctx.createGain();

                const lowpass = this.ctx.createBiquadFilter();
                lowpass.type = 'lowpass';
                lowpass.frequency.setValueAtTime(freq * 4, now);
                lowpass.frequency.exponentialRampToValueAtTime(freq * 1.2, now + 0.4);

                gainWood.gain.setValueAtTime(0, now);
                gainWood.gain.linearRampToValueAtTime(0.24 * strength, now + 0.01);
                gainWood.gain.exponentialRampToValueAtTime(0.001, now + duration);

                gainCore.gain.setValueAtTime(0, now);
                gainCore.gain.linearRampToValueAtTime(0.18 * strength, now + 0.015);
                gainCore.gain.exponentialRampToValueAtTime(0.001, now + duration * 0.85);

                gainClick.gain.setValueAtTime(0, now);
                gainClick.gain.linearRampToValueAtTime(0.06 * strength, now + 0.002);
                gainClick.gain.exponentialRampToValueAtTime(0.001, now + 0.07);

                oscWood.connect(gainWood);
                oscCore.connect(gainCore);
                oscClick.connect(gainClick);

                gainWood.connect(lowpass);
                gainCore.connect(lowpass);
                gainClick.connect(lowpass);

                lowpass.connect(this.salida);

                doblar(oscWood, 1);
                doblar(oscCore, 1);
                doblar(oscClick, 2);
                oscWood.start(now);
                oscCore.start(now);
                oscClick.start(now);

                oscWood.stop(now + duration + 0.1);
                oscCore.stop(now + duration + 0.1);
                oscClick.stop(now + duration + 0.1);
            }
        }

        /* 0.3: las notas grabadas de cada juego (los nombres de archivo de
         * vendor/sonidos/, con «#» en vez de «s»). Las que faltan se sacan de
         * la grabación más cercana. */
        const MUESTRAS_GUITARRA = {
            "guitar-acoustic": "D2 D#2 E2 F2 F#2 G2 G#2 A2 A#2 B2 C3 C#3 D3 D#3 E3 F3 F#3 G3 G#3 A3 A#3 B3 C4 C#4 D4 D#4 E4 F4 F#4 G4 G#4 A4 A#4 B4 C5 C#5 D5".split(" "),
            "guitar-nylon": "B1 D2 E2 F#2 G#2 A2 B2 C#3 D3 E3 F#3 G3 A3 B3 C#4 D#4 E4 F#4 G#4 A4 B4 C#5 D5 E5 F#5 G5 G#5 A5 A#5".split(" "),
            "guitar-electric": "C#2 E2 F#2 A2 C3 D#3 F#3 A3 C4 D#4 F#4 A4 C5 D#5 F#5 A5 C6".split(" "),
            "bass-electric": "C#1 E1 G1 A#1 C#2 E2 G2 A#2 C#3 E3 G3 A#3 C#4 E4 G4 A#4".split(" ")
        };
        const notaAMidi = (n) => {
            const m = /^([A-G])(#?)(-?\d)$/.exec(n);
            const pc = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]] + (m[2] ? 1 : 0);
            return 12 * (parseInt(m[3], 10) + 1) + pc;
        };
        const TIMBRES = [
            { id: "auto", label: "Según el instrumento" },
            { id: "guitar-acoustic", label: "Guitarra acústica" },
            { id: "guitar-nylon", label: "Guitarra clásica (nylon)" },
            { id: "guitar-electric", label: "Guitarra eléctrica" },
            { id: "bass-electric", label: "Bajo eléctrico" },
            { id: "sinte", label: "Sintetizador de Kharo" }
        ];
        const CLAVE_TIMBRE = "kharo.v03.timbre";

        /* La cita que pide la licencia CC BY 3.0 de las grabaciones. */
        function CreditoSonidos({ corto }) {
            return (
                <p class="k2-ayuda k3-credito">
                    {corto ? "Sonidos: " : "Los sonidos de guitarra y bajo son grabaciones de "}
                    <a href="https://github.com/nbrosowsky/tonejs-instruments" target="_blank" rel="noopener noreferrer">Nicholaus Brosowsky (tonejs-instruments)</a>
                    {", con licencia "}
                    <a href="https://creativecommons.org/licenses/by/3.0/deed.es" target="_blank" rel="noopener noreferrer">CC BY 3.0</a>
                    {corto ? ", tocados con Tone.js." : ". Se tocan con Tone.js."}
                </p>
            );
        }

        /* --- EL HISTORIAL: UNA PILA DE FOTOS -------------------------------
         *
         * De FOTOS y no de acciones, y sale barato porque cada cambio del
         * mástil ya es un gesto discreto: `setBarres` sólo se llama al soltar,
         * `conectarEnRecorrido` una vez en el `pointerUp`. Con acciones habría
         * que escribir el inverso de cada una, y el de «cambiar de instrumento
         * a uno con otro número de cuerdas» —que vacía el mástil— no es una
         * acción inversible: es una foto anterior o no es nada.
         *
         * La comparación va por `JSON.stringify` porque la foto es pequeña y
         * plana, y compararla campo a campo sería otra lista que mantener al
         * día — justo el tipo de lista que se queda vieja sin avisar.
         * -------------------------------------------------------------------- */
        const TOPE_HISTORIAL = 60;

        function useHistorial(foto, aplicar, respiro) {
            const pila = React.useRef([foto]);
            const indice = React.useRef(0);
            /* Aplicar una foto CAMBIA la foto, y ese cambio no es un paso
             * nuevo. Sin esta marca, deshacer empujaría lo deshecho y el
             * rehacer no llegaría nunca a ningún sitio. */
            const aplicando = React.useRef(false);
            /* Y al reponer el mástil guardado al arrancar, la foto que llega no
             * es un paso: es el punto de partida. Sin esto, lo primero que hace
             * Ctrl+Z recién abierta la app es borrarte el trabajo. */
            const rebasar = React.useRef(false);
            const [, repintar] = React.useState(0);

            React.useEffect(() => {
                if (aplicando.current) { aplicando.current = false; return; }

                if (rebasar.current) {
                    rebasar.current = false;
                    pila.current = [foto];
                    indice.current = 0;
                    repintar(n => n + 1);
                    return;
                }

                /* --- EL RESPIRO -------------------------------------------
                 *
                 * UN gesto puede llegar en DOS commits: el clic cambia el modo,
                 * y el efecto que reacciona al modo cambia el recorrido. Sin
                 * esperar, cada gesto así dejaría dos pasos en la pila y el
                 * primer Ctrl+Z parecería no hacer nada — que es peor que no
                 * tener deshacer, porque parece que la app no responde.
                 *
                 * Con la limpieza del efecto, de una ráfaga sólo se guarda la
                 * última foto. La granularidad pasa a ser «lo que hiciste, ya
                 * asentado», que es como se cuenta un paso cuando lo cuenta una
                 * persona.
                 * ---------------------------------------------------------- */
                const t = setTimeout(() => {
                    if (JSON.stringify(foto) === JSON.stringify(pila.current[indice.current])) return;

                    // Un paso nuevo desde el medio tira lo que había por delante.
                    const recorte = pila.current.slice(0, indice.current + 1);
                    recorte.push(foto);
                    if (recorte.length > TOPE_HISTORIAL) recorte.shift();
                    pila.current = recorte;
                    indice.current = recorte.length - 1;
                    repintar(n => n + 1);
                }, respiro || 150);

                return () => clearTimeout(t);
            }, [foto]);

            const mover = (paso) => {
                const destino = indice.current + paso;
                if (destino < 0 || destino >= pila.current.length) return false;
                indice.current = destino;
                aplicando.current = true;
                aplicar(pila.current[destino]);
                repintar(n => n + 1);
                return true;
            };

            return {
                deshacer: () => mover(-1),
                rehacer: () => mover(+1),
                rebasar: () => { rebasar.current = true; },
                hayQueDeshacer: indice.current > 0,
                hayQueRehacer: indice.current < pila.current.length - 1
            };
        }

        /* --- TINTA LEGIBLE SOBRE UN COLOR CUALQUIERA -----------------------
         *
         * Los colores de intervalo son OBRA: los elige el usuario y salen en el
         * archivo exportado, así que NO se pueden cambiar por contraste. Lo que
         * sí es piel es la tinta de la ficha de la leyenda, y ahí el blanco fijo
         * daba 1,56:1 sobre el amarillo del grado 3 — un número que no se lee.
         *
         * El umbral sale de igualar los dos contrastes: el blanco y el negro
         * empatan cuando (L + 0,05)² = 0,0525, o sea en L ≈ 0,179. Se calcula
         * sobre la luminancia RELATIVA y no sobre el brillo ingenuo, porque el
         * verde pesa siete veces más que el azul para el ojo.
         * ------------------------------------------------------------------- */
        const tintaLegibleSobre = (color) => {
            const m = String(color).match(/^#?([0-9a-fA-F]{6})$/);
            if (!m) return 'var(--k-text)';
            const n = parseInt(m[1], 16);
            const canal = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
            const L = 0.2126 * canal((n >> 16) & 255) + 0.7152 * canal((n >> 8) & 255) + 0.0722 * canal(n & 255);
            return L > 0.179 ? '#0B1220' : '#FFFFFF';
        };

        /* --- SELECTOR DE APARTADO -----------------------------------------
         * Va guiado por datos para que añadir un apartado sea una entrada más

        /* Dos grupos, no cinco pestañas seguidas. Tres de ellas dibujan un

        function ModeTabs({ items, active, onSelect, stretch }) {
            /* Dos `.k-tabs` seguidos se leen ya como dos grupos: la clase trae
             * su propio fondo y su propio borde, así que la separación no
             * necesita CSS nuevo.
             *
             * En `stretch` (móvil, fila completa) el reparto se hace aquí: la
             * clase asume UN nav a ancho completo, y con dos hay que darle a
             * cada uno su parte.
             *
             * Se reparte por LARGO DEL TEXTO, no por número de pestañas. Con el
             * número, «Canción · Ejercicios» —dos palabras largas— recibía un
             * tercio del ancho y las dos salían cortadas, mientras «Libre» iba
             * sobrada de sitio en el otro grupo. */
            const grupos = GRUPOS_TABS

                            aria-label={NOMBRE_GRUPO_TABS[g]}
                            class={`k-tabs ${stretch ? "k-tabs--stretch" : ""}`}

                                    key={item.id}

                                    /* Y dentro de cada grupo, lo mismo: a partes

                                     * «Arpegios» salía cortada al lado. */
                                    style={stretch ? { flex: `${item.label.length} 1 0` } : undefined}

                        );
                        /* En escritorio cada grupo lleva su nombre al lado:
                         * es lo que en la portada dicen los rótulos de sección,

                        if (stretch) return nav;
                        return (

            );
        }

        /* --- EL MÁSTIL QUE SUENA (sólo en la prueba) -------------------------
         *
         * La portada empieza tocando: seis cuerdas que vibran al pasar por
         * encima y suenan al pulsarlas o al arrastrar el dedo, con el mismo
         * sintetizador que usa el estudio (`synthInstance`).
         *
         * Debajo, unos botones de acorde: al elegir uno, sus dedos se dibujan
         * en el mástil, suena un rasgueo, y desde ese momento cada cuerda
         * suena con la nota que le toca a ese acorde. Las cuerdas que el
         * acorde no usa se apagan: se ven tenues y no suenan.
         *
         * El sonido sólo arranca tras un gesto (clic o toque): el navegador
         * no deja abrir el audio con un simple paso del ratón. Mientras no
         * haya habido gesto, pasar por encima sólo hace vibrar la cuerda.
         *
         * Es PIEL, no obra: no se exporta y no usa DEFAULT_STYLE.
         * ------------------------------------------------------------------ */

        /* Digitaciones de grave a agudo (E A D G B e), como se escriben en
         * cualquier cancionero. -1 es cuerda apagada, 0 al aire. `cejilla`
         * marca el traste que pisa el índice entero. */
        const ACORDES_PORTADA = [
            { id: "aire", nombre: "Al aire", trastes: [0, 0, 0, 0, 0, 0] },
            { id: "C",  nombre: "C",  trastes: [-1, 3, 2, 0, 1, 0] },
            { id: "G",  nombre: "G",  trastes: [3, 2, 0, 0, 0, 3] },
            { id: "D",  nombre: "D",  trastes: [-1, -1, 0, 2, 3, 2] },
            { id: "Am", nombre: "Am", trastes: [-1, 0, 2, 2, 1, 0] },
            { id: "Em", nombre: "Em", trastes: [0, 2, 2, 0, 0, 0] },
            { id: "E",  nombre: "E",  trastes: [0, 2, 2, 1, 0, 0] },
            { id: "A",  nombre: "A",  trastes: [-1, 0, 2, 2, 2, 0] },
            { id: "F",  nombre: "F",  trastes: [1, 3, 3, 2, 1, 1], cejilla: 1 }
        ];

        /* 0.3: el mástil de la portada se dibuja como los diagramas que hace
         * el Taller: en vertical, la cejuela arriba, cinco trastes, la grave a
         * la izquierda, el nombre del acorde encima y la ○ / × de cada cuerda.
         * Se toca igual: se pasa el dedo de lado a lado por las cuerdas. Y
         * suena con las guitarras grabadas, no con el sintetizador. */
        function MastilVivo() {
            // De grave a aguda, de izquierda a derecha, como en un diagrama.
            const CUERDAS = [
                { nota: "E", midi: 40, grosor: 3.2 },
                { nota: "A", midi: 45, grosor: 2.7 },
                { nota: "D", midi: 50, grosor: 2.2 },
                { nota: "G", midi: 55, grosor: 1.8 },
                { nota: "B", midi: 59, grosor: 1.4 },
                { nota: "e", midi: 64, grosor: 1.1 }
            ];
            const W = 360, TRASTES = 5;
            const X0 = 62, X1 = 298;                       // primera y última cuerda
            const Y_TITULO = 46, Y_MARCAS = 84, Y_CEJUELA = 102, ALTO_TRASTE = 62;
            const Y_FIN = Y_CEJUELA + TRASTES * ALTO_TRASTE;
            const H = Y_FIN + 52;
            const SEP = (X1 - X0) / (CUERDAS.length - 1);
            const xDe = (i) => X0 + i * SEP;
            const yTraste = (k) => Y_CEJUELA + k * ALTO_TRASTE;
            const centroCasilla = (k) => (yTraste(k - 1) + yTraste(k)) / 2;

            const [acordeId, setAcordeId] = React.useState("aire");
            const acorde = ACORDES_PORTADA.find(a => a.id === acordeId) || ACORDES_PORTADA[0];
            const trasteDe = (i) => acorde.trastes[i];

            const [vibra, setVibra] = React.useState({});
            const svgRef = React.useRef(null);
            const ultima = React.useRef(null);
            const conSonido = React.useRef(false);
            const acordeRef = React.useRef(acorde);
            acordeRef.current = acorde;

            // La portada suena SIEMPRE a guitarra acústica grabada. Si las
            // muestras aún no han llegado (el primer gesto las pide), se
            // espera a que lleguen en vez de sonar al sintetizador.
            const JUEGO = "guitar-acoustic";
            const sonar = (midi, retraso) => {
                const tocar = () => synthInstance.playNote(midi, 1.8, retraso || 0, 0.75, null, JUEGO);
                if (synthInstance.muestrasListas(JUEGO)) tocar();
                else synthInstance.esperarMuestras(JUEGO).then(tocar);
            };

            const pulsar = (i, retraso) => {
                const traste = acordeRef.current.trastes[i];
                if (traste < 0) return;   // apagada: ni vibra ni suena
                setVibra(v => ({ ...v, [i]: (v[i] || 0) + 1 }));
                const ctx = synthInstance.ctx;
                if (conSonido.current || (ctx && ctx.state === "running")) sonar(CUERDAS[i].midi + traste, retraso);
            };

            // Qué cuerda hay bajo el puntero, o null si está entre dos.
            const cuerdaEn = (clientX) => {
                const svg = svgRef.current;
                if (!svg) return null;
                const r = svg.getBoundingClientRect();
                const x = (clientX - r.left) * W / r.width;
                const i = Math.round((x - X0) / SEP);
                if (i < 0 || i >= CUERDAS.length) return null;
                return Math.abs(x - xDe(i)) < SEP * 0.38 ? i : null;
            };

            const alMover = (e) => {
                const i = cuerdaEn(e.clientX);
                if (i !== null && i !== ultima.current) pulsar(i);
                ultima.current = i;
            };

            const alPulsar = (e) => {
                conSonido.current = true;
                synthInstance.init();
                synthInstance.cargarMuestras(JUEGO);
                if (e.currentTarget.setPointerCapture) e.currentTarget.setPointerCapture(e.pointerId);
                const i = cuerdaEn(e.clientX);
                if (i !== null) pulsar(i);
                ultima.current = i;
            };

            const alSoltar = () => { ultima.current = null; };

            // De grave a aguda, como baja la púa.
            const rasguear = () => {
                conSonido.current = true;
                synthInstance.init();
                synthInstance.cargarMuestras(JUEGO);
                [0, 1, 2, 3, 4, 5].forEach((i, n) => setTimeout(() => pulsar(i), n * 45));
            };

            const elegir = (id) => {
                const nuevo = ACORDES_PORTADA.find(a => a.id === id);
                setAcordeId(id);
                acordeRef.current = nuevo;
                rasguear();
            };

            return (
                <div class="k3-mastil-portada">
                    <div
                        class="kp-mastil k3-mastil-vertical"
                        onPointerMove={alMover}
                        onPointerDown={alPulsar}
                        onPointerUp={alSoltar}
                        onPointerLeave={alSoltar}
                    >
                        <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} role="img" aria-label={`Diagrama de guitarra con el acorde ${acorde.nombre}. Suena al pasar el dedo por las cuerdas.`}>

                                {acorde.id === "aire" ? "Al aire" : acorde.nombre}
                            </text>

                            {/* Las incrustaciones del 3 y el 5. */}
                            {[3, 5].map(k => (
                                <circle key={k} cx={W / 2} cy={centroCasilla(k)} r="8" fill="#E9DFC9" opacity="0.85" />
                            ))}

                            {/* Trastes */}
                            {Array.from({ length: TRASTES }, (_, n) => n + 1).map(k => (
                                <line key={k} x1={X0 - 14} y1={yTraste(k)} x2={X1 + 14} y2={yTraste(k)} stroke="#B8B2A6" strokeWidth="2.5" />
                            ))}
                            {/* Números de traste, a la derecha. */}
                            {Array.from({ length: TRASTES }, (_, n) => n + 1).map(k => (
                                <text key={`n${k}`} x={X1 + 30} y={centroCasilla(k) + 5} textAnchor="middle" fontFamily="Segoe UI, system-ui, sans-serif" fontSize="13" fill="#B9A98C">{k}</text>
                            ))}

                            {/* Cejuela */}
                            <rect x={X0 - 16} y={Y_CEJUELA - 8} width={X1 - X0 + 32} height={8} rx="2" fill="#F3EBDD" />

                            {/* Cuerdas, con su ○ o × arriba y su nota abajo. */}
                            {CUERDAS.map((c, i) => {
                                const traste = trasteDe(i);
                                const apagada = traste < 0;
                                const activa = vibra[i] && !apagada;
                                return (
                                    <g key={i} opacity={apagada ? 0.35 : 1}>
                                        {traste === 0 && <circle cx={xDe(i)} cy={Y_MARCAS} r="8" fill="none" stroke={activa ? "#ACEC00" : "#E9DFC9"} strokeWidth="2.2" />}
                                        {apagada && <path d={`M${xDe(i) - 7} ${Y_MARCAS - 7} L${xDe(i) + 7} ${Y_MARCAS + 7} M${xDe(i) + 7} ${Y_MARCAS - 7} L${xDe(i) - 7} ${Y_MARCAS + 7}`} stroke="#E9DFC9" strokeWidth="2.2" strokeLinecap="round" />}
                                        <line
                                            key={vibra[i] || 0}
                                            class={vibra[i] ? "kp-cuerda k3-cuerda-v k3-cuerda-v--vibra" : "kp-cuerda k3-cuerda-v"}
                                            x1={xDe(i)} y1={Y_CEJUELA} x2={xDe(i)} y2={Y_FIN + 6}
                                            stroke={i > 3 ? "#ECECEC" : "#D8C08A"}
                                            strokeWidth={c.grosor}
                                            strokeLinecap="round"
                                        />
                                        <text x={xDe(i)} y={Y_FIN + 34} textAnchor="middle" fontFamily="Segoe UI, system-ui, sans-serif" fontSize="16" fontWeight="700" fill={activa ? "#ACEC00" : "#CDBFA3"}>
                                            {c.nota}
                                        </text>
                                    </g>
                                );
                            })}

                            {/* La cejilla, debajo de los dedos. */}
                            {acorde.cejilla && (
                                <rect
                                    x={xDe(0) - 13}
                                    y={centroCasilla(acorde.cejilla) - 13}
                                    width={xDe(CUERDAS.length - 1) - xDe(0) + 26}
                                    height={26}
                                    rx="13"
                                    fill="#ACEC00"
                                    opacity="0.92"
                                />
                            )}

                            {/* Los dedos del acorde. */}
                            {CUERDAS.map((c, i) => {
                                const traste = trasteDe(i);
                                if (traste <= 0) return null;
                                if (acorde.cejilla && traste === acorde.cejilla) return null;
                                return (
                                    <g key={`${acordeId}-${i}`} class="kp-dedo">
                                        <circle cx={xDe(i)} cy={centroCasilla(traste)} r="15" fill="#ACEC00" stroke="#16181D" strokeWidth="2" />
                                    </g>
                                );
                            })}
                        </svg>
                    </div>

                    {/* A la derecha del diagrama: los acordes en columna y,
                        debajo, el rasgueo. */}
                    <div class="k3-mastil-portada__lado">
                        <div class="kp-acordes k3-acordes-columna" role="group" aria-label="Elegir acorde">

                            Rasguear {acorde.id === "aire" ? "al aire" : acorde.nombre} ↓
                        </button>
                    </div>
                </div>
            );
        }

        /* El interruptor claro / oscuro. Se guarda en este navegador: es una

        function InterruptorModo() {
            const [modo, setModo] = React.useState(
                () => document.documentElement.getAttribute("data-theme") === "oscuro" ? "oscuro" : "claro"

            const oscuro = modo === "oscuro";
            const cambiar = () => {
                const nuevo = oscuro ? "claro" : "oscuro";
                document.documentElement.setAttribute("data-theme", nuevo);
                try { localStorage.setItem("kharo.prueba.modo", nuevo); } catch (e) {}
                setModo(nuevo);
            };
            return (
                <button
                    onClick={cambiar}
                    class="kp-modo"
                    aria-pressed={oscuro}
                    aria-label={oscuro ? "Modo claro" : "Modo oscuro"}

        /* --- LOS INSTRUMENTOS DEL TALLER (sólo en la prueba) -------------------
         *
         * Todo sale de `theory-core.js` —INSTRUMENT_ORDER, INSTRUMENTS y
         * TUNING_PRESETS— y nada se escribe a mano. Si mañana entra la mandolina
         * en el núcleo, aparece aquí sola; y si algo deja de estar, deja de
         * prometerse. Es la regla de la voz: sólo se dice lo que se puede
         * comprobar.
         *
         * Cada ficha dibuja la cejuela del instrumento con su número real de
         * cuerdas, más gruesas cuanto más graves, y abre el Taller en Escalas
         * con ese instrumento puesto.
         * ------------------------------------------------------------------ */
        function CejuelaMini({ instrumento }) {
            const n = instrumento.strings;
            const W = 120, H = 92, MARGEN = 18;
            const paso = (W - 2 * MARGEN) / (n - 1);
            const esBajo = instrumento.id.startsWith("bass");
            const esUke = instrumento.id.startsWith("uke");
            // Grosor por cuerda: de la más grave (izquierda) a la más aguda.
            const grosor = (i) => {
                if (esUke) return 1.7;
                const max = esBajo ? 3.8 : 3, min = esBajo ? 2 : 1;
                return max - (max - min) * i / Math.max(1, n - 1);
            };
            const color = (i) => {
                if (esUke) return "#EDE6D6";               // nailon
                if (esBajo) return "#C9CDD3";              // entorchado de acero
                return i < n / 2 ? "#C9A15A" : "#E4E7EB";  // bronce y acero
            };
            return (
                <svg viewBox={`0 0 ${W} ${H}`} class="kp-cejuela-mini" aria-hidden="true">
                    <rect x="4" y="4" width={W - 8} height={H - 8} rx="8" fill="#2E2016" />
                    {[34, 62].map(y => <line key={y} x1="8" y1={y} x2={W - 8} y2={y} stroke="#B8B2A6" strokeWidth="2" />)}
                    <rect x="8" y="10" width={W - 16} height="5" rx="2" fill="#EFE6D2" />
                    {Array.from({ length: n }, (_, i) => (
                        <line key={i} x1={MARGEN + i * paso} y1="10" x2={MARGEN + i * paso} y2={H - 4} stroke={color(i)} strokeWidth={grosor(i)} />
                    ))}
                </svg>
            );
        }

        /* --- EL MENÚ DE CLIC DERECHO -----------------------------------------
         *
         * Estaba escrito DOS VECES, palabra por palabra: una para el menú de
         * una flecha del recorrido y otra para el de una tríada. Las dos
         * copias sólo se diferenciaban en la lista de opciones y en cómo
         * adivinaban su propio alto para no salirse de la pantalla —una con un
         * 190 a pelo, la otra con una fórmula—, que es justo lo que un
         * componente puede medir de verdad en vez de estimar.
         *
         * Se mide después de pintar, con la caja real, y sólo se recoloca si
         * hace falta: así el menú nunca queda medio fuera por abajo aunque
         * lleve siete opciones o el navegador use otro tamaño de letra.
         *
         * `orientacion: "horizontal"` pone las opciones en fila. Es para
         * elegir ENTRE ESTADOS —los seis de una casilla de rasgueo—, donde una
         * lista vertical obliga a leer seis renglones para algo que se
         * reconoce de un vistazo por su flecha.
         *
         * REGLA: toda acción que viva aquí tiene que existir también con un
         * clic normal en algún sitio. En un teléfono no hay botón derecho, y un
         * menú contextual es lo único que no se puede descubrir tocando.
         * ------------------------------------------------------------------ */
        function MenuContextual({ x, y, titulo, opciones, orientacion, onCerrar }) {
            const cajaRef = React.useRef(null);
            const [pos, setPos] = React.useState({ left: x, top: y });

            const horizontal = orientacion === "horizontal";

            React.useLayoutEffect(() => {
                const nodo = cajaRef.current;
                if (!nodo) return;
                const caja = nodo.getBoundingClientRect();
                const margen = 8;
                const left = Math.max(margen, Math.min(x, window.innerWidth - caja.width - margen));
                const top = Math.max(margen, Math.min(y, window.innerHeight - caja.height - margen));
                setPos(prev => (prev.left === left && prev.top === top) ? prev : { left, top });
            }, [x, y, opciones.length, horizontal]);

            return (
                <React.Fragment>
                    <div
                        class="fixed inset-0 z-40"
                        onClick={onCerrar}
                        onContextMenu={(e) => { e.preventDefault(); onCerrar(); }}
                    />
                    <div
                        ref={cajaRef}
                        class="fixed z-50 k-panel p-1 shadow-2xl"
                        style={{
                            left: pos.left + 'px',
                            top: pos.top + 'px',
                            /* Sin ancho declarado, un `fixed` se ajusta al
                               contenido y la opción más larga lo estira media
                               pantalla. En horizontal es al revés: se deja
                               crecer, porque lo que se alinea es una fila. */
                            width: horizontal ? 'auto' : '212px',
                            whiteSpace: horizontal ? 'nowrap' : 'normal'
                        }}
                    >
                        {titulo && <div class="k-label px-2 pt-1 pb-1.5">{titulo}</div>}
                        <div class={horizontal ? "flex items-center gap-1" : ""}>
                            {opciones.map((op, i) => (
                                <button
                                    key={op.key || op.label || i}
                                    onClick={() => { op.hacer(); if (!op.mantener) onCerrar(); }}
                                    title={op.ayuda || op.label}
                                    disabled={op.desactivada}
                                    /* `.k-btn` centra su contenido, que está bien
                                       en una barra y mal en una lista de opciones. */
                                    class={"k-btn k-btn--ghost k-text-sm "
                                        + (horizontal ? "px-2 py-1.5 shrink-0" : "w-full px-2 py-1.5")}
                                    style={horizontal
                                        ? (op.estilo || {})
                                        : Object.assign({ justifyContent: 'flex-start', textAlign: 'left' }, op.estilo || {})}
                                >
                                    {op.label}
                                </button>
                            ))}
                        </div>
                    </div>
                </React.Fragment>
            );
        }

        /* --- 0.3: EL VOLUMEN ----------------------------------------------------
         * Se abre con clic derecho (o pulsación larga) en «Reproducir». Mismo
         * dibujo y misma forma de colocarse que `MenuContextual`, pero con un
         * deslizador en vez de una lista: el volumen se ajusta oyendo, así que
         * el cambio es inmediato y «Probar» toca sin cerrar el menú. */
        function MenuVolumen({ x, y, onProbar, onCerrar }) {
            const cajaRef = React.useRef(null);
            const deslizRef = React.useRef(null);
            const [pos, setPos] = React.useState({ left: x, top: y });
            const [pct, setPct] = React.useState(Math.round(synthInstance.volumen * 100));
            const antesDeSilenciar = React.useRef(pct || 80);

            React.useLayoutEffect(() => {
                const nodo = cajaRef.current;
                if (!nodo) return;
                const caja = nodo.getBoundingClientRect();
                const margen = 8;
                setPos({
                    left: Math.max(margen, Math.min(x, window.innerWidth - caja.width - margen)),
                    top: Math.max(margen, Math.min(y, window.innerHeight - caja.height - margen))
                });
                if (deslizRef.current) deslizRef.current.focus();
            }, [x, y]);

            React.useEffect(() => {
                const tecla = (e) => { if (e.key === "Escape") onCerrar(); };
                window.addEventListener("keydown", tecla);
                return () => window.removeEventListener("keydown", tecla);
            }, [onCerrar]);

            const poner = (v) => {
                setPct(v);
                synthInstance.setVolumen(v / 100);
            };
            const silenciar = () => {
                if (pct > 0) { antesDeSilenciar.current = pct; poner(0); }
                else poner(antesDeSilenciar.current || 80);
            };

            return (
                <React.Fragment>
                    <div
                        class="fixed inset-0 z-40"
                        onClick={onCerrar}
                        onContextMenu={(e) => { e.preventDefault(); onCerrar(); }}
                    />
                    <div
                        ref={cajaRef}
                        role="dialog"
                        aria-label="Volumen"
                        class="fixed z-50 k-panel shadow-2xl k3-volumen"
                        style={{ left: pos.left + 'px', top: pos.top + 'px' }}
                    >
                        <div class="k3-volumen__cabeza">
                            <span class="k-label">Volumen</span>
                            <span class="k3-volumen__valor">{pct}%</span>
                        </div>
                        <div class="k3-volumen__fila">
                            <button
                                type="button"
                                onClick={silenciar}
                                class="k-btn k-btn--ghost k3-volumen__icono"
                                aria-label={pct > 0 ? "Silenciar" : "Quitar el silencio"}
                                title={pct > 0 ? "Silenciar" : "Quitar el silencio"}
                            >
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                                    <path d="M11 5 6 9H3v6h3l5 4V5z" fill="currentColor" />
                                    {pct === 0
                                        ? <path d="m16 9 5 6m0-6-5 6" />
                                        : <React.Fragment>
                                            <path d="M15.5 8.5a5 5 0 0 1 0 7" />
                                            {pct > 50 && <path d="M18.5 5.5a9 9 0 0 1 0 13" />}
                                          </React.Fragment>}
                                </svg>
                            </button>
                            <input
                                ref={deslizRef}
                                type="range"
                                min="0"
                                max="100"
                                step="1"
                                value={pct}
                                onChange={(e) => poner(+e.target.value)}
                                class="k3-volumen__desliz"
                                style={{ '--k3-lleno': pct + '%' }}
                                aria-label="Volumen general"
                                aria-valuetext={`${pct} por ciento`}
                            />
                        </div>
                        <button type="button" onClick={onProbar} class="k-btn k-btn--outline k-text-sm w-full py-1.5">
                            Probar
                        </button>
                    </div>
                </React.Fragment>
            );
        }

        /* --- BORRAR Y CERRAR NO SON LO MISMO ---------------------------------
         *
         * Toda la app usaba una × para las dos cosas, y encima con
         * `k-btn--ghost` en los dos casos: quitar un acorde de la biblioteca
         * —que lo saca también de todos los compases donde estuviera— se veía
         * exactamente igual que cerrar un panel.
         *
         * Ahora borrar es una papelera, que es lo que todo el mundo reconoce, y
         * la × queda sólo para cerrar. Están como componentes y no como clases
         * porque estaban copiados a mano en nueve sitios y cada retoque había
         * que hacerlo nueve veces.
         *
         * Las × que NO son botones se quedan como están: la de una cuerda
         * muteada en el mástil es notación musical, la de una casilla apagada
         * del rasgueo también, y el «×3» de las repeticiones es el signo «por».
         * ------------------------------------------------------------------ */
        function IconoPapelera({ className }) {
            return (
                <svg xmlns="http://www.w3.org/2000/svg" class={className || "h-3.5 w-3.5"}
                     viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                    <path d="M3 6h18" />
                    <path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2" />
                    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
                    <path d="M10 11v6" />
                    <path d="M14 11v6" />
                </svg>
            );
        }

        function BotonBorrar({ onClick, onContextMenu, title, label, className, size }) {
            return (
                <button
                    onClick={onClick}
                    onContextMenu={onContextMenu}
                    title={title}
                    aria-label={title}
                    class={"k-btn k-btn--danger " + (label ? "k-text-xs px-2 py-1.5 gap-1 " : "px-1.5 py-1 ") + (className || "")}
                >
                    <IconoPapelera className={size || "h-3.5 w-3.5"} />
                    {label && <span>{label}</span>}
                </button>
            );
        }

        function BotonCerrar({ onClick, title, className, style }) {
            return (
                <button
                    onClick={onClick}
                    title={title || "Cerrar"}
                    aria-label={title || "Cerrar"}
                    class={"k-btn k-btn--ghost k-btn--icon " + (className || "")}
                    style={style}
                >
                    ×
                </button>
            );
        }

        /* ==================================================================
         * COMPONENTES BASE DE LA 0.2
         * ==================================================================
         * Las piezas con las que se arma todo el Taller reorganizado. Existen
         * para que la accesibilidad venga de serie: un grupo de opciones hecho
         * con `Segmentado` ya es un radiogroup que se mueve con las flechas, un
         * `Interruptor` ya es un switch con su estado, un `BotonIcono` no se
         * puede escribir sin nombre. Antes cada grupo estaba hecho a mano y a
         * cada uno le faltaba algo distinto.
         *
         * Estilos en ui.css (clases .k2-*).
         * ================================================================== */

        // Un id estable por instancia, para atar etiquetas y ayudas.
        let __k2Contador = 0;
        function useIdUnico(prefijo) {
            const ref = React.useRef(null);
            if (ref.current === null) ref.current = `${prefijo || "k2"}-${++__k2Contador}`;
            return ref.current;
        }

        /* --- ICONOS -----------------------------------------------------------
         * Un trazo, 24×24, `currentColor`. Sustituyen a los emojis de la barra
         * (♪ 🎸 🎨 🎯 ⬇), que cada sistema pinta a su manera y que un lector de
         * pantalla lee como «nota musical», «guitarra», «paleta»… */
        const ICONOS = {
            tocar: <React.Fragment><path d="M9 18V5l11-2v13" /><circle cx="6" cy="18" r="3" /><circle cx="17" cy="16" r="3" /></React.Fragment>,
            vista: <React.Fragment><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" /><circle cx="12" cy="12" r="3" /></React.Fragment>,
            instrumento: <React.Fragment><path d="M5 3h4v18H5zM15 3h4v18h-4z" /><path d="M9 8h6M9 16h6" /></React.Fragment>,
            estilo: <React.Fragment><path d="M12 3a9 9 0 1 0 0 18c1 0 1.5-.8 1.5-1.6 0-1.4-1.1-1.6-1.1-2.9 0-1 .8-1.5 1.8-1.5H17a4 4 0 0 0 4-4c0-4.4-4-8-9-8z" /><circle cx="7.5" cy="11" r="1" /><circle cx="10" cy="7" r="1" /><circle cx="14.5" cy="7" r="1" /></React.Fragment>,

            // 0.3
            tablatura: <React.Fragment><path d="M3 6h18M3 10h18M3 14h18M3 18h18" /><rect x="6.5" y="8" width="4" height="4" rx="1" fill="currentColor" stroke="none" /><rect x="13.5" y="12" width="4" height="4" rx="1" fill="currentColor" stroke="none" /></React.Fragment>,
            biblioteca: <React.Fragment><path d="M4 4h3v16H4zM9 4h3v16H9z" /><path d="M14.5 5.2l2.9-.8 3.6 15-2.9.8z" /></React.Fragment>,

            fijar: <React.Fragment><path d="M9 3h6l-1 6 4 4H6l4-4z" /><path d="M12 13v8" /></React.Fragment>,
            etiqueta: <React.Fragment><path d="M3 12V4h8l10 10-8 8z" /><circle cx="7.5" cy="8.5" r="1.4" /></React.Fragment>,
