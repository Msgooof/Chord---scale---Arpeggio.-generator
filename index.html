        function Icono({ nombre, tam }) {
            return (
                <svg width={tam || 18} height={tam || 18} viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" focusable="false">
                    {ICONOS[nombre] || null}
                </svg>
            );
        }

        /* --- BOTÓN DE ICONO -----------------------------------------------------
         * `etiqueta` es OBLIGATORIA: es lo que dice un lector de pantalla y lo
         * que sale al pasar por encima. Si falta, el botón no se pinta y se
         * avisa en consola, para que el olvido salte en la primera prueba. */
        function BotonIcono({ icono, etiqueta, onClick, disabled, activo, variante, className, extra }) {
            if (!etiqueta) {
                console.error("BotonIcono sin etiqueta:", icono);
                return null;
            }
            return (
                <button
                    type="button"
                    onClick={onClick}
                    disabled={disabled}
                    aria-label={etiqueta}
                    title={etiqueta}
                    aria-pressed={activo === undefined ? undefined : !!activo}
                    class={`k2-icono k2-icono--${variante || "suave"} ${activo ? "k2-icono--activo" : ""} ${className || ""}`}
                    {...(extra || {})}
                >
                    <Icono nombre={icono} />
                </button>
            );
        }

        /* --- SEGMENTADO ---------------------------------------------------------
         * Elegir UNA opción entre pocas. Es un radiogroup: Tab entra al grupo
         * (a la opción elegida) y las flechas se mueven dentro, como pide la
         * norma. `opciones`: [{ id, label, ayuda?, desactivada? }]. */
        function Segmentado({ etiqueta, opciones, valor, onCambio, ancho, tam, envolver }) {
            const refs = React.useRef([]);
            const idEtiqueta = useIdUnico("seg");
            const activas = opciones.filter(o => !o.desactivada);
            const mover = (e, i) => {
                const dir = (e.key === "ArrowRight" || e.key === "ArrowDown") ? 1
                          : (e.key === "ArrowLeft" || e.key === "ArrowUp") ? -1 : 0;
                if (!dir) return;
                e.preventDefault();
                let j = i;
                for (let n = 0; n < opciones.length; n++) {
                    j = (j + dir + opciones.length) % opciones.length;
                    if (!opciones[j].desactivada) break;
                }
                onCambio(opciones[j].id);
                const nodo = refs.current[j];
                if (nodo) nodo.focus();
            };
            const elegida = opciones.some(o => o.id === valor) ? valor : (activas[0] && activas[0].id);
            return (
                <div class="k2-campo-seg">
                    {etiqueta && <span id={idEtiqueta} class="k2-etiqueta">{etiqueta}</span>}
                    <div
                        role="radiogroup"
                        aria-labelledby={etiqueta ? idEtiqueta : undefined}
                        class={`k2-seg ${ancho ? "k2-seg--ancho" : ""} ${tam === "sm" ? "k2-seg--sm" : ""} ${envolver ? "k2-seg--envolver" : ""}`}
                    >
                        {opciones.map((o, i) => (
                            <button
                                key={o.id}
                                ref={n => refs.current[i] = n}
                                type="button"
                                role="radio"
                                aria-checked={o.id === elegida}
                                tabIndex={o.id === elegida ? 0 : -1}
                                disabled={o.desactivada}
                                title={o.ayuda}
                                onClick={() => onCambio(o.id)}
                                onKeyDown={(e) => mover(e, i)}
                                class={`k2-seg__op ${o.id === elegida ? "k2-seg__op--activa" : ""}`}
                            >
                                {o.label}
                            </button>
                        ))}
                    </div>
                </div>
            );
        }

        /* --- INTERRUPTOR ----------------------------------------------------------
         * Encender o apagar UNA cosa. Toda la fila es el botón —etiqueta
         * incluida—, así que se acierta con el dedo aunque el carril sea
         * pequeño. `ayuda` va debajo y el lector la asocia por describedby. */
        function Interruptor({ etiqueta, valor, onCambio, ayuda, desactivado }) {
            const idAyuda = useIdUnico("int");
            return (
                <div class="k2-interruptor-fila">
                    <button
                        type="button"
                        role="switch"
                        aria-checked={!!valor}
                        aria-describedby={ayuda ? idAyuda : undefined}
                        disabled={desactivado}
                        onClick={() => onCambio(!valor)}
                        class="k2-interruptor"
                    >
                        <span class="k2-interruptor__texto">{etiqueta}</span>
                        <span class={`k2-interruptor__carril ${valor ? "k2-interruptor__carril--on" : ""}`} aria-hidden="true">
                            <span class="k2-interruptor__bola" />
                        </span>
                    </button>
                    {ayuda && <p id={idAyuda} class="k2-ayuda">{ayuda}</p>}
                </div>
            );
        }

        /* --- CAMPO -----------------------------------------------------------------
         * Una etiqueta visible atada a su control. `hijo` es una función que
         * recibe el id (y el id de la ayuda) para ponérselo al input o select:
         *   <Campo etiqueta="Tónica">{(id) => <select id={id} …/>}</Campo> */
        function Campo({ etiqueta, ayuda, children, enLinea }) {
            const id = useIdUnico("campo");
            const idAyuda = `${id}-ayuda`;
            return (
                <div class={`k2-campo ${enLinea ? "k2-campo--linea" : ""}`}>
                    <label htmlFor={id} class="k2-etiqueta">{etiqueta}</label>
                    {children(id, ayuda ? idAyuda : undefined)}
                    {ayuda && <p id={idAyuda} class="k2-ayuda">{ayuda}</p>}
                </div>
            );
        }

        /* --- SECCIÓN PLEGABLE --------------------------------------------------------
         * Las cajas del inspector. Recuerda si estaba abierta (por `id`) en
         * este navegador: es una comodidad de quien mira, no un dato suyo. */
        function Seccion({ id, titulo, children, abiertaPorDefecto, extra }) {
            const clave = `kharo.v02.seccion.${id}`;
            const [abierta, setAbierta] = React.useState(() => {
                try {
                    const v = localStorage.getItem(clave);
                    if (v === "1") return true;
                    if (v === "0") return false;
                } catch (e) {}
                return abiertaPorDefecto !== false;
            });
            const idCuerpo = useIdUnico("sec");
            const alternar = () => {
                const nuevo = !abierta;
                setAbierta(nuevo);
                try { localStorage.setItem(clave, nuevo ? "1" : "0"); } catch (e) {}
            };
            return (
                <section class="k2-seccion">
                    <div class="k2-seccion__cabeza">
                        <button type="button" class="k2-seccion__boton" aria-expanded={abierta} aria-controls={idCuerpo} onClick={alternar}>
                            <span class={`k2-seccion__flecha ${abierta ? "k2-seccion__flecha--abierta" : ""}`} aria-hidden="true">
                                <Icono nombre="adelante" tam={16} />
                            </span>
                            <span>{titulo}</span>
                        </button>
                        {extra}
                    </div>
                    {abierta && <div id={idCuerpo} class="k2-seccion__cuerpo">{children}</div>}
                </section>
            );
        }

        /* --- MENÚ DE ACCIONES «⋯» --------------------------------------------------------
         * La versión visible del clic derecho. Reutiliza `MenuContextual`
         * —mismo dibujo, mismas opciones—, sólo cambia cómo se abre: con un
         * botón que se ve, con una pulsación larga en `objetivo`, y con el
         * teclado. Al cerrar, el foco vuelve al botón.
         *
         * `crearPulsacionLarga(ref, abrir)` da los manejadores para
         * cualquier elemento que hoy sólo tenga `onContextMenu`. */
        function crearPulsacionLarga(ref, abrir, ms) {
            const cancelar = () => { clearTimeout(ref.current.t); ref.current.t = null; };
            return {
                onPointerDown: (e) => {
                    if (e.pointerType === "mouse") return;
                    cancelar();
                    ref.current.x = e.clientX;
                    ref.current.y = e.clientY;
                    ref.current.t = setTimeout(() => {
                        ref.current.t = null;
                        if (navigator.vibrate) { try { navigator.vibrate(12); } catch (er) {} }
                        tragarClicSiguiente();
                        abrir(ref.current.x, ref.current.y);
                    }, ms || 500);
                },
                onPointerMove: (e) => {
                    if (!ref.current.t) return;
                    if (Math.hypot(e.clientX - ref.current.x, e.clientY - ref.current.y) > 10) cancelar();
                },
                onPointerUp: cancelar,
                onPointerCancel: cancelar
            };
        }

        /* Al soltar el dedo tras una pulsación larga llega un clic, y ese clic
         * haría lo que hace un toque normal (poner o quitar una nota del
         * recorrido). Se lo come una escucha en captura, una sola vez. */
        function tragarClicSiguiente() {
            const comer = (ev) => { ev.stopPropagation(); ev.preventDefault(); quitar(); };
            const quitar = () => window.removeEventListener("click", comer, true);
            window.addEventListener("click", comer, true);
            setTimeout(quitar, 700);
        }

        /* Junta dos juegos de manejadores: si los dos tienen el mismo evento,
         * se llaman los dos. Hace falta en las notas de Libre, que ya tienen
         * los suyos para arrastrar de una a otra. */
        function combinarEventos(a, b) {
            const r = { ...(a || {}) };
            Object.keys(b || {}).forEach(k => {
                if (r[k]) {
                    const x = r[k], y = b[k];
                    r[k] = (e) => { x(e); y(e); };
                } else {
                    r[k] = b[k];
                }
            });
            return r;
        }

        function MenuAcciones({ etiqueta, titulo, opciones, variante }) {
            const [pos, setPos] = React.useState(null);
            const botonRef = React.useRef(null);
            const abrir = () => {
                const r = botonRef.current.getBoundingClientRect();
                setPos({ x: r.right - 212, y: r.bottom + 4 });
            };
            const cerrar = () => {
                setPos(null);
                if (botonRef.current) botonRef.current.focus();
            };
            return (
                <React.Fragment>
                    <button
                        ref={botonRef}
                        type="button"
                        aria-label={etiqueta}
                        title={etiqueta}
                        aria-haspopup="menu"
                        aria-expanded={!!pos}
                        onClick={() => pos ? cerrar() : abrir()}
                        class={`k2-icono k2-icono--${variante || "suave"}`}
                    >
                        <Icono nombre="mas" />
                    </button>
                    {pos && (
                        <MenuContextualAccesible x={pos.x} y={pos.y} titulo={titulo} opciones={opciones} onCerrar={cerrar} />
                    )}
                </React.Fragment>
            );
        }

        /* El menú de siempre, con lo que le faltaba para el teclado: rol de
         * menú, foco en la primera opción al abrir, flechas para moverse y Esc
         * para cerrar. Lo usan el «⋯» y los clics derechos de la 0.2. */
        function MenuContextualAccesible({ x, y, titulo, opciones, orientacion, onCerrar }) {
            const caja = React.useRef(null);
            React.useEffect(() => {
                const primero = caja.current && caja.current.querySelector("button:not([disabled])");
                if (primero) primero.focus();
            }, []);
            const teclas = (e) => {
                if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); onCerrar(); return; }
                if (e.key !== "ArrowDown" && e.key !== "ArrowUp" && e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
                e.preventDefault();
                const botones = [...caja.current.querySelectorAll("button:not([disabled])")];
                const i = botones.indexOf(document.activeElement);
                const dir = (e.key === "ArrowDown" || e.key === "ArrowRight") ? 1 : -1;
                const sig = botones[(i + dir + botones.length) % botones.length];
                if (sig) sig.focus();
            };
            return (
                <div ref={caja} onKeyDown={teclas} role="menu" aria-label={titulo || "Acciones"}>
                    <MenuContextual x={x} y={y} titulo={titulo} opciones={opciones} orientacion={orientacion} onCerrar={onCerrar} />
                </div>
            );
        }

        /* --- DIÁLOGO -------------------------------------------------------------------
         * Sustituye a los `confirm()` del navegador y aloja Exportar y Atajos.
         * Foco atrapado dentro mientras está abierto, Esc cierra, y al cerrar
         * el foco vuelve a quien lo abrió: sin eso, quien usa teclado acaba al
         * principio de la página. */
        function Dialogo({ titulo, descripcion, children, acciones, onCerrar, ancho }) {
            const caja = React.useRef(null);
            const idTitulo = useIdUnico("dlg");
            const idDesc = `${idTitulo}-desc`;
            const previo = React.useRef(document.activeElement);
            React.useEffect(() => {
                const enfocables = () => [...caja.current.querySelectorAll(
                    'button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'
                )];
                const primero = enfocables()[0];
                if (primero) primero.focus();
                const teclas = (e) => {
                    if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); onCerrar(); return; }
                    if (e.key !== "Tab") return;
                    const lista = enfocables();
                    if (!lista.length) return;
                    const a = lista[0], z = lista[lista.length - 1];
                    if (e.shiftKey && document.activeElement === a) { e.preventDefault(); z.focus(); }
                    else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); }
                };
                document.addEventListener("keydown", teclas, true);
                return () => {
                    document.removeEventListener("keydown", teclas, true);
                    const p = previo.current;
                    if (p && p.focus && document.contains(p)) p.focus();
                };
            }, []);
            return (
                <div class="k2-dialogo-fondo" onClick={(e) => { if (e.target === e.currentTarget) onCerrar(); }}>
                    <div
                        ref={caja}
                        role="dialog"
                        aria-modal="true"
                        aria-labelledby={idTitulo}
                        aria-describedby={descripcion ? idDesc : undefined}
                        class="k2-dialogo"
                        style={ancho ? { maxWidth: ancho } : undefined}
                    >
                        <div class="k2-dialogo__cabeza">
                            <h2 id={idTitulo} class="k2-dialogo__titulo">{titulo}</h2>
                            <BotonIcono icono="cerrar" etiqueta="Cerrar" onClick={onCerrar} />
                        </div>
                        {descripcion && <p id={idDesc} class="k2-dialogo__desc">{descripcion}</p>}
                        {children && <div class="k2-dialogo__cuerpo">{children}</div>}
                        {acciones && <div class="k2-dialogo__acciones">{acciones}</div>}
                    </div>
                </div>
            );
        }


        /* --- LAS PESTAÑAS DEL INSPECTOR (0.2) ------------------------------
         * Un tablist de verdad: flechas, Inicio y Fin se mueven entre
         * pestañas, y cada una dice qué panel controla. */
        const PESTANAS_INSPECTOR = [
            { id: "tocar", label: "Qué tocar", icono: "tocar" },
            { id: "vista", label: "Vista", icono: "vista" },
            { id: "instrumento", label: "Instrumento", icono: "instrumento" },
            { id: "estilo", label: "Estilo", icono: "estilo" }
        ];

        function PestanasInspector({ pestanas, activa, onCambio }) {
            const refs = React.useRef([]);
            const mover = (e, i) => {
                let j = null;
                if (e.key === "ArrowRight") j = (i + 1) % pestanas.length;
                else if (e.key === "ArrowLeft") j = (i - 1 + pestanas.length) % pestanas.length;
                else if (e.key === "Home") j = 0;
                else if (e.key === "End") j = pestanas.length - 1;
                if (j === null) return;
                e.preventDefault();
                onCambio(pestanas[j].id);
                if (refs.current[j]) refs.current[j].focus();
            };
            return (
                <div role="tablist" aria-label="Ajustes del diagrama" class="k2-pestanas">
                    {pestanas.map((p, i) => (
                        <button
                            key={p.id}
                            ref={n => refs.current[i] = n}
                            type="button"
                            role="tab"
                            id={`k2-tab-${p.id}`}
                            aria-selected={p.id === activa}
                            aria-controls={`k2-panel-${p.id}`}
                            tabIndex={p.id === activa ? 0 : -1}
                            onClick={() => onCambio(p.id)}
                            onKeyDown={(e) => mover(e, i)}
                            class={`k2-pestana ${p.id === activa ? "k2-pestana--activa" : ""}`}
                        >
                            <Icono nombre={p.icono} tam={16} />
                            <span>{p.label}</span>
                        </button>
                    ))}
                </div>
            );
        }

        /* Un color con su etiqueta y su código, para el panel de Estilo. */
        function CampoColor({ etiqueta, valor, onCambio }) {
            return (
                <Campo etiqueta={etiqueta}>
                    {(id) => (
                        <div class="k2-color">
                            <input id={id} type="color" value={valor} onChange={(e) => onCambio(e.target.value)} />
                            <span class="k2-color__hex">{String(valor).toUpperCase()}</span>
                        </div>
                    )}
                </Campo>
            );
        }


        /* --- EL RAÍL DEL TALLER (0.2) --------------------------------------
         * Las seis secciones del Taller, a la izquierda y con icono, agrupadas
         * como en la portada: Lado A los diagramas, Lado B los documentos.
         * Sustituye a las pestañas de la cabecera desde 768 px; en el teléfono
         * se quedan las pestañas, porque un raíl le quitaría ancho al mástil. */
        const RAIL_TALLER = [
            {
                lado: "A", nombre: "Diagramas",
                items: [
                    { id: "chord", label: "Acordes", icono: "acordes" },
                    { id: "scale", label: "Escalas", icono: "escalas" },
                    { id: "arpeggio", label: "Arpegios", icono: "arpegios" },
                    { id: "free", label: "Libre", icono: "editar" }
                ]
            },
            {
                lado: "B", nombre: "Documentos",
                items: [
                    { id: "song", label: "Canción", icono: "cancion" },
                    { id: "exercise", label: "Ejercicios", icono: "ejercicios" },
                    { id: "tab", label: "Tablaturas", icono: "tablatura" }
                ]
            }
        ];

        function RailTaller({ activo, onSelect }) {
            return (
                <nav class="k2-rail" aria-label="Secciones del Taller">
                    {RAIL_TALLER.map(g => (
                        <div key={g.lado} class={`k2-rail__lado k2-rail__lado--${g.lado.toLowerCase()}`} role="group" aria-label={`Lado ${g.lado}: ${g.nombre}`}>
                            <div class="k2-rail__cabeza" aria-hidden="true">
                                <span class="k2-rail__disco">{g.lado}</span>
                                <span class="k2-rail__lado-texto">Lado {g.lado}</span>
                                <span class="k2-rail__lado-nombre">{g.nombre}</span>
                            </div>
                            {g.items.map(it => (
                                <button
                                    key={it.id}
                                    type="button"
                                    onClick={() => onSelect(it.id)}
                                    aria-current={activo === it.id ? "page" : undefined}
                                    class={`k2-rail__item ${activo === it.id ? "k2-rail__item--activo" : ""}`}
                                >
                                    <Icono nombre={it.icono} tam={22} />
                                    <span>{it.label}</span>
                                </button>
                            ))}
                            {/* 0.3: la Biblioteca, al pie del raíl. Va dentro de la
                                banda del Lado B para que el color no se corte,
                                y abajo del todo porque no es un lado más: es
                                donde está todo lo que sale de los dos. */}
                            {g.lado === "B" && (
                                <div class="k3-rail__pie">
                                    <button
                                        type="button"
                                        onClick={() => onSelect("biblioteca")}
                                        aria-current={activo === "biblioteca" ? "page" : undefined}
                                        class={`k2-rail__item k3-rail__biblioteca ${activo === "biblioteca" ? "k2-rail__item--activo" : ""}`}
                                    >
                                        <Icono nombre="biblioteca" tam={22} />
                                        <span>Biblioteca</span>
                                    </button>
                                </div>
                            )}
                        </div>
                    ))}
                </nav>
            );
        }

        /* --- LA PANTALLA DE CARGA DEL TALLER (0.2) ----------------------------
         * Un segundo entre el sitio y la app, para que el salto de la portada
         * al mástil no sea de golpe. Seis cuerdas que se afinan; con
         * movimiento reducido, sólo el texto. */
        function CargaTaller({ texto }) {
            return (
                <div class="k2-carga" role="status" aria-live="polite">
                    <div class="k2-carga__mastil" aria-hidden="true">
                        {[0, 1, 2, 3, 4, 5].map(i => (
                            <span key={i} class="k2-carga__cuerda" style={{ animationDelay: `${i * 80}ms`, height: `${1 + (5 - i) * 0.5}px` }} />
                        ))}
                    </div>
                    <p class="k2-carga__texto">{texto || "Afinando el Taller…"}</p>
                </div>
            );
        }

        /* --- 0.3: UNA TIRA QUE SE DESLIZA, Y SE NOTA -------------------------
         * La fila de acordes de Canción escondía la barra de desplazamiento y
         * no tenía ancho propio, así que los acordes que no cabían no se podían
         * ver. Ahora: barra fina visible, flechas ‹ › cuando hay más a un lado,
         * la rueda del ratón desliza en horizontal y el teclado también vale. */
        function TiraDeslizable({ etiqueta, children }) {
            const caja = React.useRef(null);
            const [lados, setLados] = React.useState({ izq: false, der: false });
            const medir = React.useCallback(() => {
                const c = caja.current;
                if (!c) return;
                setLados({ izq: c.scrollLeft > 4, der: c.scrollLeft + c.clientWidth < c.scrollWidth - 4 });
            }, []);
            React.useEffect(() => {
                medir();
                const c = caja.current;
                const ro = window.ResizeObserver ? new ResizeObserver(medir) : null;
                if (ro && c) { ro.observe(c); Array.from(c.children).forEach(h => ro.observe(h)); }
                window.addEventListener("resize", medir);
                return () => { if (ro) ro.disconnect(); window.removeEventListener("resize", medir); };
            });
            const mover = (dir) => {
                const c = caja.current;
                if (c) c.scrollBy({ left: dir * c.clientWidth * 0.8, behavior: "smooth" });
            };
            const rueda = (e) => {
                const c = caja.current;
                if (!c || Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
                if (c.scrollWidth <= c.clientWidth) return;
                c.scrollLeft += e.deltaY;
                e.preventDefault();
            };
            React.useEffect(() => {
                const c = caja.current;
                if (!c) return;
                c.addEventListener("wheel", rueda, { passive: false });
                return () => c.removeEventListener("wheel", rueda);
            }, []);
            return (
                <div class="k3-tira">
                    {lados.izq && <button type="button" class="k3-tira__flecha k3-tira__flecha--izq" aria-label="Ver los anteriores" onClick={() => mover(-1)}><Icono nombre="atras" /></button>}
                    <div ref={caja} class="k3-tira__caja" onScroll={medir} tabIndex={0} role="region" aria-label={etiqueta}>
                        {children}
                    </div>
                    {lados.der && <button type="button" class="k3-tira__flecha k3-tira__flecha--der" aria-label="Ver los siguientes" onClick={() => mover(1)}><Icono nombre="adelante" /></button>}
                </div>
            );
        }

        /* --- 0.3: LO QUE ESTÁ SONANDO ------------------------------------------
         * Una ventanita en la esquina inferior izquierda que dice qué suena
         * (el rasgueo que escuchabas, la canción, el ejercicio, la tablatura)
         * con Pausa y Parar. Antes el rasgueo del editor seguía sonando después
         * de cerrar el diálogo y no había forma de saber qué era ni de callarlo. */
        function Reproduciendo({ sonando, pausado, onPausa, onParar }) {
            if (!sonando.length) return null;
            return (
                <div class="k3-sonando" role="region" aria-label="Lo que está sonando">
                    <span class={`k3-sonando__ondas ${pausado ? "k3-sonando__ondas--quietas" : ""}`} aria-hidden="true"><i></i><i></i><i></i></span>
                    <div class="k3-sonando__texto" aria-live="polite">
                        <strong>{pausado ? "En pausa" : "Sonando"}</strong>
                        {sonando.map(x => <span key={x.id}>{x.texto}</span>)}
                    </div>
                    <BotonIcono icono={pausado ? "reproducir" : "pausa"} etiqueta={pausado ? "Seguir" : "Pausar"} onClick={onPausa} variante="borde" />
                    <BotonIcono icono="parar" etiqueta="Parar todo" onClick={onParar} variante="borde" />
                </div>
            );
        }

        /* --- ¿ADÓNDE VA? (0.2) ---------------------------------------------------
         * Un diálogo para mandar algo a su sitio: un acorde a la biblioteca o a
         * una sección de una canción, un paso a un ejercicio. Antes cada cosa
         * se mandaba de una forma (un botón que guardaba sin preguntar, un menú
         * con todas las secciones de todas las canciones en fila, un atajo que
         * te sacaba del mástil sin avisar). Ahora es siempre lo mismo: nombre,
         * destino y si quieres ir allí después.
         *
         * Los destinos son radios nativos: el teclado y los lectores de
         * pantalla ya saben moverse por ellos sin que haya que enseñarles. */
        function DialogoMandar({ titulo, descripcion, etiquetaNombre, nombre, onNombre, grupos, valor, onValor, ir, onIr, textoIr, textoAccion, onAceptar, onCerrar }) {
            return (
                <Dialogo
                    titulo={titulo}
                    descripcion={descripcion}
                    ancho="520px"
                    onCerrar={onCerrar}
                    acciones={
                        <React.Fragment>
                            <button type="button" onClick={onCerrar} class="k-btn k-btn--outline k-btn--touch px-4 py-2.5 k-text-sm">Cancelar</button>
                            <button type="button" onClick={onAceptar} class="k-btn k-btn--primary k-btn--touch px-4 py-2.5 k-text-sm">{textoAccion}</button>
                        </React.Fragment>

                >
                    {etiquetaNombre && (

                                <input id={id} type="text" value={nombre} onChange={(e) => onNombre(e.target.value)}
                                    onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); onAceptar(); } }} />
                            )}
                        </Campo>
                    )}
                    <fieldset class="k2-destinos">
                        <legend class="k2-etiqueta">¿Adónde va?</legend>
                        {grupos.map(g => (
                            <div key={g.id} class="k2-destinos__grupo">
                                {g.titulo && <p class="k2-destinos__titulo">{g.titulo}</p>}
                                {g.opciones.map(o => (
                                    <label key={o.id} class={`k2-destino ${valor === o.id ? "k2-destino--elegido" : ""}`}>
                                        <input type="radio" name="k2-destino" value={o.id} checked={valor === o.id} onChange={() => onValor(o.id)} />
                                        <span class="k2-destino__texto">

                                            {o.detalle && <small>{o.detalle}</small>}

        /* --- GUARDAR ACORDE (0.2, tercera vuelta) ----------------------------
         * Un panel pegado al botón, no un diálogo en medio de la pantalla. Lo
         * de casi siempre es guardar en la biblioteca, así que eso es un solo
         * botón y Enter desde el nombre ya lo hace. Meterlo además en una
         * canción es opcional y va debajo: UNA canción (la abierta) y sus
         * secciones como fichas, en vez de todas las secciones de todas las
         * canciones en fila.
         *
         * Se ve lo que se guarda (la miniatura) y, si la biblioteca ya tiene
         * esa digitación, lo dice: añadirlo a una sección usa el que ya está.
         * En el teléfono es una hoja que sube desde abajo. */
        function PanelGuardarAcorde({ ancla, chord, repetido, canciones, idAbierta, onGuardar, onCerrar }) {
            const caja = React.useRef(null);
            const idTitulo = useIdUnico("guardar");
            const [nombre, setNombre] = React.useState(chord.name);
            const [idCancion, setIdCancion] = React.useState(idAbierta);
            const [idSeccion, setIdSeccion] = React.useState(null);
            const [pos, setPos] = React.useState(null);

            const cancion = canciones.find(s => s.id === idCancion) || canciones[0];
            const seccion = cancion && idSeccion ? cancion.sections.find(x => x.id === idSeccion) : null;

            // Pegado bajo el botón, alineado a su borde derecho. En el teléfono
            // no hay posición: la hoja va abajo por CSS.
            React.useLayoutEffect(() => {
                const medir = () => {
                    if (!ancla || window.innerWidth < 768) { setPos(null); return; }
                    const r = ancla.getBoundingClientRect();
                    setPos({ top: r.bottom + 8, right: Math.max(8, window.innerWidth - r.right) });
                };
                medir();
                window.addEventListener("resize", medir);
                return () => window.removeEventListener("resize", medir);
            }, [ancla]);

            // Foco al nombre; Esc y un clic fuera cierran; el foco vuelve al botón.
            React.useEffect(() => {
                const campo = caja.current && caja.current.querySelector("input");
                if (campo) { campo.focus(); campo.select(); }
                const teclas = (e) => { if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); onCerrar(); } };
                const fuera = (e) => {
                    if (caja.current && !caja.current.contains(e.target) && !(ancla && ancla.contains(e.target))) onCerrar();
                };
                document.addEventListener("keydown", teclas, true);
                document.addEventListener("mousedown", fuera);
                return () => {
                    document.removeEventListener("keydown", teclas, true);
                    document.removeEventListener("mousedown", fuera);
                    if (ancla && document.contains(ancla)) ancla.focus();
                };
            }, []);

            const guardar = () => onGuardar({
                nombre: nombre.trim() || chord.name,
                idCancion: seccion ? cancion.id : null,
                idSeccion: seccion ? seccion.id : null
            });

            const textoBoton = seccion
                ? (repetido ? `Añadir a ${seccion.name || "la sección"}` : `Guardar y añadir a ${seccion.name || "la sección"}`)
                : (repetido ? "Guardar otra copia" : "Guardar en la biblioteca");

            return (
                <React.Fragment>
                    <div class="k2-guardar-fondo" onClick={onCerrar} aria-hidden="true" />
                    <div
                        ref={caja}
                        role="dialog"
                        aria-labelledby={idTitulo}
                        class="k2-guardar"
                        style={pos ? { top: pos.top, right: pos.right } : undefined}
                    >
                        <div class="k2-guardar__cabeza">
                            <h2 id={idTitulo} class="k2-guardar__titulo">Guardar acorde</h2>
                            <BotonIcono icono="cerrar" etiqueta="Cerrar" onClick={onCerrar} />
                        </div>

                        <div class="k2-guardar__acorde">
                            <div class="k2-guardar__mini" aria-hidden="true">
                                <DiagramaKharo escena={escenaDeAcorde({ ...chord, name: nombre }, "dedos", null)} />
                            </div>
                            <div class="k2-guardar__nombre">
                                <Campo etiqueta="Nombre">
                                    {(id) => (
                                        <input id={id} type="text" value={nombre} onChange={(e) => setNombre(e.target.value)}
                                            onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); guardar(); } }} />
                                    )}
                                </Campo>
                                {repetido && (
                                    <p class="k2-guardar__aviso">Ya lo tienes en la biblioteca como «{repetido.name}».</p>
                                )}
                            </div>
                        </div>

                        {cancion && (
                            <div class="k2-guardar__cancion">
                                <p class="k2-etiqueta">También en una canción <span class="k2-guardar__opcional">· opcional</span></p>
                                {canciones.length > 1 ? (
                                    <select
                                        aria-label="Canción"
                                        value={cancion.id}
                                        onChange={(e) => { setIdCancion(e.target.value); setIdSeccion(null); }}
                                        class="k2-guardar__select"
                                    >
                                        {canciones.map(s => (
                                            <option key={s.id} value={s.id}>{s.title}{s.id === idAbierta ? " · la abierta" : ""}</option>
                                        ))}
                                    </select>
                                ) : (
                                    <p class="k2-guardar__una">{cancion.title}</p>
                                )}
                                {cancion.sections.length > 0 ? (
                                    <div class="k2-fichas" role="group" aria-label={`Secciones de ${cancion.title}`}>
                                        {cancion.sections.map(sec => (
                                            <button
                                                key={sec.id}
                                                type="button"
                                                aria-pressed={idSeccion === sec.id}
                                                onClick={() => setIdSeccion(prev => prev === sec.id ? null : sec.id)}
                                                class={`k2-ficha ${idSeccion === sec.id ? "k2-ficha--elegida" : ""}`}
                                            >
                                                {sec.name || "Sin nombre"}
                                                <small>{sec.bars.length}</small>
                                            </button>
                                        ))}
                                    </div>
                                ) : (
                                    <p class="k2-ayuda">Esta canción todavía no tiene secciones.</p>
                                )}
                            </div>
                        )}

                        <button type="button" onClick={guardar} class="k-btn k-btn--primary k-btn--touch k2-guardar__boton">
                            <Icono nombre="guardar" />
                            <span>{textoBoton}</span>
                        </button>
                    </div>
                </React.Fragment>
            );
        }

        /* Un diálogo de borrado en masa, con la cifra exacta. Sustituye a los
         * `confirm()`: dice qué se pierde, qué se conserva y cómo evitarlo, y
         * el botón destructivo no es el que tiene el foco al abrir. */
        function DialogoBorrar({ titulo, pierde, conserva, textoBorrar, onBorrar, onCerrar }) {
            return (
                <Dialogo
                    titulo={titulo}
                    onCerrar={onCerrar}
                    ancho="440px"
                    acciones={
                        <React.Fragment>
                            <button type="button" onClick={onCerrar} class="k-btn k-btn--outline k-btn--touch px-4 py-2.5 k-text-sm">Cancelar</button>
                            <button type="button" onClick={() => { onBorrar(); onCerrar(); }} class="k-btn k-btn--danger k-btn--touch px-4 py-2.5 k-text-sm">{textoBorrar || "Borrar"}</button>
                        </React.Fragment>
                    }
                >
                    <ul class="k2-borrar-lista">
                        {pierde && <li><strong>Se pierde:</strong> {pierde}</li>}
                        {conserva && <li><strong>Se conserva:</strong> {conserva}</li>}
                    </ul>
                </Dialogo>
            );
        }


        /* --- LA MANCHA QUE ENVUELVE UN GRUPO DE NOTAS ------------------------
         *
         * Vive aquí arriba, fuera de todo componente, porque la usan dos: el
         * mástil del estudio para las tríadas de la tonalidad (§15 bis) y la
         * ficha de ejercicio para dibujar una agrupación como se veía.
         *
         * Casco convexo por cadena monótona de Andrew: los puntos de dentro no
         * hacen falta, la mancha la definen los de fuera.
         * ------------------------------------------------------------------ */
        function cascoConvexo(puntos) {
            if (puntos.length <= 2) return puntos.slice();

            const p = puntos.slice().sort((a, b) => (a.x - b.x) || (a.y - b.y));
            const cruz = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);

            const abajo = [];
            p.forEach(q => {
                while (abajo.length >= 2 && cruz(abajo[abajo.length - 2], abajo[abajo.length - 1], q) <= 0) abajo.pop();
                abajo.push(q);
            });

            const arriba = [];
            p.slice().reverse().forEach(q => {
                while (arriba.length >= 2 && cruz(arriba[arriba.length - 2], arriba[arriba.length - 1], q) <= 0) arriba.pop();
                arriba.push(q);
            });

            abajo.pop();
            arriba.pop();
            return abajo.concat(arriba);
        }

        /* El `d` de la mancha. Se dibuja como un trazo REDONDEADO de grosor
         * `2 × margen` sobre el casco, más relleno: eso da la goma elástica
         * alrededor de los puntos sin desplazar aristas ni calcular normales, y
         * el mismo código sirve para dos notas (cápsula) y para cinco. */
        function trazoDeMancha(puntos) {
            const casco = cascoConvexo(puntos);
            if (casco.length === 0) return null;
            return {
                d: casco.map((p, i) => `${i === 0 ? "M" : "L"} ${p.x} ${p.y}`).join(" ") + (casco.length > 2 ? " Z" : ""),
                cerrado: casco.length > 2
            };
        }

        /* Reparte las posiciones de un grado en zonas del tamaño de una mano.
         *
         * Con sólo pedir que las notas se toquen entre sí, la cadena no
         * para: en Do mayor las notas de La menor van saltando de cuerda en
         * cuerda y de traste en traste hasta cubrir el mástil entero, y
         * salía UNA mancha que envolvía todo el dibujo. Eso no dice dónde se
         * toca nada.
         *
         * Por eso hay un tope duro además de la cercanía: una zona no puede
         * pasar de TRES CUERDAS ni de CUATRO TRASTES. Es lo que abarca la
         * mano sin desplazarse, y es lo que convierte la mancha en «aquí se
         * toca este acorde».
         *
         * Se crece desde la nota más grave y más baja, para que el reparto
         * sea el mismo en cada render: una zona que cambia de sitio entre
         * dos dibujos no sirve para estudiar (§15).
         */
        const CUERDAS_POR_ZONA = 3;
        const TRASTES_POR_ZONA = 4;

        function zonasDeUnGrado(posiciones) {
            /* Las cuerdas al aire quedan fuera de la envolvente. Se dibujan
             * encima de la cejuela, en su propia fila, así que meterlas
             * estiraba la mancha hasta allí y deformaba la forma. Y tiene
             * sentido musical: la envolvente marca dónde va la mano, y una
             * cuerda al aire no lleva dedo. */
            const pendientes = posiciones
                .filter(p => p.f > 0)
                .sort((a, b) => (a.s - b.s) || (a.f - b.f));
            const zonas = [];

            while (pendientes.length > 0) {
                const zona = [pendientes.shift()];
                let crecio = true;

                while (crecio) {
                    crecio = false;
                    for (let i = 0; i < pendientes.length; i++) {
                        const c = pendientes[i];

                        // Tiene que TOCAR la zona: cuerda contigua o la misma.
                        const pega = zona.some(z => Math.abs(z.s - c.s) <= 1 && Math.abs(z.f - c.f) <= 2);
                        if (!pega) continue;

                        // Y la zona resultante tiene que seguir cabiendo en la mano.
                        const cuerdas = zona.map(z => z.s).concat(c.s);
                        const trastes = zona.map(z => z.f).concat(c.f);
                        const cabe = (Math.max(...cuerdas) - Math.min(...cuerdas)) < CUERDAS_POR_ZONA
                            && (Math.max(...trastes) - Math.min(...trastes)) < TRASTES_POR_ZONA;
                        if (!cabe) continue;

                        zona.push(c);
                        pendientes.splice(i, 1);
                        crecio = true;
                        break;
                    }
                }
                zonas.push(zona);
            }

            /* Una nota suelta no se envuelve. Envolver una sola nota es
             * volver al aro por nota, que es justo lo que esto sustituye:
             * la nota se sigue viendo, pero sin mancha alrededor. */
            return zonas.filter(z => z.length >= 2);
        }

        /* Cuánto se apagan las notas que no son de la tríada señalada. Era
         * 0,15 y casi no se veían; a 0,3 se leen como «el resto de la escala,
         * adonde puedes ir», que es lo que se busca al aislar una tríada. */
        const OPACIDAD_FUERA_DE_TRIADA = 0.3;

        /* ==================================================================
         * EL DIAGRAMA DEL TALLER, FUERA DE APP (0.2, cuarta vuelta)
         * ==================================================================
         * El mástil del estudio vivía dentro de `App`, mezclado con los
         * manejadores. Las fichas de Ejercicios y los acordes de Canción
         * tenían cada uno su dibujo propio, con su geometría, y por eso no se
         * parecían al Taller aunque leyeran los mismos colores.
         *
         * Ahora hay UN dibujo, en dos mitades:
         *
         *   la ESCENA    qué se dibuja: datos sueltos, sin coordenadas ni
         *                colores. Se puede guardar (un paso de ejercicio la
         *                lleva) o calcular al vuelo (un acorde de Canción).
         *   el ESTILO    cómo: lo pone el Context, así que cambiar un color en
         *                Estilo redibuja también lo que ya mandaste.
         *
         * El estudio le pasa además `interaccion`: los manejadores y las capas
         * del gesto (zonas de toque, arrastres, el halo del audio). Fuera del
         * estudio no hay nada de eso y el dibujo es sólo obra.
         *
         * OJO: el SVG del estudio tiene que salir IDÉNTICO byte a byte al de
         * antes de la mudanza. Por eso el orden de las props, los
         * condicionales y los `<g>` son los mismos que había en `App`: no
         * «arreglar» nada de aquí sin comprobar el hash de la obra.
         * ================================================================== */

        // El color de un grado. Era `getIntervalColor`, dentro de App.
        function colorDeGrado(est, grado) {
            const ic = est.intervalColors;
            if (!grado) return est.baseFingerColor;
            if (grado.includes("1")) return ic["1"];
            if (grado.includes("2")) return ic["2"];
            if (grado.includes("3")) return ic["3"];
            if (grado.includes("4")) return ic["4"];
            if (grado.includes("5")) return ic["5"];
            if (grado.includes("6")) return ic["6"];
            if (grado.includes("7")) return ic["7"];
            return est.baseFingerColor;
        }

        /* Las marcas de encima de la cejuela de una digitación: ○, × o, en
         * Notas y Grados, la cuerda al aire con su nombre. La cuenta es la
         * misma que había en el estudio, carácter a carácter. */
        function alAireDeDigitacion({ stringStates, tuning, startingFret, modo, raiz }) {
            return stringStates.map((state, idx) => {
                if ((modo === "note" || modo === "degree") && state === "open") {
                    const baseSemi = (parseNoteToSemi(tuning[idx]) + toAbsoluteFret(startingFret, 0)) % 12;
                    const relativeSemi = (baseSemi - raiz + 12) % 12;
                    const degreeStr = INTERVAL_DEGREES[relativeSemi];
                    return { s: idx, nota: { etiqueta: modo === "note" ? NOTE_NAMES[baseSemi] : degreeStr, grado: degreeStr } };
                }
                return { s: idx, marca: state };
            });
        }

        /* Los dedos y las cejillas de una digitación. `dedos` es para Canción:
         * en la miniatura de una tarjeta el número del dedo sí se escribe. */
        function acordeDeDigitacion({ dots, barres, tuning, startingFret, modo, raiz, dedos }) {
            const conTexto = modo === "note" || modo === "degree";
            const etiquetar = (s, f) => {
                const baseSemi = parseNoteToSemi(tuning[s]);
                const absFret = startingFret + f - 1;
                const pitch = (baseSemi + absFret) % 12;
                const relativeSemi = (pitch - raiz + 12) % 12;
                const degreeStr = INTERVAL_DEGREES[relativeSemi];
                return { etiqueta: modo === "note" ? NOTE_NAMES[pitch] : degreeStr, grado: degreeStr };
            };
            return {
                cejillas: barres.map(b => {
                    const subnotas = [];
                    if (conTexto) {
                        for (let s = b.fromString; s <= b.toString; s++) {
                            if (dots.some(d => d.s === s)) continue;
                            subnotas.push({ s, ...etiquetar(s, b.fret) });
                        }
                    }
                    return { desde: b.fromString, hasta: b.toString, traste: b.fret, atenuada: modo !== "diagram", subnotas };
                }),
                notas: dots.map(d => conTexto
                    ? { s: d.s, f: d.f, ...etiquetar(d.s, d.f) }
                    : { s: d.s, f: d.f, etiqueta: dedos && d.finger ? String(d.finger) : "", grado: null })
            };
        }

        /* La medida que tendrá una escena con un estilo dado. La usa la hoja
         * de Canción para repartir el diccionario en páginas. */
        function medidaDeEscena(escena, est) {
            const g = computeDiagramGeometry({
                numStrings: escena.numStrings, numFrets: escena.numFrets,
                startingFret: escena.startingFret, dotRadius: est.dotRadius
            });
            return { ancho: g.width, alto: g.height };
        }

        function DiagramaKharo({ escena, interaccion, ancho, alto, titulo }) {
            const est = useDiagramStyle();
            const idPielPropio = useIdUnico("kh-madera");
            const it = interaccion || {};
            const raiz = it.raiz || null;
            const idPiel = it.idPiel || idPielPropio;

            const { numStrings, numFrets, startingFret } = escena;
            const tuning = escena.afinacion;
            const nombre = titulo !== undefined ? titulo : escena.titulo;

            const bgStyleColor = est.backgroundColor;
            const gridStyleColor = est.gridColor;
            const textStyleColor = est.textColor;
            const fontFamilyStyle = est.fontFamily;
            const dotRadiusStyle = est.dotRadius;
            const lineWidthStyle = est.lineWidth;
            const baseFingerStyleColor = est.baseFingerColor;
            const maderaSkin = est.fretboardSkin === "madera";
            const getIntervalColor = (g) => colorDeGrado(est, g);

            const geo = computeDiagramGeometry({ numStrings, numFrets, startingFret, dotRadius: dotRadiusStyle });
            const {
                width, height,
                paddingTop, paddingLeft, paddingRight,
                gridWidth,
                stringSpacing,
                fretYPositions
            } = geo;
            const dynamicTitleFontSize = computeTitleFontSize(nombre);

            const yDeTraste = (f) => {
                if (f === 0) return paddingTop - 20;
                const arriba = fretYPositions[f - 1];
                const abajo = fretYPositions[f];
                if (arriba === undefined || abajo === undefined) return null;
                return arriba + (abajo - arriba) / 2;
            };
            const posicionEnLienzo = (p) => ({
                x: paddingLeft + p.s * stringSpacing,
                y: yDeTraste(p.f)
            });
            const capa = (nombreCapa) => it[nombreCapa] ? it[nombreCapa](geo) : null;

            // Las flechas del recorrido. Copia de `renderNotePath`, con los
            // dos huecos del estudio: la clase de la flecha y su zona de agarre.
            const dibujarRecorrido = () => {
                if (!escena.recorrido) return null;
                const recorrido = escena.recorrido.puntos;
                const arpSweep = escena.recorrido.sweep;
                if (recorrido.length < 2) return null;

                const margen = dotRadiusStyle + 3;
                const segmentos = [];
                const claveDelTramo = (p, q) => {
                    const a = `${p.s}:${p.f}`;
                    const b = `${q.s}:${q.f}`;
                    return a < b ? `${a}|${b}` : `${b}|${a}`;
                };
                const vecesPorTramo = new Map();
                for (let i = 0; i < recorrido.length - 1; i++) {
                    const k = claveDelTramo(recorrido[i], recorrido[i + 1]);
                    vecesPorTramo.set(k, (vecesPorTramo.get(k) || 0) + 1);
                }
                const vistosPorTramo = new Map();
                let dibujadas = 0;

                for (let i = 0; i < recorrido.length - 1; i++) {
                    const a = posicionEnLienzo(recorrido[i]);
                    const b = posicionEnLienzo(recorrido[i + 1]);
                    if (a.y === null || b.y === null) continue;

                    const dx = b.x - a.x;
                    const dy = b.y - a.y;
                    const largo = Math.hypot(dx, dy);
                    if (largo <= margen * 2) continue;

                    const ux = dx / largo;
                    const uy = dy / largo;
                    const puntaLargo = 7;
                    const puntaAncho = 4;
                    const px = -uy;
                    const py = ux;

                    const claveIda = `${recorrido[i].s}:${recorrido[i].f}`;
                    const claveVuelta = `${recorrido[i + 1].s}:${recorrido[i + 1].f}`;
                    const clave = claveDelTramo(recorrido[i], recorrido[i + 1]);
                    const cuantos = vecesPorTramo.get(clave) || 1;
                    const cual = vistosPorTramo.get(clave) || 0;
                    vistosPorTramo.set(clave, cual + 1);
                    const desvio = cuantos > 1
                        ? (cual - (cuantos - 1) / 2) * (lineWidthStyle * 2 + 2)
                        : 0;
                    const sentido = claveIda < claveVuelta ? 1 : -1;
                    const nx = px * sentido;
                    const ny = py * sentido;

                    const x1 = a.x + ux * margen + nx * desvio;
                    const y1 = a.y + uy * margen + ny * desvio;
                    const x2 = b.x - ux * margen + nx * desvio;
                    const y2 = b.y - uy * margen + ny * desvio;

                    const esSalto = !arpSweep && recorrido[i].s !== recorrido[i + 1].s;

                    dibujadas++;
                    const numeroVisible = dibujadas;
                    const mx = (x1 + x2) / 2;
                    const my = (y1 + y2) / 2;

                    segmentos.push(
                        <g
                            key={`path-${i}`}
                            {...(it.propsFlecha ? it.propsFlecha(i) : {})}
                        >
                            <line
                                x1={x1} y1={y1} x2={x2} y2={y2}
                                stroke={est.pathColor}
                                strokeWidth={esSalto ? lineWidthStyle * 0.7 : lineWidthStyle}
                                strokeLinecap="round"
                                strokeDasharray={esSalto ? "4 3" : undefined}
                                opacity={esSalto ? 0.45 : 0.85}
                            />
                            <polygon
                                points={`${x2},${y2} ${x2 - ux * puntaLargo + px * puntaAncho},${y2 - uy * puntaLargo + py * puntaAncho} ${x2 - ux * puntaLargo - px * puntaAncho},${y2 - uy * puntaLargo - py * puntaAncho}`}
                                fill={est.pathColor}
                                opacity={esSalto ? 0.45 : 0.85}
                            />
                            {it.hijosFlecha ? it.hijosFlecha(i, numeroVisible, { x1, y1, x2, y2, mx, my }) : null}
                        </g>
                    );
                }

                const inicio = posicionEnLienzo(recorrido[0]);

                return (
                    <g pointerEvents="none">
                        {segmentos}
                        {inicio.y !== null && <circle
                            cx={inicio.x}
                            cy={inicio.y}
                            r={dotRadiusStyle + 4}
                            fill="none"
                            stroke={est.pathColor}
                            strokeWidth={lineWidthStyle}
                            strokeDasharray="3 2"
                            opacity="0.9"
                        />}
                    </g>
                );
            };

            // Las envolventes de las tríadas, DEBAJO de las notas.
            const dibujarEnvolventes = () => {
                if (!escena.envolventes) return null;
                const margen = dotRadiusStyle + 5;
                const anillos = DEFAULT_STYLE.triadRingColors;
                return (
                    <g>
                        {escena.envolventes.map((e, gi) => {
                            const color = typeof e.color === "number" ? anillos[e.color % anillos.length] : e.color;
                            return (
                                <g key={`triada-${gi}`} opacity={e.opacidad} pointerEvents="none">
                                    {e.zonas.map((zona, zi) => {
                                        const mancha = trazoDeMancha(zona.map(p => posicionEnLienzo(p)));
                                        if (!mancha) return null;
                                        return (
                                            <path
                                                key={zi}
                                                d={mancha.d}
                                                fill={mancha.cerrado ? color : "none"}
                                                stroke={color}
                                                strokeWidth={margen * 2}
                                                strokeLinejoin="round"
                                                strokeLinecap="round"
                                            />
                                        );
                                    })}
                                </g>
                            );
                        })}
                    </g>
                );
            };

            /* El tamaño. En el estudio, el de siempre en atributos. Fuera, o
             * lo que diga quien lo pone (la hoja A4 lo mete en una caja) o el
             * ancho de su contenedor. */
            const conCaja = !raiz && (ancho || alto);
            const estiloRaiz = {
                backgroundColor: bgStyleColor,
                borderRadius: `${DEFAULT_STYLE.fretboardRadius}px`,
                fontFamily: fontFamilyStyle
            };
            if (!raiz && !conCaja) { estiloRaiz.width = "100%"; estiloRaiz.height = "auto"; estiloRaiz.display = "block"; }

            return (
                <svg
                    id={raiz ? raiz.id : undefined}
                    ref={raiz ? raiz.ref : undefined}
                    width={raiz ? width : (conCaja ? ancho : undefined)}
                    height={raiz ? height : (conCaja ? alto : undefined)}
                    style={estiloRaiz}
                    viewBox={`0 0 ${width} ${height}`}
                    class={raiz ? raiz.class : undefined}
                    onTouchMove={raiz ? raiz.onTouchMove : undefined}
                >
                    <rect width={width} height={height} fill={bgStyleColor} rx={DEFAULT_STYLE.fretboardRadius} />

                    <text
                        x={width / 2}
                        y={50}
                        textAnchor="middle"
                        fill={textStyleColor}
                        fontSize={dynamicTitleFontSize}
                        fontWeight="800"
                    >
                        {nombre}
                    </text>

                    {Array.from({ length: numFrets }).map((_, idx) => {
                        const absFret = startingFret + idx;
                        const isCommon = COMMON_FRETS.includes(absFret);
                        const isFirst = idx === 0;

                        if (isCommon || (isFirst && startingFret > 1)) {
                            const y = fretYPositions[idx] + (fretYPositions[idx + 1] - fretYPositions[idx]) / 2 + 4;
                            const xPos = escena.numerosTraste === "left" ? paddingLeft - 22 : width - paddingRight + 22;
                            const labelText = isCommon ? `${absFret}` : `${startingFret} fr`;

                            return (
                                <text
                                    key={`fret-marker-${absFret}`}
                                    x={xPos}
                                    y={y}
                                    fill={textStyleColor}
                                    fontSize="13"
                                    fontWeight="bold"
                                    textAnchor="middle"
                                    opacity={isCommon ? "1" : "0.6"}
                                >
                                    {labelText}
                                </text>
                            );
                        }
                        return null;
                    })}

                    {tuning.map((note, idx) => {
                        const x = paddingLeft + idx * stringSpacing;
                        return (
                            <text
                                key={idx}
                                x={x}
                                y={paddingTop - 45}
                                textAnchor="middle"
                                fill={textStyleColor}
                                fontSize="12"
                                fontWeight="bold"
                            >
                                {note}
                            </text>
                        );
                    })}

                    {capa("sobreAfinacion")}

                    {escena.alAire.map((a, idx) => {
                        const x = paddingLeft + a.s * stringSpacing;
                        const y = paddingTop - 20;
                        if (a.nota) {
                            return (
                                <g key={idx} opacity={a.nota.opacidad} {...(it.propsAlAire ? it.propsAlAire(a) : {})}>
                                    <circle
                                        cx={x}
                                        cy={y}
                                        r={dotRadiusStyle - 1}
                                        fill={getIntervalColor(a.nota.grado)}
                                    />
                                    <text
                                        x={x}
                                        y={y + 3.5}
                                        textAnchor="middle"
                                        fill={est.dotTextColor}
                                        fontSize="9"
                                        fontWeight="900"
                                    >
                                        {a.nota.etiqueta}
                                    </text>
                                </g>
                            );
                        }
                        return (
                            <g key={idx} {...(it.propsAlAire ? it.propsAlAire(a) : {})}>
                                {a.marca === "open" && (
                                    <circle
                                        cx={x}
                                        cy={y}
                                        r="6"
                                        fill="none"
                                        stroke={textStyleColor}
                                        strokeWidth={lineWidthStyle}
                                    />
                                )}
                                {a.marca === "muted" && (
                                    <g>
                                        <line x1={x - 5} y1={y - 5} x2={x + 5} y2={y + 5} stroke={textStyleColor} strokeWidth={lineWidthStyle} />
                                        <line x1={x + 5} y1={y - 5} x2={x - 5} y2={y + 5} stroke={textStyleColor} strokeWidth={lineWidthStyle} />
                                    </g>
                                )}
                                {it.hijoMarca ? it.hijoMarca(a, x, y) : null}
                            </g>
                        );
                    })}

                    {/* La piel «madera»: obra, sale al exportar. El degradado
                        lleva un id por diagrama: con dos en la página y el
                        mismo id, Chrome pinta el primero que encuentra. */}
                    {maderaSkin && (
                        <g>
                            <defs>
                                <linearGradient id={idPiel} x1="0" y1="0" x2="1" y2="0">
                                    <stop offset="0" stopColor="#2A1A10" />
                                    <stop offset="0.5" stopColor="#4A2F1D" />
                                    <stop offset="1" stopColor="#2A1A10" />
                                </linearGradient>
                            </defs>
                            <rect
                                x={paddingLeft - 16}
                                y={paddingTop}
                                width={gridWidth + 32}
                                height={fretYPositions[numFrets] - paddingTop}
                                rx="4"
                                fill={`url(#${idPiel})`}
                            />
                            {[0.1, 0.24, 0.39, 0.55, 0.7, 0.86].map((p, n) => {
                                const x = paddingLeft - 16 + (gridWidth + 32) * p;
                                return (
                                    <line
                                        key={`veta-${n}`}
                                        x1={x}
                                        y1={paddingTop}
                                        x2={x + (n % 2 ? 3 : -3)}
                                        y2={fretYPositions[numFrets]}
                                        stroke="#000000"
                                        strokeOpacity="0.2"
                                        strokeWidth="1"
                                    />
                                );
                            })}
                        </g>
                    )}

                    {startingFret === 1 ? (
                        <rect
                            x={paddingLeft - lineWidthStyle / 2 - (maderaSkin ? 16 : 0)}
                            y={paddingTop - (maderaSkin ? 7 : 4)}
                            width={gridWidth + lineWidthStyle + (maderaSkin ? 32 : 0)}
                            height={maderaSkin ? "9" : "6"}
                            fill={maderaSkin ? "#EFE6D2" : textStyleColor}
                        />
                    ) : (
                        <line
                            x1={paddingLeft}
                            y1={paddingTop}
                            x2={width - paddingRight}
                            y2={paddingTop}
                            stroke={maderaSkin ? "#C9CDD3" : gridStyleColor}
                            strokeWidth={maderaSkin ? Math.max(lineWidthStyle, 2.5) : lineWidthStyle}
                        />
                    )}

                    {Array.from({ length: numFrets }).map((_, idx) => {
                        const absFret = startingFret + idx;
                        const y = fretYPositions[idx] + (fretYPositions[idx + 1] - fretYPositions[idx]) / 2;
                        const xCenter = paddingLeft + gridWidth / 2;

                        if ([3, 5, 7, 9, 15, 17, 19, 21].includes(absFret)) {
                            return (
                                <circle
                                    key={`inlay-${absFret}`}
                                    cx={xCenter}
                                    cy={y}
                                    r="4"
                                    fill={maderaSkin ? "#F1EBDD" : gridStyleColor}
                                    opacity={maderaSkin ? "0.9" : "0.18"}
                                />
                            );
                        } else if ([12, 24].includes(absFret)) {
                            return (
                                <g key={`inlay-${absFret}`}>
                                    <circle
                                        cx={xCenter - 14}
                                        cy={y}
                                        r="3"
                                        fill={maderaSkin ? "#F1EBDD" : gridStyleColor}
                                        opacity={maderaSkin ? "0.9" : "0.18"}
                                    />
                                    <circle
                                        cx={xCenter + 14}
                                        cy={y}
                                        r="3"
                                        fill={maderaSkin ? "#F1EBDD" : gridStyleColor}
                                        opacity={maderaSkin ? "0.9" : "0.18"}
                                    />
                                </g>
                            );
                        }
                        return null;
                    })}

                    {Array.from({ length: numFrets }).map((_, idx) => {
                        const y = fretYPositions[idx + 1];
                        return (
                            <line
                                key={idx}
                                x1={paddingLeft - (maderaSkin ? 16 : 0)}
                                y1={y}
                                x2={width - paddingRight + (maderaSkin ? 16 : 0)}
                                y2={y}
                                stroke={maderaSkin ? "#C9CDD3" : gridStyleColor}
                                strokeWidth={maderaSkin ? Math.max(lineWidthStyle, 2.5) : lineWidthStyle}
                            />
                        );
                    })}

                    {Array.from({ length: numStrings }).map((_, idx) => {
                        const x = paddingLeft + idx * stringSpacing;
                        const grave = idx < numStrings / 2;
                        return (
                            <line
                                key={idx}
                                x1={x}
                                y1={paddingTop}
                                x2={x}
                                y2={fretYPositions[numFrets]}
                                stroke={maderaSkin ? (grave ? "#C9A15A" : "#E4E7EB") : gridStyleColor}
                                strokeWidth={maderaSkin ? 2.8 - 1.8 * idx / Math.max(1, numStrings - 1) : lineWidthStyle}
                            />
                        );
                    })}

                    {capa("sobreCuerdas")}

                    {dibujarEnvolventes()}

                    {capa("bajoNotas")}

                    {/* Las notas de una escala, un arpegio o Libre. */}
                    {escena.mapa && escena.mapa.notas.map((dot, idx) => {
                        const x = paddingLeft + dot.s * stringSpacing;
                        const y = yDeTraste(dot.f);
                        if (y === null) return null;
                        const dotColor = getIntervalColor(dot.grado);

                        return (
                            <g key={idx} opacity={dot.opacidad} {...(it.propsNota ? it.propsNota(dot) : {})}>
                                <circle
                                    cx={x}
                                    cy={y}
                                    r={dotRadiusStyle}
                                    fill={dotColor}
                                />
                                {dot.pendiente && (
                                    <circle
                                        cx={x} cy={y} r={dotRadiusStyle + 3}
                                        fill="none"
                                        stroke={baseFingerStyleColor}
                                        strokeWidth="1.4"
                                        strokeDasharray="2 2"
                                        opacity="0.7"
                                    />
                                )}
                                {dot.tap && (
                                    <circle
                                        cx={x}
                                        cy={y}
                                        r={dotRadiusStyle + 3.5}
                                        fill="none"
                                        stroke={dotColor}
                                        strokeWidth="1.6"
                                        strokeDasharray="2 2"
                                    />
                                )}
                                <text
                                    x={x}
                                    y={y + 4.5}
                                    textAnchor="middle"
                                    fill={est.dotTextColor}
                                    fontSize="10"
                                    fontWeight="bold"
                                >
                                    {dot.etiqueta}
                                </text>
                            </g>
                        );
                    })}

                    {dibujarRecorrido()}

                    {capa("sobreRecorrido")}

                    {escena.acorde && (
                        <g>
                            {escena.acorde.cejillas.map((barre, idx) => {
                                const x1 = paddingLeft + barre.desde * stringSpacing;
                                const y = yDeTraste(barre.traste);
                                if (y === null) return null;
                                return (
                                    <g key={idx} {...(it.propsCejilla ? it.propsCejilla(idx) : {})}>
                                        <rect
                                            x={x1 - dotRadiusStyle}
                                            y={y - dotRadiusStyle}
                                            width={(barre.hasta - barre.desde) * stringSpacing + dotRadiusStyle * 2}
                                            height={dotRadiusStyle * 2}
                                            rx={dotRadiusStyle}
                                            fill={baseFingerStyleColor}
                                            opacity={barre.atenuada ? 0.4 : 1}
                                        />
                                        {barre.atenuada && (
                                            barre.subnotas.map((sub, step) => {
                                                const x = paddingLeft + sub.s * stringSpacing;
                                                return (
                                                    <g key={step}>
                                                        <circle cx={x} cy={y} r={dotRadiusStyle - 1} fill={getIntervalColor(sub.grado)} />
                                                        <text
                                                            x={x}
                                                            y={y + 4}
                                                            textAnchor="middle"
                                                            fill={est.dotTextColor}
                                                            fontSize="10"
                                                            fontWeight="bold"
                                                        >
                                                            {sub.etiqueta}
                                                        </text>
                                                    </g>
                                                );
                                            })
                                        )}
                                    </g>
                                );
                            })}

                            {escena.acorde.notas.map((dot, idx) => {
                                const x = paddingLeft + dot.s * stringSpacing;
                                const y = yDeTraste(dot.f);
                                if (y === null) return null;
                                const dotColor = dot.grado ? getIntervalColor(dot.grado) : baseFingerStyleColor;
                                const label = dot.etiqueta;

                                return (
                                    <g key={idx} {...(it.propsDedo ? it.propsDedo(dot) : {})}>
                                        <circle cx={x} cy={y} r={dotRadiusStyle} fill={dotColor} />
                                        {label && (
                                            <text
                                                x={x}
                                                y={y + 4.5}
                                                textAnchor="middle"
                                                fill={est.dotTextColor}
                                                fontSize="12"
                                                fontWeight="bold"
                                            >
                                                {label}
                                            </text>
                                        )}
                                    </g>
                                );
                            })}
                        </g>
                    )}

                    {capa("encima")}
                </svg>
            );
        }
