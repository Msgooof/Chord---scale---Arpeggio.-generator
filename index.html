                   ocupaba metro y medio. `mx-auto` la centra. */
                <div class="flex-1 min-h-0 overflow-y-auto p-3 md:p-6 md:pl-20 pb-28 md:pb-6" style={{ backgroundColor: 'var(--k-bg)' }}>
                <div class="space-y-4 w-full mx-auto" style={{ maxWidth: "1120px" }}>

                    {/* Cabecera flotante: lo que hace falta mientras se practica */}
                    <div class="k-bar k-sticky-header p-2.5">
                        <div class="flex flex-wrap items-center gap-2">
                            <input
                                type="text"
                                value={exercise.title}
                                onChange={(e) => setExercise(prev => ({ ...prev, title: e.target.value }))}
                                class="k-field flex-1 min-w-[140px] px-2 py-1.5 text-sm font-bold"
                                title="Título del ejercicio"
                            />

                            <div class="flex items-center gap-1">
                                <span class="k-label text-[9px]">bpm</span>
                                <input
                                    type="number"
                                    min="30"
                                    max="300"
                                    value={exercise.bpm}
                                    onChange={(e) => setExercise(prev => ({ ...prev, bpm: Math.max(30, Math.min(300, parseInt(e.target.value) || 80)) }))}
                                    class="k-field px-1.5 py-1.5 text-sm text-center"
                                    style={{ width: "62px" }}
                                />
                            </div>

                            <select
                                value={exercise.subdivision}
                                onChange={(e) => setExercise(prev => ({ ...prev, subdivision: e.target.value }))}
                                class="k-field px-1.5 py-1.5 text-sm"
                                style={{ width: "130px" }}
                                title="Cuántas notas por pulso: es la velocidad de la digitación"
                            >
                                {Song.SUBDIVISIONES.map(x => (
                                    <option key={x.id} value={x.id}>{x.name}</option>
                                ))}
                            </select>

                            <span class="k-chip">{(1 / porNota).toFixed(1)} notas/s</span>

                            <div class="flex items-center gap-1.5 ml-auto">
                                <button
                                    onClick={isPlaying ? onStop : () => onPlay()}
                                    disabled={exercise.pasos.length === 0}
                                    class={"k-btn k-btn--touch text-xs px-3 py-2 " + (isPlaying ? "k-btn--danger" : "k-btn--primary")}
                                >
                                    {isPlaying ? "■" : "▶"}
                                </button>
                                <button
                                    onClick={() => setExercise(prev => ({ ...prev, loop: !prev.loop }))}
                                    class={"k-btn k-btn--icon " + (exercise.loop ? "k-btn--primary" : "k-btn--ghost")}
                                    title="Repetir el ejercicio"
                                >
                                    ⟲
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="k-panel p-3 space-y-2">
                        <div class="flex flex-wrap items-center gap-2">
                            <span class="k-chip">{duracion}</span>
                            <span class="k-chip">{exercise.pasos.length} {exercise.pasos.length === 1 ? "paso" : "pasos"}</span>
                            <div class="flex-1"></div>
                            <button onClick={() => onExport("png")} class="k-btn k-btn--outline text-xs px-3 py-2">PNG</button>
                            <button onClick={() => onExport("svg")} class="k-btn k-btn--outline text-xs px-3 py-2">SVG</button>
                            <button onClick={() => onExport("pdf")} class="k-btn k-btn--outline text-xs px-3 py-2">PDF</button>
                            <button
                                onClick={() => setGestorAbierto(v => !v)}
                                aria-expanded={gestorAbierto}
                                class={"k-btn text-xs px-3 py-2 " + (gestorAbierto ? "k-btn--primary" : "k-btn--outline")}
                                title="Tus ejercicios: abrir, duplicar, borrar"
                            >
                                Ejercicios ({exercises.length})
                            </button>
                        </div>
                        <input
                            type="text"
                            value={exercise.notes}
                            onChange={(e) => setExercise(prev => ({ ...prev, notes: e.target.value }))}
                            placeholder="Ej.: con metrónomo, subir 5 bpm cada día..."
                            class="k-field w-full px-2 py-1.5 text-sm"
                        />
                    </div>

                    {gestorAbierto && (
                        <GestorArchivos
                            titulo="Tus ejercicios"
                            nuevo="+ Nuevo ejercicio"
                            abierto="abierto"
                            elementos={exercises}
                            activoId={exercise.id}
                            resumen={(e) => `${e.pasos.length} ${e.pasos.length === 1 ? "paso" : "pasos"} · ${e.bpm} bpm`}
                            onAbrir={onAbrirEjercicio}
                            onNuevo={onNuevo}
                            onDuplicar={onDuplicarEjercicio}
                            onBorrar={onBorrarEjercicio}
                            onBorrarTodo={onBorrarTodosLosEjercicios}
                            onCerrar={() => setGestorAbierto(false)}
                        />
                    )}

                    {exercise.pasos.length === 0 ? (
                        <div class="k-panel p-6 text-center text-xs" style={{ color: 'var(--k-text-muted)' }}>
                            Todavía no hay pasos. Ve a <strong>Escalas</strong>, <strong>Arpegios</strong> o
                            <strong> Libre</strong>, monta la digitación con su recorrido y pulsa
                            «→ Crear ejercicio».
                        </div>
                    ) : (
                        <div class="grid gap-3" style={{ gridTemplateColumns: "repeat(auto-fill, minmax(260px, 1fr))" }}>
                            {exercise.pasos.map((paso, i) => (
                                <div
                                    key={paso.id}
                                    class="k-panel p-2.5 space-y-2"
                                    onContextMenu={(e) => {
                                        e.preventDefault();
                                        setMenuPaso({ paso, i, x: e.clientX, y: e.clientY });
                                    }}
                                    style={{ borderColor: pasoSonando === paso.id ? 'var(--k-highlight)' : undefined }}
                                >
                                    <div class="flex items-center gap-1.5">
                                        <span class="k-chip">{i + 1}</span>
                                        <input
                                            type="text"
                                            value={paso.nombre}
                                            onChange={(e) => actualizarPaso(paso.id, { nombre: e.target.value })}
                                            class="k-field flex-1 min-w-0 px-2 py-1 text-xs font-bold"
                                        />
                                    </div>

                                    <ExerciseFretboard paso={paso} />

                                    <div class="flex items-center gap-1 flex-wrap">
                                        <span class="k-label text-[9px]">×</span>
                                        <input
                                            type="number"
                                            min="1"
                                            max="16"
                                            value={paso.repeticiones}
                                            onChange={(e) => actualizarPaso(paso.id, { repeticiones: Math.max(1, parseInt(e.target.value) || 1) })}
                                            class="k-field px-1 py-1 text-xs text-center"
                                            style={{ width: "46px" }}
                                            title="Veces que se repite"
                                        />
                                        <span class="k-chip">{paso.path.length} notas</span>
                                        <div class="flex-1"></div>
                                        <button onClick={() => moverPaso(i, -1)} class="k-btn k-btn--ghost text-[10px] px-1.5 py-1" title="Antes">‹</button>
                                        <button onClick={() => moverPaso(i, +1)} class="k-btn k-btn--ghost text-[10px] px-1.5 py-1" title="Después">›</button>
                                        <button onClick={() => onCargarEnMastil(paso)} class="k-btn k-btn--ghost text-[10px] px-2 py-1" title="Abrirlo en el mástil para retocarlo">↗</button>
                                        <BotonBorrar
                                            onClick={() => setExercise(prev => ({ ...prev, pasos: prev.pasos.filter(x => x.id !== paso.id) }))}
                                            title={`Quitar «${paso.nombre}» del ejercicio`}
                                            className="py-1"
                                            size="h-3 w-3"
                                        />
                                    </div>
                                </div>
                            ))}

                            {menuPaso && (
                                <MenuContextual
                                    x={menuPaso.x}
                                    y={menuPaso.y}
                                    titulo={menuPaso.paso.nombre}
                                    onCerrar={() => setMenuPaso(null)}
                                    opciones={[
                                        { label: "Abrirlo en el mástil", hacer: () => onCargarEnMastil(menuPaso.paso), ayuda: "Para retocar la digitación o el recorrido" },
                                        { label: "Duplicar", hacer: () => duplicarPaso(menuPaso.i) },
                                        { label: "Mover antes", hacer: () => moverPaso(menuPaso.i, -1), desactivada: menuPaso.i === 0 },
                                        { label: "Mover después", hacer: () => moverPaso(menuPaso.i, +1), desactivada: menuPaso.i === exercise.pasos.length - 1 },
                                        {
                                            label: "Quitar del ejercicio",
                                            hacer: () => setExercise(prev => ({ ...prev, pasos: prev.pasos.filter(x => x.id !== menuPaso.paso.id) })),
                                            estilo: { color: 'var(--k-danger)' }
                                        }
                                    ]}
                                />
                            )}
                        </div>
                    )}

                    {/* La hoja: los mismos nodos que se exportan */}
                    {exercise.pasos.length > 0 && (
                        <div class="space-y-1.5">
                            <div class="flex items-center gap-2 flex-wrap">
                                <span class="k-label">La ficha</span>
                                <span class="text-[10px]" style={{ color: 'var(--k-text-faint)' }}>
                                    esto es literalmente lo que se descarga
                                </span>
                            </div>
                            <ExerciseSheet exercise={exercise} />
                        </div>
                    )}
                </div>
                </div>
            );
        }

        /* La ficha A4. Misma tinta fija y mismo id de página que la hoja de
         * canción, así que la exportación es exactamente la misma función. */
        function ExerciseSheet({ exercise }) {
            const porFila = 3;
            const anchoDiagrama = 232;
            const altoDiagrama = 300;
            const porPagina = porFila * 3;
            const paginas = [];
            for (let i = 0; i < exercise.pasos.length; i += porPagina) {
                paginas.push(exercise.pasos.slice(i, i + porPagina));
            }
            if (paginas.length === 0) paginas.push([]);

            const porNota = Song.noteSeconds(exercise.bpm, exercise.subdivision);

            return (
                <div class="space-y-4">
                    {paginas.map((pasos, ip) => (
                        <svg
                            key={ip}
                            id={`song-sheet-page-${ip}`}
                            data-song-sheet="1"
                            width={HOJA.ancho}
                            height={HOJA.alto}
                            viewBox={`0 0 ${HOJA.ancho} ${HOJA.alto}`}
                            class="k-sheet-page"
                        >
                            <rect width={HOJA.ancho} height={HOJA.alto} fill={HOJA.papel} />

                            <text x={HOJA.ancho / 2} y={78} textAnchor="middle" fontFamily={SANS_FAMILIA} fontSize="34" fontWeight="800" fill={HOJA.tinta}>
                                {exercise.title || "Ejercicio"}
                            </text>
                            <text x={HOJA.margenX} y={110} fontFamily={SANS_FAMILIA} fontSize="12" fill={HOJA.tintaSuave}>
                                {[
                                    exercise.bpm + " bpm",
                                    Song.getSubdivision(exercise.subdivision).name,
                                    (1 / porNota).toFixed(1) + " notas por segundo",
                                    Song.formatDuration(Song.exerciseSeconds(exercise))
                                ].join("   ·   ")}
                            </text>
                            {exercise.notes && (
                                <text x={HOJA.ancho - HOJA.margenX} y={110} textAnchor="end" fontFamily={SANS_FAMILIA} fontSize="11" fontStyle="italic" fill={HOJA.tintaSuave}>
                                    {exercise.notes}
                                </text>
                            )}
                            <rect x={HOJA.margenX} y={122} width={HOJA.ancho - HOJA.margenX * 2} height={2} fill={HOJA.tinta} />

                            {pasos.map((paso, i) => {
                                const col = i % porFila;
                                const fila = Math.floor(i / porFila);
                                return (
                                    <g key={paso.id} transform={`translate(${HOJA.margenX + col * (anchoDiagrama + 16)}, ${150 + fila * (altoDiagrama + 24)})`}>
                                        <ExerciseFretboard paso={paso} ancho={anchoDiagrama} alto={altoDiagrama} />
                                        <text x={anchoDiagrama / 2} y={altoDiagrama + 14} textAnchor="middle" fontFamily={SANS_FAMILIA} fontSize="10" fill={HOJA.tintaSuave}>
                                            {(ip * porPagina) + i + 1}. {paso.repeticiones > 1 ? "×" + paso.repeticiones + "  ·  " : ""}{paso.path.length} notas
                                        </text>
                                    </g>
                                );
                            })}

                            <text x={HOJA.ancho / 2} y={HOJA.alto - 28} textAnchor="middle" fontFamily={SANS_FAMILIA} fontSize="10" fill={HOJA.tintaSuave}>
                                {ip + 1} / {paginas.length}   ·   Kharo Studio
                            </text>
                        </svg>
                    ))}
                </div>
            );
        }
    </script>

    <!-- ===================================================================
         BLOQUE 3 de 3: EL ESTUDIO DE DIAGRAMAS
         ===================================================================
         El componente App: estado, interacción con el mástil, dibujo del SVG
         y los paneles. Termina montando la aplicación.
         =================================================================== -->
    <script type="text/plain" id="app-source-studio">
        function App() {
            const [appMode, setAppMode] = useState("chord"); // 'chord', 'scale', 'arpeggio'
            const [chordName, setChordName] = useState("C");
            const [autoUpdateTitle, setAutoUpdateTitle] = useState(true);

            // El instrumento es explícito. El ukelele y el bajo de 4 cuerdas son
            // instrumentos distintos: no se pueden deducir del número de cuerdas.
            const [instrument, setInstrument] = useState(DEFAULT_INSTRUMENT);
            const numStrings = getInstrument(instrument).strings;

            const [numFrets, setNumFrets] = useState(5);
            const [startingFret, setStartingFret] = useState(1);

            const [dots, setDots] = useState(PRESETS[0].dots);
            const [stringStates, setStringStates] = useState(PRESETS[0].stringStates);

            /* --- LIBRE TIENE SU PROPIO MÁSTIL ------------------------------
             *
             * Acordes y Libre se editan igual, pero NO comparten las notas. Con
             * un solo juego, entrar en Libre a probar algo y volver dejaba el
             * acorde con cuatro notas en una cuerda: destruido sin haberlo
             * tocado. Son dos trabajos distintos y cada uno guarda el suyo.
             *
             * La afinación, el instrumento y la ventana de trastes SÍ se
             * comparten: eso es el instrumento, no el dibujo. */
            const [dotsLibre, setDotsLibre] = useState([]);
            const [stringStatesLibre, setStringStatesLibre] = useState(PRESETS[0].stringStates.map(() => "none"));
            const [barres, setBarres] = useState([]);
            const [tuning, setTuning] = useState(PRESETS[0].tuning);
            const [selectedTuningName, setSelectedTuningName] = useState("Estándar (E A D G B e)");

            // Octavas fijadas por un preset que no se pueden deducir por cercanía
            // a la afinación de fábrica (el ukelele de sol grave). null = deducir.
            const [tuningMidi, setTuningMidi] = useState(null);

            // Punto ÚNICO por el que pasa toda nota al aire. Antes había dos
            // sistemas de afinación en paralelo —el análisis leía las letras y el
            // audio unas tablas fijas—, y por eso Drop D se veía pero no se oía.
            const stringBaseMIDI = (stringIndex) => (
                tuningMidi
                    ? tuningMidi[stringIndex]
                    : window.KharoTheory.getStringBaseMIDI(tuning, stringIndex, instrument)
            );

            // States for Scale Mode
            const [scaleRoot, setScaleRoot] = useState(0); 
            const [scaleType, setScaleType] = useState("major"); 
            const [customScaleIntervals, setCustomScaleIntervals] = useState([true, false, true, false, true, true, false, true, false, true, false, true]); 

            // States for Arpeggio Mode
            const [arpeggioRoot, setArpeggioRoot] = useState(0);
            const [arpeggioType, setArpeggioType] = useState("maj7");
            
            const [scaleDisplayMode, setScaleDisplayMode] = useState("note"); 
            const [chordDisplayMode, setChordDisplayMode] = useState("diagram"); // 'diagram', 'note', 'degree'
            const [fretNumPosition, setFretNumPosition] = useState("left");

            const [toast, setToast] = useState({ show: false, message: "", accion: null });

            // Panel contextual flotante activo (toolbar). null = ninguno abierto.
            // Valores: 'theory' | 'instrument' | 'style' | 'intervals' | 'export'
            const [openPanel, setOpenPanel] = useState(null);

            // En móvil la barra de estado sólo muestra lo imprescindible; el
            // resto (tempo, modo de vista, vaciar) se despliega con el ⋯.
            const [showMoreBar, setShowMoreBar] = useState(false);

            /* --- APARTADO CANCIÓN --------------------------------------
             *
             * `appView` es QUÉ apartado se está usando; `appMode` sigue siendo
             * QUÉ se dibuja en el mástil (acorde / escala / arpegio). Son cosas
             * distintas: al volver de Canción, el mástil aparece en el modo en
             * el que se dejó.
             *
             * Lo guardado se lee UNA vez, con el inicializador perezoso de
             * useState. Pasar `Song.loadSongs()` a pelo leería localStorage en
             * cada render.
             * ---------------------------------------------------------- */
            /* Arranca en la portada, no en Acordes: sin ella, quien abre la app
             * por primera vez ve un mástil vacío y no sabe que hay cinco cosas
             * más dentro. Se vuelve con el logo. */
            /* Acordes y Libre se editan igual: se ponen notas a mano en el
             * mástil. Lo único que los separa es el tope de una nota por
             * cuerda, que en Libre no existe. Todas las guardas que decían
             * `appMode !== "chord"` preguntan ahora por esto. */
            const modoEditable = appMode === "chord" || appMode === "free";

            /* El mástil sobre el que se está escribiendo ahora mismo. Los
             * manejadores de clic son los mismos en los dos modos: lo único que
             * cambia es en cuál de los dos juegos de notas escriben. */
            const dotsActivos = appMode === "free" ? dotsLibre : dots;
            const setDotsActivos = appMode === "free" ? setDotsLibre : setDots;
            const stringStatesActivos = appMode === "free" ? stringStatesLibre : stringStates;
            const setStringStatesActivos = appMode === "free" ? setStringStatesLibre : setStringStates;

            const [appView, setAppView] = useState("welcome"); // 'welcome' | 'studio' | 'song' | 'exercise'

            const [chordLibrary, setChordLibrary] = useState(() => Song.loadChordLibrary());

            /* --- VARIAS CANCIONES, VARIOS EJERCICIOS ------------------------
             *
             * `loadSongs`/`saveSongs` siempre fueron plurales y aceptaron una
             * lista. La interfaz nunca la usó: escribía `[song]` y leía `[0]`,
             * así que sólo existía UNA canción y «Nueva» reemplazaba la
             * anterior con un aviso. Lo mismo con los ejercicios.
             *
             * Ahora la lista es el estado y la canción abierta es un índice
             * dentro de ella. La activa se guarda por separado y se funde con
             * la lista al escribir, para no serializar todo el cancionero en
             * cada tecla de la letra. */
            const [songs, setSongs] = useState(() => {
                const guardadas = Song.loadSongs();
                return guardadas.length ? guardadas.map(Song.normalizeSong) : [Song.createSong()];
            });
            /* La abierta sale DE LA LISTA, no de otra llamada a `createSong`.
             * Con dos llamadas independientes, arrancar sin nada guardado creaba
             * dos canciones con `id` distinto —la de la lista y la abierta— y el
             * gestor decía «Canciones (2)» recién abierta la app. */
            const [song, setSong] = useState(() => songs[0]);

            const [activeSectionId, setActiveSectionId] = useState(null);

            /* La sección abierta en el editor. La necesita el preview del
             * rasgueo para sonar al tempo al que sonará de verdad. */
            const seccionActivaDeLaCancion = () =>
                song.sections.find(s => s.id === activeSectionId) || song.sections[0] || null;

            const [exercises, setExercises] = useState(() => {
                const guardados = Song.loadExercises();
                return guardados.length ? guardados.map(Song.normalizeExercise) : [Song.createExercise()];
            });

            const [exercise, setExercise] = useState(() => exercises[0]);
            const [isPlayingExercise, setIsPlayingExercise] = useState(false);
            const [pasoSonando, setPasoSonando] = useState(null);
            const [isPlayingSong, setIsPlayingSong] = useState(false);
            const [isLooping, setIsLooping] = useState(false);
            const [playhead, setPlayhead] = useState(null); // {sectionId, repeat, barIndex}

            const [detectedChord, setDetectedChord] = useState("C");
            const [detectedRootSemi, setDetectedRootSemi] = useState(0);

            // --- ESTADO DE ARRASTRE DE CEJILLA ---
            const [dragStart, setDragStart] = useState(null); // { s: stringIndex, f: fretNum }
            const [dragCurrent, setDragCurrent] = useState(null); // { s: stringIndex, f: fretNum }

            // --- AUDIO INTERACTIVO Y ANIMACIÓN ---
            const [isPlayingSequence, setIsPlayingSequence] = useState(false);
            /* Tempo en NEGRAS. Antes esto guardaba milisegundos entre notas,
             * así que subir el control retrasaba la música: al revés de lo que
             * dice cualquier metrónomo. Las secuencias suenan en corcheas. */
            const [tempoBpm, setTempoBpm] = useState(100);

            // Segundos por corchea, que es el paso de las secuencias.
            const segundosPorCorchea = 30 / tempoBpm;

            /* --- LA SEPARACIÓN ENTRE CUERDAS DE UN RASGUEO -------------------
             *
             * Era `Math.min(0.045, segundosPorCorchea / 6)`. Como
             * `segundosPorCorchea / 6` es `5 / bpm`, ese valor sólo baja de
             * 0,045 cuando el tempo pasa de 111 bpm. Traducido: en modo Acorde,
             * mover el control de 30 a 111 devolvía SIEMPRE el mismo número y
             * sonaba exactamente igual. Un tercio largo del recorrido no hacía
             * nada, mientras la etiqueta seguía diciendo «Tempo».
             *
             * El techo estaba puesto por una razón buena —a 60 bpm sin él un
             * acorde tarda casi un segundo en sonar entero, y a 30 casi dos—,
             * pero un techo plano no es la forma de ponerlo: hay que apretar el
             * recorrido dentro de un margen audible, no aplastarle la mitad.
             *
             * Los límites son sólo una red, no la regla: el techo empieza a
             * morder a partir de 45 bpm hacia abajo, donde ya nadie rasguea, en
             * vez de a partir de 111, que era medio recorrido. Con ellos: 110 ms
             * por cuerda a 45 bpm (dos tercios de segundo el acorde entero en
             * seis cuerdas), 50 a 100 bpm, 21 a 240. */
            const LIMITE_RASGUEO = { min: 0.015, max: 0.11 };
            const separacionRasgueo = Math.max(
                LIMITE_RASGUEO.min,
                Math.min(LIMITE_RASGUEO.max, segundosPorCorchea / 6)
            );
            const [notePulse, setNotePulse] = useState(null); // { s: stringIndex, f: fretNum } para destello

            // --- ESTADO DE LEYENDA DE INTERVALOS ---
            const [showLegend, setShowLegend] = useState(true);

            /* --- RECORRIDO DE NOTAS ---
             * `pathManual` en null significa «lo calcula la app». No es lo
             * mismo que guardar el automático: así, al cambiar de escala o de
             * posición, el recorrido se recalcula solo mientras no lo hayas
             * tocado, y deja de hacerlo en cuanto lo tocas. */
            /* --- AGRUPACIÓN DE ARPEGIOS ---
             * "mapa" es el arpegio repartido por todo el mástil: sirve para ver
             * dónde está, no para tocarlo. Las otras dos lo convierten en formas
             * concretas. */
            const [arpGrouping, setArpGrouping] = useState("mapa");
            const [arpStringSet, setArpStringSet] = useState(0);
            const [arpInversion, setArpInversion] = useState(0);
            const [arpSweep, setArpSweep] = useState(false);
            const [arpTapping, setArpTapping] = useState("none");


            const [showPath, setShowPath] = useState(false);
            const [pathCriterio, setPathCriterio] = useState("digitacion");
            const [pathManual, setPathManual] = useState(null);
            const [editandoPath, setEditandoPath] = useState(false);
            /* Tres notas por cuerda por defecto: es como se estudia una escala.
             * Sin tope, en un mástil de 20 trastes el recorrido baja veinte
             * notas por la misma cuerda antes de cambiarse. */
            const [pathNotasPorCuerda, setPathNotasPorCuerda] = useState(3);
            const [pathRetorno, setPathRetorno] = useState(false);

            /* Las tríadas de la tonalidad, dibujadas sobre la escala. `null`
             * en `gradoTriada` = ninguna señalada, y entonces se ven las siete
             * a la vez: el punto es ver cómo se solapan. */
            const [scaleTriads, setScaleTriads] = useState(false);
            /* Dos estados y no uno: `gradoTriada` es lo que se está viendo
             * AHORA —cambia con el ratón por encima— y `gradoFijado` es lo que
             * has dejado puesto con un clic. Al apartar el ratón se vuelve a lo
             * fijado, no a nada. */
            const [gradoTriada, setGradoTriada] = useState(null);
            const [gradoFijado, setGradoFijado] = useState(null);
            const [menuTriada, setMenuTriada] = useState(null);   // { grado, x, y } en píxeles de pantalla

            /* Modo libre: el mástil entero pasa a ser pulsable y el recorrido lo
             * escribes tú, nota a nota, sin tener que elegir entre lo que
             * propone un preset. */
            /* En Libre el mástil arranca vacío y sin fórmula. `guiaEscala`
             * dibuja una escala por debajo como referencia, apagada por defecto:
             * el sentido de esta sección es el papel en blanco, y quien quiera
             * la guía la enciende. */
            const [guiaEscala, setGuiaEscala] = useState(false);

            /* El menú de clic derecho de una nota del mástil. Mismo trato que
             * `menuFlecha` y `menuTriada`: coordenadas de pantalla, porque es
             * donde ocurrió el clic. */
            const [menuNota, setMenuNota] = useState(null);

            /* Trazar flechas arrastrando, y el menú de una flecha ya trazada.
             *
             * `arrastroRef` no es un capricho: con `setPointerCapture`, el
             * `pointerup` cae en la nota de ORIGEN aunque hayas soltado sobre
             * otra, y dispara también su `onClick`. Sin esta marca, conectar
             * dos notas terminaría llamando a `alternarEnRecorrido` sobre la
             * primera y sacándola del recorrido justo después de conectarla. */
            const [arrastreFlecha, setArrastreFlecha] = useState(null);   // { desde:{s,f}, hasta:{x,y} }
            const [menuFlecha, setMenuFlecha] = useState(null);           // { i, x, y } en píxeles de pantalla
            const arrastroRef = useRef(false);
            const svgRef = useRef(null);

            // --- ESTADOS DINÁMICOS DEL EDITOR DE ESTILO ---
            /* --- EL ESTILO DEL DIAGRAMA -------------------------------------
             *
             * UN objeto, no ocho estados sueltos: así se puede bajar entero por
             * el Context a las miniaturas, a la hoja y a la ficha de ejercicio,
             * y guardarse de una pieza.
             *
             * LOS OCHO NOMBRES DE ANTES SE QUEDAN, como constantes derivadas y
             * setters de una línea. No es pereza: esas variables tienen unos
             * CIENTO NUEVE puntos de uso repartidos por este componente, y un
             * solo olvido al renombrarlas es un `ReferenceError` en tiempo de
             * ejecución —Babel compila al cargar— que deja la app en blanco.
             * Así el cambio son nueve líneas contiguas y el panel de Estilo no
             * se toca ni un carácter. La deuda que queda (dos nombres para lo
             * mismo) es cosmética y se salda con un reemplazo mecánico.
             *
             * Todo pasa por `normalizeStyle`, también lo que escribe el propio
             * panel: es el único sitio donde un valor puede volverse basura.
             * --------------------------------------------------------------- */
            const estiloGuardadoRef = useRef(null);
            if (estiloGuardadoRef.current === null) estiloGuardadoRef.current = loadStyleState();

            const [style, setStyle] = useState(() => estiloGuardadoRef.current.activo);
            const [stylePresets, setStylePresets] = useState(() => estiloGuardadoRef.current.presets);
            const [nombrePreset, setNombrePreset] = useState("");

            const patchStyle = (parche) => setStyle(prev => normalizeStyle({ ...prev, ...parche }));

            const bgStyleColor = style.backgroundColor;
            const gridStyleColor = style.gridColor;
            const textStyleColor = style.textColor;
            const fontFamilyStyle = style.fontFamily;
            const dotRadiusStyle = style.dotRadius;
            const lineWidthStyle = style.lineWidth;
            const baseFingerStyleColor = style.baseFingerColor;
            const intervalColors = style.intervalColors;

            const setBgStyleColor = (v) => patchStyle({ backgroundColor: v });
            const setGridStyleColor = (v) => patchStyle({ gridColor: v });
            const setTextStyleColor = (v) => patchStyle({ textColor: v });
            const setFontFamilyStyle = (v) => patchStyle({ fontFamily: v });
            const setDotRadiusStyle = (v) => patchStyle({ dotRadius: v });
            const setLineWidthStyle = (v) => patchStyle({ lineWidth: v });
            const setBaseFingerStyleColor = (v) => patchStyle({ baseFingerColor: v });
            const setIntervalColors = (v) => patchStyle({ intervalColors: v });
            const setDotTextColor = (v) => patchStyle({ dotTextColor: v });
            const setPathColor = (v) => patchStyle({ pathColor: v });

            /* El estilo se guarda solo, con medio segundo de respiro. Aquí el
             * respiro importa más que en la canción: arrastrar el slider del
             * radio dispara unos sesenta cambios por segundo. */
            useEffect(() => {
                const t = setTimeout(() => saveStyleState({ activo: style, presets: stylePresets }), 500);
                return () => clearTimeout(t);
            }, [style, stylePresets]);

            const getIntervalColor = (degreeStr) => {
                if (!degreeStr) return baseFingerStyleColor;
                if (degreeStr.includes("1")) return intervalColors["1"];
                if (degreeStr.includes("2")) return intervalColors["2"];
                if (degreeStr.includes("3")) return intervalColors["3"];
                if (degreeStr.includes("4")) return intervalColors["4"];
                if (degreeStr.includes("5")) return intervalColors["5"];
                if (degreeStr.includes("6")) return intervalColors["6"];
                if (degreeStr.includes("7")) return intervalColors["7"];
                return baseFingerStyleColor;
            };

            const resetToDefaultStyle = () => {
                setStyle(normalizeStyle({}));
                showToast("Estilos restablecidos al diseño por defecto");
            };

            /* --- PRESETS DE ESTILO -------------------------------------------
             * Guardar con un nombre que ya existe SOBRESCRIBE ese preset en vez
             * de duplicarlo: si no, acabas con seis «Mi estilo» y ninguno se
             * sabe cuál es. Y se indexa por `id`, no por nombre, para que
             * renombrar no rompa la selección. */
            const MAX_PRESETS = 20;

            const guardarPreset = (nombre) => {
                const limpio = (nombre || "").trim();
                if (!limpio) { showToast("Ponle nombre al preset"); return; }

                const existente = stylePresets.find(p => p.name.toLowerCase() === limpio.toLowerCase());
                if (existente) {
                    setStylePresets(prev => prev.map(p => p.id === existente.id ? { ...p, style } : p));
                    showToast(`Preset «${limpio}» actualizado`);
                    return;
                }
                if (stylePresets.length >= MAX_PRESETS) {
                    showToast(`Ya tienes ${MAX_PRESETS} presets: borra alguno antes`);
                    return;
                }
                const id = "est-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
                setStylePresets(prev => [...prev, { id, name: limpio, style }]);
                showToast(`Preset «${limpio}» guardado`);
            };

            /* Aplicar un preset REEMPLAZA el estilo entero, nunca fusiona: un
             * preset es un aspecto completo, y una fusión parcial dejaría los
             * colores de grado anteriores mezclados con los nuevos. */
            const aplicarPreset = (id) => {
                const preset = stylePresets.find(p => p.id === id);
                if (!preset) return;
                setStyle(normalizeStyle(preset.style));
                showToast(`Estilo «${preset.name}» aplicado`);
            };

            const borrarPreset = (id) => {
                const preset = stylePresets.find(p => p.id === id);
                if (!preset) return;
                setStylePresets(prev => prev.filter(p => p.id !== id));
                showToast(`Preset «${preset.name}» borrado`);
            };


            // Escape cierra el menú de la flecha. El clic fuera lo cierra con
            // el backdrop, pero un menú del que sólo se sale con el ratón es
            // una trampa para quien navega con el teclado.
            useEffect(() => {
                if (!menuFlecha && menuTriada === null && !menuNota) return;
                const alPulsar = (e) => {
                    if (e.key !== "Escape") return;
                    setMenuFlecha(null);
                    setMenuTriada(null);
                    setMenuNota(null);
                };
                window.addEventListener("keydown", alPulsar);
                return () => window.removeEventListener("keydown", alPulsar);
            }, [menuFlecha, menuTriada, menuNota]);

            /* Y se cierran al cambiar de apartado o de modo. Los tres se pintan
             * fuera de la rama del estudio —son capas sobre toda la ventana— así
             * que uno abierto sobrevivía al salto a Canción y se quedaba ahí
             * flotando, con su backdrop tragándose los clics. */
            useEffect(() => {
                setMenuFlecha(null);
                setMenuTriada(null);
                setMenuNota(null);
            }, [appView, appMode]);

            /* --- RESTAURAR SIN QUE LOS EFECTOS PISEN LO RESTAURADO ----------
             *
             * `loadPreset` y `cargarPasoEnMastil` escriben instrumento Y
             * afinación en el MISMO render. Los efectos corren después: el de
             * `[instrument]` ve que el instrumento cambió y hace lo que le toca
             * —poner la afinación de fábrica—, pisando lo que se acaba de
             * escribir. Sólo se notaba al cargar algo de OTRO instrumento, que
             * es cuando `instrument` cambia de verdad.
             *
             * La bandera se levanta al restaurar y baja sola en el efecto sin
             * dependencias de más abajo. El ORDEN de estas tres declaraciones
             * importa: React corre los efectos en el orden en que se declaran,
             * así que los dos guardados van primero y el que la baja, último.
             * ---------------------------------------------------------------- */
            const restaurando = useRef(false);

            // Al cambiar de instrumento se carga su afinación de fábrica y se
            // limpia el mástil: las posiciones del instrumento anterior no
            // significan lo mismo aquí.
            useEffect(() => {
                if (restaurando.current) return;
                const availablePresets = TUNING_PRESETS[instrument];
                if (availablePresets && availablePresets.length > 0) {
                    setTuning(availablePresets[0].notes);
                    setSelectedTuningName(availablePresets[0].name);
                    setTuningMidi(availablePresets[0].midi ?? null);
                } else {
                    setTuning(getInstrument(instrument).standard.map(m => midiToNoteName(m).replace(/-?\d+$/, "")));
                    setSelectedTuningName("Personalizada");
                    setTuningMidi(null);
                }

                if (stringStates.length !== numStrings) {
                    setStringStates(Array(numStrings).fill("none"));
                    setDots([]);
                    setBarres([]);
                    setStringStatesLibre(Array(numStrings).fill("none"));
                    setDotsLibre([]);
                }
            }, [instrument]);

            /* --- EL RECORRIDO A MANO ES DE UN MODO ---------------------------
             *
             * `pathManual` era uno solo para Escalas, Arpegios y Libre. Entrar
             * en Libre lo dejaba en `[]`, y como `recorridoActual` da prioridad
             * a `pathManual` sobre el automático, un array vacío significa
             * «recorrido de cero notas escrito por ti»: al volver a Escalas el
             * panel decía «0 notas, a mano» con el mástil lleno y ninguna
             * flecha, y había que pulsar «Reiniciar» para recuperarlo.
             *
             * Un recorrido escrito sobre una escala no significa nada sobre un
             * arpegio, así que muere con el modo.
             * ---------------------------------------------------------------- */
            const modoAnterior = useRef(appMode);

            useEffect(() => {
                const previo = modoAnterior.current;
                modoAnterior.current = appMode;
                if (restaurando.current) return;

                /* En Libre, `[]` y no `null`: ahí el recorrido SIEMPRE es tuyo
                 * —no hay fórmula de la que sacar uno automático— y el panel
                 * tiene que decir «a mano» desde el primer momento. */
                setPathManual(appMode === "free" ? [] : null);

                /* `showPath` y `editandoPath` sólo se tocan al entrar o salir de
                 * Libre, que es quien los enciende por su cuenta y quien los
                 * dejaba encendidos al salir. Entre Escalas y Arpegios se
                 * respetan: ahí los enciende el usuario, y apagárselos al
                 * cambiar de pestaña sería quitarle algo que él había puesto. */
                if (appMode === "free") {
                    setShowPath(true);
                    setEditandoPath(true);
                } else if (previo === "free") {
                    setShowPath(false);
                    setEditandoPath(false);
                }
            }, [appMode]);

            /* Y aquí baja la bandera. Sin dependencias —corre en cada commit— y
             * declarado DESPUÉS de los dos efectos que la consultan, para que en
             * el commit en el que se restaura corra detrás de ellos y deje el
             * terreno limpio para el cambio siguiente. Un `setTimeout` no vale:
             * para cuando saltara, los efectos ya habrían corrido. */
            useEffect(() => { restaurando.current = false; });

            useEffect(() => {
                if (appMode === "chord") {
                    const result = analyzeCurrentChord();
                    setDetectedChord(result.name);
                    setDetectedRootSemi(result.rootSemi);

                    if (autoUpdateTitle) {
                        if (result.name && !result.name.includes("Ninguno") && !result.name.includes("Desconocido")) {
                            setChordName(result.name);
                        } else if (result.name && result.name.includes("Ninguno")) {
                            setChordName("Mástil Vacío");
                        } else if (result.name && result.name.includes("Desconocido")) {
                            setChordName("Acorde");
                        }
                    }
                } else if (appMode === "scale") {
                    if (autoUpdateTitle) {
                        const rootName = NOTE_NAMES[scaleRoot];
                        const typeName = scaleType === "custom" ? "Escala Personalizada" : SCALE_PRESETS.find(p => p.id === scaleType)?.name;
                        setChordName(`${rootName} ${typeName}`);
                    }
                } else if (appMode === "arpeggio") {
                    if (autoUpdateTitle) {
                        const rootName = NOTE_NAMES[arpeggioRoot];
                        const typeName = ARPEGGIO_PRESETS.find(p => p.id === arpeggioType)?.name;
                        setChordName(`Arpegio: ${rootName} ${typeName}`);
                    }
                } else if (appMode === "free") {
                    /* En Libre no hay fórmula de la que sacar un nombre. Sin este
                     * caso, el título se quedaba en el del último acorde
                     * detectado y el diagrama salía exportado con un nombre que
                     * no es el suyo. */
                    if (autoUpdateTitle) setChordName(dotsLibre.length ? "Digitación libre" : "Mástil vacío");
                }
            }, [dots, stringStates, barres, tuning, numStrings, startingFret, autoUpdateTitle, appMode, scaleRoot, scaleType, customScaleIntervals, arpeggioRoot, arpeggioType, dotsLibre]);

            const analyzeCurrentChord = () => {
                const sounding = [];
                for (let s = 0; s < numStrings; s++) {
                    const state = stringStates[s];
                    if (state === "muted") continue;

                    const tuningNote = tuning[s];
                    const baseSemi = parseNoteToSemi(tuningNote);

                    const dot = dots.find(d => d.s === s);
                    if (dot) {
                        const absFret = startingFret + dot.f - 1;
                        sounding.push({
                            semitone: (baseSemi + absFret) % 12,
                            stringIndex: s,
                            isFretted: true,
                            absoluteFret: absFret
                        });
                        continue;
                    }

                    const barre = barres.find(b => s >= b.fromString && s <= b.toString);
                    if (barre) {
                        const absFret = startingFret + barre.fret - 1;
                        sounding.push({
                            semitone: (baseSemi + absFret) % 12,
                            stringIndex: s,
                            isFretted: true,
                            absoluteFret: absFret
                        });
                        continue;
                    }

                    if (state === "open") {
                        // La cuerda al aire es la CEJUELA de la digitación, y la
                        // digitación se desplaza entera con la ventana.
                        const absFret = toAbsoluteFret(startingFret, 0);
                        sounding.push({
                            semitone: (baseSemi + absFret) % 12,
                            stringIndex: s,
                            isFretted: absFret > 0,
                            absoluteFret: absFret
                        });
                    }
                }

                // El reconocimiento vive en el núcleo: sólo mira clases de altura
                // y cuál es la nota más grave, así que no sabe ni le importa que
                // esto sea un mástil.
                return identifyChord(sounding);
            };

            const handleTuningPresetChange = (notesArray, name, explicitMidi = null) => {
                setTuning(notesArray);
                setSelectedTuningName(name);
                setTuningMidi(explicitMidi);
                showToast(`Afinación cambiada a: ${name}`);
            };

            /* Cambiar de apartado. Canción no es un cuarto `appMode` sino otra
             * vista: `appMode` dice qué se DIBUJA en el mástil, y eso es
             * ortogonal a en qué apartado estás. Así, al volver de Canción, el
             * mástil aparece como se dejó.
             *
             * Volver a un modo de dibujo reactiva el título automático: el
             * nombre que había describía lo que se miraba antes. */
            const selectMode = (id) => {
                if (id === "song" || id === "exercise") {
                    setAppView(id);
                    setOpenPanel(null);
                    return;
                }
                setAppView("studio");
                setAppMode(id);
                setAutoUpdateTitle(true);
                /* Libre sin flechas no se entiende: se ponen notas y no se ve el
                 * orden, que es de lo que trata la sección. Se encienden al
                 * entrar, no al poner la primera nota, para que la sección se
                 * explique sola desde el primer momento. */
                if (id === "free") prepararModoLibre();
            };

            /* UN temporizador vivo, no uno por llamada. Sin esto, dos toasts
             * seguidos comparten el reloj del primero: el segundo llega a los
             * 2,8 s y se muere a los 200 ms sin que le de tiempo a leerse.
             *
             * Y una accion opcional, porque el toast es donde vive el deshacer de
             * lo que se borra sin preguntar: showToast(msg, { texto, alPulsar }).
             * Con accion vive 8 s -hay que leerlo Y decidir-; sin ella, 3. */
            const toastTimerRef = useRef(null);

            const cerrarToast = () => {
                if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
                toastTimerRef.current = null;
                setToast({ show: false, message: "", accion: null });
            };

            const showToast = (msg, accion) => {
                if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
                setToast({ show: true, message: msg, accion: accion || null });
                toastTimerRef.current = setTimeout(cerrarToast, accion ? 8000 : 3000);
            };

            /* Pulsar la accion la ejecuta y cierra: el toast ya ha cumplido. Se lee
             * del estado y no de una clausura para que el boton haga siempre lo del
             * toast que se esta viendo, no lo del que lo abrio. */
            const pulsarAccionDelToast = () => {
                const accion = toast.accion;
                cerrarToast();
                if (accion && accion.alPulsar) accion.alPulsar();
            };

            /* --- GUARDADO DE LA CANCIÓN Y LA BIBLIOTECA -------------------
             *
             * Se guarda solo, con un respiro de medio segundo: escribir en
             * localStorage en cada tecla de la letra sería serializar la
             * canción entera decenas de veces por frase.
             *
             * `saveSongs` devuelve false si el navegador no deja guardar
             * (ventana privada, cuota llena, cookies bloqueadas). No se avisa
             * en cada intento —sería un toast cada medio segundo—, pero por eso
             * existe la exportación a JSON: es la copia que no depende del
             * navegador.
             * -------------------------------------------------------------- */
            /* La canción abierta se funde en la lista antes de escribir. Sin
             * esto, guardar la activa borraría las demás — que es literalmente
             * lo que hacía el `[song]` de antes. */
            const fundirEnLista = (lista, activa) => {
                const i = lista.findIndex(x => x.id === activa.id);
                if (i === -1) return [...lista, activa];
                const copia = lista.slice();
                copia[i] = activa;
                return copia;
            };

            useEffect(() => {
                const t = setTimeout(() => {
                    setSongs(prev => {
                        const lista = fundirEnLista(prev, song);
                        Song.saveSongs(lista);
                        return lista;
                    });
                }, 500);
                return () => clearTimeout(t);
            }, [song]);

            useEffect(() => {
                const t = setTimeout(() => Song.saveChordLibrary(chordLibrary), 500);
                return () => clearTimeout(t);
            }, [chordLibrary]);

            useEffect(() => {
                const t = setTimeout(() => {
                    setExercises(prev => {
                        const lista = fundirEnLista(prev, exercise);
                        Song.saveExercises(lista);
                        return lista;
                    });
                }, 500);
                return () => clearTimeout(t);
            }, [exercise]);

            // La sección activa se fija al entrar, y se recoloca si la que
            // estaba activa desaparece.
            useEffect(() => {
                const existe = song.sections.some(s => s.id === activeSectionId);
                if (!existe && song.sections.length > 0) {
                    setActiveSectionId(song.sections[0].id);
                }
            }, [song.sections, activeSectionId]);

            /* --- BIBLIOTECA DE ACORDES ------------------------------------
             * Guardar un acorde es hacerle una FOTO al mástil: la digitación
             * entera, no el nombre. Con el nombre solo no se podría dibujar el
             * diagrama en la hoja ni sonar la digitación que el usuario eligió,
             * porque hay muchas formas de tocar el mismo acorde.
             * -------------------------------------------------------------- */
            const saveChordToLibrary = () => {
                const foto = Song.createChordSnapshot({
                    name: (chordName || detectedChord || "Acorde").trim(),
                    instrument, tuning, tuningMidi,
                    numFrets, startingFret,
                    dots, barres, stringStates
                });

                if (chordVoicingToMidi(foto).length === 0) {
                    showToast("Ese mástil no suena: pon alguna nota o marca cuerdas al aire");
                    return;
                }

                setChordLibrary(prev => [...prev, foto]);
                showToast(`«${foto.name}» guardado en la biblioteca`);
            };

            const renameChordInLibrary = (id, nombre) => {
                setChordLibrary(prev => prev.map(c => c.id === id ? { ...c, name: nombre } : c));
            };

            /* Al quitar un acorde de la biblioteca hay que quitarlo también de
             * las progresiones que lo usaban: si no, quedan compases apuntando
             * a un acorde que ya no existe, que no se dibuja ni suena. */
            const removeChordFromLibrary = (id) => {
                const usos = song.sections.reduce(
                    (n, s) => n + s.bars.filter(b => b.chordId === id).length, 0
                );

                setChordLibrary(prev => prev.filter(c => c.id !== id));
                setSong(prev => {
                    // Y su lectura armónica con él: si no, queda una entrada
                    // apuntando a un acorde que ya no existe.
                    const harmony = { ...(prev.harmony || {}) };
                    delete harmony[id];
                    return {
                        ...prev,
                        harmony,
                        sections: prev.sections.map(s => ({
                            ...s,
                            bars: s.bars.filter(b => b.chordId !== id)
                        }))
                    };
                });

                showToast(usos > 0
                    ? `Acorde borrado, y quitado de ${usos} ${usos === 1 ? "compás" : "compases"}`
                    : "Acorde borrado de la biblioteca");
            };

            // Escuchar un acorde de la biblioteca: un rasgueo suelto, sin
            // meterse en la reproducción de la canción.
            const auditionChord = (chord) => {
                synthInstance.init();
                const notas = chordVoicingToMidi(chord);
                notas.forEach((midi, i) => {
                    synthInstance.playNote(midi, 1.2, i * 0.03);
                });
            };

            /* Empezar de cero reemplaza lo que hay, y el guardado automático
             * pisa la copia del navegador medio segundo después. Por eso se
             * pregunta cuando hay algo escrito: aquí no hay deshacer. */
            /* --- REPRODUCCIÓN DE LA CANCIÓN -------------------------------
             *
             * Planificador con horizonte: cada 25 ms se programan los golpes
             * de los próximos 250 ms contra el reloj de Web Audio, que es
             * exacto. Lo contrario —encadenar esperas con setTimeout, un
             * acorde detrás de otro— acumula error en cada salto y a los treinta
             * segundos la canción va con retraso audible.
             *
             * Al parar, lo ya programado sigue sonando hasta agotar el
             * horizonte: como mucho un cuarto de segundo de cola. Es el precio
             * de programar por delante, y es lo que evita que se oigan huecos.
             * -------------------------------------------------------------- */
            const songPlaybackRef = useRef({ activo: false, timer: null });

            // El intervalo se crea una vez y lee estos valores mientras corre.
            // Sin refs leería el estado del render en que se creó: activar el
            // bucle a mitad de canción no tendría efecto.
            const isLoopingRef = useRef(false);
            useEffect(() => { isLoopingRef.current = isLooping; }, [isLooping]);

            const stopSong = () => {
                const est = songPlaybackRef.current;
                est.activo = false;
                if (est.timer) {
                    clearInterval(est.timer);
                    est.timer = null;
                }
                setIsPlayingSong(false);
                setPlayhead(null);
            };

            // Si el apartado se abandona a media canción, no puede quedarse
            // sonando por detrás.
            useEffect(() => {
                if (appView !== "song") stopSong();
            }, [appView]);

            useEffect(() => () => stopSong(), []);

            const playSong = (soloSeccion) => {
                if (songPlaybackRef.current.activo) return;

                /* Con `soloSeccion` se repite una parte suelta, que es como se
                 * estudia un estribillo. Los tiempos se recolocan desde cero:
                 * `expandSong` los da relativos a la canción entera, y al
                 * quedarnos con un trozo del medio habría que esperar en
                 * silencio hasta que le llegara el turno. */
                let compases = Song.expandSong(song);
                if (soloSeccion) {
                    compases = compases.filter(c => c.sectionId === soloSeccion);
                    const desfase = compases.length ? compases[0].startSeconds : 0;
                    compases = compases.map(c => ({ ...c, startSeconds: c.startSeconds - desfase }));
                }

                if (compases.length === 0) {
                    showToast(soloSeccion
                        ? "Esta sección todavía no tiene acordes"
                        : "Esta canción todavía no tiene acordes");
                    return;
                }

                const acordesPorId = {};
                chordLibrary.forEach(c => { acordesPorId[c.id] = c; });

                const ultimo = compases[compases.length - 1];
                const duracionTotal = ultimo.startSeconds + ultimo.durationSeconds;

                synthInstance.init();
                const ctx = synthInstance.ctx;

                const est = songPlaybackRef.current;
                est.activo = true;
                est.siguiente = 0;
                est.marca = null;
                // Un respiro antes de empezar: programar para "ahora mismo"
                // corta el ataque de la primera nota.
                est.inicio = ctx.currentTime + 0.12;

                setIsPlayingSong(true);

                const HORIZONTE = 0.25;

                const tick = () => {
                    if (!est.activo) return;
                    const ahora = ctx.currentTime;

                    // 1. Programar lo que ya entra en el horizonte.
                    while (est.siguiente < compases.length) {
                        const compas = compases[est.siguiente];
                        const inicioCompas = est.inicio + compas.startSeconds;
                        if (inicioCompas > ahora + HORIZONTE) break;

                        const acorde = acordesPorId[compas.chordId];
                        const notas = acorde ? chordVoicingToMidi(acorde) : [];

                        if (notas.length > 0) {
                            Song.rhythmEventsForBar(compas.rhythmId, compas.beats, compas.bpm, song.customRhythms).forEach(evento => {
                                const golpe = Song.notesForEvent(notas, evento);
                                golpe.forEach((midi, i) => {
                                    // `spread` es lo que separa un rasgueo de un
                                    // acorde de piano: las cuerdas no suenan a la vez.
                                    const cuando = inicioCompas + evento.atSeconds + i * evento.spread;
                                    synthInstance.playNote(midi, evento.duration || 1.1, Math.max(0, cuando - ahora), evento.gain);
                                });
                            });
                        }

                        est.siguiente++;
                    }

                    // 2. Mover el cabezal, sólo cuando cambia de compás: esto
                    //    corre 40 veces por segundo y repintar en cada vuelta
                    //    no lo aguanta ningún teléfono.
                    const transcurrido = ahora - est.inicio;
                    const enCurso = compases.find(c =>
                        transcurrido >= c.startSeconds &&
                        transcurrido < c.startSeconds + c.durationSeconds
                    );

                    const marca = enCurso
                        ? enCurso.sectionId + "|" + enCurso.repeat + "|" + enCurso.barIndex
                        : null;

                    if (marca !== est.marca) {
                        est.marca = marca;
                        setPlayhead(enCurso
                            ? { sectionId: enCurso.sectionId, repeat: enCurso.repeat, barIndex: enCurso.barIndex }
                            : null);
                    }

                    // 3. Final.
                    if (transcurrido >= duracionTotal) {
                        if (isLoopingRef.current) {
                            est.inicio = est.inicio + duracionTotal;
                            est.siguiente = 0;
                        } else {
                            stopSong();
                        }
                    }
                };

                est.timer = setInterval(tick, 25);
                tick();
            };

            /* --- ESCUCHAR UN PATRÓN DE RASGUEO ----------------------------
             * Dos vueltas sobre el primer acorde de la canción. Sobre cuerdas
             * al aire no se distinguiría un acento de un apagado: hace falta un
             * acorde de verdad para que el patrón se oiga como es.
             * -------------------------------------------------------------- */
            const [previewSonando, setPreviewSonando] = useState(false);
            const previewRef = useRef(null);

            const stopPreviewRhythm = () => {
                if (previewRef.current) { clearInterval(previewRef.current); previewRef.current = null; }
                previewPatronRef.current = null;
                setPreviewSonando(false);
            };

            /* --- ESCUCHAR UN RASGUEO: PERCUSIÓN, NO EL ACORDE -----------------
             *
             * Antes esto buscaba «el primer acorde que aparezca en la canción» y
             * tocaba sus notas. Dos problemas, y el segundo es el de fondo:
             *
             *   - El acorde que sonaba no lo había elegido nadie: salía del
             *     primer compás de la primera sección que tuviera alguno.
             *   - Escribiendo un ritmo NO se está escuchando armonía. Se está
             *     contando. Y un acorde sostenido encima de cada golpe es
             *     justamente lo que impide oír dónde cae cada uno.
             *
             * Ahora suena la mano sobre las cuerdas: ruido filtrado, sin altura.
             * Los tres timbres son los tres gestos que la rejilla distingue —↓
             * lleno, ↑ fino, × seco— y el acento se oye porque es más fuerte.
             *
             * La CANCIÓN entera sigue sonando con sus acordes: ahí sí se quiere
             * oír la armonía. Esto es sólo el ▶ del editor.
             * --------------------------------------------------------------- */
            const previewPatronRef = useRef(null);

            const timbreDelGolpe = (evento) => {
                if (evento.muted) return "seco";
                return evento.dir === "up" ? "alto" : "golpe";
            };

            const previewRhythm = (patron) => {
                stopPreviewRhythm();
                synthInstance.init();

                /* El tempo es el de la SECCIÓN activa si lo tiene propio. Antes
                 * era siempre `song.bpm`, así que un patrón se oía a un tempo en
                 * el editor y a otro distinto al reproducir la canción. */
                const bpm = (seccionActivaDeLaCancion() && seccionActivaDeLaCancion().bpm) || song.bpm;
                const duracionVuelta = Song.beatsToSeconds(patron.beats, bpm);

                /* Y es un BUCLE de verdad. El botón decía «Escuchar el patrón en
                 * bucle» y programaba dos pasadas: se paraba justo cuando
                 * empezabas a contarlo. Se reprograma una vuelta cada vez, con
                 * el reloj de Web Audio, que es el exacto. */
                const programarVuelta = (desde) => {
                    Song.rhythmEventsForBar(patron.id, patron.beats, bpm, song.customRhythms).forEach(evento => {
                        const cuando = desde + evento.atSeconds;
                        synthInstance.playPercussion(
                            timbreDelGolpe(evento),
                            Math.max(0, cuando - synthInstance.ctx.currentTime),
                            evento.gain
                        );
                    });
                };

                const est = { siguiente: synthInstance.ctx.currentTime + 0.1 };
                previewPatronRef.current = est;

                // Horizonte de un cuarto de segundo, como el de la canción:
                // programar por delante es lo que evita que se oigan huecos.
                const tick = () => {
                    if (previewPatronRef.current !== est) return;
                    while (est.siguiente < synthInstance.ctx.currentTime + 0.25) {
                        programarVuelta(est.siguiente);
                        est.siguiente += duracionVuelta;
                    }
                };

                tick();
                previewRef.current = setInterval(tick, 25);
                setPreviewSonando(true);
            };

            /* Cambiar el tempo con el preview sonando no hacía nada, porque todo
             * iba programado por delante contra el reloj de audio. Se relanza. */
            useEffect(() => {
                if (!previewSonando) return;
                const patron = (song.customRhythms || []).find(r => r.id === song.rhythmId)
                    || Song.RHYTHM_PATTERNS.find(r => r.id === song.rhythmId);
                if (patron) previewRhythm(patron);
                // eslint-disable-next-line
            }, [song.bpm]);

            /* --- REPRODUCIR UN EJERCICIO ----------------------------------
             * Nota a nota, a la velocidad elegida, en el orden del recorrido de
             * cada paso. Mismo planificador con horizonte que la canción: el
             * reloj de Web Audio es exacto y encadenar esperas acumula error.
             * -------------------------------------------------------------- */
            const exercisePlaybackRef = useRef({ activo: false, timer: null });

            const stopExercise = () => {
                const est = exercisePlaybackRef.current;
                est.activo = false;
                if (est.timer) { clearInterval(est.timer); est.timer = null; }
                setIsPlayingExercise(false);
                setPasoSonando(null);
            };

            useEffect(() => { if (appView !== "exercise") stopExercise(); }, [appView]);
            useEffect(() => () => stopExercise(), []);

            const playExercise = () => {
                if (exercisePlaybackRef.current.activo) return;

                const porNota = Song.noteSeconds(exercise.bpm, exercise.subdivision);
                const eventos = [];
                let t = 0;

                exercise.pasos.forEach(paso => {
                    const instrumento = getInstrument(paso.instrument);
                    const afinacion = paso.tuningMidi && paso.tuningMidi.length === instrumento.strings
                        ? paso.tuningMidi
                        : Array.from({ length: instrumento.strings }, (_, i) =>
                            window.KharoTheory.getStringBaseMIDI(paso.tuning, i, paso.instrument));

                    for (let v = 0; v < Math.max(1, paso.repeticiones || 1); v++) {
                        paso.path.forEach(pos => {
                            const abs = pos.f === 0 ? 0 : paso.startingFret + pos.f - 1;
                            eventos.push({ at: t, midi: afinacion[pos.s] + abs, pasoId: paso.id });
                            t += porNota;
                        });
                    }
                });

                if (eventos.length === 0) {
                    showToast("Este ejercicio todavía no tiene pasos");
                    return;
                }

                synthInstance.init();
                const ctx = synthInstance.ctx;
                const est = exercisePlaybackRef.current;
                est.activo = true;
                est.siguiente = 0;
                est.pasoActual = null;
                est.inicio = ctx.currentTime + 0.12;
                const duracionTotal = t;

                setIsPlayingExercise(true);
                const HORIZONTE = 0.25;

                const tick = () => {
                    if (!est.activo) return;
                    const ahora = ctx.currentTime;

                    while (est.siguiente < eventos.length) {
                        const ev = eventos[est.siguiente];
                        const cuando = est.inicio + ev.at;
                        if (cuando > ahora + HORIZONTE) break;
                        // Notas cortas y encadenadas: un ejercicio a semicorcheas
                        // con notas de un segundo sería una nube.
                        synthInstance.playNote(ev.midi, Math.max(0.25, porNota * 1.6), Math.max(0, cuando - ahora));
                        est.siguiente++;
                    }

                    const transcurrido = ahora - est.inicio;
                    const enCurso = eventos.find(e => transcurrido >= e.at && transcurrido < e.at + porNota);
                    const id = enCurso ? enCurso.pasoId : null;
                    if (id !== est.pasoActual) { est.pasoActual = id; setPasoSonando(id); }

                    if (transcurrido >= duracionTotal) {
                        if (exercise.loop) { est.inicio += duracionTotal; est.siguiente = 0; }
                        else stopExercise();
                    }
                };

                est.timer = setInterval(tick, 25);
                tick();
            };

            /* --- EL GESTOR ---------------------------------------------------
             *
             * «Nueva» era DESTRUCTIVA: reemplazaba lo que hubiera, con un aviso
             * de que no había vuelta atrás. Y sólo avisaba si había compases o
             * letra, así que cambiar tonalidad, tempo y título y pulsar Nueva
             * borraba todo eso sin preguntar.
             *
             * Ahora crear es crear. Lo que borra lo dice, y lo dice antes.
             * ---------------------------------------------------------------- */

            /* Mandar un acorde a una canción y sección concretas. Con una sola
             * canción, «Añadir» a la sección activa era todo lo que hacía falta.
             * Con varias hay que poder decir a cuál va, y el momento de decirlo
             * es cuando lo mandas: es cuando se sabe. */
            const mandarAcordeA = (chord, idCancion, idSeccion) => {
                const anadir = (s) => ({
                    ...s,
                    sections: s.sections.map(sec => sec.id === idSeccion
                        ? { ...sec, bars: [...sec.bars, { chordId: chord.id, beats: Song.beatsPerBar(s.timeSignature) }] }
                        : sec)
                });

                if (idCancion === song.id) {
                    setSong(prev => anadir(prev));
                } else {
                    setSongs(prev => {
                        const lista = fundirEnLista(prev, song).map(s => s.id === idCancion ? anadir(s) : s);
                        Song.saveSongs(lista);
                        return lista;
                    });
                }

                const destino = fundirEnLista(songs, song).find(s => s.id === idCancion);
                const sec = destino && destino.sections.find(x => x.id === idSeccion);
                showToast(`«${chord.name}» → ${destino ? destino.title : "canción"}${sec ? " › " + sec.name : ""}`);
            };

            const abrirCancion = (id) => {
                const lista = fundirEnLista(songs, song);
                const destino = lista.find(x => x.id === id);
                if (!destino || destino.id === song.id) return;
                setSongs(lista);
                setSong(destino);
                setActiveSectionId(destino.sections.length ? destino.sections[0].id : null);
                stopSong();
                showToast(`«${destino.title}» abierta`);
            };

            const nuevaCancion = () => {
                const nueva = Song.createSong();
                setSongs(prev => [...fundirEnLista(prev, song), nueva]);
                setSong(nueva);
                setActiveSectionId(nueva.sections[0].id);
                stopSong();
                showToast("Canción nueva");
            };

            const duplicarCancion = (id) => {
                const lista = fundirEnLista(songs, song);
                const original = lista.find(x => x.id === id);
                if (!original) return;
                /* Copia profunda por JSON: una canción es datos puros —sin
                 * funciones ni fechas— y una copia superficial dejaría las
                 * secciones compartidas entre las dos, así que editar una
                 * cambiaría la otra. */
                const copia = Song.normalizeSong(JSON.parse(JSON.stringify(original)));
                copia.id = `song-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`;
                copia.title = `${original.title} (copia)`;
                setSongs([...lista, copia]);
                setSong(copia);
                setActiveSectionId(copia.sections.length ? copia.sections[0].id : null);
                showToast(`«${copia.title}» creada`);
            };

            const borrarCancion = (id) => {
                const lista = fundirEnLista(songs, song);
                const victima = lista.find(x => x.id === id);
                if (!victima) return;
                if (!window.confirm(
                    `Se borra «${victima.title}» y no hay vuelta atrás.\n\n` +
                    "Los acordes de la biblioteca se quedan: son de todas las canciones."
                )) return;

                const quedan = lista.filter(x => x.id !== id);
                // Nunca cero canciones: sin ninguna, el editor no tendría qué
                // pintar y habría que inventarse una al vuelo en mitad del render.
                const finales = quedan.length ? quedan : [Song.createSong()];
                setSongs(finales);
                Song.saveSongs(finales);
                if (id === song.id) {
                    setSong(finales[0]);
                    setActiveSectionId(finales[0].sections.length ? finales[0].sections[0].id : null);
                    stopSong();
                }
                showToast(`«${victima.title}» borrada`);
            };

            const borrarTodasLasCanciones = () => {
                const lista = fundirEnLista(songs, song);
                if (!window.confirm(
                    `Se borran las ${lista.length} canciones guardadas y no hay vuelta atrás.\n\n` +
                    "Los acordes de la biblioteca no se tocan. Si quieres conservar alguna,\n" +
                    "cancela y descárgala antes con el botón ⇩."
                )) return;
                const nueva = Song.createSong();
                setSongs([nueva]);
                Song.saveSongs([nueva]);
                setSong(nueva);
                setActiveSectionId(nueva.sections[0].id);
                stopSong();
                showToast("Canciones borradas");
            };

            const abrirEjercicio = (id) => {
                const lista = fundirEnLista(exercises, exercise);
                const destino = lista.find(x => x.id === id);
                if (!destino || destino.id === exercise.id) return;
                setExercises(lista);
                setExercise(destino);
                stopExercise();
                showToast(`«${destino.title}» abierto`);
            };

            const nuevoEjercicio = () => {
                const nuevo = Song.createExercise();
                setExercises(prev => [...fundirEnLista(prev, exercise), nuevo]);
                setExercise(nuevo);
                stopExercise();
                showToast("Ejercicio nuevo");
            };

            const duplicarEjercicio = (id) => {
                const lista = fundirEnLista(exercises, exercise);
                const original = lista.find(x => x.id === id);
                if (!original) return;
                const copia = Song.normalizeExercise(JSON.parse(JSON.stringify(original)));
                copia.id = `ex-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`;
                copia.title = `${original.title} (copia)`;
                setExercises([...lista, copia]);
                setExercise(copia);
                showToast(`«${copia.title}» creado`);
            };
