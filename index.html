                            key={i}
                            x={marca.col * HOJA.monoAncho}
                            y={0}
                            fontFamily={MONO_FAMILIA}
                            fontSize={HOJA.monoTamano}
                            fontWeight="700"
                            fill={marca.beyondLyric ? HOJA.tintaSuave : HOJA.acento}
                        >
                            {marca.name}
                        </text>
                    ))}
                    <text
                        x={0}
                        y={20}
                        fontFamily={MONO_FAMILIA}
                        fontSize={HOJA.monoTamano}
                        fill={HOJA.tinta}
                        xmlSpace="preserve"
                    >
                        {alineado.lyric}
                    </text>
                </g>
            );
        }

        /* La progresión de una sección: cada acorde con sus pulsos, y una
         * barra vertical donde se cierra el compás. Es la referencia que hace
         * legible una progresión sin tener que contar. */
        /* --- CÓMO SE REPARTEN LOS COMPASES EN FILAS -------------------------
         *
         * UNA función para las dos cosas que tienen que decir lo mismo: cuánto
         * alto ocupa el bloque —que lo pregunta la paginación ANTES de dibujar
         * nada— y dónde va cada celda. Separadas, la hoja se descuadra en
         * cuanto una de las dos cambie.
         *
         * Antes esto no existía: `SheetBars` hacía `return` en cuanto un compás
         * se pasaba del ancho útil, así que una progresión de doce compases se
         * imprimía con ocho y sin decirlo, que es la peor forma de estar mal
         * —la hoja parece correcta—. Y no era un `break` mal puesto que se
         * pudiera cambiar por otra cosa: el bloque tenía reservada UNA fila de
         * alto fijo y `paginateSong` ya había repartido las páginas contando
         * con eso. Hacía falta devolver el alto real a la paginación, igual que
         * hace el diccionario de acordes con `bloque.alto`.
         * -------------------------------------------------------------------- */
        const ALTO_FILA_COMPASES = 46;   // 38 de caja + 8 de respiro entre filas
        const RESPIRO_COMPASES = 12;     // lo que separa el bloque de lo que sigue

        function disponerCompases(section, song, ancho) {
            const pulsosPorCompas = Song.beatsPerBar(song.timeSignature);
            const filas = [];
            let fila = [];
            let cursor = 0;
            let acumulado = 0;

            (section.bars || []).forEach((bar, i) => {
                /* El ancho lo marca la duración: un acorde que dura el doble
                 * ocupa el doble, que es como se lee una progresión de un
                 * vistazo. Con tope en el ancho útil, para que un compás muy
                 * largo llene la fila en vez de salirse de la página. */
                const anchoCelda = Math.min(Math.max(52, bar.beats * 22), ancho);

                // No cabe: baja a la fila siguiente en vez de desaparecer.
                if (cursor + anchoCelda > ancho && fila.length > 0) {
                    filas.push(fila);
                    fila = [];
                    cursor = 0;
                }

                acumulado += bar.beats;
                fila.push({
                    i, bar, cursor, anchoCelda,
                    cierraCompas: acumulado % pulsosPorCompas === 0
                });
                cursor += anchoCelda;
            });

            if (fila.length > 0) filas.push(fila);

            // Con una sola fila da 58, que es lo que valía `HOJA.altoCompases`:
            // una progresión corta se pagina exactamente igual que antes.
            return { filas, alto: filas.length * ALTO_FILA_COMPASES + RESPIRO_COMPASES };
        }

        function SheetBars({ section, song, chordsById, x, y, ancho }) {
            const { filas } = disponerCompases(section, song, ancho);
            const piezas = [];

            filas.forEach((fila, f) => {
                const yFila = f * ALTO_FILA_COMPASES;

                fila.forEach(celda => {
                    const chord = chordsById[celda.bar.chordId];
                    const nombre = chord ? chord.name : "?";

                    piezas.push(
                        <g key={celda.i} transform={`translate(${celda.cursor}, ${yFila})`}>
                            <rect
                                x={0} y={0}
                                width={celda.anchoCelda - 6} height={38}
                                rx={5}
                                fill="none"
                                stroke={HOJA.linea}
                                strokeWidth="1.2"
                            />
                            <text
                                x={(celda.anchoCelda - 6) / 2} y={22}
                                textAnchor="middle"
                                fontFamily={SANS_FAMILIA}
                                fontSize="17"
                                fontWeight="800"
                                fill={HOJA.tinta}
                            >
                                {nombre}
                            </text>
                            <text
                                x={celda.anchoCelda - 12} y={33}
                                textAnchor="end"
                                fontFamily={MONO_FAMILIA}
                                fontSize="10"
                                fill={HOJA.tintaSuave}
                            >
                                {celda.bar.beats}
                            </text>
                        </g>
                    );

                    if (celda.cierraCompas) {
                        const xSep = celda.cursor + celda.anchoCelda - 3;
                        piezas.push(
                            <line
                                key={`sep-${celda.i}`}
                                x1={xSep} y1={yFila + 2}
                                x2={xSep} y2={yFila + 36}
                                stroke={HOJA.tinta}
                                strokeWidth="1.5"
                            />
                        );
                    }
                });
            });

            return <g transform={`translate(${x}, ${y})`}>{piezas}</g>;
        }

        /* La página de teoría: qué notas tiene la tonalidad y qué acordes
         * salen de ella. Sólo se puede dibujar si la tonalidad está ELEGIDA;
         * en modo libre no hay de dónde sacarla. */
        /* --- EL MÁSTIL ENTERO, EN HORIZONTAL -------------------------------
         *
         * Del traste 0 al 24, con todas las notas de la tonalidad. Es la única
         * vista del proyecto que no es vertical, y lo es a propósito: en una
         * hoja A4 apaisar el mástil es lo que permite meter veinticuatro
         * trastes sin que quepan cuatro.
         *
         * Tinta fija de `HOJA`, como todo lo que se imprime: es obra.
         *
         * La afinación sale del primer acorde de la canción, porque la canción
         * no guarda ninguna: los acordes sí, y son suyos. Sin acordes todavía,
         * guitarra estándar.
         * ------------------------------------------------------------------ */
        function SheetNeckMap({ keyRoot, intervalos, afinacion, x, y, ancho }) {
            const est = useDiagramStyle();
            const k = est.dotRadius / 10;
            const lw = Math.min(est.lineWidth / 1.5, 2.5);

            const TRASTES = 24;
            const cuerdas = afinacion.length;

            const anchoTraste = ancho / (TRASTES + 1);
            const altoCuerda = 19;
            const alto = (cuerdas - 1) * altoCuerda;

            // La cejuela cae tras la columna del 0, que es la cuerda al aire.
            const xTraste = (f) => x + (f + 1) * anchoTraste;
            const xNota = (f) => x + (f + 0.5) * anchoTraste;
            // La cuerda 0 es la más grave y se dibuja ABAJO, como en un mástil
            // apaisado visto de frente.
            const yCuerda = (s) => y + (cuerdas - 1 - s) * altoCuerda;

            const enLaEscala = (pc) => intervalos.some(iv => (keyRoot + iv) % 12 === pc);

            const puntos = [];
            for (let s = 0; s < cuerdas; s++) {
                const base = parseNoteToSemi(afinacion[s]);
                for (let f = 0; f <= TRASTES; f++) {
                    const pc = (base + f) % 12;
                    if (!enLaEscala(pc)) continue;
                    puntos.push({ s, f, pc, tonica: pc === keyRoot });
                }
            }

            return (
                <g>
                    {/* El fondo del mástil. Sin él, con un estilo de fondo
                        oscuro el mapa quedaría invisible sobre el papel blanco
                        de la hoja. El margen de la izquierda cubre los nombres
                        de cuerda, que se dibujan fuera de la rejilla. */}
                    <rect
                        x={x - 24} y={y - 10}
                        width={ancho + 32} height={alto + 28}
                        rx="6"
                        fill={est.backgroundColor}
                    />

                    {/* Cuerdas */}
                    {Array.from({ length: cuerdas }).map((_, s) => (
                        <line
                            key={`c-${s}`}
                            x1={x} y1={yCuerda(s)}
                            x2={x + ancho} y2={yCuerda(s)}
                            stroke={est.gridColor} strokeWidth={0.8 * lw}
                        />
                    ))}

                    {/* Trastes. El 0 lleva la cejuela, gruesa. */}
                    {Array.from({ length: TRASTES + 1 }).map((_, f) => (
                        <line
                            key={`t-${f}`}
                            x1={xTraste(f)} y1={y}
                            x2={xTraste(f)} y2={y + alto}
                            stroke={est.gridColor}
                            strokeWidth={(f === 0 ? 2.4 : 0.8) * lw}
                        />
                    ))}

                    {/* Los números de traste que un guitarrista busca con la vista */}
                    {[3, 5, 7, 9, 12, 15, 17, 19, 21, 24].map(f => (
                        <text
                            key={`n-${f}`}
                            x={xNota(f)} y={y + alto + 13}
                            textAnchor="middle"
                            fontFamily={est.fontFamily} fontSize="8"
                            fill={est.textColor}
                            opacity={f === 12 || f === 24 ? 1 : 0.65}
                            fontWeight={f === 12 || f === 24 ? "700" : "400"}
                        >
                            {f}
                        </text>
                    ))}

                    {/* Las cuerdas, por su nombre, a la izquierda */}
                    {afinacion.map((nota, s) => (
                        <text
                            key={`e-${s}`}
                            x={x - 6} y={yCuerda(s) + 3}
                            textAnchor="end"
                            fontFamily={est.fontFamily} fontSize="8" fontWeight="700"
                            fill={est.textColor} opacity="0.65"
                        >
                            {nota}
                        </text>
                    ))}

                    {puntos.map((p, i) => (
                        <g key={`p-${i}`}>
                            <circle
                                cx={xNota(p.f)} cy={yCuerda(p.s)}
                                /* Con tope, como en la miniatura: 24 trastes en
                                   744 px dan ~29 px de columna, y un punto más
                                   gordo que eso se come al vecino. */
                                r={Math.min(7.6 * k, anchoTraste * 0.46)}
                                fill={p.tonica ? est.intervalColors["1"] : est.backgroundColor}
                                stroke={p.tonica ? est.intervalColors["1"] : est.gridColor}
                                strokeWidth={1 * lw}
                            />
                            <text
                                x={xNota(p.f)} y={yCuerda(p.s) + 2.6}
                                textAnchor="middle"
                                fontFamily={est.fontFamily} fontSize="6.4" fontWeight="700"
                                fill={p.tonica ? est.dotTextColor : est.textColor}
                            >
                                {NOTE_NAMES[p.pc]}
                            </text>
                        </g>
                    ))}
                </g>
            );
        }

        function SheetTheoryPage({ song, indice, total, chordLibrary }) {
            const escala = SCALE_PRESETS.find(e => e.id === song.keyScale) || SCALE_PRESETS[0];
            const notas = window.KharoTheory.scaleNotes(song.keyRoot, escala.intervals);
            const grados = window.KharoTheory.diatonicChords(song.keyRoot, escala.intervals);
            const nombreTonalidad = NOTE_NAMES[song.keyRoot] + " " + escala.name;

            /* Los acordes que ESTA canción usa. Se calculan antes que nada
             * porque de ellos salen las dos cosas de abajo. */
            const usados = [];
            (song.sections || []).forEach(sec => (sec.bars || []).forEach(b => {
                if (usados.indexOf(b.chordId) === -1) usados.push(b.chordId);
            }));
            const acordesDeLaCancion = usados
                .map(id => (chordLibrary || []).find(c => c.id === id))
                .filter(Boolean);

            /* La afinación sale de los acordes de la canción, no del primero de
             * la biblioteca: con un acorde de ukelele guardado el primero, el
             * mástil horizontal de una canción de guitarra salía con cuatro
             * cuerdas. La biblioteca queda de recurso para una canción que
             * todavía no usa ninguno. */
            const conAfinacion =
                acordesDeLaCancion.find(c => Array.isArray(c.tuning) && c.tuning.length > 0)
                || (chordLibrary || []).find(c => Array.isArray(c.tuning) && c.tuning.length > 0);
            const afinacion = conAfinacion ? conAfinacion.tuning : ["E", "A", "D", "G", "B", "E"];

            /* Los acordes de la canción que NO son de la tonalidad, con la
             * lectura que les hayas puesto. Es la mitad de la explicación: los
             * grados dicen de qué está hecha la tonalidad, y esto dice qué hay
             * en la canción que no sale de ella. */
            const deFuera = acordesDeLaCancion
                .map(chord => {
                    const info = window.KharoTheory.identifyChordFromVoicing(chord);
                    if (!info || !info.intervals) return null;
                    const a = window.KharoTheory.analyzeChordInKey(info.rootSemi, info.intervals, song.keyRoot, escala.intervals);
                    if (a.diatonico !== false) return null;
                    const puesto = (song.harmony || {})[chord.id];
                    return {
                        nombre: chord.name,
                        lectura: (puesto && puesto.funcion)
                            || (a.sugerencias[0] ? a.sugerencias[0].etiqueta : "fuera de la tonalidad"),
                        nota: (puesto && puesto.nota) || "",
                        fuera: a.notasDeFuera.join(" ")
                    };
                })
                .filter(Boolean);

            return (
                <svg
                    id={`song-sheet-page-${indice}`}
                    data-song-sheet="1"
                    width={HOJA.ancho}
                    height={HOJA.alto}
                    viewBox={`0 0 ${HOJA.ancho} ${HOJA.alto}`}
                    class="k-sheet-page"
                >
                    <rect width={HOJA.ancho} height={HOJA.alto} fill={HOJA.papel} />

                    <text x={HOJA.margenX} y={80} fontFamily={SANS_FAMILIA} fontSize="13" fontWeight="700" fill={HOJA.tintaSuave}>
                        {song.title || "Sin título"}
                    </text>
                    <rect x={HOJA.margenX} y={92} width={HOJA.ancho - HOJA.margenX * 2} height={1} fill={HOJA.linea} />

                    <text x={HOJA.margenX} y={140} fontFamily={SANS_FAMILIA} fontSize="26" fontWeight="800" fill={HOJA.tinta}>
                        {nombreTonalidad}
                    </text>

                    {/* Las notas de la tonalidad */}
                    <text x={HOJA.margenX} y={182} fontFamily={SANS_FAMILIA} fontSize="11" fontWeight="700" letterSpacing="1" fill={HOJA.tintaSuave}>
                        NOTAS
                    </text>
                    {notas.map((nota, i) => (
                        <g key={i} transform={`translate(${HOJA.margenX + i * 62}, 196)`}>
                            <rect width="52" height="40" rx="5" fill="none" stroke={HOJA.linea} strokeWidth="1.2" />
                            <text x="26" y="20" textAnchor="middle" fontFamily={SANS_FAMILIA} fontSize="17" fontWeight="800" fill={HOJA.tinta}>{nota}</text>
                            <text x="26" y="33" textAnchor="middle" fontFamily={MONO_FAMILIA} fontSize="9" fill={HOJA.tintaSuave}>{i + 1}</text>
                        </g>
                    ))}

                    {/* Los grados, con su séptima y su FUNCIÓN */}
                    <text x={HOJA.margenX} y={286} fontFamily={SANS_FAMILIA} fontSize="11" fontWeight="700" letterSpacing="1" fill={HOJA.tintaSuave}>
                        GRADOS, CON SU SÉPTIMA Y SU FUNCIÓN
                    </text>
                    {grados.map((g, i) => (
                        <g key={i} transform={`translate(${HOJA.margenX}, ${302 + i * 50})`}>
                            <rect width={HOJA.ancho - HOJA.margenX * 2} height="44" rx="5" fill="none" stroke={HOJA.linea} strokeWidth="1" />
                            <text x="16" y="27" fontFamily={SANS_FAMILIA} fontSize="16" fontWeight="800" fill={HOJA.acento}>{g.romano}</text>
                            <text x="66" y="27" fontFamily={SANS_FAMILIA} fontSize="16" fontWeight="800" fill={HOJA.tinta}>{g.septima}</text>
                            <text x="176" y="20" fontFamily={SANS_FAMILIA} fontSize="11" fill={HOJA.tintaSuave}>{g.triada}</text>
                            <text x="176" y="34" fontFamily={MONO_FAMILIA} fontSize="10" fill={HOJA.tintaSuave}>{g.notas.join("  ")}</text>

                            {/* La función: qué papel cumple. Es lo que convierte
                                una lista de acordes en una explicación. */}
                            <text x="316" y="20" fontFamily={SANS_FAMILIA} fontSize="11" fontWeight="700" fill={HOJA.tinta}>
                                {g.funcion.familia}
                            </text>
                            <text x="316" y="34" fontFamily={SANS_FAMILIA} fontSize="9.5" fill={HOJA.tintaSuave}>
                                {g.funcion.nombre}
                            </text>

                            {/* Los suspendidos, con su función también: un sus
                                cambia la tercera, no el sitio donde vive. */}
                            <text x={HOJA.ancho - HOJA.margenX * 2 - 16} y="20" textAnchor="end" fontFamily={SANS_FAMILIA} fontSize="10.5" fill={HOJA.tinta}>
                                {g.sus.filter(x => x.diatonico).map(x => x.nombre).join("   ") || "sin suspendidos en la tonalidad"}
                            </text>
                            <text x={HOJA.ancho - HOJA.margenX * 2 - 16} y="34" textAnchor="end" fontFamily={SANS_FAMILIA} fontSize="9" fill={HOJA.tintaSuave}>
                                {g.sus.some(x => x.diatonico) ? `mismo sitio: ${g.funcion.familia.toLowerCase()}` : ""}
                            </text>
                        </g>
                    ))}

                    <text x={HOJA.margenX} y={676} fontFamily={SANS_FAMILIA} fontSize="9" fontStyle="italic" fill={HOJA.tintaSuave}>
                        Los suspendidos de la derecha son los que sólo usan notas de la tonalidad. La función va por el
                        sitio que ocupa el grado, no por si el acorde es mayor o menor.
                    </text>

                    {/* El mástil entero */}
                    <text x={HOJA.margenX} y={716} fontFamily={SANS_FAMILIA} fontSize="11" fontWeight="700" letterSpacing="1" fill={HOJA.tintaSuave}>
                        LA TONALIDAD EN TODO EL MÁSTIL
                    </text>
                    <SheetNeckMap
                        keyRoot={song.keyRoot}
                        intervalos={escala.intervals}
                        afinacion={afinacion}
                        x={HOJA.margenX + 16}
                        y={736}
                        ancho={HOJA.ancho - HOJA.margenX * 2 - 16}
                    />

                    {/* Los acordes que vienen de fuera */}
                    {deFuera.length > 0 && (
                        <g>
                            <text x={HOJA.margenX} y={900} fontFamily={SANS_FAMILIA} fontSize="11" fontWeight="700" letterSpacing="1" fill={HOJA.tintaSuave}>
                                ACORDES DE FUERA DE LA TONALIDAD
                            </text>
                            {deFuera.slice(0, 6).map((c, i) => (
                                <g key={i} transform={`translate(${HOJA.margenX}, ${914 + i * 38})`}>
                                    <rect width={HOJA.ancho - HOJA.margenX * 2} height="32" rx="5" fill="none" stroke={HOJA.linea} strokeWidth="1" />
                                    <text x="16" y="21" fontFamily={SANS_FAMILIA} fontSize="14" fontWeight="800" fill={HOJA.tinta}>{c.nombre}</text>
                                    <text x="130" y="21" fontFamily={SANS_FAMILIA} fontSize="12" fontWeight="700" fill={HOJA.acento}>{c.lectura}</text>
                                    <text x="300" y="21" fontFamily={SANS_FAMILIA} fontSize="10" fill={HOJA.tintaSuave}>
                                        {c.nota || (c.fuera ? `notas de fuera: ${c.fuera}` : "")}
                                    </text>
                                </g>
                            ))}
                        </g>
                    )}

                    <text x={HOJA.ancho / 2} y={HOJA.alto - 28} textAnchor="middle" fontFamily={SANS_FAMILIA} fontSize="10" fill={HOJA.tintaSuave}>
                        {indice + 1} / {total}   ·   Kharo Studio
                    </text>
                </svg>
            );
        }

        function SongSheet({ song, chordLibrary }) {
            const chordsById = {};
            chordLibrary.forEach(c => { chordsById[c.id] = c; });

            // El diccionario sólo trae los acordes que la canción usa de
            // verdad, no la biblioteca entera.
            const usados = [];
            song.sections.forEach(s => s.bars.forEach(b => {
                if (chordsById[b.chordId] && usados.indexOf(b.chordId) === -1) usados.push(b.chordId);
            }));

            const anchoUtil = HOJA.ancho - HOJA.margenX * 2;
            /* Los acordes del diccionario son el diagrama del Taller en
             * pequeño. Todos van a la misma escala, y la fila mide lo que el
             * más alto (el que tiene más trastes). */
            const est = useDiagramStyle();
            const anchoMini = 128;
            const escenasDiccionario = {};
            usados.forEach(id => {
                const c = chordsById[id];
                escenasDiccionario[id] = escenaDeAcorde(c, song.chordLabels, baseDeGradosDe(c, song));
            });
            const altoMini = usados.reduce((m, id) => {
                const medida = medidaDeEscena(escenasDiccionario[id], est);
                return Math.max(m, Math.round(anchoMini * medida.alto / medida.ancho));
            }, 0);
            const porFila = Math.floor(anchoUtil / (anchoMini + 12));
            const filasDiccionario = usados.length > 0 ? Math.ceil(usados.length / porFila) : 0;
            const altoDiccionario = filasDiccionario * (altoMini + 14) + (filasDiccionario ? 24 : 0);

            const paginas = Song.paginateSong(
                song,
                {
                    pageHeight: HOJA.alto,
                    marginTop: HOJA.margenSuperior,
                    marginBottom: HOJA.margenInferior,
                    sectionHeader: HOJA.altoSeccion,
                    /* Como FUNCIÓN: el alto de la progresión depende de cuántas
                     * filas necesite, y sólo quien la dispone lo sabe. */
                    barsRow: (section) => disponerCompases(section, song, anchoUtil).alto,
                    lyricBlock: HOJA.altoVerso,
                    notesLine: HOJA.altoNota,
                    sectionGap: HOJA.separacionSeccion
                },
                usados.length > 0
                    ? [{ tipo: "diccionario", ids: usados, alto: altoDiccionario }]
                    : []
            );

            // La hoja de teoría, si está activada y la tonalidad está elegida,
            // va después de las páginas de la canción.
            const conTeoria = song.showTheorySheet && song.keyRoot !== null;
            const totalPaginas = paginas.length + (conTeoria ? 1 : 0);

            return (
                <div class="space-y-4">
                    {paginas.map((pagina, indicePagina) => {
                        let y = HOJA.margenSuperior;

                        const contenido = pagina.bloques.map((bloque, i) => {
                            const yBloque = y;

                            if (bloque.tipo === "diccionario") {
                                y += bloque.alto;
                                return (
                                    <g key={i}>
                                        <text
                                            x={HOJA.margenX} y={yBloque}
                                            fontFamily={SANS_FAMILIA}
                                            fontSize="11"
                                            fontWeight="700"
                                            letterSpacing="1"
                                            fill={HOJA.tintaSuave}
                                        >
                                            ACORDES
                                        </text>
                                        {bloque.ids.map((id, k) => {
                                            const fila = Math.floor(k / porFila);
                                            const columna = k % porFila;
                                            return (
                                                <g
                                                    key={id}
                                                    transform={`translate(${HOJA.margenX + columna * (anchoMini + 12)}, ${yBloque + 14 + fila * (altoMini + 14)})`}
                                                >
                                                    <DiagramaKharo
                                                        escena={escenasDiccionario[id]}
                                                        ancho={anchoMini}
                                                        alto={altoMini}
                                                    />
                                                </g>
                                            );
                                        })}
                                    </g>
                                );
                            }

                            if (bloque.tipo === "seccion") {
                                const s = bloque.section;
                                /* Con `song.customRhythms`. `getRhythm` busca primero
                                   entre los patrones propios, pero SÓLO si se los pasan;
                                   sin ellos no encontraba el id y caía al de fábrica, así
                                   que la canción sonaba con tu rasgueo y la hoja decía
                                   «Negras». Era el único sitio del proyecto donde se
                                   llamaba con un solo argumento. */
                                const ritmo = Song.getRhythm(s.rhythmId || song.rhythmId, song.customRhythms);
                                const detalle = [
                                    s.repeats > 1 ? `×${s.repeats}` : null,
                                    ritmo.name,
                                    s.bpm ? `${s.bpm} bpm` : null
                                ].filter(Boolean).join("  ·  ");

                                y += HOJA.altoSeccion;
                                return (
                                    <g key={i}>
                                        <rect
                                            x={HOJA.margenX} y={yBloque - 13}
                                            width={Math.max(64, s.name.length * 8 + 18)} height={20}
                                            rx={4}
                                            fill={HOJA.tinta}
                                        />
                                        <text
                                            x={HOJA.margenX + 9} y={yBloque + 1}
                                            fontFamily={SANS_FAMILIA}
                                            fontSize="11"
                                            fontWeight="700"
                                            letterSpacing="0.5"
                                            fill={HOJA.papel}
                                        >
                                            {s.name.toUpperCase()}
                                        </text>
                                        <text
                                            x={HOJA.margenX + Math.max(64, s.name.length * 8 + 18) + 12} y={yBloque + 1}
                                            fontFamily={SANS_FAMILIA}
                                            fontSize="10"
                                            fill={HOJA.tintaSuave}
                                        >
                                            {detalle}
                                        </text>
                                    </g>
                                );
                            }

                            if (bloque.tipo === "compases") {
                                // El alto real, el mismo que se le dio a la paginación.
                                y += bloque.alto || HOJA.altoCompases;
                                return (
                                    <SheetBars
                                        key={i}
                                        section={bloque.section}
                                        song={song}
                                        chordsById={chordsById}
                                        x={HOJA.margenX}
                                        y={yBloque}
                                        ancho={anchoUtil}
                                    />
                                );
                            }

                            if (bloque.tipo === "letra") {
                                y += HOJA.altoVerso;
                                return (
                                    <SheetLyricBlock
                                        key={i}
                                        line={bloque.line}
                                        x={HOJA.margenX}
                                        y={yBloque + 14}
                                    />
                                );
                            }

                            if (bloque.tipo === "nota") {
                                y += HOJA.altoNota;
                                return (
                                    <text
                                        key={i}
                                        x={HOJA.margenX} y={yBloque + 8}
                                        fontFamily={SANS_FAMILIA}
                                        fontSize="11"
                                        fontStyle="italic"
                                        fill={HOJA.tintaSuave}
                                    >
                                        {bloque.section.notes}
                                    </text>
                                );
                            }

                            return null;
                        });

                        return (
                            <svg
                                key={indicePagina}
                                id={`song-sheet-page-${indicePagina}`}
                                data-song-sheet="1"
                                width={HOJA.ancho}
                                height={HOJA.alto}
                                viewBox={`0 0 ${HOJA.ancho} ${HOJA.alto}`}
                                class="k-sheet-page"
                            >
                                <rect width={HOJA.ancho} height={HOJA.alto} fill={HOJA.papel} />

                                {/* Cabecera: completa en la portada, discreta en el resto */}
                                {indicePagina === 0 ? (
                                    <g>
                                        <text
                                            x={HOJA.ancho / 2} y={78}
                                            textAnchor="middle"
                                            fontFamily={SANS_FAMILIA}
                                            fontSize="40"
                                            fontWeight="800"
                                            fill={HOJA.tinta}
                                        >
                                            {song.title || "Sin título"}
                                        </text>
                                        <text
                                            x={HOJA.margenX} y={110}
                                            fontFamily={SANS_FAMILIA}
                                            fontSize="12"
                                            fill={HOJA.tintaSuave}
                                        >
                                            {[
                                                song.key ? `Tonalidad: ${song.key}` : null,
                                                `${song.bpm} bpm`,
                                                song.timeSignature,
                                                Song.formatDuration(Song.songSeconds(song))
                                            ].filter(Boolean).join("   ·   ")}
                                        </text>
                                        {song.notes && (
                                            <text
                                                x={HOJA.ancho - HOJA.margenX} y={110}
                                                textAnchor="end"
                                                fontFamily={SANS_FAMILIA}
                                                fontSize="11"
                                                fontStyle="italic"
                                                fill={HOJA.tintaSuave}
                                            >
                                                {song.notes}
                                            </text>
                                        )}
                                        <rect
                                            x={HOJA.margenX} y={122}
                                            width={anchoUtil} height={2}
                                            fill={HOJA.tinta}
                                        />
                                    </g>
                                ) : (
                                    <g>
                                        <text
                                            x={HOJA.margenX} y={80}
                                            fontFamily={SANS_FAMILIA}
                                            fontSize="13"
                                            fontWeight="700"
                                            fill={HOJA.tintaSuave}
                                        >
                                            {song.title || "Sin título"}
                                        </text>
                                        <rect
                                            x={HOJA.margenX} y={92}
                                            width={anchoUtil} height={1}
                                            fill={HOJA.linea}
                                        />
                                    </g>
                                )}

                                {contenido}

                                <text
                                    x={HOJA.ancho / 2} y={HOJA.alto - 28}
                                    textAnchor="middle"
                                    fontFamily={SANS_FAMILIA}
                                    fontSize="10"
                                    fill={HOJA.tintaSuave}
                                >
                                    {indicePagina + 1} / {totalPaginas}   ·   Kharo Studio
                                </text>
                            </svg>
                        );
                    })}

                    {conTeoria && (
                        <SheetTheoryPage song={song} indice={paginas.length} total={totalPaginas} chordLibrary={chordLibrary} />
                    )}
                </div>
            );
        }

        /* ==================================================================
         * EL APARTADO CANCIÓN
         * ==================================================================
         * Monta la canción entera: cabecera, biblioteca de acordes, secciones
         * y reproducción. Las funciones que tocan el modelo viven aquí y no en
         * App() para que el estudio de diagramas y la canción compartan sólo lo
         * imprescindible.
         * ================================================================== */
        function SongEditor({
            song, setSong,
            chordLibrary, onRemoveChord, onRenameChord, onAuditionChord,
            activeSectionId, setActiveSectionId,
            playhead, isPlaying, onPlay, onStop, isLooping, setIsLooping,
            onExport, onImport, onNuevaCancion,
            songs, onAbrirCancion, onDuplicarCancion, onBorrarCancion, onBorrarTodasLasCanciones,
            onBorrarTodosLosAcordes, onMandarAcordeA,
            onPreviewRhythm, onStopPreview, previewSonando, onAviso, onElegirDestino, onBiblioteca
        }) {
            const [chordParaInsertar, setChordParaInsertar] = useState(null);
            const [gestorAbierto, setGestorAbierto] = useState(false);
            const [menuSeccion, setMenuSeccion] = useState(null);


            /* Abrir el editor de rasgueo. Si el ritmo elegido es de fábrica no
             * se toca —son la referencia—: se crea uno propio y se selecciona,
             * que es lo que la persona quería al pulsar «editar». */
            const editarRitmo = () => {
                // El de fábrica no se toca: se escribe uno propio y se activa.
                // Si el activo ya es tuyo, la rejilla está delante y no hay nada
                // que abrir.
                if ((song.customRhythms || []).some(r => r.id === song.rhythmId)) return;

                const nuevo = Song.createStrumPattern("Mi rasgueo", Song.beatsPerBar(song.timeSignature));
                setSong(prev => ({
                    ...prev,
                    customRhythms: [...(prev.customRhythms || []), nuevo],
                    rhythmId: nuevo.id
                }));
            };

            const actualizarRitmo = (patron) => {
                setSong(prev => ({
                    ...prev,
                    customRhythms: (prev.customRhythms || []).map(r => r.id === patron.id ? patron : r)
                }));
            };

            const borrarRitmo = (id) => {
                setSong(prev => ({
                    ...prev,
                    customRhythms: (prev.customRhythms || []).filter(r => r.id !== id),
                    // Si el que se borra era el activo, se vuelve al de fábrica.
                    rhythmId: prev.rhythmId === id ? Song.DEFAULT_RHYTHM : prev.rhythmId,
                    sections: prev.sections.map(sec => sec.rhythmId === id ? { ...sec, rhythmId: null } : sec)
                }));
            };

            /* El rasgueo propio que está SONANDO, no uno que hayas abierto.
             *
             * Antes vivía tras un estado aparte (`ritmoEnEdicion`) y sólo
             * aparecía al pulsar el lápiz, así que estaba escondido detrás de un
             * icono: la parte más trabajosa de la canción era la que no se veía.
             * Si el ritmo activo es tuyo, se edita; si es de fábrica, se ofrece
             * escribir el tuyo. No hace falta abrir ni cerrar nada. */
            const patronEnEdicion = (song.customRhythms || []).find(r => r.id === song.rhythmId);

            /* Guardar cómo se lee un acorde de fuera. Va indexado por acorde y
             * no por compás: el mismo acorde puede estar en ocho compases y la
             * lectura es la misma en los ocho. (Un acorde pivote puede cumplir
             * dos funciones distintas en dos sitios de la canción; eso hoy no se
             * puede decir, y está apuntado como deuda.) */
            const ponerLecturaArmonica = (chordId, lectura) => {
                setSong(prev => ({
                    ...prev,
                    harmony: { ...(prev.harmony || {}), [chordId]: lectura }
                }));
            };

            // El ritmo activo, para poder decir cuál es sin repetir el
            // desplegable en la cabecera.
            const ritmoDeLaCancion = Song.RHYTHM_PATTERNS.concat(song.customRhythms || [])
                .find(r => r.id === song.rhythmId) || null;

            const chordsById = {};
            chordLibrary.forEach(c => { chordsById[c.id] = c; });

            const seccionActiva = song.sections.find(s => s.id === activeSectionId) || song.sections[0];

            const actualizarSeccion = (id, parche) => {
                setSong(prev => ({
                    ...prev,
                    sections: prev.sections.map(s => s.id === id ? { ...s, ...parche } : s)
                }));
            };

            const anadirSeccion = () => {
                const nueva = Song.createSection("Parte " + (song.sections.length + 1));
                setSong(prev => ({ ...prev, sections: [...prev.sections, nueva] }));
                setActiveSectionId(nueva.id);
            };

            /* Duplicar una sección. Un segundo estribillo con un cambio de
             * dos compases es la mitad de las canciones, y rehacerlo entero era
             * la única forma de tenerlo. */
            const duplicarSeccion = (id) => {
                setSong(prev => {
                    const i = prev.sections.findIndex(s => s.id === id);
                    if (i === -1) return prev;
                    /* Copia profunda por JSON: una sección son datos puros, y
                     * una copia superficial dejaría los compases y las líneas
                     * compartidos entre las dos. */
                    const copia = JSON.parse(JSON.stringify(prev.sections[i]));
                    copia.id = `sec-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`;
                    copia.name = `${prev.sections[i].name} (copia)`;
                    const sections = prev.sections.slice();
                    sections.splice(i + 1, 0, copia);
                    setActiveSectionId(copia.id);
                    return { ...prev, sections };
                });
            };

            const borrarSeccion = (id) => {
                setSong(prev => {
                    const quedan = prev.sections.filter(s => s.id !== id);
                    // Una canción sin secciones no es un estado en el que se
                    // pueda seguir trabajando: siempre queda una.
                    const sections = quedan.length ? quedan : [Song.createSection("Intro")];
                    setActiveSectionId(sections[0].id);
                    return { ...prev, sections };
                });
            };

            // Añadir un acorde de la biblioteca a la sección activa, con la
            // duración de un compás completo, que es lo más habitual.
            const anadirAcordeALaSeccion = (chord) => {
                if (!seccionActiva) return;
                const id = seccionActiva.id;
                // Se parte del estado ANTERIOR, no del que capturó este render:
                // añadiendo cuatro acordes a toques rápidos, dos clics dentro del
                // mismo ciclo partirían de la misma lista y uno se perdería. Es
                // la misma razón por la que FretStepper recibe el incremento.
                setSong(prev => ({
                    ...prev,
                    sections: prev.sections.map(s => s.id === id
                        ? { ...s, bars: [...s.bars, { chordId: chord.id, beats: Song.beatsPerBar(prev.timeSignature) }] }
                        : s)
                }));
            };

            const duracion = Song.formatDuration(Song.songSeconds(song));
            const totalAcordes = song.sections.reduce((n, s) => n + s.bars.length * Math.max(1, s.repeats), 0);

            /* --- 0.2: DESHACER EN LA CANCIÓN -------------------------------
             * El mismo historial de fotos que el estudio. Con 400 ms de respiro
             * en vez de 150: al escribir la letra, cada pausa corta sería un
             * paso, y deshacer letra a letra no le sirve a nadie. */
            const historialCancion = useHistorial(song, (f) => setSong(f), 400);
            const deshacerCancion = (rehacer) => {
                const hecho = rehacer ? historialCancion.rehacer() : historialCancion.deshacer();
                if (onAviso) onAviso(hecho
                    ? (rehacer ? "Rehecho" : "Deshecho")
                    : (rehacer ? "Nada que rehacer" : "Nada que deshacer"));
            };
            const conDeshacerCancion = (mensaje) => {
                if (onAviso) onAviso(mensaje, { texto: "Deshacer", alPulsar: () => historialCancion.deshacer() });
            };
            useEffect(() => {
                const alPulsar = (e) => {
                    if (!(e.ctrlKey || e.metaKey)) return;
                    const tecla = (e.key || "").toLowerCase();
                    if (tecla !== "z" && tecla !== "y") return;
                    const foco = document.activeElement;
                    if (foco && (foco.tagName === "INPUT" || foco.tagName === "TEXTAREA" || foco.isContentEditable)) return;
                    e.preventDefault();
                    deshacerCancion(tecla === "y" || e.shiftKey);
                };
                window.addEventListener("keydown", alPulsar);
                return () => window.removeEventListener("keydown", alPulsar);
            });

            const [vistaMovil, setVistaMovil] = useState("editar");      // 'editar' | 'hoja' (sólo < 1280 px)
            const [alcance, setAlcance] = useState("cancion");           // qué suena: 'cancion' | 'seccion'
            const [dialogoRitmo, setDialogoRitmo] = useState(false);
            const [confirmarImport, setConfirmarImport] = useState(false);

            const escuchar = () => {
                if (isPlaying) { onStop(); return; }
                if (alcance === "seccion" && seccionActiva) onPlay(seccionActiva.id);
                else onPlay();
            };

            const moverSeccion = (id, delta) => {
                setSong(prev => {
                    const i = prev.sections.findIndex(s => s.id === id);
                    const j = i + delta;
                    if (i === -1 || j < 0 || j >= prev.sections.length) return prev;
                    const sections = prev.sections.slice();
                    const [movida] = sections.splice(i, 1);
                    sections.splice(j, 0, movida);
                    return { ...prev, sections };
                });
            };

            const borrarSeccionConDeshacer = (id) => {
                const sec = song.sections.find(s => s.id === id);
                borrarSeccion(id);
                conDeshacerCancion(`Sección «${sec ? sec.name : ""}» borrada`);
            };

            const borrarRitmoConDeshacer = (id) => {
                const r = (song.customRhythms || []).find(x => x.id === id);
                borrarRitmo(id);
                setDialogoRitmo(false);
                if (onStopPreview) onStopPreview();
                conDeshacerCancion(`Rasgueo «${r ? r.name : ""}» borrado`);
            };

            const abrirEditorDeRitmo = () => {
                editarRitmo();
                setDialogoRitmo(true);
            };

            const accionesCancion = [
                { label: `Mis canciones (${songs.length})`, hacer: () => setGestorAbierto(true) },
                ...(onBiblioteca ? [{ label: "Ver en la Biblioteca", hacer: onBiblioteca }] : []),
                { label: "Nueva canción", hacer: onNuevaCancion },
                { label: "Duplicar esta canción", hacer: () => onDuplicarCancion(song.id) },
                { label: "Guardar copia de seguridad", ayuda: "Un archivo JSON con esta canción", hacer: () => onExport("json") },
                { label: "Cargar una copia de seguridad…", hacer: () => setConfirmarImport(true) }
            ];

            const accionesSeccion = seccionActiva ? [
                { label: "Duplicar la sección", hacer: () => duplicarSeccion(seccionActiva.id) },
                { label: "Sección nueva después", hacer: () => anadirSeccion() },
                { label: "Mover antes", hacer: () => moverSeccion(seccionActiva.id, -1), desactivada: song.sections[0] && song.sections[0].id === seccionActiva.id },
                { label: "Mover después", hacer: () => moverSeccion(seccionActiva.id, +1), desactivada: song.sections[song.sections.length - 1].id === seccionActiva.id },
                { label: "Borrar la sección", hacer: () => borrarSeccionConDeshacer(seccionActiva.id), estilo: { color: 'var(--k-danger)' } }
            ] : [];

            return (
                <div class="k2-doc">

                    {/* --- LA CABECERA ---
                        Lo que hace falta tener siempre a mano: qué es, a qué
                        velocidad, y escucharla. Cada campo con su nombre. */}
                    <div class="k2-doc__cabeza">
                        <div class="k2-doc__fila">
                            <div class="k2-doc__titulo">
                                <Campo etiqueta="Título">
                                    {(id) => <input id={id} type="text" value={song.title} onChange={(e) => setSong(prev => ({ ...prev, title: e.target.value }))} />}
                                </Campo>
                            </div>
                            <div class="k2-doc__corto">
                                <Campo etiqueta="Tempo (bpm)">
                                    {(id) => (
                                        <input id={id} type="number" min="30" max="300" value={song.bpm}
                                            onChange={(e) => setSong(prev => ({ ...prev, bpm: Math.max(30, Math.min(300, parseInt(e.target.value) || 100)) }))} />
                                    )}
                                </Campo>
                            </div>
                            <div class="k2-doc__corto">
                                <Campo etiqueta="Compás">
                                    {(id) => (
                                        <select id={id} value={song.timeSignature} onChange={(e) => setSong(prev => ({ ...prev, timeSignature: e.target.value }))}>
                                            {Song.TIME_SIGNATURES.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                                        </select>
                                    )}
                                </Campo>
                            </div>
                        </div>
                        <div class="k2-doc__fila k2-doc__controles">
                            <button type="button" onClick={escuchar} class={`k-btn k-btn--touch k2-boton-texto ${isPlaying ? "k-btn--danger" : "k-btn--primary"}`}>
                                <Icono nombre={isPlaying ? "parar" : "reproducir"} />
                                <span>{isPlaying ? "Parar" : "Escuchar"}</span>
                            </button>
                            <Segmentado
                                etiqueta="Qué suena"
                                tam="sm"
                                valor={alcance}
                                onCambio={setAlcance}
                                opciones={[
                                    { id: "cancion", label: "Toda la canción" },
                                    { id: "seccion", label: "Esta sección", desactivada: !seccionActiva }
                                ]}
                            />
                            <BotonIcono icono="repetir" etiqueta="Repetir en bucle" activo={isLooping} onClick={() => setIsLooping(v => !v)} variante="borde" />
                            <div class="k2-doc__empuje"></div>
                            <BotonIcono icono="deshacer" etiqueta="Deshacer (Ctrl+Z)" onClick={() => deshacerCancion(false)} disabled={!historialCancion.hayQueDeshacer} />
                            <BotonIcono icono="rehacer" etiqueta="Rehacer (Ctrl+Shift+Z)" onClick={() => deshacerCancion(true)} disabled={!historialCancion.hayQueRehacer} />
                            <MenuAcciones etiqueta="Más acciones de la canción" titulo={song.title || "Canción"} opciones={accionesCancion} variante="borde" />
                        </div>
                    </div>

                    {/* En el teléfono no caben la canción y la hoja a la vez. */}
                    <div class="k2-doc__alternar">
                        <Segmentado
                            etiqueta="Ver"
                            ancho
                            valor={vistaMovil}
                            onCambio={setVistaMovil}
                            opciones={[{ id: "editar", label: "Editar" }, { id: "hoja", label: "Ver la hoja" }]}
                        />
                    </div>

                    <div class={`k2-doc__rejilla k2-doc__rejilla--${vistaMovil}`}>
                        <div class="k2-doc__editor">

                            {gestorAbierto && (
                                <GestorArchivos
                                    titulo="Tus canciones"
                                    nuevo="+ Nueva canción"
                                    abierto="abierta"
                                    elementos={songs}
                                    activoId={song.id}
                                    resumen={(s) => {
                                        const compases = s.sections.reduce((n, sec) => n + sec.bars.length, 0);
                                        const acordes = new Set();
                                        s.sections.forEach(sec => sec.bars.forEach(b => acordes.add(b.chordId)));
                                        return `${s.sections.length} ${s.sections.length === 1 ? "sección" : "secciones"} · ${compases} compases · ${acordes.size} acordes`;
                                    }}
                                    onAbrir={onAbrirCancion}
                                    onNuevo={onNuevaCancion}
                                    onDuplicar={onDuplicarCancion}
                                    onBorrar={onBorrarCancion}
                                    onBorrarTodo={onBorrarTodasLasCanciones}
                                    onCerrar={() => setGestorAbierto(false)}
                                />
                            )}

                            <section class="k2-tarjeta">
                                <Seccion id="cancion-datos" titulo={<span class="k2-paso">Tonalidad y notas</span>} abiertaPorDefecto={false}>
                                    <div class="k2-dos-columnas">
                                        <Campo etiqueta="Tonalidad" ayuda={song.keyRoot === null ? "Libre: se guarda lo que escribas, sin teoría." : undefined}>
                                            {(id, ayuda) => (
                                                <select
                                                    id={id}
                                                    aria-describedby={ayuda}
                                                    value={song.keyRoot === null ? "" : String(song.keyRoot)}
                                                    onChange={(e) => setSong(prev => ({
                                                        ...prev,
                                                        keyRoot: e.target.value === "" ? null : parseInt(e.target.value),
                                                        showTheorySheet: e.target.value === "" ? false : prev.showTheorySheet
                                                    }))}
                                                >
                                                    <option value="">Libre</option>
                                                    {NOTE_NAMES.map((n, i) => <option key={n} value={String(i)}>{n}</option>)}
                                                </select>
                                            )}
                                        </Campo>
                                        {song.keyRoot === null ? (
                                            <Campo etiqueta="Escríbela">
                                                {(id) => <input id={id} type="text" value={song.key} onChange={(e) => setSong(prev => ({ ...prev, key: e.target.value }))} placeholder="Ej.: Re menor" />}
                                            </Campo>
                                        ) : (
                                            <Campo etiqueta="Escala">
                                                {(id) => (
                                                    <select id={id} value={song.keyScale} onChange={(e) => setSong(prev => ({ ...prev, keyScale: e.target.value }))}>
                                                        {SCALE_PRESETS.map(e => <option key={e.id} value={e.id}>{e.name}</option>)}
                                                    </select>
                                                )}
                                            </Campo>
                                        )}
                                    </div>
                                    <div class="k2-bloque">
                                        <Interruptor
                                            etiqueta="Página de la tonalidad en la hoja"
                                            valor={song.showTheorySheet}
                                            desactivado={song.keyRoot === null}
                                            onCambio={(v) => setSong(prev => ({ ...prev, showTheorySheet: v }))}
                                            ayuda={song.keyRoot === null
                                                ? "Elige una tonalidad (no «Libre») para poder explicarla."
                                                : "Añade una página con las notas y los grados de la tonalidad."}
                                        />
                                    </div>
                                    <Campo etiqueta="Nota de la canción">
                                        {(id) => <input id={id} type="text" value={song.notes} onChange={(e) => setSong(prev => ({ ...prev, notes: e.target.value }))} placeholder="Ej.: cejilla en el 2, se toca con púa" />}
                                    </Campo>
                                </Seccion>
                            </section>

                            <section class="k2-tarjeta k2-tarjeta--plegable">
                                <Seccion id="cancion-acordes" titulo={<span class="k2-paso"><span class="k2-paso__num">1</span>Los acordes</span>}>
                                <ChordLibrary
                                    destino={seccionActiva ? seccionActiva.name : "—"}
                                    chords={chordLibrary}
                                    onBorrarTodo={onBorrarTodosLosAcordes}
                                    songs={songs}
                                    onMandarA={onMandarAcordeA}
                                    onElegirDestino={onElegirDestino}
                                    onAdd={anadirAcordeALaSeccion}
                                    onRemove={onRemoveChord}
                                    onRename={onRenameChord}
                                    onAudition={onAuditionChord}
                                    etiquetas={song.chordLabels}
                                    song={song}
                                    onSetHarmony={ponerLecturaArmonica}
                                    vacio="Aquí van a vivir tus acordes. Arma uno en Acordes y toca «Guardar acorde»."
                                />
                                </Seccion>
                            </section>

                            <section class="k2-tarjeta k2-tarjeta--plegable">
                                <Seccion id="cancion-estructura" titulo={<span class="k2-paso"><span class="k2-paso__num">2</span>La estructura</span>}>
                                <div class="k2-secciones">
                                    <div class="k2-secciones__lista" role="tablist" aria-label="Secciones de la canción">
                                        {song.sections.map(s => (
                                            <button
                                                key={s.id}
                                                type="button"
                                                role="tab"
                                                aria-selected={!!(seccionActiva && seccionActiva.id === s.id)}
                                                onClick={() => setActiveSectionId(s.id)}
                                                onContextMenu={(e) => {
                                                    e.preventDefault();
                                                    setActiveSectionId(s.id);
                                                    setMenuSeccion({ id: s.id, nombre: s.name, x: e.clientX, y: e.clientY });
                                                }}
                                                class={`k2-seccion-tab ${seccionActiva && seccionActiva.id === s.id ? "k2-seccion-tab--activa" : ""}`}
                                            >
                                                {s.name || "Sin nombre"}
                                            </button>
                                        ))}
                                        <button type="button" onClick={anadirSeccion} class="k2-seccion-tab k2-seccion-tab--nueva">+ Sección</button>
                                    </div>
                                    {seccionActiva && (
                                        <MenuAcciones etiqueta={`Más acciones de «${seccionActiva.name}»`} titulo={seccionActiva.name} opciones={accionesSeccion} variante="borde" />
                                    )}
                                </div>

                                {menuSeccion && (
                                    <MenuContextualAccesible
                                        x={menuSeccion.x}
                                        y={menuSeccion.y}
                                        titulo={menuSeccion.nombre}
                                        onCerrar={() => setMenuSeccion(null)}
                                        opciones={accionesSeccion}
                                    />
                                )}

                                {seccionActiva && (
                                    <SectionCard
                                        section={seccionActiva}
                                        song={song}
                                        onActualizar={(parche) => actualizarSeccion(seccionActiva.id, parche)}
                                        chordsById={chordsById}
                                        playhead={playhead}
                                        chordParaInsertar={chordParaInsertar}
                                        setChordParaInsertar={setChordParaInsertar}
                                    />
                                )}
                                </Seccion>
                            </section>

                            <section class="k2-tarjeta k2-tarjeta--plegable">
                                <Seccion id="cancion-ritmo" titulo={<span class="k2-paso"><span class="k2-paso__num">3</span>El ritmo base</span>} abiertaPorDefecto={false}>
                                <Campo etiqueta="Ritmo de toda la canción" ayuda="Cada sección lo usa salvo que le pongas otro.">
                                    {(id, ayuda) => (
                                        <select id={id} aria-describedby={ayuda} value={song.rhythmId} onChange={(e) => setSong(prev => ({ ...prev, rhythmId: e.target.value }))}>
                                            {Song.RHYTHM_PATTERNS.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}
                                            {(song.customRhythms || []).length > 0 && (
                                                <optgroup label="Tuyos">
                                                    {song.customRhythms.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}
                                                </optgroup>
                                            )}
                                        </select>
                                    )}
                                </Campo>
                                <div class="k2-bloque k2-fila-botones">
                                    {patronEnEdicion ? (
                                        <React.Fragment>
                                            <button type="button" onClick={() => setDialogoRitmo(true)} class="k-btn k-btn--primary k-btn--touch k2-boton-texto">
                                                <Icono nombre="editar" />
                                                <span>Editar «{patronEnEdicion.name}»</span>
                                            </button>
                                            <BotonBorrar onClick={() => borrarRitmoConDeshacer(patronEnEdicion.id)} title={`Borrar el rasgueo «${patronEnEdicion.name}»`} label="Borrar" className="k-btn--touch" />
                                        </React.Fragment>
                                    ) : (
                                        <button type="button" onClick={abrirEditorDeRitmo} class="k-btn k-btn--outline k-btn--touch k2-boton-texto">
                                            <Icono nombre="editar" />
                                            <span>Escribir tu propio rasgueo</span>
                                        </button>
                                    )}
                                </div>
                                {!patronEnEdicion && (
                                    <p class="k2-ayuda">«{ritmoDeLaCancion ? ritmoDeLaCancion.name : "Sin ritmo"}» es de fábrica. El tuyo se escribe en una rejilla, golpe a golpe.</p>
                                )}
                                </Seccion>
                            </section>
                        </div>

                        {/* --- LA HOJA, EN VIVO ---
                            No es una vista previa aparte: son EXACTAMENTE los nodos
                            que se exportan. Por eso exportar va pegado a ella. */}
                        <aside class="k2-doc__hoja" aria-labelledby="k2-la-hoja">
                            <div class="k2-tarjeta k2-hoja-controles">
                                <div class="k2-hoja-controles__cabeza">
                                    <h2 id="k2-la-hoja" class="k2-paso">La hoja</h2>
                                    <span class="k-chip">{duracion}</span>
                                    <span class="k-chip">{totalAcordes} acordes</span>
                                </div>
                                <p class="k2-ayuda">Es exactamente lo que se descarga.</p>
                                <div class="k2-bloque">
                                    <Segmentado
                                        etiqueta="Los diagramas muestran"
                                        ancho
                                        valor={song.chordLabels || "dedos"}
                                        onCambio={(v) => setSong(prev => ({ ...prev, chordLabels: v }))}
                                        opciones={[
                                            { id: "dedos", label: "Dedos", ayuda: "El número del dedo que pisa cada nota" },
                                            { id: "notas", label: "Notas", ayuda: "El nombre de cada nota" },
                                            { id: "grados", label: "Grados", ayuda: "Qué grado es cada nota" }
                                        ]}
                                    />
                                </div>
                                {song.chordLabels === "grados" && (
                                    <div class="k2-bloque">
                                        <Segmentado
                                            etiqueta="Grados contados desde"
                                            ancho
                                            valor={song.degreeBasis || "acorde"}
                                            onCambio={(v) => setSong(prev => ({ ...prev, degreeBasis: v }))}
                                            opciones={[
                                                { id: "acorde", label: "El acorde", ayuda: "1, 3, 5, 7 dentro del propio acorde" },
                                                { id: "tonalidad", label: "La tonalidad", desactivada: song.keyRoot === null, ayuda: song.keyRoot === null ? "Elige una tonalidad para poder contar desde ella" : "El grado dentro de la tonalidad de la canción" }
                                            ]}
                                        />
                                    </div>
                                )}
                                <div class="k2-bloque">
                                    <span class="k2-etiqueta">Exportar la hoja</span>
                                    <div class="k2-fila-botones">
                                        <button type="button" onClick={() => onExport("png")} class="k-btn k-btn--primary k-btn--touch k2-boton-texto">PNG</button>
                                        <button type="button" onClick={() => onExport("svg")} class="k-btn k-btn--outline k-btn--touch k2-boton-texto">SVG</button>
                                        <button type="button" onClick={() => onExport("pdf")} class="k-btn k-btn--outline k-btn--touch k2-boton-texto">PDF</button>
                                    </div>
                                </div>
                            </div>
                            <div class="k2-hoja-papel">
                                <SongSheet song={song} chordLibrary={chordLibrary} />
                            </div>
                        </aside>
                    </div>

                    {/* --- EL RASGUEO, EN SU PROPIO DIÁLOGO ---
                        Antes ocupaba media cabecera aunque no se estuviera
                        escribiendo. Ahora se abre cuando se va a escribir. */}
                    {dialogoRitmo && patronEnEdicion && (
                        <Dialogo titulo="Editar rasgueo" ancho="820px" onCerrar={() => { setDialogoRitmo(false); if (onStopPreview) onStopPreview(); }}
                            descripcion="Toca una casilla para cambiar el golpe; mantenla pulsada (o clic derecho) para elegirlo directamente. El silencio es la mitad del patrón."
                            acciones={
                                <React.Fragment>
                                    <BotonBorrar onClick={() => borrarRitmoConDeshacer(patronEnEdicion.id)} title={`Borrar el rasgueo «${patronEnEdicion.name}»`} label="Borrar el rasgueo" className="k-btn--touch" />
                                    <button type="button" onClick={() => { setDialogoRitmo(false); if (onStopPreview) onStopPreview(); }} class="k-btn k-btn--primary k-btn--touch px-4 py-2.5 k-text-sm">Listo</button>
                                </React.Fragment>
                            }
                        >
                            <StrumEditor
                                pattern={patronEnEdicion}
                                onChange={actualizarRitmo}
                                onPlay={() => onPreviewRhythm(patronEnEdicion)}
                                onStop={onStopPreview}
                                sonando={previewSonando}
                                bpm={(seccionActiva && seccionActiva.bpm) || song.bpm}
                                onAviso={onAviso}
                            />
                        </Dialogo>
                    )}

                    {confirmarImport && (
                        <Dialogo
                            titulo="Cargar una copia de seguridad"
                            descripcion="La canción del archivo sustituye a la que tienes abierta. Si quieres conservar esta, guarda antes su copia."
                            ancho="460px"
                            onCerrar={() => setConfirmarImport(false)}
                            acciones={
                                <React.Fragment>
                                    <button type="button" onClick={() => { setConfirmarImport(false); onExport("json"); }} class="k-btn k-btn--outline k-btn--touch px-4 py-2.5 k-text-sm">Guardar esta antes</button>
                                    <button type="button" onClick={() => { setConfirmarImport(false); onImport(); }} class="k-btn k-btn--primary k-btn--touch px-4 py-2.5 k-text-sm">Elegir archivo</button>
                                </React.Fragment>
                            }
                        />
                    )}
                </div>
            );
        }

        /* ==================================================================
         * EJERCICIOS
         * ==================================================================
         * Una ficha de técnica: pasos, cada uno con su digitación y el orden en
         * que se tocan las notas, a la velocidad que elijas.
         *
         * Es otra tarea distinta de la canción y por eso tiene pestaña propia,
         * pero se llega a ella también desde Escalas y Arpegios: es ahí donde
         * montas la digitación, y obligar a rehacerla en otro sitio sería
         * pedirla dos veces.
         * ================================================================== */

        /* AQUÍ VIVÍA `EJ_TINTA`, siete colores fijos para el diagrama del
         * ejercicio. Eran copias literales de los del estudio —el azul de nota,
         * el rojo de tónica, el gris del recorrido— que no se enteraban de
         * nada: cambiar el color de las notas en el panel no llegaba hasta
         * aquí.
         *
         * Ahora la ficha lee el estilo, como el resto de la obra. El papel y el
         * texto de la hoja A4 que la envuelve siguen en `HOJA`, en blanco y
         * negro, porque una hoja tiene que poder imprimirse. */

        /* --- EL PASO, DIBUJADO COMO EN EL TALLER (0.2, cuarta vuelta) -------
         * Un paso nuevo trae la escena del estudio tal como estaba al
         * mandarlo; el estilo se pone al pintar, así que cambiar un color en
         * Estilo también cambia las fichas.
         *
         * Lo que manda en el paso sigue siendo `paso.path`: es lo que suena y
         * lo que dibujan las flechas. Por eso la escena guardada no lleva su
         * propio recorrido. Un paso de tríada va sin flechas, como siempre:
         * de una forma importa dónde está la mano, no el orden. */
        function escenaDePaso(paso) {
            if (!paso.escena) return escenaDePasoLegado(paso);
            return {
                ...paso.escena,
                titulo: paso.nombre,
                recorrido: paso.envolvente ? null : { puntos: paso.path.map(p => ({ s: p.s, f: p.f })), sweep: !!paso.sweep }
            };
        }

        /* Los pasos de antes no tienen escena: se monta con lo que guardan,
         * que son las notas del recorrido. Se ven con la geometría y el color
         * por grado del Taller, aunque sin el resto de la escala. */
        function escenaDePasoLegado(paso) {
            const numStrings = getInstrument(paso.instrument).strings;
            const startingFret = paso.startingFret || 1;
            const afinacionMidi = paso.tuningMidi && paso.tuningMidi.length === numStrings
                ? paso.tuningMidi
                : Array.from({ length: numStrings }, (_, i) =>
                    window.KharoTheory.getStringBaseMIDI(paso.tuning, i, paso.instrument));
            const notaDe = (pos) => {
                const abs = pos.f === 0 ? 0 : startingFret + pos.f - 1;
                const pitch = (((afinacionMidi[pos.s] + abs) % 12) + 12) % 12;
                return {
                    etiqueta: NOTE_NAMES[pitch],
                    grado: paso.root !== null && paso.root !== undefined ? INTERVAL_DEGREES[(pitch - paso.root + 12) % 12] : null
                };
            };
            // Una cuerda al aire es el traste 0, y sólo existe si la ventana empieza en el 1.
            const camino = startingFret === 1 ? paso.path : paso.path.filter(p => p.f > 0);
            const vistas = new Set();
            const notas = [];
            camino.forEach(p => {
                const k = `${p.s}-${p.f}`;
                if (p.f === 0 || vistas.has(k)) return;
                vistas.add(k);
                notas.push({ s: p.s, f: p.f, ...notaDe(p), tap: !!p.tap });
            });
            const alAire = Array.from({ length: numStrings }, (_, s) => {
                const alAireAqui = camino.some(p => p.s === s && p.f === 0);
                return alAireAqui ? { s, nota: notaDe({ s, f: 0 }) } : { s, marca: "none" };
            });
            return {
                v: 1,
                titulo: paso.nombre,
                numStrings,
                numFrets: paso.numFrets,
                startingFret,
                afinacion: paso.tuning.slice(0, numStrings),
                numerosTraste: "left",
                alAire,
                envolventes: paso.envolvente
                    ? [{ color: paso.envolvente.color, opacidad: 0.36, zonas: zonasDeUnGrado(notas) }]
                    : null,
                mapa: { tipo: paso.tipo, notas },
                recorrido: paso.envolvente ? null : { puntos: camino.map(p => ({ s: p.s, f: p.f })), sweep: !!paso.sweep },
                acorde: null
            };
        }

        /* La ficha del paso. Si algo de un paso raro no cuadra (un
         * instrumento que ya no existe, por ejemplo), queda el dibujo de
