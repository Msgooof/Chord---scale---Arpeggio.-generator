             * El recorrido es una LISTA, no un grafo, así que «conectar A con
             * B» sólo puede querer decir «que B vaya justo detrás de A».
             * --------------------------------------------------------------- */
            const conectarEnRecorrido = (a, b) => {
                if (a.s === b.s && a.f === b.f) return;

                /* Las dos tienen que estar en el mapa. Hoy `notaMasCercana` sólo
                 * devuelve notas del mapa, así que esto no salta nunca; está
                 * escrito porque el resto de la función ya contempla sus cuatro
                 * casos de índice, y confiar en el llamante era la única
                 * suposición sin comprobar que quedaba. */
                const mapa = notasDelMapa();
                const enElMapa = (p) => mapa.some(n => window.KharoTheory.samePosition(n, p));
                if (!enElMapa(a) || !enElMapa(b)) return;

                const base = (pathManual || window.KharoTheory.buildNotePath(
                    notasDelMapa(), pathCriterio, opcionesDelRecorrido()
                )).slice();

                const ia = base.findIndex(p => p.s === a.s && p.f === a.f);
                const ib = base.findIndex(p => p.s === b.s && p.f === b.f);

                if (ia === -1 && ib === -1) {
                    base.push({ s: a.s, f: a.f }, { s: b.s, f: b.f });
                } else if (ia !== -1 && ib === -1) {
                    base.splice(ia + 1, 0, { s: b.s, f: b.f });
                } else if (ia === -1 && ib !== -1) {
                    base.splice(ib, 0, { s: a.s, f: a.f });
                } else if (ib === ia + 1) {
                    showToast("Esas dos ya van seguidas");
                    return;
                } else {
                    // Las dos están, pero separadas: se MUEVE la de destino
                    // detrás de la de origen. Es un solo splice, conserva el
                    // resto del orden y se deshace arrastrando otra vez.
                    const [movida] = base.splice(ib, 1);
                    base.splice(ib < ia ? ia : ia + 1, 0, movida);
                }

                setPathManual(base);
                if (!editandoPath) setEditandoPath(true);
            };

            /* --- DE PÍXEL DE PANTALLA A COORDENADA DEL DIBUJO ----------------
             *
             * UNA función, no dos cuentas parecidas en dos sitios. Había dos
             * —ésta para el ratón y una copia dentro de `handleTouchMove` para
             * el dedo— y las dos daban por hecho que la caja del SVG tiene
             * EXACTAMENTE la proporción del dibujo.
             *
             * Era cierto mientras `.k-fretboard-fit` usaba `width: auto`: la
             * caja se ceñía al contenido. Al pasar a `width: 100%` la caja
             * llena el hueco, sobra banda a los lados o arriba y abajo, y la
             * cuenta miente: el clic cae unas cuantas casillas al lado.
             *
             * Con `preserveAspectRatio` por defecto el dibujo se escala por el
             * lado que más aprieta y se centra en el otro. Así que la escala es
             * el MÍNIMO de las dos, y la banda es lo que sobra, a partes
             * iguales.
             *
             * Si se arregla una ruta y no la otra, el ratón y el dedo dejan de
             * coincidir: la clase de fallo que sólo aparece en el teléfono de
             * otro. Por eso es una función y no dos.
             * ---------------------------------------------------------------- */
            const puntoDelLienzo = (e) => {
                const svg = svgRef.current || document.getElementById("chord-diagram-svg");
                const caja = svg ? svg.getBoundingClientRect() : null;
                if (!caja || caja.width === 0 || caja.height === 0) return { x: 0, y: 0 };

                // Sirve para eventos de puntero y para eventos de toque.
                const p = (e.touches && e.touches[0]) || e;
                const escala = Math.min(caja.width / width, caja.height / height);
                if (!escala) return { x: 0, y: 0 };
                const bandaX = (caja.width - width * escala) / 2;
                const bandaY = (caja.height - height * escala) / 2;

                return {
                    x: (p.clientX - caja.left - bandaX) / escala,
                    y: (p.clientY - caja.top - bandaY) / escala
                };
            };

            // Qué nota del mapa cae bajo un punto del lienzo. Se resuelve por
            // geometría y no por `e.target` porque, con el puntero capturado,
            // el evento siempre lo recibe la nota de origen.
            const notaMasCercana = (punto) => {
                let mejor = null;
                let mejorDistancia = Infinity;
                notasDelMapa().forEach(n => {
                    const c = posicionEnLienzo(n);
                    if (c.y === null) return;
                    const d = Math.hypot(c.x - punto.x, c.y - punto.y);
                    if (d < mejorDistancia) { mejorDistancia = d; mejor = n; }
                });
                return mejorDistancia <= dotRadiusStyle + 6 ? mejor : null;
            };

            /* Lo que se cuelga de cada nota del mapa. Estaba repetido cuatro
             * veces (escala y arpegio, al aire y pisada) con un solo `onClick`;
             * declarado una vez, los cuatro sitios no se pueden desincronizar. */
            const propsNotaDelMapa = (s, f) => ({
                /* `grab` y no `crosshair`: la cruz dice «apunta aquí» y lo que
                 * se puede hacer es AGARRAR y llevar la flecha a otra nota. El
                 * aro del acento lo pone la clase al pasar por encima, y ni el
                 * cursor ni la clase viajan al archivo exportado. */
                class: modoAMano ? "k-nota-arrastrable" : undefined,
                style: { cursor: modoAMano ? "grab" : "pointer" },
                onClick: () => {
                    // El arrastre ya ha hecho su trabajo; este clic es su cola.
                    if (arrastroRef.current) { arrastroRef.current = false; return; }
                    tocarNotaDelMapa(s, f);
                },
                onPointerDown: (e) => {
                    if (!showPath || !editandoPath) return;
                    arrastroRef.current = false;
                    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) { /* sin captura, el arrastre sigue valiendo */ }
                    setArrastreFlecha({ desde: { s, f }, hasta: posicionEnLienzo({ s, f }) });
                },
                onPointerMove: (e) => {
                    if (!arrastreFlecha) return;
                    const punto = puntoDelLienzo(e);
                    const origen = posicionEnLienzo(arrastreFlecha.desde);
                    // Un temblor de la mano no es un arrastre.
                    if (Math.hypot(punto.x - origen.x, punto.y - origen.y) > 6) arrastroRef.current = true;
                    setArrastreFlecha(prev => prev ? { desde: prev.desde, hasta: punto } : null);
                },
                onPointerUp: (e) => {
                    if (!arrastreFlecha) return;
                    const destino = notaMasCercana(puntoDelLienzo(e));
                    if (arrastroRef.current && destino) conectarEnRecorrido(arrastreFlecha.desde, destino);
                    setArrastreFlecha(null);
                },
                onPointerCancel: () => { arrastroRef.current = false; setArrastreFlecha(null); }
            });

            /* --- LO QUE SE PUEDE HACER CON UNA FLECHA YA TRAZADA -------------
             * El segmento `i` va de `path[i]` a `path[i+1]`. Sobre una lista,
             * «borrar esta flecha» admite dos lecturas útiles y las dos se
             * ofrecen, en vez de elegir por el usuario. */
            const recorridoParaEditar = () => (
                pathManual || window.KharoTheory.buildNotePath(notasDelMapa(), pathCriterio, opcionesDelRecorrido())
            );

            /* El índice `i` se guardó en `menuFlecha` en el momento del clic
             * derecho, y el recorrido puede haber cambiado debajo antes de que
             * se elija una opción: una nota borrada, la ventana movida, el modo
             * cambiado. Entonces `base[i + 1]` es `undefined`, y `invertirSaltoEn`
             * lo metía tal cual en la lista: el render moría al pedirle su
             * posición a una nota que no existe. */
            const flechaSigueAhi = (base, i) => (
                Array.isArray(base) && i >= 0 && i + 1 < base.length
            );

            /* Aplica el resultado de una operación del menú. Hace dos cosas que
             * antes no se hacían.
             *
             * Pasa por `sanearRecorrido`, así que una operación no puede dejar
             * el recorrido apuntando a notas que ya no están.
             *
             * Y si el resultado es igual a lo que había y el recorrido era
             * automático, lo deja automático. Las tres operaciones que tiraban
             * de `recorridoParaEditar` congelaban el automático en `pathManual`
             * como efecto colateral, incluso cuando no cambiaban nada: abrir un
             * menú y elegir algo que no hace nada no debería cambiar en qué
             * estado está el recorrido. */
            const aplicarAlRecorrido = (base, siguiente) => {
                setMenuFlecha(null);
                const { recorrido } = window.KharoTheory.sanearRecorrido(siguiente, notasDelMapa());
                const igual = !pathManual && recorrido && recorrido.length === base.length &&
                    recorrido.every((p, j) => window.KharoTheory.samePosition(p, base[j]));
                if (igual) return;
                setPathManual(recorrido);
            };

            /* Y si la flecha ya no está, se dice en vez de no hacer nada: un
             * menú que se cierra sin efecto se lee como que la app se ha
             * quedado colgada. */
            const flechaPerdida = () => {
                setMenuFlecha(null);
                showToast("Esa flecha ya no está");
            };

            const quitarDestinoDeFlecha = (i) => {
                const base = recorridoParaEditar();
                if (!flechaSigueAhi(base, i)) return flechaPerdida();
                aplicarAlRecorrido(base, base.filter((_, j) => j !== i + 1));
            };

            const cortarRecorridoEn = (i) => {
                const base = recorridoParaEditar();
                if (!flechaSigueAhi(base, i)) return flechaPerdida();
                aplicarAlRecorrido(base, base.slice(0, i + 1));
            };

            const invertirSaltoEn = (i) => {
                const base = recorridoParaEditar();
                if (!flechaSigueAhi(base, i)) return flechaPerdida();
                const siguiente = base.slice();
                const guardado = siguiente[i];
                siguiente[i] = siguiente[i + 1];
                siguiente[i + 1] = guardado;
                aplicarAlRecorrido(base, siguiente);
            };

            const invertirRecorrido = () => {
                const base = recorridoParaEditar();
                aplicarAlRecorrido(base, base.slice().reverse());
            };

            /* --- EL ATAJO: del mástil a un ejercicio ----------------------
             * Hace una foto de la digitación con su recorrido y la mete como un
             * paso más. Es aquí donde se monta la digitación, así que obligar a
             * rehacerla en el otro apartado sería pedirla dos veces.
             * -------------------------------------------------------------- */
            /* 0.2: el paso se fabrica aquí y se manda donde diga el diálogo
             * «¿Adónde va?» (confirmarMandar). */
            const crearPasoDelMastil = (nombre) => {
                // Con una tríada fijada en Escalas, lo que se manda es ESA tríada.
                const triada = triadaFijada();
                if (triada && triada.posiciones.length === 0) {
                    showToast("Esa tríada no cae en la ventana que se está viendo");
                    return null;
                }
                if (triada) return { ...pasoDeTriada(triada, triada.posiciones), ...(nombre ? { nombre } : {}) };

                const recorrido = recorridoActual();
                if (recorrido.length === 0) {
                    showToast("No hay notas que practicar en esta ventana");
                    return null;
                }
                const preset = appMode === "arpeggio"
                    ? ARPEGGIO_PRESETS.find(x => x.id === arpeggioType)
                    : SCALE_PRESETS.find(x => x.id === scaleType);
                const raiz = appMode === "arpeggio" ? arpeggioRoot : scaleRoot;
                const esLibre = appMode === "free";
                const paso = Song.createExerciseStep({
                    tipo: esLibre ? "libre" : (appMode === "scale" ? "escala" : "arpegio"),
                    nombre: nombre || (esLibre
                        ? `Libre · ${recorrido.length} notas`
                        : NOTE_NAMES[raiz] + " " + (preset ? preset.name : "")),
                    instrument, tuning, tuningMidi,
                    startingFret, numFrets,
                    root: esLibre ? null : raiz,
                    presetId: esLibre ? null : (appMode === "scale" ? scaleType : arpeggioType),
                    path: recorrido,
                    // El sweep ya no es sólo de arpegios: una escala tocada con
                    // economy picking cruza cuerdas con la misma pasada de púa.
                    sweep: arpSweep
                });
                return { ...paso, escena: escenaDelEstudio() };
            };

            const crearPasoDeEjercicio = () => {
                const recorrido = recorridoActual();
                if (recorrido.length === 0) {
                    showToast("No hay notas que practicar en esta ventana");
                    return;
                }

                const preset = appMode === "arpeggio"
                    ? ARPEGGIO_PRESETS.find(x => x.id === arpeggioType)
                    : SCALE_PRESETS.find(x => x.id === scaleType);
                const raiz = appMode === "arpeggio" ? arpeggioRoot : scaleRoot;

                /* Un paso LIBRE no guarda ni tónica ni preset: las notas las has
                 * elegido tú y no salen de ninguna fórmula. Guardar un `root`
                 * cualquiera haría que la ficha coloreara como tónica una nota
                 * que nadie ha señalado. */
                const esLibre = appMode === "free";
                const paso = Song.createExerciseStep({
                    tipo: esLibre ? "libre" : (appMode === "scale" ? "escala" : "arpegio"),
                    nombre: esLibre
                        ? `Libre · ${recorrido.length} notas`
                        : NOTE_NAMES[raiz] + " " + (preset ? preset.name : ""),
                    instrument, tuning, tuningMidi,
                    startingFret, numFrets,
                    root: esLibre ? null : raiz,
                    presetId: esLibre ? null : (appMode === "scale" ? scaleType : arpeggioType),
                    path: recorrido,
                    // El sweep ya no es sólo de arpegios: una escala tocada con
                    // economy picking cruza cuerdas con la misma pasada de púa.
                    sweep: arpSweep
                });

                setExercise(prev => ({ ...prev, pasos: [...prev.pasos, paso] }));
                setAppView("exercise");
                setOpenPanel(null);
                showToast(`«${paso.nombre}» añadido al ejercicio`);
            };

            /* El camino de vuelta: abrir un paso en el mástil para retocarlo.
             * Un ejercicio que no se puede corregir obliga a rehacerlo entero. */
            const cargarPasoEnMastil = (paso) => {
                /* Por lo mismo que `loadPreset`, y por una razón más: el efecto
                 * de `[appMode]` limpia el recorrido al cambiar de modo, y aquí
                 * el recorrido es justo lo que se está restaurando. */
                restaurando.current = true;
                setInstrument(paso.instrument);
                setTuning(paso.tuning.slice());
                setTuningMidi(paso.tuningMidi);
                setStartingFret(clampStartingFret(paso.startingFret));
                setNumFrets(clampNumFrets(paso.numFrets));
                /* Un paso libre no dice qué escala ni qué arpegio dibujar,
                 * porque no salió de ninguno: se abre en modo libre y lo que se
                 * ve es exactamente su recorrido. */
                if (paso.tipo === "libre") {
                    /* Libre dejo de ser un interruptor y paso a ser una pestana:
                     * el estado que lo dice es `appMode`. `setModoLibre` murio
                     * con la mudanza y se llevo por delante todo el camino de
                     * vuelta desde Ejercicios. */
                    setAppMode("free");
                    setEditandoPath(true);

                    /* Un paso libre no sale de ninguna formula: sus notas SON su
                     * recorrido, y el mastil hay que reconstruirlo desde `path`.
                     * Sin esto el paso se abria vacio, con las flechas apuntando
                     * a notas que no se dibujan en ningun sitio.
                     *
                     * Las dos mitades van a sitios distintos, que es como
                     * `notasDelMapa` lee Libre: el traste 0 es una cuerda al aire
                     * y vive en `stringStatesLibre`; lo pisado vive en `dotsLibre`.
                     * Y una posicion repetida en el recorrido -una nota pedal- es
                     * un solo punto en el mastil. */
                    const cuerdas = getInstrument(paso.instrument).strings;
                    const pisadas = [];
                    paso.path.forEach(p => {
                        if (p.f === 0) return;
                        if (pisadas.some(n => n.s === p.s && n.f === p.f)) return;
                        pisadas.push({ s: p.s, f: p.f, finger: "" });
                    });
                    setDotsLibre(pisadas);
                    setStringStatesLibre(Array.from({ length: cuerdas }, (_, s) =>
                        paso.path.some(p => p.f === 0 && p.s === s) ? "open" : "none"
                    ));
                } else {
                    setAppMode(paso.tipo === "escala" ? "scale" : "arpeggio");
                    if (paso.tipo === "escala") { setScaleRoot(paso.root); setScaleType(paso.presetId); }
                    else { setArpeggioRoot(paso.root); setArpeggioType(paso.presetId); }
                }
                setPathManual(paso.path.map(pos => ({ ...pos })));
                setShowPath(true);
                setAppView("studio");
                showToast(`«${paso.nombre}» abierto en el mástil`);
            };

            const reiniciarRecorrido = () => {
                setPathManual(null);
                showToast("Recorrido automático restablecido");
            };

            // --- REPRODUCCIÓN SECUENCIAL DE AUDIO EN CADENA (PLAYBACK ENGINE) ---
            const triggerStrumOrSequence = () => {
                if (isPlayingSequence) return;
                synthInstance.init();

                let notesToPlay = [];

                if (appMode === "chord") {
                    for (let s = 0; s < numStrings; s++) {
                        const state = stringStates[s];
                        if (state === "muted") continue;

                        const baseMidi = stringBaseMIDI(s);
                        
                        const dot = dots.find(d => d.s === s);
                        if (dot) {
                            notesToPlay.push({ s, f: dot.f, midi: fretToMidi(baseMidi, startingFret, dot.f) });
                            continue;
                        }

                        const barre = barres.find(b => s >= b.fromString && s <= b.toString);
                        if (barre) {
                            notesToPlay.push({ s, f: barre.fret, midi: fretToMidi(baseMidi, startingFret, barre.fret) });
                            continue;
                        }

                        if (state === "open") {
                            // Sólo suena si está marcada al aire. Antes también
                            // sonaban las `none` —las que el usuario aún no ha
                            // decidido—, y entonces el acorde no sonaba como se
                            // llamaba: el análisis las ignoraba y el rasgueo no.
                            // La regla vive ahora en chordVoicingToMidi.
                            //
                            // Al aire = cejuela de la digitación, y la digitación
                            // se desplaza entera con la ventana.
                            notesToPlay.push({ s, f: 0, midi: fretToMidi(baseMidi, startingFret, 0) });
                        }
                    }
                } else {
                    /* Escalas y arpegios suenan EN EL ORDEN DEL RECORRIDO, el
                     * mismo que dibujan las flechas. Antes se ordenaba por
                     * altura y se descartaban las alturas repetidas, así que la
                     * misma nota en dos cuerdas sonaba una sola vez y el oído
                     * no seguía al dibujo. Lo que ves es lo que suena. */
                    notesToPlay = recorridoActual().map(p => ({
                        s: p.s,
                        f: p.f,
                        // Aquí una cuerda al aire es literalmente la cuerda al
                        // aire: el diagrama es un MAPA del mástil, no una forma
                        // que se desplace con la ventana.
                        midi: p.f === 0
                            ? stringBaseMIDI(p.s)
                            : fretToMidi(stringBaseMIDI(p.s), startingFret, p.f)
                    }));
                }

                if (notesToPlay.length === 0) {
                    showToast("No hay notas activas para reproducir");
                    return;
                }

                setIsPlayingSequence(true);

                /* Un acorde se rasguea —las cuerdas casi a la vez— y una escala
                 * se recorre a tempo. Son dos gestos distintos y por eso el
                 * paso entre notas no es el mismo. */
                const paso = appMode === "chord" ? separacionRasgueo : segundosPorCorchea;

                notesToPlay.forEach((item, index) => {
                    const delay = index * paso;
                    synthInstance.playNote(item.midi, 1.1, delay);

                    setTimeout(() => {
                        setNotePulse({ s: item.s, f: item.f });
                    }, delay * 1000);
                });

                setTimeout(() => {
                    setIsPlayingSequence(false);
                    setNotePulse(null);
                }, notesToPlay.length * paso * 1000 + 400);
            };

            /* --- LEYENDA DINÁMICA DE INTERVALOS ---------------------------
             * Los datos se calculan aparte porque hay dos presentaciones: la
             * columna lateral de escritorio y la tira de fichas de móvil, donde
             * una columna no cabe sin comerse el mástil.
             * -------------------------------------------------------------- */
            const DEGREE_NAMES = [
                "Tónica", "Segunda menor", "Segunda mayor", "Tercera menor", "Tercera mayor",
                "Cuarta justa", "Quinta disminuida", "Quinta justa", "Sexta menor", "Sexta mayor",
                "Séptima menor", "Séptima mayor"
            ];

            const getLegendItems = () => {
                // Ni Acordes ni Libre tienen fórmula: sin tónica declarada no hay
                // grados que listar, y una leyenda de intervalos ahí es una
                // lectura inventada.
                if (appMode === "chord" || appMode === "free") return [];

                const rootPitch = appMode === "scale" ? scaleRoot : arpeggioRoot;
                const activeIntervals = appMode === "scale" ? getActiveScaleIntervals() : getActiveArpeggioIntervals();

                const items = [];
                activeIntervals.forEach((isActive, semitoneOffset) => {
                    if (isActive) {
                        const degreeStr = INTERVAL_DEGREES[semitoneOffset];
                        items.push({
                            degreeStr,
                            degreeName: DEGREE_NAMES[semitoneOffset],
                            noteName: NOTE_NAMES[(rootPitch + semitoneOffset) % 12],
                            color: getIntervalColor(degreeStr)
                        });
                    }
                });
                return items;
            };

            // Tira horizontal para móvil: el mismo dato en una fila que se
            // desliza, en vez de una columna que roba alto al diagrama.
            const renderLegendStrip = () => {
                if (appMode === "chord" || appMode === "free" || !showLegend) return null;
                return (
                    <div class="k-strip xl:hidden w-full shrink-0 flex gap-1.5 pb-1">
                        {getLegendItems().map((item, idx) => (
                            <span key={idx} class="k-chip shrink-0" title={item.degreeName}>
                                <span
                                    class="w-4 h-4 rounded-full flex items-center justify-center k-text-xs font-black shrink-0"
                                    style={{ backgroundColor: item.color, color: tintaLegibleSobre(item.color) }}
                                >
                                    {item.degreeStr}
                                </span>
                                {item.noteName}
                            </span>
                        ))}
                    </div>
                );
            };

            const renderIntervalLegend = () => {
                if (appMode === "chord" || appMode === "free" || !showLegend) return null;
                const items = getLegendItems();

                return (
                    <div class="hidden xl:block xl:w-60 k-fill-90 border k-stroke rounded-2xl p-4 space-y-3 shrink-0 shadow-lg self-auto transition-all">
                        <h4 class="k-text-sm font-bold uppercase tracking-widest border-b k-stroke pb-2 flex items-center justify-between w-full" style={{color:'var(--k-text-muted)'}}>
                            <span class="flex items-center gap-2">
                                <span class="w-2.5 h-2.5 rounded-full animate-pulse" style={{backgroundColor:'var(--k-accent)'}}></span>
                                Leyenda de grados
                            </span>
                            <BotonCerrar onClick={() => setShowLegend(false)} title="Ocultar la leyenda" />
                        </h4>
                        <div class="space-y-2 max-h-[380px] overflow-y-auto pr-1">
                            {items.map((item, idx) => (
                                <div key={idx} class="flex items-center justify-between k-text-sm py-1.5 border-b k-stroke-40 last:border-b-0 k-hover-raised-soft px-1.5 rounded-lg transition-colors">
                                    <div class="flex items-center gap-2.5">
                                        <span 
                                            class="w-5 h-5 rounded-full flex items-center justify-center k-text-xs font-black shadow-sm shrink-0"
                                            style={{ backgroundColor: item.color, color: tintaLegibleSobre(item.color) }}
                                        >
                                            {item.degreeStr}
                                        </span>
                                        <div class="flex flex-col">
                                            <span class="font-semibold k-ink k-text-sm">{item.degreeName}</span>
                                            <span class="k-text-xs k-ink-muted">Grado {item.degreeStr}</span>
                                        </div>
                                    </div>
                                    <span
                                        class="font-mono font-bold px-2 py-0.5 rounded border k-text-xs shrink-0"
                                        style={{
                                            color: 'var(--k-highlight)',
                                            backgroundColor: 'rgba(var(--k-accent-rgb), 0.12)',
                                            borderColor: 'var(--k-border)'
                                        }}
                                    >
                                        {item.noteName}
                                    </span>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            };

            // --- GEOMETRÍA DEL DIAGRAMA (calculada en render-core.js) ---
            const {
                width, height,
                paddingTop, paddingBottom, paddingLeft, paddingRight,
                gridWidth, gridHeight,
                stringSpacing,
                fretWeights, fretHeights, fretYPositions
            } = computeDiagramGeometry({
                numStrings,
                numFrets,
                startingFret,
                dotRadius: dotRadiusStyle
            });

            const dynamicTitleFontSize = computeTitleFontSize(chordName);

            /* --- DIBUJO DEL RECORRIDO -------------------------------------
             *
             * Une las notas en el orden en que se tocan. Se dibuja aquí, y no
             * en un div encima, porque forma parte del diagrama: lo que se ve
             * es lo que se exporta.
             *
             * Cada segmento se recorta a la altura del punto para que la línea
             * no se meta debajo de la nota y la punta de flecha quede visible.
             * -------------------------------------------------------------- */
            /* --- LA Y DE UNA CASILLA, O NADA --------------------------------
             *
             * `fretYPositions` tiene `numFrets + 1` entradas. Con una nota en un
             * traste que ya no se dibuja, `fretYPositions[f]` es `undefined` y
             * toda la aritmética sale `NaN`.
             *
             * Lo malo no era el error de consola: la nota desaparecía de la
             * vista pero SEGUÍA contando —entraba en el análisis del acorde,
             * sonaba al rasguear, y viajaba en el SVG exportado con `cy="NaN"`—.
             * El fallo silencioso, por el otro extremo.
             *
             * El clamp del stepper impide llegar aquí; esto es el cinturón, para
             * que ningún camino que no hayamos previsto —cargar un preset, abrir
             * un paso, restaurar una foto— escriba un `NaN` en el archivo.
             * ---------------------------------------------------------------- */
            const yDeTraste = (f) => {
                // El traste 0 es la cuerda al aire, que se dibuja sobre la cejuela.
                if (f === 0) return paddingTop - 20;
                const arriba = fretYPositions[f - 1];
                const abajo = fretYPositions[f];
                if (arriba === undefined || abajo === undefined) return null;
                return arriba + (abajo - arriba) / 2;
            };

            const posicionEnLienzo = (p) => ({
                x: paddingLeft + p.s * stringSpacing,
                y: yDeTraste(p.f)
            });

            /* El dibujo del recorrido (`renderNotePath`) se mudó a
             * `DiagramaKharo`, que lo usan también las fichas de Ejercicios. */

            /* --- LOS ANILLOS DE LAS TRÍADAS ---------------------------------
             *
             * Se calcula UNA vez por render y no por punto: son siete grados
             * por hasta veinticuatro posiciones, y volver a cruzarlo dentro
             * del bucle de notas lo convertía en un cuadrado.
             * --------------------------------------------------------------- */
            /* Con menos de siete notas no hay terceras que apilar, así que no
             * hay grados. `diatonicChords` ya lo dice devolviendo [], pero el
             * interruptor tiene que saberlo ANTES de encenderse: ofrecerlo y
             * que no pase nada es peor que no ofrecerlo. */
            const hayTriadasEnLaEscala = appMode === "scale" && window.KharoTheory.diatonicChords(
                scaleRoot,
                getActiveScaleIntervals().map((activo, i) => activo ? i : -1).filter(i => i >= 0)
            ).length > 0;

            const triadasVisibles = triadasDiatonicas();

            // La tríada que está fijada en la tira, si la hay.
            const triadaFijada = () => (appMode === "scale" && scaleTriads && gradoFijado !== null)
                ? (triadasVisibles.find(x => x.grado === gradoFijado) || null)
                : null;

            const posicionesDelGradoSenalado = (() => {
                if (gradoTriada === null) return null;
                const g = triadasVisibles.find(x => x.grado === gradoTriada);
                if (!g) return null;
                return new Set(g.posiciones.map(p => `${p.s}-${p.f}`));
            })();

            /* Con un grado señalado, lo que no es suyo se apaga. Es lo que
             * deja VER la tríada dentro de la escala en vez de buscarla. */
            const opacidadPorTriada = (s, f) => (
                posicionesDelGradoSenalado && !posicionesDelGradoSenalado.has(`${s}-${f}`) ? OPACIDAD_FUERA_DE_TRIADA : 1
            );

            /* --- LA ENVOLVENTE DE CADA TRÍADA -------------------------------
             *
             * Una mancha que RODEA la tríada entera, no un aro por nota. La
             * primera versión marcaba cada nota por separado y eso contestaba
             * «esta nota es de vi», que no es la pregunta: la pregunta es dónde
             * está la tríada en el mástil, y para verla como una cosa hay que
             * dibujarla como una cosa.
             *
             * Las notas del grado se agrupan por CERCANÍA —cuerdas contiguas y
             * como mucho dos trastes de separación—, que es lo que la mano
             * alcanza sin moverse. Un grado suele dar dos o tres manchas en la
             * ventana: las posiciones donde ese acorde se toca.
             *
             * No se exige una nota por cuerda. Eso es la condición del sweep y
             * vive en Arpegios (§16); aquí se trata de ver la zona.
             * --------------------------------------------------------------- */



            /* Las envolventes (`renderEnvolventesDeTriadas`) también viven ya
             * en `DiagramaKharo`: la escena las trae en `envolventes`. */

            /* La tira de grados, pegada al mástil. Es el control PRIMARIO y no
             * un adorno: las envolventes son tenues y en un teléfono no existe
             * «pasar el ratón por encima», así que la única forma fiable de
             * aislar una tríada en cualquier pantalla es tocar su ficha.
             *
             * TRES GESTOS, TRES COSAS DISTINTAS:
             *
             *   pasar por encima   la enseña mientras el ratón esté ahí
             *   clic               la FIJA, y se queda puesta al apartarse
             *   clic derecho       abre el menú: verla como arpegio o mandarla
             *                      a practicar
             *
             * Antes el clic saltaba directamente a Arpegios, y eso hacía que
             * mirar una tríada con calma —que es para lo que sirve esto— fuera
             * imposible con el dedo: el primer toque la enseñaba y el segundo
             * te sacaba de la pantalla. Fijar y actuar son cosas distintas y
             * ahora son gestos distintos.
             */
            const piezaTriadas = () => {
                if (appMode !== "scale" || !scaleTriads || triadasVisibles.length === 0) return null;

                return (
                    <div class="w-full shrink-0 k-strip">
                        <div
                            class="flex items-center gap-1.5 px-1 py-1"
                            // Al salir se vuelve a la que esté FIJADA, no a nada:
                            // si no, fijar una y apartar el ratón la apagaría.
                            onMouseLeave={() => setGradoTriada(gradoFijado)}
                        >
                            <span class="k-label shrink-0 mr-1" id="k2-elige-triada">Elige tríada</span>
                            <div role="radiogroup" aria-labelledby="k2-elige-triada" class="flex items-center gap-1.5">
                            <button
                                type="button"
                                role="radio"
                                aria-checked={gradoFijado === null}
                                onMouseEnter={() => setGradoTriada(null)}
                                onClick={() => { setGradoFijado(null); setGradoTriada(null); }}
                                class="k-chip shrink-0"
                                style={{
                                    cursor: 'pointer',
                                    border: '1.5px solid var(--k-border)',
                                    backgroundColor: gradoFijado === null ? 'var(--k-text)' : 'transparent',
                                    color: gradoFijado === null ? 'var(--k-bg)' : 'inherit'
                                }}
                                title="Ver las siete a la vez, flojas"
                            >
                                Todas
                            </button>
                            {triadasVisibles.map((g, gi) => {
                                const color = DEFAULT_STYLE.triadRingColors[gi % DEFAULT_STYLE.triadRingColors.length];
                                const senalada = gradoTriada === g.grado;
                                const fijada = gradoFijado === g.grado;
                                return (
                                    <button
                                        key={g.grado}
                                        type="button"
                                        role="radio"
                                        aria-checked={fijada}
                                        onMouseEnter={() => setGradoTriada(g.grado)}
                                        onFocus={() => setGradoTriada(g.grado)}
                                        onClick={() => {
                                            setGradoFijado(g.grado);
                                            setGradoTriada(g.grado);
                                        }}
                                        onContextMenu={(e) => {
                                            e.preventDefault();
                                            setGradoTriada(g.grado);
                                            setMenuTriada({ grado: g.grado, x: e.clientX, y: e.clientY });
                                        }}
                                        {...crearPulsacionLarga(pulsoLargoRef, (x, y) => { setGradoTriada(g.grado); setMenuTriada({ grado: g.grado, x, y }); })}
                                        class="k-chip shrink-0"
                                        style={{
                                            cursor: 'pointer',
                                            border: `1.5px solid ${color}`,
                                            outline: fijada ? `2px solid ${color}` : 'none',
                                            outlineOffset: '1px',
                                            backgroundColor: senalada ? color : 'transparent',
                                            color: senalada ? '#ffffff' : 'inherit'
                                        }}
                                        title={`${g.romano} · ${g.triada}. Clic derecho o mantenla pulsada para abrirla en Arpegios o mandarla a Ejercicios`}
                                    >
                                        <strong>{g.romano}</strong>
                                        <span class="ml-1 opacity-70">{g.triada}</span>
                                    </button>
                                );
                            })}
                            </div>

                            {/* El mismo menú, para quien no tiene clic derecho.
                                En un teléfono, sin esto las dos acciones no
                                existirían. Sale sólo en la ficha fijada, para no
                                repetir siete veces el mismo botón. */}
                            {gradoFijado !== null && (
                                <button
                                    onClick={(e) => setMenuTriada({ grado: gradoFijado, x: e.clientX, y: e.clientY })}
                                    class="k-btn k-btn--outline k-btn--touch shrink-0 k-text-sm px-2.5 py-1.5"
                                    title="Abrirla en Arpegios o mandarla a Ejercicios"
                                >
                                    Mandar…
                                </button>
                            )}
                        </div>
                    </div>
                );
            };

            /* --- LA ESCENA DEL ESTUDIO (0.2, cuarta vuelta) ------------------
             * Lo que hay en el mástil, como datos: lo dibuja `DiagramaKharo`
             * aquí y en las fichas de Ejercicios, que guardan la suya.
             *
             * `op` deja pedir otra versión de lo mismo sin tocar el estado:
             * al mandar una tríada se resalta lo que se manda (`resaltar`),
             * sólo su mancha (`envolventes`) y sin flechas (`recorrido`). */
            const escenaDelEstudio = (op = {}) => {
                const resaltar = op.resaltar !== undefined ? op.resaltar : posicionesDelGradoSenalado;
                const opacidad = (s, f) => (resaltar && !resaltar.has(`${s}-${f}`) ? OPACIDAD_FUERA_DE_TRIADA : 1);

                let alAire;
                if (appMode === "scale") {
                    alAire = generateScaleOpenNotes().map(n => ({ s: n.s, nota: { etiqueta: n.label, grado: n.degreeStr, opacidad: opacidad(n.s, 0) } }));
                } else if (appMode === "arpeggio") {
                    alAire = generateArpeggioOpenNotes().map(n => ({ s: n.s, nota: { etiqueta: n.label, grado: n.degreeStr } }));
                } else {
                    alAire = alAireDeDigitacion({
                        stringStates: stringStatesActivos.slice(0, numStrings),
                        tuning, startingFret,
                        modo: chordDisplayMode,
                        raiz: detectedRootSemi
                    });
                }

                let mapa = null;
                if (appMode === "free") {
                    const recorrido = recorridoActual() || [];
                    mapa = {
                        tipo: "libre",
                        notas: dotsLibre.map(dot => {
                            const pitch = (parseNoteToSemi(tuning[dot.s]) + startingFret + dot.f - 1) % 12;
                            const orden = recorrido.findIndex(p => p.s === dot.s && p.f === dot.f);
                            return { s: dot.s, f: dot.f, etiqueta: NOTE_NAMES[pitch], grado: null, pendiente: showPath && orden === -1 };
                        })
                    };
                } else if (appMode === "scale") {
                    mapa = {
                        tipo: "escala",
                        notas: generateScaleRenderDots().map(dot => ({ s: dot.s, f: dot.f, etiqueta: dot.label, grado: dot.degreeStr, opacidad: opacidad(dot.s, dot.f) }))
                    };
                } else if (appMode === "arpeggio") {
                    mapa = {
                        tipo: "arpegio",
                        notas: arpeggioDotsVisibles().map(dot => ({ s: dot.s, f: dot.f, etiqueta: dot.label, grado: dot.degreeStr, tap: !!dot.tap }))
                    };
                }

                let envolventes = op.envolventes !== undefined ? op.envolventes : null;
                if (op.envolventes === undefined && triadasVisibles.length > 0) {
                    envolventes = triadasVisibles.map(g => ({
                        color: triadasVisibles.indexOf(g),
                        opacidad: gradoTriada === null ? 0.09 : (gradoTriada === g.grado ? 0.36 : 0.03),
                        zonas: zonasDeUnGrado(g.posiciones)
                    }));
                }

                let recorrido = null;
                if (op.recorrido !== undefined) {
                    recorrido = op.recorrido;
                } else if (showPath && appMode !== "chord") {
                    const r = recorridoActual();
                    if (r.length >= 2) recorrido = { puntos: r.map(p => ({ s: p.s, f: p.f })), sweep: arpSweep };
                }

                return {
                    v: 1,
                    titulo: op.titulo !== undefined ? op.titulo : chordName,
                    numStrings, numFrets, startingFret,
                    afinacion: tuning.slice(0, numStrings),
                    numerosTraste: fretNumPosition,
                    alAire,
                    envolventes,
                    mapa,
                    recorrido,
                    acorde: appMode === "chord"
                        ? acordeDeDigitacion({ dots, barres, tuning, startingFret, modo: chordDisplayMode, raiz: detectedRootSemi })
                        : null
                };
            };

            /* Lo que el estudio le añade al dibujo: manejadores y las capas del
             * gesto, todas `data-transient` (no viajan al archivo). Es una
             * función para que se lea al pintar, cuando todo está definido. */
            const interaccionDelEstudio = () => ({
                raiz: {
                    id: "chord-diagram-svg",
                    ref: svgRef,
                    class: "k-fretboard-fit shadow-2xl transition-all duration-300 select-none",
                    onTouchMove: handleTouchMove
                },
                idPiel: "kh-madera",

                // El halo del audio y la cejilla que se está arrastrando.
                sobreAfinacion: (g) => (
                    <React.Fragment>
                        {notePulse && yDeTraste(notePulse.f) !== null && (
                            <circle
                                data-transient="1"
                                cx={g.paddingLeft + notePulse.s * g.stringSpacing}
                                cy={yDeTraste(notePulse.f)}
                                fill="none"
                                stroke={getIntervalColor("1")}
                                strokeWidth="1.5"
                                class="audio-pulse-ring"
                            />
                        )}
                        {appMode === "chord" && dragStart && dragCurrent && dragStart.f === dragCurrent.f && dragStart.s !== dragCurrent.s && yDeTraste(dragStart.f) !== null && (
                            <g data-transient="1">
                                <rect
                                    x={(g.paddingLeft + Math.min(dragStart.s, dragCurrent.s) * g.stringSpacing) - dotRadiusStyle}
                                    y={yDeTraste(dragStart.f) - dotRadiusStyle}
                                    width={Math.abs(dragCurrent.s - dragStart.s) * g.stringSpacing + dotRadiusStyle * 2}
                                    height={dotRadiusStyle * 2}
                                    rx={dotRadiusStyle}
                                    fill={baseFingerStyleColor}
                                    opacity="0.5"
                                    stroke={textStyleColor}
                                    strokeWidth="1"
                                />
                            </g>
                        )}
                    </React.Fragment>
                ),

                propsAlAire: (a) => {
                    if (appMode === "scale" || appMode === "arpeggio") return propsNotaDelMapa(a.s, 0);
                    if (a.nota) return { style: { cursor: 'pointer' }, onClick: () => { playSingleNoteAudio(a.s, 0); toggleStringState(a.s); } };
                    return { style: { cursor: 'pointer' }, onClick: () => toggleStringState(a.s) };
                },
                hijoMarca: (a, x, y) => <rect data-transient="1" x={x - 12} y={y - 12} width="24" height="24" fill="transparent" />,

                // Libre: el mástil entero es pulsable, por DEBAJO de las notas.
                sobreCuerdas: (g) => appMode === "free" && (
                    Array.from({ length: numStrings }).map((_, sIdx) => (
                        Array.from({ length: numFrets }).map((_, fIdx) => {
                            const fretNum = fIdx + 1;
                            const x = g.paddingLeft + sIdx * g.stringSpacing - g.stringSpacing / 2;
                            const y = g.fretYPositions[fIdx];
                            const alto = g.fretYPositions[fIdx + 1] - g.fretYPositions[fIdx];
                            const ancho = sIdx === 0 || sIdx === numStrings - 1 ? g.stringSpacing / 2 + 10 : g.stringSpacing;
                            const rectX = sIdx === 0 ? g.paddingLeft - 10 : x;

                            return (
                                <rect
                                    data-transient="1"
                                    key={`libre-${sIdx}-${fretNum}`}
                                    x={rectX}
                                    y={y}
                                    width={ancho}
                                    height={alto}
                                    fill="transparent"
                                    style={{ cursor: 'crosshair' }}
                                    onMouseDown={() => handleMouseDown(sIdx, fretNum)}
                                    onMouseEnter={() => handleMouseEnter(sIdx, fretNum)}
                                    onTouchStart={(e) => handleTouchStart(e, sIdx, fretNum)}
                                />
                            );
                        })
                    ))
                ),

                // Libre: la escala de guía, apagada y fuera del archivo.
                bajoNotas: (g) => appMode === "free" && guiaEscala && (
                    generateScaleRenderDots().map((dot, idx) => {
                        if (dotsLibre.some(d => d.s === dot.s && d.f === dot.f)) return null;
                        const x = g.paddingLeft + dot.s * g.stringSpacing;
                        const y = yDeTraste(dot.f);
                        if (y === null) return null;
                        return (
                            <circle
                                data-transient="1"
                                key={`guia-${idx}`}
                                cx={x}
                                cy={y}
                                r={dotRadiusStyle * 0.42}
                                fill={getIntervalColor(dot.degreeStr)}
                                opacity="0.4"
                                style={{ pointerEvents: 'none' }}
                            />
                        );
                    })
                ),

                propsNota: (dot) => appMode === "free"
                    ? {
                        ...combinarEventos(
                            propsNotaDelMapa(dot.s, dot.f),
                            crearPulsacionLarga(pulsoLargoRef, (x, y) => abrirMenuNota(
                                { preventDefault() {}, stopPropagation() {}, clientX: x, clientY: y }, dot.s, dot.f))
                        ),
                        onContextMenu: (e) => abrirMenuNota(e, dot.s, dot.f)
                    }
                    : propsNotaDelMapa(dot.s, dot.f),

                propsFlecha: () => ({
                    class: "k-flecha",
                    style: { "--k-flecha-grosor": lineWidthStyle + "px" }
                }),
                hijosFlecha: (i, numeroVisible, { x1, y1, x2, y2, mx, my }) => (
                    <React.Fragment>
                        <line
                            data-transient="1"
                            x1={x1} y1={y1} x2={x2} y2={y2}
                            stroke="transparent"
                            strokeWidth="12"
                            strokeLinecap="round"
                            pointerEvents="stroke"
                            style={{ cursor: "context-menu" }}
                            onContextMenu={(e) => {
                                e.preventDefault();
                                setMenuFlecha({ i, numero: numeroVisible, x: e.clientX, y: e.clientY });
                            }}
                            {...crearPulsacionLarga(pulsoLargoRef, (x, y) => setMenuFlecha({ i, numero: numeroVisible, x, y }))}
                        />
                        <g
                            data-transient="1"
                            class="k-flecha-mas"
                            style={{ cursor: "pointer" }}
                            onClick={(e) => {
                                e.stopPropagation();
                                setMenuFlecha({ i, numero: numeroVisible, x: e.clientX, y: e.clientY });
                            }}
                        >
                            <circle cx={mx} cy={my} r="9" fill="var(--k-accent)" />
                            <text
                                x={mx} y={my + 4}
                                textAnchor="middle"
                                fill="var(--k-accent-ink)"
                                fontSize="12"
                                fontWeight="700"
                                pointerEvents="none"
                            >⋯</text>
                        </g>
                    </React.Fragment>
                ),

                // La flecha que estás trazando: del gesto, no del dibujo.
                sobreRecorrido: () => arrastreFlecha && (() => {
                    const desde = posicionEnLienzo(arrastreFlecha.desde);
                    return (
                        <g data-transient="1" pointerEvents="none">
                            <line
                                x1={desde.x} y1={desde.y}
                                x2={arrastreFlecha.hasta.x} y2={arrastreFlecha.hasta.y}
                                stroke={style.pathColor}
                                strokeWidth={lineWidthStyle}
                                strokeDasharray="4 3"
                                strokeLinecap="round"
                                opacity="0.6"
                            />
                            <circle
                                cx={arrastreFlecha.hasta.x}
                                cy={arrastreFlecha.hasta.y}
                                r="4"
                                fill={style.pathColor}
                                opacity="0.6"
                            />
                        </g>
                    );
                })(),

                propsCejilla: (idx) => ({ style: { cursor: 'pointer' }, onClick: () => removeBarre(idx) }),
                propsDedo: () => ({ style: { cursor: 'pointer' } }),

                // Acordes: la rejilla de toque, ENCIMA de todo.
                encima: (g) => appMode === "chord" && (
                    Array.from({ length: numStrings }).map((_, sIdx) => {
                        return Array.from({ length: numFrets }).map((_, fIdx) => {
                            const fretNum = fIdx + 1;
                            const x = g.paddingLeft + sIdx * g.stringSpacing - g.stringSpacing / 2;
                            const y = g.fretYPositions[fIdx];
                            const fretHeight = g.fretYPositions[fIdx + 1] - g.fretYPositions[fIdx];

                            const rectWidth = sIdx === 0 || sIdx === numStrings - 1 ? g.stringSpacing / 2 + 10 : g.stringSpacing;
                            const rectX = sIdx === 0 ? g.paddingLeft - 10 : x;

                            return (
                                <rect
                                    data-transient="1"
                                    key={`${sIdx}-${fretNum}`}
                                    x={rectX}
                                    y={y}
                                    width={rectWidth}
                                    height={fretHeight}
                                    fill="transparent"
                                    style={{ cursor: 'pointer' }}
                                    onMouseDown={() => handleMouseDown(sIdx, fretNum)}
                                    onMouseEnter={() => handleMouseEnter(sIdx, fretNum)}
                                    onTouchStart={(e) => handleTouchStart(e, sIdx, fretNum)}
                                />
                            );
                        });
                    })
                )
            });

            // --- EXPORT FUNCTIONS ---

            /* El diagrama listo para salir, sin lo que sólo existe mientras se
             * está usando la app.
             *
             * Hasta ahora dos de las tres exportaciones serializaban el nodo
             * VIVO, que era la garantía de que lo que ves es lo que te llevas.
             * Sigue siéndolo: lo único que se quita son los nodos marcados
             * `data-transient`, que no son parte del dibujo sino del gesto que
             * lo está editando —la línea fantasma mientras arrastras una
             * flecha—. Sin esto, exportar a media edición se llevaría un
             * garabato que no está en el diagrama. */
            const svgParaExportar = () => {
                const svgEl = document.getElementById("chord-diagram-svg");
                if (!svgEl) return null;
                const clon = svgEl.cloneNode(true);
                clon.querySelectorAll("[data-transient]").forEach(n => n.remove());

                /* Y la piel que NO es un nodo aparte, sino una clase o una
                 * variable colgada de un nodo que si se queda: el aro de «esto
                 * se arrastra» y el grosor que engorda la flecha al pasarle por
                 * encima. Sin la hoja de estilos no pintan nada, pero ensucian
                 * el archivo y —peor— lo hacen distinto segun en que modo
                 * estuvieras cuando exportaste. La obra no puede depender de
                 * eso. */
                /* Y la clase de la RAIZ, que es maquetacion pura y viajaba
                 * entera: `k-fretboard-fit shadow-2xl transition-all
                 * duration-300 select-none`. No pintaba nada en el archivo
                 * suelto —la hoja de estilos no viaja con el— pero hacia que
                 * el SVG exportado cambiara cada vez que se tocaba el layout
                 * de la app, que es justo lo que la regla de la piel y la obra
                 * prohibe. El `viewBox` y los atributos `width`/`height` se
                 * quedan: eso si es del dibujo. */
                clon.removeAttribute("class");

                clon.querySelectorAll(".k-nota-arrastrable, .k-flecha").forEach(n => {
                    n.classList.remove("k-nota-arrastrable", "k-flecha");
                    if (!n.getAttribute("class")) n.removeAttribute("class");
                    if (n.style) n.style.removeProperty("--k-flecha-grosor");
                    if (!n.getAttribute("style")) n.removeAttribute("style");
                });

                return clon;
            };

            const exportPNG = () => {
                const svgEl = svgParaExportar();
                if (!svgEl) return;
                const svgData = new XMLSerializer().serializeToString(svgEl);
                const scale = 3;
                const canvas = document.createElement("canvas");
                canvas.width = width * scale;
                canvas.height = height * scale;
                const ctx = canvas.getContext("2d");
                const img = new Image();
                const svgBlob = new Blob([svgData], { type: "image/svg+xml;charset=utf-8" });
                const url = URL.createObjectURL(svgBlob);
                img.onload = () => {
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    URL.revokeObjectURL(url);
                    const a = document.createElement("a");
                    a.download = `${nombreArchivoExport.trim() || chordName || "diagrama"}_kharo.png`;
                    a.href = canvas.toDataURL("image/png");
                    a.click();
                    showToast("PNG descargado");
                };
                img.src = url;
            };

            const exportSVG = () => {
                const svgEl = svgParaExportar();
                if (!svgEl) return;
                const svgData = new XMLSerializer().serializeToString(svgEl);
                const blob = new Blob([svgData], { type: "image/svg+xml;charset=utf-8" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.download = `${nombreArchivoExport.trim() || chordName || "diagrama"}_kharo.svg`;
                a.href = url;
                a.click();
                URL.revokeObjectURL(url);
                showToast("SVG descargado");
            };

            const exportSVGForIllustrator = () => {
                const clone = svgParaExportar();
                if (!clone) return;
                clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
                clone.setAttribute("xmlns:xlink", "http://www.w3.org/1999/xlink");
                clone.setAttribute("version", "1.1");
                const svgData = '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(clone);
                const blob = new Blob([svgData], { type: "image/svg+xml;charset=utf-8" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.download = `${nombreArchivoExport.trim() || chordName || "diagrama"}_kharo_ai.svg`;
                a.href = url;
                a.click();
                URL.revokeObjectURL(url);
                showToast("SVG para Illustrator descargado");
            };

            /* --- PIEZAS QUE CAMBIAN DE SITIO SEGÚN LA PANTALLA -------------
             *
             * En escritorio la barra de estado enseña todo en fila. En móvil
             * no cabe: apilada se comía un tercio de la pantalla, así que sólo
             * quedan el nombre y el botón de sonar, y lo demás se despliega con
             * el ⋯. Las piezas se declaran una vez y se colocan en los dos
             * sitios: duplicar el JSX es garantizar que se desincronicen.
             * --------------------------------------------------------------- */
            const piezaTempo = (clase) => (
                <div class={`flex items-center gap-1.5 ${clase || ""}`}>
                    <span class="k-label k-text-xs">Tempo:</span>
                    <input
                        type="range"
                        min="30"
                        max="240"
                        value={tempoBpm}
                        onChange={(e) => setTempoBpm(parseInt(e.target.value))}
                        class="w-20 sm:w-16 h-1 rounded-lg cursor-pointer"
                        style={{accentColor:'var(--k-highlight)', backgroundColor:'var(--k-surface-raised)'}}
                        title="Pulsos por minuto (negras). Las escalas y arpegios suenan en corcheas"
                    />
                    <span class="k-mono k-value k-text-xs w-12 text-right">{tempoBpm} bpm</span>
                    {/* Lo que el tempo hace REALMENTE en modo Acorde: separar las
                       cuerdas del rasgueo. Decir sólo «bpm» ahí era prometer un
                       metrónomo donde lo que hay es un gesto de la mano. */}
                    {appMode === "chord" && (
                        <span class="k-mono k-text-xs w-14 text-right" style={{ color: 'var(--k-text-faint)' }}>
                            {Math.round(separacionRasgueo * 1000)} ms/cuerda
                        </span>
                    )}
                </div>
            );

            const piezaModosVista = (clase) => {
                if (!modoEditable) return null;
                /* «Grados» sólo en Acordes: se cuentan respecto a la fundamental
                 * del acorde detectado, y en Libre no hay acorde que detectar.
                 * En Libre el nombre de la nota va siempre puesto, así que la
                 * pieza no aparece. */
                if (appMode === "free") return null;
                const modos = [
                    { id: "diagram", label: "Diagrama" },
                    { id: "note", label: "Notas" },
                    { id: "degree", label: "Grados" }
                ];
                return (
                    <div class={`k-tabs ${clase || ""}`}>
                        {modos.map(m => (
                            <button
                                key={m.id}
                                onClick={() => setChordDisplayMode(m.id)}
                                class={`k-tab k-text-xs ${chordDisplayMode === m.id ? "k-tab--active" : ""}`}
                            >
                                {m.label}
                            </button>
                        ))}
                    </div>
                );
            };

            const piezaVaciar = (clase) => {
                if (!modoEditable) return null;
                return (
                    <button
                        onClick={() => { clearAll(); }}
                        class={`k-btn k-btn--outline k-btn--touch k-text-xs px-2.5 py-1.5 ${clase || ""}`}
                    >
                        Vaciar
                    </button>
                );
            };

            // El puente entre el mástil y la canción: guarda la digitación que
            // hay puesta para poder usarla luego en una progresión.
            const piezaGuardarAcorde = (clase) => {
                if (appMode !== "chord") return null;
                return (
                    <button
                        onClick={saveChordToLibrary}
                        class={`k-btn k-btn--primary k-btn--touch k-text-xs px-2.5 py-1.5 ${clase || ""}`}
                        title="Guardar esta digitación para usarla en una canción"
                    >
                        + Guardar acorde
                    </button>
                );
            };

            /* --- LEYENDA Y RECORRIDO, EN UN SOLO SITIO ---------------------
             * Estos dos bloques son idénticos en Escalas y en Arpegios, y
             * estaban COPIADOS palabra por palabra en los dos paneles: 82
             * líneas duplicadas. Cada control nuevo del recorrido había que
             * escribirlo dos veces, y bastaba olvidarse de una para que los
             * dos modos dejaran de ofrecer lo mismo.
             * --------------------------------------------------------------- */
            const piezaLeyendaYRecorrido = () => (
                <React.Fragment>
                    {/* MEJORA: Interruptor de leyenda de intervalos.
                        En Libre no hay grados que listar, así que no se pinta. */}
                    <div class={"pt-2 border-t k-stroke-60 items-center justify-between " + (appMode === "free" ? "hidden" : "flex")}>
                        <span class="k-text-sm font-semibold k-ink-muted">Mostrar Leyenda</span>
                        <button
                            onClick={() => setShowLegend(!showLegend)}
                            class={`relative inline-flex h-5 w-9 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out ${showLegend ? 'k-fill-accent' : 'k-fill-raised'}`}
                        >
                            <span class={`pointer-events-none inline-block h-4 w-4 transform rounded-full shadow ring-0 k-switch-knob transition duration-200 ease-in-out ${showLegend ? 'translate-x-4' : 'translate-x-0'}`} />
                        </button>
                    </div>
                    {/* --- RECORRIDO DE NOTAS ---
                        En qué orden se tocan. Es lo que convierte
                        el mapa en un ejercicio, así que manda a la
                        vez sobre las flechas y sobre lo que suena. */}
                    <div class="pt-2 border-t k-stroke-60 space-y-2">
                        <div class="flex items-center justify-between">
                            <span class="k-text-sm font-semibold k-ink-muted">Flechas del recorrido</span>
                            <button
                                onClick={() => setShowPath(!showPath)}
                                class={`relative inline-flex h-5 w-9 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out ${showPath ? 'k-fill-accent' : 'k-fill-raised'}`}
                            >
                                <span class={`pointer-events-none inline-block h-4 w-4 transform rounded-full shadow ring-0 k-switch-knob transition duration-200 ease-in-out ${showPath ? 'translate-x-4' : 'translate-x-0'}`} />
                            </button>
                        </div>

                        {showPath && (
                            <div class="space-y-2">
                                <div class="k-tabs">
                                    <button
                                        onClick={() => { setPathCriterio("digitacion"); setPathManual(null); }}
                                        class={`k-tab k-text-xs ${!pathManual && pathCriterio === "digitacion" ? "k-tab--active" : ""}`}
                                        title="Cuerda por cuerda, de la más grave a la más aguda"
                                    >
                                        Digitación
                                    </button>
                                    <button
                                        onClick={() => { setPathCriterio("altura"); setPathManual(null); }}
                                        class={`k-tab k-text-xs ${!pathManual && pathCriterio === "altura" ? "k-tab--active" : ""}`}
                                        title="De la nota más grave a la más aguda"
                                    >
                                        Altura
                                    </button>
                                    <button
                                        onClick={() => setEditandoPath(!editandoPath)}
                                        class={`k-tab k-text-xs ${editandoPath ? "k-tab--active" : ""}`}
                                        title="Tocar las notas en el orden que quieras"
                                    >
                                        A mano
                                    </button>
                                </div>

                                {editandoPath && appMode !== "free" && (
                                    <p class="k-text-xs" style={{ color: 'var(--k-highlight)' }}>
                                        Toca las notas del mástil en el orden que quieras.
                                        Tocar una que ya está la saca del recorrido.
                                        Arrastra de una nota a otra para que vayan seguidas.
                                    </p>
                                )}

                                {editandoPath && appMode === "free" && (
                                    <p class="k-text-xs" style={{ color: 'var(--k-highlight)' }}>
                                        Toca una nota y se añade al final del recorrido, aunque ya
                                        estuviera: así se escriben notas pedal y vueltas atrás.
                                        Arrastra de una a otra para que vayan seguidas, y usa el
                                        clic derecho para quitar.
                                    </p>
                                )}

                {/* El interruptor «Modo libre» vivía AQUÍ, a tres niveles de
                                    profundidad: toolbar → panel → flechas encendidas. La parte
                                    más libre de la app era la que no se veía. Ahora es una
                                    pestaña, «Libre», al lado de Acordes. */}

                                {/* --- CUÁNTAS NOTAS POR CUERDA ---
                                    Sin tope, en un mástil de 20 trastes el
                                    recorrido baja veinte notas por la misma
                                    cuerda antes de cambiarse, y eso no lo toca
                                    nadie: se practica bajando tres, saltando de
                                    cuerda y siguiendo. Como mucho tres, y en
                                    cualquier mástil. */}
                                <div>
                                    <span class="k-label block mb-1">Notas por cuerda</span>
                                    <div class="k-tabs">
                                        {[
                                            { v: 1, label: "1" },
                                            { v: 2, label: "2" },
                                            { v: 3, label: "3" },
                                            { v: 0, label: "Todas" }
                                        ].map(op => (
                                            <button
                                                key={op.v}
                                                onClick={() => { setPathNotasPorCuerda(op.v); setPathManual(null); }}
                                                class={`k-tab k-text-xs ${!pathManual && pathNotasPorCuerda === op.v ? "k-tab--active" : ""}`}
                                                title={op.v === 0
                                                    ? "Sin tope: todas las notas que haya en la cuerda"
                                                    : `Como mucho ${op.v} nota${op.v > 1 ? "s" : ""} por cuerda, y luego se cambia de cuerda`}
                                            >
                                                {op.label}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div class="flex items-center justify-between">
                                    <span class="k-text-sm font-semibold k-ink-muted" title="Sube y vuelve a bajar por el mismo camino, que es como se estudia">
                                        Ida y vuelta
                                    </span>
                                    <button
                                        onClick={() => { setPathRetorno(!pathRetorno); setPathManual(null); }}
                                        class={`relative inline-flex h-5 w-9 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out ${pathRetorno ? 'k-fill-accent' : 'k-fill-raised'}`}
                                    >
                                        <span class={`pointer-events-none inline-block h-4 w-4 transform rounded-full shadow ring-0 k-switch-knob transition duration-200 ease-in-out ${pathRetorno ? 'translate-x-4' : 'translate-x-0'}`} />
                                    </button>
                                </div>

                                <button
                                    onClick={crearPasoDeEjercicio}
                                    class="k-btn k-btn--outline w-full k-text-xs py-1.5"
                                    title="Guardar esta digitación con su recorrido como un paso de ejercicio"
                                >
                                    → Crear ejercicio
                                </button>

                                <div class="flex items-center justify-between gap-2">
                                    <span class="k-text-xs k-ink-faint">
                                        {pathManual
                                            ? `${pathManual.length} notas, a mano`
                                            : `${recorridoActual().length} notas, automático`}
                                    </span>
                                    {pathManual && (
                                        <button
                                            onClick={reiniciarRecorrido}
                                            class="k-btn k-btn--ghost k-text-xs px-2 py-1"
                                        >
                                            Reiniciar
                                        </button>
                                    )}
                                </div>
                            </div>
                        )}
                    </div>
                </React.Fragment>
            );

            /* --- SWEEP, FUERA DEL SUBMENÚ ----------------------------------
             * Vivía dentro de Arpegios → Por cuerdas, a tres clics, cuando es
             * de lo que más se enciende y se apaga. Y lo que dice no es de la
             * agrupación: dice que cruzar de cuerda es parte del mismo
             * movimiento de púa, así que las flechas van enteras en vez de a
             * trazos. Eso vale igual en una escala tocada con economy picking,
             * y por eso aquí también aparece en modo Escala.
             *
             * Sólo con las flechas encendidas: sin recorrido dibujado no
             * gobierna nada que se vea, y un interruptor que no hace nada
             * visible es peor que no tenerlo.
             * --------------------------------------------------------------- */
            /* --- LA PISTA, VIVA ---------------------------------------------
             *
             * Era una frase fija —«Haz clic en cualquier nota para reproducir su
             * sonido»— que decía lo mismo con el mástil vacío que con un
             * recorrido de veinte flechas a medio retocar. Una pista que no
             * cambia deja de leerse a la tercera vez, y entonces da igual lo
             * que ponga.
             *
             * El orden de las ramas es el orden en que las cosas tapan a las
             * otras: si estás con las tríadas puestas, lo que necesitas saber
             * es de tríadas, no de recorridos.
             * ---------------------------------------------------------------- */
            const pistaDelLienzo = () => {
                if (appMode === "chord") {
                    return dots.length === 0 && barres.length === 0
                        ? "Toca una casilla para poner el dedo."
                        : "Arrastra entre cuerdas para hacer una cejilla; tócala para quitarla.";
                }
                if (appMode === "scale" && scaleTriads) {
                    return gradoFijado === null
                        ? "Elige una tríada en la tira de arriba para verla dentro de la escala."
                        : "Las notas apagadas son el resto de la escala: adonde puedes ir desde la tríada.";
                }
                if (notasDelMapa().length === 0) {
                    return "Toca cualquier casilla del mástil.";
                }
                if (showPath && editandoPath) {
