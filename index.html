<body class="h-full flex flex-col antialiased">

    <!-- Root target for React App -->
    <div id="root" class="min-h-screen flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        const INTERVAL_DEGREES = ["1", "b2", "2", "b3", "3", "4", "b5", "5", "b6", "6", "b7", "7"];
        
        const NOTE_TO_SEMITONE = {
            'c': 0, 'c#': 1, 'db': 1, 'd': 2, 'd#': 3, 'eb': 3, 'e': 4, 'f': 5, 'f#': 6, 'gb': 6, 'g': 7, 'g#': 8, 'ab': 8, 'a': 9, 'a#': 10, 'bb': 10, 'b': 11
        };

        const COMMON_FRETS = [1, 3, 5, 7, 9, 12, 15, 17, 19, 21, 24];

        // Tipografías admitidas
        const FONTS_LIST = [
            { id: "Inter, sans-serif", name: "Inter (Limpia)" },
            { id: "Georgia, serif", name: "Georgia (Elegante)" },
            { id: "Courier New, monospace", name: "Courier (Código)" },
            { id: "Times New Roman, serif", name: "Times (Solemne)" },
            { id: "Trebuchet MS, sans-serif", name: "Trebuchet (Equilibrada)" }
        ];

        // Valores de diseño iniciales por defecto optimizados para el mástil delgado
        const DEFAULT_STYLE = {
            backgroundColor: "#ffffff",
            gridColor: "#1e293b",
            textColor: "#0f172a",
            dotTextColor: "#ffffff",
            fontFamily: "Inter, sans-serif",
            lineWidth: 1.5,
            dotRadius: 10,
            titleFontSize: 22,
            fretboardRadius: 16,
            baseFingerColor: "#2563eb"
        };

        const DEFAULT_INTERVAL_COLORS = {
            "1": "#dc2626", // Tónica
            "2": "#f97316", // Segundas
            "3": "#eab308", // Terceras
            "4": "#a855f7", // Cuartas
            "5": "#2563eb", // Quintas
            "6": "#06b6d4", // Sextas
            "7": "#db2777"  // Séptimas
        };

        function parseNoteToSemi(noteStr) {
            if (!noteStr) return 0;
            const normalized = noteStr.trim().toLowerCase();
            return NOTE_TO_SEMITONE[normalized] ?? 0;
        }

        function arraysEqual(a, b) {
            if (a.length !== b.length) return false;
            for (let i = 0; i < a.length; i++) {
                if (a[i] !== b[i]) return false;
            }
            return true;
        }

        // --- SISTEMA DE RESOLUCIÓN DE MIDI A FRECUENCIAS Y OCTAVAS REALES ---
        const getStringBaseMIDI = (noteStr, idx, numStrings) => {
            const standard6 = [40, 45, 50, 55, 59, 64]; // E2 A2 D3 G3 B3 E4
            const standard4Bass = [28, 33, 38, 43];     // E1 A1 D2 G2
            const standard4Uke = [67, 60, 64, 69];      // G4 C4 E4 A4
            const standard5Bass = [23, 28, 33, 38, 43];  // B0 E1 A1 D2 G2
            const standard7 = [35, 40, 45, 50, 55, 59, 64]; // B1 E2 A2 D3 G3 B3 E4
            const standard8 = [30, 35, 40, 45, 50, 55, 59, 64]; // F#1 B1 E2 A2 D3 G3 B3 E4
            
            if (numStrings === 6) return standard6[idx] !== undefined ? standard6[idx] : 40 + idx * 5;
            if (numStrings === 4) {
                if (noteStr === 'g' || noteStr === 'G' || noteStr === 'A' || noteStr === 'a') {
                    return standard4Uke[idx]; // Ukelele
                }
                return standard4Bass[idx]; // Bajo de 4 cuerdas
            }
            if (numStrings === 5) return standard5Bass[idx] !== undefined ? standard5Bass[idx] : 23 + idx * 5;
            if (numStrings === 7) return standard7[idx] !== undefined ? standard7[idx] : 35 + idx * 5;
            if (numStrings === 8) return standard8[idx] !== undefined ? standard8[idx] : 30 + idx * 5;
            
            const baseNote = parseNoteToSemi(noteStr);
            return 40 + baseNote + idx * 5;
        };

        // --- SINTETIZADOR DE CUERDA PULSADA CON WEB AUDIO API ---
        class InstrumentSynth {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }
            playNote(midiNote, duration = 1.0, delay = 0) {
                this.init();
                const now = this.ctx.currentTime + delay;
                const freq = 440 * Math.pow(2, (midiNote - 69) / 12);

                if (freq <= 0 || freq > 20000) return;

                const oscWood = this.ctx.createOscillator();
                oscWood.type = 'triangle';
                oscWood.frequency.setValueAtTime(freq, now);

                const oscCore = this.ctx.createOscillator();
                oscCore.type = 'sine';
                oscCore.frequency.setValueAtTime(freq, now);

                const oscClick = this.ctx.createOscillator();
                oscClick.type = 'sawtooth';
                oscClick.frequency.setValueAtTime(freq * 2, now);

                const gainWood = this.ctx.createGain();
                const gainCore = this.ctx.createGain();
                const gainClick = this.ctx.createGain();

                const lowpass = this.ctx.createBiquadFilter();
                lowpass.type = 'lowpass';
                lowpass.frequency.setValueAtTime(freq * 4, now);
                lowpass.frequency.exponentialRampToValueAtTime(freq * 1.2, now + 0.4);

                gainWood.gain.setValueAtTime(0, now);
                gainWood.gain.linearRampToValueAtTime(0.24, now + 0.01);
                gainWood.gain.exponentialRampToValueAtTime(0.001, now + duration);

                gainCore.gain.setValueAtTime(0, now);
                gainCore.gain.linearRampToValueAtTime(0.18, now + 0.015);
                gainCore.gain.exponentialRampToValueAtTime(0.001, now + duration * 0.85);

                gainClick.gain.setValueAtTime(0, now);
                gainClick.gain.linearRampToValueAtTime(0.06, now + 0.002);
                gainClick.gain.exponentialRampToValueAtTime(0.001, now + 0.07);

                oscWood.connect(gainWood);
                oscCore.connect(gainCore);
                oscClick.connect(gainClick);

                gainWood.connect(lowpass);
                gainCore.connect(lowpass);
                gainClick.connect(lowpass);

                lowpass.connect(this.ctx.destination);

                oscWood.start(now);
                oscCore.start(now);
                oscClick.start(now);

                oscWood.stop(now + duration + 0.1);
                oscCore.stop(now + duration + 0.1);
                oscClick.stop(now + duration + 0.1);
            }
        }

        const synthInstance = new InstrumentSynth();

        const SCALE_PRESETS = [
            { id: "major", name: "Mayor (Jónica)", intervals: [0, 2, 4, 5, 7, 9, 11] },
            { id: "minor", name: "Menor Natural (Eólica)", intervals: [0, 2, 3, 5, 7, 8, 10] },
            { id: "harmonic_minor", name: "Menor Armónica", intervals: [0, 2, 3, 5, 7, 8, 11] },
            { id: "melodic_minor", name: "Menor Melódica", intervals: [0, 2, 3, 5, 7, 9, 11] },
            { id: "pentatonic_major", name: "Pentatónica Mayor", intervals: [0, 2, 4, 7, 9] },
            { id: "pentatonic_minor", name: "Pentatónica Menor", intervals: [0, 3, 5, 7, 10] },
            { id: "blues", name: "Escala de Blues", intervals: [0, 3, 5, 6, 7, 10] },
            { id: "dorian", name: "Modo Dórico", intervals: [0, 2, 3, 5, 7, 9, 10] },
            { id: "phrygian", name: "Modo Frigio", intervals: [0, 1, 3, 5, 7, 8, 10] },
            { id: "lydian", name: "Modo Lidio", intervals: [0, 2, 4, 6, 7, 9, 11] },
            { id: "mixolydian", name: "Modo Mixolidio", intervals: [0, 2, 4, 5, 7, 9, 10] },
            { id: "locrian", name: "Modo Locrio", intervals: [0, 1, 3, 5, 6, 8, 10] }
        ];

        const ARPEGGIO_PRESETS = [
            { id: "major", name: "Tríada Mayor", intervals: [0, 4, 7] },
            { id: "minor", name: "Tríada Menor", intervals: [0, 3, 7] },
            { id: "dim", name: "Tríada Disminuida", intervals: [0, 3, 6] },
            { id: "aug", name: "Tríada Aumentada", intervals: [0, 4, 8] },
            { id: "maj7", name: "Séptima Mayor (Maj7)", intervals: [0, 4, 7, 11] },
            { id: "dom7", name: "Dominante (7)", intervals: [0, 4, 7, 10] },
            { id: "min7", name: "Séptima Menor (m7)", intervals: [0, 3, 7, 10] },
            { id: "m7b5", name: "Semidisminuido (m7b5)", intervals: [0, 3, 6, 10] },
            { id: "dim7", name: "Disminuido 7 (dim7)", intervals: [0, 3, 6, 9] }
        ];

        const PRESETS = [
            {
                name: "C",
                numStrings: 6,
                numFrets: 5,
                startingFret: 1,
                tuning: ["E", "A", "D", "G", "B", "e"],
                dots: [
                    { s: 1, f: 3, finger: "3" }, 
                    { s: 2, f: 2, finger: "2" }, 
                    { s: 4, f: 1, finger: "1" }  
                ],
                stringStates: ["muted", "none", "none", "open", "none", "open"],
                barres: []
            },
            {

                numStrings: 6,
                numFrets: 5,
                startingFret: 1,
                tuning: ["E", "A", "D", "G", "B", "e"],
                dots: [
                    { s: 2, f: 2, finger: "1" },
                    { s: 3, f: 2, finger: "2" },
                    { s: 4, f: 2, finger: "3" }
                ],
                stringStates: ["muted", "open", "none", "none", "none", "open"],
                barres: []
            },
            {
                name: "G",
                numStrings: 6,
                numFrets: 5,
                startingFret: 1,
                tuning: ["E", "A", "D", "G", "B", "e"],
                dots: [
                    { s: 0, f: 3, finger: "2" },
                    { s: 1, f: 2, finger: "1" },
                    { s: 4, f: 3, finger: "3" },
                    { s: 5, f: 3, finger: "4" }
                ],
                stringStates: ["none", "none", "open", "open", "none", "none"],
                barres: []
            },
            {
                name: "E",
                numStrings: 6,
                numFrets: 5,
                startingFret: 1,
                tuning: ["E", "A", "D", "G", "B", "e"],
                dots: [
                    { s: 1, f: 2, finger: "2" },
                    { s: 2, f: 2, finger: "3" },
                    { s: 3, f: 1, finger: "1" }
                ],
                stringStates: ["open", "none", "none", "none", "open", "open"],
                barres: []
            },
            {
                name: "D",
                numStrings: 6,
                numFrets: 5,
                startingFret: 1,
                tuning: ["E", "A", "D", "G", "B", "e"],
                dots: [
                    { s: 3, f: 2, finger: "1" },
                    { s: 4, f: 3, finger: "3" },
                    { s: 5, f: 2, finger: "2" }
                ],
                stringStates: ["muted", "muted", "open", "none", "none", "none"],
                barres: []
            }
        ];

        const TUNING_PRESETS = {
            4: [
                { name: "Estándar (Bajo)", notes: ["E", "A", "D", "G"] },
                { name: "Estándar (Ukelele)", notes: ["G", "C", "E", "A"] }
            ],
            5: [
                { name: "Estándar (Bajo 5c)", notes: ["B", "E", "A", "D", "G"] }
            ],
            6: [
                { name: "Estándar (E A D G B e)", notes: ["E", "A", "D", "G", "B", "e"] },
                { name: "Drop D (D A D G B e)", notes: ["D", "A", "D", "G", "B", "e"] },
                { name: "DADGAD", notes: ["D", "A", "D", "G", "A", "d"] }
            ],
            7: [
                { name: "Estándar 7c (B E A D G B e)", notes: ["B", "E", "A", "D", "G", "B", "e"] }
            ],
            8: [
                { name: "Estándar 8c (F# B E A D G B e)", notes: ["F#", "B", "E", "A", "D", "G", "B", "e"] }
            ]
        };

        function App() {
            const [appMode, setAppMode] = useState("chord"); // 'chord', 'scale', 'arpeggio'
            const [chordName, setChordName] = useState("C");
            const [autoUpdateTitle, setAutoUpdateTitle] = useState(true);
            const [numStrings, setNumStrings] = useState(6);
            const [numFrets, setNumFrets] = useState(5);
            const [startingFret, setStartingFret] = useState(1);
            
            const [dots, setDots] = useState(PRESETS[0].dots);
            const [stringStates, setStringStates] = useState(PRESETS[0].stringStates);
            const [barres, setBarres] = useState([]);
            const [tuning, setTuning] = useState(PRESETS[0].tuning);
            const [selectedTuningName, setSelectedTuningName] = useState("Estándar (E A D G B e)");

            // States for Scale Mode
            const [scaleRoot, setScaleRoot] = useState(0); 
            const [scaleType, setScaleType] = useState("major"); 
            const [customScaleIntervals, setCustomScaleIntervals] = useState([true, false, true, false, true, true, false, true, false, true, false, true]); 

            // States for Arpeggio Mode
            const [arpeggioRoot, setArpeggioRoot] = useState(0);
            const [arpeggioType, setArpeggioType] = useState("maj7");
            
            const [scaleDisplayMode, setScaleDisplayMode] = useState("note"); 
            const [chordDisplayMode, setChordDisplayMode] = useState("diagram"); // 'diagram', 'note', 'degree'
            const [fretNumPosition, setFretNumPosition] = useState("left");

            const [toast, setToast] = useState({ show: false, message: "" });

            // Menús laterales activos (izquierda y derecha)
            const [activeLeftTab, setActiveLeftTab] = useState("theory"); // 'theory', 'instrument'
            const [activeRightTab, setActiveRightTab] = useState("style"); // 'style', 'intervals', 'export'

            // MÓVIL: Control de paneles laterales (desplegables)
            const [isLeftDrawerOpen, setIsLeftDrawerOpen] = useState(false);
            const [isRightDrawerOpen, setIsRightDrawerOpen] = useState(false);

            const [detectedChord, setDetectedChord] = useState("C");
            const [detectedRootSemi, setDetectedRootSemi] = useState(0);

            // --- ESTADO DE ARRASTRE DE CEJILLA ---
            const [dragStart, setDragStart] = useState(null); // { s: stringIndex, f: fretNum }
            const [dragCurrent, setDragCurrent] = useState(null); // { s: stringIndex, f: fretNum }

            // --- AUDIO INTERACTIVO Y ANIMACIÓN ---
            const [isPlayingSequence, setIsPlayingSequence] = useState(false);
            const [strumSpeed, setStrumSpeed] = useState(150); // Delay en milisegundos
            const [notePulse, setNotePulse] = useState(null); // { s: stringIndex, f: fretNum } para destello

            // --- ESTADO DE LEYENDA DE INTERVALOS ---
            const [showLegend, setShowLegend] = useState(true);

            // --- ESTADOS DINÁMICOS DEL EDITOR DE ESTILO ---
            const [bgStyleColor, setBgStyleColor] = useState(DEFAULT_STYLE.backgroundColor);
            const [gridStyleColor, setGridStyleColor] = useState(DEFAULT_STYLE.gridColor);
            const [textStyleColor, setTextStyleColor] = useState(DEFAULT_STYLE.textColor);
            const [fontFamilyStyle, setFontFamilyStyle] = useState(DEFAULT_STYLE.fontFamily);
            const [dotRadiusStyle, setDotRadiusStyle] = useState(DEFAULT_STYLE.dotRadius);
            const [lineWidthStyle, setLineWidthStyle] = useState(DEFAULT_STYLE.lineWidth);
            const [baseFingerStyleColor, setBaseFingerStyleColor] = useState(DEFAULT_STYLE.baseFingerColor);

            const [intervalColors, setIntervalColors] = useState(DEFAULT_INTERVAL_COLORS);

            const getIntervalColor = (degreeStr) => {
                if (!degreeStr) return baseFingerStyleColor;
                if (degreeStr.includes("1")) return intervalColors["1"];
                if (degreeStr.includes("2")) return intervalColors["2"];
                if (degreeStr.includes("3")) return intervalColors["3"];
                if (degreeStr.includes("4")) return intervalColors["4"];
                if (degreeStr.includes("5")) return intervalColors["5"];
                if (degreeStr.includes("6")) return intervalColors["6"];
                if (degreeStr.includes("7")) return intervalColors["7"];
                return baseFingerStyleColor;
            };

            const resetToDefaultStyle = () => {
                setBgStyleColor(DEFAULT_STYLE.backgroundColor);
                setGridStyleColor(DEFAULT_STYLE.gridColor);
                setTextStyleColor(DEFAULT_STYLE.textColor);
                setFontFamilyStyle(DEFAULT_STYLE.fontFamily);
                setDotRadiusStyle(DEFAULT_STYLE.dotRadius);
                setLineWidthStyle(DEFAULT_STYLE.lineWidth);
                setBaseFingerStyleColor(DEFAULT_STYLE.baseFingerColor);
                setIntervalColors(DEFAULT_INTERVAL_COLORS);
                showToast("Estilos restablecidos al diseño por defecto");
            };

            useEffect(() => {
                const defaultTunings = ["E", "A", "D", "G", "B", "e", "b", "d"];
                
                const availablePresets = TUNING_PRESETS[numStrings];
                if (availablePresets && availablePresets.length > 0) {
                    setTuning(availablePresets[0].notes);
                    setSelectedTuningName(availablePresets[0].name);
                } else {
                    const newTuning = [];
                    for (let i = 0; i < numStrings; i++) {
                        newTuning.push(defaultTunings[i % defaultTunings.length]);
                    }
                    setTuning(newTuning);
                    setSelectedTuningName("Personalizada");
                }

                if (stringStates.length !== numStrings) {
                    const newStates = [];
                    for (let i = 0; i < numStrings; i++) {
                        newStates.push("none");
                    }
                    setStringStates(newStates);
                }
            }, [numStrings]);

            useEffect(() => {
                if (appMode === "chord") {
                    const result = analyzeCurrentChord();
                    setDetectedChord(result.name);
                    setDetectedRootSemi(result.rootSemi);

                    if (autoUpdateTitle) {
                        if (result.name && !result.name.includes("Ninguno") && !result.name.includes("Desconocido")) {
                            setChordName(result.name);
                        } else if (result.name && result.name.includes("Ninguno")) {
                            setChordName("Mástil Vacío");
                        } else if (result.name && result.name.includes("Desconocido")) {
                            setChordName("Acorde");
                        }
                    }
                } else if (appMode === "scale") {
                    if (autoUpdateTitle) {
                        const rootName = NOTE_NAMES[scaleRoot];
                        const typeName = scaleType === "custom" ? "Escala Personalizada" : SCALE_PRESETS.find(p => p.id === scaleType)?.name;
                        setChordName(`${rootName} ${typeName}`);
                    }
                } else if (appMode === "arpeggio") {
                    if (autoUpdateTitle) {
                        const rootName = NOTE_NAMES[arpeggioRoot];
                        const typeName = ARPEGGIO_PRESETS.find(p => p.id === arpeggioType)?.name;
                        setChordName(`Arpegio: ${rootName} ${typeName}`);
                    }
                }
            }, [dots, stringStates, barres, tuning, numStrings, startingFret, autoUpdateTitle, appMode, scaleRoot, scaleType, customScaleIntervals, arpeggioRoot, arpeggioType]);

            const analyzeCurrentChord = () => {
                const sounding = [];
                for (let s = 0; s < numStrings; s++) {
                    const state = stringStates[s];
                    if (state === "muted") continue;

                    const tuningNote = tuning[s];
                    const baseSemi = parseNoteToSemi(tuningNote);

                    const dot = dots.find(d => d.s === s);
                    if (dot) {
                        const absFret = startingFret + dot.f - 1;
                        sounding.push({
                            semitone: (baseSemi + absFret) % 12,
                            stringIndex: s,
                            isFretted: true,
                            absoluteFret: absFret
                        });
                        continue;
                    }

                    const barre = barres.find(b => s >= b.fromString && s <= b.toString);
                    if (barre) {
                        const absFret = startingFret + barre.fret - 1;
                        sounding.push({
                            semitone: (baseSemi + absFret) % 12,
                            stringIndex: s,
                            isFretted: true,
                            absoluteFret: absFret
                        });
                        continue;
                    }

                    if (state === "open" || state === "none") {
                        if (state === "open") {
                            sounding.push({
                                semitone: baseSemi % 12,
                                stringIndex: s,
                                isFretted: false,
                                absoluteFret: 0
                            });
                        }
                    }
                }

                if (sounding.length === 0) return { name: "Ninguno (Mástil Vacío)", rootSemi: 0 };

                sounding.sort((a, b) => a.stringIndex - b.stringIndex);
                const bassSemi = sounding[0].semitone;
                const bassNoteName = NOTE_NAMES[bassSemi];

                const uniquePitches = [...new Set(sounding.map(s => s.semitone))];

                // --- LIBRERÍA MATEMÁTICA EXPANDIDA DE FÓRMULAS DE ACORDES ---
                const formulas = [
                    // --- TRÍADAS Y BÁSICOS ---
                    { name: "", intervals: [0, 4, 7] },                     // Mayor
                    { name: "m", intervals: [0, 3, 7] },                    // Menor
                    { name: "sus4", intervals: [0, 5, 7] },                 // Suspendido 4
                    { name: "sus2", intervals: [0, 2, 7] },                 // Suspendido 2
                    { name: "5", intervals: [0, 7] },                       // Quinta (Power Chord)
                    { name: "dim", intervals: [0, 3, 6] },                  // Disminuido
                    { name: "aug", intervals: [0, 4, 8] },                  // Aumentado

                    // --- SÉPTIMAS ---
                    { name: "7", intervals: [0, 4, 7, 10] },                // Dominante 7 (Completo)
                    { name: "7", intervals: [0, 4, 10] },                   // Dominante 7 (Sin 5a)
                    { name: "maj7", intervals: [0, 4, 7, 11] },              // Mayor 7 (Completo)
                    { name: "maj7", intervals: [0, 4, 11] },                // Mayor 7 (Sin 5a)
                    { name: "m7", intervals: [0, 3, 7, 10] },                // Menor 7 (Completo)
                    { name: "m7", intervals: [0, 3, 10] },                  // Menor 7 (Sin 5a)
                    { name: "m(maj7)", intervals: [0, 3, 7, 11] },           // Menor/Sexta Séptima
                    { name: "m(maj7)", intervals: [0, 3, 11] },             // Menor/Sexta Séptima (Sin 5a)
                    { name: "m7b5", intervals: [0, 3, 6, 10] },             // Semidisminuido (Menor 7 bemol 5)
                    { name: "dim7", intervals: [0, 3, 6, 9] },              // Disminuido completo (Disminuido 7)
                    { name: "7#5", intervals: [0, 4, 8, 10] },              // Aumentado Dominante 7
                    { name: "maj7#5", intervals: [0, 4, 8, 11] },            // Aumentado Mayor 7

                    // --- ACORDES DE SEXTA ---
                    { name: "6", intervals: [0, 4, 7, 9] },                  // Sexta Mayor
                    { name: "6", intervals: [0, 4, 9] },                    // Sexta Mayor (Sin 5a)
                    { name: "m6", intervals: [0, 3, 7, 9] },                 // Sexta Menor
                    { name: "m6", intervals: [0, 3, 9] },                   // Sexta Menor (Sin 5a)
                    { name: "6/9", intervals: [0, 2, 4, 7, 9] },             // Sexta/Nona Mayor
                    { name: "6/9", intervals: [0, 2, 4, 9] },               // Sexta/Nona Mayor (Sin 5a)
                    { name: "m6/9", intervals: [0, 2, 3, 7, 9] },            // Sexta/Nona Menor
                    { name: "m6/9", intervals: [0, 2, 3, 9] },              // Sexta/Nona Menor (Sin 5a)

                    // --- NOVENAS ---
                    { name: "9", intervals: [0, 2, 4, 7, 10] },             // Dominante 9 (Completo)
                    { name: "9", intervals: [0, 2, 4, 10] },                // Dominante 9 (Sin 5a)
                    { name: "maj9", intervals: [0, 2, 4, 7, 11] },           // Mayor 9 (Completo)
                    { name: "maj9", intervals: [0, 2, 4, 11] },             // Mayor 9 (Sin 5a)
                    { name: "m9", intervals: [0, 2, 3, 7, 10] },             // Menor 9 (Completo)
                    { name: "m9", intervals: [0, 2, 3, 10] },               // Menor 9 (Sin 5a)
                    { name: "m(maj9)", intervals: [0, 2, 3, 7, 11] },        // Menor Mayor 9
                    { name: "m(maj9)", intervals: [0, 2, 3, 11] },          // Menor Mayor 9 (Sin 5a)
                    { name: "9b5", intervals: [0, 2, 4, 6, 10] },            // Dominante 9 bemol 5
                    { name: "9#5", intervals: [0, 2, 4, 8, 10] },            // Dominante 9 sostenido 5
                    { name: "7b9", intervals: [0, 1, 4, 7, 10] },            // Dominante 7 bemol 9
                    { name: "7b9", intervals: [0, 1, 4, 10] },              // Dominante 7 bemol 9 (Sin 5a)
                    { name: "7#9", intervals: [0, 3, 4, 7, 10] },            // Dominante 7 sostenido 9 ("Hendrix Chord")
                    { name: "7#9", intervals: [0, 3, 4, 10] },              // Dominante 7 sostenido 9 (Sin 5a)

                    // --- ONCEVAS ---
                    { name: "11", intervals: [0, 2, 4, 5, 7, 10] },          // Onceva Dominante
                    { name: "11", intervals: [0, 2, 5, 10] },               // Onceva Dominante (Sin 3/5a)
                    { name: "maj11", intervals: [0, 2, 4, 5, 7, 11] },       // Onceva Mayor
                    { name: "maj11", intervals: [0, 2, 5, 11] },            // Onceva Mayor (Sin 3/5a)
                    { name: "m11", intervals: [0, 2, 3, 5, 7, 10] },         // Onceva Menor
                    { name: "m11", intervals: [0, 2, 3, 5, 10] },           // Onceva Menor (Sin 5a)
                    { name: "maj7#11", intervals: [0, 2, 4, 6, 7, 11] },     // Lidio (maj7#11)
                    { name: "maj7#11", intervals: [0, 4, 6, 11] },           // Lidio (maj7#11 sin 5a)
                    { name: "maj7#11", intervals: [0, 2, 4, 6, 11] },        // Lidio (maj9#11 sin 5a)

                    // --- TRECEVAS ---
                    { name: "13", intervals: [0, 2, 4, 7, 9, 10] },          // Treceva Dominante
                    { name: "13", intervals: [0, 2, 4, 9, 10] },            // Treceva Dominante (Sin 5a)
                    { name: "13", intervals: [0, 4, 9, 10] },               // Treceva Dominante (Voicing de Jazz común)
                    { name: "maj13", intervals: [0, 2, 4, 7, 9, 11] },       // Treceva Mayor
                    { name: "maj13", intervals: [0, 2, 4, 9, 11] },         // Treceva Mayor (Sin 5a)
                    { name: "m13", intervals: [0, 2, 3, 7, 9, 10] },         // Treceva Menor
                    { name: "m13", intervals: [0, 2, 3, 9, 10] },           // Treceva Menor (Sin 5a)

                    // --- NOTAS AÑADIDAS (ADD) ---
                    { name: "add9", intervals: [0, 2, 4, 7] },               // Nona Añadida Mayor
                    { name: "add9", intervals: [0, 2, 4] },                 // Nona Añadida Mayor (Sin 5a)
                    { name: "madd9", intervals: [0, 2, 3, 7] },              // Nona Añadida Menor
                    { name: "madd9", intervals: [0, 2, 3] },                // Nona Añadida Menor (Sin 5a)
                    { name: "add11", intervals: [0, 4, 5, 7] },              // Onceva Añadida Mayor
                    { name: "add11", intervals: [0, 4, 5] },                // Onceva Añadida Mayor (Sin 5a)
                    { name: "madd11", intervals: [0, 3, 5, 7] },             // Onceva Añadida Menor
                    { name: "madd11", intervals: [0, 3, 5] },               // Onceva Añadida Menor (Sin 5a)

                    // --- SUSPENDIDOS EXTENDIDOS ---
                    { name: "7sus4", intervals: [0, 5, 7, 10] },             // Dominante 7 Suspendido 4
                    { name: "7sus4", intervals: [0, 5, 10] },               // Dominante 7 Suspendido 4 (Sin 5a)
                    { name: "9sus4", intervals: [0, 2, 5, 7, 10] },          // Dominante 9 Suspendido 4
                    { name: "9sus4", intervals: [0, 2, 5, 10] },            // Dominante 9 Suspendido 4 (Sin 5a)
                    { name: "13sus4", intervals: [0, 2, 5, 7, 9, 10] }       // Dominante 13 Suspendido 4
                ];

                let bestChord = null;

                for (const root of uniquePitches) {
                    const relIntervals = uniquePitches.map(p => (p - root + 12) % 12);
                    relIntervals.sort((a, b) => a - b);

                    for (const formula of formulas) {
                        if (arraysEqual(relIntervals, formula.intervals)) {
                            bestChord = {
                                root: NOTE_NAMES[root],
                                type: formula.name,
                                bass: NOTE_NAMES[root] === bassNoteName ? "" : bassNoteName,
                                rootSemi: root
                            };
                            break;
                        }
                    }
                    if (bestChord) break;
                }

                if (!bestChord) {
                    const notesString = uniquePitches.map(p => NOTE_NAMES[p]).join(", ");
                    return { name: `Desconocido (${notesString})`, rootSemi: uniquePitches[0] };
                }

                let chordString = bestChord.root + bestChord.type;
                if (bestChord.bass) {
                    chordString += "/" + bestChord.bass;
                }
                return { name: chordString, rootSemi: bestChord.rootSemi };
            };

            const handleTuningPresetChange = (notesArray, name) => {
                setTuning(notesArray);
                setSelectedTuningName(name);
                showToast(`Afinación cambiada a: ${name}`);
            };

            const showToast = (msg) => {
                setToast({ show: true, message: msg });
                setTimeout(() => {
                    setToast({ show: false, message: "" });
                }, 3000);
            };

            // --- EVENTOS DE INTERACCIÓN AUDIBLE ---
            const playSingleNoteAudio = (stringIndex, fretNum) => {
                synthInstance.init();
                const baseMidi = getStringBaseMIDI(tuning[stringIndex], stringIndex, numStrings);
                const absMidi = baseMidi + fretNum;
                synthInstance.playNote(absMidi);

                // Disparar destello visual
                setNotePulse({ s: stringIndex, f: fretNum });
                setTimeout(() => setNotePulse(null), 400);
            };

            // --- NUEVA LÓGICA DE RATÓN / GESTO ARRASTRAR PARA CEJILLAS ---
            const handleMouseDown = (sIdx, fretNum) => {
                if (appMode !== "chord") return;
                setDragStart({ s: sIdx, f: fretNum });
                setDragCurrent({ s: sIdx, f: fretNum });
            };

            const handleMouseEnter = (sIdx, fretNum) => {
                if (appMode !== "chord" || !dragStart) return;
                if (dragStart.f === fretNum) {
                    setDragCurrent({ s: sIdx, f: fretNum });
                }
            };

            const handleMouseUp = () => {
                if (appMode !== "chord" || !dragStart || !dragCurrent) return;

                const sIdx = dragStart.s;
                const fretNum = dragStart.f;

                if (dragStart.s === dragCurrent.s) {
                    // MEJORA: Detectar si se hizo click sobre una cejilla existente en este traste y rango de cuerdas para eliminarla
                    const barreIdx = barres.findIndex(b => b.fret === fretNum && sIdx >= b.fromString && sIdx <= b.toString);
                    if (barreIdx > -1) {
                        removeBarre(barreIdx);
                        setDragStart(null);
                        setDragCurrent(null);
                        return;
                    }

                    const existingIndex = dots.findIndex(d => d.s === sIdx && d.f === fretNum);
                    if (existingIndex > -1) {
                        setDots(dots.filter(d => !(d.s === sIdx && d.f === fretNum)));
                    } else {
                        // MEJORA: Eliminar cualquier otra nota física (dot) en esta cuerda
                        const cleanDots = dots.filter(d => d.s !== sIdx);
                        setDots([...cleanDots, { s: sIdx, f: fretNum, finger: "" }]);

                        // Conmutamos el estado al aire
                        const updatedStates = [...stringStates];
                        updatedStates[sIdx] = "none";
                        setStringStates(updatedStates);

                        playSingleNoteAudio(sIdx, fretNum);
                    }
                } else {
                    const fromString = Math.min(dragStart.s, dragCurrent.s);
                    const toString = Math.max(dragStart.s, dragCurrent.s);
                    const fret = dragStart.f;

                    // MEJORA: Cejilla es INMUNE, así que NO eliminamos notas (dots) ni alteramos estados al aire/muted de las cuerdas al crearla!
                    
                    // Eliminar cualquier cejilla previa idéntica en el mismo traste y rango
                    let filteredBarres = barres.filter(b => !(b.fret === fret && b.fromString === fromString && b.toString === toString));
                    
                    const newBarre = { fromString, toString, fret, finger: "" };
                    setBarres([...filteredBarres, newBarre]);
                    playSingleNoteAudio(fromString, fret);
                    showToast("Cejilla creada por arrastre");
                }

                setDragStart(null);
                setDragCurrent(null);
            };

            // --- SOPORTE MULTI-TOQUE COMPATIBLE CON MÓVILES ---
            const handleTouchStart = (e, sIdx, fretNum) => {
                if (appMode !== "chord") return;
                setDragStart({ s: sIdx, f: fretNum });
                setDragCurrent({ s: sIdx, f: fretNum });
            };

            const handleTouchMove = (e) => {
                if (appMode !== "chord" || !dragStart) return;
                const svg = document.getElementById("chord-diagram-svg");
                if (!svg) return;
                
                const rect = svg.getBoundingClientRect();
                const touchX = e.touches[0].clientX - rect.left;
                
                const scaleX = width / rect.width;
                const svgX = touchX * scaleX;
                
                let closestS = Math.round((svgX - paddingLeft) / stringSpacing);
                closestS = Math.max(0, Math.min(numStrings - 1, closestS));
                
                setDragCurrent({ s: closestS, f: dragStart.f });
            };

            const removeBarre = (idx) => {
                setBarres(barres.filter((_, i) => i !== idx));
                showToast("Cejilla eliminada");
            };

            const toggleStringState = (stringIndex) => {
                if (appMode !== "chord") return; 
                
                const states = ["none", "open", "muted"];
                const currentIdx = states.indexOf(stringStates[stringIndex]);
                const nextIdx = (currentIdx + 1) % states.length;
                const nextState = states[nextIdx];
                
                const updated = [...stringStates];
                updated[stringIndex] = nextState;
                setStringStates(updated);

                // MEJORA: Si la cuerda pasa a estar "open" o "muted", eliminamos puntos físicos (dots), pero la cejilla es INMUNE
                if (nextState === "open" || nextState === "muted") {
                    setDots(prev => prev.filter(d => d.s !== stringIndex));
                }

                if (nextState === "open") {
                    playSingleNoteAudio(stringIndex, 0);
                }
            };

            const changeTuningNote = (index, value) => {
                const updated = [...tuning];
                updated[index] = value;
                setTuning(updated);
                setSelectedTuningName("Personalizada");
            };

            const toggleCustomInterval = (idx) => {
                const updated = [...customScaleIntervals];
                updated[idx] = !updated[idx];
                setCustomScaleIntervals(updated);
            };

            const loadPreset = (preset) => {
                setChordName(preset.name.split(" ")[0]);
                setNumStrings(preset.numStrings);
                setNumFrets(preset.numFrets);
                setStartingFret(preset.startingFret);
                setDots(preset.dots);
                setStringStates(preset.stringStates);
                setBarres(preset.barres ?? []);
                setTuning(preset.tuning);
                setSelectedTuningName("Estándar (E A D G B e)");
                setAutoUpdateTitle(true);
                setAppMode("chord");
                showToast(`Acorde ${preset.name} cargado correctamente`);
            };

            const clearAll = () => {
                setDots([]);
                setStringStates(Array(numStrings).fill("none"));
                setBarres([]);
                showToast("Mástil limpiado completamente");
            };

            // --- TEORÍA DE ESCALAS E INTERVALOS ---
            const getActiveScaleIntervals = () => {
                if (scaleType === "custom") {
                    return customScaleIntervals;
                }
                const preset = SCALE_PRESETS.find(p => p.id === scaleType);
                if (!preset) return Array(12).fill(false);
                
                const intervals = Array(12).fill(false);
                preset.intervals.forEach(semitone => {
                    intervals[semitone] = true;
                });
                return intervals;
            };

            const isNoteInScale = (pitch) => {
                const relativeSemi = (pitch - scaleRoot + 12) % 12;
                const activeIntervals = getActiveScaleIntervals();
                return activeIntervals[relativeSemi];
            };

            const generateScaleRenderDots = () => {
                if (appMode !== "scale") return [];
                const scaleDots = [];

                for (let s = 0; s < numStrings; s++) {
                    const baseSemi = parseNoteToSemi(tuning[s]);
                    
                    for (let f = 1; f <= numFrets; f++) {
                        const absFret = startingFret + f - 1;
                        const notePitch = (baseSemi + absFret) % 12;
                        
                        if (isNoteInScale(notePitch)) {
                            const relativeSemi = (notePitch - scaleRoot + 12) % 12;
                            const isRoot = relativeSemi === 0;
                            const label = scaleDisplayMode === "note" 
                                ? NOTE_NAMES[notePitch] 
                                : INTERVAL_DEGREES[relativeSemi];

                            scaleDots.push({
                                s: s,
                                f: f,
                                isRoot: isRoot,
                                label: label,
                                degreeStr: INTERVAL_DEGREES[relativeSemi]
                            });
                        }
                    }
                }
                return scaleDots;
            };

            const generateScaleOpenNotes = () => {
                if (appMode !== "scale") return [];
                const openNotes = [];
                for (let s = 0; s < numStrings; s++) {
                    const baseSemi = parseNoteToSemi(tuning[s]) % 12;
                    if (isNoteInScale(baseSemi)) {
                        const relativeSemi = (baseSemi - scaleRoot + 12) % 12;
                        const isRoot = relativeSemi === 0;
                        const label = scaleDisplayMode === "note" 
                            ? NOTE_NAMES[baseSemi] 
                            : INTERVAL_DEGREES[relativeSemi];

                        openNotes.push({
                            s: s,
                            isRoot: isRoot,
                            label: label,
                            degreeStr: INTERVAL_DEGREES[relativeSemi]
                        });
                    }
                }
                return openNotes;
            };

            // --- ARPEGIOS ---
            const getActiveArpeggioIntervals = () => {
                const preset = ARPEGGIO_PRESETS.find(p => p.id === arpeggioType);
                if (!preset) return Array(12).fill(false);
                
                const intervals = Array(12).fill(false);
                preset.intervals.forEach(semitone => {
                    intervals[semitone] = true;
                });
                return intervals;
            };

            const isNoteInArpeggio = (pitch) => {
                const relativeSemi = (pitch - arpeggioRoot + 12) % 12;
                const activeIntervals = getActiveArpeggioIntervals();
                return activeIntervals[relativeSemi];
            };

            const generateArpeggioRenderDots = () => {
                if (appMode !== "arpeggio") return [];
                const arpeggioDots = [];

                for (let s = 0; s < numStrings; s++) {
                    const baseSemi = parseNoteToSemi(tuning[s]);
                    
                    for (let f = 1; f <= numFrets; f++) {
                        const absFret = startingFret + f - 1;
                        const notePitch = (baseSemi + absFret) % 12;
                        
                        if (isNoteInArpeggio(notePitch)) {
                            const relativeSemi = (notePitch - arpeggioRoot + 12) % 12;
                            const isRoot = relativeSemi === 0;
                            const label = scaleDisplayMode === "note" 
                                ? NOTE_NAMES[notePitch] 
                                : INTERVAL_DEGREES[relativeSemi];

                            arpeggioDots.push({
                                s: s,
                                f: f,
                                isRoot: isRoot,
                                label: label,
                                degreeStr: INTERVAL_DEGREES[relativeSemi]
                            });
                        }
                    }
                }
                return arpeggioDots;
            };

            const generateArpeggioOpenNotes = () => {
                if (appMode !== "arpeggio") return [];
                const openNotes = [];
                for (let s = 0; s < numStrings; s++) {
                    const baseSemi = parseNoteToSemi(tuning[s]) % 12;
                    if (isNoteInArpeggio(baseSemi)) {
                        const relativeSemi = (baseSemi - arpeggioRoot + 12) % 12;
                        const isRoot = relativeSemi === 0;
                        const label = scaleDisplayMode === "note" 
                            ? NOTE_NAMES[baseSemi] 
                            : INTERVAL_DEGREES[relativeSemi];

                        openNotes.push({
                            s: s,
                            isRoot: isRoot,
                            label: label,
                            degreeStr: INTERVAL_DEGREES[relativeSemi]
                        });
                    }
                }
                return openNotes;
            };

            // --- REPRODUCCIÓN SECUENCIAL DE AUDIO EN CADENA (PLAYBACK ENGINE) ---
            const triggerStrumOrSequence = () => {
                if (isPlayingSequence) return;
                synthInstance.init();

                let notesToPlay = [];

                if (appMode === "chord") {
                    for (let s = 0; s < numStrings; s++) {
                        const state = stringStates[s];
                        if (state === "muted") continue;

                        const baseMidi = getStringBaseMIDI(tuning[s], s, numStrings);
                        
                        const dot = dots.find(d => d.s === s);
                        if (dot) {
                            notesToPlay.push({ s, f: dot.f, midi: baseMidi + dot.f });
                            continue;
                        }

                        const barre = barres.find(b => s >= b.fromString && s <= b.toString);
                        if (barre) {
                            notesToPlay.push({ s, f: barre.fret, midi: baseMidi + barre.fret });
                            continue;
                        }

                        if (state === "open" || state === "none") {
                            notesToPlay.push({ s, f: 0, midi: baseMidi });
                        }
                    }
                } else if (appMode === "scale") {
                    const opens = generateScaleOpenNotes();
                    opens.forEach(op => {
                        const baseMidi = getStringBaseMIDI(tuning[op.s], op.s, numStrings);
                        notesToPlay.push({ s: op.s, f: 0, midi: baseMidi });
                    });

                    const frets = generateScaleRenderDots();
                    frets.forEach(fr => {
                        const baseMidi = getStringBaseMIDI(tuning[fr.s], fr.s, numStrings);
                        notesToPlay.push({ s: fr.s, f: fr.f, midi: baseMidi + fr.f });
                    });

                    notesToPlay.sort((a, b) => a.midi - b.midi);

                    const uniqueNotes = [];
                    const seenMidi = new Set();
                    notesToPlay.forEach(item => {
                        if (!seenMidi.has(item.midi)) {
                            seenMidi.add(item.midi);
                            uniqueNotes.push(item);
                        }
                    });
                    notesToPlay = uniqueNotes;

                } else if (appMode === "arpeggio") {
                    const opens = generateArpeggioOpenNotes();
                    opens.forEach(op => {
                        const baseMidi = getStringBaseMIDI(tuning[op.s], op.s, numStrings);
                        notesToPlay.push({ s: op.s, f: 0, midi: baseMidi });
                    });

                    const frets = generateArpeggioRenderDots();
                    frets.forEach(fr => {
                        const baseMidi = getStringBaseMIDI(tuning[fr.s], fr.s, numStrings);
                        notesToPlay.push({ s: fr.s, f: fr.f, midi: baseMidi + fr.f });
                    });

                    notesToPlay.sort((a, b) => a.midi - b.midi);

                    const uniqueNotes = [];
                    const seenMidi = new Set();
                    notesToPlay.forEach(item => {
                        if (!seenMidi.has(item.midi)) {
                            seenMidi.add(item.midi);
                            uniqueNotes.push(item);
                        }
                    });
                    notesToPlay = uniqueNotes;
                }

                if (notesToPlay.length === 0) {
                    showToast("No hay notas activas para reproducir");
                    return;
                }

                setIsPlayingSequence(true);

                notesToPlay.forEach((item, index) => {
                    const delay = (index * strumSpeed) / 1000;
                    synthInstance.playNote(item.midi, 1.1, delay);

                    setTimeout(() => {
                        setNotePulse({ s: item.s, f: item.f });
                    }, index * strumSpeed);
                });

                setTimeout(() => {
                    setIsPlayingSequence(false);
                    setNotePulse(null);
                }, notesToPlay.length * strumSpeed + 400);
            };

            // --- LEYENDA DINÁMICA DE INTERVALOS ---
            const renderIntervalLegend = () => {
                if (appMode === "chord" || !showLegend) return null;

                const rootPitch = appMode === "scale" ? scaleRoot : arpeggioRoot;
                const activeIntervals = appMode === "scale" ? getActiveScaleIntervals() : getActiveArpeggioIntervals();

                const degreeNames = [
                    "Tónica / Raíz", "Segunda menor", "Segunda mayor", "Tercera menor", "Tercera mayor",
                    "Cuarta justa", "Quinta disminuida", "Quinta justa", "Sexta menor", "Sexta mayor",
                    "Séptima menor", "Séptima mayor"
                ];

                const items = [];
                activeIntervals.forEach((isActive, semitoneOffset) => {
                    if (isActive) {
                        const notePitch = (rootPitch + semitoneOffset) % 12;
                        const noteName = NOTE_NAMES[notePitch];
                        const degreeStr = INTERVAL_DEGREES[semitoneOffset];
                        const degreeName = degreeNames[semitoneOffset];
                        const color = getIntervalColor(degreeStr);

                        items.push({
                            degreeStr,
                            degreeName,
                            noteName,
                            color
                        });
                    }
                });

                return (
                    <div class="w-full xl:w-60 bg-slate-900/90 border border-slate-800 rounded-2xl p-4 space-y-3 shrink-0 shadow-lg self-stretch xl:self-auto transition-all">
                        <h4 class="text-xs font-bold text-slate-350 uppercase tracking-widest border-b border-slate-800 pb-2 flex items-center justify-between w-full">
                            <span class="flex items-center gap-2">
                                <span class="w-2.5 h-2.5 rounded-full bg-indigo-500 animate-pulse"></span>
                                Leyenda de Intervalos
                            </span>
                            <button 
                                onClick={() => setShowLegend(false)}
                                class="text-slate-400 hover:text-white font-extrabold text-xs p-1 rounded hover:bg-slate-800/80 transition-colors"
                                title="Ocultar leyenda"
                            >
                                ✕
                            </button>
                        </h4>
                        <div class="space-y-2 max-h-[380px] overflow-y-auto pr-1">
                            {items.map((item, idx) => (
                                <div key={idx} class="flex items-center justify-between text-xs py-1.5 border-b border-slate-800/40 last:border-b-0 hover:bg-slate-800/40 px-1.5 rounded-lg transition-colors">
                                    <div class="flex items-center gap-2.5">
                                        <span 
                                            class="w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-black text-white shadow-sm shrink-0"
                                            style={{ backgroundColor: item.color }}
                                        >
                                            {item.degreeStr}
                                        </span>
                                        <div class="flex flex-col">
                                            <span class="font-semibold text-slate-200 text-[11px]">{item.degreeName}</span>
