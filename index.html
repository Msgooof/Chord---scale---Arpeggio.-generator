         * antes en vez de una ficha en blanco. */
        function DiagramaDePaso({ paso, ancho, alto }) {
            let escena = null;
            try { escena = escenaDePaso(paso); } catch (e) { escena = null; }
            if (!escena) return <ExerciseFretboard paso={paso} ancho={ancho} alto={alto} />;
            return <DiagramaKharo escena={escena} ancho={ancho} alto={alto} />;
        }

        /* `Song.normalizeExercise` no conoce la escena y la tira. Este
         * envoltorio se la devuelve a cada paso (saneada). `song-core.js` no
         * se toca porque lo comparten Prime y la 0.1. Los pasos se emparejan
         * por orden: el normalizador conserva los que tienen recorrido, en el
         * mismo orden, y a los que no traen id les inventa uno. */
        function sanearEscena(e) {
            const entero = (n) => Number.isInteger(n) && n >= 0;
            if (!e || typeof e !== "object" || e.v !== 1) return null;
            if (!entero(e.numStrings) || !entero(e.numFrets) || !entero(e.startingFret)) return null;
            if (!Array.isArray(e.afinacion) || !Array.isArray(e.alAire)) return null;
            const posOk = (p) => p && entero(p.s) && entero(p.f);
            if (e.mapa && (!Array.isArray(e.mapa.notas) || !e.mapa.notas.every(posOk))) return null;
            if (e.envolventes && (!Array.isArray(e.envolventes) || !e.envolventes.every(x => Array.isArray(x.zonas)))) return null;
            if (e.acorde && (!Array.isArray(e.acorde.notas) || !Array.isArray(e.acorde.cejillas))) return null;
            const marcaOk = (a) => a && entero(a.s) && (a.nota || ["open", "muted", "none"].includes(a.marca));
            if (!e.alAire.every(marcaOk)) return null;
            return e;
        }

        function normalizarEjercicio(bruto) {
            const limpio = Song.normalizeExercise(bruto);
            const originales = bruto && Array.isArray(bruto.pasos)
                ? bruto.pasos.filter(x => x && Array.isArray(x.path))
                : [];
            limpio.pasos = limpio.pasos.map((p, i) => {
                const escena = originales[i] ? sanearEscena(originales[i].escena) : null;
                return escena ? { ...p, escena } : p;
            });
            return limpio;
        }

        /* El mástil de un paso. No dibuja el mapa entero: dibuja SÓLO las notas
         * del recorrido, que es de lo que trata un ejercicio, y las une con
         * flechas en el orden en que se tocan. */
        function ExerciseFretboard({ paso, ancho, alto }) {
            const est = useDiagramStyle();
            const lw = Math.min(est.lineWidth / 1.5, 2.5);

            const instrumento = getInstrument(paso.instrument);
            const numStrings = instrumento.strings;
            const numFrets = paso.numFrets;

            const W = 300;
            const padX = 34;

            /* CUATRO COSAS SE APILAN ENCIMA DE LA CEJUELA y cada una necesita
             * su carril: el título, los nombres de las cuerdas, las notas al
             * aire y la propia cejuela. Con un margen redondo se pisaban, y en
             * el PDF el título salía por delante de las notas y no se leía
             * ninguno.
             *
             * ESTO NO ES UN MARGEN, ES UNA SUMA. Y ahora el radio de nota lo
             * elige el usuario, así que la suma tiene que calcularse en vez de
             * escribirse: con `dotRadius` a 13 un `padTop` fijo volvería a
             * solapar. Con los valores de fábrica da 72 exacto, que es lo que
             * había antes. */
            const rNota = est.dotRadius * 1.1;              // 11 con el 10 de fábrica
            const fsTitulo = 13, fsCuerda = 9;
            const yTitulo = fsTitulo + 7;                   // 20
            const yNombresCuerda = yTitulo + fsCuerda + 9;  // 38
            const yAlAire = yNombresCuerda + 8 + rNota;     // 57
            const padTop = yAlAire + rNota + 4;             // 72
            const padBottom = 18;
            const altoTraste = Math.max(44, 2 * rNota + 8);
            const H = padTop + numFrets * altoTraste + padBottom;

            const pasoCuerda = (W - padX * 2) / Math.max(1, numStrings - 1);
            const pasoTraste = (H - padTop - padBottom) / numFrets;

            const x = (s) => padX + s * pasoCuerda;
            const y = (f) => f === 0 ? yAlAire : padTop + (f - 0.5) * pasoTraste;

            /* Una cuerda al aire es el traste 0, y si la ventana empieza en el 4
             * ese traste no está en el dibujo. Los pasos guardados antes de esta
             * regla pueden traerlo, así que se filtra aquí también. */
            const enPrimerTraste = (paso.startingFret || 1) === 1;
            const notasDelPaso = enPrimerTraste ? paso.path : paso.path.filter(p => p.f > 0);

            const afinacionMidi = paso.tuningMidi && paso.tuningMidi.length === numStrings
                ? paso.tuningMidi
                : Array.from({ length: numStrings }, (_, i) =>
                    window.KharoTheory.getStringBaseMIDI(paso.tuning, i, paso.instrument));

            const notaDe = (pos) => {
                const abs = pos.f === 0 ? 0 : paso.startingFret + pos.f - 1;
                const midi = afinacionMidi[pos.s] + abs;
                return { midi, pitch: ((midi % 12) + 12) % 12 };
            };

            return (
                <svg
                    viewBox={`0 0 ${W} ${H}`}
                    width={ancho || W}
                    height={alto || undefined}
                    style={alto ? { display: "block" } : { width: "100%", height: "auto", display: "block" }}
                    data-exercise-step="1"
                >
                    <rect width={W} height={H} fill={est.backgroundColor} rx="6" />

                    <text x={W / 2} y={yTitulo} textAnchor="middle" fontFamily={est.fontFamily} fontSize={fsTitulo} fontWeight="800" fill={est.textColor}>
                        {paso.nombre}
                    </text>

                    {/* Cuerdas al aire y cejuela */}
                    {paso.tuning.map((nota, s) => (
                        <text key={`t-${s}`} x={x(s)} y={yNombresCuerda} textAnchor="middle" fontFamily={est.fontFamily} fontSize={fsCuerda} fill={est.textColor} opacity="0.65">
                            {nota}
                        </text>
                    ))}

                    <line x1={padX} y1={padTop} x2={W - padX} y2={padTop}
                        stroke={est.textColor} strokeWidth={(paso.startingFret === 1 ? 3.5 : 1.4) * lw} />

                    {Array.from({ length: numFrets }).map((_, i) => (
                        <line key={`f-${i}`} x1={padX} y1={padTop + (i + 1) * pasoTraste} x2={W - padX} y2={padTop + (i + 1) * pasoTraste}
                            stroke={est.gridColor} strokeWidth={1 * lw} opacity="0.55" />
                    ))}

                    {Array.from({ length: numStrings }).map((_, s) => (
                        <line key={`s-${s}`} x1={x(s)} y1={padTop} x2={x(s)} y2={padTop + numFrets * pasoTraste}
                            stroke={est.gridColor} strokeWidth={1 * lw} opacity="0.55" />
                    ))}

                    {/* Números de traste */}
                    {Array.from({ length: numFrets }).map((_, i) => (
                        <text key={`n-${i}`} x={padX - 10} y={padTop + (i + 0.5) * pasoTraste + 4}
                            textAnchor="end" fontFamily={est.fontFamily} fontSize="10" fill={est.textColor} opacity="0.65">
                            {paso.startingFret + i}
                        </text>
                    ))}

                    {/* El recorrido: primero las flechas, para que queden debajo
                        de las notas y no las tapen. */}
                    {/* --- LA MANCHA DE LA AGRUPACIÓN ---
                        Cuando el paso viene de una tríada de la tonalidad se
                        dibuja como se veía en el mástil: envuelto en su color y
                        SIN FLECHAS. De una forma no importa en qué orden se
                        toca —importa dónde está la mano—, y las flechas ahí
                        sobran. El recorrido es para las escalas. */}
                    {paso.envolvente && zonasDeUnGrado(notasDelPaso).map((zona, zi) => {
                        /* UNA MANCHA POR AGRUPACIÓN, no una que las envuelva
                         * todas. Con «todo el grado» son once notas repartidas
                         * por el mástil, y un solo casco alrededor de todas es
                         * una sábana que no dice nada. Se reparte igual que en
                         * el mástil —misma función—, así que la ficha se ve como
                         * se veía al elegirla. */
                        const mancha = trazoDeMancha(zona.map(p => ({ x: x(p.s), y: y(p.f) })));
                        if (!mancha) return null;
                        return (
                            <path
                                key={`z-${zi}`}
                                d={mancha.d}
                                fill={mancha.cerrado ? paso.envolvente.color : "none"}
                                stroke={paso.envolvente.color}
                                strokeWidth="30"
                                strokeLinejoin="round"
                                strokeLinecap="round"
                                opacity="0.22"
                            />
                        );
                    })}

                    {!paso.envolvente && notasDelPaso.slice(0, -1).map((pos, i) => {
                        const a = { x: x(pos.s), y: y(pos.f) };
                        const b = { x: x(notasDelPaso[i + 1].s), y: y(notasDelPaso[i + 1].f) };
                        const dx = b.x - a.x, dy = b.y - a.y;
                        const largo = Math.hypot(dx, dy);
                        if (largo < 18) return null;

                        const ux = dx / largo, uy = dy / largo;
                        const m = 13;
                        const x2 = b.x - ux * m, y2 = b.y - uy * m;
                        const px = -uy, py = ux;
                        // En sweep la mano no salta: cruzar de cuerda es parte
                        // del mismo movimiento, así que la línea va entera.
                        const salto = !paso.sweep && pos.s !== notasDelPaso[i + 1].s;

                        return (
                            <g key={`p-${i}`} opacity={salto ? 0.4 : 0.85}>
                                <line x1={a.x + ux * m} y1={a.y + uy * m} x2={x2} y2={y2}
                                    stroke={est.pathColor} strokeWidth={1.4 * lw}
                                    strokeDasharray={salto ? "4 3" : undefined} strokeLinecap="round" />
                                <polygon
                                    points={`${x2},${y2} ${x2 - ux * 6 + px * 3.5},${y2 - uy * 6 + py * 3.5} ${x2 - ux * 6 - px * 3.5},${y2 - uy * 6 - py * 3.5}`}
                                    fill={est.pathColor} />
                            </g>
                        );
                    })}

                    {notasDelPaso.map((pos, i) => {
                        const { pitch } = notaDe(pos);
                        // En un paso libre no hay tónica que señalar.
                        const esTonica = paso.root !== null && pitch === paso.root;
                        return (
                            <g key={`d-${i}`}>
                                <circle cx={x(pos.s)} cy={y(pos.f)} r={rNota}
                                    fill={esTonica ? est.intervalColors["1"] : est.baseFingerColor} />
                                {/* La de tapping, con el mismo aro que en el mástil:
                                    una ficha de ejercicio que no distingue la mano
                                    derecha no se puede practicar. */}
                                {pos.tap && (
                                    <circle cx={x(pos.s)} cy={y(pos.f)} r={rNota + 3.5}
                                        fill="none" stroke={esTonica ? est.intervalColors["1"] : est.baseFingerColor}
                                        strokeWidth="1.6" strokeDasharray="2 2" />
                                )}
                                <text x={x(pos.s)} y={y(pos.f) + 3.5} textAnchor="middle"
                                    fontFamily={est.fontFamily} fontSize="9" fontWeight="700" fill={est.dotTextColor}>
                                    {NOTE_NAMES[pitch]}
                                </text>
                            </g>
                        );
                    })}

                    {paso.sweep && (
                        <text x={W - padX} y={H - 4} textAnchor="end" fontFamily={est.fontFamily} fontSize="9" fill={est.textColor} opacity="0.65">
                            sweep · una nota por cuerda
                        </text>
                    )}
                </svg>
            );
        }

        function ExerciseEditor({
            exercise, setExercise,
            isPlaying, onPlay, onStop, pasoSonando,
            onExport, onNuevo, onCargarEnMastil,
            exercises, onAbrirEjercicio, onDuplicarEjercicio, onBorrarEjercicio, onBorrarTodosLosEjercicios,
            onCopia, onImportar, onAviso, onBiblioteca, onATablatura
        }) {
            const [gestorAbierto, setGestorAbierto] = useState(false);
            const [menuPaso, setMenuPaso] = useState(null);
            const porNota = Song.noteSeconds(exercise.bpm, exercise.subdivision);
            const duracion = Song.formatDuration(Song.exerciseSeconds(exercise));

            const actualizarPaso = (id, parche) => {
                setExercise(prev => ({
                    ...prev,
                    pasos: prev.pasos.map(p => p.id === id ? { ...p, ...parche } : p)
                }));
            };

            /* Duplicar un paso. Un ejercicio suele ser la misma forma en
             * cuatro posiciones: sin esto hay que volver al mástil y rehacerla
             * entera cada vez. */
            const duplicarPaso = (i) => {
                setExercise(prev => {
                    const pasos = prev.pasos.slice();
                    const copia = JSON.parse(JSON.stringify(pasos[i]));
                    copia.id = `paso-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`;
                    pasos.splice(i + 1, 0, copia);
                    return { ...prev, pasos };
                });
            };

            const moverPaso = (i, delta) => {
                const destino = i + delta;
                if (destino < 0 || destino >= exercise.pasos.length) return;
                setExercise(prev => {
                    const pasos = prev.pasos.slice();
                    const [movido] = pasos.splice(i, 1);
                    pasos.splice(destino, 0, movido);
                    return { ...prev, pasos };
                });
            };

            /* --- 0.2: DESHACER EN EL EJERCICIO -------------------------------
             * Igual que en la canción: mismo historial y mismo respiro. */
            const historialEj = useHistorial(exercise, (f) => setExercise(f), 400);
            const deshacerEj = (rehacer) => {
                const hecho = rehacer ? historialEj.rehacer() : historialEj.deshacer();
                if (onAviso) onAviso(hecho
                    ? (rehacer ? "Rehecho" : "Deshecho")
                    : (rehacer ? "Nada que rehacer" : "Nada que deshacer"));
            };
            useEffect(() => {
                const alPulsar = (e) => {
                    if (!(e.ctrlKey || e.metaKey)) return;
                    const tecla = (e.key || "").toLowerCase();
                    if (tecla !== "z" && tecla !== "y") return;
                    const foco = document.activeElement;
                    if (foco && (foco.tagName === "INPUT" || foco.tagName === "TEXTAREA" || foco.isContentEditable)) return;
                    e.preventDefault();
                    deshacerEj(tecla === "y" || e.shiftKey);
                };
                window.addEventListener("keydown", alPulsar);
                return () => window.removeEventListener("keydown", alPulsar);
            });

            const [vistaMovil, setVistaMovil] = useState("editar");
            const [confirmarImport, setConfirmarImport] = useState(false);

            const quitarPaso = (paso) => {
                setExercise(prev => ({ ...prev, pasos: prev.pasos.filter(x => x.id !== paso.id) }));
                if (onAviso) onAviso(`Paso «${paso.nombre}» quitado`, { texto: "Deshacer", alPulsar: () => historialEj.deshacer() });
            };

            const accionesDePaso = (paso, i) => [
                { label: "Abrirlo en el mástil", hacer: () => onCargarEnMastil(paso), ayuda: "Para retocar la digitación o el recorrido" },
                { label: "Duplicar", hacer: () => duplicarPaso(i) },
                ...(onATablatura ? [{ label: "Pasar a una tablatura", hacer: () => onATablatura([paso], paso.nombre) }] : []),
                { label: "Mover antes", hacer: () => moverPaso(i, -1), desactivada: i === 0 },
                { label: "Mover después", hacer: () => moverPaso(i, +1), desactivada: i === exercise.pasos.length - 1 },
                { label: "Quitar del ejercicio", hacer: () => quitarPaso(paso), estilo: { color: 'var(--k-danger)' } }
            ];

            const accionesEjercicio = [
                { label: `Mis ejercicios (${exercises.length})`, hacer: () => setGestorAbierto(true) },
                ...(onBiblioteca ? [{ label: "Ver en la Biblioteca", hacer: onBiblioteca }] : []),
                ...(onATablatura ? [{ label: "Pasar a una tablatura", ayuda: "Todos los pasos, una nota por corchea", hacer: () => onATablatura(exercise.pasos, exercise.title) }] : []),
                { label: "Nuevo ejercicio", hacer: onNuevo },
                { label: "Duplicar este ejercicio", hacer: () => onDuplicarEjercicio(exercise.id) },
                { label: "Guardar copia de seguridad", ayuda: "Un archivo JSON con este ejercicio", hacer: onCopia },
                { label: "Cargar una copia de seguridad…", hacer: () => setConfirmarImport(true) }
            ];

            return (
                <div class="k2-doc">
                    <div class="k2-doc__cabeza">
                        <div class="k2-doc__fila">
                            <div class="k2-doc__titulo">
                                <Campo etiqueta="Título">
                                    {(id) => <input id={id} type="text" value={exercise.title} onChange={(e) => setExercise(prev => ({ ...prev, title: e.target.value }))} />}
                                </Campo>
                            </div>
                            <div class="k2-doc__corto">
                                <Campo etiqueta="Tempo (bpm)">
                                    {(id) => (
                                        <input id={id} type="number" min="30" max="300" value={exercise.bpm}
                                            onChange={(e) => setExercise(prev => ({ ...prev, bpm: Math.max(30, Math.min(300, parseInt(e.target.value) || 80)) }))} />
                                    )}
                                </Campo>
                            </div>
                            <div class="k2-doc__medio">
                                <Campo etiqueta="Notas por pulso" ayuda={`${(1 / porNota).toFixed(1)} notas por segundo`}>
                                    {(id, ayuda) => (
                                        <select id={id} aria-describedby={ayuda} value={exercise.subdivision} onChange={(e) => setExercise(prev => ({ ...prev, subdivision: e.target.value }))}>
                                            {Song.SUBDIVISIONES.map(x => <option key={x.id} value={x.id}>{x.name}</option>)}
                                        </select>
                                    )}
                                </Campo>
                            </div>
                        </div>
                        <div class="k2-doc__fila k2-doc__controles">
                            <button type="button" onClick={isPlaying ? onStop : () => onPlay()} disabled={exercise.pasos.length === 0}
                                class={`k-btn k-btn--touch k2-boton-texto ${isPlaying ? "k-btn--danger" : "k-btn--primary"}`}>
                                <Icono nombre={isPlaying ? "parar" : "reproducir"} />
                                <span>{isPlaying ? "Parar" : "Practicar"}</span>
                            </button>
                            <BotonIcono icono="repetir" etiqueta="Repetir en bucle" activo={exercise.loop} onClick={() => setExercise(prev => ({ ...prev, loop: !prev.loop }))} variante="borde" />
                            <div class="k2-doc__empuje"></div>
                            <BotonIcono icono="deshacer" etiqueta="Deshacer (Ctrl+Z)" onClick={() => deshacerEj(false)} disabled={!historialEj.hayQueDeshacer} />
                            <BotonIcono icono="rehacer" etiqueta="Rehacer (Ctrl+Shift+Z)" onClick={() => deshacerEj(true)} disabled={!historialEj.hayQueRehacer} />
                            <MenuAcciones etiqueta="Más acciones del ejercicio" titulo={exercise.title || "Ejercicio"} opciones={accionesEjercicio} variante="borde" />
                        </div>
                    </div>

                    <div class="k2-doc__alternar">
                        <Segmentado etiqueta="Ver" ancho valor={vistaMovil} onCambio={setVistaMovil}
                            opciones={[{ id: "editar", label: "Editar" }, { id: "hoja", label: "Ver la ficha" }]} />
                    </div>

                    <div class={`k2-doc__rejilla k2-doc__rejilla--${vistaMovil}`}>
                        <div class="k2-doc__editor">
                            {gestorAbierto && (
                                <GestorArchivos
                                    titulo="Tus ejercicios"
                                    nuevo="+ Nuevo ejercicio"
                                    abierto="abierto"
                                    elementos={exercises}
                                    activoId={exercise.id}
                                    resumen={(e) => `${e.pasos.length} ${e.pasos.length === 1 ? "paso" : "pasos"} · ${e.bpm} bpm`}
                                    onAbrir={onAbrirEjercicio}
                                    onNuevo={onNuevo}
                                    onDuplicar={onDuplicarEjercicio}
                                    onBorrar={onBorrarEjercicio}
                                    onBorrarTodo={onBorrarTodosLosEjercicios}
                                    onCerrar={() => setGestorAbierto(false)}
                                />
                            )}

                            <section class="k2-tarjeta k2-tarjeta--plegable">
                                <Seccion id="ejercicio-pasos" titulo={<span class="k2-paso">Los pasos <span class="k-chip">{exercise.pasos.length}</span> <span class="k-chip">{duracion}</span></span>}>

                                {exercise.pasos.length === 0 ? (
                                    <p class="k2-intro">
                                        Aquí se guardan los pasos de tu ejercicio. Nadie nace con callos: ve a Escalas, Arpegios o Libre,
                                        monta la digitación con su recorrido y toca «Mandar a Ejercicios».
                                    </p>
                                ) : (
                                    <ol class="k2-pasos">
                                        {exercise.pasos.map((paso, i) => (
                                            <li
                                                key={paso.id}
                                                class={`k2-paso-card ${pasoSonando === paso.id ? "k2-paso-card--sonando" : ""}`}
                                                onContextMenu={(e) => { e.preventDefault(); setMenuPaso({ paso, i, x: e.clientX, y: e.clientY }); }}
                                            >
                                                <div class="k2-paso-card__cabeza">
                                                    <span class="k2-paso__num">{i + 1}</span>
                                                    <input
                                                        type="text"
                                                        value={paso.nombre}
                                                        aria-label={`Nombre del paso ${i + 1}`}
                                                        onChange={(e) => actualizarPaso(paso.id, { nombre: e.target.value })}
                                                        class="k-field flex-1 min-w-0 px-2 k-text-sm font-bold"
                                                    />
                                                    <BotonIcono
                                                        icono="mas"
                                                        etiqueta={`Más acciones del paso ${i + 1}`}
                                                        variante="borde"
                                                        onClick={(e) => { const r = e.currentTarget.getBoundingClientRect(); setMenuPaso({ paso, i, x: r.left - 160, y: r.bottom + 4 }); }}
                                                        extra={{ "aria-haspopup": "menu" }}
                                                    />
                                                </div>

                                                <DiagramaDePaso paso={paso} />

                                                <div class="k2-paso-card__pie">
                                                    <Campo etiqueta="Repeticiones" enLinea>
                                                        {(id) => (
                                                            <input id={id} type="number" min="1" max="16" value={paso.repeticiones}
                                                                onChange={(e) => actualizarPaso(paso.id, { repeticiones: Math.max(1, parseInt(e.target.value) || 1) })}
                                                                class="k2-numero-corto" />
                                                        )}
                                                    </Campo>
                                                    <span class="k-chip">{paso.path.length} notas</span>
                                                    <BotonIcono icono="abrir" etiqueta={`Abrir el paso ${i + 1} en el mástil`} onClick={() => onCargarEnMastil(paso)} />
                                                </div>
                                            </li>
                                        ))}
                                    </ol>
                                )}

                                {menuPaso && (
                                    <MenuContextualAccesible
                                        x={menuPaso.x}
                                        y={menuPaso.y}
                                        titulo={menuPaso.paso.nombre}
                                        onCerrar={() => setMenuPaso(null)}
                                        opciones={accionesDePaso(menuPaso.paso, menuPaso.i)}
                                    />
                                )}
                                </Seccion>
                            </section>

                            <section class="k2-tarjeta k2-tarjeta--plegable">
                                <Seccion id="ejercicio-nota" titulo={<span class="k2-paso">Nota del ejercicio</span>} abiertaPorDefecto={false}>
                                    <Campo etiqueta="Nota del ejercicio">
                                        {(id) => <input id={id} type="text" value={exercise.notes} onChange={(e) => setExercise(prev => ({ ...prev, notes: e.target.value }))} placeholder="Ej.: con metrónomo, sube 5 bpm cada día" />}
                                    </Campo>
                                </Seccion>
                            </section>
                        </div>

                        <aside class="k2-doc__hoja" aria-labelledby="k2-la-ficha">
                            <div class="k2-tarjeta k2-hoja-controles">
                                <h2 id="k2-la-ficha" class="k2-paso">La ficha</h2>
                                <p class="k2-ayuda">Es exactamente lo que se descarga.</p>
                                <div class="k2-bloque">
                                    <span class="k2-etiqueta">Exportar la ficha</span>
                                    <div class="k2-fila-botones">
                                        <button type="button" disabled={exercise.pasos.length === 0} onClick={() => onExport("png")} class="k-btn k-btn--primary k-btn--touch k2-boton-texto">PNG</button>
                                        <button type="button" disabled={exercise.pasos.length === 0} onClick={() => onExport("svg")} class="k-btn k-btn--outline k-btn--touch k2-boton-texto">SVG</button>
                                        <button type="button" disabled={exercise.pasos.length === 0} onClick={() => onExport("pdf")} class="k-btn k-btn--outline k-btn--touch k2-boton-texto">PDF</button>
                                    </div>
                                </div>
                            </div>
                            {exercise.pasos.length > 0 ? (
                                <div class="k2-hoja-papel"><ExerciseSheet exercise={exercise} /></div>
                            ) : (
                                <p class="k2-ayuda">La ficha aparece en cuanto haya un paso.</p>
                            )}
                        </aside>
                    </div>

                    {confirmarImport && (
                        <Dialogo
                            titulo="Cargar una copia de seguridad"
                            descripcion="El ejercicio del archivo sustituye al que tienes abierto. Si quieres conservar este, guarda antes su copia."
                            ancho="460px"
                            onCerrar={() => setConfirmarImport(false)}
                            acciones={
                                <React.Fragment>
                                    <button type="button" onClick={() => { setConfirmarImport(false); onCopia(); }} class="k-btn k-btn--outline k-btn--touch px-4 py-2.5 k-text-sm">Guardar este antes</button>
                                    <button type="button" onClick={() => { setConfirmarImport(false); onImportar(); }} class="k-btn k-btn--primary k-btn--touch px-4 py-2.5 k-text-sm">Elegir archivo</button>
                                </React.Fragment>
                            }
                        />
                    )}
                </div>
            );
        }

        /* La ficha A4. Misma tinta fija y mismo id de página que la hoja de
         * canción, así que la exportación es exactamente la misma función. */
        function ExerciseSheet({ exercise }) {
            const porFila = 3;
            const anchoDiagrama = 232;
            const altoDiagrama = 300;
            const porPagina = porFila * 3;
            const paginas = [];
            for (let i = 0; i < exercise.pasos.length; i += porPagina) {
                paginas.push(exercise.pasos.slice(i, i + porPagina));
            }
            if (paginas.length === 0) paginas.push([]);

            const porNota = Song.noteSeconds(exercise.bpm, exercise.subdivision);

            return (
                <div class="space-y-4">
                    {paginas.map((pasos, ip) => (
                        <svg
                            key={ip}
                            id={`song-sheet-page-${ip}`}
                            data-song-sheet="1"
                            width={HOJA.ancho}
                            height={HOJA.alto}
                            viewBox={`0 0 ${HOJA.ancho} ${HOJA.alto}`}
                            class="k-sheet-page"
                        >
                            <rect width={HOJA.ancho} height={HOJA.alto} fill={HOJA.papel} />

                            <text x={HOJA.ancho / 2} y={78} textAnchor="middle" fontFamily={SANS_FAMILIA} fontSize="34" fontWeight="800" fill={HOJA.tinta}>
                                {exercise.title || "Ejercicio"}
                            </text>
                            <text x={HOJA.margenX} y={110} fontFamily={SANS_FAMILIA} fontSize="12" fill={HOJA.tintaSuave}>
                                {[
                                    exercise.bpm + " bpm",
                                    Song.getSubdivision(exercise.subdivision).name,
                                    (1 / porNota).toFixed(1) + " notas por segundo",
                                    Song.formatDuration(Song.exerciseSeconds(exercise))
                                ].join("   ·   ")}
                            </text>
                            {exercise.notes && (
                                <text x={HOJA.ancho - HOJA.margenX} y={110} textAnchor="end" fontFamily={SANS_FAMILIA} fontSize="11" fontStyle="italic" fill={HOJA.tintaSuave}>
                                    {exercise.notes}
                                </text>
                            )}
                            <rect x={HOJA.margenX} y={122} width={HOJA.ancho - HOJA.margenX * 2} height={2} fill={HOJA.tinta} />

                            {pasos.map((paso, i) => {
                                const col = i % porFila;
                                const fila = Math.floor(i / porFila);
                                return (
                                    <g key={paso.id} transform={`translate(${HOJA.margenX + col * (anchoDiagrama + 16)}, ${150 + fila * (altoDiagrama + 24)})`}>
                                        <DiagramaDePaso paso={paso} ancho={anchoDiagrama} alto={altoDiagrama} />
                                        <text x={anchoDiagrama / 2} y={altoDiagrama + 14} textAnchor="middle" fontFamily={SANS_FAMILIA} fontSize="10" fill={HOJA.tintaSuave}>
                                            {(ip * porPagina) + i + 1}. {paso.repeticiones > 1 ? "×" + paso.repeticiones + "  ·  " : ""}{paso.path.length} notas
                                        </text>
                                    </g>
                                );
                            })}

                            <text x={HOJA.ancho / 2} y={HOJA.alto - 28} textAnchor="middle" fontFamily={SANS_FAMILIA} fontSize="10" fill={HOJA.tintaSuave}>
                                {ip + 1} / {paginas.length}   ·   Kharo Studio
                            </text>
                        </svg>
                    ))}
                </div>
            );
        }
    </script>

    <!-- ===================================================================
         BLOQUE 3 de 3: EL ESTUDIO DE DIAGRAMAS
         ===================================================================
         El componente App: estado, interacción con el mástil, dibujo del SVG
         y los paneles. Termina montando la aplicación.
         =================================================================== -->
    <!-- ===================================================================
         0.3 · TABLATURAS
         =================================================================== -->
    <script type="text/plain" id="app-source-tab">
        /* =====================================================================
         * TABLATURAS (0.3)
         *
         * Pentagrama y TAB enlazados, como en MuseScore pero en pequeño: se
         * escribe en la TAB (cuerda y traste) y el pentagrama sale solo. El
         * cálculo vive en tab-core.js; aquí sólo se pinta y se escribe.
         *
         * Todo en SVG propio, sin fuentes musicales: los glifos (claves,
         * silencios, corchetes, alteraciones) son trazos. Así el SVG, el PNG y
         * el PDF salen idénticos en cualquier ordenador.
         * ===================================================================== */
        const Tab = window.KharoTab;

        // Los glifos, en unidades de ESPACIO del pentagrama (1 = un espacio).
        // El origen de las claves es la línea de arriba.
        const GLIFOS = {
            claveSol: "M1.55 3.05 C1.0 3.05 0.85 2.45 1.35 2.2 C2.05 1.85 2.65 2.55 2.35 3.3 C1.95 4.15 0.35 4.05 0.15 3.0 C-0.05 1.95 1.2 1.2 1.9 0.35 C2.5 -0.4 2.45 -1.65 1.85 -1.65 C1.25 -1.65 1.1 -0.6 1.3 0.5 L1.95 4.95 C2.05 5.65 1.5 5.95 1.0 5.7",
            claveFa: "M0.35 1.2 C0.3 0.3 1.2 -0.1 1.95 0.3 C2.75 0.8 2.55 2.2 0.4 3.6",
            silencioNegra: "M0.35 0.9 L1.15 1.8 L0.5 2.45 L1.15 3.05 C0.6 2.85 0.3 3.25 0.85 3.65",
            sostenido: "M0.35 -1.3 L0.35 1.5 M0.95 -1.5 L0.95 1.3 M0 -0.25 L1.3 -0.6 M0 0.65 L1.3 0.3",
            bemol: "M0.2 -1.9 L0.2 0.7 C0.75 0.35 1.35 0.0 1.05 -0.45 C0.8 -0.75 0.4 -0.45 0.2 -0.15",
            becuadro: "M0.25 -1.5 L0.25 0.75 L1.05 0.55 M1.05 1.5 L1.05 -0.75 L0.25 -0.55",
            puaAbajo: "M0 8 L0 0 L9 0 L9 8",
            puaArriba: "M0 0 L4.5 9 L9 0"
        };

        const tinta = HOJA.tinta;

        /* Una figura dibujada en pequeño, para los botones de la paleta. */
        function IconoFigura({ dur, tam }) {
            const t = tam || 22;
            const relleno = dur !== "1" && dur !== "2";
            const plica = dur !== "1";
            const corchetes = Tab.barrasDe(dur);
            return (
                <svg width={t} height={t} viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <ellipse cx="9" cy="18" rx="4.4" ry="3.2" transform="rotate(-20 9 18)"
                        fill={relleno ? "currentColor" : "none"} stroke="currentColor" strokeWidth="1.8" />
                    {plica && <path d="M13 17.5 V3" stroke="currentColor" strokeWidth="1.8" />}
                    {Array.from({ length: corchetes }, (_, i) => (
                        <path key={i} d={`M13 ${3 + i * 4} C14 ${6 + i * 4} 19 ${7 + i * 4} 17.5 ${12 + i * 4}`} fill="none" stroke="currentColor" strokeWidth="1.8" />
                    ))}
                </svg>
            );
        }

        /* --- UN SISTEMA -------------------------------------------------------
         * Pentagrama arriba, TAB abajo, compases de un lado a otro. Es lo que
         * se repite en la hoja y lo que se ve en la miniatura de la Biblioteca. */
        function SistemaTab({ tab, sistema, lay, sonando, cursor, editable }) {
            const m = Tab.MEDIDAS;
            const esp = m.esp;
            const cuerdas = lay.cuerdas;
            const clave = Tab.claveDe(tab.instrument);
            const afinacion = Tab.afinacionMidi(tab);
            const armAlt = Tab.alteracionesDeLaArmadura(tab.armadura);
            const yP = (p) => sistema.yPentagramaAbajo - p * esp / 2;
            const yC = (s) => Tab.yDeCuerda(sistema, s, cuerdas);
            const x0 = sistema.x0, x1 = sistema.x1;
            const g = [];
            const k = (() => { let n = 0; return (p) => `${p}${n++}`; })();

            /* --- Las líneas --- */
            for (let i = 0; i < 5; i++) {
                g.push(<line key={k("pl")} x1={x0} x2={x1} y1={sistema.yPentagrama + i * esp} y2={sistema.yPentagrama + i * esp} stroke={tinta} strokeWidth="0.9" />);
            }
            for (let s = 0; s < cuerdas; s++) {
                g.push(<line key={k("tl")} x1={x0} x2={x1} y1={yC(s)} y2={yC(s)} stroke={tinta} strokeWidth="0.8" />);
            }
            // La llave del sistema: une pentagrama y TAB al principio.
            g.push(<line key={k("ini")} x1={x0} x2={x0} y1={sistema.yPentagrama} y2={sistema.yTabAbajo} stroke={tinta} strokeWidth="1.4" />);

            /* --- La cabeza: clave, armadura, compás, TAB --- */
            const yTop = sistema.yPentagrama;
            if (clave.id === "sol") {
                g.push(<path key={k("cs")} d={GLIFOS.claveSol} transform={`translate(${x0 + 6} ${yTop}) scale(${esp})`} fill="none" stroke={tinta} strokeWidth={0.2} strokeLinecap="round" />);
                g.push(<circle key={k("csp")} cx={x0 + 6 + esp * 0.95} cy={yTop + esp * 5.55} r={esp * 0.3} fill={tinta} />);
            } else {
                g.push(<path key={k("cf")} d={GLIFOS.claveFa} transform={`translate(${x0 + 6} ${yTop}) scale(${esp})`} fill="none" stroke={tinta} strokeWidth={0.24} strokeLinecap="round" />);
                g.push(<circle key={k("cfp")} cx={x0 + 6 + esp * 0.45} cy={yTop + esp * 1.2} r={esp * 0.32} fill={tinta} />);
                g.push(<circle key={k("cf1")} cx={x0 + 6 + esp * 2.95} cy={yTop + esp * 0.55} r={esp * 0.17} fill={tinta} />);
                g.push(<circle key={k("cf2")} cx={x0 + 6 + esp * 2.95} cy={yTop + esp * 1.45} r={esp * 0.17} fill={tinta} />);
            }
            if (clave.octava) {
                const yOcho = clave.id === "sol" ? yTop + esp * 6.9 : yTop + esp * 4.9;
                g.push(<text key={k("8")} x={x0 + 6 + esp * (clave.id === "sol" ? 1.1 : 1.3)} y={yOcho} textAnchor="middle" fontFamily={SANS_FAMILIA} fontSize="8" fill={tinta}>8</text>);
            }
            // TAB, en vertical.
            const altoTab = (cuerdas - 1) * m.tabEsp;
            const tamTab = Math.min(13, altoTab / 3.2);
            ["T", "A", "B"].forEach((l, i) => {
                g.push(<text key={k("tab")} x={x0 + 14} y={sistema.yTab + altoTab / 2 + (i - 1) * tamTab * 1.05 + tamTab * 0.36} textAnchor="middle" fontFamily={SANS_FAMILIA} fontWeight="800" fontSize={tamTab} fill={tinta}>{l}</text>);
            });
            {
                // Armadura: sostenidos o bemoles en su altura de siempre. Va
                // en todos los sistemas; el compás, sólo en el primero.
                const n = Math.abs(tab.armadura);
                const sos = tab.armadura > 0;
                // Posición en la clave de sol (desde la línea de abajo) de cada
                // alteración de la armadura; en fa, dos escalones más abajo.
                const POS_SOS = [8, 5, 9, 6, 3, 7, 4], POS_BEM = [4, 7, 3, 6, 2, 5, 1];
                const desplazar = clave.id === "fa" ? -2 : 0;
                for (let i = 0; i < n; i++) {
                    const p = (sos ? POS_SOS : POS_BEM)[i] + desplazar;
                    g.push(<path key={k("arm")} d={sos ? GLIFOS.sostenido : GLIFOS.bemol} transform={`translate(${x0 + 32 + i * 7} ${yP(p)}) scale(${esp * 0.62})`} fill="none" stroke={tinta} strokeWidth={0.22} />);
                }
                const c = Tab.compasDe(tab.compas);
                const xc = x0 + 38 + n * 7 + 8;
                if (sistema.primero) {
                g.push(<text key={k("cn")} x={xc} y={yTop + esp * 1.85} textAnchor="middle" fontFamily={SANS_FAMILIA} fontWeight="900" fontSize={esp * 2.3} fill={tinta}>{c.num}</text>);
                g.push(<text key={k("cd")} x={xc} y={yTop + esp * 3.85} textAnchor="middle" fontFamily={SANS_FAMILIA} fontWeight="900" fontSize={esp * 2.3} fill={tinta}>{c.den}</text>);
                }
            }

            /* --- Los compases --- */
            const tramosPM = Tab.tramos(tab, sistema, "pm");
            const tramosLR = Tab.tramos(tab, sistema, "letRing");
            const tramosSw = Tab.tramos(tab, sistema, "sweep");
            const filaUno = sistema.yBandaMedia + 9;
            const filaDos = sistema.yBandaMedia + 22;

            sistema.compases.forEach((cm, iCm) => {
                const compas = tab.compases[cm.indice];
                const ultimoDeTodo = cm.indice === tab.compases.length - 1;

                // Barra de compás (doble y gruesa al final de la obra).
                const barra = (x, grueso) => {
                    g.push(<line key={k("b")} x1={x} x2={x} y1={sistema.yPentagrama} y2={sistema.yPentagramaAbajo} stroke={tinta} strokeWidth={grueso ? 3 : 1} />);
                    g.push(<line key={k("b")} x1={x} x2={x} y1={sistema.yTab} y2={sistema.yTabAbajo} stroke={tinta} strokeWidth={grueso ? 3 : 1} />);
                };
                if (ultimoDeTodo) { barra(cm.x1 - 4, false); barra(cm.x1 - 0.5, true); }
                else barra(cm.x1, false);

                // Número de compás, a la izquierda de cada sistema.
                if (iCm === 0) {
                    g.push(<text key={k("nc")} x={cm.x0 - (sistema.primero ? 0 : 0)} y={sistema.yPentagrama - 8} fontFamily={SANS_FAMILIA} fontSize="8" fontStyle="italic" fill={HOJA.tintaSuave}>{cm.indice + 1}</text>);
                }

                // Compás vacío: silencio de redonda en medio.
                if (!compas.eventos.length) {
                    const xm = (cm.x0 + cm.x1) / 2;
                    g.push(<rect key={k("sr")} x={xm - esp * 0.6} y={yP(6)} width={esp * 1.2} height={esp * 0.5} fill={tinta} />);
                }

                // Alteraciones: duran el compás.
                const estado = {};
                const grupos = Tab.gruposDeBarras(compas, tab.compas);
                const enGrupo = {};
                grupos.forEach(gr => { if (gr.length > 1) gr.forEach(i => { enGrupo[i] = gr; }); });

                // Primero se calcula la geometría de cada evento del pentagrama;
                // luego se pintan las barras, que necesitan la de todo el grupo.
                const geo = cm.eventos.map(r => {
                    const ev = compas.eventos[r.indice];
                    const notas = ev.notas.map(n => {
                        const midi = Tab.midiDeNota(tab, n, afinacion);
                        const escrito = midi + clave.octava;
                        const d = Tab.deletrear(escrito, tab.armadura);
                        const p = d.diatonico - clave.lineaInferior;
                        const vigente = estado[d.diatonico] !== undefined ? estado[d.diatonico] : armAlt[d.letra];
                        let alter = null;
                        if (vigente !== d.alter) { alter = d.alter; estado[d.diatonico] = d.alter; }
                        return { n, p, alter, muerta: n.tec.muerta, fantasma: n.tec.fantasma };
                    }).sort((a, b) => a.p - b.p);
                    const media = notas.length ? notas.reduce((s, x) => s + x.p, 0) / notas.length : 4;
                    return { r, ev, notas, arriba: media < 4 };
                });

                // Dirección común dentro de cada grupo con barra.
                grupos.forEach(gr => {
                    if (gr.length < 2) return;
                    const ps = [];
                    gr.forEach(i => geo[i].notas.forEach(x => ps.push(x.p)));
                    const arriba = ps.reduce((s, x) => s + x, 0) / ps.length < 4;
                    gr.forEach(i => { geo[i].arriba = arriba; });
                });

                const rx = esp * 0.6, ry = esp * 0.44;
                const plicas = {};

                geo.forEach((ge, ei) => {
                    const { r, ev, notas, arriba } = ge;
                    const fig = ev.dur;
                    const hueca = fig === "1" || fig === "2";

                    // Lo que suena ahora: una franja suave detrás, sólo en pantalla.
                    if (sonando && sonando === ev.id) {
                        g.push(<rect key={k("son")} data-no-exportar="1" x={r.x0} y={sistema.yPentagrama - 18} width={r.ancho} height={sistema.yTabAbajo - sistema.yPentagrama + 30} fill="var(--k-accent)" opacity="0.14" rx="4" />);
                    }

                    if (!notas.length) {
                        // --- Silencios ---
                        const cx = r.x;
                        if (fig === "1") g.push(<rect key={k("s1")} x={cx - esp * 0.6} y={yP(6)} width={esp * 1.2} height={esp * 0.5} fill={tinta} />);
                        else if (fig === "2") g.push(<rect key={k("s2")} x={cx - esp * 0.6} y={yP(4) - esp * 0.5} width={esp * 1.2} height={esp * 0.5} fill={tinta} />);
                        else if (fig === "4") g.push(<path key={k("s4")} d={GLIFOS.silencioNegra} transform={`translate(${cx - esp * 0.75} ${yTop}) scale(${esp})`} fill="none" stroke={tinta} strokeWidth={0.26} strokeLinejoin="round" strokeLinecap="round" />);
                        else {
                            const n = Tab.barrasDe(fig);
                            for (let i = 0; i < n; i++) {
                                const yb = yTop + esp * (1.5 + i);
                                g.push(<circle key={k("sd")} cx={cx - esp * 0.35 - i * esp * 0.25} cy={yb} r={esp * 0.24} fill={tinta} />);
                            }
                            g.push(<path key={k("sl")} d={`M${cx - esp * 0.35} ${yTop + esp * 1.6} Q${cx + esp * 0.2} ${yTop + esp * 1.75} ${cx + esp * 0.55} ${yTop + esp * 1.35} L${cx - esp * 0.15 - (n - 1) * esp * 0.3} ${yTop + esp * (3.1 + (n - 1))}`} fill="none" stroke={tinta} strokeWidth={esp * 0.16} />);
                        }
                        if (ev.puntillo) g.push(<circle key={k("sp")} cx={r.x + esp * 1.1} cy={yP(5)} r={esp * 0.17} fill={tinta} />);
                        return;
                    }

                    // --- Cabezas, desplazando las segundas ---
                    let desplazadaAntes = false;
                    const xs = notas.map((x, i) => {
                        const segunda = i > 0 && x.p - notas[i - 1].p === 1 && !desplazadaAntes;
                        desplazadaAntes = segunda;
                        if (!segunda) return r.x;
                        return arriba ? r.x + rx * 2 - 1 : r.x - rx * 2 + 1;
                    });

                    notas.forEach((x, i) => {
                        const cy = yP(x.p), cx = xs[i];
                        // Líneas adicionales.
                        for (let q = -2; q >= x.p; q -= 2) g.push(<line key={k("la")} x1={cx - rx - 3} x2={cx + rx + 3} y1={yP(q)} y2={yP(q)} stroke={tinta} strokeWidth="0.9" />);
                        for (let q = 10; q <= x.p; q += 2) g.push(<line key={k("la")} x1={cx - rx - 3} x2={cx + rx + 3} y1={yP(q)} y2={yP(q)} stroke={tinta} strokeWidth="0.9" />);
                        if (x.muerta) {
                            g.push(<path key={k("hx")} d={`M${cx - rx * 0.8} ${cy - ry} L${cx + rx * 0.8} ${cy + ry} M${cx - rx * 0.8} ${cy + ry} L${cx + rx * 0.8} ${cy - ry}`} stroke={tinta} strokeWidth="1.4" />);
                        } else {
                            g.push(<ellipse key={k("h")} cx={cx} cy={cy} rx={rx} ry={ry} transform={`rotate(-20 ${cx} ${cy})`}
                                fill={hueca ? "none" : tinta} stroke={tinta} strokeWidth={hueca ? 1.5 : 0.6} />);
                        }
                        if (x.fantasma) {
                            g.push(<text key={k("fp")} x={cx - rx - 4} y={cy + 3.5} textAnchor="middle" fontFamily={SANS_FAMILIA} fontSize="10" fill={tinta}>(</text>);
                            g.push(<text key={k("fp")} x={cx + rx + 4} y={cy + 3.5} textAnchor="middle" fontFamily={SANS_FAMILIA} fontSize="10" fill={tinta}>)</text>);
                        }
                        if (x.alter !== null) {
                            const d = x.alter === 1 ? GLIFOS.sostenido : x.alter === -1 ? GLIFOS.bemol : GLIFOS.becuadro;
                            g.push(<path key={k("alt")} d={d} transform={`translate(${Math.min(...xs) - rx - 11 - (x.fantasma ? 5 : 0)} ${cy}) scale(${esp * 0.62})`} fill="none" stroke={tinta} strokeWidth={0.22} />);
                        }
                        if (ev.puntillo) {
                            const yPunto = x.p % 2 === 0 ? cy - esp / 2 : cy;
                            g.push(<circle key={k("pt")} cx={Math.max(...xs) + rx + 4} cy={yPunto} r={esp * 0.17} fill={tinta} />);
                        }
                    });

                    // --- Plica ---
                    if (fig !== "1") {
                        const bajo = notas[0], alto = notas[notas.length - 1];
                        const xPlica = arriba ? r.x + rx - 0.6 : r.x - rx + 0.6;
                        const yBase = arriba ? yP(bajo.p) : yP(alto.p);
                        let yPunta = arriba ? yP(alto.p) - esp * 3.5 : yP(bajo.p) + esp * 3.5;
                        // Notas muy lejos del pentagrama: la plica llega a la línea del medio.
                        if (arriba && yPunta > yP(4)) yPunta = yP(4);
                        if (!arriba && yPunta < yP(4)) yPunta = yP(4);
                        plicas[ei] = { x: xPlica, yBase, yPunta, arriba };
                        if (!enGrupo[ei]) {
                            g.push(<line key={k("pl")} x1={xPlica} x2={xPlica} y1={yBase} y2={yPunta} stroke={tinta} strokeWidth="1" />);
                            // Corchetes sueltos.
                            const n = Tab.barrasDe(fig);
                            for (let i = 0; i < n; i++) {
                                const y = yPunta + (arriba ? i * esp * 0.8 : -i * esp * 0.8);
                                const s = arriba ? 1 : -1;
                                g.push(<path key={k("co")} d={`M${xPlica} ${y} C${xPlica + esp * 0.2} ${y + s * esp} ${xPlica + esp * 1.3} ${y + s * esp * 1.3} ${xPlica + esp * 0.9} ${y + s * esp * 2.6}`} fill="none" stroke={tinta} strokeWidth="1.3" />);
                            }
                        }
                    }

                    // --- Encima del pentagrama: texto, púa, acento ---
                    if (ev.texto) g.push(<text key={k("tx")} x={r.x - 4} y={sistema.y + 10} fontFamily={SANS_FAMILIA} fontSize="9.5" fontStyle="italic" fill={tinta}>{ev.texto}</text>);
                    if (ev.pua) {
                        g.push(<path key={k("pua")} d={ev.pua === "abajo" ? GLIFOS.puaAbajo : GLIFOS.puaArriba}
                            transform={`translate(${r.x - 4.5} ${sistema.y + 15})`}
                            fill="none" stroke={tinta} strokeWidth={ev.pua === "abajo" ? 1.2 : 1.3} strokeLinejoin="miter"
                            {...(ev.pua === "abajo" ? {} : {})} />);
                        if (ev.pua === "abajo") g.push(<rect key={k("puag")} x={r.x - 4.5} y={sistema.y + 15} width={9} height={2.4} fill={tinta} />);
                    }
                    if (ev.notas.some(n => n.tec.acento)) {
                        // Del lado de la cabeza, el contrario a la plica, fuera del pentagrama.
                        const yAc = arriba
                            ? Math.max(sistema.yPentagramaAbajo, yP(notas[0].p)) + 9
                            : Math.min(sistema.yPentagrama, yP(notas[notas.length - 1].p)) - 9;
                        g.push(<path key={k("ac")} d={`M${r.x - 5} ${yAc - 3} L${r.x + 5} ${yAc} L${r.x - 5} ${yAc + 3}`} fill="none" stroke={tinta} strokeWidth="1.2" />);
                    }
                });

                // --- Barras de corcheas ---
                grupos.forEach(gr => {
                    if (gr.length < 2) return;
                    const ps = gr.map(i => plicas[i]).filter(Boolean);
                    if (ps.length < 2) return;
                    const arriba = ps[0].arriba;
                    const yBarra = arriba ? Math.min(...ps.map(p => p.yPunta)) : Math.max(...ps.map(p => p.yPunta));
                    ps.forEach(p => g.push(<line key={k("pg")} x1={p.x} x2={p.x} y1={p.yBase} y2={yBarra} stroke={tinta} strokeWidth="1" />));
                    const grosor = 3.4, paso = 5.6 * (arriba ? 1 : -1);
                    const yNivel = (nv) => yBarra + nv * paso - (arriba ? 0 : grosor);
                    g.push(<rect key={k("bm")} x={ps[0].x} y={yNivel(0)} width={ps[ps.length - 1].x - ps[0].x + 1} height={grosor} fill={tinta} />);
                    // Barras secundarias (semicorcheas y fusas).
                    [1, 2].forEach(nv => {
                        gr.forEach((ei, j) => {
                            const ev = compas.eventos[geo[ei].r.indice];
                            if (Tab.barrasDe(ev.dur) <= nv) return;
                            const p = plicas[ei];
                            const sig = gr[j + 1] !== undefined ? compas.eventos[geo[gr[j + 1]].r.indice] : null;
                            const ant = gr[j - 1] !== undefined ? compas.eventos[geo[gr[j - 1]].r.indice] : null;
                            if (sig && Tab.barrasDe(sig.dur) > nv) {
                                const p2 = plicas[gr[j + 1]];
                                g.push(<rect key={k("b2")} x={p.x} y={yNivel(nv)} width={p2.x - p.x + 1} height={grosor} fill={tinta} />);
                            } else if (!(ant && Tab.barrasDe(ant.dur) > nv)) {
                                // Sola: un gancho hacia la vecina.
                                const haciaAtras = !sig;
                                g.push(<rect key={k("b3")} x={haciaAtras ? p.x - 7 : p.x} y={yNivel(nv)} width={8} height={grosor} fill={tinta} />);
                            }
                        });
                    });
                });

                // --- Tresillos: un «3» por cada grupo ---
                let acumulado = 0, inicio = null;
                geo.forEach((ge, ei) => {
                    if (!ge.ev.tresillo) { acumulado = 0; inicio = null; return; }
                    if (inicio === null) inicio = ei;
                    acumulado += Tab.figura(ge.ev.dur).ticks;
                    const unidad = Tab.figura(ge.ev.dur).ticks * 3;
                    if (acumulado >= unidad || ei === geo.length - 1 || !geo[ei + 1].ev.tresillo) {
                        const a = geo[inicio].r.x, b = ge.r.x;
                        const yMin = Math.min(sistema.yPentagrama, ...geo.slice(inicio, ei + 1).map(x => x.notas.length ? yP(x.notas[x.notas.length - 1].p) - (x.arriba ? esp * 3.6 : 0) : sistema.yPentagrama)) - 7;
                        g.push(<text key={k("3")} x={(a + b) / 2} y={yMin} textAnchor="middle" fontFamily={SANS_FAMILIA} fontStyle="italic" fontWeight="700" fontSize="10" fill={tinta}>3</text>);
                        acumulado = 0; inicio = null;
                    }
                });

                // --- La TAB: trastes y técnicas ---
                geo.forEach((ge) => {
                    const { r, ev, notas } = ge;
                    ev.notas.forEach(n => {
                        const y = yC(n.s);
                        const t = n.tec;
                        let texto = String(n.f);
                        if (t.muerta) texto = "x";
                        if (t.armonico === "natural") texto = `<${n.f}>`;
                        if (t.fantasma) texto = `(${texto})`;
                        const ancho = texto.length * 6.4 + 3;
                        g.push(<rect key={k("tf")} x={r.x - ancho / 2} y={y - 6} width={ancho} height={12} fill={HOJA.papel} />);
                        g.push(<text key={k("tn")} x={r.x} y={y + 4} textAnchor="middle" fontFamily={SANS_FAMILIA} fontSize="11.5" fontWeight="600" fill={tinta}>{texto}</text>);

                        // Ligados y slides, hasta la siguiente nota en esa cuerda.
                        const sig = (t.ligado || t.slide === "a") ? Tab.siguienteEnCuerda(tab, cm.indice, r.indice, n.s) : null;
                        let xSig = null;
                        if (sig) {
                            const cmSig = sistema.compases.find(c => c.indice === sig.ci);
                            const rSig = cmSig && cmSig.eventos.find(e => e.indice === sig.ei);
                            xSig = rSig ? rSig.x : x1 - 2;
                        }
                        if (t.ligado) {
                            const xa = r.x + 4, xb = (xSig !== null ? xSig : r.x + 28) - 4;
                            g.push(<path key={k("lg")} d={`M${xa} ${y - 7} Q${(xa + xb) / 2} ${y - 17} ${xb} ${y - 7}`} fill="none" stroke={tinta} strokeWidth="1" />);
                            g.push(<text key={k("lt")} x={(xa + xb) / 2} y={y - 15} textAnchor="middle" fontFamily={SANS_FAMILIA} fontWeight="700" fontSize="8.5" fill={tinta}>{t.ligado === "h" ? "H" : "P"}</text>);
                            // Y en el pentagrama, la ligadura de expresión.
                            const nota = notas.find(x => x.n === n);
                            if (nota) {
                                const yn = yP(nota.p);
                                const dir = ge.arriba ? 1 : -1;
                                g.push(<path key={k("lp")} d={`M${xa} ${yn + dir * 6} Q${(xa + xb) / 2} ${yn + dir * 15} ${xb} ${yn + dir * 6}`} fill="none" stroke={tinta} strokeWidth="1" />);
                            }
                        }
                        if (t.slide === "a") {
                            const xa = r.x + ancho / 2 + 1, xb = (xSig !== null ? xSig : r.x + 26) - 7;
                            const sube = sig ? sig.nota.f >= n.f : true;
                            g.push(<line key={k("sl")} x1={xa} x2={xb} y1={y + (sube ? 3.5 : -3.5)} y2={y + (sube ? -3.5 : 3.5)} stroke={tinta} strokeWidth="1.1" />);
                        }
                        if (t.slide === "sube") g.push(<line key={k("sl")} x1={r.x - ancho / 2 - 10} x2={r.x - ancho / 2 - 1} y1={y + 4} y2={y - 3} stroke={tinta} strokeWidth="1.1" />);
                        if (t.slide === "baja") g.push(<line key={k("sl")} x1={r.x + ancho / 2 + 1} x2={r.x + ancho / 2 + 10} y1={y - 3} y2={y + 4} stroke={tinta} strokeWidth="1.1" />);

                        // Bends: flecha curva hasta encima de la TAB, con su medida.
                        if (t.bend) {
                            const tope = sistema.yTab - 12;
                            const etiqueta = ({ 0.5: "½", 1: "full", 1.5: "1½", 2: "2" })[t.bend.cant];
                            const xa = r.x + ancho / 2;
                            const flecha = (x, yy, abajo) => (
                                <path key={k("fl")} d={abajo ? `M${x - 3} ${yy - 5} L${x} ${yy} L${x + 3} ${yy - 5}` : `M${x - 3} ${yy + 5} L${x} ${yy} L${x + 3} ${yy + 5}`} fill={tinta} stroke={tinta} strokeWidth="0.8" />
                            );
                            if (t.bend.tipo === "prebend") {
                                g.push(<line key={k("bd")} x1={r.x} x2={r.x} y1={y - 7} y2={tope} stroke={tinta} strokeWidth="1.1" />);
                                g.push(flecha(r.x, tope, false));
                                g.push(<text key={k("bt")} x={r.x} y={tope - 4} textAnchor="middle" fontFamily={SANS_FAMILIA} fontSize="8.5" fontWeight="700" fill={tinta}>{etiqueta}</text>);
                            } else if (t.bend.tipo === "release") {
                                g.push(<path key={k("bd")} d={`M${xa} ${tope} Q${xa + 10} ${tope} ${xa + 10} ${y - 6}`} fill="none" stroke={tinta} strokeWidth="1.1" />);
                                g.push(flecha(xa + 10, y - 6, true));
                                g.push(<text key={k("bt")} x={xa} y={tope - 4} textAnchor="middle" fontFamily={SANS_FAMILIA} fontSize="8.5" fontWeight="700" fill={tinta}>{etiqueta}</text>);
                            } else {
                                g.push(<path key={k("bd")} d={`M${xa} ${y} Q${xa + 9} ${y} ${xa + 9} ${tope}`} fill="none" stroke={tinta} strokeWidth="1.1" />);
                                g.push(flecha(xa + 9, tope, false));
                                g.push(<text key={k("bt")} x={xa + 9} y={tope - 4} textAnchor="middle" fontFamily={SANS_FAMILIA} fontSize="8.5" fontWeight="700" fill={tinta}>{etiqueta}</text>);
                                if (t.bend.tipo === "bend-release") {
                                    g.push(<path key={k("br")} d={`M${xa + 9} ${tope} Q${xa + 19} ${tope} ${xa + 19} ${y - 6}`} fill="none" stroke={tinta} strokeWidth="1.1" strokeDasharray="2.5 2" />);
                                    g.push(flecha(xa + 19, y - 6, true));
                                }
                            }
                        }
                    });

                    // Técnicas de evento en la banda media (fila dos).
                    const enFilaDos = [];
                    if (ev.notas.some(n => n.tec.tap)) enFilaDos.push("T");
                    if (ev.notas.some(n => n.tec.armonico === "artificial")) enFilaDos.push("A.H.");
                    if (enFilaDos.length) {
                        g.push(<text key={k("f2")} x={r.x} y={filaDos + 3} textAnchor="middle" fontFamily={SANS_FAMILIA} fontWeight="800" fontSize="9.5" fill={tinta}>{enFilaDos.join(" ")}</text>);
                    }
                    if (ev.notas.some(n => n.tec.vibrato)) {
                        const xa = r.x + (enFilaDos.length ? 8 : -6), w = Math.max(18, r.ancho - 10);
                        let d = `M${xa} ${filaDos}`;
                        for (let x = 0; x < w; x += 6) d += ` q1.5 -3.2 3 0 q1.5 3.2 3 0`;
                        g.push(<path key={k("vb")} d={d} fill="none" stroke={tinta} strokeWidth="1.1" />);
                    }
                });
            });

            /* --- Tramos de la banda media --- */
            const tramo = (t, rotulo, y, finFlecha) => {
                const xt = t.x0 + rotulo.length * 5.3 + 3;
                g.push(<text key={k("tr")} x={t.x0} y={y + 3} fontFamily={SANS_FAMILIA} fontSize="9" fontWeight="700" fontStyle="italic" fill={tinta}>{rotulo}</text>);
                if (t.x1 - 4 > xt) g.push(<line key={k("tl")} x1={xt} x2={t.x1 - 4} y1={y} y2={y} stroke={tinta} strokeWidth="0.9" strokeDasharray="3 2.5" />);
                if (finFlecha) {
                    const xf = Math.max(xt + 4, t.x1 - 4);
                    const abajo = finFlecha === "abajo";
                    g.push(<path key={k("tf")} d={abajo ? `M${xf - 3} ${y - 3} L${xf} ${y + 3} L${xf + 3} ${y - 3}` : `M${xf - 3} ${y + 3} L${xf} ${y - 3} L${xf + 3} ${y + 3}`} fill="none" stroke={tinta} strokeWidth="1.1" />);
                } else {
                    g.push(<line key={k("tk")} x1={t.x1 - 4} x2={t.x1 - 4} y1={y - 3} y2={y + 3} stroke={tinta} strokeWidth="0.9" />);
                }
            };
            tramosPM.forEach(t => tramo(t, "P.M.", filaUno));
            tramosSw.forEach(t => tramo(t, "sweep", filaUno, t.valor));
            tramosLR.forEach(t => tramo(t, "let ring", filaDos + 9));

            /* --- El cursor y los avisos del editor (sólo en pantalla) --- */
            if (editable) {
                sistema.compases.forEach(cm => {
                    if (cm.estado === "falta" || cm.estado === "sobra") {
                        g.push(<rect key={k("est")} data-no-exportar="1" x={cm.x0 + 3} y={sistema.yTabAbajo + 6} width={cm.x1 - cm.x0 - 6} height={3} rx="1.5"
                            fill={cm.estado === "sobra" ? "var(--k-danger)" : "var(--k-warning, #d97706)"} opacity="0.85" />);
                    }
                });
                if (cursor) {
                    const cm = sistema.compases.find(c => c.indice === cursor.c);
                    if (cm) {
                        const r = cm.eventos[cursor.e];
                        const ultimo = cm.eventos[cm.eventos.length - 1];
                        const xCur = r ? r.x : (ultimo ? Math.min(cm.x1 - 8, ultimo.x0 + ultimo.ancho + 8) : cm.x0 + 22);
                        const yCur = yC(cursor.s);
                        g.push(
                            <g key={k("cur")} data-no-exportar="1" pointerEvents="none">
                                <rect x={xCur - 11} y={sistema.yPentagrama - 6} width={22} height={sistema.yPentagramaAbajo - sistema.yPentagrama + 12} rx="4" fill="var(--k-accent)" opacity="0.10" />
                                <rect x={xCur - 11} y={yCur - 7.5} width={22} height={15} rx="4" fill="none" stroke="var(--k-accent)" strokeWidth="2" />
                            </g>
                        );
                    }
                }
            }

            return <g>{g}</g>;
        }

        /* --- LA HOJA DE TABLATURA ------------------------------------------------
         * A4 como las demás hojas (`data-song-sheet`), así que exportar a PNG,
         * SVG o PDF es la misma función que la canción y el ejercicio. */
        const MAQUETA_TAB = { ancho: HOJA.ancho - HOJA.margenX * 2, x0: HOJA.margenX, y0Primera: 150, y0: 64, yFin: HOJA.alto - 56 };

        function TabSheet({ tab, cursor, onPosicion, sonando, editable }) {
            const lay = React.useMemo(() => Tab.maquetar(tab, MAQUETA_TAB), [tab]);
            const cuerdasNombres = (() => {
                try {
                    const af = Tab.afinacionMidi(tab);
                    return af.slice().reverse().map(m => Tab.nombreDeNota(m, 0).replace(/\d+$/, "")).join(" ");
                } catch (e) { return ""; }
            })();

            const alPulsar = (e, ip) => {
                if (!onPosicion) return;
                const svg = e.currentTarget;
                const pt = svg.createSVGPoint();
                pt.x = e.clientX; pt.y = e.clientY;
                const ctm = svg.getScreenCTM();
                if (!ctm) return;
                const p = pt.matrixTransform(ctm.inverse());
                const sis = lay.paginas[ip].sistemas.find(s => p.y >= s.y - 6 && p.y <= s.y + s.alto + 6);
                if (!sis) return;
                let cm = sis.compases.find(c => p.x >= c.x0 && p.x <= c.x1);
                if (!cm) cm = p.x < sis.compases[0].x0 ? sis.compases[0] : sis.compases[sis.compases.length - 1];
                let e2 = 0;
                if (cm.eventos.length) {
                    const ultimo = cm.eventos[cm.eventos.length - 1];
                    if (p.x > ultimo.x0 + ultimo.ancho - 2 && cm.estado !== "completo" && cm.estado !== "sobra") e2 = cm.eventos.length;
                    else {
                        let mejor = Infinity;
                        cm.eventos.forEach((r, i) => { const d = Math.abs(r.x - p.x); if (d < mejor) { mejor = d; e2 = i; } });
                    }
                }
                let s = cursor ? cursor.s : lay.cuerdas - 1;
                if (p.y >= sis.yTab - 9 && p.y <= sis.yTabAbajo + 9) {
                    const fila = Math.round((p.y - sis.yTab) / Tab.MEDIDAS.tabEsp);
                    s = Math.max(0, Math.min(lay.cuerdas - 1, lay.cuerdas - 1 - fila));
                }
                onPosicion({ c: cm.indice, e: e2, s });
            };

            return (
                <div class="space-y-4">
                    {lay.paginas.map((pag, ip) => (
                        <svg
                            key={ip}
                            data-song-sheet="1"
                            width={HOJA.ancho}
                            height={HOJA.alto}
                            viewBox={`0 0 ${HOJA.ancho} ${HOJA.alto}`}
                            class={`k-sheet-page ${editable ? "k3-tab-hoja--editable" : ""}`}
                            onClick={editable ? (e) => alPulsar(e, ip) : undefined}
                        >
                            <rect width={HOJA.ancho} height={HOJA.alto} fill={HOJA.papel} />
                            {ip === 0 && (
                                <g>
                                    <text x={HOJA.ancho / 2} y={70} textAnchor="middle" fontFamily={SANS_FAMILIA} fontSize="30" fontWeight="800" fill={tinta}>{tab.title || "Tablatura"}</text>
                                    {tab.artista && <text x={HOJA.ancho - HOJA.margenX} y={100} textAnchor="end" fontFamily={SANS_FAMILIA} fontSize="13" fill={tinta}>{tab.artista}</text>}
                                    <text x={HOJA.margenX} y={100} fontFamily={SANS_FAMILIA} fontSize="11" fill={HOJA.tintaSuave}>
                                        {[
                                            `♩ = ${tab.bpm}`,
                                            getInstrument(tab.instrument).name,
                                            cuerdasNombres ? `Afinación: ${cuerdasNombres}` : null,
                                            tab.capo ? `Cejilla en el ${tab.capo}` : null
                                        ].filter(Boolean).join("   ·   ")}
                                    </text>
                                    {tab.notas && <text x={HOJA.margenX} y={118} fontFamily={SANS_FAMILIA} fontSize="10.5" fontStyle="italic" fill={HOJA.tintaSuave}>{tab.notas}</text>}
                                </g>
                            )}
                            {pag.sistemas.map(s => (
                                <SistemaTab key={s.indice} tab={tab} sistema={s} lay={lay} sonando={sonando} cursor={cursor} editable={editable} />
                            ))}
                            <text x={HOJA.ancho / 2} y={HOJA.alto - 26} textAnchor="middle" fontFamily={SANS_FAMILIA} fontSize="10" fill={HOJA.tintaSuave}>
                                {ip + 1} / {lay.paginas.length}   ·   Kharo Studio
                            </text>
                        </svg>
                    ))}
                </div>
            );
        }

        /* La miniatura: el primer sistema, recortado. */
        function MiniaturaTab({ tab }) {
            const lay = React.useMemo(() => Tab.maquetar(tab, MAQUETA_TAB), [tab]);
            const s = lay.sistemas[0];
            if (!s) return null;
            const ancho = Math.min(HOJA.ancho - HOJA.margenX, Math.max(360, s.x1 - s.x0 + 8));
            return (
                <svg viewBox={`${HOJA.margenX - 6} ${s.y + 14} ${ancho} ${s.alto - 14}`} class="k3-mini-tab" aria-hidden="true" preserveAspectRatio="xMinYMid meet">
                    <rect x={HOJA.margenX - 6} y={s.y} width={ancho} height={s.alto} fill={HOJA.papel} />
                    <SistemaTab tab={tab} sistema={s} lay={lay} />
                </svg>
            );
        }

        /* --- OPERACIONES SOBRE LA TABLATURA ------------------------------------------
         * Puras: reciben la tablatura y devuelven otra. El editor sólo decide
         * cuál toca según la tecla. */
        const clonarTab = (t) => JSON.parse(JSON.stringify(t));

        function conEvento(tab, c, e, cambio) {
            const t = clonarTab(tab);
            const ev = t.compases[c] && t.compases[c].eventos[e];
            if (!ev) return tab;
            cambio(ev, t);
            return t;
        }

        function conNota(tab, cur, cambio) {
            return conEvento(tab, cur.c, cur.e, (ev) => {
                const n = ev.notas.find(x => x.s === cur.s);
                if (n) cambio(n.tec, n, ev);
            });
        }

        /* --- EL EDITOR -------------------------------------------------------------- */
        const ARMADURAS = [
            { v: -7, n: "7♭ · Do♭ mayor" }, { v: -6, n: "6♭ · Sol♭ mayor" }, { v: -5, n: "5♭ · Re♭ mayor" },
            { v: -4, n: "4♭ · La♭ mayor / Fa menor" }, { v: -3, n: "3♭ · Mi♭ mayor / Do menor" }, { v: -2, n: "2♭ · Si♭ mayor / Sol menor" },
            { v: -1, n: "1♭ · Fa mayor / Re menor" }, { v: 0, n: "Sin alteraciones · Do mayor / La menor" },
            { v: 1, n: "1♯ · Sol mayor / Mi menor" }, { v: 2, n: "2♯ · Re mayor / Si menor" }, { v: 3, n: "3♯ · La mayor / Fa♯ menor" },
            { v: 4, n: "4♯ · Mi mayor / Do♯ menor" }, { v: 5, n: "5♯ · Si mayor" }, { v: 6, n: "6♯ · Fa♯ mayor" }, { v: 7, n: "7♯ · Do♯ mayor" }
        ];

        function BotonPaleta({ activo, onClick, etiqueta, titulo, children, ancho }) {
            return (
                <button type="button" onClick={onClick} aria-pressed={activo === undefined ? undefined : !!activo}
                    title={titulo || etiqueta} aria-label={titulo || etiqueta}
                    class={`k3-paleta__boton ${activo ? "k3-paleta__boton--activo" : ""} ${ancho ? "k3-paleta__boton--ancho" : ""}`}>
                    {children || etiqueta}
                </button>
            );
        }

        function TabEditor({
            tab, setTab, onAviso,
            isPlaying, onPlay, onStop, sonando, repetir, onRepetir, timbre, onTimbre,
            onExport, onNueva, tabs, onAbrir, onDuplicar, onBorrar, onBorrarTodas, onCopia, onImportar, onBiblioteca
        }) {
            const cuerdas = getInstrument(tab.instrument).strings;
            const [cursor, setCursor] = useState({ c: 0, e: 0, s: cuerdas - 1 });
            const [figuraActiva, setFiguraActiva] = useState("8");
            const [tipoBend, setTipoBend] = useState("bend");
            const [cantBend, setCantBend] = useState(1);
            const [gestorAbierto, setGestorAbierto] = useState(false);
            const [confirmarImport, setConfirmarImport] = useState(false);
            const lienzo = useRef(null);
            const buffer = useRef({ pos: null, valor: null, t: 0 });

            // El cursor nunca apunta fuera de la tablatura (al borrar compases,
            // al cambiar a un instrumento con menos cuerdas, al deshacer…).
            useEffect(() => {
                setCursor(cur => {
                    const c = Math.max(0, Math.min(tab.compases.length - 1, cur.c));
                    const e = Math.max(0, Math.min(tab.compases[c].eventos.length, cur.e));
                    const s = Math.max(0, Math.min(cuerdas - 1, cur.s));
                    return (c === cur.c && e === cur.e && s === cur.s) ? cur : { c, e, s };
                });
            }, [tab, cuerdas]);

            const historialTab = useHistorial(tab, (f) => setTab(f), 400);
            const deshacerTab = (rehacer) => {
                const hecho = rehacer ? historialTab.rehacer() : historialTab.deshacer();
                if (onAviso) onAviso(hecho ? (rehacer ? "Rehecho" : "Deshecho") : (rehacer ? "Nada que rehacer" : "Nada que deshacer"));
            };

            const compas = tab.compases[cursor.c] || tab.compases[0];
            const evento = compas && compas.eventos[cursor.e];
            const nota = evento && evento.notas.find(n => n.s === cursor.s);
            const cap = Tab.ticksDelCompas(tab.compas);
            const afinacion = Tab.afinacionMidi(tab);

            /* --- Moverse --- */
            const irA = (c, e, s) => setCursor({ c, e, s: s === undefined ? cursor.s : s });

            const derecha = () => {
                const t = Tab.ticksDeCompas(compas);
                if (cursor.e < compas.eventos.length - 1) return irA(cursor.c, cursor.e + 1);
                if (cursor.e === compas.eventos.length - 1 && t < cap) return irA(cursor.c, cursor.e + 1);
                if (cursor.e === compas.eventos.length && t < cap && compas.eventos.length > 0) {
                    // En un hueco: «→» deja un silencio, como en MuseScore.
                    ponerSilencio();
                    return;
                }
                // Siguiente compás (se crea si no hay).
                if (cursor.c === tab.compases.length - 1) {
                    setTab(prev => ({ ...prev, compases: [...prev.compases, Tab.createCompas()] }));
                }
                irA(cursor.c + 1, 0);
            };

            const izquierda = () => {
                if (cursor.e > 0) return irA(cursor.c, cursor.e - 1);
                if (cursor.c === 0) return;
                const prev = tab.compases[cursor.c - 1];
                const lleno = Tab.ticksDeCompas(prev) >= cap;
                irA(cursor.c - 1, lleno ? Math.max(0, prev.eventos.length - 1) : prev.eventos.length);
            };

            /* --- Escribir --- */
            const figuraQueEntra = () => {
                const libre = cap - Tab.ticksDeCompas(compas);
                const quiere = Tab.figura(figuraActiva).ticks;
                if (libre <= 0) return figuraActiva;
                return quiere <= libre ? figuraActiva : (Tab.figuraQueCabe(libre) || figuraActiva);
            };

            /* Pone el traste donde está el cursor y devuelve dónde quedó la
             * nota: en un hueco se crea el evento, y si el compás ya está
             * lleno, va al principio del siguiente. */
            const ponerTraste = (f) => {
                if (f > 24) return null;
