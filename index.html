                                    onPointerMove={moverArrastre}
                                    onPointerUp={soltarArrastre}
                                    onPointerCancel={soltarArrastre}
                                    onDoubleClick={() => quitar(i)}
                                    title={silaba
                                        ? `${marca.name} sobre «${silaba}» · arrastra para mover, doble clic para quitar`
                                        : `${marca.name} · cae más allá del final de la letra`}
                                >
                                    {marca.name}
                                </button>
                            );
                        })}
                    </div>
                </div>
            );
        }

        function LyricEditor({ lines, onChange, onAdd, onRemove, chordParaInsertar, lineaActiva }) {
            const [modo, setModo] = useState("arrastrar"); // 'arrastrar' | 'texto'
            const [charWidth, medidor] = useCharWidth();
            const [scrolls, setScrolls] = useState({});

            const refsAcordes = useRef({});
            const refsLetra = useRef({});

            // En modo texto las dos cajas se desplazan juntas, por lo mismo que
            // el carril sigue a la letra en modo arrastrar.
            const sincronizarScroll = (indice, origen) => {
                const a = refsAcordes.current[indice];
                const b = refsLetra.current[indice];
                if (!a || !b) return;
                if (origen === "acordes") b.scrollLeft = a.scrollLeft;
                else a.scrollLeft = b.scrollLeft;
            };

            const insertarEnCursor = (indice) => {
                const caja = refsLetra.current[indice];
                if (!caja || !chordParaInsertar) return;
                const col = caja.selectionStart || 0;
                const linea = lines[indice];
                onChange(indice, {
                    ...linea,
                    chordLine: Song.insertChordAtColumn(linea.chordLine, col, chordParaInsertar)
                });
            };

            return (
                <div class="space-y-3" style={{ position: "relative" }}>
                    {medidor}

                    <div class="flex items-center gap-2">
                        <div class="k-tabs">
                            <button
                                onClick={() => setModo("arrastrar")}
                                class={`k-tab text-[10px] ${modo === "arrastrar" ? "k-tab--active" : ""}`}
                            >
                                Arrastrar
                            </button>
                            <button
                                onClick={() => setModo("texto")}
                                class={`k-tab text-[10px] ${modo === "texto" ? "k-tab--active" : ""}`}
                            >
                                Texto
                            </button>
                        </div>
                        <span class="text-[10px]" style={{ color: 'var(--k-text-faint)' }}>
                            {modo === "arrastrar"
                                ? "Toca el carril para poner el acorde elegido; arrástralo para moverlo"
                                : "Los acordes se alinean contando espacios"}
                        </span>
                    </div>

                    {lines.map((linea, i) => {
                        const alineado = Song.alignLyricBlock(linea);
                        const sueltos = alineado.marks.filter(m => m.beyondLyric);

                        return (
                            <div
                                key={i}
                                class="k-panel p-2.5 space-y-1"
                                style={{ borderColor: lineaActiva === i ? 'var(--k-highlight)' : undefined }}
                            >
                                <div class="flex items-center gap-2">
                                    <span class="k-label text-[9px] shrink-0">Verso {i + 1}</span>
                                    <div class="flex-1"></div>
                                    {modo === "texto" && (
                                        <button
                                            onClick={() => insertarEnCursor(i)}
                                            disabled={!chordParaInsertar}
                                            class="k-btn k-btn--outline text-[10px] px-2 py-1"
                                            title={chordParaInsertar
                                                ? `Colocar ${chordParaInsertar} donde está el cursor`
                                                : "Elige antes un acorde de la sección"}
                                        >
                                            ↑ {chordParaInsertar || "acorde"} aquí
                                        </button>
                                    )}
                                    <BotonBorrar onClick={() => onRemove(i)} title="Borrar este verso" className="py-1" />
                                </div>

                                {modo === "arrastrar" ? (
                                    <ChordLane
                                        chordLine={linea.chordLine}
                                        lyric={linea.lyric}
                                        charWidth={charWidth}
                                        scrollLeft={scrolls[i] || 0}
                                        chordSeleccionado={chordParaInsertar}
                                        onChange={(chordLine) => onChange(i, { ...linea, chordLine })}
                                    />
                                ) : (
                                    <textarea
                                        ref={(el) => { refsAcordes.current[i] = el; }}
                                        value={linea.chordLine}
                                        onChange={(e) => onChange(i, { ...linea, chordLine: e.target.value })}
                                        onScroll={() => sincronizarScroll(i, "acordes")}
                                        rows={1}
                                        spellcheck="false"
                                        wrap="off"
                                        class="k-field k-mono k-lyric-line w-full px-2 py-1 text-sm"
                                        style={{ color: 'var(--k-highlight)', whiteSpace: 'pre', overflowX: 'auto', resize: 'none' }}
                                        placeholder="acordes"
                                    />
                                )}

                                <textarea
                                    ref={(el) => { refsLetra.current[i] = el; }}
                                    value={linea.lyric}
                                    onChange={(e) => onChange(i, { ...linea, lyric: e.target.value })}
                                    onScroll={(e) => {
                                        if (modo === "texto") sincronizarScroll(i, "letra");
                                        else setScrolls(prev => ({ ...prev, [i]: e.target.scrollLeft }));
                                    }}
                                    rows={1}
                                    spellcheck="false"
                                    wrap="off"
                                    class="k-field k-mono k-lyric-line w-full px-2 py-1 text-sm"
                                    style={{ whiteSpace: 'pre', overflowX: 'auto', resize: 'none' }}
                                    placeholder="letra"
                                />

                                {sueltos.length > 0 && (
                                    <p class="text-[10px]" style={{ color: 'var(--k-danger)' }}>
                                        {sueltos.map(m => m.name).join(", ")} {sueltos.length === 1 ? "cae" : "caen"} más allá del final de la letra.
                                    </p>
                                )}
                            </div>
                        );
                    })}

                    <button onClick={onAdd} class="k-btn k-btn--outline w-full text-xs py-2">
                        + Añadir verso
                    </button>
                </div>
            );
        }

        /* ==================================================================
         * EL GESTOR DE ARCHIVOS
         * ==================================================================
         * La lista de canciones —o de ejercicios— con lo que se puede hacer
         * con cada una: abrirla, duplicarla, borrarla.
         *
         * No existía. La app guardaba `[song]` y leía `[0]`, así que sólo había
         * UNA canción y «Nueva» reemplazaba la anterior: para conservar dos
         * había que exportar una a JSON y volver a importarla. La
         * infraestructura para varias estaba escrita en song-core.js desde el
         * principio y no la usaba nadie.
         *
         * Es UN componente para las dos cosas porque la lista de canciones y la
         * de ejercicios se manejan igual, y dos copias se habrían
         * desincronizado al primer botón nuevo.
         * ================================================================== */
        function GestorArchivos({
            titulo, elementos, activoId, resumen,
            /* El género de la palabra, porque el componente sirve para canciones
             * y para ejercicios y «+ Nueva ejercicio» está mal escrito. */
            nuevo, abierto,
            onAbrir, onNuevo, onDuplicar, onBorrar, onBorrarTodo, onCerrar
        }) {
            const [filtro, setFiltro] = useState("");
            const [menu, setMenu] = useState(null);

            const texto = filtro.trim().toLowerCase();
            const visibles = texto
                ? elementos.filter(e => (e.title || "").toLowerCase().includes(texto))
                : elementos;

            const abrirMenu = (e, item) => {
                e.preventDefault();
                setMenu({ id: item.id, title: item.title, x: e.clientX, y: e.clientY });
            };

            return (
                <div class="k-panel p-3 space-y-3">
                    <div class="flex items-center gap-2 flex-wrap">
                        <span class="k-label">{titulo}</span>
                        <span class="k-chip">{elementos.length}</span>
                        <div class="flex-1"></div>
                        <button onClick={onNuevo} class="k-btn k-btn--primary text-[10px] px-2.5 py-1.5">{nuevo || "+ Nuevo"}</button>
                        <BotonBorrar
                            onClick={onBorrarTodo}
                            title={`Borrar los ${elementos.length} y empezar de cero`}
                            label="Borrar todo"
                        />
                        <BotonCerrar onClick={onCerrar} title="Cerrar el gestor" />
                    </div>

                    {/* El buscador aparece cuando deja de caber todo de un
                        vistazo. Con tres archivos es ruido; con veinte es lo
                        único que sirve. */}
                    {elementos.length > 6 && (
                        <input
                            type="text"
                            value={filtro}
                            onChange={(e) => setFiltro(e.target.value)}
                            placeholder="Buscar por título…"
                            class="k-field w-full px-2 py-1.5 text-sm"
                        />
                    )}

                    <div class="space-y-1.5" style={{ maxHeight: "40vh", overflowY: "auto" }}>
                        {visibles.map(item => {
                            const activo = item.id === activoId;
                            return (
                                <div
                                    key={item.id}
                                    onContextMenu={(e) => abrirMenu(e, item)}
                                    class="flex items-center gap-2 px-2 py-1.5 rounded-lg"
                                    style={{
                                        backgroundColor: activo ? 'rgba(var(--k-accent-rgb),0.18)' : 'var(--k-surface-raised)',
                                        border: `1px solid ${activo ? 'var(--k-border-strong)' : 'transparent'}`
                                    }}
                                >
                                    <button
                                        onClick={() => onAbrir(item.id)}
                                        class="flex-1 min-w-0 text-left"
                                        style={{ background: 'none', border: 'none', cursor: 'pointer', padding: 0 }}
                                        title={activo ? "Ya está abierta" : "Abrir"}
                                    >
                                        <div class="text-xs font-bold truncate" style={{ color: activo ? 'var(--k-highlight)' : 'var(--k-text)' }}>
                                            {item.title || "Sin título"}
                                        </div>
                                        <div class="text-[10px]" style={{ color: 'var(--k-text-faint)' }}>
                                            {resumen(item)}{activo ? ` · ${abierto || "abierto"}` : ""}
                                        </div>
                                    </button>

                                    <button
                                        onClick={() => onDuplicar(item.id)}
                                        class="k-btn k-btn--ghost text-[10px] px-2 py-1"
                                        title="Duplicar"
                                    >
                                        Duplicar
                                    </button>
                                    <BotonBorrar onClick={() => onBorrar(item.id)} title={`Borrar «${item.title}»`} />
                                </div>
                            );
                        })}

                        {visibles.length === 0 && (
                            <p class="text-[11px] py-2" style={{ color: 'var(--k-text-faint)' }}>
                                Nada con ese nombre.
                            </p>
                        )}
                    </div>

                    {menu && (
                        <MenuContextual
                            x={menu.x}
                            y={menu.y}
                            titulo={menu.title}
                            onCerrar={() => setMenu(null)}
                            opciones={[
                                { label: "Abrir", hacer: () => onAbrir(menu.id), desactivada: menu.id === activoId },
                                { label: "Duplicar", hacer: () => onDuplicar(menu.id) },
                                { label: "Borrar", hacer: () => onBorrar(menu.id), estilo: { color: 'var(--k-danger)' } }
                            ]}
                        />
                    )}
                </div>
            );
        }

        /* ==================================================================
         * EDITOR DE PATRÓN DE RASGUEO
         * ==================================================================
         * La rejilla con la que se escribe un rasgueo: cuatro casillas por
         * pulso (semicorcheas) y en cada una la flecha que toca.
         *
         * Tocar una casilla la hace ROTAR por todos los estados:
         *
         *     vacío → ↓ → ↑ → ↓ acentuada → ↑ acentuada → × apagado → vacío
         *
         * Un solo gesto en vez de un menú por casilla. Con menú, escribir un
         * compás serían veinte toques y dos decisiones cada vez. Con el ratón,
         * además, el botón derecho va hacia atrás.
         *
         * Debajo va la regla de pulsos (1 · · · 2 · · · …), que es lo que
         * convierte una fila de flechas en algo que se puede leer y contar.
         * ================================================================== */
        function StrumEditor({ pattern, onChange, onPlay, onStop, sonando, bpm, onAviso }) {
            const sub = pattern.subdivision || 2;
            const total = pattern.beats * sub;

            const cambiarCelda = (i, atras) => {
                const cells = pattern.cells.slice();
                cells[i] = Song.nextCellState(cells[i], atras);
                onChange({ ...pattern, cells });
            };

            /* Poner una casilla en un estado CONCRETO, sin recorrer el ciclo.
             * El ciclo está bien para escribir de corrido —un golpe por
             * casilla— y mal para corregir: cambiar un ↓ por un × son cuatro
             * clics contando los estados de por medio. */
            const ponerCelda = (i, valor) => {
                const cells = pattern.cells.slice();
                cells[i] = valor ? { ...valor } : null;
                onChange({ ...pattern, cells });
            };

            const [menuCelda, setMenuCelda] = useState(null);

            const nombreDeEstado = (celda) => {
                if (!celda) return "Silencio";
                if (celda.muted) return "Apagado";
                const flecha = celda.dir === "up" ? "Arriba" : "Abajo";
                return celda.accent ? `${flecha} acentuada` : flecha;
            };

            const cambiarResolucion = (nuevaSub) => {
                const r = Song.reescalarRejilla(pattern, nuevaSub);
                onChange(r.pattern);
                if (r.perdidas > 0 && onAviso) {
                    onAviso(`${r.perdidas} ${r.perdidas === 1 ? "golpe no cabía" : "golpes no cabían"} en corcheas y se han quitado`);
                }
            };

            const glifo = (celda) => {
                if (!celda) return "";
                if (celda.muted) return "×";
                return celda.dir === "up" ? "↑" : "↓";
            };

            // El nombre de la casilla, para el tooltip: en corcheas no son
            // semicorcheas, y llamarlas mal confunde al contar.
            const nombreDeCasilla = (i) => {
                const pulso = Math.floor(i / sub) + 1;
                const dentro = i % sub;
                if (dentro === 0) return `Pulso ${pulso}`;
                if (sub === 2) return `Contra del ${pulso}`;
                return `Pulso ${pulso}, semicorchea ${dentro + 1}`;
            };

            return (
                <div class="k-panel p-2.5 space-y-2">
                    <div class="flex items-center gap-2 flex-wrap">
                        <button
                            onClick={sonando ? onStop : onPlay}
                            class={"k-btn k-btn--icon " + (sonando ? "k-btn--danger" : "k-btn--primary")}
                            title={sonando ? "Parar" : "Escuchar el patrón en bucle, con percusión"}
                        >
                            {sonando ? "■" : "▶"}
                        </button>

                        <input
                            type="text"
                            value={pattern.name}
                            onChange={(e) => onChange({ ...pattern, name: e.target.value })}
                            class="k-field px-2 py-1.5 text-sm font-bold"
                            style={{ width: "150px" }}
                            title="Nombre del patrón"
                        />

                        <div class="flex items-center gap-1">
                            <span class="k-label text-[9px]">Pulsos</span>
                            <button
                                onClick={() => {
                                    const beats = Math.max(1, pattern.beats - 1);
                                    onChange({ ...pattern, beats, cells: pattern.cells.slice(0, beats * sub) });
                                }}
                                class="k-btn k-btn--ghost w-6 h-6 text-xs"
                            >−</button>
                            <span class="k-value text-xs w-4 text-center">{pattern.beats}</span>
                            <button
                                onClick={() => {
                                    const beats = Math.min(8, pattern.beats + 1);
                                    const cells = pattern.cells.slice();
                                    while (cells.length < beats * sub) cells.push(null);
                                    onChange({ ...pattern, beats, cells });
                                }}
                                class="k-btn k-btn--ghost w-6 h-6 text-xs"
                            >+</button>
                        </div>

                        {/* La resolución. Corcheas por defecto: con semicorcheas,
                            un 4/4 son dieciséis casillas y medio metro de rejilla
                            para escribir algo que casi siempre va en corcheas. */}
                        <div class="k-tabs">
                            <button
                                onClick={() => cambiarResolucion(2)}
                                class={"k-tab text-[10px] " + (sub === 2 ? "k-tab--active" : "")}
                                title="Dos casillas por pulso"
                            >
                                Corcheas
                            </button>
                            <button
                                onClick={() => cambiarResolucion(4)}
                                class={"k-tab text-[10px] " + (sub === 4 ? "k-tab--active" : "")}
                                title="Cuatro casillas por pulso"
                            >
                                Semis
                            </button>
                        </div>

                        <button
                            onClick={() => onChange({ ...pattern, cells: new Array(total).fill(null) })}
                            class="k-btn k-btn--ghost text-[10px] px-2 py-1"
                            title="Vaciar la rejilla"
                        >
                            Vaciar
                        </button>

                        <span class="k-chip ml-auto">{bpm} bpm</span>
                    </div>

                    <div class="k-strip">
                        <div class="k-strum-grid" style={{ gridTemplateColumns: `repeat(${total}, 1fr)` }}>
                            {Array.from({ length: total }).map((_, i) => {
                                const celda = pattern.cells[i];
                                const enPulso = i % sub === 0;
                                return (
                                    <button
                                        key={i}
                                        /* Tres gestos, y ninguno pisa al otro:
                                             clic          avanza el ciclo (como siempre)
                                             shift+clic    lo retrocede (era el clic derecho)
                                             clic derecho  abre los seis estados en fila */
                                        onClick={(e) => cambiarCelda(i, e.shiftKey)}
                                        onContextMenu={(e) => {
                                            e.preventDefault();
                                            setMenuCelda({ i, x: e.clientX, y: e.clientY });
                                        }}
                                        class={"k-strum-cell"
                                            + (enPulso ? " k-strum-cell--beat" : "")
                                            + (celda ? " k-strum-cell--on" : "")
                                            + (celda && celda.accent ? " k-strum-cell--accent" : "")
                                            + (celda && celda.muted ? " k-strum-cell--muted" : "")}
                                        title={nombreDeCasilla(i)}
                                    >
                                        {glifo(celda)}
                                    </button>
                                );
                            })}

                            {/* La regla: el número en cada pulso y un punto en el
                                resto. Sin ella la fila de flechas no se cuenta. */}
                            {Array.from({ length: total }).map((_, i) => (
                                <span key={`r-${i}`} class={"k-strum-ruler" + (i % sub === 0 ? " k-strum-ruler--beat" : "")}>
                                    {i % sub === 0 ? (i / sub) + 1 : "·"}
                                </span>
                            ))}
                        </div>
                    </div>

                    {/* --- LOS SEIS ESTADOS, EN FILA ---
                        En horizontal porque una casilla de rasgueo se reconoce
                        por su flecha, de un vistazo: una lista vertical obliga a
                        leer seis renglones para elegir un símbolo.

                        Los estados salen de `CICLO_CELDA`, la misma lista que
                        recorre el clic izquierdo. Con dos listas, añadir un
                        estado dejaría el menú y el ciclo diciendo cosas
                        distintas. */}
                    {menuCelda && (
                        <MenuContextual
                            x={menuCelda.x}
                            y={menuCelda.y}
                            orientacion="horizontal"
                            titulo={nombreDeCasilla(menuCelda.i)}
                            onCerrar={() => setMenuCelda(null)}
                            opciones={Song.CICLO_CELDA.map((estado, k) => {
                                const puesto = (() => {
                                    const c = pattern.cells[menuCelda.i];
                                    if (!estado && !c) return true;
                                    return !!(estado && c && estado.dir === c.dir && estado.accent === c.accent && estado.muted === c.muted);
                                })();
                                return {
                                    key: `estado-${k}`,
                                    label: estado ? (estado.muted ? "×" : (estado.dir === "up" ? "↑" : "↓")) + (estado.accent ? "!" : "") : "·",
                                    ayuda: nombreDeEstado(estado),
                                    hacer: () => ponerCelda(menuCelda.i, estado),
                                    estilo: puesto
                                        ? { backgroundColor: 'var(--k-accent)', color: 'var(--k-accent-ink)', minWidth: '34px', fontSize: '15px' }
                                        : { minWidth: '34px', fontSize: '15px' }
                                };
                            })}
                        />
                    )}
                </div>
            );
        }

        /* ==================================================================
         * UNA SECCIÓN
         * ==================================================================
         * Intro, Verso, Coro... Cada una con su ritmo, su tempo y sus vueltas,
         * porque un estribillo rara vez se toca igual que la estrofa.
         *
         * `bpm` y `rhythmId` en null significan "lo que diga la canción". Es
         * distinto de copiar el valor: si luego se cambia el tempo general,
         * las secciones que no lo habían tocado siguen al general.
         * ================================================================== */
        function SectionCard({
            section, song, onActualizar, onBorrar,
            chordsById, playhead, chordParaInsertar, setChordParaInsertar
        }) {
            const pulsosPorCompas = Song.beatsPerBar(song.timeSignature);
            const pulsos = Song.sectionBeats(section);
            const segundos = Song.beatsToSeconds(
                Song.sectionTotalBeats(section),
                section.bpm || song.bpm
            );

            // Los acordes que ya están en la progresión: son los candidatos
            // razonables para colocar sobre la letra.
            const nombresUsados = [];
            (section.bars || []).forEach(bar => {
                const chord = chordsById[bar.chordId];
                if (chord && nombresUsados.indexOf(chord.name) === -1) nombresUsados.push(chord.name);
            });

            const enCurso = playhead && playhead.sectionId === section.id;

            const cambiarCompas = (indice, delta) => {
                const bars = section.bars.map((bar, i) =>
                    i === indice ? { ...bar, beats: Math.max(1, Math.min(32, bar.beats + delta)) } : bar
                );
                onActualizar({ bars });
            };

            const quitarCompas = (indice) => {
                onActualizar({ bars: section.bars.filter((_, i) => i !== indice) });
            };

            /* Duplicar un compás. Repetir un acorde es lo más común de una
             * progresión, y hasta ahora había que volver a la biblioteca,
             * buscarlo, añadirlo al final y arrastrarlo hasta su sitio. */
            const duplicarCompas = (indice) => {
                const bars = section.bars.slice();
                bars.splice(indice + 1, 0, { ...bars[indice] });
                onActualizar({ bars });
            };

            const moverCompas = (indice, delta) => {
                const destino = indice + delta;
                if (destino < 0 || destino >= section.bars.length) return;
                const bars = section.bars.slice();
                const movido = bars.splice(indice, 1)[0];
                bars.splice(destino, 0, movido);
                onActualizar({ bars });
            };

            return (
                <div class="k-panel p-3 space-y-3">
                    <div class="flex flex-wrap items-end gap-2">
                        <div class="flex-1 min-w-[120px]">
                            <label class="k-label block mb-1">Sección</label>
                            <input
                                type="text"
                                value={section.name}
                                onChange={(e) => onActualizar({ name: e.target.value })}
                                class="k-field w-full px-2 py-1.5 text-sm font-bold"
                            />
                        </div>

                        <div style={{ width: "76px" }}>
                            <label class="k-label block mb-1">Vueltas</label>
                            <input
                                type="number"
                                min="1"
                                max="32"
                                value={section.repeats}
                                onChange={(e) => onActualizar({ repeats: Math.max(1, parseInt(e.target.value) || 1) })}
                                class="k-field w-full px-2 py-1.5 text-sm text-center"
                            />
                        </div>

                        <div style={{ width: "96px" }}>
                            <label class="k-label block mb-1">Tempo</label>
                            <input
                                type="number"
                                min="30"
                                max="300"
                                placeholder={String(song.bpm)}
                                value={section.bpm || ""}
                                onChange={(e) => {
                                    const v = parseInt(e.target.value);
                                    onActualizar({ bpm: v > 0 ? v : null });
                                }}
                                class="k-field w-full px-2 py-1.5 text-sm text-center"
                                title="Vacío = el tempo de la canción"
                            />
                        </div>

                        <div class="flex-1 min-w-[140px]">
                            <label class="k-label block mb-1">Ritmo</label>
                            <select
                                value={section.rhythmId || ""}
                                onChange={(e) => onActualizar({ rhythmId: e.target.value || null })}
                                class="k-field w-full px-2 py-1.5 text-sm"
                            >
                                <option value="">El de la canción</option>
                                {Song.RHYTHM_PATTERNS.map(r => (
                                    <option key={r.id} value={r.id}>{r.name}</option>
                                ))}
                                {(song.customRhythms || []).map(r => (
                                    <option key={r.id} value={r.id}>{r.name}</option>
                                ))}
                            </select>
                        </div>

                        <BotonBorrar onClick={onBorrar} title="Borrar la sección entera" label="Borrar" />
                    </div>

                    <div class="flex items-center gap-2 flex-wrap">
                        <span class="k-chip">
                            {pulsos} pulsos {section.repeats > 1 ? "x " + section.repeats : ""}
                        </span>
                        <span class="k-chip">{Song.formatDuration(segundos)}</span>
                        {enCurso && (
                            <span class="k-chip" style={{ color: 'var(--k-accent-ink)', backgroundColor: 'var(--k-accent)' }}>
                                sonando
                            </span>
                        )}
                    </div>

                    <div>
                        <span class="k-label block mb-1.5">Progresión</span>
                        <BarStrip
                            bars={section.bars}
                            chordsById={chordsById}
                            beatsPerBar={pulsosPorCompas}
                            onChangeBeats={cambiarCompas}
                            onRemove={quitarCompas}
                            onMove={moverCompas}
                            onDuplicar={duplicarCompas}
                            activeIndex={enCurso ? playhead.barIndex : -1}
                        />
                    </div>

                    <div>
                        <div class="flex items-center gap-2 mb-1.5 flex-wrap">
                            <span class="k-label">Letra</span>
                            {nombresUsados.map(nombre => (
                                <button
                                    key={nombre}
                                    onClick={() => setChordParaInsertar(nombre)}
                                    class="k-chip"
                                    style={chordParaInsertar === nombre
                                        ? { backgroundColor: 'var(--k-accent)', color: 'var(--k-accent-ink)', cursor: 'pointer' }
                                        : { cursor: 'pointer' }}
                                    title="Elegir este acorde para colocarlo sobre la letra"
                                >
                                    {nombre}
                                </button>
                            ))}
                        </div>

                        <LyricEditor
                            lines={section.lines}
                            chordParaInsertar={chordParaInsertar}
                            lineaActiva={enCurso ? playhead.lineIndex : -1}
                            onChange={(i, linea) => onActualizar({
                                lines: section.lines.map((l, idx) => idx === i ? linea : l)
                            })}
                            onAdd={() => onActualizar({ lines: [...section.lines, { chordLine: "", lyric: "" }] })}
                            onRemove={(i) => onActualizar({ lines: section.lines.filter((_, idx) => idx !== i) })}
                        />
                    </div>

                    <div>
                        <label class="k-label block mb-1">Nota de la sección</label>
                        <input
                            type="text"
                            value={section.notes}
                            onChange={(e) => onActualizar({ notes: e.target.value })}
                            placeholder="Ej.: entra la batería, cejilla en el 3, medio tiempo..."
                            class="k-field w-full px-2 py-1.5 text-sm"
                        />
                    </div>
                </div>
            );
        }

        /* ==================================================================
         * LA HOJA DE CANCIÓN
         * ==================================================================
         * Páginas A4 con la progresión, la letra con los acordes encima y un
         * diccionario de las digitaciones usadas. Es lo que se imprime y lo
         * que se exporta.
         *
         * DOS DECISIONES QUE PARECEN DETALLES Y NO LO SON:
         *
         * 1. Los colores van escritos aquí, no como tokens del tema. La hoja
         *    es OBRA, no piel: si un tema pudiera repintarla, el PNG que te
         *    descargas cambiaría según cómo tengas puesta la app. Lo que ves
         *    es lo que te llevas, y eso no puede depender del tema.
         *
         * 2. La letra va en monoespaciada. No es un gusto tipográfico: el
         *    acorde se coloca en la columna N multiplicando N por el ancho de
         *    carácter, y eso sólo es exacto si todos los caracteres miden
         *    igual. Con una proporcional, el acorde se despega de su sílaba.
         * ================================================================== */
        const HOJA = {
            ancho: 840,
            alto: 1188,
            margenX: 48,
            margenSuperior: 150,
            margenInferior: 60,

            // Colores de la obra. Los mismos que usa el diagrama por defecto,
            // para que una hoja y un diagrama impresos hagan juego.
            papel: "#ffffff",
            tinta: "#0f172a",
            tintaSuave: "#64748b",
            linea: "#cbd5e1",
            acento: "#2563eb",

            // 8,4 px es el ancho real de un carácter de 14 px en monoespaciada
            // (la proporción es 0,6). De aquí sale la posición de cada acorde.
            monoTamano: 14,
            monoAncho: 8.4,

            altoSeccion: 34,
            altoCompases: 58,
            altoVerso: 46,
            altoNota: 26,
            separacionSeccion: 20
        };

        const MONO_FAMILIA = "ui-monospace, 'Courier New', monospace";
        const SANS_FAMILIA = "Helvetica, Arial, sans-serif";

        /* Un bloque de letra: los acordes en su columna exacta y debajo el
         * verso. `beyondLyric` marca los acordes que caen más allá del final
         * del texto — pasa al acortar un verso, y dibujarlos igual sin avisar
         * deja acordes flotando sin sílaba debajo. */
        function SheetLyricBlock({ line, x, y }) {
            const alineado = Song.alignLyricBlock(line);

            return (
                <g transform={`translate(${x}, ${y})`}>
                    {alineado.marks.map((marca, i) => (
                        <text
                            key={i}
                            x={marca.col * HOJA.monoAncho}
                            y={0}
                            fontFamily={MONO_FAMILIA}
                            fontSize={HOJA.monoTamano}
                            fontWeight="700"
                            fill={marca.beyondLyric ? HOJA.tintaSuave : HOJA.acento}
                        >
                            {marca.name}
                        </text>
                    ))}
                    <text
                        x={0}
                        y={20}
                        fontFamily={MONO_FAMILIA}
                        fontSize={HOJA.monoTamano}
                        fill={HOJA.tinta}
                        xmlSpace="preserve"
                    >
                        {alineado.lyric}
                    </text>
                </g>
            );
        }

        /* La progresión de una sección: cada acorde con sus pulsos, y una
         * barra vertical donde se cierra el compás. Es la referencia que hace
         * legible una progresión sin tener que contar. */
        function SheetBars({ section, song, chordsById, x, y, ancho }) {
            const pulsosPorCompas = Song.beatsPerBar(song.timeSignature);
            const piezas = [];
            let cursor = 0;
            let acumulado = 0;

            (section.bars || []).forEach((bar, i) => {
                const chord = chordsById[bar.chordId];
                const nombre = chord ? chord.name : "?";
                // El ancho lo marca la duración: un acorde que dura el doble
                // ocupa el doble, que es como se lee una progresión de un vistazo.
                const anchoCelda = Math.max(52, bar.beats * 22);

                if (cursor + anchoCelda > ancho) return; // no cabe en la línea

                acumulado += bar.beats;
                piezas.push(
                    <g key={i} transform={`translate(${cursor}, 0)`}>
                        <rect
                            x={0} y={0}
                            width={anchoCelda - 6} height={38}
                            rx={5}
                            fill="none"
                            stroke={HOJA.linea}
                            strokeWidth="1.2"
                        />
                        <text
                            x={(anchoCelda - 6) / 2} y={22}
                            textAnchor="middle"
                            fontFamily={SANS_FAMILIA}
                            fontSize="17"
                            fontWeight="800"
                            fill={HOJA.tinta}
                        >
                            {nombre}
                        </text>
                        <text
                            x={anchoCelda - 12} y={33}
                            textAnchor="end"
                            fontFamily={MONO_FAMILIA}
                            fontSize="10"
                            fill={HOJA.tintaSuave}
                        >
                            {bar.beats}
                        </text>
                    </g>
                );

                cursor += anchoCelda;

                if (acumulado % pulsosPorCompas === 0) {
                    piezas.push(
                        <line
                            key={`sep-${i}`}
                            x1={cursor - 3} y1={2}
                            x2={cursor - 3} y2={36}
                            stroke={HOJA.tinta}
                            strokeWidth="1.5"
                        />
                    );
                }
            });

            return <g transform={`translate(${x}, ${y})`}>{piezas}</g>;
        }

        /* La página de teoría: qué notas tiene la tonalidad y qué acordes
         * salen de ella. Sólo se puede dibujar si la tonalidad está ELEGIDA;
         * en modo libre no hay de dónde sacarla. */
        /* --- EL MÁSTIL ENTERO, EN HORIZONTAL -------------------------------
         *
         * Del traste 0 al 24, con todas las notas de la tonalidad. Es la única
         * vista del proyecto que no es vertical, y lo es a propósito: en una
         * hoja A4 apaisar el mástil es lo que permite meter veinticuatro
         * trastes sin que quepan cuatro.
         *
         * Tinta fija de `HOJA`, como todo lo que se imprime: es obra.
         *
         * La afinación sale del primer acorde de la canción, porque la canción
         * no guarda ninguna: los acordes sí, y son suyos. Sin acordes todavía,
         * guitarra estándar.
         * ------------------------------------------------------------------ */
        function SheetNeckMap({ keyRoot, intervalos, afinacion, x, y, ancho }) {
            const est = useDiagramStyle();
            const k = est.dotRadius / 10;
            const lw = Math.min(est.lineWidth / 1.5, 2.5);

            const TRASTES = 24;
            const cuerdas = afinacion.length;

            const anchoTraste = ancho / (TRASTES + 1);
            const altoCuerda = 19;
            const alto = (cuerdas - 1) * altoCuerda;

            // La cejuela cae tras la columna del 0, que es la cuerda al aire.
            const xTraste = (f) => x + (f + 1) * anchoTraste;
            const xNota = (f) => x + (f + 0.5) * anchoTraste;
            // La cuerda 0 es la más grave y se dibuja ABAJO, como en un mástil
            // apaisado visto de frente.
            const yCuerda = (s) => y + (cuerdas - 1 - s) * altoCuerda;

            const enLaEscala = (pc) => intervalos.some(iv => (keyRoot + iv) % 12 === pc);

            const puntos = [];
            for (let s = 0; s < cuerdas; s++) {
                const base = parseNoteToSemi(afinacion[s]);
                for (let f = 0; f <= TRASTES; f++) {
                    const pc = (base + f) % 12;
                    if (!enLaEscala(pc)) continue;
                    puntos.push({ s, f, pc, tonica: pc === keyRoot });
                }
            }

            return (
                <g>
                    {/* El fondo del mástil. Sin él, con un estilo de fondo
                        oscuro el mapa quedaría invisible sobre el papel blanco
                        de la hoja. El margen de la izquierda cubre los nombres
                        de cuerda, que se dibujan fuera de la rejilla. */}
                    <rect
                        x={x - 24} y={y - 10}
                        width={ancho + 32} height={alto + 28}
                        rx="6"
                        fill={est.backgroundColor}
                    />

                    {/* Cuerdas */}
                    {Array.from({ length: cuerdas }).map((_, s) => (
                        <line
                            key={`c-${s}`}
                            x1={x} y1={yCuerda(s)}
                            x2={x + ancho} y2={yCuerda(s)}
                            stroke={est.gridColor} strokeWidth={0.8 * lw}
                        />
                    ))}

                    {/* Trastes. El 0 lleva la cejuela, gruesa. */}
                    {Array.from({ length: TRASTES + 1 }).map((_, f) => (
                        <line
                            key={`t-${f}`}
                            x1={xTraste(f)} y1={y}
                            x2={xTraste(f)} y2={y + alto}
                            stroke={est.gridColor}
                            strokeWidth={(f === 0 ? 2.4 : 0.8) * lw}
                        />
                    ))}

                    {/* Los números de traste que un guitarrista busca con la vista */}
                    {[3, 5, 7, 9, 12, 15, 17, 19, 21, 24].map(f => (
                        <text
                            key={`n-${f}`}
                            x={xNota(f)} y={y + alto + 13}
                            textAnchor="middle"
                            fontFamily={est.fontFamily} fontSize="8"
                            fill={est.textColor}
                            opacity={f === 12 || f === 24 ? 1 : 0.65}
                            fontWeight={f === 12 || f === 24 ? "700" : "400"}
                        >
                            {f}
                        </text>
                    ))}

                    {/* Las cuerdas, por su nombre, a la izquierda */}
                    {afinacion.map((nota, s) => (
                        <text
                            key={`e-${s}`}
                            x={x - 6} y={yCuerda(s) + 3}
                            textAnchor="end"
                            fontFamily={est.fontFamily} fontSize="8" fontWeight="700"
                            fill={est.textColor} opacity="0.65"
                        >
                            {nota}
                        </text>
                    ))}

                    {puntos.map((p, i) => (
                        <g key={`p-${i}`}>
                            <circle
                                cx={xNota(p.f)} cy={yCuerda(p.s)}
                                /* Con tope, como en la miniatura: 24 trastes en
                                   744 px dan ~29 px de columna, y un punto más
                                   gordo que eso se come al vecino. */
                                r={Math.min(7.6 * k, anchoTraste * 0.46)}
                                fill={p.tonica ? est.intervalColors["1"] : est.backgroundColor}
                                stroke={p.tonica ? est.intervalColors["1"] : est.gridColor}
                                strokeWidth={1 * lw}
                            />
                            <text
                                x={xNota(p.f)} y={yCuerda(p.s) + 2.6}
                                textAnchor="middle"
                                fontFamily={est.fontFamily} fontSize="6.4" fontWeight="700"
                                fill={p.tonica ? est.dotTextColor : est.textColor}
                            >
                                {NOTE_NAMES[p.pc]}
                            </text>
                        </g>
                    ))}
                </g>
            );
        }

        function SheetTheoryPage({ song, indice, total, chordLibrary }) {
            const escala = SCALE_PRESETS.find(e => e.id === song.keyScale) || SCALE_PRESETS[0];
            const notas = window.KharoTheory.scaleNotes(song.keyRoot, escala.intervals);
            const grados = window.KharoTheory.diatonicChords(song.keyRoot, escala.intervals);
            const nombreTonalidad = NOTE_NAMES[song.keyRoot] + " " + escala.name;

            // La afinación del primer acorde guardado. La canción no guarda
            // ninguna; los acordes sí, y son los suyos.
            const conAfinacion = (chordLibrary || []).find(c => Array.isArray(c.tuning) && c.tuning.length > 0);
            const afinacion = conAfinacion ? conAfinacion.tuning : ["E", "A", "D", "G", "B", "E"];

            /* Los acordes de la canción que NO son de la tonalidad, con la
             * lectura que les hayas puesto. Es la mitad de la explicación: los
             * grados dicen de qué está hecha la tonalidad, y esto dice qué hay
             * en la canción que no sale de ella. */
            const usados = [];
            (song.sections || []).forEach(sec => (sec.bars || []).forEach(b => {

        function SongSheet({ song, chordLibrary }) {

            const usados = [];

            const anchoUtil = HOJA.ancho - HOJA.margenX * 2;

            const paginas = Song.paginateSong(

                    : []

            // La hoja de teoría, si está activada y la tonalidad está elegida,

            const totalPaginas = paginas.length + (conTeoria ? 1 : 0);

                                            const columna = k % porFila;

                                                    key={id}
                                                    transform={`translate(${HOJA.margenX + columna * (anchoMini + 12)}, ${yBloque + 14 + fila * (altoMini + 14)})`}
                                                >
                                                    <MiniFretboard
                                                        chord={chordsById[id]}
                                                        ancho={anchoMini}
                                                        alto={altoMini}
                                                        etiquetas={song.chordLabels}
                                                        baseDeGrados={baseDeGradosDe(chordsById[id], song)}
                                                    />
                                                </g>
                                            );

                            if (bloque.tipo === "seccion") {
                                const s = bloque.section;
                                const ritmo = Song.getRhythm(s.rhythmId || song.rhythmId);
                                const detalle = [

                                            width={Math.max(64, s.name.length * 8 + 18)} height={20}
                                            rx={4}
                                            fill={HOJA.tinta}
                                        />
                                        <text
                                            x={HOJA.margenX + 9} y={yBloque + 1}

                                        fill={HOJA.tintaSuave}

                        });

                        return (
                            <svg
                                key={indicePagina}
                                id={`song-sheet-page-${indicePagina}`}
                                data-song-sheet="1"
                                width={HOJA.ancho}
                                height={HOJA.alto}
                                viewBox={`0 0 ${HOJA.ancho} ${HOJA.alto}`}
                                class="k-sheet-page"
                            >
                                <rect width={HOJA.ancho} height={HOJA.alto} fill={HOJA.papel} />

                                {/* Cabecera: completa en la portada, discreta en el resto */}

                                    <g>
                                        <text
                                            x={HOJA.ancho / 2} y={78}

                                            fontSize="40"
                                            fontWeight="800"
                                            fill={HOJA.tinta}

                                        </text>
                                        <text
                                            x={HOJA.margenX} y={110}
                                            fontFamily={SANS_FAMILIA}
                                            fontSize="12"
                                            fill={HOJA.tintaSuave}
                                        >
                                            {[
                                                song.key ? `Tonalidad: ${song.key}` : null,
                                                `${song.bpm} bpm`,
                                                song.timeSignature,
                                                Song.formatDuration(Song.songSeconds(song))
                                            ].filter(Boolean).join("   ·   ")}
                                        </text>
                                        {song.notes && (
                                            <text
                                                x={HOJA.ancho - HOJA.margenX} y={110}
                                                textAnchor="end"
                                                fontFamily={SANS_FAMILIA}
                                                fontSize="11"
                                                fontStyle="italic"
                                                fill={HOJA.tintaSuave}
                                            >

                                            </text>
                                        )}
                                        <rect
                                            x={HOJA.margenX} y={122}
                                            width={anchoUtil} height={2}
                                            fill={HOJA.tinta}
                                        />
                                    </g>
                                ) : (
                                    <g>
                                        <text
                                            x={HOJA.margenX} y={80}
                                            fontFamily={SANS_FAMILIA}
                                            fontSize="13"
                                            fontWeight="700"
                                            fill={HOJA.tintaSuave}
                                        >
                                            {song.title || "Sin título"}
                                        </text>
                                        <rect
                                            x={HOJA.margenX} y={92}
                                            width={anchoUtil} height={1}

                                {contenido}

                                <text
                                    x={HOJA.ancho / 2} y={HOJA.alto - 28}

                    {conTeoria && (
                        <SheetTheoryPage song={song} indice={paginas.length} total={totalPaginas} chordLibrary={chordLibrary} />
                    )}
                </div>
            );
        }

        /* ==================================================================
         * EL APARTADO CANCIÓN
         * ==================================================================
         * Monta la canción entera: cabecera, biblioteca de acordes, secciones
         * y reproducción. Las funciones que tocan el modelo viven aquí y no en
         * App() para que el estudio de diagramas y la canción compartan sólo lo
         * imprescindible.
         * ================================================================== */
        function SongEditor({
            song, setSong,
            chordLibrary, onRemoveChord, onRenameChord, onAuditionChord,
            activeSectionId, setActiveSectionId,
            playhead, isPlaying, onPlay, onStop, isLooping, setIsLooping,
            onExport, onImport, onNuevaCancion,
            songs, onAbrirCancion, onDuplicarCancion, onBorrarCancion, onBorrarTodasLasCanciones,
            onBorrarTodosLosAcordes, onMandarAcordeA,
            onPreviewRhythm, onStopPreview, previewSonando, onAviso
        }) {
            const [chordParaInsertar, setChordParaInsertar] = useState(null);
            const [gestorAbierto, setGestorAbierto] = useState(false);
            const [menuSeccion, setMenuSeccion] = useState(null);


            /* Abrir el editor de rasgueo. Si el ritmo elegido es de fábrica no
             * se toca —son la referencia—: se crea uno propio y se selecciona,
             * que es lo que la persona quería al pulsar «editar». */
            const editarRitmo = () => {
                // El de fábrica no se toca: se escribe uno propio y se activa.
                // Si el activo ya es tuyo, la rejilla está delante y no hay nada
                // que abrir.
                if ((song.customRhythms || []).some(r => r.id === song.rhythmId)) return;

                const nuevo = Song.createStrumPattern("Mi rasgueo", Song.beatsPerBar(song.timeSignature));
                setSong(prev => ({
                    ...prev,
                    customRhythms: [...(prev.customRhythms || []), nuevo],
                    rhythmId: nuevo.id
                }));
            };

            const actualizarRitmo = (patron) => {
                setSong(prev => ({
                    ...prev,
                    customRhythms: (prev.customRhythms || []).map(r => r.id === patron.id ? patron : r)
                }));
            };

            const borrarRitmo = (id) => {
                setSong(prev => ({
                    ...prev,
                    customRhythms: (prev.customRhythms || []).filter(r => r.id !== id),
                    // Si el que se borra era el activo, se vuelve al de fábrica.
                    rhythmId: prev.rhythmId === id ? Song.DEFAULT_RHYTHM : prev.rhythmId,
                    sections: prev.sections.map(sec => sec.rhythmId === id ? { ...sec, rhythmId: null } : sec)
                }));
            };

            /* El rasgueo propio que está SONANDO, no uno que hayas abierto.
             *
             * Antes vivía tras un estado aparte (`ritmoEnEdicion`) y sólo
             * aparecía al pulsar el lápiz, así que estaba escondido detrás de un
             * icono: la parte más trabajosa de la canción era la que no se veía.
             * Si el ritmo activo es tuyo, se edita; si es de fábrica, se ofrece
             * escribir el tuyo. No hace falta abrir ni cerrar nada. */
            const patronEnEdicion = (song.customRhythms || []).find(r => r.id === song.rhythmId);

            /* Guardar cómo se lee un acorde de fuera. Va indexado por acorde y
             * no por compás: el mismo acorde puede estar en ocho compases y la
             * lectura es la misma en los ocho. (Un acorde pivote puede cumplir
             * dos funciones distintas en dos sitios de la canción; eso hoy no se
             * puede decir, y está apuntado como deuda.) */
            const ponerLecturaArmonica = (chordId, lectura) => {
                setSong(prev => ({
                    ...prev,
                    harmony: { ...(prev.harmony || {}), [chordId]: lectura }
                }));
            };

            // El ritmo activo, para poder decir cuál es sin repetir el
            // desplegable en la cabecera.
            const ritmoDeLaCancion = Song.RHYTHM_PATTERNS.concat(song.customRhythms || [])
                .find(r => r.id === song.rhythmId) || null;

            const chordsById = {};
            chordLibrary.forEach(c => { chordsById[c.id] = c; });

            const seccionActiva = song.sections.find(s => s.id === activeSectionId) || song.sections[0];

            const actualizarSeccion = (id, parche) => {
                setSong(prev => ({
                    ...prev,
                    sections: prev.sections.map(s => s.id === id ? { ...s, ...parche } : s)
                }));
            };

            const anadirSeccion = () => {
                const nueva = Song.createSection("Parte " + (song.sections.length + 1));
                setSong(prev => ({ ...prev, sections: [...prev.sections, nueva] }));
                setActiveSectionId(nueva.id);
            };

            /* Duplicar una sección. Un segundo estribillo con un cambio de
             * dos compases es la mitad de las canciones, y rehacerlo entero era
             * la única forma de tenerlo. */
            const duplicarSeccion = (id) => {
                setSong(prev => {
                    const i = prev.sections.findIndex(s => s.id === id);
                    if (i === -1) return prev;
                    /* Copia profunda por JSON: una sección son datos puros, y
                     * una copia superficial dejaría los compases y las líneas
                     * compartidos entre las dos. */
                    const copia = JSON.parse(JSON.stringify(prev.sections[i]));
                    copia.id = `sec-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`;
                    copia.name = `${prev.sections[i].name} (copia)`;
                    const sections = prev.sections.slice();
                    sections.splice(i + 1, 0, copia);
                    setActiveSectionId(copia.id);
                    return { ...prev, sections };
                });
            };

            const borrarSeccion = (id) => {
                setSong(prev => {
                    const quedan = prev.sections.filter(s => s.id !== id);
                    // Una canción sin secciones no es un estado en el que se
                    // pueda seguir trabajando: siempre queda una.
                    const sections = quedan.length ? quedan : [Song.createSection("Intro")];
                    setActiveSectionId(sections[0].id);
                    return { ...prev, sections };
                });
            };

            // Añadir un acorde de la biblioteca a la sección activa, con la
            // duración de un compás completo, que es lo más habitual.
            const anadirAcordeALaSeccion = (chord) => {
                if (!seccionActiva) return;
                const id = seccionActiva.id;
                // Se parte del estado ANTERIOR, no del que capturó este render:
                // añadiendo cuatro acordes a toques rápidos, dos clics dentro del
                // mismo ciclo partirían de la misma lista y uno se perdería. Es
                // la misma razón por la que FretStepper recibe el incremento.
                setSong(prev => ({
                    ...prev,
                    sections: prev.sections.map(s => s.id === id
                        ? { ...s, bars: [...s.bars, { chordId: chord.id, beats: Song.beatsPerBar(prev.timeSignature) }] }
                        : s)
                }));
            };

            const duracion = Song.formatDuration(Song.songSeconds(song));
            const totalAcordes = song.sections.reduce((n, s) => n + s.bars.length * Math.max(1, s.repeats), 0);

            return (
                /* Con un tope de ancho. Sin él, en un monitor de 27" los campos
                   se estiraban hasta el borde y una fila de cuatro cosas cortas
                   ocupaba metro y medio. `mx-auto` la centra. */
                <div class="flex-1 min-h-0 overflow-y-auto p-3 md:p-6 md:pl-20 pb-28 md:pb-6" style={{ backgroundColor: 'var(--k-bg)' }}>
                <div class="space-y-4 w-full mx-auto" style={{ maxWidth: "1120px" }}>

                    {/* --- Cabecera flotante ---
                        Lo que hace falta tener siempre a mano mientras se baja
                        por la canción: qué es, a qué velocidad, con qué ritmo, y

                    {/* --- Biblioteca ---

                    <div class="space-y-1.5">

                    {/* El gestor va aquí y no dentro de la cabecera flotante:

                    {gestorAbierto && (

                    {/* --- Secciones --- */}
                    <div class="space-y-1.5">

                    {/* --- La hoja ---
                        No es una vista previa aparte: son EXACTAMENTE los nodos
                        que se exportan, igual que el diagrama del mástil. Lo que

                    <div class="space-y-1.5">
                        <div class="flex items-center gap-2 flex-wrap">

        /* ==================================================================
         * EJERCICIOS
         * ==================================================================
         * Una ficha de técnica: pasos, cada uno con su digitación y el orden en
         * que se tocan las notas, a la velocidad que elijas.
         *
         * Es otra tarea distinta de la canción y por eso tiene pestaña propia,
         * pero se llega a ella también desde Escalas y Arpegios: es ahí donde
         * montas la digitación, y obligar a rehacerla en otro sitio sería
         * pedirla dos veces.
         * ================================================================== */

        /* AQUÍ VIVÍA `EJ_TINTA`, siete colores fijos para el diagrama del
         * ejercicio. Eran copias literales de los del estudio —el azul de nota,
         * el rojo de tónica, el gris del recorrido— que no se enteraban de
         * nada: cambiar el color de las notas en el panel no llegaba hasta
         * aquí.
         *
         * Ahora la ficha lee el estilo, como el resto de la obra. El papel y el
         * texto de la hoja A4 que la envuelve siguen en `HOJA`, en blanco y
         * negro, porque una hoja tiene que poder imprimirse. */

        /* El mástil de un paso. No dibuja el mapa entero: dibuja SÓLO las notas
         * del recorrido, que es de lo que trata un ejercicio, y las une con
         * flechas en el orden en que se tocan. */
        function ExerciseFretboard({ paso, ancho, alto }) {
            const est = useDiagramStyle();
            const lw = Math.min(est.lineWidth / 1.5, 2.5);

            const instrumento = getInstrument(paso.instrument);
            const numStrings = instrumento.strings;
            const numFrets = paso.numFrets;

            const W = 300;
            const padX = 34;

            /* CUATRO COSAS SE APILAN ENCIMA DE LA CEJUELA y cada una necesita
             * su carril: el título, los nombres de las cuerdas, las notas al
             * aire y la propia cejuela. Con un margen redondo se pisaban, y en
             * el PDF el título salía por delante de las notas y no se leía
             * ninguno.
             *
             * ESTO NO ES UN MARGEN, ES UNA SUMA. Y ahora el radio de nota lo
             * elige el usuario, así que la suma tiene que calcularse en vez de
             * escribirse: con `dotRadius` a 13 un `padTop` fijo volvería a
             * solapar. Con los valores de fábrica da 72 exacto, que es lo que
             * había antes. */
            const rNota = est.dotRadius * 1.1;              // 11 con el 10 de fábrica
            const fsTitulo = 13, fsCuerda = 9;
            const yTitulo = fsTitulo + 7;                   // 20
            const yNombresCuerda = yTitulo + fsCuerda + 9;  // 38
            const yAlAire = yNombresCuerda + 8 + rNota;     // 57
            const padTop = yAlAire + rNota + 4;             // 72
            const padBottom = 18;
            const altoTraste = Math.max(44, 2 * rNota + 8);
            const H = padTop + numFrets * altoTraste + padBottom;

            const pasoCuerda = (W - padX * 2) / Math.max(1, numStrings - 1);
            const pasoTraste = (H - padTop - padBottom) / numFrets;

            const x = (s) => padX + s * pasoCuerda;
            const y = (f) => f === 0 ? yAlAire : padTop + (f - 0.5) * pasoTraste;

            /* Una cuerda al aire es el traste 0, y si la ventana empieza en el 4
             * ese traste no está en el dibujo. Los pasos guardados antes de esta
             * regla pueden traerlo, así que se filtra aquí también. */
            const enPrimerTraste = (paso.startingFret || 1) === 1;
            const notasDelPaso = enPrimerTraste ? paso.path : paso.path.filter(p => p.f > 0);

            const afinacionMidi = paso.tuningMidi && paso.tuningMidi.length === numStrings
                ? paso.tuningMidi
                : Array.from({ length: numStrings }, (_, i) =>
                    window.KharoTheory.getStringBaseMIDI(paso.tuning, i, paso.instrument));

            const notaDe = (pos) => {
                const abs = pos.f === 0 ? 0 : paso.startingFret + pos.f - 1;
                const midi = afinacionMidi[pos.s] + abs;
                return { midi, pitch: ((midi % 12) + 12) % 12 };
            };

            return (
                <svg
                    viewBox={`0 0 ${W} ${H}`}
                    width={ancho || W}
                    height={alto || undefined}
                    style={alto ? { display: "block" } : { width: "100%", height: "auto", display: "block" }}
                    data-exercise-step="1"
                >
                    <rect width={W} height={H} fill={est.backgroundColor} rx="6" />

                    <text x={W / 2} y={yTitulo} textAnchor="middle" fontFamily={est.fontFamily} fontSize={fsTitulo} fontWeight="800" fill={est.textColor}>
                        {paso.nombre}
                    </text>

                    {/* Cuerdas al aire y cejuela */}
                    {paso.tuning.map((nota, s) => (
                        <text key={`t-${s}`} x={x(s)} y={yNombresCuerda} textAnchor="middle" fontFamily={est.fontFamily} fontSize={fsCuerda} fill={est.textColor} opacity="0.65">
                            {nota}
                        </text>
                    ))}

                    <line x1={padX} y1={padTop} x2={W - padX} y2={padTop}
                        stroke={est.textColor} strokeWidth={(paso.startingFret === 1 ? 3.5 : 1.4) * lw} />

                    {Array.from({ length: numFrets }).map((_, i) => (
                        <line key={`f-${i}`} x1={padX} y1={padTop + (i + 1) * pasoTraste} x2={W - padX} y2={padTop + (i + 1) * pasoTraste}
                            stroke={est.gridColor} strokeWidth={1 * lw} opacity="0.55" />
                    ))}

                    {Array.from({ length: numStrings }).map((_, s) => (
                        <line key={`s-${s}`} x1={x(s)} y1={padTop} x2={x(s)} y2={padTop + numFrets * pasoTraste}
                            stroke={est.gridColor} strokeWidth={1 * lw} opacity="0.55" />
                    ))}

                    {/* Números de traste */}
                    {Array.from({ length: numFrets }).map((_, i) => (
                        <text key={`n-${i}`} x={padX - 10} y={padTop + (i + 0.5) * pasoTraste + 4}
                            textAnchor="end" fontFamily={est.fontFamily} fontSize="10" fill={est.textColor} opacity="0.65">
                            {paso.startingFret + i}
                        </text>
                    ))}

                    {/* El recorrido: primero las flechas, para que queden debajo
                        de las notas y no las tapen. */}
                    {/* --- LA MANCHA DE LA AGRUPACIÓN ---
                        Cuando el paso viene de una tríada de la tonalidad se
                        dibuja como se veía en el mástil: envuelto en su color y
                        SIN FLECHAS. De una forma no importa en qué orden se
                        toca —importa dónde está la mano—, y las flechas ahí
                        sobran. El recorrido es para las escalas. */}
                    {paso.envolvente && zonasDeUnGrado(notasDelPaso).map((zona, zi) => {
                        /* UNA MANCHA POR AGRUPACIÓN, no una que las envuelva
                         * todas. Con «todo el grado» son once notas repartidas
                         * por el mástil, y un solo casco alrededor de todas es
                         * una sábana que no dice nada. Se reparte igual que en
                         * el mástil —misma función—, así que la ficha se ve como
                         * se veía al elegirla. */
                        const mancha = trazoDeMancha(zona.map(p => ({ x: x(p.s), y: y(p.f) })));
                        if (!mancha) return null;
                        return (
                            <path
                                key={`z-${zi}`}
                                d={mancha.d}
                                fill={mancha.cerrado ? paso.envolvente.color : "none"}
                                stroke={paso.envolvente.color}
                                strokeWidth="30"
                                strokeLinejoin="round"
                                strokeLinecap="round"
                                opacity="0.22"
                            />
                        );
                    })}

                    {!paso.envolvente && notasDelPaso.slice(0, -1).map((pos, i) => {
                        const a = { x: x(pos.s), y: y(pos.f) };
                        const b = { x: x(notasDelPaso[i + 1].s), y: y(notasDelPaso[i + 1].f) };
                        const dx = b.x - a.x, dy = b.y - a.y;
                        const largo = Math.hypot(dx, dy);
                        if (largo < 18) return null;

                        const ux = dx / largo, uy = dy / largo;
                        const m = 13;
                        const x2 = b.x - ux * m, y2 = b.y - uy * m;
                        const px = -uy, py = ux;
                        // En sweep la mano no salta: cruzar de cuerda es parte
                        // del mismo movimiento, así que la línea va entera.
                        const salto = !paso.sweep && pos.s !== notasDelPaso[i + 1].s;

                        return (
                            <g key={`p-${i}`} opacity={salto ? 0.4 : 0.85}>
                                <line x1={a.x + ux * m} y1={a.y + uy * m} x2={x2} y2={y2}
                                    stroke={est.pathColor} strokeWidth={1.4 * lw}
                                    strokeDasharray={salto ? "4 3" : undefined} strokeLinecap="round" />
                                <polygon
                                    points={`${x2},${y2} ${x2 - ux * 6 + px * 3.5},${y2 - uy * 6 + py * 3.5} ${x2 - ux * 6 - px * 3.5},${y2 - uy * 6 - py * 3.5}`}
                                    fill={est.pathColor} />
                            </g>
                        );
                    })}

                    {notasDelPaso.map((pos, i) => {
                        const { pitch } = notaDe(pos);
                        // En un paso libre no hay tónica que señalar.
                        const esTonica = paso.root !== null && pitch === paso.root;
                        return (
                            <g key={`d-${i}`}>
                                <circle cx={x(pos.s)} cy={y(pos.f)} r={rNota}
                                    fill={esTonica ? est.intervalColors["1"] : est.baseFingerColor} />
                                {/* La de tapping, con el mismo aro que en el mástil:
                                    una ficha de ejercicio que no distingue la mano
                                    derecha no se puede practicar. */}
                                {pos.tap && (
                                    <circle cx={x(pos.s)} cy={y(pos.f)} r={rNota + 3.5}
                                        fill="none" stroke={esTonica ? est.intervalColors["1"] : est.baseFingerColor}
                                        strokeWidth="1.6" strokeDasharray="2 2" />
                                )}
                                <text x={x(pos.s)} y={y(pos.f) + 3.5} textAnchor="middle"
                                    fontFamily={est.fontFamily} fontSize="9" fontWeight="700" fill={est.dotTextColor}>
                                    {NOTE_NAMES[pitch]}
                                </text>
                            </g>
                        );
                    })}

                    {paso.sweep && (
                        <text x={W - padX} y={H - 4} textAnchor="end" fontFamily={est.fontFamily} fontSize="9" fill={est.textColor} opacity="0.65">
                            sweep · una nota por cuerda
                        </text>
                    )}
                </svg>
            );
        }

        function ExerciseEditor({
            exercise, setExercise,
            isPlaying, onPlay, onStop, pasoSonando,
            onExport, onNuevo, onCargarEnMastil,
            exercises, onAbrirEjercicio, onDuplicarEjercicio, onBorrarEjercicio, onBorrarTodosLosEjercicios
        }) {
            const [gestorAbierto, setGestorAbierto] = useState(false);
            const [menuPaso, setMenuPaso] = useState(null);
            const porNota = Song.noteSeconds(exercise.bpm, exercise.subdivision);
            const duracion = Song.formatDuration(Song.exerciseSeconds(exercise));

            const actualizarPaso = (id, parche) => {
                setExercise(prev => ({
                    ...prev,
                    pasos: prev.pasos.map(p => p.id === id ? { ...p, ...parche } : p)
                }));
            };

            /* Duplicar un paso. Un ejercicio suele ser la misma forma en
             * cuatro posiciones: sin esto hay que volver al mástil y rehacerla
             * entera cada vez. */
            const duplicarPaso = (i) => {
                setExercise(prev => {
                    const pasos = prev.pasos.slice();
                    const copia = JSON.parse(JSON.stringify(pasos[i]));
                    copia.id = `paso-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`;
                    pasos.splice(i + 1, 0, copia);
                    return { ...prev, pasos };
                });
            };

            const moverPaso = (i, delta) => {
                const destino = i + delta;
                if (destino < 0 || destino >= exercise.pasos.length) return;
                setExercise(prev => {
                    const pasos = prev.pasos.slice();
                    const [movido] = pasos.splice(i, 1);
                    pasos.splice(destino, 0, movido);
                    return { ...prev, pasos };
                });
            };

            return (
                /* Con un tope de ancho. Sin él, en un monitor de 27" los campos
                   se estiraban hasta el borde y una fila de cuatro cosas cortas
