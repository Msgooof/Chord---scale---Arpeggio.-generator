                const sonar = () => synthInstance.playNote(afinacion[cursor.s] + f + (tab.capo || 0), 0.6, 0, 0.7);
                if (cursor.e >= compas.eventos.length) {
                    const libre = cap - Tab.ticksDeCompas(compas);
                    if (libre <= 0 && compas.eventos.length > 0) {
                        const siguiente = cursor.c + 1;
                        setTab(prev => {
                            const t = clonarTab(prev);
                            if (!t.compases[siguiente]) t.compases.push(Tab.createCompas());
                            t.compases[siguiente].eventos.splice(0, 0, Tab.createEvento(figuraActiva, [{ s: cursor.s, f }]));
                            return t;
                        });
                        sonar();
                        const pos = { c: siguiente, e: 0, s: cursor.s };
                        setCursor(pos);
                        return pos;
                    }
                    const dur = figuraQueEntra();
                    setTab(prev => {
                        const t = clonarTab(prev);
                        t.compases[cursor.c].eventos.push(Tab.createEvento(dur, [{ s: cursor.s, f }]));
                        return t;
                    });
                    sonar();
                    // El cursor se queda SOBRE la nota nueva: así se le pueden
                    // poner técnicas o sumarle otra cuerda (un acorde).
                    const pos = { c: cursor.c, e: compas.eventos.length, s: cursor.s };
                    setCursor(pos);
                    return pos;
                }
                setTab(prev => conEvento(prev, cursor.c, cursor.e, (ev) => {
                    const n = ev.notas.find(x => x.s === cursor.s);
                    if (n) n.f = f;
                    else { ev.notas.push({ s: cursor.s, f, tec: Tab.tecVacia() }); ev.notas.sort((a, b) => a.s - b.s); }
                }));
                sonar();
                return { ...cursor };
            };

            // Dos cifras seguidas (en menos de 0,7 s) hacen un traste de dos
            // dígitos: «1» y «2» son el 12. La primera ya escribió el 1, así que
            // la segunda lo corrige en su sitio.
            const cifra = (d) => {
                const ahora = Date.now();
                const b = buffer.current;
                if (b.pos && ahora - b.t < 700 && b.valor > 0 && b.valor * 10 + d <= 24 &&
                    b.pos.c === cursor.c && b.pos.e === cursor.e && b.pos.s === cursor.s) {
                    const f = b.valor * 10 + d;
                    buffer.current = { pos: null, valor: null, t: 0 };
                    setTab(prev => conEvento(prev, b.pos.c, b.pos.e, (ev) => {
                        const n = ev.notas.find(x => x.s === b.pos.s);
                        if (n) n.f = f;
                    }));
                    synthInstance.playNote(afinacion[cursor.s] + f + (tab.capo || 0), 0.6, 0, 0.7);
                    return;
                }
                const pos = ponerTraste(d);
                buffer.current = { pos, valor: d, t: ahora };
            };

            const ponerSilencio = () => {
                if (cursor.e < compas.eventos.length) {
                    setTab(prev => conEvento(prev, cursor.c, cursor.e, (ev) => { ev.notas = []; }));
                    return;
                }
                const dur = figuraQueEntra();
                setTab(prev => {
                    const t = clonarTab(prev);
                    t.compases[cursor.c].eventos.push(Tab.createEvento(dur, []));
                    return t;
                });
                irA(cursor.c, compas.eventos.length + 1);
            };

            const borrar = () => {
                if (cursor.e >= compas.eventos.length) { izquierda(); return; }
                if (nota) {
                    setTab(prev => conEvento(prev, cursor.c, cursor.e, (ev) => { ev.notas = ev.notas.filter(x => x.s !== cursor.s); }));
                    return;
                }
                setTab(prev => {
                    const t = clonarTab(prev);
                    t.compases[cursor.c].eventos.splice(cursor.e, 1);
                    return t;
                });
            };

            const elegirFigura = (dur) => {
                setFiguraActiva(dur);
                if (evento) setTab(prev => conEvento(prev, cursor.c, cursor.e, (ev) => { ev.dur = dur; }));
            };

            const alternarEvento = (campo, valor) => {
                if (!evento) { if (onAviso) onAviso("Pon primero una nota o un silencio"); return; }
                setTab(prev => conEvento(prev, cursor.c, cursor.e, (ev) => {
                    if (valor === undefined) ev[campo] = !ev[campo];
                    else ev[campo] = ev[campo] === valor ? null : valor;
                }));
            };

            const alternarTec = (cambio) => {
                if (!nota) { if (onAviso) onAviso("Pon primero una nota en esta cuerda"); return; }
                setTab(prev => conNota(prev, cursor, cambio));
            };

            const tecnicas = {
                h: () => alternarTec(t => { t.ligado = t.ligado === "h" ? null : "h"; }),
                p: () => alternarTec(t => { t.ligado = t.ligado === "p" ? null : "p"; }),
                tap: () => alternarTec(t => { t.tap = !t.tap; }),
                slide: (v) => alternarTec(t => {
                    if (v) { t.slide = t.slide === v ? null : v; return; }
                    const ciclo = [null, "a", "sube", "baja"];
                    t.slide = ciclo[(ciclo.indexOf(t.slide) + 1) % ciclo.length];
                }),
                bend: (forzar) => alternarTec(t => {
                    if (forzar) { t.bend = { tipo: tipoBend, cant: cantBend }; return; }
                    t.bend = t.bend ? null : { tipo: tipoBend, cant: cantBend };
                }),
                vibrato: () => alternarTec(t => { t.vibrato = !t.vibrato; }),
                muerta: () => alternarTec(t => { t.muerta = !t.muerta; }),
                fantasma: () => alternarTec(t => { t.fantasma = !t.fantasma; }),
                acento: () => alternarTec(t => { t.acento = !t.acento; }),
                armonico: (v) => alternarTec(t => { t.armonico = t.armonico === v ? null : v; })
            };

            // Cambiar el tipo o la medida del bend con uno ya puesto lo actualiza.
            const cambiarBend = (tipo, cant) => {
                setTipoBend(tipo); setCantBend(cant);
                if (nota && nota.tec.bend) setTab(prev => conNota(prev, cursor, t => { t.bend = { tipo, cant }; }));
            };

            /* --- Compases --- */
            const compasDespues = () => {
                setTab(prev => { const t = clonarTab(prev); t.compases.splice(cursor.c + 1, 0, Tab.createCompas()); return t; });
                irA(cursor.c + 1, 0);
            };
            const duplicarCompas = () => {
                setTab(prev => {
                    const t = clonarTab(prev);
                    const copia = clonarTab(t.compases[cursor.c]);
                    copia.id = Song.newId("cmp");
                    copia.eventos.forEach(ev => { ev.id = Song.newId("ev"); });
                    t.compases.splice(cursor.c + 1, 0, copia);
                    return t;
                });
                irA(cursor.c + 1, 0);
            };
            const borrarCompas = () => {
                if (tab.compases.length <= 1) {
                    setTab(prev => ({ ...prev, compases: [Tab.createCompas()] }));
                    irA(0, 0);
                    return;
                }
                setTab(prev => { const t = clonarTab(prev); t.compases.splice(cursor.c, 1); return t; });
                irA(Math.max(0, cursor.c - 1), 0);
                if (onAviso) onAviso(`Compás ${cursor.c + 1} borrado`, { texto: "Deshacer", alPulsar: () => historialTab.deshacer() });
            };

            /* --- Teclado, al estilo de la entrada TAB de MuseScore --- */
            const alPulsar = (e) => {
                if (e.ctrlKey || e.metaKey) {
                    const tecla = (e.key || "").toLowerCase();
                    if (tecla === "z" || tecla === "y") { e.preventDefault(); deshacerTab(tecla === "y" || e.shiftKey); }
                    return;
                }
                if (e.altKey) return;
                // Mayús + 1…6: la figura (se mira el código: con Mayús, «1» es «!»).
                const m = /^Digit([1-6])$/.exec(e.code || "");
                if (e.shiftKey && m) {
                    e.preventDefault();
                    const f = Tab.FIGURAS.find(x => x.tecla === m[1]);
                    if (f) elegirFigura(f.id);
                    return;
                }
                if (/^[0-9]$/.test(e.key)) { e.preventDefault(); cifra(parseInt(e.key, 10)); return; }
                const acciones = {
                    ArrowRight: derecha,
                    ArrowLeft: izquierda,
                    ArrowUp: () => irA(cursor.c, cursor.e, Math.min(cuerdas - 1, cursor.s + 1)),
                    ArrowDown: () => irA(cursor.c, cursor.e, Math.max(0, cursor.s - 1)),
                    Delete: borrar,
                    Backspace: borrar,
                    " ": derecha,
                    ".": () => alternarEvento("puntillo"),
                    r: ponerSilencio,
                    h: tecnicas.h,
                    p: tecnicas.p,
                    t: tecnicas.tap,
                    s: () => tecnicas.slide(),
                    b: () => tecnicas.bend(),
                    v: tecnicas.vibrato,
                    x: tecnicas.muerta,
                    g: tecnicas.fantasma,
                    a: tecnicas.acento,
                    n: () => tecnicas.armonico("natural"),
                    m: () => alternarEvento("pm"),
                    l: () => alternarEvento("letRing"),
                    "[": () => alternarEvento("pua", "abajo"),
                    "]": () => alternarEvento("pua", "arriba"),
                    Home: () => irA(cursor.c, 0),
                    End: () => irA(cursor.c, compas.eventos.length)
                };
                const accion = acciones[e.key] || acciones[(e.key || "").toLowerCase()];
                if (accion) { e.preventDefault(); accion(); }
            };

            const enfocarLienzo = () => { if (lienzo.current) lienzo.current.focus({ preventScroll: true }); };

            // Un botón de la paleta hace lo suyo y devuelve el foco a la hoja,
            // para seguir escribiendo sin volver a hacer clic.
            const yLuego = (fn) => (...a) => { fn(...a); setTimeout(enfocarLienzo, 0); };

            /* --- Lo que dice la barra de estado --- */
            const nombreCuerda = (s) => Tab.nombreDeNota(afinacion[s], 0).replace(/\d+$/, "");
            let tiempo = 1;
            if (compas) {
                let tk = 0;
                for (let i = 0; i < Math.min(cursor.e, compas.eventos.length); i++) tk += Tab.ticksDeEvento(compas.eventos[i]);
                tiempo = Math.floor(tk / Tab.ticksDelPulso(tab.compas)) + 1;
            }
            const estadoCompas = compas ? Tab.estadoDelCompas(compas, tab.compas) : "vacio";
            const estado = [
                `Compás ${cursor.c + 1}`,
                `tiempo ${tiempo}`,
                `cuerda ${cuerdas - cursor.s} (${nombreCuerda(cursor.s)})`,
                evento ? (nota ? `traste ${nota.f} · ${Tab.nombreDeNota(Tab.midiDeNota(tab, nota, afinacion), tab.armadura)}` : (evento.notas.length ? "acorde" : "silencio")) : "hueco",
                evento ? Tab.figura(evento.dur).nombre.toLowerCase() + (evento.puntillo ? " con puntillo" : "") + (evento.tresillo ? " de tresillo" : "") : `escribirás ${Tab.figura(figuraActiva).nombre.toLowerCase()}s`
            ].join(" · ");

            const presets = TUNING_PRESETS[tab.instrument] || [];
            const tec = nota ? nota.tec : Tab.tecVacia();

            const accionesTab = [
                { label: `Mis tablaturas (${tabs.length})`, hacer: () => setGestorAbierto(true) },
                { label: "Ver en la Biblioteca", hacer: onBiblioteca },
                { label: "Nueva tablatura", hacer: onNueva },
                { label: "Duplicar esta tablatura", hacer: () => onDuplicar(tab.id) },
                { label: "Guardar copia de seguridad", ayuda: "Un archivo JSON con esta tablatura", hacer: onCopia },
                { label: "Cargar una copia de seguridad…", hacer: () => setConfirmarImport(true) }
            ];

            return (
                <div class="k2-doc k3-tab">
                    <div class="k2-doc__cabeza">
                        <div class="k2-doc__fila">
                            <div class="k2-doc__titulo">
                                <Campo etiqueta="Título">
                                    {(id) => <input id={id} type="text" value={tab.title} onChange={(e) => setTab(prev => ({ ...prev, title: e.target.value }))} />}
                                </Campo>
                            </div>
                            <div class="k2-doc__medio">
                                <Campo etiqueta="Artista o autor">
                                    {(id) => <input id={id} type="text" value={tab.artista} onChange={(e) => setTab(prev => ({ ...prev, artista: e.target.value }))} />}
                                </Campo>
                            </div>
                            <div class="k2-doc__corto">
                                <Campo etiqueta="Tempo (bpm)">
                                    {(id) => (
                                        <input id={id} type="number" min="30" max="300" value={tab.bpm}
                                            onChange={(e) => setTab(prev => ({ ...prev, bpm: Math.max(30, Math.min(300, parseInt(e.target.value) || 90)) }))} />
                                    )}
                                </Campo>
                            </div>
                        </div>
                        <div class="k2-doc__fila k2-doc__controles">
                            <button type="button" onClick={isPlaying ? onStop : () => onPlay()}
                                class={`k-btn k-btn--touch k2-boton-texto ${isPlaying ? "k-btn--danger" : "k-btn--primary"}`}>
                                <Icono nombre={isPlaying ? "parar" : "reproducir"} />
                                <span>{isPlaying ? "Parar" : "Escuchar"}</span>
                            </button>
                            <button type="button" onClick={() => onPlay(cursor.c)} disabled={isPlaying} class="k-btn k-btn--outline k-btn--touch k2-boton-texto">
                                <span>Desde el compás {cursor.c + 1}</span>
                            </button>
                            <BotonIcono icono="repetir" etiqueta="Repetir en bucle" activo={repetir} onClick={onRepetir} variante="borde" />
                            <div class="k2-doc__empuje"></div>
                            <BotonIcono icono="deshacer" etiqueta="Deshacer (Ctrl+Z)" onClick={() => deshacerTab(false)} disabled={!historialTab.hayQueDeshacer} />
                            <BotonIcono icono="rehacer" etiqueta="Rehacer (Ctrl+Shift+Z)" onClick={() => deshacerTab(true)} disabled={!historialTab.hayQueRehacer} />
                            <MenuAcciones etiqueta="Más acciones de la tablatura" titulo={tab.title || "Tablatura"} opciones={accionesTab} variante="borde" />
                        </div>
                    </div>

                    <div class="k3-tab__rejilla">
                        <div class="k3-tab__paleta">
                            {gestorAbierto && (
                                <GestorArchivos
                                    titulo="Tus tablaturas"
                                    nuevo="+ Nueva tablatura"
                                    abierto="abierta"
                                    elementos={tabs}
                                    activoId={tab.id}
                                    resumen={(t) => `${t.compases.length} ${t.compases.length === 1 ? "compás" : "compases"} · ${t.bpm} bpm`}
                                    onAbrir={onAbrir}
                                    onNuevo={onNueva}
                                    onDuplicar={onDuplicar}
                                    onBorrar={onBorrar}
                                    onBorrarTodo={onBorrarTodas}
                                    onCerrar={() => setGestorAbierto(false)}
                                />
                            )}

                            <section class="k2-tarjeta k2-tarjeta--plegable">
                                <Seccion id="tab-escribir" titulo={<span class="k2-paso">Figuras</span>}>
                                    <div class="k3-paleta__fila" role="group" aria-label="Figura">
                                        {Tab.FIGURAS.map(f => (
                                            <BotonPaleta key={f.id} activo={(evento ? evento.dur : figuraActiva) === f.id}
                                                titulo={`${f.nombre} (Mayús+${f.tecla})`} onClick={yLuego(() => elegirFigura(f.id))}>
                                                <IconoFigura dur={f.id} />
                                            </BotonPaleta>
                                        ))}
                                    </div>
                                    <div class="k3-paleta__fila">
                                        <BotonPaleta activo={evento ? evento.puntillo : false} titulo="Puntillo (.)" onClick={yLuego(() => alternarEvento("puntillo"))}>Puntillo</BotonPaleta>
                                        <BotonPaleta activo={evento ? evento.tresillo : false} titulo="Tresillo" onClick={yLuego(() => alternarEvento("tresillo"))}>Tresillo</BotonPaleta>
                                        <BotonPaleta titulo="Silencio (R)" onClick={yLuego(ponerSilencio)}>Silencio</BotonPaleta>
                                    </div>
                                </Seccion>
                            </section>

                            <section class="k2-tarjeta k2-tarjeta--plegable">
                                <Seccion id="tab-tecnicas" titulo={<span class="k2-paso">Técnicas de la nota</span>}>

                                    <div class="k3-paleta__fila">
                                        <BotonPaleta activo={tec.ligado === "h"} titulo="Hammer-on (H)" onClick={yLuego(tecnicas.h)}>H</BotonPaleta>
                                        <BotonPaleta activo={tec.ligado === "p"} titulo="Pull-off (P)" onClick={yLuego(tecnicas.p)}>P</BotonPaleta>
                                        <BotonPaleta activo={tec.tap} titulo="Tapping (T)" onClick={yLuego(tecnicas.tap)}>T</BotonPaleta>
                                        <BotonPaleta activo={tec.slide === "a"} titulo="Slide hasta la siguiente (S)" onClick={yLuego(() => tecnicas.slide("a"))}>Slide</BotonPaleta>

                                    <div class="k3-paleta__fila">

                                        <BotonPaleta activo={!!tec.bend} titulo="Poner o quitar el bend (B)" onClick={yLuego(() => tecnicas.bend())} ancho>{tec.bend ? "Quitar bend" : "Poner bend"}</BotonPaleta>
                                    </div>
                                    <p class="k2-etiqueta">Efectos</p>
                                    <div class="k3-paleta__fila">
                                        <BotonPaleta activo={tec.vibrato} titulo="Vibrato (V)" onClick={yLuego(tecnicas.vibrato)}>Vibrato</BotonPaleta>
                                        <BotonPaleta activo={tec.muerta} titulo="Nota muerta (X)" onClick={yLuego(tecnicas.muerta)}>✕ Muerta</BotonPaleta>
                                        <BotonPaleta activo={tec.fantasma} titulo="Nota fantasma (G)" onClick={yLuego(tecnicas.fantasma)}>( ) Fantasma</BotonPaleta>
                                        <BotonPaleta activo={tec.acento} titulo="Acento (A)" onClick={yLuego(tecnicas.acento)}>&gt; Acento</BotonPaleta>
                                        <BotonPaleta activo={tec.armonico === "natural"} titulo="Armónico natural (N)" onClick={yLuego(() => tecnicas.armonico("natural"))}>&lt;&gt; Natural</BotonPaleta>

                                    </div>
                                </Seccion>
                            </section>

                            <section class="k2-tarjeta k2-tarjeta--plegable">
                                <Seccion id="tab-mano" titulo={<span class="k2-paso">Mano derecha</span>}>
                                    <div class="k3-paleta__fila">

                                            <svg width="16" height="16" viewBox="-2 -2 13 13" aria-hidden="true"><path d={GLIFOS.puaAbajo} fill="none" stroke="currentColor" strokeWidth="1.4" /><rect x="0" y="0" width="9" height="2.4" fill="currentColor" /></svg>
                                            <span>Abajo</span>
                                        </BotonPaleta>
                                        <BotonPaleta activo={evento && evento.pua === "arriba"} titulo="Púa hacia arriba (])" onClick={yLuego(() => alternarEvento("pua", "arriba"))}>
                                            <svg width="16" height="16" viewBox="-2 -2 13 13" aria-hidden="true"><path d={GLIFOS.puaArriba} fill="none" stroke="currentColor" strokeWidth="1.4" /></svg>
                                            <span>Arriba</span>
                                        </BotonPaleta>
                                        <BotonPaleta activo={evento && evento.pm} titulo="Palm mute (M)" onClick={yLuego(() => alternarEvento("pm"))}>P.M.</BotonPaleta>
                                        <BotonPaleta activo={evento && evento.letRing} titulo="Let ring (L)" onClick={yLuego(() => alternarEvento("letRing"))}>Let ring</BotonPaleta>
                                        <BotonPaleta activo={evento && evento.sweep === "abajo"} titulo="Sweep hacia abajo" onClick={yLuego(() => alternarEvento("sweep", "abajo"))}>Sweep ↓</BotonPaleta>
                                        <BotonPaleta activo={evento && evento.sweep === "arriba"} titulo="Sweep hacia arriba" onClick={yLuego(() => alternarEvento("sweep", "arriba"))}>Sweep ↑</BotonPaleta>
                                    </div>
                                    <Campo etiqueta="Texto encima" ayuda="Un acorde, una indicación… va sobre este tiempo.">
                                        {(id, ayuda) => (
                                            <input id={id} aria-describedby={ayuda} type="text" maxLength={40} disabled={!evento}
                                                value={evento ? evento.texto : ""}
                                                onChange={(e) => { const v = e.target.value; setTab(prev => conEvento(prev, cursor.c, cursor.e, (ev) => { ev.texto = v; })); }} />
                                        )}
                                    </Campo>
                                </Seccion>
                            </section>

                            <section class="k2-tarjeta k2-tarjeta--plegable">
                                <Seccion id="tab-teclado" titulo={<span class="k2-paso">Teclado de trastes</span>}>
                                    <div class="k3-trastes" role="group" aria-label="Trastes">

                                            <button key={f} type="button" class="k3-trastes__boton" onClick={yLuego(() => ponerTraste(f))} aria-label={`Traste ${f}`}>{f}</button>
                                        ))}
                                    </div>
                                    <div class="k3-paleta__fila k3-flechas">
                                        <BotonPaleta titulo="Evento anterior (←)" onClick={yLuego(izquierda)}>←</BotonPaleta>
                                        <BotonPaleta titulo="Cuerda más aguda (↑)" onClick={yLuego(() => irA(cursor.c, cursor.e, Math.min(cuerdas - 1, cursor.s + 1)))}>↑</BotonPaleta>
                                        <BotonPaleta titulo="Cuerda más grave (↓)" onClick={yLuego(() => irA(cursor.c, cursor.e, Math.max(0, cursor.s - 1)))}>↓</BotonPaleta>
                                        <BotonPaleta titulo="Evento siguiente (→)" onClick={yLuego(derecha)}>→</BotonPaleta>
                                        <BotonPaleta titulo="Borrar la nota (Supr)" onClick={yLuego(borrar)}>Borrar</BotonPaleta>
                                    </div>
                                </Seccion>

                            <section class="k2-tarjeta k2-tarjeta--plegable">
                                <Seccion id="tab-compases" titulo={<span class="k2-paso">Compases <span class="k-chip">{tab.compases.length}</span></span>}>

                                        <BotonPaleta titulo="Borrar este compás" onClick={yLuego(borrarCompas)}>Borrar compás</BotonPaleta>

                            <section class="k2-tarjeta k2-tarjeta--plegable">
                                <Seccion id="tab-datos" titulo={<span class="k2-paso">Instrumento y compás</span>} abiertaPorDefecto={false}>
                                    <div class="k3-datos">
                                        <Campo etiqueta="Instrumento">
                                            {(id) => (
                                                <select id={id} value={tab.instrument} onChange={(e) => {
                                                    const inst = e.target.value;
                                                    const p = (TUNING_PRESETS[inst] || [])[0];
                                                    const n = getInstrument(inst).strings;
                                                    setTab(prev => {
                                                        const t = clonarTab(prev);
                                                        t.instrument = inst;
                                                        t.tuning = p ? p.notes.slice() : [];
                                                        t.tuningName = p ? p.name : "";
                                                        t.tuningMidi = p && p.midi ? p.midi.slice() : null;
                                                        // Las notas en cuerdas que ya no existen se pierden.
                                                        t.compases.forEach(c => c.eventos.forEach(ev => { ev.notas = ev.notas.filter(x => x.s < n); }));
                                                        return t;
                                                    });
                                                }}>
                                                    {INSTRUMENT_ORDER.map(i => <option key={i} value={i}>{INSTRUMENTS[i].name}</option>)}
                                                </select>

                                        </Campo>
                                        <Campo etiqueta="Afinación">
                                            {(id) => (

                                                    if (p) setTab(prev => ({ ...prev, tuning: p.notes.slice(), tuningName: p.name, tuningMidi: p.midi ? p.midi.slice() : null }));

                                        <Campo etiqueta="Nota de la tablatura">

    <!-- ===================================================================
         0.3 · LA BIBLIOTECA
         =================================================================== -->
    <script type="text/plain" id="app-source-biblioteca">
        /* =====================================================================
         * LA BIBLIOTECA (0.3)
         *
         * Todo lo guardado en un sitio: canciones, ejercicios, tablaturas y
         * acordes. Antes cada cosa tenía su gestor dentro de su sección (y los
         * acordes, dentro de Canción); aquí se ven juntos y se gestionan igual.
         *
         * Lo que la Biblioteca sabe de cada pieza que no es de la pieza —si
         * está fijada, sus etiquetas, cuándo se tocó— va en su propia clave
         * (`kharo.biblioteca.v1`), por id. Así Prime, que normaliza canciones
         * y ejercicios tirando lo que no conoce, no lo borra al guardar.
         * ===================================================================== */
        const CLAVE_META_BIBLIOTECA = "kharo.biblioteca.v1";
        const CLAVE_VISTA_BIBLIOTECA = "kharo.v03.biblioteca.vista";

        function leerMetaBiblioteca() {
            try {
                const v = JSON.parse(localStorage.getItem(CLAVE_META_BIBLIOTECA) || "{}");
                return v && typeof v === "object" && !Array.isArray(v) ? v : {};
            } catch (e) { return {}; }
        }
        function guardarMetaBiblioteca(meta) {
            try { localStorage.setItem(CLAVE_META_BIBLIOTECA, JSON.stringify(meta)); } catch (e) {}
        }

        // Los ids de Kharo llevan dentro la hora en que se crearon
        // (`newId`: prefijo-<Date.now() en base 36><azar>). Es la fecha de
        // respaldo para lo que la Biblioteca todavía no ha visto cambiar.
        function fechaDeId(id) {
            const m = /^[a-z]+-([0-9a-z]{8})/.exec(String(id || ""));
            if (!m) return 0;
            const t = parseInt(m[1], 36);
            return t > 1.4e12 && t < 4e12 ? t : 0;
        }

        function haceCuanto(ms) {
            if (!ms) return "";
            const s = (Date.now() - ms) / 1000;
            if (s < 60) return "ahora mismo";
            if (s < 3600) { const n = Math.round(s / 60); return `hace ${n} min`; }
            if (s < 86400) { const n = Math.round(s / 3600); return `hace ${n} ${n === 1 ? "hora" : "horas"}`; }
            const d = Math.round(s / 86400);
            if (d === 1) return "ayer";
            if (d < 30) return `hace ${d} días`;
            return new Date(ms).toLocaleDateString("es", { day: "numeric", month: "short", year: "numeric" });
        }

        const TIPOS_BIBLIOTECA = [
            { id: "cancion", label: "Canciones", uno: "canción", icono: "cancion", genero: "f" },
            { id: "ejercicio", label: "Ejercicios", uno: "ejercicio", icono: "ejercicios", genero: "m" },
            { id: "tablatura", label: "Tablaturas", uno: "tablatura", icono: "tablatura", genero: "f" },
            { id: "acorde", label: "Acordes", uno: "acorde", icono: "acordes", genero: "m" }
        ];
        const tipoBib = (id) => TIPOS_BIBLIOTECA.find(t => t.id === id);
        const claveItem = (it) => `${it.tipo}:${it.id}`;

        /* La miniatura de cada tipo: lo de verdad, en pequeño. */
        function MiniaturaItem({ item }) {
            if (item.tipo === "acorde") {
                return <div class="k3-mini k3-mini--acorde"><DiagramaKharo escena={escenaDeAcorde(item.datos, "dedos", null)} /></div>;
            }
            if (item.tipo === "ejercicio") {
                const paso = item.datos.pasos[0];
                return (
                    <div class="k3-mini k3-mini--ejercicio">
                        {paso ? <DiagramaDePaso paso={paso} /> : <span class="k3-mini__vacio">Sin pasos todavía</span>}
                        {item.datos.pasos.length > 1 && <span class="k3-mini__mas">+{item.datos.pasos.length - 1}</span>}
                    </div>
                );
            }
            if (item.tipo === "tablatura") {
                const hay = item.datos.compases.some(c => c.eventos.length);
                return <div class="k3-mini k3-mini--tab">{hay ? <MiniaturaTab tab={item.datos} /> : <span class="k3-mini__vacio">Sin notas todavía</span>}</div>;
            }
            // Canción: no tiene un dibujo propio que quepa; se enseñan sus
            // acordes como fichas, que es lo que se reconoce de un vistazo.
            const nombres = item.acordesUsados || [];
            return (
                <div class="k3-mini k3-mini--cancion">
                    {nombres.length ? (
                        <div class="k3-mini__acordes">
                            {nombres.slice(0, 8).map((n, i) => <span key={i} class="k3-mini__acorde">{n}</span>)}
                            {nombres.length > 8 && <span class="k3-mini__acorde k3-mini__acorde--mas">+{nombres.length - 8}</span>}
                        </div>
                    ) : <span class="k3-mini__vacio">Sin acordes todavía</span>}
                </div>
            );
        }

        /* --- UNA TARJETA ---------------------------------------------------------- */
        function TarjetaBiblioteca({ item, vista, elegido, seleccionando, renombrando, onElegir, onAbrir, onMenu, onFijar, onRenombrar, onCancelarRenombre, onTeclas }) {
            const t = tipoBib(item.tipo);
            const [nombre, setNombre] = useState(item.titulo);
            const campo = useRef(null);
            useEffect(() => {
                if (renombrando) { setNombre(item.titulo); setTimeout(() => { if (campo.current) { campo.current.focus(); campo.current.select(); } }, 0); }
            }, [renombrando]);

            const confirmar = () => {
                const limpio = nombre.trim();
                if (limpio && limpio !== item.titulo) onRenombrar(limpio);
                else onCancelarRenombre();
            };

            return (
                <article
                    class={`k3-item k3-item--${vista} ${elegido ? "k3-item--elegido" : ""} ${item.abierto ? "k3-item--abierto" : ""}`}
                    onContextMenu={(e) => { e.preventDefault(); onMenu({ x: e.clientX, y: e.clientY }); }}
                    onKeyDown={onTeclas}
                >
                    <label class={`k3-item__elegir ${seleccionando ? "k3-item__elegir--visible" : ""}`}>
                        <input type="checkbox" checked={elegido} onChange={() => {}} onClick={(e) => onElegir(e.shiftKey)}
                            aria-label={`Elegir ${t.uno} «${item.titulo}»`} />
                    </label>

                    {vista === "rejilla" && (
                        <button type="button" class="k3-item__mini" onClick={onAbrir} tabIndex={-1} aria-hidden="true">
                            <MiniaturaItem item={item} />
                        </button>
                    )}

                    <div class="k3-item__cuerpo">
                        <div class="k3-item__tipo">
                            <Icono nombre={t.icono} tam={14} />
                            <span>{t.uno}</span>
                            {item.abierto && <span class="k3-item__abierto">{t.genero === "f" ? "abierta" : "abierto"}</span>}
                        </div>
                        {renombrando ? (
                            <input
                                ref={campo}
                                type="text"
                                class="k-field k3-item__renombrar"
                                value={nombre}
                                aria-label={`Nuevo nombre de «${item.titulo}»`}
                                onChange={(e) => setNombre(e.target.value)}
                                onBlur={confirmar}
                                onKeyDown={(e) => {
                                    e.stopPropagation();
                                    if (e.key === "Enter") { e.preventDefault(); confirmar(); }
                                    if (e.key === "Escape") { e.preventDefault(); onCancelarRenombre(); }
                                }}
                            />
                        ) : (
                            <h3 class="k3-item__titulo">
                                <button type="button" onClick={onAbrir} class="k3-item__abrir" title={`Abrir «${item.titulo}» (Enter) · Renombrar (F2)`}>
                                    {item.titulo || "Sin título"}
                                </button>
                            </h3>
                        )}
                        <p class="k3-item__resumen">{item.resumen}</p>
                        {(item.etiquetas.length > 0 || item.fecha) && (
                            <div class="k3-item__pie">
                                {item.etiquetas.map(e => <span key={e} class="k3-etiqueta">#{e}</span>)}
                                {item.fecha ? <span class="k3-item__fecha">{haceCuanto(item.fecha)}</span> : null}
                            </div>
                        )}
                    </div>

                    <div class="k3-item__acciones">
                        <BotonIcono icono="fijar" etiqueta={item.fijado ? `Desfijar «${item.titulo}»` : `Fijar «${item.titulo}» arriba`} activo={item.fijado} onClick={onFijar} />
                        <BotonIcono icono="mas" etiqueta={`Más acciones de «${item.titulo}»`}
                            onClick={(e) => { const r = e.currentTarget.getBoundingClientRect(); onMenu({ x: r.right - 220, y: r.bottom + 4 }); }}
                            extra={{ "aria-haspopup": "menu" }} />
                    </div>
                </article>
            );
        }

        /* --- EL DIÁLOGO DE ETIQUETAS ----------------------------------------------- */
        function DialogoEtiquetas({ titulo, actuales, todas, onCambio, onCerrar }) {
            const [texto, setTexto] = useState("");
            const limpiar = (s) => s.trim().replace(/^#/, "").replace(/\s+/g, " ").slice(0, 24);
            const anadir = (e) => {
                const v = limpiar(e);
                if (!v || actuales.some(x => x.toLowerCase() === v.toLowerCase())) { setTexto(""); return; }
                onCambio([...actuales, v]);
                setTexto("");
            };
            const sugeridas = todas.filter(e => !actuales.includes(e) && (!texto || e.toLowerCase().includes(texto.toLowerCase())));
            return (
                <Dialogo titulo={titulo} ancho="440px" onCerrar={onCerrar}
                    descripcion="Sirven para agrupar: «Repertorio», «Calentamiento», «Para el ensayo»…"
                    acciones={<button type="button" onClick={onCerrar} class="k-btn k-btn--primary k-btn--touch px-4 py-2.5 k-text-sm">Listo</button>}>
                    <div class="k3-etiquetas-editor">
                        {actuales.length ? actuales.map(e => (
                            <span key={e} class="k3-etiqueta k3-etiqueta--quitar">
                                #{e}
                                <button type="button" aria-label={`Quitar la etiqueta ${e}`} onClick={() => onCambio(actuales.filter(x => x !== e))}><Icono nombre="cerrar" tam={12} /></button>
                            </span>
                        )) : <p class="k2-ayuda">Todavía sin etiquetas.</p>}
                    </div>
                    <Campo etiqueta="Añadir una etiqueta">
                        {(id) => (
                            <input id={id} type="text" value={texto} maxLength={24} placeholder="Escribe y pulsa Enter"
                                onChange={(e) => setTexto(e.target.value)}
                                onKeyDown={(e) => { if (e.key === "Enter" || e.key === ",") { e.preventDefault(); anadir(texto); } }} />
                        )}
                    </Campo>
                    {sugeridas.length > 0 && (
                        <div class="k3-etiquetas-editor">
                            {sugeridas.slice(0, 12).map(e => (
                                <button key={e} type="button" class="k3-etiqueta k3-etiqueta--sugerida" onClick={() => anadir(e)}>+ #{e}</button>
                            ))}
                        </div>
                    )}
                </Dialogo>
            );
        }

        /* --- LA VISTA -------------------------------------------------------------- */
        function Biblioteca({ items, todasLasEtiquetas, onAbrir, onNuevo, onRenombrar, onDuplicar, onBorrar, onBorrarVarios,
                              onFijar, onEtiquetas, onImprimir, onCopia, onAviso }) {
            const [vistaGuardada] = useState(() => {
                try { return JSON.parse(localStorage.getItem(CLAVE_VISTA_BIBLIOTECA) || "{}") || {}; } catch (e) { return {}; }
            });
            const [tipo, setTipo] = useState(vistaGuardada.tipo || "todo");
            const [orden, setOrden] = useState(vistaGuardada.orden || "recientes");
            const [vista, setVista] = useState(vistaGuardada.vista || "rejilla");
            const [soloFijados, setSoloFijados] = useState(false);
            const [etiqueta, setEtiqueta] = useState(null);
            const [busqueda, setBusqueda] = useState("");
            const [elegidos, setElegidos] = useState(() => new Set());
            const [ultimoElegido, setUltimoElegido] = useState(null);
            const [renombrando, setRenombrando] = useState(null);
            const [menu, setMenu] = useState(null);
            const [menuNuevo, setMenuNuevo] = useState(null);
            const [editarEtiquetas, setEditarEtiquetas] = useState(null); // [claves]
            const [borrarVarios, setBorrarVarios] = useState(null);
            const [usos, setUsos] = useState(null);
            const buscador = useRef(null);
            const raiz = useRef(null);

            useEffect(() => {
                try { localStorage.setItem(CLAVE_VISTA_BIBLIOTECA, JSON.stringify({ tipo, orden, vista })); } catch (e) {}
            }, [tipo, orden, vista]);

            // Una etiqueta elegida que ya no existe (se quitó de todo) deja de filtrar.
            useEffect(() => { if (etiqueta && !todasLasEtiquetas.includes(etiqueta)) setEtiqueta(null); }, [todasLasEtiquetas, etiqueta]);

            const cuenta = (id) => items.filter(i => i.tipo === id).length;
            const texto = busqueda.trim().toLowerCase();
            const visibles = items
                .filter(i => tipo === "todo" || i.tipo === tipo)
                .filter(i => !soloFijados || i.fijado)
                .filter(i => !etiqueta || i.etiquetas.includes(etiqueta))
                .filter(i => !texto || (i.titulo + " " + i.resumen + " " + i.etiquetas.join(" ") + " " + tipoBib(i.tipo).uno).toLowerCase().includes(texto))
                .sort((a, b) => {
                    if (a.fijado !== b.fijado) return a.fijado ? -1 : 1;
                    if (orden === "nombre") return a.titulo.localeCompare(b.titulo, "es", { sensitivity: "base" });
                    if (orden === "tipo") return TIPOS_BIBLIOTECA.findIndex(t => t.id === a.tipo) - TIPOS_BIBLIOTECA.findIndex(t => t.id === b.tipo) || (b.fecha - a.fecha);
                    return (b.fecha || 0) - (a.fecha || 0);
                });

            const filtrando = tipo !== "todo" || soloFijados || etiqueta || texto;
            const recientes = filtrando ? [] : items.filter(i => i.visto).sort((a, b) => b.visto - a.visto).slice(0, 4);

            const elegidosLista = items.filter(i => elegidos.has(claveItem(i)));
            const seleccionando = elegidos.size > 0;

            const elegir = (item, conMayus) => {
                const clave = claveItem(item);
                setElegidos(prev => {
                    const nuevo = new Set(prev);
                    if (conMayus && ultimoElegido) {
                        const a = visibles.findIndex(i => claveItem(i) === ultimoElegido);
                        const b = visibles.findIndex(i => claveItem(i) === clave);
                        if (a !== -1 && b !== -1) {
                            visibles.slice(Math.min(a, b), Math.max(a, b) + 1).forEach(i => nuevo.add(claveItem(i)));
                            return nuevo;
                        }
                    }
                    if (nuevo.has(clave)) nuevo.delete(clave); else nuevo.add(clave);
                    return nuevo;
                });
                setUltimoElegido(clave);
            };
            const limpiarSeleccion = () => { setElegidos(new Set()); setUltimoElegido(null); };

            // Lo que se borra deja de estar elegido.
            useEffect(() => {
                setElegidos(prev => {
                    const existen = new Set(items.map(claveItem));
                    const nuevo = new Set([...prev].filter(k => existen.has(k)));
                    return nuevo.size === prev.size ? prev : nuevo;
                });
            }, [items]);

            /* Atajos de la vista: «/» busca, Ctrl+A elige todo lo visible y Esc
             * suelta la selección. No se disparan escribiendo en un campo. */
            useEffect(() => {
                const alPulsar = (e) => {
                    const foco = document.activeElement;
                    const enCampo = foco && (foco.tagName === "INPUT" && foco.type !== "checkbox" || foco.tagName === "TEXTAREA" || foco.tagName === "SELECT");
                    if (document.querySelector(".k2-dialogo")) return;
                    if (e.key === "/" && !enCampo) { e.preventDefault(); if (buscador.current) buscador.current.focus(); return; }
                    if ((e.ctrlKey || e.metaKey) && (e.key || "").toLowerCase() === "a" && !enCampo) {
                        e.preventDefault();
                        setElegidos(new Set(visibles.map(claveItem)));
                        return;
                    }
                    if (e.key === "Escape" && !enCampo && elegidos.size) { e.preventDefault(); limpiarSeleccion(); }
                };
                window.addEventListener("keydown", alPulsar);
                return () => window.removeEventListener("keydown", alPulsar);
            });

            const accionesDe = (item) => {
                const t = tipoBib(item.tipo);
                const lista = [
                    { label: "Abrir", hacer: () => onAbrir(item) },
                    { label: "Renombrar", ayuda: "F2", hacer: () => setRenombrando(claveItem(item)) },
                    { label: "Duplicar", hacer: () => onDuplicar(item) },
                    { label: item.fijado ? "Desfijar" : "Fijar arriba", hacer: () => onFijar([item], !item.fijado) },
                    { label: "Etiquetas…", hacer: () => setEditarEtiquetas([claveItem(item)]) },
                    { label: "Descargar PDF", hacer: () => onImprimir([item], "pdf") },
                    { label: "Imprimir", hacer: () => onImprimir([item], "imprimir") }
                ];
                if (item.tipo !== "acorde") lista.push({ label: "Guardar copia de seguridad", ayuda: "Un archivo JSON", hacer: () => onCopia(item) });
                if (item.tipo === "acorde" && item.usadoEn && item.usadoEn.length) {
                    lista.push({ label: `Dónde se usa (${item.usadoEn.length})`, hacer: () => setUsos(item) });
                }
                lista.push({ label: `Borrar ${t.genero === "f" ? "esta" : "este"} ${t.uno}`, hacer: () => onBorrar(item), estilo: { color: 'var(--k-danger)' } });
                return lista;
            };

            const teclasDe = (item) => (e) => {
                if (e.target.tagName === "INPUT" && e.target.type !== "checkbox") return;
                if (e.key === "F2") { e.preventDefault(); setRenombrando(claveItem(item)); }
                else if (e.key === "Delete") { e.preventDefault(); onBorrar(item); }
                else if (e.key === " " && e.target.tagName !== "BUTTON") { e.preventDefault(); elegir(item, e.shiftKey); }
            };

            const tarjeta = (item, enRecientes) => (
                <TarjetaBiblioteca
                    key={(enRecientes ? "r-" : "") + claveItem(item)}
                    item={item}
                    vista={enRecientes ? "rejilla" : vista}
                    elegido={elegidos.has(claveItem(item))}
                    seleccionando={seleccionando}
                    renombrando={!enRecientes && renombrando === claveItem(item)}
                    onElegir={(mayus) => elegir(item, mayus)}
                    onAbrir={() => onAbrir(item)}
                    onMenu={(pos) => setMenu({ item, ...pos })}
                    onFijar={() => onFijar([item], !item.fijado)}
                    onRenombrar={(n) => { onRenombrar(item, n); setRenombrando(null); }}
                    onCancelarRenombre={() => setRenombrando(null)}
                    onTeclas={teclasDe(item)}
                />
            );

            const etiquetasEditadas = editarEtiquetas ? items.filter(i => editarEtiquetas.includes(claveItem(i))) : [];
            // Con varias piezas, se editan las que tienen TODAS en común.
            const comunes = etiquetasEditadas.length
                ? etiquetasEditadas[0].etiquetas.filter(e => etiquetasEditadas.every(i => i.etiquetas.includes(e)))
                : [];

            const vacioPorTipo = {
                todo: { texto: "Aquí va a vivir todo lo que guardes: canciones, ejercicios, tablaturas y acordes. Empieza por uno.", accion: null },
                cancion: { texto: "Aún no hay canciones.", accion: { label: "Crear una canción", tipo: "cancion" } },
                ejercicio: { texto: "Aún no hay ejercicios.", accion: { label: "Crear un ejercicio", tipo: "ejercicio" } },
                tablatura: { texto: "Aún no hay tablaturas.", accion: { label: "Crear una tablatura", tipo: "tablatura" } },
                acorde: { texto: "Aún no hay acordes. Se guardan desde Acordes, con «Guardar acorde».", accion: { label: "Ir a Acordes", tipo: "acorde" } }
            };

            return (
                <div class="k3-bib" ref={raiz}>
                    <div class="k3-bib__cabeza">
                        <div class="k3-bib__fila">
                            <h1 class="k3-bib__titulo">Biblioteca</h1>
                            <span class="k3-bib__total">{items.length} {items.length === 1 ? "pieza" : "piezas"}</span>
                            <div class="k2-doc__empuje"></div>
                            <button type="button" class="k-btn k-btn--primary k-btn--touch k2-boton-texto" aria-haspopup="menu"
                                onClick={(e) => { const r = e.currentTarget.getBoundingClientRect(); setMenuNuevo({ x: r.right - 212, y: r.bottom + 4 }); }}>
                                <Icono nombre="sumar" />
                                <span>Nuevo</span>
                            </button>
                        </div>

                        <div class="k3-bib__fila">
                            <label class="k3-bib__buscar">
                                <Icono nombre="buscar" tam={16} />
                                <span class="k2-oculto">Buscar en la biblioteca</span>
                                <input ref={buscador} type="search" value={busqueda} placeholder="Buscar  ( / )"
                                    onChange={(e) => setBusqueda(e.target.value)}
                                    onKeyDown={(e) => { if (e.key === "Escape") { setBusqueda(""); e.currentTarget.blur(); } }} />
                            </label>
                            <div class="k3-bib__orden">
                                <label class="k2-oculto" htmlFor="k3-bib-orden">Ordenar</label>
                                <select id="k3-bib-orden" value={orden} onChange={(e) => setOrden(e.target.value)} class="k-field">
                                    <option value="recientes">Recientes primero</option>
                                    <option value="nombre">Por nombre</option>
                                    <option value="tipo">Por tipo</option>
                                </select>
                            </div>
                            <Segmentado etiqueta={null} tam="sm" valor={vista} onCambio={setVista}
                                opciones={[{ id: "rejilla", label: "Fichas" }, { id: "lista", label: "Lista" }]} />
                        </div>

                        <div class="k3-bib__filtros" role="group" aria-label="Filtrar">
                            {[{ id: "todo", label: "Todo", n: items.length }, ...TIPOS_BIBLIOTECA.map(t => ({ id: t.id, label: t.label, n: cuenta(t.id) }))].map(f => (
                                <button key={f.id} type="button" aria-pressed={tipo === f.id} onClick={() => setTipo(f.id)}
                                    class={`k3-filtro ${tipo === f.id ? "k3-filtro--activo" : ""}`}>
                                    {f.label} <span class="k3-filtro__n">{f.n}</span>
                                </button>
                            ))}
                            <span class="k3-bib__sep" aria-hidden="true"></span>
                            <button type="button" aria-pressed={soloFijados} onClick={() => setSoloFijados(v => !v)}
                                class={`k3-filtro ${soloFijados ? "k3-filtro--activo" : ""}`}>
                                <Icono nombre="fijar" tam={14} /> Fijados
                            </button>
                            {todasLasEtiquetas.map(e => (
                                <button key={e} type="button" aria-pressed={etiqueta === e} onClick={() => setEtiqueta(etiqueta === e ? null : e)}
                                    class={`k3-filtro k3-filtro--etiqueta ${etiqueta === e ? "k3-filtro--activo" : ""}`}>#{e}</button>
                            ))}
                        </div>
                    </div>

                    {seleccionando && (
                        <div class="k3-bib__seleccion" role="toolbar" aria-label="Acciones con lo elegido">
                            <strong>{elegidos.size} {elegidos.size === 1 ? "elegida" : "elegidas"}</strong>
                            <button type="button" class="k-btn k-btn--outline k-btn--touch k2-boton-texto" onClick={() => setElegidos(new Set(visibles.map(claveItem)))}>Elegir todo</button>
                            <div class="k2-doc__empuje"></div>
                            <button type="button" class="k-btn k-btn--outline k-btn--touch k2-boton-texto" onClick={() => onImprimir(elegidosLista, "pdf")}><Icono nombre="exportar" /><span>PDF</span></button>
                            <button type="button" class="k-btn k-btn--outline k-btn--touch k2-boton-texto" onClick={() => onImprimir(elegidosLista, "imprimir")}><Icono nombre="imprimir" /><span>Imprimir</span></button>
                            <button type="button" class="k-btn k-btn--outline k-btn--touch k2-boton-texto" onClick={() => setEditarEtiquetas([...elegidos])}><Icono nombre="etiqueta" /><span>Etiquetar</span></button>
                            <button type="button" class="k-btn k-btn--outline k-btn--touch k2-boton-texto" onClick={() => onFijar(elegidosLista, !elegidosLista.every(i => i.fijado))}>
                                <Icono nombre="fijar" /><span>{elegidosLista.every(i => i.fijado) ? "Desfijar" : "Fijar"}</span>
                            </button>

                    <div class="k3-bib__cuerpo">
                        {recientes.length > 0 && (

                            {visibles.length === 0 ? (

                                                </button>

                    {menu && (

                    {menuNuevo && (
                        <MenuContextualAccesible x={menuNuevo.x} y={menuNuevo.y} titulo="Nuevo" onCerrar={() => setMenuNuevo(null)}
                            opciones={[
                                { label: "Canción", hacer: () => onNuevo("cancion") },
                                { label: "Ejercicio", hacer: () => onNuevo("ejercicio") },
                                { label: "Tablatura", hacer: () => onNuevo("tablatura") },
                                { label: "Acorde (desde el mástil)", hacer: () => onNuevo("acorde") }
                            ]} />
                    )}
                    {editarEtiquetas && etiquetasEditadas.length > 0 && (
                        <DialogoEtiquetas
                            titulo={etiquetasEditadas.length === 1 ? `Etiquetas de «${etiquetasEditadas[0].titulo}»` : `Etiquetas de ${etiquetasEditadas.length} piezas`}
                            actuales={comunes}
                            todas={todasLasEtiquetas}
                            onCambio={(nuevas) => {
                                // Con varias: lo que se añade se añade a todas y lo
                                // que se quita de las comunes se quita de todas.
                                const quitadas = comunes.filter(e => !nuevas.includes(e));
                                const anadidas = nuevas.filter(e => !comunes.includes(e));
                                onEtiquetas(etiquetasEditadas, (actual) => {
                                    const r = actual.filter(e => !quitadas.includes(e));
                                    anadidas.forEach(e => { if (!r.includes(e)) r.push(e); });

                                });

                            onCerrar={() => setEditarEtiquetas(null)}
                        />
                    )}
                    {borrarVarios && (
                        <DialogoBorrar
                            titulo={`¿Borrar ${borrarVarios.length} ${borrarVarios.length === 1 ? "pieza" : "piezas"}?`}
                            pierde={TIPOS_BIBLIOTECA.map(t => {
                                const n = borrarVarios.filter(i => i.tipo === t.id).length;
                                return n ? `${n} ${n === 1 ? t.uno : t.label.toLowerCase()}` : null;
                            }).filter(Boolean).join(", ") + ". Se puede deshacer desde el aviso."}
                            conserva={borrarVarios.some(i => i.tipo === "acorde")
                                ? "Las canciones: sólo pierden los compases con los acordes que borres."
                                : "Todo lo que no has elegido."}
                            textoBorrar="Borrar"
                            onBorrar={() => { onBorrarVarios(borrarVarios); limpiarSeleccion(); }}

                    {usos && (
                        <Dialogo titulo={`Dónde se usa «${usos.titulo}»`} ancho="420px" onCerrar={() => setUsos(null)}
                            descripcion="Si lo borras, estas canciones pierden los compases que lo llevan.">
                            <ul class="k3-usos">
                                {usos.usadoEn.map(c => (
                                    <li key={c.id}>
                                        <button type="button" class="k3-usos__enlace" onClick={() => { setUsos(null); onAbrir({ tipo: "cancion", id: c.id }); }}>
                                            <Icono nombre="cancion" tam={16} /> {c.title || "Canción sin título"} <span class="k-chip">{c.veces} {c.veces === 1 ? "compás" : "compases"}</span>
                                        </button>

        }

        /* --- LA HOJA DE ACORDES -----------------------------------------------------
         * Para imprimir acordes sueltos desde la Biblioteca: una rejilla A4 de
         * diagramas, con la misma tinta que las demás hojas. */
        function HojaDeAcordes({ acordes, titulo }) {
            const porFila = 4, ancho = 170, alto = 214, filas = 4;
            const porPagina = porFila * filas;
            const paginas = [];
            for (let i = 0; i < acordes.length; i += porPagina) paginas.push(acordes.slice(i, i + porPagina));
            if (!paginas.length) paginas.push([]);
            const huecoX = (HOJA.ancho - HOJA.margenX * 2 - porFila * ancho) / (porFila - 1);
            return (
                <div class="space-y-4">
                    {paginas.map((lista, ip) => (
                        <svg key={ip} data-song-sheet="1" width={HOJA.ancho} height={HOJA.alto} viewBox={`0 0 ${HOJA.ancho} ${HOJA.alto}`} class="k-sheet-page">
                            <rect width={HOJA.ancho} height={HOJA.alto} fill={HOJA.papel} />
                            <text x={HOJA.ancho / 2} y={78} textAnchor="middle" fontFamily={SANS_FAMILIA} fontSize="30" fontWeight="800" fill={HOJA.tinta}>{titulo || "Acordes"}</text>
                            <rect x={HOJA.margenX} y={104} width={HOJA.ancho - HOJA.margenX * 2} height={2} fill={HOJA.tinta} />
                            {lista.map((c, i) => (
                                <g key={c.id} transform={`translate(${HOJA.margenX + (i % porFila) * (ancho + huecoX)}, ${130 + Math.floor(i / porFila) * (alto + 26)})`}>
                                    <DiagramaKharo escena={escenaDeAcorde(c, "dedos", null)} ancho={ancho} alto={alto} />
                                </g>
                            ))}
                            <text x={HOJA.ancho / 2} y={HOJA.alto - 28} textAnchor="middle" fontFamily={SANS_FAMILIA} fontSize="10" fill={HOJA.tintaSuave}>
                                {ip + 1} / {paginas.length}   ·   Kharo Studio
                            </text>
                        </svg>
                    ))}
                </div>
            );
        }

        /* --- LA IMPRENTA --------------------------------------------------------------
         * Fuera de la pantalla se montan las hojas de lo que se va a imprimir o
         * a pasar a PDF —aunque no esté abierto—, y la App recoge sus páginas
         * con la misma función que exporta la hoja que estás viendo. */
        function Imprenta({ trabajo, chordLibrary, onLista }) {
            const raiz = useRef(null);
            useEffect(() => {
                // Un respiro para que el navegador haya medido (la hoja de
                // canción mide el texto al pintarse). Temporizador y no
                // requestAnimationFrame: con la pestaña en segundo plano los
                // fotogramas se paran y el PDF no llegaría nunca.
                const t = setTimeout(() => onLista(raiz.current), 120);
                return () => clearTimeout(t);
            }, [trabajo]);
            const acordes = trabajo.items.filter(i => i.tipo === "acorde").map(i => i.datos);
            // En un portal, colgando de <body>: así, al imprimir, basta con
            // esconder todo lo demás que cuelga de <body>.
            return ReactDOM.createPortal((
                <div class="k3-imprenta" ref={raiz} aria-hidden="true">
                    {trabajo.items.filter(i => i.tipo !== "acorde").map(i => (
                        <div key={claveItem(i)} class="k3-imprenta__doc">
                            {i.tipo === "cancion" && <SongSheet song={i.datos} chordLibrary={chordLibrary} />}
                            {i.tipo === "ejercicio" && <ExerciseSheet exercise={i.datos} />}
                            {i.tipo === "tablatura" && <TabSheet tab={i.datos} />}
                        </div>
                    ))}
                    {acordes.length > 0 && (
                        <div class="k3-imprenta__doc">
                            <HojaDeAcordes acordes={acordes} titulo={acordes.length === 1 ? acordes[0].name : "Acordes"} />
                        </div>
                    )}
                </div>
            ), document.body);
        }
    </script>

    <script type="text/plain" id="app-source-studio">
        function App() {
            const [appMode, setAppMode] = useState("chord"); // 'chord', 'scale', 'arpeggio'
            const [chordName, setChordName] = useState("C");
            const [autoUpdateTitle, setAutoUpdateTitle] = useState(true);

            // El instrumento es explícito. El ukelele y el bajo de 4 cuerdas son
            // instrumentos distintos: no se pueden deducir del número de cuerdas.
            const [instrument, setInstrument] = useState(DEFAULT_INSTRUMENT);
            const numStrings = getInstrument(instrument).strings;

            const [numFrets, setNumFrets] = useState(5);
            const [startingFret, setStartingFret] = useState(1);

            const [dots, setDots] = useState(PRESETS[0].dots);
            const [stringStates, setStringStates] = useState(PRESETS[0].stringStates);

            /* --- LIBRE TIENE SU PROPIO MÁSTIL ------------------------------
             *
             * Acordes y Libre se editan igual, pero NO comparten las notas. Con
             * un solo juego, entrar en Libre a probar algo y volver dejaba el
             * acorde con cuatro notas en una cuerda: destruido sin haberlo
             * tocado. Son dos trabajos distintos y cada uno guarda el suyo.
             *
             * La afinación, el instrumento y la ventana de trastes SÍ se
             * comparten: eso es el instrumento, no el dibujo. */
            const [dotsLibre, setDotsLibre] = useState([]);
            const [stringStatesLibre, setStringStatesLibre] = useState(PRESETS[0].stringStates.map(() => "none"));
            const [barres, setBarres] = useState([]);
            const [tuning, setTuning] = useState(PRESETS[0].tuning);
            const [selectedTuningName, setSelectedTuningName] = useState("Estándar (E A D G B e)");

            // Octavas fijadas por un preset que no se pueden deducir por cercanía
            // a la afinación de fábrica (el ukelele de sol grave). null = deducir.
            const [tuningMidi, setTuningMidi] = useState(null);

            // Punto ÚNICO por el que pasa toda nota al aire. Antes había dos
            // sistemas de afinación en paralelo —el análisis leía las letras y el
            // audio unas tablas fijas—, y por eso Drop D se veía pero no se oía.
            const stringBaseMIDI = (stringIndex) => (
                tuningMidi
                    ? tuningMidi[stringIndex]
                    : window.KharoTheory.getStringBaseMIDI(tuning, stringIndex, instrument)
            );

            // States for Scale Mode
            const [scaleRoot, setScaleRoot] = useState(0); 
            const [scaleType, setScaleType] = useState("major"); 
            const [customScaleIntervals, setCustomScaleIntervals] = useState([true, false, true, false, true, true, false, true, false, true, false, true]); 

            // States for Arpeggio Mode
            const [arpeggioRoot, setArpeggioRoot] = useState(0);
            const [arpeggioType, setArpeggioType] = useState("maj7");
            
            const [scaleDisplayMode, setScaleDisplayMode] = useState("note"); 
            const [chordDisplayMode, setChordDisplayMode] = useState("diagram"); // 'diagram', 'note', 'degree'
            const [fretNumPosition, setFretNumPosition] = useState("left");

            const [toast, setToast] = useState({ show: false, message: "", accion: null });

            // Panel contextual flotante activo (toolbar). null = ninguno abierto.
            // Valores: 'theory' | 'instrument' | 'style' | 'intervals' | 'export'
            const [openPanel, setOpenPanel] = useState(null);
            // 0.2: el inspector sustituye a los paneles flotantes. Desde 1280 px
            // es una columna y recuerda si la dejaste abierta; por debajo es un
            // cajón o una hoja que empieza cerrada.
            const [pestanaInspector, setPestanaInspector] = useState("tocar");
            const [inspectorAbierto, setInspectorAbierto] = useState(() => {
                if (window.innerWidth < 1280) return false;
                try {
                    const v = localStorage.getItem("kharo.v02.inspector");
                    if (v === "0") return false;
                } catch (e) {}
                return true;
            });
            const [dialogoEstudio, setDialogoEstudio] = useState(null);   // "exportar" | "atajos" | null
            // El temporizador de la pulsación larga, compartido (ver crearPulsacionLarga).
            const pulsoLargoRef = useRef({ t: null, x: 0, y: 0 });
            const [nombreArchivoExport, setNombreArchivoExport] = useState("");
            // 0.2: el borrado en masa pide confirmación con un diálogo propio
            // (cifra exacta, qué se pierde, qué se conserva) en vez de confirm().
            const [borradoPendiente, setBorradoPendiente] = useState(null);

            // En móvil la barra de estado sólo muestra lo imprescindible; el
            // resto (tempo, modo de vista, vaciar) se despliega con el ⋯.
            const [showMoreBar, setShowMoreBar] = useState(false);

            /* --- APARTADO CANCIÓN --------------------------------------
             *
             * `appView` es QUÉ apartado se está usando; `appMode` sigue siendo
             * QUÉ se dibuja en el mástil (acorde / escala / arpegio). Son cosas
             * distintas: al volver de Canción, el mástil aparece en el modo en
             * el que se dejó.
             *
             * Lo guardado se lee UNA vez, con el inicializador perezoso de
             * useState. Pasar `Song.loadSongs()` a pelo leería localStorage en
             * cada render.
             * ---------------------------------------------------------- */
            /* Arranca en la portada, no en Acordes: sin ella, quien abre la app
             * por primera vez ve un mástil vacío y no sabe que hay cinco cosas
             * más dentro. Se vuelve con el logo. */
            /* Acordes y Libre se editan igual: se ponen notas a mano en el
             * mástil. Lo único que los separa es el tope de una nota por
             * cuerda, que en Libre no existe. Todas las guardas que decían
             * `appMode !== "chord"` preguntan ahora por esto. */
            const modoEditable = appMode === "chord" || appMode === "free";

            /* El mástil sobre el que se está escribiendo ahora mismo. Los
             * manejadores de clic son los mismos en los dos modos: lo único que
             * cambia es en cuál de los dos juegos de notas escriben. */
            const dotsActivos = appMode === "free" ? dotsLibre : dots;
            const setDotsActivos = appMode === "free" ? setDotsLibre : setDots;
            const stringStatesActivos = appMode === "free" ? stringStatesLibre : stringStates;
            const setStringStatesActivos = appMode === "free" ? setStringStatesLibre : setStringStates;

            const [appView, setAppView] = useState("welcome"); // 'welcome' | 'studio' | 'song' | 'exercise' | 'about' (prueba)

            const [chordLibrary, setChordLibrary] = useState(() => Song.loadChordLibrary());

            /* --- VARIAS CANCIONES, VARIOS EJERCICIOS ------------------------
             *
             * `loadSongs`/`saveSongs` siempre fueron plurales y aceptaron una
             * lista. La interfaz nunca la usó: escribía `[song]` y leía `[0]`,
             * así que sólo existía UNA canción y «Nueva» reemplazaba la
             * anterior con un aviso. Lo mismo con los ejercicios.
             *
             * Ahora la lista es el estado y la canción abierta es un índice
             * dentro de ella. La activa se guarda por separado y se funde con
             * la lista al escribir, para no serializar todo el cancionero en
             * cada tecla de la letra. */
            const [songs, setSongs] = useState(() => {
                const guardadas = Song.loadSongs();
                return guardadas.length ? guardadas.map(Song.normalizeSong) : [Song.createSong()];
            });
            /* La abierta sale DE LA LISTA, no de otra llamada a `createSong`.
             * Con dos llamadas independientes, arrancar sin nada guardado creaba
             * dos canciones con `id` distinto —la de la lista y la abierta— y el
             * gestor decía «Canciones (2)» recién abierta la app. */
            const [song, setSong] = useState(() => songs[0]);

            const [activeSectionId, setActiveSectionId] = useState(null);

            /* La sección abierta en el editor. La necesita el preview del
             * rasgueo para sonar al tempo al que sonará de verdad. */
            const seccionActivaDeLaCancion = () =>
                song.sections.find(s => s.id === activeSectionId) || song.sections[0] || null;

            const [exercises, setExercises] = useState(() => {
                const guardados = Song.loadExercises();
                return guardados.length ? guardados.map(normalizarEjercicio) : [Song.createExercise()];
            });

            const [exercise, setExercise] = useState(() => exercises[0]);
            const [isPlayingExercise, setIsPlayingExercise] = useState(false);
            const [pasoSonando, setPasoSonando] = useState(null);
            const [isPlayingSong, setIsPlayingSong] = useState(false);
            const [isLooping, setIsLooping] = useState(false);
            const [playhead, setPlayhead] = useState(null); // {sectionId, repeat, barIndex}

            /* --- 0.3: TABLATURAS -------------------------------------------
             * Mismo esquema que canciones y ejercicios: la lista y la abierta,
             * que se funde en la lista al guardar. */
            const [tabs, setTabs] = useState(() => {
                const guardadas = KharoTab.loadTabs();
                return Array.isArray(guardadas) && guardadas.length ? guardadas.map(KharoTab.normalizeTab) : [KharoTab.createTab()];
            });
            const [tab, setTab] = useState(() => tabs[0]);
            const [isPlayingTab, setIsPlayingTab] = useState(false);
            const [eventoSonando, setEventoSonando] = useState(null);

            /* --- 0.3: LA BIBLIOTECA ----------------------------------------
             * Lo que la Biblioteca sabe de cada pieza y que no es de la pieza:
             * fijada, etiquetas, cuándo cambió y cuándo se abrió. */
            const [metaBib, setMetaBib] = useState(() => leerMetaBiblioteca());
            const [imprenta, setImprenta] = useState(null); // { items, modo }

            /* --- 0.3: EL SONIDO --------------------------------------------
             * Qué timbre suena (se recuerda en este navegador) y para qué
             * instrumento: en Tablaturas, el de la tablatura; en lo demás, el
             * del mástil. Con «Según el instrumento», el bajo suena a bajo. */
            const [timbre, setTimbre] = useState(() => synthInstance.timbre || "auto");
            useEffect(() => {
                synthInstance.timbre = timbre;
                try { localStorage.setItem(CLAVE_TIMBRE, timbre); } catch (e) {}
            }, [timbre]);

            const [detectedChord, setDetectedChord] = useState("C");
            const [detectedRootSemi, setDetectedRootSemi] = useState(0);

            // --- ESTADO DE ARRASTRE DE CEJILLA ---
            const [dragStart, setDragStart] = useState(null); // { s: stringIndex, f: fretNum }
            const [dragCurrent, setDragCurrent] = useState(null); // { s: stringIndex, f: fretNum }

            // --- AUDIO INTERACTIVO Y ANIMACIÓN ---
            const [isPlayingSequence, setIsPlayingSequence] = useState(false);
            /* Tempo en NEGRAS. Antes esto guardaba milisegundos entre notas,
             * así que subir el control retrasaba la música: al revés de lo que
             * dice cualquier metrónomo. Las secuencias suenan en corcheas. */
            const [tempoBpm, setTempoBpm] = useState(100);

            // Segundos por corchea, que es el paso de las secuencias.
            const segundosPorCorchea = 30 / tempoBpm;

            /* --- LA SEPARACIÓN ENTRE CUERDAS DE UN RASGUEO -------------------
             *
             * Era `Math.min(0.045, segundosPorCorchea / 6)`. Como
             * `segundosPorCorchea / 6` es `5 / bpm`, ese valor sólo baja de
             * 0,045 cuando el tempo pasa de 111 bpm. Traducido: en modo Acorde,
             * mover el control de 30 a 111 devolvía SIEMPRE el mismo número y
             * sonaba exactamente igual. Un tercio largo del recorrido no hacía
             * nada, mientras la etiqueta seguía diciendo «Tempo».
             *
             * El techo estaba puesto por una razón buena —a 60 bpm sin él un
             * acorde tarda casi un segundo en sonar entero, y a 30 casi dos—,
             * pero un techo plano no es la forma de ponerlo: hay que apretar el
             * recorrido dentro de un margen audible, no aplastarle la mitad.
             *
             * Los límites son sólo una red, no la regla: el techo empieza a
             * morder a partir de 45 bpm hacia abajo, donde ya nadie rasguea, en
             * vez de a partir de 111, que era medio recorrido. Con ellos: 110 ms
             * por cuerda a 45 bpm (dos tercios de segundo el acorde entero en
             * seis cuerdas), 50 a 100 bpm, 21 a 240. */
            const LIMITE_RASGUEO = { min: 0.015, max: 0.11 };
            const separacionRasgueo = Math.max(
                LIMITE_RASGUEO.min,
                Math.min(LIMITE_RASGUEO.max, segundosPorCorchea / 6)
            );
            const [notePulse, setNotePulse] = useState(null); // { s: stringIndex, f: fretNum } para destello

            // --- ESTADO DE LEYENDA DE INTERVALOS ---
            const [showLegend, setShowLegend] = useState(true);

            /* --- RECORRIDO DE NOTAS ---
             * `pathManual` en null significa «lo calcula la app». No es lo
             * mismo que guardar el automático: así, al cambiar de escala o de
             * posición, el recorrido se recalcula solo mientras no lo hayas
             * tocado, y deja de hacerlo en cuanto lo tocas. */
            /* --- AGRUPACIÓN DE ARPEGIOS ---
             * "mapa" es el arpegio repartido por todo el mástil: sirve para ver
             * dónde está, no para tocarlo. Las otras dos lo convierten en formas
             * concretas. */
            const [arpGrouping, setArpGrouping] = useState("mapa");
            const [arpStringSet, setArpStringSet] = useState(0);
            const [arpInversion, setArpInversion] = useState(0);
            const [arpSweep, setArpSweep] = useState(false);
            const [arpTapping, setArpTapping] = useState("none");


            const [showPath, setShowPath] = useState(false);
            const [pathCriterio, setPathCriterio] = useState("digitacion");
            const [pathManual, setPathManual] = useState(null);
            const [editandoPath, setEditandoPath] = useState(false);

            /* El modo «a mano» está encendido cuando el lienzo se COMPORTA
             * distinto, que es cuando hay flechas Y se están retocando.
             * `showPath` a solas sólo dibuja: no cambia lo que hace un toque,
             * así que no es un modo. */
            const modoAMano = appMode !== "chord" && showPath && editandoPath;
            /* Tres notas por cuerda por defecto: es como se estudia una escala.
             * Sin tope, en un mástil de 20 trastes el recorrido baja veinte
             * notas por la misma cuerda antes de cambiarse. */
            const [pathNotasPorCuerda, setPathNotasPorCuerda] = useState(3);
            const [pathRetorno, setPathRetorno] = useState(false);

            /* Las tríadas de la tonalidad, dibujadas sobre la escala. `null`
             * en `gradoTriada` = ninguna señalada, y entonces se ven las siete
             * a la vez: el punto es ver cómo se solapan. */
            const [scaleTriads, setScaleTriads] = useState(false);
            /* Dos estados y no uno: `gradoTriada` es lo que se está viendo
             * AHORA —cambia con el ratón por encima— y `gradoFijado` es lo que
             * has dejado puesto con un clic. Al apartar el ratón se vuelve a lo
             * fijado, no a nada. */
            const [gradoTriada, setGradoTriada] = useState(null);
            const [gradoFijado, setGradoFijado] = useState(null);
            const [menuTriada, setMenuTriada] = useState(null);   // { grado, x, y } en píxeles de pantalla

            /* Modo libre: el mástil entero pasa a ser pulsable y el recorrido lo
             * escribes tú, nota a nota, sin tener que elegir entre lo que
             * propone un preset. */
            /* En Libre el mástil arranca vacío y sin fórmula. `guiaEscala`
             * dibuja una escala por debajo como referencia, apagada por defecto:
             * el sentido de esta sección es el papel en blanco, y quien quiera
             * la guía la enciende. */
            const [guiaEscala, setGuiaEscala] = useState(false);

            /* El menú de clic derecho de una nota del mástil. Mismo trato que
             * `menuFlecha` y `menuTriada`: coordenadas de pantalla, porque es
             * donde ocurrió el clic. */
