                                                        <p class="k2-ayuda">En Libre cada nota lleva siempre su nombre: no hay tónica respecto a la que contar grados.</p>
                                                    )}
                                                    {(appMode === "scale" || appMode === "arpeggio") && (
                                                        <div class="k2-bloque">
                                                            <Interruptor etiqueta="Leyenda de grados" valor={showLegend} onCambio={setShowLegend} ayuda="Qué color tiene cada grado, al lado del mástil." />
                                                        </div>
                                                    )}
                                                </Seccion>

                                                {appMode !== "chord" && (
                                                    <Seccion id="vista-recorrido" titulo="Recorrido">
                                                        <Interruptor etiqueta="Flechas del recorrido" valor={showPath} onCambio={setShowPath} ayuda="En qué orden se tocan las notas. Manda en las flechas y en lo que suena." />
                                                        {showPath && (
                                                            <React.Fragment>
                                                                <div class="k2-bloque">
                                                                    <Segmentado
                                                                        etiqueta="Orden"
                                                                        ancho
                                                                        valor={editandoPath || pathManual ? "amano" : pathCriterio}
                                                                        onCambio={(v) => {
                                                                            if (v === "amano") { setEditandoPath(true); return; }
                                                                            setEditandoPath(false);
                                                                            setPathCriterio(v);
                                                                            setPathManual(null);
                                                                        }}
                                                                        opciones={[
                                                                            { id: "digitacion", label: "Digitación", ayuda: "Cuerda por cuerda, de la más grave a la más aguda" },
                                                                            { id: "altura", label: "Altura", ayuda: "De la nota más grave a la más aguda" },
                                                                            { id: "amano", label: "A mano", ayuda: "Tocas las notas en el orden que quieras" }
                                                                        ]}
                                                                    />
                                                                    {editandoPath && (
                                                                        <p class="k2-ayuda k2-ayuda--aviso">
                                                                            {appMode === "free"
                                                                                ? "Toca una nota y se añade al final, aunque ya estuviera: así se escriben notas pedal y vueltas atrás. Arrastra de una a otra para que vayan seguidas. Esc para terminar."
                                                                                : "Toca las notas en el orden que quieras; tocar una que ya está la saca. Arrastra de una a otra para que vayan seguidas. Esc para terminar."}
                                                                        </p>
                                                                    )}
                                                                </div>
                                                                {!pathManual && (
                                                                    <div class="k2-bloque">
                                                                        <Segmentado
                                                                            etiqueta="Notas por cuerda"
                                                                            ancho
                                                                            valor={pathNotasPorCuerda}
                                                                            onCambio={(v) => { setPathNotasPorCuerda(v); setPathManual(null); }}
                                                                            opciones={[
                                                                                { id: 1, label: "1" }, { id: 2, label: "2" }, { id: 3, label: "3" },
                                                                                { id: 0, label: "Todas", ayuda: "Sin tope: todas las notas que haya en la cuerda" }
                                                                            ]}
                                                                        />
                                                                    </div>
                                                                )}
                                                                <div class="k2-bloque">
                                                                    <Interruptor etiqueta="Ida y vuelta" valor={pathRetorno} onCambio={(v) => { setPathRetorno(v); setPathManual(null); }} ayuda="Sube y vuelve a bajar por el mismo camino, que es como se estudia." />
                                                                    <Interruptor etiqueta="Barrido (sweep)" valor={arpSweep} onCambio={setArpSweep} ayuda="Cruzar de cuerda es parte del mismo movimiento de púa: las flechas se dibujan enteras." />
                                                                </div>
                                                                <div class="k2-fila-estado">
                                                                    <span>{pathManual ? `${pathManual.length} notas, a mano` : `${recorridoActual().length} notas, automático`}</span>
                                                                    {pathManual && (
                                                                        <button type="button" onClick={reiniciarConDeshacer} class="k-btn k-btn--outline k-btn--touch k-text-sm px-3 py-2">
                                                                            Volver al automático
                                                                        </button>
                                                                    )}
                                                                </div>
                                                            </React.Fragment>
                                                        )}
                                                    </Seccion>
                                                )}

                                                <Seccion id="vista-numeros" titulo="Números de traste">
                                                    <Segmentado
                                                        etiqueta="A qué lado del mástil"
                                                        ancho
                                                        valor={fretNumPosition}
                                                        onCambio={setFretNumPosition}
                                                        opciones={[{ id: "left", label: "Izquierda" }, { id: "right", label: "Derecha" }]}
                                                    />
                                                </Seccion>
                                            </React.Fragment>
                                        )}

                                        {/* ============ INSTRUMENTO ============ */}
                                        {pestanaInspector === "instrumento" && (
                                            <React.Fragment>
                                                <div class="k2-bloque">
                                                    <Campo etiqueta="Instrumento" ayuda="Si cambia el número de cuerdas, el mástil se vacía (con Deshacer).">
                                                        {(id, ayuda) => (
                                                            <select id={id} aria-describedby={ayuda} value={instrument} onChange={(e) => setInstrument(e.target.value)}>
                                                                {INSTRUMENT_ORDER.map(iid => (
                                                                    <option key={iid} value={iid}>{`${INSTRUMENTS[iid].name.replace(/\s*\(\d+c\)\s*$/, "")} de ${INSTRUMENTS[iid].strings} cuerdas`}</option>
                                                                ))}
                                                            </select>
                                                        )}
                                                    </Campo>
                                                </div>
                                                <SelectorTimbre valor={timbre} onCambio={setTimbre} />
                                                <Seccion id="afinacion" titulo="Afinación">
                                                    <Campo etiqueta="Afinación de fábrica">
                                                        {(id) => (
                                                            <select
                                                                id={id}
                                                                value={selectedTuningName}
                                                                onChange={(e) => {
                                                                    const pName = e.target.value;
                                                                    const found = TUNING_PRESETS[instrument] && TUNING_PRESETS[instrument].find(p => p.name === pName);
                                                                    if (found) handleTuningPresetChange(found.notes, found.name, found.midi ?? null);
                                                                    else setSelectedTuningName("Personalizada");
                                                                }}
                                                            >
                                                                {(TUNING_PRESETS[instrument] || []).map(pr => <option key={pr.name} value={pr.name}>{pr.name}</option>)}
                                                                <option value="Personalizada">Afinación propia</option>
                                                            </select>
                                                        )}
                                                    </Campo>
                                                    <div class="k2-bloque">
                                                        <span class="k2-etiqueta">Cuerda por cuerda, de la más grave a la más aguda</span>
                                                        <div class="k2-cuerdas">
                                                            {tuning.slice(0, numStrings).map((nota, idx) => (
                                                                <Campo key={idx} etiqueta={`${numStrings - idx}.ª`}>
                                                                    {(id) => (
                                                                        <input
                                                                            id={id}
                                                                            type="text"
                                                                            maxLength={3}
                                                                            value={nota}
                                                                            aria-label={`Cuerda ${numStrings - idx}${idx === 0 ? ", la más grave" : idx === numStrings - 1 ? ", la más aguda" : ""}`}
                                                                            onChange={(e) => changeTuningNote(idx, e.target.value)}
                                                                            class="k2-cuerda-input"
                                                                        />
                                                                    )}
                                                                </Campo>
                                                            ))}
                                                        </div>
                                                        <p class="k2-ayuda">Escribe la nota de cualquier cuerda (C, F#, Bb…) para afinarla a tu manera.</p>
                                                    </div>
                                                </Seccion>
                                            </React.Fragment>
                                        )}

                                        {/* ============ ESTILO ============ */}
                                        {pestanaInspector === "estilo" && (
                                            <React.Fragment>
                                                <p class="k2-intro">El estilo es parte del diagrama: sale así en lo que exportes.</p>
                                                <Seccion id="est-diapason" titulo="Diapasón">
                                                    <Segmentado
                                                        etiqueta="Cómo se dibuja"
                                                        ancho
                                                        valor={style.fretboardSkin}
                                                        onCambio={(v) => patchStyle({ fretboardSkin: v })}
                                                        opciones={[{ id: "plano", label: "Plano" }, { id: "madera", label: "Madera" }]}
                                                    />
                                                    <p class="k2-ayuda">Madera: palisandro, trastes de metal y cuerdas entorchadas.</p>
                                                </Seccion>
                                                <Seccion id="est-colores" titulo="Colores">
                                                    <div class="k2-dos-columnas">
                                                        <CampoColor etiqueta="Fondo" valor={bgStyleColor} onCambio={setBgStyleColor} />
                                                        <CampoColor etiqueta="Cuerdas y trastes" valor={gridStyleColor} onCambio={setGridStyleColor} />
                                                        <CampoColor etiqueta="Título y texto" valor={textStyleColor} onCambio={setTextStyleColor} />
                                                        <CampoColor etiqueta="Flechas del recorrido" valor={style.pathColor} onCambio={setPathColor} />
                                                    </div>
                                                </Seccion>
                                                <Seccion id="est-grados" titulo="Colores por grado" abiertaPorDefecto={false}>
                                                    <div class="k2-dos-columnas">
                                                        <CampoColor etiqueta="Dedos (sin grado)" valor={baseFingerStyleColor} onCambio={setBaseFingerStyleColor} />
                                                        {[
                                                            ["1", "Tónica (1)"], ["2", "Segundas (b2, 2)"], ["3", "Terceras (b3, 3)"],
                                                            ["4", "Cuartas (4, #4)"], ["5", "Quintas (b5, 5, #5)"], ["6", "Sextas (b6, 6)"], ["7", "Séptimas (b7, 7)"]
                                                        ].map(([g, nombre]) => (
                                                            <CampoColor key={g} etiqueta={nombre} valor={intervalColors[g]} onCambio={(v) => setIntervalColors({ ...intervalColors, [g]: v })} />
                                                        ))}
                                                        <CampoColor etiqueta="Texto dentro de las notas" valor={style.dotTextColor} onCambio={setDotTextColor} />
                                                    </div>
                                                </Seccion>
                                                <Seccion id="est-letra" titulo="Letra y tamaños" abiertaPorDefecto={false}>
                                                    <Campo etiqueta="Tipografía">
                                                        {(id) => (
                                                            <select id={id} value={fontFamilyStyle} onChange={(e) => setFontFamilyStyle(e.target.value)}>
                                                                {FONTS_LIST.map(font => <option key={font.id} value={font.id}>{font.name}</option>)}
                                                            </select>
                                                        )}
                                                    </Campo>
                                                    <Campo etiqueta={`Tamaño de las notas · ${dotRadiusStyle} px`}>
                                                        {(id) => <input id={id} type="range" min="8" max="13" value={dotRadiusStyle} onChange={(e) => setDotRadiusStyle(parseInt(e.target.value))} class="k2-rango" />}
                                                    </Campo>
                                                    <Campo etiqueta={`Grosor de las cuerdas · ${lineWidthStyle} px`}>
                                                        {(id) => <input id={id} type="range" min="1" max="4" step="0.5" value={lineWidthStyle} onChange={(e) => setLineWidthStyle(parseFloat(e.target.value))} class="k2-rango" />}
                                                    </Campo>
                                                </Seccion>
                                                <Seccion id="est-tuyos" titulo={`Tus estilos · ${stylePresets.length}`}>
                                                    {stylePresets.length === 0 ? (
                                                        <p class="k2-ayuda">Todavía no has guardado ninguno. Ajusta el diagrama a tu gusto y ponle nombre aquí abajo.</p>
                                                    ) : (
                                                        <ul class="k2-lista">
                                                            {stylePresets.map(p => (
                                                                <li key={p.id} class="k2-lista__fila">
                                                                    <button type="button" onClick={() => aplicarPreset(p.id)} class="k2-lista__principal">
                                                                        <span class="k2-lista__nombre">{p.name}</span>
                                                                        <span class="k2-lista__detalle">Aplicar</span>
                                                                    </button>
                                                                    <BotonBorrar onClick={() => borrarEstiloConDeshacer(p.id)} title={`Borrar el estilo «${p.name}»`} className="k2-icono-borrar" />
                                                                </li>
                                                            ))}
                                                        </ul>
                                                    )}
                                                    <div class="k2-bloque k2-guardar-estilo">
                                                        <Campo etiqueta="Guardar el estilo de ahora como…" ayuda="Si el nombre ya existe, lo actualiza.">
                                                            {(id, ayuda) => (
                                                                <input id={id} type="text" aria-describedby={ayuda} value={nombrePreset} onChange={(e) => setNombrePreset(e.target.value)} placeholder="Ej.: Para imprimir" />
                                                            )}
                                                        </Campo>
                                                        <button type="button" onClick={() => { guardarPreset(nombrePreset); setNombrePreset(""); }} class="k-btn k-btn--primary k-btn--touch k-text-sm px-4 py-2.5">
                                                            Guardar estilo
                                                        </button>
                                                    </div>
                                                </Seccion>
                                                <div class="k2-pie-inspector">
                                                    <button type="button" onClick={restablecerEstiloConDeshacer} class="k-btn k-btn--outline k-btn--touch k-text-sm px-4 py-2.5 w-full">
                                                        Restablecer el estilo de fábrica
                                                    </button>
                                                </div>
                                            </React.Fragment>
                                        )}
                                    </div>
                                </aside>
                            )}
                        </div>

                        {/* --- EL DOCK (sólo teléfono) --- las mismas cuatro pestañas,
                            con su nombre debajo del icono. */}
                        <nav class="k2-dock" aria-label="Ajustes del diagrama">
                            {PESTANAS_INSPECTOR.map(p => (
                                <button
                                    key={p.id}
                                    type="button"
                                    onClick={() => abrirPestana(p.id)}
                                    aria-pressed={inspectorAbierto && pestanaInspector === p.id}
                                    class={`k2-dock__boton ${inspectorAbierto && pestanaInspector === p.id ? "k2-dock__boton--activo" : ""}`}
                                >
                                    <Icono nombre={p.icono} tam={20} />
                                    <span>{p.label}</span>
                                </button>
                            ))}
                        </nav>

                        {/* --- EXPORTAR --- */}
                        {dialogoEstudio === "exportar" && (
                            <Dialogo
                                titulo="Exportar el diagrama"
                                descripcion={`${width} × ${height} px · ${numStrings} cuerdas · ${numFrets} trastes. Sale tal cual lo ves.`}
                                onCerrar={() => setDialogoEstudio(null)}
                            >
                                <Campo etiqueta="Nombre del archivo" ayuda="Se le añade «_kharo» y la extensión del formato.">
                                    {(id, ayuda) => (
                                        <input id={id} type="text" aria-describedby={ayuda} value={nombreArchivoExport} onChange={(e) => setNombreArchivoExport(e.target.value)} placeholder={chordName || "diagrama"} />
                                    )}
                                </Campo>
                                <div class="k2-formatos">
                                    {[
                                        { id: "png", titulo: "PNG", detalle: "Imagen en alta resolución (×3). Para redes, documentos y presentaciones.", hacer: exportPNG },
                                        { id: "svg", titulo: "SVG", detalle: "Vectorial y ligero: se ve nítido a cualquier tamaño. Para la web.", hacer: exportSVG },
                                        { id: "ai", titulo: "SVG para Illustrator", detalle: "Con la cabecera que espera Illustrator, para seguir editándolo.", hacer: exportSVGForIllustrator }
                                    ].map(f => (
                                        <button key={f.id} type="button" class="k2-formato" onClick={() => { f.hacer(); setDialogoEstudio(null); }}>
                                            <span class="k2-formato__titulo">{f.titulo}</span>
                                            <span class="k2-formato__detalle">{f.detalle}</span>
                                        </button>
                                    ))}
                                </div>
                            </Dialogo>
                        )}

                        {/* --- ATAJOS --- */}
                        {dialogoEstudio === "atajos" && (
                            <Dialogo titulo="Atajos de teclado" onCerrar={() => setDialogoEstudio(null)} ancho="480px">
                                <dl class="k2-atajos">
                                    {[
                                        ["1 · 2 · 3 · 4", "Acordes, Escalas, Arpegios, Libre"],
                                        ["P", "Escuchar"],
                                        ["[ y ]", "Mover la ventana del mástil"],
                                        ["E", "Exportar"],
                                        ["Ctrl + Z", "Deshacer"],
                                        ["Ctrl + Shift + Z", "Rehacer"],
                                        ["Esc", "Cerrar un menú o salir de «A mano»"],
                                        ["?", "Ver esta lista"]
                                    ].map(([tecla, que]) => (
                                        <div key={tecla} class="k2-atajos__fila"><dt><kbd>{tecla}</kbd></dt><dd>{que}</dd></div>
                                    ))}
                                </dl>
                                <p class="k2-ayuda">Los atajos no funcionan mientras escribes en un campo.</p>
                            </Dialogo>
                        )}
                    </div>
                    )}

                    </div>
                    {cargandoTaller && <CargaTaller texto={cargandoTaller === "portada" ? "Volviendo a la portada…" : null} />}
                    </div>

                    {/* --- LOS MENÚS DE CLIC DERECHO ---
                        Van FUERA del SVG: son piel, no obra, así que usan el
                        sistema de diseño y no viajan en el archivo exportado.

                        Los tres montan el MISMO componente. Antes eran dos
                        copias literales de cuarenta líneas cada una, y añadir un
                        tercer menú habría sido una tercera copia. */}

                    {menuFlecha && (
                        <MenuContextualAccesible
                            x={menuFlecha.x}
                            y={menuFlecha.y}
                            titulo={`Flecha ${menuFlecha.numero || menuFlecha.i + 1}`}
                            onCerrar={() => setMenuFlecha(null)}
                            opciones={[
                                { label: "Eliminar esta flecha", hacer: () => quitarDestinoDeFlecha(menuFlecha.i), ayuda: "Saca del recorrido la nota a la que apunta" },
                                { label: "Cortar el recorrido aquí", hacer: () => cortarRecorridoEn(menuFlecha.i), ayuda: "El recorrido termina en esta flecha" },
                                { label: "Invertir este salto", hacer: () => invertirSaltoEn(menuFlecha.i), ayuda: "Cambia el orden de las dos notas que une" },
                                { label: "Invertir el recorrido", hacer: () => invertirRecorrido(), ayuda: "Le da la vuelta entera" },
                                { label: "Reiniciar el recorrido", hacer: () => reiniciarRecorrido(), ayuda: "Vuelve al automático" }
                            ]}
                        />
                    )}

                    {/* --- MENÚ DE UNA NOTA DEL MÁSTIL ---
                        Lo que se puede hacer con una nota concreta sin salir del
                        mástil. En Libre es además la única forma de quitar una:
                        el clic izquierdo añade al recorrido y no puede hacer las
                        dos cosas. */}
                    {menuNota && (
                        <MenuContextualAccesible
                            x={menuNota.x}
                            y={menuNota.y}
                            titulo={menuNota.nombre}
                            onCerrar={() => setMenuNota(null)}
                            opciones={[
                                {
                                    label: "Escucharla",
                                    hacer: () => playSingleNoteAudio(menuNota.s, menuNota.f),
                                    ayuda: "Suena sin tocar el recorrido"
                                },
                                {
                                    label: menuNota.enRecorrido ? "Sacar del recorrido" : "Añadir al recorrido",
                                    hacer: () => menuNota.enRecorrido
                                        ? alternarEnRecorrido(menuNota.s, menuNota.f)
                                        : anadirAlRecorrido(menuNota.s, menuNota.f),
                                    ayuda: menuNota.enRecorrido
                                        ? "Deja de tocarse, pero la nota sigue dibujada"
                                        : "Se añade al final del orden"
                                },
                                {
                                    label: "Quitar la nota",
                                    hacer: () => quitarNotaLibre(menuNota.s, menuNota.f),
                                    ayuda: "Se va del dibujo y del recorrido",
                                    desactivada: appMode !== "free",
                                    estilo: { color: 'var(--k-danger)' }
                                },
                                {
                                    label: "Reiniciar el recorrido",
                                    hacer: () => reiniciarRecorrido(),
                                    ayuda: "Vuelve al orden automático"
                                }
                            ]}
                        />
                    )}

                    {/* --- MENÚ DE UNA TRÍADA (clic derecho sobre su ficha) ---
                        Fijar una tríada y hacer algo con ella son cosas
                        distintas, así que son gestos distintos: el clic la deja
                        puesta y esto decide qué hacer con ella.

                        Mandar a Ejercicios tiene DOS lecturas y aquí están las
                        dos: el grado entero —el mapa, para recorrer el mástil— y
                        cada agrupación por separado —la forma que cabe en la
                        mano, para tocarla—. Mandando siempre el grado entero
                        salía el dibujo de la escala, que no es lo que se ve
                        cuando miras una envolvente. */}
                    {menuTriada !== null && (() => {
                        const g = triadasVisibles.find(x => x.grado === menuTriada.grado);
                        if (!g) return null;

                        const zonas = zonasDeUnGrado(g.posiciones);

                        const opciones = [
                            {
                                label: "Abrir en Arpegios",
                                ayuda: "Verla en el mástil como arpegio, en el mismo sitio",
                                hacer: () => abrirTriadaComoArpegio(g)
                            }
                        ];

                        /* Dos formas de mandarla, no más (Carlos, 2026-10-04): la
                         * tríada entera de la ventana, o una ficha por posición.
                         * Mandar una sola agrupación suelta y «Quitar la
                         * selección» (eso ya lo hace «Todas») se quitaron. */
                        opciones.push({
                            label: `Toda la tríada (${g.posiciones.length} notas)`,
                            ayuda: "Todas sus notas en la ventana, con la escala alrededor",
                            hacer: () => mandarTriadaAEjercicio(g, g.posiciones, "")
                        });

                        if (zonas.length > 1) opciones.push({
                            label: `Cada posición, un paso (${zonas.length})`,
                            ayuda: "Una ficha por cada forma que cabe en la mano",
                            hacer: () => mandarCadaAgrupacion(g)
                        });

                        return (
                            <MenuContextualAccesible
                                x={menuTriada.x}
                                y={menuTriada.y}
                                titulo={`${g.romano} · ${g.triada}`}
                                onCerrar={() => setMenuTriada(null)}
                                opciones={opciones}
                            />
                        );
                    })()}

                    {guardando && (
                        <PanelGuardarAcorde
                            ancla={botonGuardarRef.current}
                            chord={guardando.chord}
                            repetido={guardando.repetido}
                            canciones={fundirEnLista(songs, song)}
                            idAbierta={song.id}
                            onGuardar={confirmarGuardarAcorde}
                            onCerrar={() => setGuardando(null)}
                        />
                    )}
                    {mandar && (
                        <DialogoMandar
                            titulo={mandar.tipo === "paso" ? "Mandar el recorrido" : (mandar.existente ? `Mandar «${mandar.chord.name}»` : "Guardar el acorde")}
                            descripcion={mandar.tipo === "paso"
                                ? "La digitación con su recorrido, como un paso que se practica a tu tempo."
                                : (mandar.existente
                                    ? "Se añade un compás con este acorde al final de la sección que elijas."
                                    : "Se guarda en tu biblioteca y, si quieres, se añade ya a una canción.")}
                            etiquetaNombre={mandar.existente ? null : (mandar.tipo === "paso" ? "Nombre del paso" : "Nombre del acorde")}
                            nombre={mandar.nombre}
                            onNombre={(v) => setMandar(prev => ({ ...prev, nombre: v }))}
                            grupos={gruposDeDestino()}
                            valor={mandar.destino}
                            onValor={(v) => setMandar(prev => ({ ...prev, destino: v }))}
                            ir={mandar.ir}
                            onIr={mandar.tipo === "acorde" && mandar.destino === "biblio" ? null : (v) => setMandar(prev => ({ ...prev, ir: v }))}
                            textoIr={mandar.tipo === "paso" ? "Ir al ejercicio después" : "Ir a la canción después"}
                            textoAccion={mandar.tipo === "paso" ? "Mandar" : (mandar.destino === "biblio" ? "Guardar" : "Guardar y añadir")}
                            onAceptar={confirmarMandar}
                            onCerrar={() => setMandar(null)}
                        />
                    )}

                    {imprenta && <Imprenta key={imprenta.id} trabajo={imprenta} chordLibrary={chordLibrary} onLista={imprentaLista} />}

                    {/* 0.3: lo que está sonando, abajo a la izquierda. */}
                    <Reproduciendo
                        sonando={[
                            previewSonando && { id: "ritmo", texto: `Rasgueo «${previewNombre || "sin nombre"}» en bucle` },
                            isPlayingSong && (() => {
                                const sec = playhead && song.sections.find(x => x.id === playhead.sectionId);
                                return { id: "cancion", texto: `Canción «${song.title || "sin título"}»${sec ? " · " + sec.name : ""}` };
                            })(),
                            isPlayingExercise && { id: "ejercicio", texto: `Ejercicio «${exercise.title || "sin título"}»` },
                            isPlayingTab && { id: "tab", texto: `Tablatura «${tab.title || "sin título"}»` }
                        ].filter(Boolean)}
                        pausado={audioPausado}
                        onPausa={alternarPausa}
                        onParar={pararTodo}
                    />

                    {borradoPendiente && (
                        <DialogoBorrar
                            titulo={borradoPendiente.titulo}
                            pierde={borradoPendiente.pierde}
                            conserva={borradoPendiente.conserva}
                            textoBorrar={borradoPendiente.textoBorrar}
                            onBorrar={borradoPendiente.hacer}
                            onCerrar={() => setBorradoPendiente(null)}
                        />
                    )}

                    {/* --- NOTIFICATION TOAST BAR --- */}
                    {toast.show && (
                        <div
                            style={{backgroundColor:'var(--k-surface-raised)', border:'1px solid var(--k-border)', boxShadow:'var(--k-shadow-inset), var(--k-shadow-float)'}}
                            role="status"
                            aria-live="polite"
                            class={"k2-aviso fixed bottom-5 right-5 z-50 k-ink px-5 py-3 rounded-xl shadow-2xl flex items-center gap-2.5" + (toast.accion ? "" : " k2-aviso--rebote")}
                        >
                            <span class="w-2 h-2 rounded-full shrink-0" style={{backgroundColor:'var(--k-highlight)'}}></span>
                            <span class="k-text-sm font-semibold">{toast.message}</span>
                            {toast.accion && (
                                <button
                                    onClick={pulsarAccionDelToast}
                                    class="k-btn k-btn--outline k-text-sm px-3 py-1.5 ml-1 shrink-0"
                                >
                                    {toast.accion.texto}
                                </button>
                            )}
                        </div>
                    )}

                    {/* --- PIE ---
                        Sólo en la portada. En el estudio eran 33 px de alto que
                        se le quitaban al mástil para decir algo que no cambia. */}
                    {esSitio && (
                    <footer class="hidden md:block py-2 px-4 text-center k-ink-faint k-text-xs shrink-0 z-10" style={{backgroundColor:'var(--k-bg-deep)', borderTop:'1px solid var(--k-divider)'}}>
                        <p>© 2026 Kharo Studio. Diseñado para creadores de contenido de música y educadores.</p>
                        <CreditoSonidos corto />
                    </footer>
                    )}
                </div>
                </StyleContext.Provider>
            );
        }

        // Render the application
        const rootElement = document.getElementById("root");
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
    <script>
        // Junta los tres bloques de código y los compila de una vez.
        //
        // Se compila a mano forzando el runtime "classic" de React porque el
        // "automatic", que Babel usa por defecto, inserta un import de ES
        // Modules que un <script> normal no puede ejecutar: pantalla en blanco.
        // Si tocas esto y la app deja de aparecer, el motivo es ese.
        //
        // El orden importa: el núcleo define lo que usan los otros dos, y el
        // estudio termina montando la aplicación. Al concatenarse comparten un
        // único ámbito, así que no hay imports entre bloques.
        var bloques = ['app-source-core', 'app-source-song', 'app-source-tab', 'app-source-biblioteca', 'app-source-studio'];
        var appSource = bloques
            .map(function (id) {
                var el = document.getElementById(id);
                return el ? el.textContent : '';
            })
            .join('\n');

        var compiled = Babel.transform(appSource, {
            presets: [["react", { runtime: "classic" }]]
        }).code;
        (new Function(compiled))();
    </script>
</body>
</html>
