        const StyleContext = React.createContext(null);

        // --- SINTETIZADOR DE CUERDA PULSADA CON WEB AUDIO API ---
        class InstrumentSynth {
            constructor() {
                this.ctx = null;
                // El ruido de la percusión. Se genera UNA vez y se reutiliza:
                // rellenar dos segundos de muestras aleatorias en cada golpe
                // costaría más que el propio sonido, y a dieciséis golpes por
                // compás eso se oye como tirones.
                this.ruido = null;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
                if (!this.ruido) {
                    const muestras = Math.floor(this.ctx.sampleRate * 0.5);
                    const buffer = this.ctx.createBuffer(1, muestras, this.ctx.sampleRate);
                    const datos = buffer.getChannelData(0);
                    for (let i = 0; i < muestras; i++) datos[i] = Math.random() * 2 - 1;
                    this.ruido = buffer;
                }
            }

            /* --- PERCUSIÓN --------------------------------------------------
             *
             * Un golpe de mano sobre las cuerdas apagadas: ruido filtrado, no
             * una nota. No tiene altura y por eso no lleva MIDI — es lo que
             * permite escribir un rasgueo oyendo SÓLO el ritmo, sin que el
             * acorde tape lo que se está contando.
             *
             * Tres timbres, que son los tres gestos que la rejilla distingue:
             *
             *   golpe  ↓  la mano baja entera: más cuerpo y más cola
             *   alto   ↑  sólo roza las agudas: más fino y más corto
             *   seco   ×  apagado: un chasquido, sin cola
             *
             * Va a `destination` directamente, igual que `playNote`: este
             * sintetizador no tiene bus maestro y meterle uno aquí sería
             * cambiar el volumen de toda la app de refilón.
             * -------------------------------------------------------------- */
            playPercussion(timbre = "golpe", delay = 0, strength = 1) {
                this.init();
                const now = this.ctx.currentTime + Math.max(0, delay);

                const AJUSTES = {
                    golpe: { freq: 380,  q: 0.9, dur: 0.16, vol: 0.42, hp: 120 },
                    alto:  { freq: 1900, q: 1.4, dur: 0.09, vol: 0.30, hp: 700 },
                    seco:  { freq: 900,  q: 2.2, dur: 0.055, vol: 0.34, hp: 300 }
                };
                const a = AJUSTES[timbre] || AJUSTES.golpe;

                const fuente = this.ctx.createBufferSource();
                fuente.buffer = this.ruido;

                const paso = this.ctx.createBiquadFilter();
                paso.type = 'bandpass';
                paso.frequency.setValueAtTime(a.freq, now);
                paso.Q.setValueAtTime(a.q, now);

                // El paso-alto quita el retumbe: sin él, el ruido blanco a
                // volumen de golpe suena a soplo y no a mano.
                const corte = this.ctx.createBiquadFilter();
                corte.type = 'highpass';
                corte.frequency.setValueAtTime(a.hp, now);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(a.vol * Math.max(0.05, strength), now + 0.002);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + a.dur);

                fuente.connect(paso);
                paso.connect(corte);
                corte.connect(gain);
                gain.connect(this.ctx.destination);

                fuente.start(now);
                fuente.stop(now + a.dur + 0.02);
            }
            // `strength` (0..1) es la fuerza del golpe: multiplica las tres capas
            // por igual, así que cambia el volumen sin cambiar el timbre. Es lo que
            // permite que un patrón rítmico tenga acentos en vez de sonar plano.
            playNote(midiNote, duration = 1.0, delay = 0, strength = 1) {
                this.init();
                const now = this.ctx.currentTime + delay;
                const freq = 440 * Math.pow(2, (midiNote - 69) / 12);

                if (freq <= 0 || freq > 20000) return;

                const oscWood = this.ctx.createOscillator();
                oscWood.type = 'triangle';
                oscWood.frequency.setValueAtTime(freq, now);

                const oscCore = this.ctx.createOscillator();
                oscCore.type = 'sine';
                oscCore.frequency.setValueAtTime(freq, now);

                const oscClick = this.ctx.createOscillator();
                oscClick.type = 'sawtooth';
                oscClick.frequency.setValueAtTime(freq * 2, now);

                const gainWood = this.ctx.createGain();
                const gainCore = this.ctx.createGain();
                const gainClick = this.ctx.createGain();

                const lowpass = this.ctx.createBiquadFilter();
                lowpass.type = 'lowpass';
                lowpass.frequency.setValueAtTime(freq * 4, now);
                lowpass.frequency.exponentialRampToValueAtTime(freq * 1.2, now + 0.4);

                gainWood.gain.setValueAtTime(0, now);
                gainWood.gain.linearRampToValueAtTime(0.24 * strength, now + 0.01);
                gainWood.gain.exponentialRampToValueAtTime(0.001, now + duration);

                gainCore.gain.setValueAtTime(0, now);
                gainCore.gain.linearRampToValueAtTime(0.18 * strength, now + 0.015);
                gainCore.gain.exponentialRampToValueAtTime(0.001, now + duration * 0.85);

                gainClick.gain.setValueAtTime(0, now);
                gainClick.gain.linearRampToValueAtTime(0.06 * strength, now + 0.002);
                gainClick.gain.exponentialRampToValueAtTime(0.001, now + 0.07);

                oscWood.connect(gainWood);
                oscCore.connect(gainCore);
                oscClick.connect(gainClick);

                gainWood.connect(lowpass);
                gainCore.connect(lowpass);
                gainClick.connect(lowpass);

                lowpass.connect(this.ctx.destination);

                oscWood.start(now);
                oscCore.start(now);
                oscClick.start(now);

                oscWood.stop(now + duration + 0.1);
                oscCore.stop(now + duration + 0.1);
                oscClick.stop(now + duration + 0.1);
            }
        }

        /* --- SELECTOR DE APARTADO -----------------------------------------
         * Va guiado por datos para que añadir un apartado sea una entrada más
         * en el array, no otra rama de JSX copiada.
         *
         * En móvil ocupa una fila entera con las pestañas a partes iguales;
         * en escritorio mide lo que mide su texto y vive dentro del header.
         * ----------------------------------------------------------------- */
        /* Dos grupos, no cinco pestañas seguidas. Tres de ellas dibujan un
         * mástil y dos montan un documento: son tareas distintas y ponerlas en
         * fila las hacía parecer alternativas del mismo tipo.
         *
         * El grupo se declara AQUÍ, en los datos, y no en el header: `ModeTabs`
         * se monta dos veces —una para escritorio y otra para móvil— y
         * agruparlas fuera obligaría a escribir la separación dos veces. */
        const MODE_TABS = [
            { id: "chord", label: "Acordes", grupo: "diagrama" },
            { id: "scale", label: "Escalas", grupo: "diagrama" },
            { id: "arpeggio", label: "Arpegios", grupo: "diagrama" },
            // Libre no sale de ninguna fórmula: el mástil está vacío y se
            // escribe a mano, con varias notas por cuerda. Era un interruptor
            // escondido a tres niveles dentro del panel de Escalas.
            { id: "free", label: "Libre", grupo: "diagrama" },
            // Canción no dibuja un mástil: monta la canción entera con los
            // acordes que ya has guardado. Por eso es otra vista, no un modo
            // más de dibujo.
            { id: "song", label: "Canción", grupo: "documento" },
            // Ejercicios tampoco dibuja un mástil suelto: monta una ficha de
            // técnica. Se llega también con el atajo de Escalas y Arpegios.
            { id: "exercise", label: "Ejercicios", grupo: "documento" }
        ];

        const GRUPOS_TABS = ["diagrama", "documento"];

        function ModeTabs({ items, active, onSelect, stretch }) {
            /* Dos `.k-tabs` seguidos se leen ya como dos grupos: la clase trae
             * su propio fondo y su propio borde, así que la separación no
             * necesita CSS nuevo.
             *
             * En `stretch` (móvil, fila completa) el reparto se hace aquí: la
             * clase asume UN nav a ancho completo, y con dos hay que darle a
             * cada uno su parte.
             *
             * Se reparte por LARGO DEL TEXTO, no por número de pestañas. Con el
             * número, «Canción · Ejercicios» —dos palabras largas— recibía un
             * tercio del ancho y las dos salían cortadas, mientras «Libre» iba
             * sobrada de sitio en el otro grupo. */
            const grupos = GRUPOS_TABS
                .map(g => ({ g, lista: items.filter(it => (it.grupo || "diagrama") === g) }))
                .filter(x => x.lista.length > 0);

            return (
                <div class={`k-tabs-row flex items-center gap-2 ${stretch ? "k-tabs-row--stretch w-full" : ""}`}>
                    {grupos.map(({ g, lista }) => (
                        <nav
                            key={g}
                            class={`k-tabs ${stretch ? "k-tabs--stretch" : ""}`}
                            style={stretch ? { "--k-tabs-peso": lista.reduce((n, it) => n + it.label.length, 0) } : undefined}
                            role="tablist"
                        >
                            {lista.map(item => (
                                <button
                                    key={item.id}
                                    role="tab"
                                    aria-selected={active === item.id}
                                    onClick={() => onSelect(item.id)}
                                    /* Y dentro de cada grupo, lo mismo: a partes
                                     * iguales, «Libre» sobraba de sitio mientras
                                     * «Arpegios» salía cortada al lado. */
                                    style={stretch ? { flex: `${item.label.length} 1 0` } : undefined}
                                    class={`k-tab ${active === item.id ? "k-tab--active" : ""}`}
                                >
                                    {item.label}
                                </button>
                            ))}
                        </nav>
                    ))}
                </div>
            );
        }

        /* --- LA PORTADA -------------------------------------------------------
         *
         * La app abría directamente en Acordes. Quien llegaba por primera vez
         * veía un mástil vacío y cinco palabras en una fila, sin nada que
         * dijera qué hace cada una ni que Canción y Ejercicios existen para
         * otra cosa distinta.
         *
         * Las fichas van agrupadas igual que las pestañas —lo que dibuja un
         * mástil por un lado, lo que monta un documento por otro— porque el
         * agrupamiento ES la explicación: son dos maneras de usar la app, no
         * seis funciones sueltas.
         *
         * Se pinta en cada carga. No se guarda «ya la vio»: volver aquí es

            return (

                                    <div class="flex-1 h-px" style={{ backgroundColor: 'var(--k-border)' }}></div>
                                </div>
                                <p class="text-[11px] mb-3" style={{ color: 'var(--k-text-faint)' }}>{grupo.pie}</p>

                                <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
                                    {SECCIONES_LANDING.filter(s => {
                                        const t = MODE_TABS.find(m => m.id === s.id);
                                        return t && t.grupo === grupo.id;
                                    }).map(s => (
                                        <button
                                            key={s.id}
                                            onClick={() => onEntrar(s.id)}
                                            class="k-panel p-4 text-left transition-transform hover:-translate-y-0.5"
                                            style={{ cursor: 'pointer', display: 'block', width: '100%' }}
                                        >
                                            <div class="text-xl mb-2" aria-hidden="true">{s.icono}</div>
                                            <div class="text-base font-bold mb-1" style={{ color: 'var(--k-highlight)' }}>
                                                {s.titulo}
                                            </div>
                                            <div class="text-xs mb-2" style={{ color: 'var(--k-text)' }}>
                                                {s.resumen}
                                            </div>
                                            <div class="text-[11px] leading-relaxed" style={{ color: 'var(--k-text-muted)' }}>
                                                {s.detalle}
                                            </div>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        ))}

                        <p class="text-[11px]" style={{ color: 'var(--k-text-faint)' }}>
                            Se guarda todo en este navegador. Para llevártelo a otro sitio, exporta a JSON
                            desde Canción o Ejercicios. Para volver aquí, el logo de arriba.
                        </p>
                    </div>
                </div>
            );
        }

        /* --- EL MENÚ DE CLIC DERECHO -----------------------------------------
         *
         * Estaba escrito DOS VECES, palabra por palabra: una para el menú de
         * una flecha del recorrido y otra para el de una tríada. Las dos
         * copias sólo se diferenciaban en la lista de opciones y en cómo
         * adivinaban su propio alto para no salirse de la pantalla —una con un
         * 190 a pelo, la otra con una fórmula—, que es justo lo que un
         * componente puede medir de verdad en vez de estimar.
         *
         * Se mide después de pintar, con la caja real, y sólo se recoloca si
         * hace falta: así el menú nunca queda medio fuera por abajo aunque
         * lleve siete opciones o el navegador use otro tamaño de letra.
         *
         * `orientacion: "horizontal"` pone las opciones en fila. Es para
         * elegir ENTRE ESTADOS —los seis de una casilla de rasgueo—, donde una
         * lista vertical obliga a leer seis renglones para algo que se
         * reconoce de un vistazo por su flecha.
         *
         * REGLA: toda acción que viva aquí tiene que existir también con un
         * clic normal en algún sitio. En un teléfono no hay botón derecho, y un
         * menú contextual es lo único que no se puede descubrir tocando.
         * ------------------------------------------------------------------ */
        function MenuContextual({ x, y, titulo, opciones, orientacion, onCerrar }) {
            const cajaRef = React.useRef(null);
            const [pos, setPos] = React.useState({ left: x, top: y });

            const horizontal = orientacion === "horizontal";

            React.useLayoutEffect(() => {
                const nodo = cajaRef.current;
                if (!nodo) return;
                const caja = nodo.getBoundingClientRect();
                const margen = 8;
                const left = Math.max(margen, Math.min(x, window.innerWidth - caja.width - margen));
                const top = Math.max(margen, Math.min(y, window.innerHeight - caja.height - margen));
                setPos(prev => (prev.left === left && prev.top === top) ? prev : { left, top });
            }, [x, y, opciones.length, horizontal]);

            return (
                <React.Fragment>
                    <div
                        class="fixed inset-0 z-40"
                        onClick={onCerrar}
                        onContextMenu={(e) => { e.preventDefault(); onCerrar(); }}
                    />
                    <div
                        ref={cajaRef}
                        class="fixed z-50 k-panel p-1 shadow-2xl"
                        style={{
                            left: pos.left + 'px',
                            top: pos.top + 'px',
                            /* Sin ancho declarado, un `fixed` se ajusta al
                               contenido y la opción más larga lo estira media
                               pantalla. En horizontal es al revés: se deja
                               crecer, porque lo que se alinea es una fila. */
                            width: horizontal ? 'auto' : '212px',
                            whiteSpace: horizontal ? 'nowrap' : 'normal'
                        }}
                    >
                        {titulo && <div class="k-label px-2 pt-1 pb-1.5">{titulo}</div>}
                        <div class={horizontal ? "flex items-center gap-1" : ""}>
                            {opciones.map((op, i) => (
                                <button
                                    key={op.key || op.label || i}
                                    onClick={() => { op.hacer(); if (!op.mantener) onCerrar(); }}
                                    title={op.ayuda || op.label}
                                    disabled={op.desactivada}
                                    /* `.k-btn` centra su contenido, que está bien
                                       en una barra y mal en una lista de opciones. */
                                    class={"k-btn k-btn--ghost text-[11px] "
                                        + (horizontal ? "px-2 py-1.5 shrink-0" : "w-full px-2 py-1.5")}
                                    style={horizontal
                                        ? (op.estilo || {})
                                        : Object.assign({ justifyContent: 'flex-start', textAlign: 'left' }, op.estilo || {})}
                                >
                                    {op.label}
                                </button>
                            ))}
                        </div>
                    </div>
                </React.Fragment>
            );
        }

        /* --- BORRAR Y CERRAR NO SON LO MISMO ---------------------------------
         *
         * Toda la app usaba una × para las dos cosas, y encima con
         * `k-btn--ghost` en los dos casos: quitar un acorde de la biblioteca
         * —que lo saca también de todos los compases donde estuviera— se veía
         * exactamente igual que cerrar un panel.
         *
         * Ahora borrar es una papelera, que es lo que todo el mundo reconoce, y
         * la × queda sólo para cerrar. Están como componentes y no como clases
         * porque estaban copiados a mano en nueve sitios y cada retoque había
         * que hacerlo nueve veces.
         *
         * Las × que NO son botones se quedan como están: la de una cuerda
         * muteada en el mástil es notación musical, la de una casilla apagada
         * del rasgueo también, y el «×3» de las repeticiones es el signo «por».
         * ------------------------------------------------------------------ */
        function IconoPapelera({ className }) {
            return (
                <svg xmlns="http://www.w3.org/2000/svg" class={className || "h-3.5 w-3.5"}
                     viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                    <path d="M3 6h18" />
                    <path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2" />
                    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
                    <path d="M10 11v6" />
                    <path d="M14 11v6" />
                </svg>
            );
        }

        function BotonBorrar({ onClick, onContextMenu, title, label, className, size }) {
            return (
                <button
                    onClick={onClick}
                    onContextMenu={onContextMenu}
                    title={title}
                    aria-label={title}
                    class={"k-btn k-btn--danger " + (label ? "text-[10px] px-2 py-1.5 gap-1 " : "px-1.5 py-1 ") + (className || "")}
                >
                    <IconoPapelera className={size || "h-3.5 w-3.5"} />
                    {label && <span>{label}</span>}
                </button>
            );
        }

        function BotonCerrar({ onClick, title, className, style }) {
            return (
                <button
                    onClick={onClick}
                    title={title || "Cerrar"}
                    aria-label={title || "Cerrar"}
                    class={"k-btn k-btn--ghost k-btn--icon " + (className || "")}
                    style={style}
                >
                    ×
                </button>
            );
        }

        /* --- LA MANCHA QUE ENVUELVE UN GRUPO DE NOTAS ------------------------
         *
         * Vive aquí arriba, fuera de todo componente, porque la usan dos: el
         * mástil del estudio para las tríadas de la tonalidad (§15 bis) y la
         * ficha de ejercicio para dibujar una agrupación como se veía.
         *
         * Casco convexo por cadena monótona de Andrew: los puntos de dentro no
         * hacen falta, la mancha la definen los de fuera.
         * ------------------------------------------------------------------ */
        function cascoConvexo(puntos) {
            if (puntos.length <= 2) return puntos.slice();

            const p = puntos.slice().sort((a, b) => (a.x - b.x) || (a.y - b.y));
            const cruz = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);

            const abajo = [];
            p.forEach(q => {
                while (abajo.length >= 2 && cruz(abajo[abajo.length - 2], abajo[abajo.length - 1], q) <= 0) abajo.pop();
                abajo.push(q);
            });

            const arriba = [];
            p.slice().reverse().forEach(q => {
                while (arriba.length >= 2 && cruz(arriba[arriba.length - 2], arriba[arriba.length - 1], q) <= 0) arriba.pop();
                arriba.push(q);
            });

            abajo.pop();
            arriba.pop();
            return abajo.concat(arriba);
        }

        /* El `d` de la mancha. Se dibuja como un trazo REDONDEADO de grosor
         * `2 × margen` sobre el casco, más relleno: eso da la goma elástica
         * alrededor de los puntos sin desplazar aristas ni calcular normales, y
         * el mismo código sirve para dos notas (cápsula) y para cinco. */
        function trazoDeMancha(puntos) {
            const casco = cascoConvexo(puntos);
            if (casco.length === 0) return null;
            return {
                d: casco.map((p, i) => `${i === 0 ? "M" : "L"} ${p.x} ${p.y}`).join(" ") + (casco.length > 2 ? " Z" : ""),
                cerrado: casco.length > 2
            };
        }

        /* Reparte las posiciones de un grado en zonas del tamaño de una mano.
         *
         * Con sólo pedir que las notas se toquen entre sí, la cadena no
         * para: en Do mayor las notas de La menor van saltando de cuerda en
         * cuerda y de traste en traste hasta cubrir el mástil entero, y
         * salía UNA mancha que envolvía todo el dibujo. Eso no dice dónde se
         * toca nada.
         *
         * Por eso hay un tope duro además de la cercanía: una zona no puede
         * pasar de TRES CUERDAS ni de CUATRO TRASTES. Es lo que abarca la
         * mano sin desplazarse, y es lo que convierte la mancha en «aquí se
         * toca este acorde».
         *
         * Se crece desde la nota más grave y más baja, para que el reparto
         * sea el mismo en cada render: una zona que cambia de sitio entre
         * dos dibujos no sirve para estudiar (§15).
         */
        const CUERDAS_POR_ZONA = 3;
        const TRASTES_POR_ZONA = 4;

        function zonasDeUnGrado(posiciones) {
            /* Las cuerdas al aire quedan fuera de la envolvente. Se dibujan
             * encima de la cejuela, en su propia fila, así que meterlas
             * estiraba la mancha hasta allí y deformaba la forma. Y tiene
             * sentido musical: la envolvente marca dónde va la mano, y una
             * cuerda al aire no lleva dedo. */
            const pendientes = posiciones
                .filter(p => p.f > 0)
                .sort((a, b) => (a.s - b.s) || (a.f - b.f));
            const zonas = [];

            while (pendientes.length > 0) {
                const zona = [pendientes.shift()];
                let crecio = true;

                while (crecio) {
                    crecio = false;
                    for (let i = 0; i < pendientes.length; i++) {
                        const c = pendientes[i];

                        // Tiene que TOCAR la zona: cuerda contigua o la misma.
                        const pega = zona.some(z => Math.abs(z.s - c.s) <= 1 && Math.abs(z.f - c.f) <= 2);
                        if (!pega) continue;

                        // Y la zona resultante tiene que seguir cabiendo en la mano.
                        const cuerdas = zona.map(z => z.s).concat(c.s);
                        const trastes = zona.map(z => z.f).concat(c.f);
                        const cabe = (Math.max(...cuerdas) - Math.min(...cuerdas)) < CUERDAS_POR_ZONA
                            && (Math.max(...trastes) - Math.min(...trastes)) < TRASTES_POR_ZONA;
                        if (!cabe) continue;

                        zona.push(c);
                        pendientes.splice(i, 1);
                        crecio = true;
                        break;
                    }
                }
                zonas.push(zona);
            }

            /* Una nota suelta no se envuelve. Envolver una sola nota es
             * volver al aro por nota, que es justo lo que esto sustituye:
             * la nota se sigue viendo, pero sin mancha alrededor. */
            return zonas.filter(z => z.length >= 2);
        }

        /* --- LOS DOS CONTROLES JUNTO AL MÁSTIL ----------------------------
         * Las dos medidas que más se retocan al dibujar: dónde empieza la
         * ventana del mástil y cuántos trastes muestra.
         *
         * EL PROBLEMA QUE RESUELVE `modo`: los dos controles decían casi lo
         * mismo («Traste» / «Trastes») y los dos usaban +/−, cuando uno indica
         * una DIRECCIÓN y el otro una CANTIDAD.
         *
         * LA REGLA, y vale para los dos: EL BOTÓN DE ARRIBA RESTA. El mástil
         * se dibuja con la cejuela arriba y crece hacia abajo, así que en los
         * dos controles el de arriba encoge el dibujo por arriba y el de abajo
         * lo estira por abajo. Antes el de cantidad tenía el + arriba y al
         * pulsarlo el mástil crecía hacia abajo: el botón y el movimiento
         * apuntaban a lados contrarios.
         *
         *   modo "direccion"  ▲ / ▼   Mueve la ventana. El ▲ va hacia la
         *                             CEJUELA, que está dibujada arriba.
         *   modo "cantidad"   − / +   Cambia cuántos trastes se ven. El − va
         *                             arriba porque los quita por abajo.
         *
         * Los botones son de 44px: el mínimo para usarlos con el dedo. En
         * escritorio va en columna flanqueando el mástil y en móvil en fila
         * debajo, donde `flex-row-reverse` deja el sentido «menos a la
         * izquierda» sin duplicar el JSX.
         *
         * `onStep` recibe el INCREMENTO (+1/-1), no el valor final, para que
         * quien lo use aplique la actualización funcional de React. Si el
         * botón calculase `value + 1` desde su closure, varias pulsaciones
         * rápidas dentro del mismo ciclo partirían todas del mismo valor y se
         * perderían clics.
         * ----------------------------------------------------------------- */
        function FretStepper({ label, value, min, max, onStep, titleUp, titleDown, className, modo }) {
            const claseBoton = "k-btn k-btn--icon k-btn--primary text-lg";
            const esDireccion = modo === "direccion";

            // Arriba SIEMPRE resta, en los dos modos. Lo único que cambia es
            // el glifo: una flecha cuando mueve la ventana, un signo cuando
            // cuenta trastes.
            const pasoArriba = -1;
            const pasoAbajo = +1;

            const limiteArriba = value <= min;
            const limiteAbajo = value >= max;

            return (
                <div class={`flex flex-row-reverse md:flex-col items-center gap-1.5 shrink-0 ${className || ""}`}>
                    <button
                        onClick={() => onStep(pasoArriba)}
                        disabled={limiteArriba}
                        title={titleUp}
                        aria-label={titleUp}
                        class={claseBoton}
                    >
                        {esDireccion ? "▲" : "−"}
                    </button>
                    <div class="flex flex-col items-center leading-none py-0.5 px-1">
                        <span class="k-value text-base">{value}</span>
                        <span class="k-label text-[8px] mt-0.5">{label}</span>
                    </div>
                    <button
                        onClick={() => onStep(pasoAbajo)}
                        disabled={limiteAbajo}
                        title={titleDown}
                        aria-label={titleDown}
                        class={claseBoton}
                    >
                        {esDireccion ? "▼" : "+"}
                    </button>
                </div>
            );
        }

    </script>

    <!-- ===================================================================
         BLOQUE 2 de 3: EL APARTADO CANCIÓN
         ===================================================================
         Progresiones, letra con acordes y hoja imprimible. Va en su propio
         bloque porque, todo junto en uno, el archivo pasaba de las 3.500
         líneas y encontrar algo dejaba de ser posible.

         Los tres bloques se CONCATENAN antes de compilarlos, así que
         comparten un único ámbito: lo de aquí ve lo del bloque anterior sin
         importar ni exportar nada. Se parte en <script> separados y no en
         archivos porque un `fetch` a un .jsx local fallaría por CORS al abrir
         index.html con doble clic, y la app tiene que seguir arrancando así.
         =================================================================== -->
    <script type="text/plain" id="app-source-song">
        /* ==================================================================
         * MINI DIAGRAMA
         * ==================================================================
         * El acorde en miniatura, para las tarjetas de la biblioteca y para el
         * diccionario de la hoja.
         *
         * Tiene geometría propia y NO usa `computeDiagramGeometry` a propósito:
         * aquella reserva 130 px arriba para el título, las letras de las
         * cuerdas y los símbolos de al aire, que en una tarjeta de dos
         * centímetros serían casi todo el dibujo. Una miniatura no es un plano
         * a escala, es un icono que se reconoce de un vistazo.
         * ================================================================== */
        const MINI = {
            width: 92,
            height: 112,
            padTop: 26,
            padBottom: 14,
            padX: 12,
            radio: 5
        };

        /* AQUÍ VIVÍA `MINI_COLORES_APP`, que pintaba las tarjetas de la
         * biblioteca con tokens del tema porque se las consideraba PIEL, y la
         * hoja con tinta fija porque ahí eran OBRA.
         *
         * Ya no: un diagrama es obra esté donde esté. La tarjeta de la
         * biblioteca deja de seguir al tema claro/oscuro y pasa a ser lo que
         * siempre debió ser —una vista previa de lo que vas a exportar—, así
         * que se ve igual en la app que en el PNG. */

        /* El nombre de la nota que suena en una posición de la foto. Es la
         * misma cuenta que hace el mástil grande: clase de altura de la cuerda
         * al aire más el traste absoluto. */
        function notaEnPosicion(chord, s, f) {
            const base = parseNoteToSemi(chord.tuning[s]);
            const abs = f === 0 ? toAbsoluteFret(chord.startingFret, 0) : chord.startingFret + f - 1;
            return NOTE_NAMES[(base + abs + 120) % 12];
        }

        /* Qué se escribe dentro de un punto del mini diagrama.
         *
         * `base` es respecto a qué se cuenta el grado: la fundamental del
         * propio acorde, o la tónica de la tonalidad de la canción. Son dos
         * preguntas distintas —«qué es esta nota dentro del acorde» y «por qué
         * este acorde está en esta canción»— y las dos se hacen. */
        function etiquetaDePunto(chord, s, f, modo, base) {
            if (modo === "notas") return notaEnPosicion(chord, s, f);
            if (modo !== "grados" || base === null || base === undefined) return "";

            const abs = f === 0 ? toAbsoluteFret(chord.startingFret, 0) : chord.startingFret + f - 1;
            const pitch = (parseNoteToSemi(chord.tuning[s]) + abs + 120) % 12;
            return INTERVAL_DEGREES[(pitch - base + 12) % 12];
        }

        /* Respecto a qué se cuenta el grado de un acorde. `null` significa «no
         * se puede decir», y entonces el diagrama no escribe grados en vez de
         * inventárselos.
         *
         * La fundamental se saca reconociendo la digitación, que son sesenta
         * comparaciones de fórmula por acorde. Se guarda por `id` porque un
         * acorde de la biblioteca es inmutable salvo el nombre: sin la caché,
         * escribir la letra recalcularía la biblioteca entera en cada tecla. */
        const cacheDeFundamentales = new Map();

        function baseDeGradosDe(chord, song) {
            if (!song || song.chordLabels !== "grados") return null;

            if (song.degreeBasis === "tonalidad") {
                return Number.isInteger(song.keyRoot) ? song.keyRoot : null;
            }

            if (cacheDeFundamentales.has(chord.id)) return cacheDeFundamentales.get(chord.id);
            const info = window.KharoTheory.identifyChordFromVoicing(chord);
            const base = info ? info.rootSemi : null;
            cacheDeFundamentales.set(chord.id, base);
            return base;
        }

        function MiniFretboard({ chord, ancho, alto, etiquetas, baseDeGrados }) {
            /* El estilo del diagrama, del Context. Ya no llega por props: los
             * consumidores están repartidos por los tres bloques y bajarlo a
             * mano serían seis props cruzando componentes que no pintan nada
             * con ellas. */
            const est = useDiagramStyle();
            const tinta = { texto: est.textColor, linea: est.gridColor, punto: est.baseFingerColor };
            // Factores de escala. Con los valores de fábrica valen 1, así que
            // el dibujo por defecto queda EXACTAMENTE como estaba.
            const k = est.dotRadius / 10;
            const lw = Math.min(est.lineWidth / 1.5, 2.5);
            /* Tres modos, no dos. «dedos» ahora dibuja de verdad el dedo:
             * los puntos llevan `finger` desde siempre y este componente no lo
             * leía nunca, así que la pestaña se llamaba «Dedos» y pintaba un
             * punto liso. */
            const modo = etiquetas === "notas" || etiquetas === "grados" ? etiquetas : "dedos";
            const conTexto = modo !== "dedos";
            const instrumento = getInstrument(chord.instrument);
            const numStrings = instrumento.strings;
            const numFrets = Math.min(Math.max(chord.numFrets || 4, 4), 6);

            const anchoRejilla = MINI.width - MINI.padX * 2;
            const altoRejilla = MINI.height - MINI.padTop - MINI.padBottom;
            const pasoCuerda = anchoRejilla / Math.max(1, numStrings - 1);
            const pasoTraste = altoRejilla / numFrets;

            const xCuerda = (s) => MINI.padX + s * pasoCuerda;
            const yTraste = (f) => MINI.padTop + f * pasoTraste;
            // El punto va en el centro del espacio entre traste y traste.
            const yNota = (f) => MINI.padTop + (f - 0.5) * pasoTraste;

            const enPrimerTraste = (chord.startingFret || 1) === 1;
            /* El radio sigue al del estilo, pero con tope: en 92 px de ancho,
             * un punto grande sobre seis cuerdas se come a sus vecinos. El tope
             * es inerte con guitarra (6,53 ≈ el 6,5 de siempre) y deja crecer
             * en ukelele, que tiene sitio de sobra. */
            const radio = Math.min((conTexto ? MINI.radio + 1.5 : MINI.radio) * k, pasoCuerda * 0.48);

            // Qué cuerdas cubre cada cejilla, para poder etiquetarlas una a una.
            const cuerdasDeCejilla = (barre) => {
                const lista = [];
                for (let s = barre.fromString; s <= barre.toString; s++) lista.push(s);
                return lista;
            };

            const texto = (x, y, contenido, key) => (
                <text
                    key={key}
                    x={x}
                    y={y + 2.4}
                    textAnchor="middle"
                    fontFamily={est.fontFamily}
                    fontSize={6.5 * k}
                    fontWeight="700"
                    fill={est.dotTextColor}
                >
                    {contenido}
                </text>
            );

            return (
                <svg
                    viewBox={`0 0 ${MINI.width} ${MINI.height}`}
                    width={ancho || MINI.width}
                    height={alto || undefined}
                    style={alto ? { display: "block" } : { height: "auto", display: "block" }}
                    role="img"
                    aria-label={`Diagrama del acorde ${chord.name}`}
                >
                    {/* El fondo. Antes no había ninguno y se veía el papel de
                        debajo: con un estilo de fondo oscuro, la miniatura
                        quedaba invisible sobre la hoja A4 blanca. Con él, cada
                        mini es una baldosa que se basta a sí misma. */}
                    <rect
                        width={MINI.width}
                        height={MINI.height}
                        rx="6"
                        fill={est.backgroundColor}
                    />

                    <text
                        x={MINI.width / 2}
                        y={13}
                        textAnchor="middle"
                        fontFamily={est.fontFamily}
                        fontSize="13"
                        fontWeight="800"
                        fill={tinta.texto}
                    >
                        {chord.name}
                    </text>

                    {/* Cuerdas al aire y muteadas, encima de la cejuela.
                        LA CEJUELA ES EL TRASTE 0 Y TAMBIÉN SUENA. Aquí sólo se
                        imprimía «○», sin mirar nunca el modo, así que al pedir
                        notas las cuerdas al aire se quedaban mudas: justo las
                        que más se preguntan. La cuenta correcta ya estaba
                        escrita en `notaEnPosicion` (la rama `f === 0`) y no la
                        llamaba nadie. */}
                    {(chord.stringStates || []).map((estado, s) => {
                        if (estado !== "open" && estado !== "muted") return null;

                        /* «Al aire» sólo se puede decir si el traste 0 está en el
                         * dibujo. Con la digitación cogida desde el traste 4, esa
                         * cuerda no suena al aire: suena en la cejuela de la
                         * forma, que cae en el 3 y queda fuera de la ventana
                         * (§21). Poner un «○» ahí es decir algo que no es.
                         *
                         * La × sí se queda: una cuerda muteada lo está mires
                         * desde donde mires. */
                        if (estado === "open" && !enPrimerTraste) return null;

                        if (estado === "open" && conTexto) {
                            const et = etiquetaDePunto(chord, s, 0, modo, baseDeGrados);
                            if (et) {
                                return (
                                    <g key={`st-${s}`}>
                                        <circle
                                            cx={xCuerda(s)}
                                            cy={MINI.padTop - 8}
                                            r={radio}
                                            fill="none"
                                            stroke={tinta.punto}
                                            strokeWidth={1.4 * lw}
                                        />
                                        <text
                                            x={xCuerda(s)}
                                            y={MINI.padTop - 8 + 2.4}
                                            textAnchor="middle"
                                            fontFamily={est.fontFamily}
                                            fontSize={6.5 * k}
                                            fontWeight="700"
                                            fill={tinta.punto}
                                        >
                                            {et}
                                        </text>
                                    </g>
                                );
                            }
                        }

                        return (
                            <text
                                key={`st-${s}`}
                                x={xCuerda(s)}
                                y={MINI.padTop - 4}
                                textAnchor="middle"
                                fontFamily={est.fontFamily}
                                fontSize="8"
                                fill={tinta.linea}
                            >
                                {estado === "open" ? "○" : "×"}
                            </text>
                        );
                    })}

                    {/* Cejuela: gruesa sólo si el diagrama empieza en el traste 1 */}
                    <line
                        x1={MINI.padX} y1={MINI.padTop}
                        x2={MINI.width - MINI.padX} y2={MINI.padTop}
                        stroke={tinta.linea}
                        strokeWidth={(enPrimerTraste ? 3 : 1) * lw}
                    />

                    {Array.from({ length: numFrets }).map((_, i) => (
                        <line
                            key={`f-${i}`}
                            x1={MINI.padX} y1={yTraste(i + 1)}
                            x2={MINI.width - MINI.padX} y2={yTraste(i + 1)}
                            stroke={tinta.linea}
                            strokeWidth={1 * lw}
                            opacity="0.6"
                        />
                    ))}

                    {Array.from({ length: numStrings }).map((_, s) => (
                        <line
                            key={`s-${s}`}
                            x1={xCuerda(s)} y1={MINI.padTop}
                            x2={xCuerda(s)} y2={yTraste(numFrets)}
                            stroke={tinta.linea}
                            strokeWidth={1 * lw}
                            opacity="0.6"
                        />
                    ))}

                    {/* Si la ventana no empieza en el 1, hay que decir dónde empieza */}
                    {!enPrimerTraste && (
                        <text
                            x={MINI.padX - 4}
                            y={yNota(1) + 3}
                            textAnchor="end"
                            fontFamily={est.fontFamily}
                            fontSize="8"
                            fontWeight="700"
                            fill={tinta.linea}
                        >
                            {chord.startingFret}
                        </text>
                    )}

                    {/* LAS CEJILLAS TAMBIÉN SON NOTAS, y eran un rectángulo pelado:
                        con «Notas» activado, un acorde con cejilla enseñaba las
                        notas sueltas y callaba las cuatro o cinco de la cejilla.
                        La barra se dibuja igual y encima va un punto por cuerda,
                        como hace el mástil grande. */}
                    {(chord.barres || []).map((barre, i) => (
                        <g key={`b-${i}`}>
                            <rect
                                x={xCuerda(barre.fromString) - radio}
                                y={yNota(barre.fret) - radio}
                                width={xCuerda(barre.toString) - xCuerda(barre.fromString) + radio * 2}
                                height={radio * 2}
                                rx={radio}
                                fill={tinta.punto}
                            />
                            {conTexto && cuerdasDeCejilla(barre).map(s =>
                                texto(xCuerda(s), yNota(barre.fret), etiquetaDePunto(chord, s, barre.fret, modo, baseDeGrados), `bt-${i}-${s}`)
                            )}
                            {!conTexto && barre.finger
                                ? texto((xCuerda(barre.fromString) + xCuerda(barre.toString)) / 2, yNota(barre.fret), barre.finger, `bf-${i}`)
                                : null}
                        </g>
                    ))}

                    {(chord.dots || []).map((dot, i) => (
                        <g key={`d-${i}`}>
                            <circle
                                cx={xCuerda(dot.s)}
                                cy={yNota(dot.f)}
                                // El punto crece para que quepa el texto: con el
                                // radio normal, "C#" no entra.
                                r={radio}
                                fill={tinta.punto}
                            />
                            {conTexto
                                ? texto(xCuerda(dot.s), yNota(dot.f), etiquetaDePunto(chord, dot.s, dot.f, modo, baseDeGrados), `dt-${i}`)
                                : (dot.finger ? texto(xCuerda(dot.s), yNota(dot.f), dot.finger, `df-${i}`) : null)}
                        </g>
                    ))}
                </svg>
            );
        }

        /* ==================================================================
         * BIBLIOTECA DE ACORDES
         * ==================================================================
         * Los acordes que el usuario ha guardado desde el mástil. Cada tarjeta
         * es una FOTO completa de la digitación, no un nombre: por eso la hoja
         * puede dibujarla y el reproductor sabe qué suena.
         * ================================================================== */
        function ChordLibrary({
            chords, onAdd, onRemove, onRename, onAudition, vacio, etiquetas, song, onSetHarmony,
            onBorrarTodo, songs, onMandarA, destino
        }) {
            const [armoniaAbierta, setArmoniaAbierta] = useState(null);

            /* Y al cambiar de tonalidad se cierra: un panel que existe para decir
             * que es un acorde prestado no significa nada cuando ya no hay de
             * donde prestarlo. La guarda de dentro evita el fallo; esto evita
             * ademas el panel vacio. */
            useEffect(() => { setArmoniaAbierta(null); }, [song.keyRoot, song.keyScale]);

            /* --- POR QUÉ NO SE VEÍAN TODOS ---------------------------------
             *
             * La biblioteca era UNA fila de tarjetas de 108 px con `.k-strip`, y
             * `.k-strip` esconde la barra de scroll a propósito. Con seis
             * acordes se veían seis; con veinte seguía habiendo una fila y nada
             * que dijera que continuaba. Y como al guardar uno nuevo se añade al
             * FINAL, el acorde recién hecho aparecía justo en la parte que no se
             * veía.
             *
             * Estaban todos en la página. Lo que faltaba era poder mirarlos: una
             * rejilla que envuelve, un contador y un buscador. La tira se queda
             * —es la que va bien pegada encima de la letra— pero ya no es la
             * única forma de ver la biblioteca. */
            const [vista, setVista] = useState("tira");
            const [filtro, setFiltro] = useState("");
            const [menuAcorde, setMenuAcorde] = useState(null);

            /* Cómo se lee cada acorde en la tonalidad de la canción. `null` si
             * no se puede decir: sin tonalidad elegida, o con una escala de
             * menos de siete grados, no hay lectura, y callarse es lo correcto.
             *
             * Se calcula una vez por render de la biblioteca y no una vez por
             * tarjeta: reconocer una digitación son sesenta comparaciones de
             * fórmula, y escribir la letra vuelve a renderizar esto entero. */
            const escalaDeLaCancion = SCALE_PRESETS.find(e => e.id === song.keyScale) || SCALE_PRESETS[0];
            const lecturas = React.useMemo(() => {
                const mapa = {};
                if (!Number.isInteger(song.keyRoot)) return mapa;
                chords.forEach(c => {
                    const info = window.KharoTheory.identifyChordFromVoicing(c);
                    if (!info || !info.intervals) return;
                    mapa[c.id] = window.KharoTheory.analyzeChordInKey(
                        info.rootSemi, info.intervals, song.keyRoot, escalaDeLaCancion.intervals
                    );
                });
                return mapa;
            }, [chords, song.keyRoot, song.keyScale]);

            const lecturaDe = (chord) => {
                const l = lecturas[chord.id];
                return l && l.diatonico !== null ? l : null;
            };
            if (chords.length === 0) {
                return (
                    <div class="k-panel p-4 text-center text-xs" style={{ color: 'var(--k-text-muted)' }}>
                        {vacio}
                    </div>
                );
            }

            const texto = filtro.trim().toLowerCase();
            const visibles = texto ? chords.filter(c => (c.name || "").toLowerCase().includes(texto)) : chords;

            const abrirMenuAcorde = (e, chord) => {
                e.preventDefault();
                setMenuAcorde({ chord, x: e.clientX, y: e.clientY });
            };

            /* Mandar un acorde a OTRA canción. Con una sola canción el botón
             * «Añadir» bastaba; con varias hay que poder decir a cuál va, y
             * decirlo en el momento de mandarlo — que es cuando se sabe. */
            const opcionesDeDestino = () => {
                const lista = [];
                (songs || []).forEach(s => {
                    const esActual = s.id === song.id;
                    (s.sections || []).forEach(sec => {
                        lista.push({
                            key: `${s.id}-${sec.id}`,
                            label: `${esActual ? "· " : ""}${s.title} › ${sec.name}`,
                            ayuda: esActual ? "En la canción abierta" : "En otra canción",
                            hacer: () => onMandarA(menuAcorde.chord, s.id, sec.id)
                        });
                    });
                });
                return lista;
            };

            const tarjeta = (chord) => (
                        <div
                            key={chord.id}
                            class="k-panel p-2 flex flex-col items-center gap-1.5"
                            style={{ width: "108px", flexShrink: 0 }}
                            onContextMenu={(e) => abrirMenuAcorde(e, chord)}
                        >
                            <button
                                onClick={() => onAudition(chord)}
                                title={`Escuchar ${chord.name}. Clic derecho para más`}
                                class="w-full"
                                style={{ cursor: "pointer", background: "none", border: "none", padding: 0 }}
                            >
                                <MiniFretboard chord={chord} ancho={92} etiquetas={etiquetas} baseDeGrados={baseDeGradosDe(chord, song)} />
                            </button>

                            <input
                                type="text"
                                value={chord.name}
                                onChange={(e) => onRename(chord.id, e.target.value)}
                                class="k-field w-full text-center text-xs font-bold py-1"
                                title="Nombre del acorde"
                            />

                            {/* --- CÓMO SE LEE ESTE ACORDE EN ESTA TONALIDAD ---
                                Diatónico: se dice qué grado es y no hay nada que
                                decidir. De fuera: la app propone lecturas y la
                                eliges tú. Nombrar la función de un acorde
                                prestado es una lectura, y esa la firma quien
                                escribe la canción, no el programa. */}
                            {(() => {
                                const lectura = lecturaDe(chord);
                                if (!lectura) return null;

                                if (lectura.diatonico) {
                                    return (
                                        <span
                                            class="k-chip w-full text-center"
                                            title={`Grado ${lectura.romano} de la tonalidad`}
                                        >
                                            {lectura.romano}
                                        </span>
                                    );
                                }

                                const puesta = (song.harmony || {})[chord.id];
                                const etiqueta = (puesta && puesta.funcion) || "de fuera";
                                return (
                                    <button
                                        onClick={() => setArmoniaAbierta(armoniaAbierta === chord.id ? null : chord.id)}
                                        class="k-chip w-full text-center"
                                        style={{
                                            cursor: "pointer",
                                            borderColor: "var(--k-highlight)",
                                            color: "var(--k-highlight)"
                                        }}
                                        title={lectura.notasDeFuera.length
                                            ? `No es de la tonalidad (${lectura.notasDeFuera.join(", ")}). Pulsa para decir qué es.`
                                            : "No es de la tonalidad. Pulsa para decir qué es."}
                                    >
                                        {etiqueta}
                                    </button>
                                );
                            })()}

                            {armoniaAbierta === chord.id && (() => {
                                const lectura = lecturaDe(chord);
                                /* La misma guarda que el chip de arriba. `lecturaDe`
                                 * devuelve null en cuanto no hay tonalidad -es su
                                 * comportamiento correcto: sin tonalidad no hay
                                 * lectura que dar- y sin esto el desplegable leia
                                 * `lectura.sugerencias` de null y se llevaba la app
                                 * entera por delante. */
                                if (!lectura) return null;
                                const puesta = (song.harmony || {})[chord.id] || { funcion: "", nota: "" };
                                return (
                                    <div class="w-full space-y-1">
                                        {(lectura.sugerencias || []).map(s => (
                                            <button
                                                key={s.id}
                                                onClick={() => { onSetHarmony(chord.id, { funcion: s.etiqueta, nota: puesta.nota }); setArmoniaAbierta(null); }}
                                                class="k-btn k-btn--outline w-full text-[10px] py-1"
                                                style={{ justifyContent: "flex-start", textAlign: "left" }}
                                                title={s.explica}
                                            >
                                                {s.etiqueta}
                                            </button>
                                        ))}
                                        <input
                                            type="text"
                                            value={puesta.funcion}
                                            onChange={(e) => onSetHarmony(chord.id, { funcion: e.target.value, nota: puesta.nota })}
                                            placeholder="o escríbelo"
                                            class="k-field w-full text-center text-[10px] py-1"
                                        />
                                        <input
                                            type="text"
                                            value={puesta.nota}
                                            onChange={(e) => onSetHarmony(chord.id, { funcion: puesta.funcion, nota: e.target.value })}
                                            placeholder="nota al margen"
                                            class="k-field w-full text-center text-[10px] py-1"
                                        />
                                    </div>
                                );
                            })()}

                            <div class="flex gap-1 w-full">
                                <button
                                    onClick={() => onAdd(chord)}
                                    onContextMenu={(e) => abrirMenuAcorde(e, chord)}
                                    class="k-btn k-btn--primary flex-1 text-[10px] py-1.5"
                                    title="Añadir a la sección activa. Clic derecho para elegir a qué canción va"
                                >
                                    Añadir
                                </button>
                                <BotonBorrar
                                    onClick={() => onRemove(chord.id)}
                                    title={`Quitar «${chord.name}» de la biblioteca`}
                                    className="text-[10px] py-1.5"
                                />
                            </div>
                        </div>
            );

            return (
                <div class="space-y-2">
                    <div class="flex items-center gap-2 flex-wrap">
                        <span class="k-label">Biblioteca de acordes</span>
                        <span class="k-chip">{chords.length}</span>
                        <span class="text-[10px]" style={{ color: 'var(--k-text-faint)' }}>
                            «Añadir» las manda a «{destino}»
                        </span>

                        <div class="k-tabs">
                            <button
                                onClick={() => setVista("tira")}
                                class={"k-tab text-[10px] " + (vista === "tira" ? "k-tab--active" : "")}
                                title="Una fila que se desliza, pegada a la letra"
                            >
                                Tira
                            </button>
                            <button
                                onClick={() => setVista("rejilla")}
                                class={"k-tab text-[10px] " + (vista === "rejilla" ? "k-tab--active" : "")}
                                title="Todos a la vez, en varias filas"
                            >
                                Rejilla
                            </button>
                        </div>

                        {/* El buscador aparece cuando la tira deja de caber de un
                            vistazo. Con cinco acordes sobra; con veinticinco es
                            lo único que sirve. */}
                        {chords.length > 8 && (
                            <input
                                type="text"
                                value={filtro}
                                onChange={(e) => setFiltro(e.target.value)}
                                placeholder="Buscar…"
                                class="k-field px-2 py-1 text-xs"
                                style={{ width: "140px" }}
                            />
                        )}

                        <div class="flex-1"></div>

                        {onBorrarTodo && (
                            <BotonBorrar
                                onClick={onBorrarTodo}
                                title="Vaciar la biblioteca entera"
                                label="Vaciar biblioteca"
                            />
                        )}
                    </div>

                    {visibles.length === 0 ? (
                        <p class="text-[11px] py-2" style={{ color: 'var(--k-text-faint)' }}>
                            Ningún acorde se llama así.
                        </p>
                    ) : vista === "tira" ? (
                        /* La tira sigue siendo una fila que se desliza, pero
                           ahora se NOTA que sigue: el degradado del borde
                           derecho es lo único que faltaba para que el scroll
                           escondido dejara de parecer el final de la lista. */
                        <div style={{ position: 'relative' }}>
                            <div class="k-strip flex gap-2 pb-1">
                                {visibles.map(chord => tarjeta(chord))}
                            </div>
                            {visibles.length > 5 && (
                                <div
                                    aria-hidden="true"
                                    style={{
                                        position: 'absolute', top: 0, right: 0, bottom: '4px', width: '36px',
                                        pointerEvents: 'none',
                                        background: 'linear-gradient(to right, rgba(var(--k-bg-rgb),0), var(--k-bg))'
                                    }}
                                />
                            )}
                        </div>
                    ) : (
                        <div
                            class="flex flex-wrap gap-2"
                            style={{ maxHeight: "42vh", overflowY: "auto" }}
                        >
                            {visibles.map(chord => tarjeta(chord))}
                        </div>
                    )}

                    {menuAcorde && (
                        <MenuContextual
                            x={menuAcorde.x}
                            y={menuAcorde.y}
                            titulo={menuAcorde.chord.name}
                            onCerrar={() => setMenuAcorde(null)}
                            opciones={[
                                { label: "Escucharlo", hacer: () => onAudition(menuAcorde.chord) },
                                { label: "Añadir a la sección activa", hacer: () => onAdd(menuAcorde.chord) },
                                ...opcionesDeDestino(),
                                {
                                    label: "Quitar de la biblioteca",
                                    hacer: () => onRemove(menuAcorde.chord.id),
                                    estilo: { color: 'var(--k-danger)' }
                                }
                            ]}
                        />
                    )}
                </div>
            );
        }

        /* ==================================================================
         * LOS COMPASES DE UNA SECCIÓN
         * ==================================================================
         * Cada acorde con su duración EN PULSOS, no en compases: así se puede
         * escribir un acorde que dura medio compás o tres, que es lo que pasa
         * en cuanto una canción sale del manual.
         *
         * La referencia visual del compás la da el separador: cada vez que la
         * suma de pulsos completa un compás, se dibuja una barra.
         * ================================================================== */
        function BarStrip({ bars, chordsById, beatsPerBar, onChangeBeats, onRemove, onMove, onDuplicar, activeIndex }) {
            const [menu, setMenu] = useState(null);

            if (bars.length === 0) {
                return (
                    <p class="text-xs py-3" style={{ color: 'var(--k-text-muted)' }}>
                        Sin acordes todavía. Añádelos desde la biblioteca de arriba.
                    </p>
                );
            }

            let acumulado = 0;

            return (
                <div class="k-strip flex items-stretch gap-1.5 pb-1">
                    {bars.map((bar, i) => {
                        const chord = chordsById[bar.chordId];
                        acumulado += bar.beats;
                        // Barra de compás cuando la suma cuadra justo.
                        const cierraCompas = acumulado % beatsPerBar === 0;
                        const activo = activeIndex === i;

                        return (
                            <React.Fragment key={i}>
                                <div
                                    class="k-panel shrink-0 p-2 flex flex-col items-center gap-1"
                                    onContextMenu={(e) => {
                                        e.preventDefault();
                                        setMenu({ i, nombre: chord ? chord.name : "Compás", x: e.clientX, y: e.clientY });
                                    }}
                                    style={{
                                        width: "96px",
                                        borderColor: activo ? 'var(--k-highlight)' : undefined,
                                        boxShadow: activo ? '0 0 0 2px var(--k-highlight)' : undefined
                                    }}
                                >
                                    <span class="text-sm font-black truncate w-full text-center" style={{ color: 'var(--k-highlight)' }}>
                                        {chord ? chord.name : "?"}
                                    </span>

                                    <div class="flex items-center gap-1">
                                        <button onClick={() => onChangeBeats(i, -1)} class="k-btn k-btn--ghost text-xs w-6 h-6" title="Un pulso menos">−</button>
                                        <span class="k-value text-xs w-8 text-center">{bar.beats}</span>
                                        <button onClick={() => onChangeBeats(i, +1)} class="k-btn k-btn--ghost text-xs w-6 h-6" title="Un pulso más">+</button>
                                    </div>
                                    <span class="k-label text-[8px]">pulsos</span>

                                    <div class="flex gap-1 w-full">
                                        <button onClick={() => onMove(i, -1)} class="k-btn k-btn--ghost flex-1 text-[10px] py-1" title="Mover antes">‹</button>
                                        <BotonBorrar onClick={() => onRemove(i)} title="Quitar este compás" className="py-1" size="h-3 w-3" />
                                        <button onClick={() => onMove(i, +1)} class="k-btn k-btn--ghost flex-1 text-[10px] py-1" title="Mover después">›</button>
                                    </div>
                                </div>

                                {cierraCompas && i < bars.length - 1 && (
                                    <div class="shrink-0 w-px my-2" style={{ backgroundColor: 'var(--k-border-strong)' }}></div>
                                )}
                            </React.Fragment>
                        );
                    })}

                    {/* Los mismos botones de la tarjeta, más duplicar y saltos
                        de cuatro pulsos. Con una progresión larga, alcanzar los
                        −/+ de un compás concreto es un ejercicio de puntería. */}
                    {menu && (
                        <MenuContextual
                            x={menu.x}
                            y={menu.y}
                            titulo={`${menu.nombre} · compás ${menu.i + 1}`}
                            onCerrar={() => setMenu(null)}
                            opciones={[
                                { label: "Duplicar", hacer: () => onDuplicar && onDuplicar(menu.i), desactivada: !onDuplicar },
                                { label: "Mover antes", hacer: () => onMove(menu.i, -1), desactivada: menu.i === 0 },
                                { label: "Mover después", hacer: () => onMove(menu.i, +1), desactivada: menu.i === bars.length - 1 },
                                { label: "Un compás entero más", hacer: () => onChangeBeats(menu.i, beatsPerBar) },
                                { label: "Un compás entero menos", hacer: () => onChangeBeats(menu.i, -beatsPerBar) },
                                { label: "Quitar el compás", hacer: () => onRemove(menu.i), estilo: { color: 'var(--k-danger)' } }
                            ]}
                        />
                    )}
                </div>
            );
        }

        /* ==================================================================
         * LA LETRA, CON LOS ACORDES ENCIMA
         * ==================================================================
         * Dos líneas por verso: arriba los acordes, abajo la letra, alineadas
         * por COLUMNA — el acorde cae sobre la sílaba que empieza en esa
         * columna. Eso no cambia: es el modelo, y es lo que hace exacta la
         * hoja exportada.
         *
         * Lo que cambia es CÓMO se edita. Contar espacios a mano para alinear
         * un acorde no lo entiende nadie que no venga de escribir ChordPro, así
         * que ahora se arrastran:
         *
         *   ARRASTRAR (por defecto)  Cada acorde es una ficha sobre el verso.
         *                            Se coge y se suelta encima de la sílaba.
         *   TEXTO (secundario)       Las dos líneas en crudo, para pegar desde
         *                            fuera o para arreglar algo a mano.
         *
         * Las dos caras editan la MISMA cadena `chordLine`, así que no pueden
         * desincronizarse: arrastrar es `insertChordAtColumn`, ni más ni menos.
         *
         * La monoespaciada tampoco es un gusto: el acorde se coloca en la
         * columna N multiplicando N por el ancho de carácter, y eso sólo es
         * exacto si todos los caracteres miden lo mismo.
         * ================================================================== */

        /* El ancho de carácter se MIDE, no se calcula. Antes era la constante
         * 8,4 (14 px × 0,6), que sólo vale para la monoespaciada exacta que
         * suponíamos y se rompe con otra fuente o con el tamaño de 16 px que
         * el móvil necesita para que iOS no haga zoom. */
        function useCharWidth() {
            const medidorRef = useRef(null);
            const [ancho, setAncho] = useState(8.4);

            /* Se remide EN CADA RENDER, no una vez al montar.
             *
             * El ancho de carácter cambia por más motivos de los que parece:
             * Tailwind se carga en el navegador y aplica el tamaño de letra
             * DESPUÉS del primer pintado, la tipografía monoespaciada termina
             * de cargar más tarde, en móvil los campos saltan a 16 px para que
             * iOS no haga zoom, y el usuario puede cambiar el zoom del
             * navegador. Con una sola medida al montar, el ancho se queda viejo
             * y cada acorde se desplaza un poco más cuanto más avanza el verso
             * — de los fallos más difíciles de ver y de explicar.
             *
             * Un `getBoundingClientRect` por render es barato, y comparando
             * antes de guardar no hay bucle: converge en el segundo render y
             * ahí se queda.
             *
             * (Un ResizeObserver parece la herramienta obvia, pero observa un
             * nodo concreto: si React recrea el medidor, el observer se queda
             * mirando un nodo que ya no está en la página y no vuelve a avisar.) */
            useLayoutEffect(() => {
                const el = medidorRef.current;
                if (!el) return;
                const w = el.getBoundingClientRect().width / 100;
                if (w > 0 && Math.abs(w - ancho) > 0.01) setAncho(w);
            });

            // Cien caracteres y se divide: medir uno solo arrastra el error de
            // redondeo del navegador a cada columna.
            const medidor = (
                /* Lleva LAS MISMAS clases que la caja de la letra, y no sólo
                 * `k-mono`. Con `k-mono text-sm` a secas, el medidor se quedaba
                 * en 14 px mientras que en móvil la caja real salta a 16 px
                 * —la regla que evita que iOS haga zoom al enfocar—, así que
                 * medía un carácter un 14% más estrecho y los acordes caían
                 * cada vez más a la izquierda cuanto más avanzaba el verso.
                 * El borde y el relleno se anulan porque aquí sólo interesa el
                 * ancho del texto. */
                <span
                    ref={medidorRef}
                    class="k-field k-mono k-lyric-line text-sm"
                    aria-hidden="true"
                    style={{
                        // `inline-block` no es cosmético: ResizeObserver NO
                        // observa cajas en línea, así que con un <span> normal
                        // el observer se queda mudo y la medida no se corrige
                        // nunca. Es lo que hacía que el ancho se quedase en el
                        // de antes de que Tailwind aplicara el tamaño de letra.
                        display: "inline-block",
                        position: "absolute", visibility: "hidden", whiteSpace: "pre",
                        pointerEvents: "none", border: 0, padding: 0
                    }}
                >
                    {"0".repeat(100)}
                </span>
            );

            return [ancho, medidor];
        }

        /* El carril de acordes de un verso: las fichas que se arrastran.
         *
         * Va sincronizado con el desplazamiento horizontal de la letra. Sin
         * eso, en un verso largo la letra se va a la derecha y los acordes se
         * quedan atrás, que es ver el formato roto sin estarlo. */
        function ChordLane({ chordLine, lyric, charWidth, scrollLeft, chordSeleccionado, onChange }) {
            const carrilRef = useRef(null);
            const capaRef = useRef(null);
            const [arrastre, setArrastre] = useState(null); // { indice, col }

            const marcas = Song.parseChordLine(chordLine);

            /* La columna se mide contra la CAPA interior, no contra el carril:
             * la capa ya lleva aplicado el desplazamiento y el margen que la
             * hace coincidir con la primera letra del verso, así que aquí no
             * hay que volver a sumarlos. Un sitio menos donde equivocarse. */
            const columnaDesdeX = (clientX) => {
                const capa = capaRef.current;
                if (!capa) return 0;
                const x = clientX - capa.getBoundingClientRect().left;
                return Math.max(0, Math.round(x / charWidth));
            };

            const empezarArrastre = (e, indice) => {
                e.preventDefault();
                e.stopPropagation();
                e.currentTarget.setPointerCapture(e.pointerId);
                setArrastre({ indice, col: marcas[indice].col });
            };

            const moverArrastre = (e) => {
                if (!arrastre) return;
                setArrastre({ ...arrastre, col: columnaDesdeX(e.clientX) });
            };

            const soltarArrastre = () => {
                if (!arrastre) return;
                const movida = marcas[arrastre.indice];
                const resto = marcas.filter((_, i) => i !== arrastre.indice);
                resto.push({ col: arrastre.col, name: movida.name });
                onChange(Song.buildChordLine(resto));
                setArrastre(null);
            };

            // Tocar el carril vacío coloca ahí el acorde elegido. El carril es
            // el sitio donde viven los acordes, así que es donde se espera
            // poder ponerlos.
            const colocarAqui = (e) => {
                if (!chordSeleccionado) return;
                onChange(Song.insertChordAtColumn(chordLine, columnaDesdeX(e.clientX), chordSeleccionado));
            };

            const quitar = (indice) => {
                onChange(Song.buildChordLine(marcas.filter((_, i) => i !== indice)));
            };

            return (
                <div
                    ref={carrilRef}
                    class="k-chord-lane"
                    onPointerDown={colocarAqui}
                    title={chordSeleccionado
                        ? `Toca para colocar ${chordSeleccionado}`
                        : "Elige un acorde arriba para poder colocarlo"}
                >
                    <div ref={capaRef} class="k-chord-lane__inner" style={{ transform: `translateX(${-scrollLeft}px)` }}>
                        {marcas.map((marca, i) => {
                            const col = arrastre && arrastre.indice === i ? arrastre.col : marca.col;
                            const silaba = lyric.slice(col, col + marca.name.length);

                            return (
                                <button
                                    key={i}
                                    class={`k-chord-chip ${arrastre && arrastre.indice === i ? "k-chord-chip--moving" : ""}`}
                                    style={{ left: `${col * charWidth}px` }}
                                    onPointerDown={(e) => empezarArrastre(e, i)}
