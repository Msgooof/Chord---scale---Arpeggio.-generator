            const borrarEjercicio = (id) => {
                const lista = fundirEnLista(exercises, exercise);
                const victima = lista.find(x => x.id === id);
                if (!victima) return;
                if (!window.confirm(`Se borra «${victima.title}» y no hay vuelta atrás.`)) return;

                const quedan = lista.filter(x => x.id !== id);
                const finales = quedan.length ? quedan : [Song.createExercise()];
                setExercises(finales);
                Song.saveExercises(finales);
                if (id === exercise.id) {
                    setExercise(finales[0]);
                    stopExercise();
                }
                showToast(`«${victima.title}» borrado`);
            };

            const borrarTodosLosEjercicios = () => {
                const lista = fundirEnLista(exercises, exercise);
                if (!window.confirm(
                    `Se borran los ${lista.length} ejercicios guardados y no hay vuelta atrás.\n\n` +
                    "Si quieres conservar alguno, cancela y descárgalo antes."
                )) return;
                const nuevo = Song.createExercise();
                setExercises([nuevo]);
                Song.saveExercises([nuevo]);
                setExercise(nuevo);
                stopExercise();
                showToast("Ejercicios borrados");
            };

            /* Vaciar la biblioteca de acordes. Es aparte de las canciones a
             * propósito: la biblioteca es de TODAS, y borrarla de refilón al
             * borrar una canción sería la peor sorpresa posible. */
            const borrarTodosLosAcordes = () => {
                if (chordLibrary.length === 0) { showToast("La biblioteca ya está vacía"); return; }
                if (!window.confirm(
                    `Se borran los ${chordLibrary.length} acordes de la biblioteca y no hay vuelta atrás.\n\n` +
                    "Desaparecerán también de los compases de todas las canciones que los usaran."
                )) return;

                setChordLibrary([]);
                Song.saveChordLibrary([]);
                const limpiar = (s) => ({
                    ...s,
                    harmony: {},
                    sections: s.sections.map(sec => ({ ...sec, bars: [] }))
                });
                setSongs(prev => {
                    const lista = fundirEnLista(prev, song).map(limpiar);
                    Song.saveSongs(lista);
                    return lista;
                });
                setSong(prev => limpiar(prev));
                showToast("Biblioteca de acordes vaciada");
            };


            /* --- COPIA DE SEGURIDAD EN JSON -------------------------------
             * localStorage se borra solo: al limpiar el navegador, en ventana
             * privada, o cambiando de ordenador. Esto es lo que hace que el
             * trabajo no dependa de él.
             * -------------------------------------------------------------- */
            /* --- EXPORTAR LA HOJA -----------------------------------------
             *
             * Se serializan los MISMOS nodos que se ven en la vista previa,
             * igual que hace el diagrama del mástil: lo que ves es lo que se
             * descarga, sin un segundo camino de dibujo que se pueda
             * desincronizar.
             * -------------------------------------------------------------- */
            const paginasDeLaHoja = () =>
                Array.from(document.querySelectorAll('[data-song-sheet="1"]'));

            // Varias descargas seguidas: algunos navegadores descartan las que
            // llegan de golpe, así que van espaciadas.
            const descargarEnFila = (archivos) => {
                archivos.forEach((archivo, i) => {
                    setTimeout(() => {
                        const a = document.createElement("a");
                        a.download = archivo.nombre;
                        a.href = archivo.url;
                        a.click();
                        if (archivo.revocar) setTimeout(() => URL.revokeObjectURL(archivo.url), 1000);
                    }, i * 350);
                });
            };

            // El nombre del archivo sale de lo que se está exportando: en
            // Ejercicios, la ficha no debería descargarse con el título de una
            // canción que no tiene nada que ver.
            const nombreBase = () => {
                const titulo = appView === "exercise" ? exercise.title : song.title;
                const porDefecto = appView === "exercise" ? "ejercicio" : "cancion";
                return (titulo || porDefecto).replace(/[^\wáéíóúñÁÉÍÓÚÑ -]/g, "").trim() || porDefecto;
            };

            const svgDeLaPagina = (nodo) => {
                const clon = nodo.cloneNode(true);
                clon.setAttribute("xmlns", "http://www.w3.org/2000/svg");
                clon.setAttribute("xmlns:xlink", "http://www.w3.org/1999/xlink");
                clon.setAttribute("version", "1.1");
                // La clase de la vista previa no pinta nada dentro del archivo.
                clon.removeAttribute("class");
                return '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(clon);
            };

            const exportSheetSVG = (paginas) => {
                const total = paginas.length;
                descargarEnFila(paginas.map((nodo, i) => {
                    const blob = new Blob([svgDeLaPagina(nodo)], { type: "image/svg+xml;charset=utf-8" });
                    return {
                        nombre: total > 1
                            ? `${nombreBase()}_kharo_p${i + 1}.svg`
                            : `${nombreBase()}_kharo.svg`,
                        url: URL.createObjectURL(blob),
                        revocar: true
                    };
                }));
                showToast(total > 1 ? `${total} páginas SVG descargadas` : "SVG descargado");
            };

            // Cada página a canvas. `escala` 3 es la misma que usa el diagrama.
            const paginaAImagen = (nodo, escala) => new Promise((resolve, reject) => {
                const svgData = svgDeLaPagina(nodo);
                const ancho = parseFloat(nodo.getAttribute("width"));
                const alto = parseFloat(nodo.getAttribute("height"));

                const canvas = document.createElement("canvas");
                canvas.width = ancho * escala;
                canvas.height = alto * escala;
                const ctx = canvas.getContext("2d");

                const blob = new Blob([svgData], { type: "image/svg+xml;charset=utf-8" });
                const url = URL.createObjectURL(blob);
                const img = new Image();

                img.onload = () => {
                    // El papel se pinta antes: si el SVG tuviera zonas
                    // transparentes, en un PNG saldrían negras al imprimir.
                    ctx.fillStyle = "#ffffff";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    URL.revokeObjectURL(url);
                    resolve(canvas);
                };
                img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("no se pudo dibujar la página")); };
                img.src = url;
            });

            const exportSheetPNG = async (paginas) => {
                try {
                    const canvases = await Promise.all(paginas.map(n => paginaAImagen(n, 3)));
                    const total = canvases.length;
                    descargarEnFila(canvases.map((canvas, i) => ({
                        nombre: total > 1
                            ? `${nombreBase()}_kharo_p${i + 1}.png`
                            : `${nombreBase()}_kharo.png`,
                        url: canvas.toDataURL("image/png")
                    })));
                    showToast(total > 1 ? `${total} páginas PNG descargadas` : "PNG descargado");
                } catch (e) {
                    showToast("No se pudo generar el PNG");
                }
            };

            const exportSheetPDF = async (paginas) => {
                // jsPDF va en vendor/ como todo lo demás. Si no está, el botón
                // avisa en vez de fallar en silencio: la app sigue funcionando
                // sin internet, que es la promesa del proyecto.
                const jspdf = window.jspdf;
                if (!jspdf || !jspdf.jsPDF) {
                    showToast("Falta vendor/jspdf.umd.min.js — usa PNG o SVG, o imprime desde el navegador");
                    return;
                }

                try {
                    const canvases = await Promise.all(paginas.map(n => paginaAImagen(n, 2.5)));
                    const doc = new jspdf.jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });

                    canvases.forEach((canvas, i) => {
                        if (i > 0) doc.addPage();
                        doc.addImage(canvas.toDataURL("image/jpeg", 0.92), "JPEG", 0, 0, 210, 297);
                    });

                    doc.save(`${nombreBase()}_kharo.pdf`);
                    showToast(`PDF de ${canvases.length} ${canvases.length === 1 ? "página" : "páginas"} descargado`);
                } catch (e) {
                    showToast("No se pudo generar el PDF");
                }
            };

            const exportSong = (formato) => {
                if (formato === "json") { exportSongJSON(); return; }

                const paginas = paginasDeLaHoja();
                if (paginas.length === 0) {
                    showToast("La hoja todavía está vacía");
                    return;
                }

                if (formato === "svg") exportSheetSVG(paginas);
                else if (formato === "png") exportSheetPNG(paginas);
                else if (formato === "pdf") exportSheetPDF(paginas);
            };

            const exportSongJSON = () => {
                /* La canción sola no basta: sus compases apuntan a acordes por
                 * id, y esos ids sólo significan algo en ESTE navegador. Sin
                 * los acordes dentro, el archivo abierto en otro sitio sería
                 * una lista de compases vacíos. Van los que usa, no toda la
                 * biblioteca. */
                const usados = {};
                song.sections.forEach(s => s.bars.forEach(b => { usados[b.chordId] = true; }));
                const paquete = {
                    kharo: "cancion",
                    version: Song.SONG_FORMAT_VERSION,
                    song,
                    chords: chordLibrary.filter(c => usados[c.id])
                };

                const blob = new Blob([JSON.stringify(paquete, null, 2)], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.download = `${song.title || "cancion"}_kharo.json`;
                a.href = url;
                a.click();
                URL.revokeObjectURL(url);
                showToast("Copia de la canción descargada");
            };

            const importSongJSON = () => {
                const input = document.createElement("input");
                input.type = "file";
                input.accept = "application/json,.json";
                input.onchange = () => {
                    const archivo = input.files && input.files[0];
                    if (!archivo) return;

                    const lector = new FileReader();
                    lector.onload = () => {
                        try {
                            // Lo que llega de fuera puede venir de otra versión
                            // o estar roto: se normaliza contra el modelo actual
                            // en vez de confiar en el archivo. Se acepta tanto
                            // el paquete con acordes como una canción suelta.
                            const bruto = JSON.parse(lector.result);
                            const cargada = Song.normalizeSong(bruto.song || bruto);
                            const acordes = Array.isArray(bruto.chords) ? bruto.chords : [];

                            // Los acordes que ya estén (mismo id) no se
                            // duplican: importar dos veces la misma canción no
                            // debe llenar la biblioteca de copias.
                            setChordLibrary(prev => {
                                const conocidos = {};
                                prev.forEach(c => { conocidos[c.id] = true; });
                                return [...prev, ...acordes.filter(c => c && c.id && !conocidos[c.id])];
                            });

                            setSong(cargada);
                            setActiveSectionId(cargada.sections[0].id);
                            showToast(`«${cargada.title}» cargada`);
                        } catch (e) {
                            showToast("Ese archivo no es una canción de Kharo");
                        }
                    };
                    lector.readAsText(archivo);
                };
                input.click();
            };

            // --- EVENTOS DE INTERACCIÓN AUDIBLE ---
            const playSingleNoteAudio = (stringIndex, fretNum) => {
                synthInstance.init();
                const baseMidi = stringBaseMIDI(stringIndex);

                // En modo acorde el diagrama es una FORMA que se desplaza entera
                // con la ventana, así que una cuerda al aire (fretNum 0) es la
                // cejuela de la forma y sube con ella. En escalas y arpegios el
                // diagrama es un MAPA del mástil: al aire es al aire.
                const esCuerdaAlAireDeUnMapa = fretNum === 0 && appMode !== "chord";
                const absMidi = esCuerdaAlAireDeUnMapa
                    ? baseMidi
                    : fretToMidi(baseMidi, startingFret, fretNum);

                synthInstance.playNote(absMidi);

                // Disparar destello visual
                setNotePulse({ s: stringIndex, f: fretNum });
                setTimeout(() => setNotePulse(null), 400);
            };

            // --- NUEVA LÓGICA DE RATÓN / GESTO ARRASTRAR PARA CEJILLAS ---
            const handleMouseDown = (sIdx, fretNum) => {
                if (!modoEditable) return;
                setDragStart({ s: sIdx, f: fretNum });
                setDragCurrent({ s: sIdx, f: fretNum });
            };

            const handleMouseEnter = (sIdx, fretNum) => {
                if (!modoEditable || !dragStart) return;
                if (dragStart.f === fretNum) {
                    setDragCurrent({ s: sIdx, f: fretNum });
                }
            };

            const handleMouseUp = () => {
                if (!modoEditable || !dragStart || !dragCurrent) return;

                const sIdx = dragStart.s;
                const fretNum = dragStart.f;

                if (dragStart.s === dragCurrent.s) {
                    // MEJORA: Detectar si se hizo click sobre una cejilla existente en este traste y rango de cuerdas para eliminarla
                    const barreIdx = barres.findIndex(b => b.fret === fretNum && sIdx >= b.fromString && sIdx <= b.toString);
                    if (barreIdx > -1) {
                        removeBarre(barreIdx);
                        setDragStart(null);
                        setDragCurrent(null);
                        return;
                    }

                    // Contra el mástil ACTIVO, no contra `dots` a secas: en Libre
                    // eso preguntaba por las notas del acorde, así que una casilla
                    // ocupada allí se comía el clic aquí.
                    const existingIndex = dotsActivos.findIndex(d => d.s === sIdx && d.f === fretNum);
                    if (existingIndex > -1) {
                        setDotsActivos(prev => prev.filter(d => !(d.s === sIdx && d.f === fretNum)));
                        if (appMode === "free") {
                            setPathManual(prev => prev ? prev.filter(p => !(p.s === sIdx && p.f === fretNum)) : prev);
                        }
                    } else {
                        /* UNA NOTA POR CUERDA, PERO SÓLO EN ACORDES.
                         *
                         * Un acorde es lo que puede sonar a la vez, y un dedo
                         * por cuerda es todo lo que hay: colocar la segunda
                         * cancela la primera. En Libre esa regla no vale — se
                         * está escribiendo un recorrido, no una posición de la
                         * mano, y tres notas en la misma cuerda es exactamente
                         * lo que se practica. */
                        setDotsActivos(prev => {
                            const limpios = appMode === "chord" ? prev.filter(d => d.s !== sIdx) : prev;
                            return [...limpios, { s: sIdx, f: fretNum, finger: "" }];
                        });

                        /* En Libre, poner una nota la mete YA en el recorrido.
                         * Separarlo en dos gestos —ponerla y luego volver a
                         * tocarla para ordenarla— es pedir el doble de toques
                         * para lo que casi siempre se hace en un orden: el de
                         * ponerlas. Reordenar sigue estando: se arrastra de una
                         * a otra, o se quita desde el menú de la flecha. */
                        if (appMode === "free") {
                            setPathManual(prev => [...(prev || []), { s: sIdx, f: fretNum }]);
                        }

                        // Conmutamos el estado al aire
                        const updatedStates = [...stringStatesActivos];
                        updatedStates[sIdx] = "none";
                        setStringStatesActivos(updatedStates);

                        playSingleNoteAudio(sIdx, fretNum);
                    }
                } else if (appMode === "chord") {
                    /* SÓLO en Acordes. Libre no dibuja cejillas, así que el
                     * arrastre entre cuerdas no dejaba rastro donde ocurría y
                     * escribía en `barres`, que es del acorde de al lado: se
                     * salía de Libre y el C se había convertido en C6.
                     *
                     * En Libre el gesto no hace nada. Trazar flechas ya se hace
                     * arrastrando de una nota a otra, que es el gesto que ahí
                     * significa algo. */
                    const fromString = Math.min(dragStart.s, dragCurrent.s);
                    const toString = Math.max(dragStart.s, dragCurrent.s);
                    const fret = dragStart.f;

                    // MEJORA: Cejilla es INMUNE, así que NO eliminamos notas (dots) ni alteramos estados al aire/muted de las cuerdas al crearla!
                    
                    // Eliminar cualquier cejilla previa idéntica en el mismo traste y rango
                    let filteredBarres = barres.filter(b => !(b.fret === fret && b.fromString === fromString && b.toString === toString));
                    
                    const newBarre = { fromString, toString, fret, finger: "" };
                    setBarres([...filteredBarres, newBarre]);
                    playSingleNoteAudio(fromString, fret);
                    showToast("Cejilla creada por arrastre");
                }

                setDragStart(null);
                setDragCurrent(null);
            };

            // --- SOPORTE MULTI-TOQUE COMPATIBLE CON MÓVILES ---
            const handleTouchStart = (e, sIdx, fretNum) => {
                if (!modoEditable) return;
                setDragStart({ s: sIdx, f: fretNum });
                setDragCurrent({ s: sIdx, f: fretNum });
            };

            const handleTouchMove = (e) => {
                if (!modoEditable || !dragStart) return;
                const svg = document.getElementById("chord-diagram-svg");
                if (!svg) return;
                
                const rect = svg.getBoundingClientRect();
                const touchX = e.touches[0].clientX - rect.left;
                
                const scaleX = width / rect.width;
                const svgX = touchX * scaleX;
                
                let closestS = Math.round((svgX - paddingLeft) / stringSpacing);
                closestS = Math.max(0, Math.min(numStrings - 1, closestS));
                
                setDragCurrent({ s: closestS, f: dragStart.f });
            };

            const removeBarre = (idx) => {
                setBarres(barres.filter((_, i) => i !== idx));
                showToast("Cejilla eliminada");
            };

            const toggleStringState = (stringIndex) => {
                if (!modoEditable) return; 
                
                const states = ["none", "open", "muted"];
                const currentIdx = states.indexOf(stringStatesActivos[stringIndex]);
                const nextIdx = (currentIdx + 1) % states.length;
                const nextState = states[nextIdx];
                
                const updated = [...stringStatesActivos];
                updated[stringIndex] = nextState;
                setStringStatesActivos(updated);

                // MEJORA: Si la cuerda pasa a estar "open" o "muted", eliminamos puntos físicos (dots), pero la cejilla es INMUNE.
                // En Libre no: ahí una cuerda puede llevar la nota al aire Y tres
                // pisadas, porque lo que se escribe es el orden, no la posición.
                if (appMode === "chord" && (nextState === "open" || nextState === "muted")) {
                    setDotsActivos(prev => prev.filter(d => d.s !== stringIndex));
                }

                if (nextState === "open") {
                    playSingleNoteAudio(stringIndex, 0);
                }
            };

            const changeTuningNote = (index, value) => {
                const updated = [...tuning];
                updated[index] = value;
                setTuning(updated);
                setSelectedTuningName("Personalizada");
                // Afinación libre: se vuelve a deducir la octava por cercanía.
                setTuningMidi(null);
            };

            const toggleCustomInterval = (idx) => {
                const updated = [...customScaleIntervals];
                updated[idx] = !updated[idx];
                setCustomScaleIntervals(updated);
            };

            /* Repone el mástil desde una digitación guardada. Sirve tanto para
             * los cinco de fábrica como para los que guardas tú: son la misma
             * forma de dato, una foto del mástil.
             *
             * El nombre de la afinación se DEDUCE en vez de escribirse a mano.
             * Antes ponía «Estándar (E A D G B e)» literal, lo que funcionaba
             * de milagro porque los cinco presets eran de guitarra: con uno de
             * ukelele o de bajo mostraba un nombre falso. */
            const loadPreset = (preset) => {
                /* Instrumento y afinación van en el mismo render, y el efecto de
                 * `[instrument]` corre después y pisaría la afinación con la de
                 * fábrica: un D5 guardado en Drop D se abría en afinación
                 * estándar y se nombraba E7sus4. */
                restaurando.current = true;
                setChordName(preset.name.split(" ")[0]);
                setInstrument(preset.instrument);
                setNumFrets(preset.numFrets);
                setStartingFret(preset.startingFret);
                setDots(preset.dots.map(d => ({ ...d })));
                setStringStates(preset.stringStates.slice());
                setBarres((preset.barres ?? []).map(b => ({ ...b })));
                setTuning(preset.tuning.slice());
                setTuningMidi(preset.tuningMidi ?? null);

                const presetsAfinacion = TUNING_PRESETS[preset.instrument] || [];
                const coincide = presetsAfinacion.find(t =>
                    t.notes.length === preset.tuning.length &&
                    t.notes.every((nota, i) => nota === preset.tuning[i])
                );
                setSelectedTuningName(coincide ? coincide.name : "Personalizada");

                setAutoUpdateTitle(true);
                setAppMode("chord");
                setAppView("studio");
                showToast("Acorde " + preset.name + " cargado");
            };

            const clearAll = () => {
                setDotsActivos([]);
                setStringStatesActivos(Array(numStrings).fill("none"));
                // Las cejillas son del acorde. Sin esta guarda, «Vaciar» en
                // Libre borraba las del mástil de Acordes: el mismo agujero que
                // el arrastre, por el otro lado.
                if (appMode === "chord") setBarres([]);
                showToast("Mástil limpiado completamente");
            };

            // --- TEORÍA DE ESCALAS E INTERVALOS ---
            const getActiveScaleIntervals = () => {
                if (scaleType === "custom") {
                    return customScaleIntervals;
                }
                const preset = SCALE_PRESETS.find(p => p.id === scaleType);
                if (!preset) return Array(12).fill(false);
                
                const intervals = Array(12).fill(false);
                preset.intervals.forEach(semitone => {
                    intervals[semitone] = true;
                });
                return intervals;
            };

            const isNoteInScale = (pitch) => {
                const relativeSemi = (pitch - scaleRoot + 12) % 12;
                const activeIntervals = getActiveScaleIntervals();
                return activeIntervals[relativeSemi];
            };

            const generateScaleRenderDots = () => {
                if (appMode !== "scale") return [];
                const scaleDots = [];

                for (let s = 0; s < numStrings; s++) {
                    const baseSemi = parseNoteToSemi(tuning[s]);
                    
                    for (let f = 1; f <= numFrets; f++) {
                        const absFret = startingFret + f - 1;
                        const notePitch = (baseSemi + absFret) % 12;
                        
                        if (isNoteInScale(notePitch)) {
                            const relativeSemi = (notePitch - scaleRoot + 12) % 12;
                            const isRoot = relativeSemi === 0;
                            const label = scaleDisplayMode === "note" 
                                ? NOTE_NAMES[notePitch] 
                                : INTERVAL_DEGREES[relativeSemi];

                            scaleDots.push({
                                s: s,
                                f: f,
                                isRoot: isRoot,
                                label: label,
                                degreeStr: INTERVAL_DEGREES[relativeSemi]
                            });
                        }
                    }
                }
                return scaleDots;
            };

            /* --- LAS CUERDAS AL AIRE SÓLO EXISTEN SI SE VE EL TRASTE 1 -------
             *
             * Una cuerda al aire es el traste 0, y el traste 0 está justo antes
             * del 1. Si la ventana empieza en el 4, ese traste NO está en el
             * dibujo: la línea de arriba ya no es la cejuela, es la frontera con
             * el traste 3.
             *
             * Se dibujaban igual, encima de esa línea, y decían «al aire» de
             * unas notas que en esa ventana no se tocan. Con la ventana en el 1
             * son ciertas y se dibujan; a partir del 2, no.
             *
             * Vale para escalas y arpegios, donde una cuerda al aire es literal.
             * En modo Acorde la regla es otra —ahí el aire es la cejuela de la
             * digitación y sube con la ventana (§21)— y este archivo no la toca.
             * --------------------------------------------------------------- */
            const seVeElTrasteCero = () => startingFret === 1;

            const generateScaleOpenNotes = () => {
                if (appMode !== "scale" || !seVeElTrasteCero()) return [];
                const openNotes = [];
                for (let s = 0; s < numStrings; s++) {
                    const baseSemi = parseNoteToSemi(tuning[s]) % 12;
                    if (isNoteInScale(baseSemi)) {
                        const relativeSemi = (baseSemi - scaleRoot + 12) % 12;
                        const isRoot = relativeSemi === 0;
                        const label = scaleDisplayMode === "note" 
                            ? NOTE_NAMES[baseSemi] 
                            : INTERVAL_DEGREES[relativeSemi];

                        openNotes.push({
                            s: s,
                            isRoot: isRoot,
                            label: label,
                            degreeStr: INTERVAL_DEGREES[relativeSemi]
                        });
                    }
                }
                return openNotes;
            };

            // --- ARPEGIOS ---
            const getActiveArpeggioIntervals = () => {
                const preset = ARPEGGIO_PRESETS.find(p => p.id === arpeggioType);
                if (!preset) return Array(12).fill(false);
                
                const intervals = Array(12).fill(false);
                preset.intervals.forEach(semitone => {
                    intervals[semitone] = true;
                });
                return intervals;
            };

            const isNoteInArpeggio = (pitch) => {
                const relativeSemi = (pitch - arpeggioRoot + 12) % 12;
                const activeIntervals = getActiveArpeggioIntervals();
                return activeIntervals[relativeSemi];
            };

            /* --- LAS TRÍADAS DE LA TONALIDAD, SOBRE LA ESCALA ---------------
             *
             * Una escala dibujada es una nube de puntos. Esto le pone encima
             * los siete acordes que salen de ella, para poder ver de dónde
             * sale cada uno y en qué se pisan: la tríada de mi menor y la de
             * do mayor comparten dos notas de tres, y eso explicado con
             * palabras no se entiende y visto sí.
             *
             * Se le pasan los puntos que YA se están dibujando, así que no hay
             * dos verdades sobre qué hay en el mástil.
             * --------------------------------------------------------------- */
            const triadasDiatonicas = () => {
                if (appMode !== "scale" || !scaleTriads) return [];

                const intervalos = getActiveScaleIntervals()
                    .map((activo, i) => activo ? i : -1)
                    .filter(i => i >= 0);

                const mapa = [];
                generateScaleOpenNotes().forEach(n => {
                    mapa.push({ s: n.s, f: 0, pitch: parseNoteToSemi(tuning[n.s]) % 12 });
                });
                generateScaleRenderDots().forEach(n => {
                    mapa.push({
                        s: n.s,
                        f: n.f,
                        pitch: (parseNoteToSemi(tuning[n.s]) + startingFret + n.f - 1) % 12
                    });
                });

                return window.KharoTheory.diatonicTriadPositions(scaleRoot, intervalos, mapa);
            };

            /* Abrir un grado como arpegio. Es el puente entre «esto es la
             * escala» y «esto se toca así».
             *
             * La ventana NO se toca a propósito: todo el sentido es que el
             * arpegio aparezca donde estaba la tríada que acabas de pulsar.
             * Y el recorrido a mano se tira, porque sus posiciones significaban
             * notas de la escala y sobre otro arpegio pueden estar vacías:
             * quedarían flechas apuntando a casillas sin nota. */
            const abrirTriadaComoArpegio = (g) => {
                const preset = window.KharoTheory.presetArpegioParaTriada(g.relativos);
                if (!preset) {
                    showToast(`${g.romano} no forma ninguna de las tríadas que dibuja el mástil`);
                    return;
                }
                setArpeggioRoot(g.raizPitch);
                setArpeggioType(preset);
                setArpGrouping("mapa");
                setPathManual(null);
                setGradoTriada(null);
                setGradoFijado(null);
                setAppMode("arpeggio");
                showToast(`${g.romano} · ${g.triada}, ahora como arpegio`);
            };

            /* Mandar una tríada a Ejercicios.
             *
             * Hay DOS cosas que se pueden querer mandar, y no son la misma:
             *
             *   TODO EL GRADO     las notas de ese grado en toda la ventana. Es
             *                     el mapa: sirve para recorrer el mástil.
             *   UNA AGRUPACIÓN    las notas de UNA de las manchas, la forma
             *                     compacta que cabe en la mano. Es la posición:
             *                     sirve para tocarla.
             *
             * Mandando siempre el grado entero salía el dibujo de la escala, que
             * no es lo que se ve cuando miras una envolvente. Por eso el menú
             * ofrece las dos, y una entrada por cada agrupación.
             *
             * Si el grado no forma ninguna de las cuatro tríadas que la app
             * dibuja, el paso se guarda como LIBRE en vez de mentir con un
             * preset que no es: un paso libre no promete fórmula ninguna.
             */
            const pasoDeTriada = (g, posiciones, sufijo) => {
                const notas = posiciones.map(p => ({
                    s: p.s,
                    f: p.f,
                    midi: p.f === 0
                        ? stringBaseMIDI(p.s)
                        : fretToMidi(stringBaseMIDI(p.s), startingFret, p.f)
                }));
                const recorrido = window.KharoTheory.buildNotePath(notas, pathCriterio, opcionesDelRecorrido());
                const preset = window.KharoTheory.presetArpegioParaTriada(g.relativos);

                return Song.createExerciseStep({
                    tipo: preset ? "arpegio" : "libre",
                    nombre: `${g.romano} · ${g.triada}${sufijo ? " " + sufijo : ""}`,
                    instrument, tuning, tuningMidi,
                    startingFret, numFrets,
                    root: preset ? g.raizPitch : null,
                    presetId: preset,
                    path: recorrido,
                    sweep: arpSweep,
                    /* El color del grado, para que la ficha se dibuje con la
                     * misma mancha que estabas mirando. `triadasVisibles` va en
                     * orden de grado, así que el índice es `grado - 1`. */
                    envolvente: { color: DEFAULT_STYLE.triadRingColors[(g.grado - 1) % DEFAULT_STYLE.triadRingColors.length] }
                });
            };

            // Cómo se llama una agrupación: por los trastes REALES que ocupa,
            // que es como se busca una posición en el mástil.
            const nombreDeZona = (zona) => {
                const abs = zona.map(p => startingFret + p.f - 1);
                const desde = Math.min(...abs);
                const hasta = Math.max(...abs);
                return desde === hasta ? `(traste ${desde})` : `(trastes ${desde}-${hasta})`;
            };

            const mandarTriadaAEjercicio = (g, posiciones, sufijo) => {
                if (!g || posiciones.length === 0) {
                    showToast("Ese grado no cae en la ventana que se está viendo");
                    return;
                }
                const paso = pasoDeTriada(g, posiciones, sufijo);
                setExercise(prev => ({ ...prev, pasos: [...prev.pasos, paso] }));
                setGradoTriada(null);
                setGradoFijado(null);
                setAppView("exercise");
                setOpenPanel(null);
                showToast(`«${paso.nombre}» añadido al ejercicio · ${paso.path.length} notas`);
            };

            /* Cada agrupación como un paso propio. Es la forma natural de
             * estudiar un acorde por todo el mástil: la misma tríada, posición
             * por posición, una detrás de otra. */
            const mandarCadaAgrupacion = (g) => {
                const zonas = zonasDeUnGrado(g.posiciones);
                if (zonas.length === 0) {
                    showToast("Ese grado no forma ninguna agrupación en esta ventana");
                    return;
                }
                const pasos = zonas.map(z => pasoDeTriada(g, z, nombreDeZona(z)));
                setExercise(prev => ({ ...prev, pasos: [...prev.pasos, ...pasos] }));
                setGradoTriada(null);
                setGradoFijado(null);
                setAppView("exercise");
                setOpenPanel(null);
                showToast(`${pasos.length} ${pasos.length === 1 ? "agrupación añadida" : "agrupaciones añadidas"} al ejercicio`);
            };

            const generateArpeggioRenderDots = () => {
                if (appMode !== "arpeggio") return [];
                const arpeggioDots = [];

                for (let s = 0; s < numStrings; s++) {
                    const baseSemi = parseNoteToSemi(tuning[s]);
                    
                    for (let f = 1; f <= numFrets; f++) {
                        const absFret = startingFret + f - 1;
                        const notePitch = (baseSemi + absFret) % 12;
                        
                        if (isNoteInArpeggio(notePitch)) {
                            const relativeSemi = (notePitch - arpeggioRoot + 12) % 12;
                            const isRoot = relativeSemi === 0;
                            const label = scaleDisplayMode === "note" 
                                ? NOTE_NAMES[notePitch] 
                                : INTERVAL_DEGREES[relativeSemi];

                            arpeggioDots.push({
                                s: s,
                                f: f,
                                isRoot: isRoot,
                                label: label,
                                degreeStr: INTERVAL_DEGREES[relativeSemi]
                            });
                        }
                    }
                }
                return arpeggioDots;
            };

            /* La forma de tríada de un juego de cuerdas, con la misma pinta que
             * los puntos del mapa para que el dibujo no tenga que distinguirlos.
             *
             * UNA NOTA POR CUERDA: es lo que la hace tocable con sweep, y es la
             * razón de que esta agrupación exista.
             *
             * El tapping añade una nota más arriba en la cuerda aguda —la octava
             * de la tónica o la novena—, que es el recurso con el que se estira
             * una tríada de tres cuerdas para que suene a algo más grande. */
            /* --- DÓNDE CAE LA NOTA DE TAPPING -------------------------------
             *
             * SIEMPRE sobre la FUNDAMENTAL de la tríada, no sobre la nota que
             * caiga en la cuerda aguda. Antes se sumaban 12 o 14 semitonos a lo
             * que hubiera ahí, y esa cuerda sólo lleva la fundamental con la
             * PRIMERA inversión: con la fundamental abajo la «octava» acababa
             * siendo la de la quinta, y con la segunda inversión la de la
             * tercera. El nombre decía una cosa y sonaba otra.
             *
             * Y se comprueba que quepa: `absFret + 12` podía dar trastes del 25
             * al 38, que no existen en ningún instrumento y nadie miraba.
             * --------------------------------------------------------------- */
            const notaDeTapping = (forma, juego, afinacionMidi, modo) => {
                if (!modo || modo === "none") return null;

                const cuerda = juego[2];                       // la más aguda del juego
                const base = afinacionMidi[cuerda];
                const clase = (arpeggioRoot + (modo === "novena" ? 2 : 0)) % 12;

                /* Por encima de lo que esa MISMA cuerda ya toca. Es donde llega
                 * la mano derecha, y es lo que mantiene la nota cerca: medido
                 * contra la forma entera, una inversión alta empujaba la T al
                 * traste 22 y abría una ventana de veintidós trastes para
                 * enseñar una nota. */
                const minimo = forma[2].absFret + 1;

                let f = (((clase - base) % 12) + 12) % 12;
                while (f < minimo) f += 12;
                if (f > MAX_FRET) return null;

                return { s: cuerda, absFret: f, clase };
            };

            /* --- LA FORMA DE TRÍADA DEL JUEGO ACTUAL -------------------------
             *
             * Un solo sitio. Antes esto estaba escrito DOS veces —quince líneas
             * calcadas, en el dibujo y en el aviso del tapping—, así que los dos
             * podían acabar diciendo cosas distintas.
             *
             * Devuelve trastes ABSOLUTOS; pasarlos a la ventana es cosa de quien
             * dibuja.
             * --------------------------------------------------------------- */
            const formaDeTriadaActual = (modoTapping) => {
                const juegos = window.KharoTheory.stringSets(numStrings);
                const juego = juegos[Math.min(arpStringSet, juegos.length - 1)];
                if (!juego) return null;

                const intervalos = getActiveArpeggioIntervals()
                    .map((activo, i) => activo ? i : -1)
                    .filter(i => i >= 0);
                if (intervalos.length < 3) return null;

                const afinacionMidi = Array.from({ length: numStrings }, (_, i) => stringBaseMIDI(i));
                const clases = intervalos.slice(0, 3).map(iv => (arpeggioRoot + iv) % 12);

                /* SE BUSCA DESDE `startingFret`, NO DESDE `startingFret - 1`.
                 * Con el menos uno la forma podía colocar una nota en el traste
                 * anterior a la ventana; como `f = absFret - startingFret + 1`,
                 * eso daba `f === 0` y el filtro de más abajo la tiraba. La
                 * forma perdía una nota EN SILENCIO y dejaba de tener una por
                 * cuerda, que es justo lo que la hace tocable de una pasada y
                 * toda la razón de que esta agrupación exista. */
                /* SE BUSCA DESDE EL TRASTE 1, no desde donde empieza la ventana.
                 *
                 * Desde la ventana, la forma se movía al mover el mástil y no
                 * había forma de encuadrarla: el remedio se perseguía a sí
                 * mismo. Desde un sitio fijo, la forma es siempre la misma —la
                 * más grave que se puede tocar— y es la ventana la que va a
                 * buscarla.
                 *
                 * Y desde 1, no desde 0: el traste 0 es la cuerda al aire, y
                 * esta capa del dibujo no la sabe pintar. Antes se pasaba
                 * `startingFret - 1`, así que la forma podía colocar una nota
                 * ahí y el filtro de más abajo la tiraba: la forma perdía una
                 * nota EN SILENCIO y dejaba de tener una por cuerda, que es
                 * justo lo que la hace tocable de una pasada. */
                const forma = window.KharoTheory.triadShapeForStringSet(
                    afinacionMidi, juego, clases, arpInversion, 1, MAX_FRET
                );
                if (!forma) return null;

                return {
                    juego,
                    afinacionMidi,
                    forma,
                    tap: notaDeTapping(forma, juego, afinacionMidi, modoTapping),
                    // Con séptimas se dibuja sólo la tríada: tres cuerdas con una
                    // nota cada una no dan para cuatro notas. Se dice, no se calla.
                    recortado: intervalos.length > 3
                };
            };

            /* Cómo se llama el acorde que sale de cada inversión: C, C/E, C/G.
             *
             * «Fundamental / 1ª / 2ª» nombra el concepto, no lo que estás
             * eligiendo. Con tres botones así hay que probarlos para saber cuál
             * es el que quieres; con el nombre del acorde resultante, no. */
            const nombreDeInversion = (inversion) => {
                const intervalos = getActiveArpeggioIntervals()
                    .map((activo, i) => activo ? i : -1)
                    .filter(i => i >= 0);
                if (intervalos.length < 3) return ["Fund.", "1ª", "2ª"][inversion];

                const triada = intervalos.slice(0, 3);
                const clases = triada.map(iv => (arpeggioRoot + iv) % 12);
                const tipo = window.KharoTheory.nameChordFromIntervals(triada);
                const nombre = NOTE_NAMES[arpeggioRoot] + (tipo === null ? "" : tipo);

                return inversion === 0 ? nombre : `${nombre}/${NOTE_NAMES[clases[inversion % 3]]}`;
            };

            // Con séptimas, la agrupación por cuerdas se queda con la tríada:
            // tres cuerdas con una nota cada una no dan para cuatro notas.
            const arpeggioRecortado = appMode === "arpeggio"
                && arpGrouping === "cuerdas"
                && getActiveArpeggioIntervals().filter(Boolean).length > 3;

            const generateTriadShapeDots = () => {
                if (appMode !== "arpeggio" || arpGrouping !== "cuerdas") return [];

                const info = formaDeTriadaActual(arpTapping);
                if (!info) return [];

                const puntos = info.forma.map(pos => {
                    const notePitch = (info.afinacionMidi[pos.s] + pos.absFret) % 12;
                    const relativeSemi = (notePitch - arpeggioRoot + 12) % 12;
                    return {
                        s: pos.s,
                        f: pos.absFret - startingFret + 1,
                        isRoot: relativeSemi === 0,
                        label: scaleDisplayMode === "note" ? NOTE_NAMES[notePitch] : INTERVAL_DEGREES[relativeSemi],
                        degreeStr: INTERVAL_DEGREES[relativeSemi]
                    };
                });

                if (info.tap) {
                    const notePitch = (info.afinacionMidi[info.tap.s] + info.tap.absFret) % 12;
                    const relativeSemi = (notePitch - arpeggioRoot + 12) % 12;
                    puntos.push({
                        s: info.tap.s,
                        f: info.tap.absFret - startingFret + 1,
                        isRoot: relativeSemi === 0,
                        /* La etiqueta dice QUÉ NOTA ES, como todas las demás.
                         * Antes ponía «T» y punto, así que en modo Notas
                         * escondía justo la información que se había pedido.
                         * Que es de tapping se ve por el aro a trazos. */
                        label: scaleDisplayMode === "note" ? NOTE_NAMES[notePitch] : INTERVAL_DEGREES[relativeSemi],
                        degreeStr: INTERVAL_DEGREES[relativeSemi],
                        tap: true
                    });
                }

                // Sólo lo que cae dentro de la ventana dibujada.
                return puntos.filter(p => p.f >= 1 && p.f <= numFrets);
            };

            const cambiarTapping = (modo) => {
                if (modo === "none") { setArpTapping("none"); return; }

                // No se enciende lo que no se puede ver: si la nota se sale del
                // mástil, se dice, en vez de activar algo que no aparece.
                const info = formaDeTriadaActual(modo);
                if (!info || !info.tap) {
                    showToast("Con esta forma la nota de tapping se saldría del mástil");
                    return;
                }
                setArpTapping(modo);
            };

            /* --- LA VENTANA ENMARCA LA FORMA --------------------------------
             *
             * Antes la forma se buscaba a partir del traste donde EMPIEZA la
             * ventana. Dos consecuencias, las dos malas:
             *
             *   · Con la ventana en el 1, la tríada de Do cae en el 5-8 y se
             *     dibujaba UNA de las tres notas. En una agrupación cuya única
             *     promesa es «una nota por cuerda», eso parece roto.
             *   · No se podía mover la ventana para arreglarlo, porque al
             *     moverla se movía también la forma: el remedio se perseguía a
             *     sí mismo.
             *
             * Ahora la forma se busca siempre desde el traste 1 —la más grave
             * que se puede tocar sin cuerdas al aire, que es la que se
             * estudia— y es la ventana la que va a buscarla. Cambiar de juego,
             * de inversión o de tapping coloca el mástil solo.
             *
             * Como la forma ya no depende de la ventana, este efecto puede
             * escribir las dos medidas sin perseguirse. Y `startingFret` y
             * `numFrets` quedan fuera de las dependencias a propósito: son lo
             * que escribe, y además así, si luego mueves la ventana a mano, no
             * te la vuelve a colocar.
             * --------------------------------------------------------------- */
            useEffect(() => {
                if (appMode !== "arpeggio" || arpGrouping !== "cuerdas") return;

                const info = formaDeTriadaActual(arpTapping);
                if (!info) return;

                const trastes = info.forma.map(p => p.absFret);
                if (info.tap) trastes.push(info.tap.absFret);

                // Un traste de aire por arriba, y el que sobre por abajo: una
                // forma pegada al borde del dibujo se lee peor.
                const desde = clampStartingFret(Math.max(1, Math.min(...trastes) - 1));
                setStartingFret(desde);
                setNumFrets(clampNumFrets(Math.max(...trastes) - desde + 2));
            }, [appMode, arpGrouping, arpStringSet, arpInversion, arpeggioRoot, arpeggioType, arpTapping, numStrings, tuning]);

            /* Si al cambiar algo la nota de tapping deja de caber en el mástil,
             * se apaga y se dice. Antes desaparecía sin más: el botón se quedaba
             * encendido y no había nada dibujado. */
            useEffect(() => {
                if (arpTapping === "none" || appMode !== "arpeggio" || arpGrouping !== "cuerdas") return;
                const info = formaDeTriadaActual(arpTapping);
                if (info && !info.tap) {
                    setArpTapping("none");
                    showToast("Con esta forma la nota de tapping no cabe: tapping apagado");
                }
            }, [arpTapping, arpStringSet, arpInversion, arpeggioRoot, arpeggioType, numStrings, tuning, appMode, arpGrouping]);

            // Los puntos del arpegio según la agrupación elegida.
            const arpeggioDotsVisibles = () => {
                if (arpGrouping === "cuerdas") return generateTriadShapeDots();
                return generateArpeggioRenderDots();
            };

            const generateArpeggioOpenNotes = () => {
                if (appMode !== "arpeggio") return [];
                // Agrupado por cuerdas se dibuja UNA forma concreta, y las
                // cuerdas al aire del mapa completo no son parte de ella: si se
                // quedaran, la forma dejaría de tener una nota por cuerda, que
                // es justo lo que la hace tocable de una pasada.
                if (arpGrouping === "cuerdas") return [];
                if (!seVeElTrasteCero()) return [];
                const openNotes = [];
                for (let s = 0; s < numStrings; s++) {
                    const baseSemi = parseNoteToSemi(tuning[s]) % 12;
                    if (isNoteInArpeggio(baseSemi)) {
                        const relativeSemi = (baseSemi - arpeggioRoot + 12) % 12;
                        const isRoot = relativeSemi === 0;
                        const label = scaleDisplayMode === "note" 
                            ? NOTE_NAMES[baseSemi] 
                            : INTERVAL_DEGREES[relativeSemi];

                        openNotes.push({
                            s: s,
                            isRoot: isRoot,
                            label: label,
                            degreeStr: INTERVAL_DEGREES[relativeSemi]
                        });
                    }
                }
                return openNotes;
            };

            /* --- EL RECORRIDO DE LAS NOTAS --------------------------------
             *
             * En qué orden se tocan las notas del mapa. Es lo que convierte una
             * escala dibujada —que es una nube de puntos— en algo que se puede
             * practicar.
             *
             * Manda sobre el DIBUJO (las flechas) y sobre el SONIDO a la vez.
             * Antes la reproducción ordenaba por altura y descartaba las notas
             * repetidas, así que sonaba una cosa distinta de la que se veía.
             * ---------------------------------------------------------------- */

            // Las notas del mapa actual, con su altura, listas para ordenar.
            const notasDelMapa = () => {
                if (appMode === "chord") return [];

                /* En Libre el mapa son las notas que has puesto tú. Al
                 * devolverlas por aquí, TODO lo del recorrido —las flechas, el
                 * arrastre, el sweep, la reproducción en orden y «crear
                 * ejercicio»— funciona sin tocar una línea más: ya estaba
                 * escrito contra este resultado, no contra una escala. */
                if (appMode === "free") {
                    const notas = [];
                    stringStatesLibre.forEach((estado, s) => {
                        if (estado === "open") notas.push({ s, f: 0, midi: stringBaseMIDI(s) });
                    });
                    dotsLibre.forEach(d => {
                        notas.push({ s: d.s, f: d.f, midi: fretToMidi(stringBaseMIDI(d.s), startingFret, d.f) });
                    });
                    return notas;
                }

                const abiertas = appMode === "scale" ? generateScaleOpenNotes() : generateArpeggioOpenNotes();
                const pisadas = appMode === "scale" ? generateScaleRenderDots() : arpeggioDotsVisibles();

                const notas = abiertas.map(n => ({ s: n.s, f: 0, midi: stringBaseMIDI(n.s) }));
                pisadas.forEach(n => {
                    // `tap` viaja con la nota, no como un ajuste del paso: así
                    // sobrevive a que edites el recorrido a mano, que un campo
                    // de nivel superior no haría.
                    notas.push({ s: n.s, f: n.f, midi: fretToMidi(stringBaseMIDI(n.s), startingFret, n.f), tap: !!n.tap });
                });
                return notas;
            };

            /* Cómo se calcula el recorrido automático. El tope y la vuelta sólo
             * mandan sobre el automático: si el recorrido lo has escrito tú, es
             * literal y no se poda. */
            const opcionesDelRecorrido = () => ({
                notasPorCuerda: pathNotasPorCuerda,
                retorno: pathRetorno
            });

            // El recorrido a mano gana sobre el automático. `null` = automático.
            const recorridoActual = () => {
                if (pathManual) return pathManual;
                return window.KharoTheory.buildNotePath(notasDelMapa(), pathCriterio, opcionesDelRecorrido());
            };

            /* Tocar una nota mientras se edita el recorrido: si ya estaba, sale;
             * si no, entra al final. Con eso se escriben los patrones que el
             * automático no adivina — tres notas por cuerda, secuencias de
             * cuatro, saltos.
             *
             * Al primer retoque el recorrido se congela: a partir de ahí es
             * tuyo, y cambiar la escala ya no lo rehace por debajo. */
            const alternarEnRecorrido = (s, f) => {
                const base = pathManual || window.KharoTheory.buildNotePath(notasDelMapa(), pathCriterio, opcionesDelRecorrido());
                const i = base.findIndex(p => p.s === s && p.f === f);
                setPathManual(i > -1
                    ? base.filter((_, j) => j !== i)
                    : [...base, { s, f }]);
            };

            /* Tocar una nota del mapa. Siempre suena —esa es la forma de
             * comprobar qué es cada punto— y además, si se está editando el
             * recorrido, entra o sale de él. */
            const tocarNotaDelMapa = (s, f) => {
                /* En Libre AÑADE, no alterna. Con el toggle, volver a tocar una
                 * nota que ya está la sacaría del recorrido, y entonces una nota
                 * pedal —tocar la misma dos veces— sería imposible de escribir.
                 * Para quitar está el menú de la flecha, y el de la nota. */
                if (appMode === "free" && showPath && editandoPath) { anadirAlRecorrido(s, f); return; }

                playSingleNoteAudio(s, f);
                if (showPath && editandoPath) alternarEnRecorrido(s, f);
            };

            /* --- AÑADIR AL RECORRIDO, SIN ALTERNAR ---------------------------
             *
             * `alternarEnRecorrido` es un toggle, y con un toggle una nota pedal
             * o una vuelta atrás —repetir una posición— son imposibles de
             * escribir. En Libre siempre se añade; para quitar están los menús
             * de clic derecho.
             * --------------------------------------------------------------- */
            const anadirAlRecorrido = (s, f) => {
                playSingleNoteAudio(s, f);
                const base = pathManual || window.KharoTheory.buildNotePath(
                    notasDelMapa(), pathCriterio, opcionesDelRecorrido()
                );
                setPathManual([...base, { s, f }]);
            };

            /* Abre el menú de una nota. Se le pasa ya masticado lo que el menú
             * necesita saber —cómo se llama y si está en el recorrido— para que
             * el menú no tenga que calcular nada. */
            const abrirMenuNota = (e, s, f) => {
                e.preventDefault();
                e.stopPropagation();
                const midi = f === 0
                    ? stringBaseMIDI(s)
                    : fretToMidi(stringBaseMIDI(s), startingFret, f);
                setMenuNota({
                    s, f,
                    x: e.clientX,
                    y: e.clientY,
                    nombre: NOTE_NAMES[((midi % 12) + 12) % 12] + (f === 0 ? " (al aire)" : ` · traste ${startingFret + f - 1}`),
                    enRecorrido: (recorridoActual() || []).some(p => p.s === s && p.f === f)
                });
            };

            /* Quitar una nota del mástil en Libre: se va del dibujo y de todas
             * las veces que apareciera en el recorrido. Dejarla en el recorrido
             * sin dibujarla sería una flecha apuntando al vacío. */
            const quitarNotaLibre = (s, f) => {
                setDotsLibre(prev => prev.filter(d => !(d.s === s && d.f === f)));
                setPathManual(prev => prev ? prev.filter(p => !(p.s === s && p.f === f)) : prev);
            };

            /* Entrar en Libre enciende las flechas y el modo «a mano»: sin
             * recorrido dibujado, ir poniendo notas no deja ver lo que se está
             * montando, que es justo lo que esta sección hace. */
            const prepararModoLibre = () => {
                setShowPath(true);
                setEditandoPath(true);
                if (!pathManual) setPathManual([]);
            };

            /* --- TRAZAR UNA FLECHA ARRASTRANDO ------------------------------
             *
             * Tocar las notas una a una escribe un recorrido, pero no deja
             * decir «de ESTA a ESTA»: hay que acertar el orden de los toques.
             * Arrastrando se dice directamente.
             *
             * El recorrido es una LISTA, no un grafo, así que «conectar A con
             * B» sólo puede querer decir «que B vaya justo detrás de A».
             * --------------------------------------------------------------- */
            const conectarEnRecorrido = (a, b) => {
                if (a.s === b.s && a.f === b.f) return;

                const base = (pathManual || window.KharoTheory.buildNotePath(
                    notasDelMapa(), pathCriterio, opcionesDelRecorrido()
                )).slice();

                const ia = base.findIndex(p => p.s === a.s && p.f === a.f);
                const ib = base.findIndex(p => p.s === b.s && p.f === b.f);

                if (ia === -1 && ib === -1) {
                    base.push({ s: a.s, f: a.f }, { s: b.s, f: b.f });
                } else if (ia !== -1 && ib === -1) {
                    base.splice(ia + 1, 0, { s: b.s, f: b.f });
                } else if (ia === -1 && ib !== -1) {
                    base.splice(ib, 0, { s: a.s, f: a.f });
                } else if (ib === ia + 1) {
                    showToast("Esas dos ya van seguidas");
                    return;
                } else {
                    // Las dos están, pero separadas: se MUEVE la de destino
                    // detrás de la de origen. Es un solo splice, conserva el
                    // resto del orden y se deshace arrastrando otra vez.
                    const [movida] = base.splice(ib, 1);
                    base.splice(ib < ia ? ia : ia + 1, 0, movida);
                }

                setPathManual(base);
                if (!editandoPath) setEditandoPath(true);
            };

            /* De un evento de puntero a coordenadas del dibujo.
             *
             * `offsetX` no sirve: `.k-fretboard-fit` escala el SVG para que
             * quepa, así que los píxeles de pantalla y los del lienzo no son
             * los mismos. Es la misma cuenta que ya hacía `handleTouchMove`. */
            const puntoDelLienzo = (e) => {
                const caja = svgRef.current ? svgRef.current.getBoundingClientRect() : null;
                if (!caja || caja.width === 0) return { x: 0, y: 0 };
                return {
                    x: (e.clientX - caja.left) * (width / caja.width),
                    y: (e.clientY - caja.top) * (height / caja.height)
                };
            };

            // Qué nota del mapa cae bajo un punto del lienzo. Se resuelve por
            // geometría y no por `e.target` porque, con el puntero capturado,
            // el evento siempre lo recibe la nota de origen.
            const notaMasCercana = (punto) => {
                let mejor = null;
                let mejorDistancia = Infinity;
                notasDelMapa().forEach(n => {
                    const c = posicionEnLienzo(n);
                    if (c.y === null) return;
                    const d = Math.hypot(c.x - punto.x, c.y - punto.y);
                    if (d < mejorDistancia) { mejorDistancia = d; mejor = n; }
                });
                return mejorDistancia <= dotRadiusStyle + 6 ? mejor : null;
            };

            /* Lo que se cuelga de cada nota del mapa. Estaba repetido cuatro
             * veces (escala y arpegio, al aire y pisada) con un solo `onClick`;
             * declarado una vez, los cuatro sitios no se pueden desincronizar. */
            const propsNotaDelMapa = (s, f) => ({
                style: { cursor: showPath && editandoPath ? "crosshair" : "pointer" },
                onClick: () => {
                    // El arrastre ya ha hecho su trabajo; este clic es su cola.
                    if (arrastroRef.current) { arrastroRef.current = false; return; }
                    tocarNotaDelMapa(s, f);
                },
                onPointerDown: (e) => {
                    if (!showPath || !editandoPath) return;
                    arrastroRef.current = false;
                    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) { /* sin captura, el arrastre sigue valiendo */ }
                    setArrastreFlecha({ desde: { s, f }, hasta: posicionEnLienzo({ s, f }) });
                },
                onPointerMove: (e) => {
                    if (!arrastreFlecha) return;
                    const punto = puntoDelLienzo(e);
                    const origen = posicionEnLienzo(arrastreFlecha.desde);
                    // Un temblor de la mano no es un arrastre.
                    if (Math.hypot(punto.x - origen.x, punto.y - origen.y) > 6) arrastroRef.current = true;
                    setArrastreFlecha(prev => prev ? { desde: prev.desde, hasta: punto } : null);
                },
                onPointerUp: (e) => {
                    if (!arrastreFlecha) return;
                    const destino = notaMasCercana(puntoDelLienzo(e));
                    if (arrastroRef.current && destino) conectarEnRecorrido(arrastreFlecha.desde, destino);
                    setArrastreFlecha(null);
                },
                onPointerCancel: () => { arrastroRef.current = false; setArrastreFlecha(null); }
            });

            /* --- LO QUE SE PUEDE HACER CON UNA FLECHA YA TRAZADA -------------
             * El segmento `i` va de `path[i]` a `path[i+1]`. Sobre una lista,
             * «borrar esta flecha» admite dos lecturas útiles y las dos se
             * ofrecen, en vez de elegir por el usuario. */
            const recorridoParaEditar = () => (
                pathManual || window.KharoTheory.buildNotePath(notasDelMapa(), pathCriterio, opcionesDelRecorrido())
            );

            const quitarDestinoDeFlecha = (i) => {
                const base = recorridoParaEditar();
                setPathManual(base.filter((_, j) => j !== i + 1));
                setMenuFlecha(null);
            };

            const cortarRecorridoEn = (i) => {
                setPathManual(recorridoParaEditar().slice(0, i + 1));
                setMenuFlecha(null);
            };

            const invertirSaltoEn = (i) => {
                const base = recorridoParaEditar().slice();
                const guardado = base[i];
                base[i] = base[i + 1];
                base[i + 1] = guardado;
                setPathManual(base);
                setMenuFlecha(null);
            };

            const invertirRecorrido = () => {
                setPathManual(recorridoParaEditar().slice().reverse());
                setMenuFlecha(null);
            };

            /* --- EL ATAJO: del mástil a un ejercicio ----------------------
             * Hace una foto de la digitación con su recorrido y la mete como un
             * paso más. Es aquí donde se monta la digitación, así que obligar a
             * rehacerla en el otro apartado sería pedirla dos veces.
             * -------------------------------------------------------------- */
            const crearPasoDeEjercicio = () => {
                const recorrido = recorridoActual();
                if (recorrido.length === 0) {
                    showToast("No hay notas que practicar en esta ventana");
                    return;
                }

                const preset = appMode === "arpeggio"
                    ? ARPEGGIO_PRESETS.find(x => x.id === arpeggioType)
                    : SCALE_PRESETS.find(x => x.id === scaleType);
                const raiz = appMode === "arpeggio" ? arpeggioRoot : scaleRoot;

                /* Un paso LIBRE no guarda ni tónica ni preset: las notas las has
                 * elegido tú y no salen de ninguna fórmula. Guardar un `root`
                 * cualquiera haría que la ficha coloreara como tónica una nota
                 * que nadie ha señalado. */
                const esLibre = appMode === "free";
                const paso = Song.createExerciseStep({
                    tipo: esLibre ? "libre" : (appMode === "scale" ? "escala" : "arpegio"),
                    nombre: esLibre
                        ? `Libre · ${recorrido.length} notas`
                        : NOTE_NAMES[raiz] + " " + (preset ? preset.name : ""),
                    instrument, tuning, tuningMidi,
                    startingFret, numFrets,
                    root: esLibre ? null : raiz,
                    presetId: esLibre ? null : (appMode === "scale" ? scaleType : arpeggioType),
                    path: recorrido,
                    // El sweep ya no es sólo de arpegios: una escala tocada con
                    // economy picking cruza cuerdas con la misma pasada de púa.
                    sweep: arpSweep
                });

                setExercise(prev => ({ ...prev, pasos: [...prev.pasos, paso] }));
                setAppView("exercise");
                setOpenPanel(null);
                showToast(`«${paso.nombre}» añadido al ejercicio`);
            };

            /* El camino de vuelta: abrir un paso en el mástil para retocarlo.
             * Un ejercicio que no se puede corregir obliga a rehacerlo entero. */
            const cargarPasoEnMastil = (paso) => {
                /* Por lo mismo que `loadPreset`, y por una razón más: el efecto
                 * de `[appMode]` limpia el recorrido al cambiar de modo, y aquí
                 * el recorrido es justo lo que se está restaurando. */
                restaurando.current = true;
                setInstrument(paso.instrument);
                setTuning(paso.tuning.slice());
                setTuningMidi(paso.tuningMidi);
                setStartingFret(clampStartingFret(paso.startingFret));
                setNumFrets(clampNumFrets(paso.numFrets));
                /* Un paso libre no dice qué escala ni qué arpegio dibujar,
                 * porque no salió de ninguno: se abre en modo libre y lo que se
                 * ve es exactamente su recorrido. */
                if (paso.tipo === "libre") {
                    /* Libre dejo de ser un interruptor y paso a ser una pestana:
                     * el estado que lo dice es `appMode`. `setModoLibre` murio
                     * con la mudanza y se llevo por delante todo el camino de
                     * vuelta desde Ejercicios. */
                    setAppMode("free");
                    setEditandoPath(true);

                    /* Un paso libre no sale de ninguna formula: sus notas SON su
                     * recorrido, y el mastil hay que reconstruirlo desde `path`.
                     * Sin esto el paso se abria vacio, con las flechas apuntando
                     * a notas que no se dibujan en ningun sitio.
                     *
                     * Las dos mitades van a sitios distintos, que es como
                     * `notasDelMapa` lee Libre: el traste 0 es una cuerda al aire
                     * y vive en `stringStatesLibre`; lo pisado vive en `dotsLibre`.
                     * Y una posicion repetida en el recorrido -una nota pedal- es
                     * un solo punto en el mastil. */
                    const cuerdas = getInstrument(paso.instrument).strings;
                    const pisadas = [];
                    paso.path.forEach(p => {
                        if (p.f === 0) return;
                        if (pisadas.some(n => n.s === p.s && n.f === p.f)) return;
                        pisadas.push({ s: p.s, f: p.f, finger: "" });
                    });
                    setDotsLibre(pisadas);
                    setStringStatesLibre(Array.from({ length: cuerdas }, (_, s) =>
                        paso.path.some(p => p.f === 0 && p.s === s) ? "open" : "none"
                    ));
                } else {
                    setAppMode(paso.tipo === "escala" ? "scale" : "arpeggio");
                    if (paso.tipo === "escala") { setScaleRoot(paso.root); setScaleType(paso.presetId); }
                    else { setArpeggioRoot(paso.root); setArpeggioType(paso.presetId); }
                }
                setPathManual(paso.path.map(pos => ({ ...pos })));
                setShowPath(true);
                setAppView("studio");
                showToast(`«${paso.nombre}» abierto en el mástil`);
            };

            const reiniciarRecorrido = () => {
                setPathManual(null);
                showToast("Recorrido automático restablecido");
            };

            // --- REPRODUCCIÓN SECUENCIAL DE AUDIO EN CADENA (PLAYBACK ENGINE) ---
            const triggerStrumOrSequence = () => {
                if (isPlayingSequence) return;
                synthInstance.init();

                let notesToPlay = [];

                if (appMode === "chord") {
                    for (let s = 0; s < numStrings; s++) {
                        const state = stringStates[s];
                        if (state === "muted") continue;

                        const baseMidi = stringBaseMIDI(s);
                        
                        const dot = dots.find(d => d.s === s);
                        if (dot) {
                            notesToPlay.push({ s, f: dot.f, midi: fretToMidi(baseMidi, startingFret, dot.f) });
                            continue;
                        }

                        const barre = barres.find(b => s >= b.fromString && s <= b.toString);
                        if (barre) {
                            notesToPlay.push({ s, f: barre.fret, midi: fretToMidi(baseMidi, startingFret, barre.fret) });
                            continue;
                        }

                        if (state === "open") {
                            // Sólo suena si está marcada al aire. Antes también
                            // sonaban las `none` —las que el usuario aún no ha
                            // decidido—, y entonces el acorde no sonaba como se
                            // llamaba: el análisis las ignoraba y el rasgueo no.
                            // La regla vive ahora en chordVoicingToMidi.
                            //
                            // Al aire = cejuela de la digitación, y la digitación
                            // se desplaza entera con la ventana.
                            notesToPlay.push({ s, f: 0, midi: fretToMidi(baseMidi, startingFret, 0) });
                        }
                    }
                } else {
                    /* Escalas y arpegios suenan EN EL ORDEN DEL RECORRIDO, el
                     * mismo que dibujan las flechas. Antes se ordenaba por
                     * altura y se descartaban las alturas repetidas, así que la
                     * misma nota en dos cuerdas sonaba una sola vez y el oído
                     * no seguía al dibujo. Lo que ves es lo que suena. */
                    notesToPlay = recorridoActual().map(p => ({
                        s: p.s,
                        f: p.f,
                        // Aquí una cuerda al aire es literalmente la cuerda al
                        // aire: el diagrama es un MAPA del mástil, no una forma
                        // que se desplace con la ventana.
                        midi: p.f === 0
                            ? stringBaseMIDI(p.s)
                            : fretToMidi(stringBaseMIDI(p.s), startingFret, p.f)
                    }));
                }

                if (notesToPlay.length === 0) {
                    showToast("No hay notas activas para reproducir");
                    return;
                }

                setIsPlayingSequence(true);

                /* Un acorde se rasguea —las cuerdas casi a la vez— y una escala
                 * se recorre a tempo. Son dos gestos distintos y por eso el
                 * paso entre notas no es el mismo. */
                const paso = appMode === "chord" ? separacionRasgueo : segundosPorCorchea;

                notesToPlay.forEach((item, index) => {
                    const delay = index * paso;
                    synthInstance.playNote(item.midi, 1.1, delay);

                    setTimeout(() => {
                        setNotePulse({ s: item.s, f: item.f });
                    }, delay * 1000);
                });

                setTimeout(() => {
                    setIsPlayingSequence(false);
                    setNotePulse(null);
                }, notesToPlay.length * paso * 1000 + 400);
            };

            /* --- LEYENDA DINÁMICA DE INTERVALOS ---------------------------
             * Los datos se calculan aparte porque hay dos presentaciones: la
             * columna lateral de escritorio y la tira de fichas de móvil, donde
             * una columna no cabe sin comerse el mástil.
             * -------------------------------------------------------------- */
            const DEGREE_NAMES = [
                "Tónica / Raíz", "Segunda menor", "Segunda mayor", "Tercera menor", "Tercera mayor",
                "Cuarta justa", "Quinta disminuida", "Quinta justa", "Sexta menor", "Sexta mayor",
                "Séptima menor", "Séptima mayor"
            ];

            const getLegendItems = () => {
                // Ni Acordes ni Libre tienen fórmula: sin tónica declarada no hay
                // grados que listar, y una leyenda de intervalos ahí es una
                // lectura inventada.
                if (appMode === "chord" || appMode === "free") return [];

                const rootPitch = appMode === "scale" ? scaleRoot : arpeggioRoot;
                const activeIntervals = appMode === "scale" ? getActiveScaleIntervals() : getActiveArpeggioIntervals();

                const items = [];
                activeIntervals.forEach((isActive, semitoneOffset) => {
                    if (isActive) {
                        const degreeStr = INTERVAL_DEGREES[semitoneOffset];
                        items.push({
                            degreeStr,
                            degreeName: DEGREE_NAMES[semitoneOffset],
                            noteName: NOTE_NAMES[(rootPitch + semitoneOffset) % 12],
                            color: getIntervalColor(degreeStr)
                        });
                    }
                });
                return items;
            };

            // Tira horizontal para móvil: el mismo dato en una fila que se
            // desliza, en vez de una columna que roba alto al diagrama.
            const renderLegendStrip = () => {
                if (appMode === "chord" || appMode === "free" || !showLegend) return null;
                return (
                    <div class="k-strip xl:hidden w-full shrink-0 flex gap-1.5 pb-1">
                        {getLegendItems().map((item, idx) => (
                            <span key={idx} class="k-chip shrink-0" title={item.degreeName}>
                                <span
                                    class="w-4 h-4 rounded-full flex items-center justify-center text-[9px] font-black text-white shrink-0"
                                    style={{ backgroundColor: item.color }}
                                >
                                    {item.degreeStr}
                                </span>
                                {item.noteName}
                            </span>
                        ))}
                    </div>
                );
            };

            const renderIntervalLegend = () => {
                if (appMode === "chord" || appMode === "free" || !showLegend) return null;
                const items = getLegendItems();

                return (
