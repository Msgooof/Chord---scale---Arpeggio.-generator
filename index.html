                                                if ((chordDisplayMode === "note" || chordDisplayMode === "degree") && state === "open") {
                                                    // La cuerda al aire se desplaza con la forma, así que
                                                    // su nombre tiene que decir lo mismo que suena.
                                                    const baseSemi = (parseNoteToSemi(tuning[idx]) + toAbsoluteFret(startingFret, 0)) % 12;
                                                    let label = "";
                                                    const relativeSemi = (baseSemi - detectedRootSemi + 12) % 12;
                                                    const degreeStr = INTERVAL_DEGREES[relativeSemi];

                                                    if (chordDisplayMode === "note") {
                                                        label = NOTE_NAMES[baseSemi];
                                                    } else {
                                                        label = degreeStr;
                                                    }
                                                    
                                                    const dotColor = getIntervalColor(degreeStr);

                                                    return (
                                                        <g key={idx} style={{ cursor: 'pointer' }} onClick={() => { playSingleNoteAudio(idx, 0); toggleStringState(idx); }}>
                                                            <circle cx={x} cy={y} r={dotRadiusStyle - 1} fill={dotColor} />
                                                            <text
                                                                x={x}
                                                                y={y + 3.5}
                                                                textAnchor="middle"
                                                                fill={style.dotTextColor}
                                                                fontSize="9"
                                                                fontWeight="black"
                                                            >
                                                                {label}
                                                            </text>
                                                        </g>
                                                    );
                                                }

                                                return (
                                                    <g key={idx} style={{ cursor: 'pointer' }} onClick={() => toggleStringState(idx)}>
                                                        {state === "open" && (
                                                            <circle
                                                                cx={x}
                                                                cy={y}
                                                                r="6"
                                                                fill="none"
                                                                stroke={textStyleColor}
                                                                strokeWidth={lineWidthStyle}
                                                            />
                                                        )}
                                                        {state === "muted" && (
                                                            <g>
                                                                <line x1={x - 5} y1={y - 5} x2={x + 5} y2={y + 5} stroke={textStyleColor} strokeWidth={lineWidthStyle} />
                                                                <line x1={x + 5} y1={y - 5} x2={x - 5} y2={y + 5} stroke={textStyleColor} strokeWidth={lineWidthStyle} />
                                                            </g>
                                                        )}
                                                        <rect x={x - 12} y={y - 12} width="24" height="24" fill="transparent" />
                                                    </g>
                                                );
                                            })
                                        )}

                                        {/* Nut line */}
                                        {startingFret === 1 ? (
                                            <rect
                                                x={paddingLeft - lineWidthStyle / 2}
                                                y={paddingTop - 4}
                                                width={gridWidth + lineWidthStyle}
                                                height="6"
                                                fill={textStyleColor}
                                            />
                                        ) : (
                                            <line
                                                x1={paddingLeft}
                                                y1={paddingTop}
                                                x2={width - paddingRight}
                                                y2={paddingTop}
                                                stroke={gridStyleColor}
                                                strokeWidth={lineWidthStyle}
                                            />
                                        )}

                                        {/* DIBUJO DE INLAYS (Puntos guía de la guitarra) */}
                                        {Array.from({ length: numFrets }).map((_, idx) => {
                                            const absFret = startingFret + idx;
                                            const y = fretYPositions[idx] + (fretYPositions[idx + 1] - fretYPositions[idx]) / 2;
                                            const xCenter = paddingLeft + gridWidth / 2;
                                            
                                            if ([3, 5, 7, 9, 15, 17, 19, 21].includes(absFret)) {
                                                return (
                                                    <circle
                                                        key={`inlay-${absFret}`}
                                                        cx={xCenter}
                                                        cy={y}
                                                        r="4"
                                                        fill={gridStyleColor}
                                                        opacity="0.18"
                                                    />
                                                );
                                            } else if ([12, 24].includes(absFret)) {
                                                return (
                                                    <g key={`inlay-${absFret}`}>
                                                        <circle
                                                            cx={xCenter - 14}
                                                            cy={y}
                                                            r="3"
                                                            fill={gridStyleColor}
                                                            opacity="0.18"
                                                        />
                                                        <circle
                                                            cx={xCenter + 14}
                                                            cy={y}
                                                            r="3"
                                                            fill={gridStyleColor}
                                                            opacity="0.18"
                                                        />
                                                    </g>
                                                );
                                            }
                                            return null;
                                        })}

                                        {/* Horizontal Frets */}
                                        {Array.from({ length: numFrets }).map((_, idx) => {
                                            const y = fretYPositions[idx + 1];
                                            return (
                                                <line
                                                    key={idx}
                                                    x1={paddingLeft}
                                                    y1={y}
                                                    x2={width - paddingRight}
                                                    y2={y}
                                                    stroke={gridStyleColor}
                                                    strokeWidth={lineWidthStyle}
                                                />
                                            );
                                        })}

                                        {/* Vertical Strings */}
                                        {Array.from({ length: numStrings }).map((_, idx) => {
                                            const x = paddingLeft + idx * stringSpacing;
                                            return (
                                                <line
                                                    key={idx}
                                                    x1={x}
                                                    y1={paddingTop}
                                                    x2={x}
                                                    y2={fretYPositions[numFrets]}
                                                    stroke={gridStyleColor}
                                                    strokeWidth={lineWidthStyle}
                                                />
                                            );
                                        })}

                                        {/* --- LIBRE: EL MÁSTIL ENTERO ES PULSABLE ---
                                            En escalas y arpegios sólo se pueden pinchar las notas
                                            que el preset ya dibuja. Aquí no hay preset: cualquier
                                            casilla vale, y una cuerda puede llevar todas las que
                                            hagan falta.

                                            Va ANTES de las notas y las flechas, no después como la
                                            rejilla del modo Acorde: si fuera encima, taparía a las
                                            notas y no se podrían ni pulsar ni arrastrar para
                                            conectarlas. */}
                                        {appMode === "free" && (
                                            Array.from({ length: numStrings }).map((_, sIdx) => (
                                                Array.from({ length: numFrets }).map((_, fIdx) => {
                                                    const fretNum = fIdx + 1;
                                                    const x = paddingLeft + sIdx * stringSpacing - stringSpacing / 2;
                                                    const y = fretYPositions[fIdx];
                                                    const alto = fretYPositions[fIdx + 1] - fretYPositions[fIdx];
                                                    const ancho = sIdx === 0 || sIdx === numStrings - 1 ? stringSpacing / 2 + 10 : stringSpacing;
                                                    const rectX = sIdx === 0 ? paddingLeft - 10 : x;

                                                    return (
                                                        <rect
                                                            data-transient="1"
                                                            key={`libre-${sIdx}-${fretNum}`}
                                                            x={rectX}
                                                            y={y}
                                                            width={ancho}
                                                            height={alto}
                                                            fill="transparent"
                                                            style={{ cursor: 'crosshair' }}
                                                            onMouseDown={() => handleMouseDown(sIdx, fretNum)}
                                                            onMouseEnter={() => handleMouseEnter(sIdx, fretNum)}
                                                            onTouchStart={(e) => handleTouchStart(e, sIdx, fretNum)}
                                                        />
                                                    );
                                                })
                                            ))
                                        )}

                                        {/* Las envolventes de las tríadas, DEBAJO de
                                            las notas: son el fondo sobre el que se
                                            leen, no algo encima. */}
                                        {renderEnvolventesDeTriadas()}

                                        {/* --- LA ESCALA DE GUÍA (sólo en Libre) ---
                                            Apagada, sin manejadores y marcada `data-transient`:
                                            es una referencia para colocar la mano, no parte del
                                            dibujo, así que tampoco viaja en el archivo que te
                                            descargas. */}
                                        {appMode === "free" && guiaEscala && (
                                            generateScaleRenderDots().map((dot, idx) => {
                                                if (dotsLibre.some(d => d.s === dot.s && d.f === dot.f)) return null;
                                                const x = paddingLeft + dot.s * stringSpacing;
                                                const y = yDeTraste(dot.f);
                                                if (y === null) return null;
                                                return (
                                                    <circle
                                                        data-transient="1"
                                                        key={`guia-${idx}`}
                                                        cx={x}
                                                        cy={y}
                                                        r={dotRadiusStyle * 0.42}
                                                        fill={getIntervalColor(dot.degreeStr)}
                                                        opacity="0.4"
                                                        style={{ pointerEvents: 'none' }}
                                                    />
                                                );
                                            })
                                        )}

                                        {/* --- LAS NOTAS DE LIBRE ---
                                            Se dibujan con `propsNotaDelMapa`, el mismo puñado de
                                            manejadores que llevan las notas de una escala: así el
                                            clic que las mete en el recorrido, el arrastre que las
                                            conecta y el menú de la flecha valen aquí sin escribir
                                            nada nuevo.

                                            Sin fórmula no hay grados, así que no hay color por
                                            intervalo: van todas del color base y con su nombre de
                                            nota, que es el dato que queda. */}
                                        {appMode === "free" && dotsLibre.map((dot, idx) => {
                                            const x = paddingLeft + dot.s * stringSpacing;
                                            const y = yDeTraste(dot.f);
                                            if (y === null) return null;
                                            const baseSemi = parseNoteToSemi(tuning[dot.s]);
                                            const pitch = (baseSemi + startingFret + dot.f - 1) % 12;
                                            const orden = (recorridoActual() || []).findIndex(p => p.s === dot.s && p.f === dot.f);

                                            return (
                                                <g key={`libre-dot-${idx}`} {...propsNotaDelMapa(dot.s, dot.f)}
                                                   onContextMenu={(e) => abrirMenuNota(e, dot.s, dot.f)}>
                                                    <circle cx={x} cy={y} r={dotRadiusStyle} fill={baseFingerStyleColor} />
                                                    {/* Una nota puesta y todavía fuera del recorrido
                                                        se marca con un aro: si no, no hay forma de
                                                        ver cuáles has enlazado ya y cuáles no. */}
                                                    {showPath && orden === -1 && (
                                                        <circle
                                                            cx={x} cy={y} r={dotRadiusStyle + 3}
                                                            fill="none"
                                                            stroke={baseFingerStyleColor}
                                                            strokeWidth="1.4"
                                                            strokeDasharray="2 2"
                                                            opacity="0.7"
                                                        />
                                                    )}
                                                    <text
                                                        x={x}
                                                        y={y + 4.5}
                                                        textAnchor="middle"
                                                        fill={style.dotTextColor}
                                                        fontSize="10"
                                                        fontWeight="bold"
                                                    >
                                                        {NOTE_NAMES[pitch]}
                                                    </text>
                                                </g>
                                            );
                                        })}

                                        {/* SCALE RENDERED DOTS */}
                                        {appMode === "scale" && (
                                            generateScaleRenderDots().map((dot, idx) => {
                                                const x = paddingLeft + dot.s * stringSpacing;
                                                const y = yDeTraste(dot.f);
                                                if (y === null) return null;
                                                const dotColor = getIntervalColor(dot.degreeStr);

                                                return (
                                                    <g key={idx} opacity={opacidadPorTriada(dot.s, dot.f)} {...propsNotaDelMapa(dot.s, dot.f)}>
                                                        <circle
                                                            cx={x}
                                                            cy={y}
                                                            r={dotRadiusStyle}
                                                            fill={dotColor}
                                                        />
                                                        <text
                                                            x={x}
                                                            y={y + 4.5}
                                                            textAnchor="middle"
                                                            fill={style.dotTextColor}
                                                            fontSize="10"
                                                            fontWeight="bold"
                                                        >
                                                            {dot.label}
                                                        </text>
                                                    </g>
                                                );
                                            })
                                        )}

                                        {/* ARPEGGIOS RENDERED DOTS */}
                                        {appMode === "arpeggio" && (
                                            arpeggioDotsVisibles().map((dot, idx) => {
                                                const x = paddingLeft + dot.s * stringSpacing;
                                                const y = yDeTraste(dot.f);
                                                if (y === null) return null;
                                                const dotColor = getIntervalColor(dot.degreeStr);

                                                return (
                                                    <g key={idx} {...propsNotaDelMapa(dot.s, dot.f)}>
                                                        <circle
                                                            cx={x}
                                                            cy={y}
                                                            r={dotRadiusStyle}
                                                            fill={dotColor}
                                                        />
                                                        {/* La nota de tapping, marcada. `tap` existía
                                                            desde el principio y no lo leía NADIE: se
                                                            dibujaba igual que una nota pisada, así que
                                                            no había forma de saber cuál era de la mano
                                                            derecha. Aro a trazos, y el color en hex
                                                            literal porque esto se exporta (§12). */}
                                                        {dot.tap && (
                                                            <circle
                                                                cx={x}
                                                                cy={y}
                                                                r={dotRadiusStyle + 3.5}
                                                                fill="none"
                                                                stroke={dotColor}
                                                                strokeWidth="1.6"
                                                                strokeDasharray="2 2"
                                                            />
                                                        )}
                                                        <text
                                                            x={x}
                                                            y={y + 4.5}
                                                            textAnchor="middle"
                                                            fill={style.dotTextColor}
                                                            fontSize="10"
                                                            fontWeight="bold"
                                                        >
                                                            {dot.label}
                                                        </text>
                                                    </g>
                                                );
                                            })
                                        )}

                                        {/* EL RECORRIDO: las flechas que dicen en qué orden se
                                            tocan las notas.
                                            Va dentro del SVG a propósito: es OBRA, no interfaz,
                                            así que sale en el PNG y el SVG que te descargas. */}
                                        {renderNotePath()}

                                        {/* La flecha que estás trazando. Va marcada
                                            `data-transient` porque es del GESTO, no
                                            del dibujo: `svgParaExportar` la quita
                                            antes de serializar, así que un PNG sacado
                                            a media edición no se lleva el garabato. */}
                                        {arrastreFlecha && (() => {
                                            const desde = posicionEnLienzo(arrastreFlecha.desde);
                                            return (
                                                <g data-transient="1" pointerEvents="none">
                                                    <line
                                                        x1={desde.x} y1={desde.y}
                                                        x2={arrastreFlecha.hasta.x} y2={arrastreFlecha.hasta.y}
                                                        stroke={style.pathColor}
                                                        strokeWidth={lineWidthStyle}
                                                        strokeDasharray="4 3"
                                                        strokeLinecap="round"
                                                        opacity="0.6"
                                                    />
                                                    <circle
                                                        cx={arrastreFlecha.hasta.x}
                                                        cy={arrastreFlecha.hasta.y}
                                                        r="4"
                                                        fill={style.pathColor}
                                                        opacity="0.6"
                                                    />
                                                </g>
                                            );
                                        })()}

                                        {/* CHORD ONLY: Render active dots and barre chords */}
                                        {appMode === "chord" && (
                                            <g>
                                                {/* Barres (Cejillas) */}
                                                {barres.map((barre, idx) => {
                                                    const x1 = paddingLeft + barre.fromString * stringSpacing;
                                                    const x2 = paddingLeft + barre.toString * stringSpacing;
                                                    const y = yDeTraste(barre.fret);
                                                    if (y === null) return null;
                                                    return (
                                                        <g key={idx} style={{ cursor: 'pointer' }} onClick={() => removeBarre(idx)}>
                                                            {/* Base pill */}
                                                            <rect
                                                                x={x1 - dotRadiusStyle}
                                                                y={y - dotRadiusStyle}
                                                                width={(barre.toString - barre.fromString) * stringSpacing + dotRadiusStyle * 2}
                                                                height={dotRadiusStyle * 2}
                                                                rx={dotRadiusStyle}
                                                                fill={baseFingerStyleColor}
                                                                opacity={chordDisplayMode === "diagram" ? 1 : 0.4}
                                                            />
                                                            {chordDisplayMode !== "diagram" && (
                                                                Array.from({ length: barre.toString - barre.fromString + 1 }).map((_, step) => {
                                                                    const s = barre.fromString + step;
                                                                    if (dots.some(d => d.s === s)) return null; 

                                                                    const x = paddingLeft + s * stringSpacing;
                                                                    const baseSemi = parseNoteToSemi(tuning[s]);
                                                                    const absFret = startingFret + barre.fret - 1;
                                                                    const pitch = (baseSemi + absFret) % 12;

                                                                    const relativeSemi = (pitch - detectedRootSemi + 12) % 12;
                                                                    const degreeStr = INTERVAL_DEGREES[relativeSemi];

                                                                    let label = "";
                                                                    if (chordDisplayMode === "note") {
                                                                        label = NOTE_NAMES[pitch];
                                                                    } else {
                                                                        label = degreeStr;
                                                                    }

                                                                    const dotColor = getIntervalColor(degreeStr);

                                                                    return (
                                                                        <g key={step}>
                                                                            <circle cx={x} cy={y} r={dotRadiusStyle - 1} fill={dotColor} />
                                                                            <text
                                                                                x={x}
                                                                                y={y + 4}
                                                                                textAnchor="middle"
                                                                                fill={style.dotTextColor}
                                                                                fontSize="10"
                                                                                fontWeight="bold"
                                                                            >
                                                                                {label}
                                                                            </text>
                                                                        </g>
                                                                    );
                                                                })
                                                            )}
                                                        </g>
                                                    );
                                                })}

                                                {/* Standard dots */}
                                                {dots.map((dot, idx) => {
                                                    const x = paddingLeft + dot.s * stringSpacing;
                                                    const y = yDeTraste(dot.f);
                                                    if (y === null) return null;
                                                    
                                                    let label = "";
                                                    let dotColor = baseFingerStyleColor;

                                                    if (chordDisplayMode === "note" || chordDisplayMode === "degree") {
                                                        const baseSemi = parseNoteToSemi(tuning[dot.s]);
                                                        const absFret = startingFret + dot.f - 1;
                                                        const pitch = (baseSemi + absFret) % 12;
                                                        
                                                        const relativeSemi = (pitch - detectedRootSemi + 12) % 12;
                                                        const degreeStr = INTERVAL_DEGREES[relativeSemi];

                                                        if (chordDisplayMode === "note") {
                                                            label = NOTE_NAMES[pitch];
                                                        } else {
                                                            label = degreeStr;
                                                        }

                                                        dotColor = getIntervalColor(degreeStr);
                                                    }

                                                    return (
                                                        <g key={idx} style={{ cursor: 'pointer' }}>
                                                            <circle cx={x} cy={y} r={dotRadiusStyle} fill={dotColor} />
                                                            {label && (
                                                                <text
                                                                    x={x}
                                                                    y={y + 4.5}
                                                                    textAnchor="middle"
                                                                    fill={style.dotTextColor}
                                                                    fontSize="12"
                                                                    fontWeight="bold"
                                                                >
                                                                    {label}
                                                                </text>
                                                            )}
                                                        </g>
                                                    );
                                                })}
                                            </g>
                                        )}

                                        {/* Clickable Overlay Grid catcher (Active only in Chord Mode) */}
                                        {appMode === "chord" && (
                                            Array.from({ length: numStrings }).map((_, sIdx) => {
                                                return Array.from({ length: numFrets }).map((_, fIdx) => {
                                                    const fretNum = fIdx + 1;
                                                    const x = paddingLeft + sIdx * stringSpacing - stringSpacing / 2;
                                                    const y = fretYPositions[fIdx];
                                                    const fretHeight = fretYPositions[fIdx + 1] - fretYPositions[fIdx];
                                                    
                                                    const rectWidth = sIdx === 0 || sIdx === numStrings - 1 ? stringSpacing / 2 + 10 : stringSpacing;
                                                    const rectX = sIdx === 0 ? paddingLeft - 10 : x;

                                                    return (
                                                        <rect
                                                            key={`${sIdx}-${fretNum}`}
                                                            x={rectX}
                                                            y={y}
                                                            width={rectWidth}
                                                            height={fretHeight}
                                                            fill="transparent"
                                                            style={{ cursor: 'pointer' }}
                                                            onMouseDown={() => handleMouseDown(sIdx, fretNum)}
                                                            onMouseEnter={() => handleMouseEnter(sIdx, fretNum)}
                                                            onTouchStart={(e) => handleTouchStart(e, sIdx, fretNum)}
                                                        />
                                                    );
                                                });
                                            })
                                        )}
                                    </svg>

                                    <FretStepper {...propsPasoTraste} className="hidden md:flex" />

                                  </div>

                                  {/* Los mismos dos ±, en móvil, en fila y debajo del
                                      mástil: a los lados taparían las cuerdas de fuera. */}
                                  <div class="md:hidden shrink-0 w-full flex items-center justify-center gap-4">
                                      <FretStepper {...propsPasoNumTrastes} />
                                      <FretStepper {...propsPasoTraste} />
                                  </div>

                                    {/* Leyenda de colores interactivos (sólo visible en Escalas / Arpegios) */}
                                    {renderIntervalLegend()}
                                </div>

                                {/* Botón flotante de recuperación de Leyenda (aparece si la leyenda está oculta y no es modo acorde) */}
                                {!showLegend && appMode !== "chord" && appMode !== "free" && (
                                    <button
                                        onClick={() => setShowLegend(true)}
                                        class="absolute bottom-4 right-4 bg-slate-900/90 hover:bg-slate-800 text-xs font-bold py-2.5 px-4 rounded-xl border border-slate-800 shadow-xl flex items-center gap-1.5 transition-all z-20"
                                        style={{color:'var(--k-highlight)'}}
                                    >
                                        <span>Mostrar Leyenda</span>
                                    </button>
                                )}
                            </div>

                            {/* Center bottom indicator */}
                            <div class="hidden md:block text-[10px] text-indigo-400 font-extrabold select-none text-center bg-indigo-950/20 px-3 py-1 rounded-full border border-indigo-900/30">
                                Haz clic en cualquier nota para reproducir su sonido
                            </div>
                        </div>

                        {/* ===================================================== */}
                        {/* --- POPOVER: Estilo / Intervalos / Exportar --------- */}
                        {/* ===================================================== */}
                        {(openPanel === "style" || openPanel === "intervals" || openPanel === "export") && (
                        <div
                            style={{backgroundColor:'var(--k-surface)', borderColor:'rgba(var(--k-accent-rgb),0.5)'}}
                            class="absolute z-40 border flex flex-col shadow-2xl overflow-hidden inset-x-0 bottom-[4.75rem] max-h-[62vh] rounded-t-3xl md:rounded-2xl md:inset-x-auto md:left-20 md:top-4 md:bottom-4 md:max-h-none md:w-80 md:max-w-[calc(100vw-6rem)]"
                        >
                            {/* En móvil el panel es una hoja que sube desde abajo: el asa
                                lo anuncia sin necesidad de explicarlo. */}
                            <div class="k-sheet-handle md:hidden"></div>

                            {/* Panel Header */}
                            <div class="flex justify-between items-center px-4 py-3 border-b shrink-0" style={{borderColor:'rgba(var(--k-accent-rgb),0.35)', backgroundColor:'rgba(var(--k-bg-rgb),0.6)'}}>
                                <span class="text-xs font-bold uppercase tracking-wider" style={{color:'var(--k-highlight)'}}>{openPanel === "style" ? "Estilo Visual" : openPanel === "intervals" ? "Colores de Intervalos" : "Exportar"}</span>
                                <BotonCerrar onClick={() => setOpenPanel(null)} title="Cerrar el panel" className="w-11 h-11 md:w-8 md:h-8 shrink-0" />
                            </div>

                            {/* Panel Contents */}
                            <div class="flex-1 overflow-y-auto p-4 space-y-4">

                                {/* PANEL: VISUAL STYLES CONFIG */}
                                {openPanel === "style" && (
                                    <div class="space-y-4 text-xs">
                                        <div class="flex justify-between items-center mb-1">
                                            <span class="text-[11px] font-bold text-slate-300 uppercase tracking-wider">Entorno Vectorial</span>
                                            <button 
                                                onClick={resetToDefaultStyle}
                                                class="text-[9px] bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/30 px-2 py-0.5 rounded transition"
                                            >
                                                Reiniciar
                                            </button>
                                        </div>

                                        <div class="border border-slate-800 bg-slate-950/50 rounded-xl p-3 space-y-3">
                                            <div class="grid grid-cols-2 gap-2">
                                                <div>
                                                    <label class="block text-[10px] text-slate-400 mb-1">Fondo Diagrama</label>
                                                    <div class="flex items-center gap-1.5 bg-slate-900 p-1.5 rounded-lg border border-slate-800">
                                                        <input 
                                                            type="color" 
                                                            value={bgStyleColor}
                                                            onChange={(e) => setBgStyleColor(e.target.value)}
                                                            class="w-6 h-6 rounded cursor-pointer bg-transparent border-0"
                                                        />
                                                        <span class="font-mono text-[9px] text-slate-400">{bgStyleColor.toUpperCase()}</span>
                                                    </div>
                                                </div>
                                                <div>
                                                    <label class="block text-[10px] text-slate-400 mb-1">Cuerdas y Trastes</label>
                                                    <div class="flex items-center gap-1.5 bg-slate-900 p-1.5 rounded-lg border border-slate-800">
                                                        <input 
                                                            type="color" 
                                                            value={gridStyleColor}
                                                            onChange={(e) => setGridStyleColor(e.target.value)}
                                                            class="w-6 h-6 rounded cursor-pointer bg-transparent border-0"
                                                        />
                                                        <span class="font-mono text-[9px] text-slate-400">{gridStyleColor.toUpperCase()}</span>
                                                    </div>
                                                </div>
                                            </div>

                                            <div class="grid grid-cols-2 gap-2">
                                                <div>
                                                    <label class="block text-[10px] text-slate-400 mb-1">Texto & Título</label>
                                                    <div class="flex items-center gap-1.5 bg-slate-900 p-1.5 rounded-lg border border-slate-800">
                                                        <input 
                                                            type="color" 
                                                            value={textStyleColor}
                                                            onChange={(e) => setTextStyleColor(e.target.value)}
                                                            class="w-6 h-6 rounded cursor-pointer bg-transparent border-0"
                                                        />
                                                        <span class="font-mono text-[9px] text-slate-400">{textStyleColor.toUpperCase()}</span>
                                                    </div>
                                                </div>
                                                <div>
                                                    <label class="block text-[10px] text-slate-400 mb-1">Tipografía</label>
                                                    <select
                                                        value={fontFamilyStyle}
                                                        onChange={(e) => setFontFamilyStyle(e.target.value)}
                                                        class="w-full bg-slate-900 border border-slate-800 rounded-lg p-1 text-[11px] text-white focus:outline-none animate-none"
                                                    >
                                                        {FONTS_LIST.map(font => (
                                                            <option key={font.id} value={font.id}>{font.name}</option>
                                                        ))}
                                                    </select>
                                                </div>
                                            </div>
                                        </div>

                                        {/* Fretboard Sizing sliders */}
                                        <div class="border border-slate-800 bg-slate-950/50 rounded-xl p-3 space-y-3">
                                            <span class="block text-[11px] font-bold text-slate-300 uppercase tracking-wider">Espesores & Tamaños</span>
                                            
                                            <div class="space-y-1.5">
                                                <div class="flex justify-between items-center text-[10px]">
                                                    <span class="text-slate-400">Radio de Notas:</span>
                                                    <span class="text-indigo-400 font-bold">{dotRadiusStyle}px</span>
                                                </div>
                                                <input 
                                                    type="range" 
                                                    min="8" 
                                                    max="13" 
                                                    value={dotRadiusStyle}
                                                    onChange={(e) => setDotRadiusStyle(parseInt(e.target.value))}
                                                    class="w-full accent-indigo-500 bg-slate-900 h-1 rounded-lg cursor-pointer"
                                                />
                                            </div>

                                            <div class="space-y-1.5">
                                                <div class="flex justify-between items-center text-[10px]">
                                                    <span class="text-slate-400">Grosor de Cuerda:</span>
                                                    <span class="text-indigo-400 font-bold">{lineWidthStyle}px</span>
                                                </div>
                                                <input 
                                                    type="range" 
                                                    min="1" 
                                                    max="4" 
                                                    step="0.5"
                                                    value={lineWidthStyle}
                                                    onChange={(e) => setLineWidthStyle(parseFloat(e.target.value))}
                                                    class="w-full accent-indigo-500 bg-slate-900 h-1 rounded-lg cursor-pointer"
                                                />
                                            </div>
                                        </div>

                                        {/* --- LO QUE ANTES NO SE PODÍA TOCAR ---
                                            El texto de dentro del punto y el color de
                                            las flechas eran fijos. El primero, blanco,
                                            se volvía ilegible en cuanto un grado tenía
                                            un color claro, y no había forma de
                                            arreglarlo desde ningún sitio. */}
                                        <div class="border border-slate-800 bg-slate-950/50 rounded-xl p-3 space-y-3 text-xs">
                                            <span class="block text-[11px] font-bold text-slate-300 uppercase tracking-wider">Detalles de la obra</span>

                                            <div class="grid grid-cols-2 gap-2">
                                                <div class="space-y-1">
                                                    <label class="block text-slate-400">Texto en las notas</label>
                                                    <div class="flex items-center gap-2 bg-slate-900 rounded-lg p-1.5 border border-slate-800">
                                                        <input
                                                            type="color"
                                                            value={style.dotTextColor}
                                                            onChange={(e) => setDotTextColor(e.target.value)}
                                                            class="w-6 h-6 rounded cursor-pointer bg-transparent border-none p-0"
                                                        />
                                                        <span class="font-mono text-[10px] text-slate-500">{style.dotTextColor}</span>
                                                    </div>
                                                </div>
                                                <div class="space-y-1">
                                                    <label class="block text-slate-400">Flechas del recorrido</label>
                                                    <div class="flex items-center gap-2 bg-slate-900 rounded-lg p-1.5 border border-slate-800">
                                                        <input
                                                            type="color"
                                                            value={style.pathColor}
                                                            onChange={(e) => setPathColor(e.target.value)}
                                                            class="w-6 h-6 rounded cursor-pointer bg-transparent border-none p-0"
                                                        />
                                                        <span class="font-mono text-[10px] text-slate-500">{style.pathColor}</span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                        {/* --- PRESETS ---
                                            El estilo ya se guarda solo entre sesiones;
                                            esto es para tener VARIOS y saltar entre
                                            ellos: uno para pantalla, otro para
                                            imprimir, otro para el canal. */}
                                        <div class="border border-slate-800 bg-slate-950/50 rounded-xl p-3 space-y-2.5 text-xs">
                                            <span class="block text-[11px] font-bold text-slate-300 uppercase tracking-wider">Tus estilos guardados</span>

                                            {stylePresets.length === 0 ? (
                                                <p class="text-[10px]" style={{ color: 'var(--k-text-faint)' }}>
                                                    Todavía no has guardado ninguno. Ajusta el diagrama a tu gusto y ponle nombre aquí abajo.
                                                </p>
                                            ) : (
                                                <div class="flex flex-wrap gap-1">
                                                    {stylePresets.map(p => (
                                                        <span key={p.id} class="flex items-center gap-1">
                                                            <button
                                                                onClick={() => aplicarPreset(p.id)}
                                                                class="k-chip"
                                                                style={{ cursor: 'pointer' }}
                                                                title={`Aplicar «${p.name}»`}
                                                            >
                                                                {p.name}
                                                            </button>
                                                            <BotonBorrar
                                                                onClick={() => borrarPreset(p.id)}
                                                                title={`Borrar el preset «${p.name}»`}
                                                                className="py-0.5"
                                                                size="h-3 w-3"
                                                            />
                                                        </span>
                                                    ))}
                                                </div>
                                            )}

                                            <div class="flex gap-1">
                                                <input
                                                    type="text"
                                                    value={nombrePreset}
                                                    onChange={(e) => setNombrePreset(e.target.value)}
                                                    placeholder="Nombre del estilo"
                                                    class="k-field flex-1 min-w-0 px-2 py-1.5 text-xs"
                                                />
                                                <button
                                                    onClick={() => { guardarPreset(nombrePreset); setNombrePreset(""); }}
                                                    class="k-btn k-btn--primary text-[10px] px-2.5"
                                                    title="Guardar el estilo de ahora con ese nombre. Si el nombre ya existe, lo actualiza en vez de duplicarlo"
                                                >
                                                    Guardar
                                                </button>
                                            </div>
                                        </div>

                                    </div>
                                )}

                                {/* PANEL: INTERVAL COLOR MATRICES */}
                                {openPanel === "intervals" && (
                                    <div class="space-y-4">
                                        <div class="border border-slate-800 bg-slate-950/50 rounded-xl p-3 space-y-3 text-xs">
                                            <span class="block text-[11px] font-bold text-slate-300 uppercase tracking-wider">Cromaticidad de Intervalos</span>
                                            <p class="text-[10px] text-slate-400">Pinta y destaca grados armónicos sobre el mástil al visualizár en formato de notas o grados.</p>

                                            <div class="grid grid-cols-2 gap-2">
                                                <div>
                                                    <label class="block text-[10px] text-slate-400">Color Base (Dedos)</label>
                                                    <div class="flex items-center gap-1.5 bg-slate-900 p-1 rounded border border-slate-800">
                                                        <input 
                                                            type="color" 
                                                            value={baseFingerStyleColor}
                                                            onChange={(e) => setBaseFingerStyleColor(e.target.value)}
                                                            class="w-5 h-5 rounded cursor-pointer bg-transparent border-0"
                                                        />
                                                        <span class="text-[9px] text-slate-500">Dedos</span>
                                                    </div>
                                                </div>
                                                <div>
                                                    <label class="block text-[10px] text-slate-400">1ª Tónica (1)</label>
                                                    <div class="flex items-center gap-1.5 bg-slate-900 p-1 rounded border border-slate-800">
                                                        <input 
                                                            type="color" 
                                                            value={intervalColors["1"]}
                                                            onChange={(e) => setIntervalColors({...intervalColors, "1": e.target.value})}
                                                            class="w-5 h-5 rounded cursor-pointer bg-transparent border-0"
                                                        />
                                                        <span class="font-mono text-[9px] text-slate-500">{intervalColors["1"].toUpperCase()}</span>
                                                    </div>
                                                </div>
                                            </div>

                                            <div class="grid grid-cols-2 gap-2">
                                                <div>
                                                    <label class="block text-[10px] text-slate-400">2ª Segundas (b2, 2)</label>
                                                    <div class="flex items-center gap-1.5 bg-slate-900 p-1 rounded border border-slate-800">
                                                        <input 
                                                            type="color" 
                                                            value={intervalColors["2"]}
                                                            onChange={(e) => setIntervalColors({...intervalColors, "2": e.target.value})}
                                                            class="w-5 h-5 rounded cursor-pointer bg-transparent border-0"
                                                        />
                                                        <span class="font-mono text-[9px] text-slate-500">{intervalColors["2"].toUpperCase()}</span>
                                                    </div>
                                                </div>
                                                <div>
                                                    <label class="block text-[10px] text-slate-400">3ª Terceras (b3, 3)</label>
                                                    <div class="flex items-center gap-1.5 bg-slate-900 p-1 rounded border border-slate-800">
                                                        <input 
                                                            type="color" 
                                                            value={intervalColors["3"]}
                                                            onChange={(e) => setIntervalColors({...intervalColors, "3": e.target.value})}
                                                            class="w-5 h-5 rounded cursor-pointer bg-transparent border-0"
                                                        />
                                                        <span class="font-mono text-[9px] text-slate-500">{intervalColors["3"].toUpperCase()}</span>
                                                    </div>
                                                </div>
                                            </div>

                                            <div class="grid grid-cols-2 gap-2">
                                                <div>
                                                    <label class="block text-[10px] text-slate-400">4ª Cuartas (4)</label>
                                                    <div class="flex items-center gap-1.5 bg-slate-900 p-1 rounded border border-slate-800">
                                                        <input 
                                                            type="color" 
                                                            value={intervalColors["4"]}
                                                            onChange={(e) => setIntervalColors({...intervalColors, "4": e.target.value})}
                                                            class="w-5 h-5 rounded cursor-pointer bg-transparent border-0"
                                                        />
                                                        <span class="font-mono text-[9px] text-slate-500">{intervalColors["4"].toUpperCase()}</span>
                                                    </div>
                                                </div>
                                                <div>
                                                    <label class="block text-[10px] text-slate-400">5ª Quintas (b5, 5)</label>
                                                    <div class="flex items-center gap-1.5 bg-slate-900 p-1 rounded border border-slate-800">
                                                        <input 
                                                            type="color" 
                                                            value={intervalColors["5"]}
                                                            onChange={(e) => setIntervalColors({...intervalColors, "5": e.target.value})}
                                                            class="w-5 h-5 rounded cursor-pointer bg-transparent border-0"
                                                        />
                                                        <span class="font-mono text-[9px] text-slate-500">{intervalColors["5"].toUpperCase()}</span>
                                                    </div>
                                                </div>
                                            </div>

                                            <div class="grid grid-cols-2 gap-2">
                                                <div>
                                                    <label class="block text-[10px] text-slate-400">6ª Sextas (b6, 6)</label>
                                                    <div class="flex items-center gap-1.5 bg-slate-900 p-1 rounded border border-slate-800">
                                                        <input 
                                                            type="color" 
                                                            value={intervalColors["6"]}
                                                            onChange={(e) => setIntervalColors({...intervalColors, "6": e.target.value})}
                                                            class="w-5 h-5 rounded cursor-pointer bg-transparent border-0"
                                                        />
                                                        <span class="font-mono text-[9px] text-slate-500">{intervalColors["6"].toUpperCase()}</span>
                                                    </div>
                                                </div>
                                                <div>
                                                    <label class="block text-[10px] text-slate-400">7ª Séptimas (b7, 7)</label>
                                                    <div class="flex items-center gap-1.5 bg-slate-900 p-1 rounded border border-slate-800">
                                                        <input 
                                                            type="color" 
                                                            value={intervalColors["7"]}
                                                            onChange={(e) => setIntervalColors({...intervalColors, "7": e.target.value})}
                                                            class="w-5 h-5 rounded cursor-pointer bg-transparent border-0"
                                                        />
                                                        <span class="font-mono text-[9px] text-slate-500">{intervalColors["7"].toUpperCase()}</span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* PANEL: EXPORTS & ACTIONS */}
                                {openPanel === "export" && (
                                    <div class="space-y-4">
                                        
                                        <div class="border border-slate-800 bg-slate-950/50 rounded-xl p-3.5 space-y-3">
                                            <span class="block text-[11px] font-bold text-slate-300 uppercase tracking-wider">Guardado & Exportación</span>
                                            
                                            <button
                                                onClick={() => { exportPNG(); setOpenPanel(null); }}
                                                class="w-full py-2.5 px-3 rounded-lg text-xs font-bold shadow-lg transition flex items-center justify-center gap-2"
                                                style={{backgroundColor:'var(--k-accent)', color:'var(--k-highlight)'}}
                                            >
                                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                                                </svg>
                                                Descargar PNG (High-Res)
                                            </button>

                                            <button
                                                onClick={() => { exportSVG(); setOpenPanel(null); }}
                                                class="w-full py-2.5 px-3 rounded-lg text-xs font-bold shadow-lg transition flex items-center justify-center gap-2"
                                                style={{backgroundColor:'var(--k-surface-raised)', border:'1px solid var(--k-accent)', color:'var(--k-highlight)'}}
                                            >
                                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                                                </svg>
                                                Descargar SVG para Web
                                            </button>

                                            <button
                                                onClick={() => { exportSVGForIllustrator(); setOpenPanel(null); }}
                                                class="w-full py-2.5 px-3 rounded-lg text-xs font-bold shadow-lg transition flex items-center justify-center gap-2"
                                                style={{backgroundColor:'var(--k-surface)', border:'1px solid rgba(var(--k-highlight-rgb),0.3)', color:'var(--k-highlight)'}}
                                            >
                                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 4v16m8-8H4" />
                                                </svg>
                                                Descargar para Illustrator
                                            </button>
                                        </div>

                                        <div class="rounded-xl p-3 text-[11px] text-gray-400 space-y-2" style={{border:'1px solid rgba(var(--k-accent-rgb),0.3)', backgroundColor:'rgba(var(--k-bg-rgb),0.4)'}}>
                                            <span class="block font-bold text-[10px] uppercase tracking-widest" style={{color:'var(--k-highlight)'}}>Atributos del SVG</span>
                                            <div class="grid grid-cols-2 gap-1 font-mono text-[10px]">
                                                <div>Lienzo Width:</div>
                                                <div class="text-right text-gray-300">{width}px</div>
                                                <div>Lienzo Height:</div>
                                                <div class="text-right text-gray-300">{height}px</div>
                                                <div>Física Trastes:</div>
                                                <div class="text-right text-gray-300">Logarítmica</div>
                                                <div>Cuerdas:</div>
                                                <div class="text-right text-gray-300">{numStrings}</div>
                                            </div>
                                        </div>

                                    </div>
                                )}

                            </div>
                        </div>
                        )}

                    </div>
                    )}

                    {/* --- LOS MENÚS DE CLIC DERECHO ---
                        Van FUERA del SVG: son piel, no obra, así que usan el
                        sistema de diseño y no viajan en el archivo exportado.

                        Los tres montan el MISMO componente. Antes eran dos
                        copias literales de cuarenta líneas cada una, y añadir un
                        tercer menú habría sido una tercera copia. */}

                    {menuFlecha && (
                        <MenuContextual
                            x={menuFlecha.x}
                            y={menuFlecha.y}
                            titulo={`Flecha ${menuFlecha.i + 1}`}
                            onCerrar={() => setMenuFlecha(null)}
                            opciones={[
                                { label: "Eliminar esta flecha", hacer: () => quitarDestinoDeFlecha(menuFlecha.i), ayuda: "Saca del recorrido la nota a la que apunta" },
                                { label: "Cortar el recorrido aquí", hacer: () => cortarRecorridoEn(menuFlecha.i), ayuda: "El recorrido termina en esta flecha" },
                                { label: "Invertir este salto", hacer: () => invertirSaltoEn(menuFlecha.i), ayuda: "Cambia el orden de las dos notas que une" },
                                { label: "Invertir el recorrido", hacer: () => invertirRecorrido(), ayuda: "Le da la vuelta entera" },
                                { label: "Reiniciar el recorrido", hacer: () => reiniciarRecorrido(), ayuda: "Vuelve al automático" }
                            ]}
                        />
                    )}

                    {/* --- MENÚ DE UNA NOTA DEL MÁSTIL ---
                        Lo que se puede hacer con una nota concreta sin salir del
                        mástil. En Libre es además la única forma de quitar una:
                        el clic izquierdo añade al recorrido y no puede hacer las
                        dos cosas. */}
                    {menuNota && (
                        <MenuContextual
                            x={menuNota.x}
                            y={menuNota.y}
                            titulo={menuNota.nombre}
                            onCerrar={() => setMenuNota(null)}
                            opciones={[
                                {
                                    label: "Escucharla",
                                    hacer: () => playSingleNoteAudio(menuNota.s, menuNota.f),
                                    ayuda: "Suena sin tocar el recorrido"
                                },
                                {
                                    label: menuNota.enRecorrido ? "Sacar del recorrido" : "Añadir al recorrido",
                                    hacer: () => menuNota.enRecorrido
                                        ? alternarEnRecorrido(menuNota.s, menuNota.f)
                                        : anadirAlRecorrido(menuNota.s, menuNota.f),
                                    ayuda: menuNota.enRecorrido
                                        ? "Deja de tocarse, pero la nota sigue dibujada"
                                        : "Se añade al final del orden"
                                },
                                {
                                    label: "Quitar la nota",
                                    hacer: () => quitarNotaLibre(menuNota.s, menuNota.f),
                                    ayuda: "Se va del dibujo y del recorrido",
                                    desactivada: appMode !== "free",
                                    estilo: { color: 'var(--k-danger)' }
                                },
                                {
                                    label: "Reiniciar el recorrido",
                                    hacer: () => reiniciarRecorrido(),
                                    ayuda: "Vuelve al orden automático"
                                }
                            ]}
                        />
                    )}

                    {/* --- MENÚ DE UNA TRÍADA (clic derecho sobre su ficha) ---
                        Fijar una tríada y hacer algo con ella son cosas
                        distintas, así que son gestos distintos: el clic la deja
                        puesta y esto decide qué hacer con ella.

                        Mandar a Ejercicios tiene DOS lecturas y aquí están las
                        dos: el grado entero —el mapa, para recorrer el mástil— y
                        cada agrupación por separado —la forma que cabe en la
                        mano, para tocarla—. Mandando siempre el grado entero
                        salía el dibujo de la escala, que no es lo que se ve
                        cuando miras una envolvente. */}
                    {menuTriada !== null && (() => {
                        const g = triadasVisibles.find(x => x.grado === menuTriada.grado);
                        if (!g) return null;

                        const zonas = zonasDeUnGrado(g.posiciones);

                        const opciones = [
                            {
                                label: "Abrir en Arpegios",
                                ayuda: "Verla en el mástil como arpegio, en el mismo sitio",
                                hacer: () => abrirTriadaComoArpegio(g)
                            }
                        ];

                        zonas.forEach(zona => opciones.push({
                            key: "zona-" + nombreDeZona(zona),
                            label: `Sólo la agrupación ${nombreDeZona(zona)}`,
                            ayuda: `La forma compacta: ${zona.length} notas que caben en la mano`,
                            hacer: () => mandarTriadaAEjercicio(g, zona, nombreDeZona(zona))
                        }));

                        if (zonas.length > 1) opciones.push({
                            label: `Cada agrupación, un paso (${zonas.length})`,
                            ayuda: "La misma tríada, posición por posición, una detrás de otra",
                            hacer: () => mandarCadaAgrupacion(g)
                        });

                        opciones.push({
                            label: `Todo el grado (${g.posiciones.length} notas)`,
                            ayuda: "El mapa entero de ese grado en la ventana, para recorrer el mástil",
                            hacer: () => mandarTriadaAEjercicio(g, g.posiciones, "")
                        });

                        opciones.push({
                            label: "Quitar la selección",
                            ayuda: "Dejar de verla sola",
                            hacer: () => { setGradoFijado(null); setGradoTriada(null); }
                        });

                        return (
                            <MenuContextual
                                x={menuTriada.x}
                                y={menuTriada.y}
                                titulo={`${g.romano} · ${g.triada}`}
                                onCerrar={() => setMenuTriada(null)}
                                opciones={opciones}
                            />
                        );
                    })()}

                    {/* --- NOTIFICATION TOAST BAR --- */}
                    {toast.show && (
                        <div
                            style={{backgroundColor:'var(--k-surface)', border:'1px solid var(--k-accent)'}}
                            class={"fixed bottom-5 right-5 z-50 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center gap-2.5" + (toast.accion ? "" : " animate-bounce")}
                        >
                            <span class="w-2 h-2 rounded-full shrink-0" style={{backgroundColor:'var(--k-highlight)'}}></span>
                            <span class="text-xs font-semibold">{toast.message}</span>
                            {toast.accion && (
                                <button
                                    onClick={pulsarAccionDelToast}
                                    class="k-btn k-btn--outline text-xs px-3 py-1.5 ml-1 shrink-0"
                                >
                                    {toast.accion.texto}
                                </button>
                            )}
                        </div>
                    )}

                    {/* --- STUDIO FOOTER --- */}
                    <footer class="hidden md:block py-2 px-4 text-center text-gray-500 text-[10px] shrink-0 z-10" style={{backgroundColor:'var(--k-bg-deep)', borderTop:'1px solid rgba(var(--k-accent-rgb),0.5)'}}>
                        <p>© 2026 Kharo Studio. Diseñado para creadores de contenido de música y educadores.</p>
                    </footer>
                </div>
                </StyleContext.Provider>
            );
        }

        // Render the application
        const rootElement = document.getElementById("root");
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
    <script>
        // Junta los tres bloques de código y los compila de una vez.
        //
        // Se compila a mano forzando el runtime "classic" de React porque el
        // "automatic", que Babel usa por defecto, inserta un import de ES
        // Modules que un <script> normal no puede ejecutar: pantalla en blanco.
        // Si tocas esto y la app deja de aparecer, el motivo es ese.
        //
        // El orden importa: el núcleo define lo que usan los otros dos, y el
        // estudio termina montando la aplicación. Al concatenarse comparten un
        // único ámbito, así que no hay imports entre bloques.
        var bloques = ['app-source-core', 'app-source-song', 'app-source-studio'];
        var appSource = bloques
            .map(function (id) {
                var el = document.getElementById(id);
                return el ? el.textContent : '';
            })
            .join('\n');

        var compiled = Babel.transform(appSource, {
            presets: [["react", { runtime: "classic" }]]
        }).code;
        (new Function(compiled))();
    </script>
</body>
</html>
